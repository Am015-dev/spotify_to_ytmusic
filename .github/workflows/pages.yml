name: Deploy games to GitHub Pages

on:
  push:
    branches: [main, alex/brave-carson-rbpmlk]
    paths: ["games/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: games
        timeout-minutes: 15
      - uses: actions/configure-pages@v5
      - name: Stage the site without dev-only folders (smaller upload, faster publish)
        run: |
          mkdir _site
          tar -C games --exclude=./asset-viewer --exclude=./shots -cf - . | tar -C _site -xf -
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Let GitHub register the uploaded site (the first deploy used to fail instantly, costing a 45 s retry)
        run: sleep 8
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before one retry (GitHub sometimes fails to find the uploaded site on the first try)
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the last retry
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 40
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
