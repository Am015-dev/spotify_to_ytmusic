<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shardfall — War of Two Roads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9dcb8; --paper2:#dfcfa4; --paper3:#f3e9cf; --ink:#2c1e10; --ink2:#5a4630; --faded:#8a7354; --rule:#6b5537;
  --wax-f:#22407a; --wax-f2:#4468ad; --wax-s:#8f1d14; --wax-s2:#c8402c; --gold:#b8892a; --gold2:#e2bd5c;
  --free:#22407a; --throne:#8f1d14; --neutral:#cbbb90; --ash:#3a2c22; --ok:#3d6b2f; --shadow:rgba(40,25,5,.35);
  --sea:#cfc1a0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#3a2f22; --paper2:#302619; --paper3:#46392a; --ink:#efe3c6; --ink2:#d3c19b; --faded:#a48f6c; --rule:#8f7a58;
  --free:#7ea1e6; --throne:#e8664c; --neutral:#5b4d38; --ash:#120d09; --ok:#7fc063; --shadow:rgba(0,0,0,.6); --sea:#2c2419;
}}
:root[data-theme="dark"]{
  --paper:#3a2f22; --paper2:#302619; --paper3:#46392a; --ink:#efe3c6; --ink2:#d3c19b; --faded:#a48f6c; --rule:#8f7a58;
  --free:#7ea1e6; --throne:#e8664c; --neutral:#5b4d38; --ash:#120d09; --ok:#7fc063; --shadow:rgba(0,0,0,.6); --sea:#2c2419;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 "Cormorant Garamond",Georgia,serif;font-weight:500;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .1 0 0 0 .12 0'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>")}
h1,h2,h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,g.reg:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;padding:.8rem 1.4rem .6rem;border-bottom:3px double var(--rule)}
header h1{margin:0;font-size:2.3rem;font-family:"IM Fell English SC","IM Fell English",Georgia,serif}
header .sub{color:var(--ink2);font-style:italic}
header .spacer{flex:1}
.btn{border:1.5px solid var(--rule);background:var(--paper3);padding:.4rem .9rem;border-radius:3px;line-height:1.25;box-shadow:inset 0 0 0 1px var(--paper3),inset 0 0 0 2px var(--rule);font-family:"IM Fell English",Georgia,serif;font-size:.98rem}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper3);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),inset 0 0 0 2px var(--paper3)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:1.1rem;padding:1rem 1.4rem;max-width:1520px;margin:0 auto}
@media (max-width:980px){.wrap{grid-template-columns:1fr;padding:.6rem}}
.board{min-width:0}
#map{width:100%;height:auto;display:block;border:2px solid var(--rule);outline:1px solid var(--rule);outline-offset:4px;box-shadow:0 8px 30px var(--shadow)}
.side{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.box{background:var(--paper3);border:1.5px solid var(--rule);outline:1px solid var(--rule);outline-offset:3px;padding:.75rem .9rem;margin:4px}
.box h3{margin:0 0 .35rem;font-size:1.25rem;border-bottom:1px solid var(--rule);padding-bottom:.15rem}
.box h3::before{content:"❧ ";color:var(--faded)}
.muted{color:var(--faded)} .small{font-size:.9rem}
#prompt.F .who{color:var(--free)} #prompt.S .who{color:var(--throne)}
#prompt .who{font-family:"IM Fell English SC","IM Fell English",Georgia,serif;font-size:1.45rem}
.acts{display:flex;flex-direction:column;gap:.35rem;margin-top:.5rem}
.acts .btn{text-align:left;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}
.acts .btn small{display:block;color:var(--ink2);font-size:.82rem;font-weight:500}
.dicerow{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:.3rem 0 .55rem}
.dicerow .lbl{width:4.8rem;font-family:"IM Fell English",Georgia,serif}
.die{width:54px;height:54px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;box-shadow:inset 0 0 0 2px var(--paper3),inset 0 0 0 3px var(--rule)}
.die .g{font-size:1.35rem} .die .t{font-size:.62rem;margin-top:3px;color:var(--ink2);font-family:"IM Fell English",Georgia,serif}
.die.F .g{color:var(--free)} .die.S .g{color:var(--throne)}
.die.used{opacity:.3;cursor:default;background:var(--paper2)} .die.hunt{border-style:dashed;cursor:default;opacity:.85}
.die.sel{box-shadow:inset 0 0 0 2px var(--paper3),inset 0 0 0 3px var(--rule),0 0 0 3px var(--gold)}
.tracks{display:grid;gap:.55rem;margin-top:.9rem}
.track{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.track .name{width:6.2rem;font-family:"IM Fell English",Georgia,serif;font-size:1.1rem}
.cells{display:flex;gap:3px;flex-wrap:wrap}
.cell{width:30px;height:30px;border:1px solid var(--rule);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--ink2);font-family:"IM Fell English",Georgia,serif}
.cell.ash{background:var(--ash);color:#d8c6a2;border-color:#1c1410}
.cell.here{background:var(--gold2);color:#2c1e10;font-weight:700;border-color:var(--gold);border-radius:50%;box-shadow:0 1px 2px var(--shadow)}
.cell.taint{background:var(--wax-s2);border-color:var(--wax-s);color:#fff}
.cell.forge{border:2px solid var(--throne)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--rule);border-radius:2px;padding:.05rem .55rem;font-size:.88rem;background:var(--paper)}
.chip.warn{border-color:var(--throne);color:var(--throne)} .chip.F{color:var(--free)} .chip.S{color:var(--throne)}
.hand{display:flex;flex-direction:column;gap:.5rem}
.card{border:1.5px solid var(--rule);padding:.45rem .65rem;background:var(--paper);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--rule)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.card .nm{font-family:"IM Fell English",Georgia,serif;font-size:1.15rem}
.card .ty{font-size:.75rem;color:var(--ink2);white-space:nowrap;font-style:italic}
.card p{margin:.2rem 0 .4rem;font-size:.92rem}
.nat{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;font-size:.95rem}
#log{max-height:240px;overflow:auto}
#log div{font-size:.9rem;padding:.12rem 0;border-bottom:1px dotted var(--rule)}
#log .F{color:var(--free)} #log .S{color:var(--throne)} #log .N{font-family:"IM Fell English",Georgia,serif;color:var(--faded)}
.modal{position:fixed;inset:0;background:rgba(30,20,8,.62);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:10}
.modal.hidden{display:none}
.dlg{background:var(--paper3);border:2px solid var(--rule);outline:1px solid var(--rule);outline-offset:4px;max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:1.2rem 1.35rem;box-shadow:0 24px 60px var(--shadow)}
.dlg h2{margin:0 0 .4rem;font-size:1.8rem;font-family:"IM Fell English SC","IM Fell English",Georgia,serif}
.dlg .acts .btn{padding:.55rem .8rem}
.rules h3{margin:1rem 0 .2rem;font-size:1.2rem} .rules p,.rules li{font-size:1rem;max-width:68ch}
g.reg.pickable{cursor:pointer}
g.reg.pickable .ring{stroke:var(--gold);stroke-width:5;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.3}}
.legend{display:grid;grid-template-columns:auto 1fr;gap:.3rem .6rem;font-size:.9rem;align-items:center}
.legend svg{width:38px;height:38px;display:block}
details summary{cursor:pointer;font-family:"IM Fell English",Georgia,serif;font-size:1.25rem}
.win{font-size:1.6rem}
.inspect{margin-top:.5rem;padding-top:.5rem;border-top:1px dotted var(--rule);font-size:.92rem}
.coach{border:2px solid var(--gold);background:var(--paper3)}
.coach h3{color:var(--gold)}
.hl{box-shadow:0 0 0 3px var(--gold)!important}
.rolls{display:grid;gap:.8rem;margin:.5rem 0}
.rollrow{padding:.55rem .7rem;border:1px solid var(--rule);background:var(--paper)}
.rollrow.F{border-left:5px solid var(--free)} .rollrow.S{border-left:5px solid var(--throne)}
.rollrow .lbl{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:.35rem}
.dset{display:flex;flex-wrap:wrap;gap:.35rem}
.d6{width:40px;height:40px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.25rem;box-shadow:inset 0 0 0 2px var(--paper3),inset 0 0 0 3px var(--rule)}
.d6.spin{animation:spin .12s linear infinite}
@keyframes spin{50%{transform:rotate(12deg) scale(1.05)}}
.d6.hit{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:none}
.d6.rr{border-style:dashed}
.d6.tile{width:64px;height:64px;font-size:1.5rem;border-color:var(--throne);background:var(--ash);color:#f2e6cf;box-shadow:none}
.outcome{font-family:"IM Fell English",Georgia,serif;font-size:1.3rem;margin:.4rem 0}
@media (prefers-reduced-motion:reduce){.d6.spin{animation:none}g.reg.pickable .ring{animation:none}}

.pol{display:grid;grid-template-columns:1fr auto;gap:.3rem .6rem;font-size:.95rem;align-items:center}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:15px;height:15px;border:1px solid var(--rule);background:var(--paper)}
.pip.on{background:var(--ink2)} .pip.war{background:var(--wax-s2);border-color:var(--wax-s)}
.tag{font-size:.75rem;font-style:italic;color:var(--gold)}
.cell.mord{background:var(--ash);color:#d8c6a2;border-color:#1c1410}
.chip.dead{text-decoration:line-through;opacity:.6}
.deck{font-size:.72rem;border:1px solid var(--rule);padding:0 .35rem;margin-left:.3rem}
.combat{font-size:.82rem;font-style:italic;color:var(--ink2);border-top:1px dotted var(--rule);padding-top:.2rem;margin-top:.2rem}
</style>
</head>
<body>
<header>
  <h1>Shardfall</h1>
  <span class="sub">A war of two roads: the hidden Fellowship, and the armies of the west.</span>
  <span class="spacer"></span>
  <button class="btn" id="bTour">Guided tour</button>
  <button class="btn" id="bRules">Rules</button>
  <button class="btn" id="bNew">New game</button>
</header>
<main class="wrap">
  <section class="board">
    <svg id="map" viewBox="0 0 1000 660" role="img" aria-label="Game map"></svg>
    <div class="tracks box" id="tracks"></div>
  </section>
  <aside class="side">
    <div id="coach" class="box coach" style="display:none"></div>
    <div id="prompt" class="box"></div>
    <div id="dice" class="box"></div>
    <div id="hand" class="box"></div>
    <div id="nations" class="box"></div>
    <div class="box"><details><summary>Map legend</summary><div class="legend" id="legend"></div></details></div>
    <div class="box"><h3>Chronicle</h3><div id="log"></div></div>
  </aside>
</main>
<div id="modal" class="modal hidden"></div>
<script>
/* ======================= DATA ======================= */
const MORDOR=6,MAXC=12,VP_S=10,VP_F=5,SAVE='shardfall-v3',TOUR='shardfall-tour3';
var ANIM=1,AIDELAY=650;
const RAND=n=>Math.floor(Math.random()*n),d6=()=>1+RAND(6);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=RAND(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const SIDES={F:{name:'Free Realms',long:'The Free Realms'},S:{name:'Throne',long:'The Ashen Throne'}};
const NATIONS={
  north:{name:'Northmarch',side:'F'},sylvan:{name:'Sylvan Realms',side:'F'},stonekin:{name:'Stonekin',side:'F'},
  riders:{name:'Plainsriders',side:'F'},aldmere:{name:'Aldmere',side:'F'},
  ironspire:{name:'Iron Spire',side:'S'},ashen:{name:'Ashen Throne',side:'S'},south:{name:'Southern Hordes',side:'S'},
};
const R=[
 ['greyhaven','Greyhaven','sylvan','fort',55,215],['hearthdale','Hearthdale','north','city',150,165],['northdowns','Northdowns','north',null,210,75],
 ['bramble','Bramblefield','north',null,255,215],['silverglen','Silverglen','sylvan','fort',360,140],['mirefang','Mirefang','ashen','fort',470,62],
 ['highpass','High Pass',null,null,460,150],['thornhall','Thornhall','sylvan','fort',610,95],['dalemark','Dalemark','north','city',760,80],
 ['deephold','Deephold','stonekin','fort',855,62],['irongate','Irongate','stonekin','city',925,135],['dunmoor','Dunmoor','ironspire','city',160,330],
 ['mistpass','Mistgate',null,null,340,275],['wildmoor','Wildmoor',null,null,470,250],['blackspire','Blackspire','ashen','fort',600,225],
 ['fenmoor','Fenmoor',null,null,720,185],['eastfields','Eastfields',null,null,840,250],['rhunhold','Rhunhold','south','fort',920,315],
 ['ironspire','Ironspire','ironspire','fort',270,395],['mistwood','Mistwood','sylvan','fort',500,345],['brownlands','Brownlands',null,null,665,315],
 ['deadfields','Deadfields',null,null,725,392],['morrowgate','Morrowgate','ashen','fort',815,380],['ashplain','Ashplain','ashen',null,885,445],
 ['goldhall','Goldhall','riders','city',400,455],['riderplain','Riderplain','riders',null,525,445],['horsemere','Horsemere','riders','fort',280,505],
 ['highcrown','Highcrown','aldmere','fort',625,500],['osgate','Osgate','aldmere',null,715,462],['shadegate','Shadegate','ashen','fort',800,540],
 ['cinderhold','Cinderhold','ashen','fort',925,515],['westshore','Westshore','aldmere',null,235,605],['seahaven','Seahaven','aldmere','fort',390,610],
 ['harrowby','Harrowby','aldmere','city',545,600],['nearsand','Nearsand','south','city',700,605],['sunward','Sunward','south','fort',865,600],
].map(([id,name,nation,set,x,y])=>({id,name,nation,set,x,y}));
const REG=Object.fromEntries(R.map(r=>[r.id,r]));
const EDGES=`greyhaven-hearthdale greyhaven-dunmoor hearthdale-northdowns hearthdale-bramble northdowns-bramble bramble-silverglen bramble-dunmoor bramble-mistpass silverglen-highpass silverglen-mistpass highpass-mirefang highpass-wildmoor mirefang-thornhall thornhall-wildmoor thornhall-blackspire thornhall-dalemark thornhall-fenmoor dalemark-deephold dalemark-fenmoor deephold-irongate irongate-eastfields irongate-rhunhold dunmoor-mistpass dunmoor-ironspire mistpass-wildmoor mistpass-ironspire wildmoor-mistwood wildmoor-blackspire blackspire-mistwood blackspire-fenmoor blackspire-brownlands fenmoor-eastfields fenmoor-brownlands eastfields-rhunhold eastfields-brownlands eastfields-deadfields rhunhold-ashplain ironspire-horsemere ironspire-goldhall mistwood-riderplain mistwood-brownlands brownlands-deadfields brownlands-riderplain deadfields-riderplain deadfields-morrowgate deadfields-osgate morrowgate-ashplain ashplain-cinderhold ashplain-shadegate shadegate-cinderhold shadegate-osgate shadegate-nearsand goldhall-horsemere goldhall-riderplain goldhall-westshore riderplain-highcrown horsemere-westshore highcrown-osgate highcrown-harrowby highcrown-seahaven westshore-seahaven seahaven-harrowby harrowby-osgate harrowby-nearsand harrowby-sunward nearsand-sunward`.split(' ').map(e=>e.split('-'));
const ADJ={};R.forEach(r=>ADJ[r.id]=[]);EDGES.forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a)});
const GATES=['morrowgate','shadegate'];
const COMPS={
  aldric:{name:'Aldric',role:'Heir of Highcrown',lvl:3,lead:2,nat:['aldmere','riders'],guide:'Guide: the Fellowship may hide with any die.'},
  tamsin:{name:'Tamsin',role:'Grey Loremaster',lvl:3,lead:1,nat:'any',guide:'Guide: Eye tiles deal 1 less damage (never below 1).'},
  veyra:{name:'Veyra',role:'Sylvan Archer',lvl:2,lead:1,nat:['sylvan'],guide:'Guide: the Hunt gets no rerolls from the region.'},
  hollis:{name:'Hollis',role:'Stonekin Axe',lvl:2,lead:1,nat:['stonekin'],guide:'Guide: casualties absorb 1 extra damage.'},
  corran:{name:'Corran',role:'Captain of Aldmere',lvl:2,lead:1,nat:['aldmere']},
  kettle:{name:'Kettle',role:'Hearthdale Scout',lvl:1,lead:1,nat:['north'],guide:'Guide: the first reveal each turn is ignored.'},
  pip:{name:'Pip',role:'Hearthdale Scout',lvl:1,lead:1,nat:['north']},
};
const WRETCH={name:'The Wretch',guide:'Guide (when no Wardens remain): reveals are ignored and the Fellowship hides with any die.'};
const LEADV={l:1,w:1,tyrant:1,ashking:2,herald:2};
const MINIONS={tyrant:{name:'The White Tyrant',txt:'Iron Spire at war. Stays in Ironspire. +1 die; lets Muster dice forge elites.'},ashking:{name:'The Ashen King',txt:'Ashen Throne and a Free nation at war. Flies like a Wraith, leadership 2. +1 die.'},herald:{name:'The Pale Herald',txt:'Ashen Throne at war, and the Fellowship in Mordor or two Free nations at war. Leadership 2. +1 die.'}};
const FF=['C','C','AM','M','E','W'],SF=['H','C','A','AM','M','E'];
const FACE={C:['♞','Character'],A:['⚔','Army'],M:['⚑','Muster'],AM:['⚔⚑','Army/Muster'],E:['✦','Event'],W:['☀','Will'],H:['◉','Eye']};
const TILES=()=>[{v:'E',r:1},{v:'E',r:1},{v:'E',r:1},{v:'E',r:1},{v:3},{v:3,r:1},{v:2},{v:2,r:1},{v:2,r:1},{v:1},{v:1},{v:1,r:1},{v:1,r:1},{v:0},{v:3},{v:0,r:1}];
const DARK=()=>[{v:'X'},{v:'X'},{v:'X'},{v:3,r:1}];

/* ======================= HELPERS ======================= */
let G=null;const UI={pick:null,choice:null,sel:null,focus:null,roll:null,info:false,coach:null,acts:[],busy:false};
const other=s=>s==='F'?'S':'F';
const isC=u=>u.t==='r'||u.t==='e';
const combat=rid=>G.units[rid].filter(isC).length;
const cnt=(rid,t)=>G.units[rid].filter(u=>u.t===t).length;
const owner=rid=>G.units[rid].length?NATIONS[G.units[rid][0].n].side:null;
const compLead=id=>id==='aldric'&&G.up.aldric?3:id==='tamsin'&&G.up.tamsin?2:COMPS[id].lead;
const lead=rid=>G.units[rid].reduce((a,u)=>a+(LEADV[u.t]||0),0)+(owner(rid)==='F'?G.comps[rid].reduce((a,id)=>a+compLead(id),0):0);
const atWar=n=>G.pol[n].step===0;
const vpOf=rid=>REG[rid].set==='fort'?2:REG[rid].set==='city'?1:0;
const homeSide=rid=>REG[rid].nation?NATIONS[REG[rid].nation].side:null;
const held=(rid,s)=>!!REG[rid].set&&G.ctrl[rid]===s;
const unused=s=>G.dice[s].filter(d=>!d.used).length;
const isHuman=s=>G.mode==='hot'||G.mode===s;
const minionsOn=()=>Object.keys(MINIONS).filter(m=>R.some(r=>cnt(r.id,m)));
const wraiths=()=>R.reduce((a,r)=>a+cnt(r.id,'w'),0);
const diceCount=s=>s==='F'?4+(G.up.aldric?1:0)+(G.up.tamsin?1:0):7+minionsOn().length;
const fNations=()=>Object.keys(NATIONS).filter(n=>NATIONS[n].side==='F');
const guideName=()=>G.f.guide==='wretch'?WRETCH.name:COMPS[G.f.guide].name;
function vp(s){return R.filter(r=>r.set&&homeSide(r.id)!==s&&G.ctrl[r.id]===s).reduce((a,r)=>a+vpOf(r.id),0)}
function log(s,t){G.log.unshift({s,t});if(G.log.length>200)G.log.length=200}
function add(rid,n,t,k){for(let i=0;i<k;i++){if((t==='r'||t==='e')&&combat(rid)>=10)break;G.units[rid].push({n,t})}}
function natFor(rid,s){const u=G.units[rid].find(isC);if(u)return u.n;const n=REG[rid].nation;if(n&&NATIONS[n].side===s)return n;return s==='F'?'aldmere':'ashen'}
function addCorr(n){G.f.corr=Math.min(MAXC,G.f.corr+n)}
function heal(n){G.f.corr=Math.max(0,G.f.corr-n)}
function bfs(from){const d={[from]:0},p={},q=[from];while(q.length){const c=q.shift();for(const n of ADJ[c])if(d[n]==null){d[n]=d[c]+1;p[n]=c;q.push(n)}}return{d,p}}
function pathTo(from,to){const{p}=bfs(from);const path=[to];while(path[0]!==from)path.unshift(p[path[0]]);return path}
function within(from,k){const{d}=bfs(from);return R.filter(r=>d[r.id]<=k).map(r=>r.id)}
function gatePath(from){let best=null;GATES.forEach(g=>{const p=pathTo(from,g);if(!best||p.length<best.length)best=p});return best}
function distMap(target){const d={},q=[];R.forEach(r=>{if(target(r.id)){d[r.id]=0;q.push(r.id)}});while(q.length){const c=q.shift();for(const n of ADJ[c])if(d[n]==null){d[n]=d[c]+1;q.push(n)}}R.forEach(r=>{if(d[r.id]==null)d[r.id]=99});return d}
function strength(rid){const c=combat(rid),e=cnt(rid,'e');return Math.min(5,c)+e*0.45+Math.min(lead(rid),Math.min(5,c))*0.4+Math.max(0,c-5)*0.4}
function threat(rid){if(!held(rid,'F')||owner(rid)==='S')return 0;const mine=owner(rid)==='F'?strength(rid):0;const m=ADJ[rid].reduce((a,x)=>owner(x)==='S'&&combat(x)>0?Math.max(a,strength(x)):a,0);return m-mine*(REG[rid].set==='fort'?1.5:1.1)}
function sThreat(rid){if(!held(rid,'S')||owner(rid)==='F')return 0;const mine=owner(rid)==='S'?strength(rid):0;const m=ADJ[rid].reduce((a,x)=>owner(x)==='F'&&combat(x)>0?Math.max(a,strength(x)):a,0);return m-mine*(REG[rid].set==='fort'?1.5:1.1)}

/* ======================= POLITICS ======================= */
function rouse(n,step){if(!n)return;const p=G.pol[n],N=NATIONS[n];if(!p.active){p.active=true;log(N.side,`${N.name} is roused.`)}if(step&&p.step>0){p.step--;log(N.side,p.step===0?`${N.name} goes to war!`:`${N.name} moves toward war (${p.step} to go).`)}}
function canAdvance(n){const p=G.pol[n];return p.step>1||(p.step===1&&p.active)}
function advance(n){G.pol[n].step--;const N=NATIONS[n];log(N.side,G.pol[n].step===0?`${N.name} goes to war!`:`${N.name} moves toward war (${G.pol[n].step} to go).`)}
function diploTargets(s){return Object.keys(NATIONS).filter(n=>NATIONS[n].side===s&&canAdvance(n))}

/* ======================= CARDS HELPERS ======================= */
function drawCard(s,deck){if(!G.decks[s][deck].length){G.decks[s][deck]=shuffle(G.disc[s][deck]);G.disc[s][deck]=[]}if(!G.decks[s][deck].length)return false;G.hands[s].push(G.decks[s][deck].pop());if(G.hands[s].length>6){const k=G.hands[s].shift();discard(s,k);log(s,`Hand full: “${CARDS[k].name}” discarded.`)}return true}
function discard(s,k){G.disc[s][CARDS[k].deck].push(k)}
function drawTile(){if(!G.tiles.length){G.tiles=shuffle(G.used);G.used=[]}const t=G.tiles.pop();G.used.push(t);return t}

/* ======================= UNITS & MOVEMENT ======================= */
function relocateFlyer(u){const spots=R.filter(r=>r.nation==='ashen'&&r.set==='fort'&&G.ctrl[r.id]==='S'&&owner(r.id)!=='F').map(r=>r.id);const dest=spots.includes('cinderhold')?'cinderhold':spots[0];if(dest){G.units[dest].push({n:'ashen',t:u.t});log('S',`${u.t==='w'?'A Wraith':'The Ashen King'} flees to ${REG[dest].name}.`)}else log('F',`${u.t==='w'?'A Wraith':'The Ashen King'} is banished.`)}
function eliminateComp(id,where){G.f.band=G.f.band.filter(x=>x!==id);R.forEach(r=>G.comps[r.id]=G.comps[r.id].filter(x=>x!==id));if(!G.f.dead.includes(id))G.f.dead.push(id);if(id==='aldric')G.up.aldric=false;if(id==='tamsin'&&G.up.tamsin){G.up.tamsin=false;G.tamsinGone=true}if(G.f.guide===id||!G.f.band.includes(G.f.guide))G.f.guide=bestGuide();log('F',`${COMPS[id].name} is slain${where?(/^(on|by) /.test(where)?' '+where:' at '+where):''}.`)}
function bestGuide(){const b=G.f.band;if(!b.length)return 'wretch';return b.slice().sort((a,c)=>COMPS[c].lvl-COMPS[a].lvl)[0]}
function wipe(rid){const us=G.units[rid];G.units[rid]=[];us.forEach(u=>{if(u.t==='w'||u.t==='ashking')relocateFlyer(u);else if(u.t==='tyrant'||u.t==='herald'){G.minionDead[u.t]=true;log('F',`${MINIONS[u.t].name} is slain!`)}else if(u.t==='l')log(NATIONS[u.n].side,`A leader falls at ${REG[rid].name}.`)});[...G.comps[rid]].forEach(id=>eliminateComp(id,REG[rid].name))}
function applyHits(rid,n){let k=0;for(let i=0;i<n;i++){const us=G.units[rid];let j=us.findIndex(u=>u.t==='r');if(j>=0){us.splice(j,1);k++;continue}j=us.findIndex(u=>u.t==='e');if(j>=0){us[j].t='r';k++;continue}break}if(combat(rid)===0&&(G.units[rid].length||G.comps[rid].length))wipe(rid);return k}
function fleeComps(rid){if(!G.comps[rid].length)return;const{d}=bfs(rid);const dest=R.filter(r=>r.id!==rid&&owner(r.id)!=='S'&&homeSide(r.id)==='F').sort((a,b)=>d[a.id]-d[b.id])[0];if(dest){log('F',`${G.comps[rid].map(id=>COMPS[id].name).join(', ')} slip away to ${dest.name}.`);G.comps[dest.id].push(...G.comps[rid])}G.comps[rid]=[]}
function onEnter(to,me){
  if(REG[to].set&&G.ctrl[to]!==me){const home=homeSide(to);G.ctrl[to]=me;log(me,home===me?`${SIDES[me].name} retakes ${REG[to].name}!`:`${SIDES[me].name} captures ${REG[to].name} (+${vpOf(to)} VP).`);if(home!==me)rouse(REG[to].nation,true)}
  if(me==='S'){const n=REG[to].nation;if(n&&NATIONS[n].side==='F')rouse(n,false);fleeComps(to)}
}
function moveUnits(from,to,n){
  const me=owner(from),o=owner(to);
  if(o&&o!==me&&combat(to)===0){const us=G.units[to];G.units[to]=[];us.forEach(u=>{if(u.t==='w'||u.t==='ashking')relocateFlyer(u);else if(u.t==='tyrant'||u.t==='herald'){G.minionDead[u.t]=true;log('F',`${MINIONS[u.t].name} is caught and slain!`)}})}
  const us=G.units[from];
  const cmb=us.filter(isC).sort((a,b)=>(b.t==='e')-(a.t==='e')).slice(0,n);
  const lds=us.filter(u=>!isC(u)&&u.t!=='tyrant');
  G.units[from]=us.filter(u=>!cmb.includes(u)&&!lds.includes(u));
  G.units[to].push(...cmb,...lds);
  if(me==='F'){G.comps[to].push(...G.comps[from]);G.comps[from]=[]}
  log(me,`${SIDES[me].name} marches ${n} from ${REG[from].name} to ${REG[to].name}.`);
  onEnter(to,me);
}
function canLeave(from,to){return G.units[from].filter(isC).every(u=>atWar(u.n)||REG[to].nation===u.n)}
function canAttack(from){return G.units[from].filter(isC).every(u=>atWar(u.n))}
function destOk(from,to,atk,me){const o=owner(to);if(o&&o!==me&&combat(to)>0)return atk&&canAttack(from);return canLeave(from,to)&&combat(to)<10}
function hasLeader(rid,me){return me==='F'?(cnt(rid,'l')+G.comps[rid].length)>0:(cnt(rid,'w')+cnt(rid,'ashking')+cnt(rid,'herald')+cnt(rid,'tyrant'))>0}
function armyCan(rid,me,ld,atk,skip){return owner(rid)===me&&combat(rid)>0&&!(skip&&skip.has(rid))&&(!ld||hasLeader(rid,me))&&ADJ[rid].some(t=>destOk(rid,t,atk,me))}
function recruitTargets(s){return R.filter(r=>r.set&&homeSide(r.id)===s&&G.ctrl[r.id]===s&&atWar(r.nation)&&owner(r.id)!==other(s)&&combat(r.id)<10).map(r=>r.id)}
function recruitKinds(s,rid){const k=[],room=10-combat(rid);if(room>=2)k.push(['rr','2 regulars']);k.push(['e','1 elite']);if(s==='F')k.push(['rl','1 regular and 1 leader']);if(s==='S'&&REG[rid].nation==='ashen'&&REG[rid].set==='fort'&&wraiths()<6)k.push(['rw','1 regular and 1 Wraith']);return k}
function recruit(rid,kind,s){const n=REG[rid].nation;if(kind==='rr')add(rid,n,'r',2);if(kind==='e')add(rid,n,'e',1);if(kind==='rl'){add(rid,n,'r',1);add(rid,n,'l',1)}if(kind==='rw'){add(rid,n,'r',1);G.units[rid].push({n:'ashen',t:'w'})}log(s,`${SIDES[s].name} musters ${({rr:'2 regulars',e:'an elite',rl:'a regular and a leader',rw:'a regular and a Wraith'})[kind]} at ${REG[rid].name}.`)}
function minionOk(m){if(minionsOn().includes(m)||G.minionDead[m])return false;const fw=fNations().filter(atWar).length;
  if(m==='tyrant')return atWar('ironspire')&&G.ctrl.ironspire==='S'&&owner('ironspire')!=='F';
  if(m==='ashking')return atWar('ashen')&&fw>=1&&minionSpots(m).length>0;
  return atWar('ashen')&&(G.f.mordor>=0||fw>=2)&&minionSpots(m).length>0}
function minionSpots(m){if(m==='tyrant')return['ironspire'];if(m==='ashking')return R.filter(r=>owner(r.id)==='S'&&combat(r.id)>0).map(r=>r.id);return R.filter(r=>r.nation==='ashen'&&r.set==='fort'&&G.ctrl[r.id]==='S'&&owner(r.id)!=='F').map(r=>r.id)}
function placeMinion(m,rid){G.units[rid].push({n:m==='tyrant'?'ironspire':'ashen',t:m});log('S',`${MINIONS[m].name} enters the war at ${REG[rid].name}! The Throne gains a die.`)}
function wraithDests(){return R.filter(r=>!(held(r.id,'F')&&REG[r.id].set==='fort')&&!(owner(r.id)==='F'&&combat(r.id)>0)).map(r=>r.id)}
function flyGroup(from,to){const us=G.units[from];const fl=us.filter(u=>u.t==='w'||u.t==='ashking');G.units[from]=us.filter(u=>!fl.includes(u));G.units[to].push(...fl);log('S',`${fl.length} Wraith${fl.length>1?'s':''} fl${fl.length>1?'y':'ies'} from ${REG[from].name} to ${REG[to].name}.`)}
function flyerSources(){return R.filter(r=>cnt(r.id,'w')+cnt(r.id,'ashking')>0).map(r=>r.id)}

/* ======================= FELLOWSHIP ======================= */
function declare(rid,voluntary){const f=G.f;const d=bfs(f.loc).d[rid];f.loc=rid;f.prog=0;log('F',voluntary?`The Fellowship declares itself at ${REG[rid].name}.`:`The Fellowship is seen at ${REG[rid].name}.`);
  if(voluntary&&REG[rid].set&&homeSide(rid)==='F'&&G.ctrl[rid]==='F'&&owner(rid)!=='S'){if(f.corr>0){heal(1);log('F',`Rest at ${REG[rid].name}: Wren heals 1 Corruption.`)}rouse(REG[rid].nation,false)}}
function enterMordor(){const f=G.f;f.mordor=0;f.prog=0;G.tiles=shuffle(G.tiles.concat(DARK()));log('F','The Fellowship enters the Ashlands of Mordor! Every step now draws a Hunt tile.')}
function sepTargets(id){if(G.f.mordor>=0)return[];return within(G.f.loc,G.f.prog+COMPS[id].lvl).filter(r=>owner(r)!=='S')}
function arrival(id,rid){const n=REG[rid].nation;if(n&&NATIONS[n].side==='F'&&REG[rid].set&&G.ctrl[rid]==='F'&&(COMPS[id].nat==='any'||COMPS[id].nat.includes(n)))rouse(n,false)}
function separate(id,rid){G.f.band=G.f.band.filter(x=>x!==id);G.comps[rid].push(id);if(G.f.guide===id)G.f.guide=bestGuide();log('F',`${COMPS[id].name} leaves the Fellowship for ${REG[rid].name}.`);arrival(id,rid)}
function compMoveTargets(from){const k=Math.min(...G.comps[from].map(id=>COMPS[id].lvl));return within(from,k).filter(r=>r!==from&&owner(r)!=='S')}
function moveComps(from,to){const g=G.comps[from];G.comps[from]=[];G.comps[to].push(...g);log('F',`${g.map(id=>COMPS[id].name).join(', ')} travel${g.length>1?'':'s'} to ${REG[to].name}.`);g.forEach(id=>arrival(id,to))}
function canCrown(){return !G.up.aldric&&G.comps.highcrown.includes('aldric')&&G.ctrl.highcrown==='F'&&atWar('aldmere')}
function crown(){G.up.aldric=true;log('F','Aldric is crowned King of Highcrown! The Free Realms gain a die, and his leadership rises to 3.')}
function canRadiant(){return !G.up.tamsin&&!G.tamsinGone&&(G.f.dead.includes('tamsin')||minionsOn().length>0)&&radiantSpots().length>0}
function radiantSpots(){return R.filter(r=>r.set==='fort'&&homeSide(r.id)==='F'&&G.ctrl[r.id]==='F'&&owner(r.id)!=='S').map(r=>r.id)}
function radiant(rid){G.f.band=G.f.band.filter(x=>x!=='tamsin');G.f.dead=G.f.dead.filter(x=>x!=='tamsin');R.forEach(r=>G.comps[r.id]=G.comps[r.id].filter(x=>x!=='tamsin'));G.comps[rid].push('tamsin');G.up.tamsin=true;if(G.f.guide==='tamsin')G.f.guide=bestGuide();log('F',`Tamsin returns as the Radiant at ${REG[rid].name}! The Free Realms gain a die.`)}
function hideAny(){return (G.f.guide==='aldric'&&G.f.band.includes('aldric'))||G.f.guide==='wretch'}
function huntRerolls(){const f=G.f,loc=f.loc;if(f.guide==='veyra'&&f.band.includes('veyra'))return 0;let r=0;if(owner(loc)==='S'&&combat(loc)>0)r++;if(cnt(loc,'w')+cnt(loc,'ashking')>0)r++;if(REG[loc].set&&G.ctrl[loc]==='S')r++;return r}
function rollHits(n,need,rer){const a=Array.from({length:Math.max(0,n)},d6);let hits=a.filter(x=>x>=need).length;const rr=Math.min(rer,a.length-hits);const b=Array.from({length:rr},d6);hits+=b.filter(x=>x>=need).length;return{a,b,hits}}
function fellowshipMove(done){
  const f=G.f;f.moves++;
  if(f.mordor>=0){f.mordor++;log('F',`The Fellowship climbs to step ${f.mordor} of ${MORDOR} in Mordor.`);if(f.mordor>=MORDOR){done();return}resolveTile(drawTile(),0,done);return}
  f.prog++;
  const n=Math.min(5,G.huntBox);let need=Math.max(2,7-f.moves);if(G.warn)need=Math.min(6,need+1);
  const rer=huntRerolls();const H=rollHits(n,need,Math.min(rer,n));let succ=H.hits;const snare=G.snare&&succ===0;if(snare)succ=1;if(G.snare)G.snare=false;
  log('F',`The Fellowship moves on in secret (progress ${f.prog}).`);
  if(!n&&!snare){log('S','The Hunt box is empty; the Fellowship passes unseen.');done();return}
  log('S',`Hunt roll [${H.a.join(' ')}${H.b.length?' | reroll '+H.b.join(' '):''}] needing ${need}+: ${succ?succ+' success'+(succ>1?'es':'')+(snare?' (Snare)':''):'nothing'}.`);
  showRoll({title:'The Hunt',sub:`The Fellowship moves (move ${f.moves} this turn). The Throne rolls ${n} Hunt ${n===1?'die':'dice'} from the Hunt box, needing ${need}+${rer?`, with ${rer} reroll${rer>1?'s':''} for enemies around ${REG[f.loc].name}`:''}.`,
    rows:[{side:'S',label:`Hunt · ${n} dice, need ${need}+`,dice:H.a,rr:H.b,need,hits:H.hits}],outcome:succ?`Found! ${succ} success${succ>1?'es':''}${snare?' (the Snare)':''}. A Hunt tile is drawn.`:'They pass unseen.'},()=>{if(succ)resolveTile(drawTile(),succ,done);else done()});
}
function tileFace(t){return(t.v==='E'?'◉':t.v==='X'?'?':String(t.v))+(t.r?' 👁':'')}
function resolveTile(t,succ,done){
  const f=G.f,inM=f.mordor>=0;
  let dmg=t.v==='E'?(inM?G.huntBox:succ):t.v==='X'?Math.ceil(d6()*2/3):t.v;
  if(t.v==='E'&&f.guide==='tamsin'&&f.band.includes('tamsin')&&dmg>1)dmg--;
  let rev=!!t.r&&f.hidden,note='';
  if(rev&&!inM){if(f.guide==='wretch'){rev=false;note=' The Wretch leads them off the path; no reveal.'}else if(f.guide==='kettle'&&f.band.includes('kettle')&&!G.kettleUsed){rev=false;G.kettleUsed=true;note=' Kettle spots the watchers first; no reveal.'}}
  const desc=`Tile ${tileFace(t)}: ${t.v==='E'?(inM?`Eye — damage equals the ${G.huntBox} dice in the Hunt box`:`Eye — damage equals the ${succ} Hunt success${succ>1?'es':''}`):t.v==='X'?'Dark tile — roll a die, damage is two thirds of it':`${t.v} damage`}. ${dmg} damage in all.${t.r?(rev?' The Fellowship is revealed!':note||''):''}`;
  const after=()=>{if(rev){f.hidden=false;log('S','The Fellowship is revealed!');if(!inM&&f.prog>0){forcedDeclare(done);return}}done()};
  if(dmg<=0){log('S',`Hunt tile ${tileFace(t)}: no damage.${rev?' Revealed!':''}`);infoModal('Hunt tile',desc,t,after);return}
  damageChoice(dmg,t,desc,after);
}
function absorb(id){return COMPS[id].lvl+(G.f.guide==='hollis'&&G.f.band.includes('hollis')?1:0)}
function damageChoice(dmg,t,desc,cb){
  const f=G.f;
  const takeCorr=()=>{addCorr(dmg);log('S',`Hunt tile ${tileFace(t)}: Wren takes ${dmg} Corruption (now ${f.corr}).`);cb()};
  const cas=id=>{const rest=Math.max(0,dmg-absorb(id));eliminateComp(id,'on the road');addCorr(rest);if(rest)log('S',`Wren still takes ${rest} Corruption.`);cb()};
  if(!isHuman('F')){const c=aiDamage(dmg);if(isHuman('S')&&!(G.mode==='ai')){infoModal('Hunt tile',desc+` ${c?`${COMPS[c].name} gives their life.`:'Wren takes the Corruption.'}`,t,()=>c?cas(c):takeCorr())}else{c?cas(c):takeCorr()}return}
  const opts=[{label:`Wren takes ${dmg} Corruption`,sub:`Corruption ${f.corr} → ${Math.min(MAXC,f.corr+dmg)} of ${MAXC}${f.corr+dmg>=MAXC?' — the Shard wins':''}`,fn:takeCorr}];
  if(f.band.length&&f.guide!=='wretch'){const g=f.guide;opts.push({label:`The Guide, ${COMPS[g].name}, gives their life`,sub:`Absorbs up to ${absorb(g)}${dmg>absorb(g)?` — Wren still takes ${dmg-absorb(g)}`:' — Wren is spared'}`,fn:()=>cas(g)})}
  if(f.band.length>1){opts.push({label:'A random Warden gives their life',sub:`Could be anyone in the band. Absorbs up to their level (${f.band.map(id=>COMPS[id].lvl).join('/')})`,fn:()=>cas(f.band[RAND(f.band.length)])})}
  UI.choice={title:'The Hunt strikes',text:desc,tile:t,options:opts};renderModal();
}
function forcedDeclare(done){const f=G.f;const c=within(f.loc,f.prog);if(isHuman('F')){pick(`Revealed! Move the Fellowship figure up to ${f.prog} region${f.prog>1?'s':''} from ${REG[f.loc].name} (its hidden progress). Choose where it is seen.`,c,rid=>{declare(rid,false);done()},null)}else{declare(aiDeclareTarget(),false);done()}}

const adjS=rid=>ADJ[rid].some(a=>owner(a)==='S'&&combat(a)>0),adjF=rid=>ADJ[rid].some(a=>owner(a)==='F'&&combat(a)>0);

function cardCan(c){if(c.can&&!c.can())return false;if(c.targets&&!c.targets().length)return false;return true}
function eventDie(s){return G.dice[s].findIndex(d=>!d.used&&(d.f==='E'||d.f==='W'))}
function bestEventDie(s){const i=G.dice[s].findIndex(d=>!d.used&&d.f==='E');return i>=0?i:eventDie(s)}
function playCard(s,key,rid,done){const h=G.hands[s];h.splice(h.indexOf(key),1);discard(s,key);log(s,`${SIDES[s].name} plays “${CARDS[key].name}”.`);const async=CARDS[key].play(rid,done);if(async!==true)done()}

/* ======================= BATTLE ======================= */
function battle(from,to,done){const B={from,to,a:owner(from),d:owner(to),round:0,done,roused:false};nextRound(B)}
function nextRound(B){B.round++;B.mod={a:null,d:null};offerCard(B,'a',()=>offerCard(B,'d',()=>rollRound(B)))}
function useCombat(B,who,k){const s=B[who];const h=G.hands[s];h.splice(h.indexOf(k),1);discard(s,k);B.mod[who]=CARDS[k].combat;log(s,`${SIDES[s].name} plays “${CARDS[k].name}” in battle: ${CARDS[k].combat.txt.replace('Combat: ','')}`)}
function offerCard(B,who,cb){const s=B[who];const hand=G.hands[s];if(!hand.length){cb();return}
  if(isHuman(s)){const o=[{label:'Fight without a card',fn:cb}].concat([...new Set(hand)].map(k=>({label:CARDS[k].name,sub:CARDS[k].combat.txt,fn:()=>{useCombat(B,who,k);cb()}})));choose(`${SIDES[s].name}: combat card?`,`Round ${B.round} at ${REG[B.to].name}: ${SIDES[B.a].name} ${combat(B.from)} vs ${SIDES[B.d].name} ${combat(B.to)}. You may discard one card to use its combat effect this round.`,o);return}
  const k=aiCombatCard(B,who);if(k)useCombat(B,who,k);cb()}
function rollRound(B){
  const aU=combat(B.from),dU=combat(B.to);const ma=B.mod.a||{},md=B.mod.d||{};
  const fortD=REG[B.to].set==='fort'&&G.ctrl[B.to]===B.d,cityD=REG[B.to].set==='city'&&G.ctrl[B.to]===B.d&&B.round===1;
  let aNeed=(fortD||cityD)?6:5;if(fortD&&B.a==='S'&&G.siege)aNeed=5;if(ma.t==='plus')aNeed--;let dNeed=5;if(md.t==='plus')dNeed--;
  const aN=Math.min(5,aU)+(ma.t==='dice'?ma.n:0),dN=Math.min(5,dU)+(md.t==='dice'?md.n:0);
  const aR=ma.t==='rer'?99:Math.min(lead(B.from),aN),dR=md.t==='rer'?99:Math.min(lead(B.to),dN);
  const A=rollHits(aN,aNeed,aR),D=rollHits(dN,dNeed,dR);
  let aHits=A.hits+(ma.t==='hit'?1:0),dHits=D.hits+(md.t==='hit'?1:0);
  if(md.t==='cancel')aHits=Math.max(0,aHits-md.n);if(ma.t==='cancel')dHits=Math.max(0,dHits-ma.n);
  const defN=new Set(G.units[B.to].filter(isC).map(u=>u.n));if(REG[B.to].nation)defN.add(REG[B.to].nation);
  applyHits(B.to,aHits);applyHits(B.from,dHits);
  if(!B.roused){B.roused=true;defN.forEach(n=>{if(NATIONS[n].side===B.d)rouse(n,true)})}
  const aL=combat(B.from),dL=combat(B.to);
  let outcome;if(dL===0&&aL>0)outcome=`${REG[B.to].name} falls. The ${SIDES[B.a].name} moves in.`;else if(aL===0)outcome=`The attackers are destroyed.`;else outcome=`${SIDES[B.a].name} ${aU}→${aL}, ${SIDES[B.d].name} ${dU}→${dL}.`;

    rows:[{side:B.a,label:`${SIDES[B.a].name} · ${aN} dice, need ${aNeed}+${aR?`, ${aR>=99?'all misses':aR} reroll${aR===1?'':'s'}`:''}${ma.t==='hit'?', +1 hit':''}${ma.t==='cancel'?`, cancels ${ma.n}`:''}`,dice:A.a,rr:A.b,need:aNeed,hits:aHits},

function retreatDests(B){const s=B.d;return ADJ[B.to].filter(r=>{const o=owner(r);return(!o||o===s)&&combat(r)+combat(B.to)<=10&&r!==B.from})}

/* ======================= AI ======================= */
function frontDist(){return distMap(r=>held(r,'F'))}
function nearestFront(ids){const D=frontDist();return ids.slice().sort((a,b)=>D[a]-D[b]||combat(a)-combat(b))[0]}
function aiCombatCard(B,who){const s=B[who],h=G.hands[s];if(!h.length)return null;const stake=REG[B.to].set?vpOf(B.to):0;const big=combat(B.from)+combat(B.to)>=6;if(!(stake||big)&&h.length<5)return null;if(B.round>2&&h.length<4)return null;
  let best=null,bs=99;h.forEach(k=>{const c=CARDS[k];const v=cardCan(c)?(c.ai?c.ai():1.5):0;if(v<bs){bs=v;best=k}});return bs<2.4||h.length>=5?best:null}
function aiContinue(B){const aU=combat(B.from),dU=combat(B.to);const fort=REG[B.to].set==='fort'&&G.ctrl[B.to]===B.d;if(aU<2)return false;return aU>=dU*(fort?(B.a==='S'&&G.siege?1.1:1.5):1)||dU<=1}
function aiRetreat(B,ds){const aU=combat(B.from),dU=combat(B.to);const setl=!!REG[B.to].set;if(aU>=(setl?3.2:2.2)*dU&&dU<=3){const safe=ds.filter(r=>!ADJ[r].some(x=>owner(x)===B.a&&combat(x)>=dU));return (safe[0]||ds[0])}return null}
function aiAlloc(max){const f=G.f;if(f.mordor>=0)return Math.min(max,5);const p=gatePath(f.loc);const dist=p.length-1-f.prog;let k=dist<=3?4:dist<=6?3:2;return Math.max(1,Math.min(max,k))}
function aiUseS(face,done){
  if(face==='A')return aiArmy('S',2,false,done)||aiCardS(['S'],99,done);
  if(face==='AM')return aiArmy('S',2,false,done)||aiMusterS(done);
  if(face==='C')return aiCharS(done);
  if(face==='M')return aiMusterS(done);
  if(face==='E')return aiEvent('S',done);
  return false;

          if(n<1)continue;

          if(me==='F'){const th=threat(t);if(th>0&&held(t,'F')){const nn=Math.min(combat(f)-(held(f,'F')&&threat(f)>0?combat(f):0),room);if(nn>=1)consider(4+th+vpOf(t),'mv',()=>{moveUnits(f,t,nn);touched.add(t)})}continue}

const RULES=`<h2>Rules of Shardfall</h2>
<h3>Victory</h3><p><b>Free Realms:</b> Wren reaches the end of the Mordor track (the Sunken Forge), or the Free Realms hold ${VP_F} VP of Throne settlements. <b>Ashen Throne:</b> Wren's Corruption reaches ${MAXC}, or the Throne holds ${VP_S} VP of Free settlements. Cities are worth 1 VP, strongholds 2.</p>
<h3>Turn order</h3><ol><li><b>Draw:</b> each side draws one Character and one Strategy card (hand limit 6).</li><li><b>Fellowship phase:</b> the Free player may declare the Fellowship's position, change the Guide, or enter Mordor from Morrowgate or Shadegate.</li><li><b>Hunt allocation:</b> the Throne puts 0 to N dice in the Hunt box, where N is the number of Wardens still in the Fellowship (at least 1).</li><li><b>Roll:</b> the Free Realms roll 4 dice (+1 for a crowned Aldric, +1 for Tamsin the Radiant). The Throne rolls its remaining dice from 7 (+1 per Minion); rolled Eyes join the Hunt box.</li><li><b>Actions:</b> Free first, the sides alternate using one die each. A side with fewer dice left may pass.</li></ol>
<h3>The Fellowship</h3><p>Moving the Fellowship (Character or Will die) adds 1 hidden progress; the figure stays at its last known position. The Hunt then rolls the Hunt-box dice (max 5): it needs 6 on the first move of the turn, 5+ on the second, and so on. It gets one reroll each for a Throne army, a Wraith, and a Throne-held settlement in the Fellowship's last known region. On any success a Hunt tile is drawn: its number is damage; an Eye tile's damage equals the successes rolled; tiles marked 👁 reveal the Fellowship. When revealed, the figure is moved up to its hidden progress and the Fellowship must hide (Character die) before moving again.</p><p>Damage becomes Corruption, unless the Guide or a random Warden gives their life to absorb damage up to their level. Declaring in a Free city or stronghold heals 1 Corruption and rouses that nation. From Morrowgate or Shadegate the Fellowship may enter Mordor: then every move climbs one of 6 steps and always draws a tile, Eye tiles deal damage equal to the Hunt box, and 4 dark tiles join the pool.</p>
<h3>Wardens</h3><p>A Warden may separate from the Fellowship and travel up to its hidden progress plus their level. On the map Wardens are leaders, move up to their level with a Character die, and rouse their own nation when they reach one of its cities or strongholds (Tamsin rouses any). Guides have powers shown on their chips. If every Warden is gone, the Wretch guides Wren. Aldric crowned in Highcrown (Aldmere at war) gives an extra die. Tamsin returns as the Radiant, with an extra die, once she has died or a Minion appears.</p>
<h3>Armies and battles</h3><p>An Army die moves two armies one region each, or attacks with one. A Character die moves or attacks with an army that has a leader, Warden, Wraith or Minion. Each battle round, both sides may discard a card for its combat effect, then roll one die per unit (max 5), hitting on 5+. Attackers hit only on 6 against a stronghold, and against a city in the first round. Each point of leadership rerolls one miss. A hit removes a regular or turns an elite into a regular. After each round the attacker may press on and a defender outside a stronghold may retreat. Up to 10 units per region.</p>
<h3>Politics</h3><p>A nation must be at war to recruit, attack, or leave its own lands. Diplomacy (Muster die) moves a nation one step; a nation that is not roused cannot take the last step. Free nations are roused when invaded, attacked (which also moves them a step), or visited by the Fellowship or one of their Wardens.</p>
<h3>The Throne</h3><p>Wraiths are leaders that fly anywhere with a Character die (not into a Free stronghold). Muster dice may bring in Minions: the White Tyrant, the Ashen King and the Pale Herald, each adding a die.</p>`;

/* ======================= EVENTS ======================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a],[data-act],[data-die],[data-card],[data-opt],[data-start],[data-info],[data-roll],[data-tour],g.reg');if(!t)return;
  if(t.dataset.start){const k=t.dataset.start;UI.info=false;if(k==='load'){G=load();UI.pick=null;UI.choice=null;UI.sel=null;UI.roll=null;UI.busy=false;if(G.phase==='fellowship'||G.phase==='hunt'){G.turn--;startTurn()}else refresh()}else{newGame(k);let toured=false;try{toured=!!localStorage.getItem(TOUR);localStorage.setItem(TOUR,'1')}catch(x){}if((k==='F'||k==='S')&&!toured)startTour()}return}
  if(t.dataset.info){if(t.dataset.info==='rules'){showInfo(RULES);return}UI.info=false;if(!G)startScreen();else renderModal();return}
  if(t.dataset.roll){closeRoll();return}
  if(t.dataset.tour){const k=t.dataset.tour;if(k==='skip'||(k==='next'&&UI.coach===TOURSTEPS.length-1))UI.coach=null;else if(k==='next')UI.coach++;else UI.coach--;renderCoach();return}
  if(t.dataset.opt!=null){const c=UI.choice;UI.choice=null;renderModal();if(t.dataset.opt==='x'){c.cancel&&c.cancel()}else c.options[+t.dataset.opt].fn();if(!UI.choice&&!UI.roll&&!UI.pick)schedule();return}
  if(!G)return;
  if(t.matches('g.reg')){const rid=t.dataset.r;if(UI.pick&&UI.pick.ok.has(rid)){const cb=UI.pick.cb;UI.pick=null;cb(rid)}else{UI.focus=rid;renderPrompt()}return}
  const a=t.dataset.a;
  if(a==='new'){startScreen();return}
  if(a==='pcancel'){const c=UI.pick.cancel;UI.pick=null;if(c)c();else render();return}
  if(a==='pass'){passTurn();return}
  if(a==='unsel'){UI.sel=null;render();return}
  if(t.dataset.die){const[s,i]=t.dataset.die.split(':');if(s===G.active&&isHuman(s)&&!G.dice[s][+i].used){UI.sel=+i;render()}return}
  if(t.dataset.act!=null){const x=UI.acts[+t.dataset.act];if(x&&x.ok&&x.fn)x.fn();return}
  if(t.dataset.card){playFromHand(t.dataset.card);return}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g.reg.pickable')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.key==='Escape'&&UI.choice&&UI.choice.cancel){const c=UI.choice;UI.choice=null;renderModal();c.cancel()}});
document.getElementById('bRules').onclick=()=>showInfo(RULES);
document.getElementById('bNew').onclick=()=>startScreen();
document.getElementById('bTour').onclick=()=>{if(G)startTour()};
renderLegend();startScreen();
</script>
