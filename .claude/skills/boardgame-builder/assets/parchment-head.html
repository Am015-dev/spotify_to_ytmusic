<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shardfall — War of Two Roads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9dcb8; --paper2:#dfcfa4; --paper3:#f3e9cf; --ink:#2c1e10; --ink2:#5a4630; --faded:#8a7354; --rule:#6b5537;
  --wax-f:#22407a; --wax-f2:#4468ad; --wax-s:#8f1d14; --wax-s2:#c8402c; --gold:#b8892a; --gold2:#e2bd5c;
  --free:#22407a; --throne:#8f1d14; --neutral:#cbbb90; --ash:#3a2c22; --ok:#3d6b2f; --shadow:rgba(40,25,5,.35);
  --sea:#cfc1a0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#3a2f22; --paper2:#302619; --paper3:#46392a; --ink:#efe3c6; --ink2:#d3c19b; --faded:#a48f6c; --rule:#8f7a58;
  --free:#7ea1e6; --throne:#e8664c; --neutral:#5b4d38; --ash:#120d09; --ok:#7fc063; --shadow:rgba(0,0,0,.6); --sea:#2c2419;
}}
:root[data-theme="dark"]{
  --paper:#3a2f22; --paper2:#302619; --paper3:#46392a; --ink:#efe3c6; --ink2:#d3c19b; --faded:#a48f6c; --rule:#8f7a58;
  --free:#7ea1e6; --throne:#e8664c; --neutral:#5b4d38; --ash:#120d09; --ok:#7fc063; --shadow:rgba(0,0,0,.6); --sea:#2c2419;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 "Cormorant Garamond",Georgia,serif;font-weight:500;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .1 0 0 0 .12 0'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>")}
h1,h2,h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,g.reg:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;padding:.8rem 1.4rem .6rem;border-bottom:3px double var(--rule)}
header h1{margin:0;font-size:2.3rem;font-family:"IM Fell English SC","IM Fell English",Georgia,serif}
header .sub{color:var(--ink2);font-style:italic}
header .spacer{flex:1}
.btn{border:1.5px solid var(--rule);background:var(--paper3);padding:.4rem .9rem;border-radius:3px;line-height:1.25;box-shadow:inset 0 0 0 1px var(--paper3),inset 0 0 0 2px var(--rule);font-family:"IM Fell English",Georgia,serif;font-size:.98rem}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper3);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),inset 0 0 0 2px var(--paper3)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:1.1rem;padding:1rem 1.4rem;max-width:1520px;margin:0 auto}
@media (max-width:980px){.wrap{grid-template-columns:1fr;padding:.6rem}}
.board{min-width:0}
#map{width:100%;height:auto;display:block;border:2px solid var(--rule);outline:1px solid var(--rule);outline-offset:4px;box-shadow:0 8px 30px var(--shadow)}
.side{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.box{background:var(--paper3);border:1.5px solid var(--rule);outline:1px solid var(--rule);outline-offset:3px;padding:.75rem .9rem;margin:4px}
.box h3{margin:0 0 .35rem;font-size:1.25rem;border-bottom:1px solid var(--rule);padding-bottom:.15rem}
.box h3::before{content:"❧ ";color:var(--faded)}
.muted{color:var(--faded)} .small{font-size:.9rem}
#prompt.F .who{color:var(--free)} #prompt.S .who{color:var(--throne)}
#prompt .who{font-family:"IM Fell English SC","IM Fell English",Georgia,serif;font-size:1.45rem}
.acts{display:flex;flex-direction:column;gap:.35rem;margin-top:.5rem}
.acts .btn{text-align:left;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}
.acts .btn small{display:block;color:var(--ink2);font-size:.82rem;font-weight:500}
.dicerow{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:.3rem 0 .55rem}
.dicerow .lbl{width:4.8rem;font-family:"IM Fell English",Georgia,serif}
.die{width:54px;height:54px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;box-shadow:inset 0 0 0 2px var(--paper3),inset 0 0 0 3px var(--rule)}
.die .g{font-size:1.35rem} .die .t{font-size:.62rem;margin-top:3px;color:var(--ink2);font-family:"IM Fell English",Georgia,serif}
.die.F .g{color:var(--free)} .die.S .g{color:var(--throne)}
.die.used{opacity:.3;cursor:default;background:var(--paper2)} .die.hunt{border-style:dashed;cursor:default;opacity:.85}
.die.sel{box-shadow:inset 0 0 0 2px var(--paper3),inset 0 0 0 3px var(--rule),0 0 0 3px var(--gold)}
.tracks{display:grid;gap:.55rem;margin-top:.9rem}
.track{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.track .name{width:6.2rem;font-family:"IM Fell English",Georgia,serif;font-size:1.1rem}
.cells{display:flex;gap:3px;flex-wrap:wrap}
.cell{width:30px;height:30px;border:1px solid var(--rule);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--ink2);font-family:"IM Fell English",Georgia,serif}
.cell.ash{background:var(--ash);color:#d8c6a2;border-color:#1c1410}
.cell.here{background:var(--gold2);color:#2c1e10;font-weight:700;border-color:var(--gold);border-radius:50%;box-shadow:0 1px 2px var(--shadow)}
.cell.taint{background:var(--wax-s2);border-color:var(--wax-s);color:#fff}
.cell.forge{border:2px solid var(--throne)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--rule);border-radius:2px;padding:.05rem .55rem;font-size:.88rem;background:var(--paper)}
.chip.warn{border-color:var(--throne);color:var(--throne)} .chip.F{color:var(--free)} .chip.S{color:var(--throne)}
.hand{display:flex;flex-direction:column;gap:.5rem}
.card{border:1.5px solid var(--rule);padding:.45rem .65rem;background:var(--paper);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--rule)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.card .nm{font-family:"IM Fell English",Georgia,serif;font-size:1.15rem}
.card .ty{font-size:.75rem;color:var(--ink2);white-space:nowrap;font-style:italic}
.card p{margin:.2rem 0 .4rem;font-size:.92rem}
.nat{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;font-size:.95rem}
#log{max-height:240px;overflow:auto}
#log div{font-size:.9rem;padding:.12rem 0;border-bottom:1px dotted var(--rule)}
#log .F{color:var(--free)} #log .S{color:var(--throne)} #log .N{font-family:"IM Fell English",Georgia,serif;color:var(--faded)}
.modal{position:fixed;inset:0;background:rgba(30,20,8,.62);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:10}
.modal.hidden{display:none}
.dlg{background:var(--paper3);border:2px solid var(--rule);outline:1px solid var(--rule);outline-offset:4px;max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:1.2rem 1.35rem;box-shadow:0 24px 60px var(--shadow)}
.dlg h2{margin:0 0 .4rem;font-size:1.8rem;font-family:"IM Fell English SC","IM Fell English",Georgia,serif}
.dlg .acts .btn{padding:.55rem .8rem}
.rules h3{margin:1rem 0 .2rem;font-size:1.2rem} .rules p,.rules li{font-size:1rem;max-width:68ch}
g.reg.pickable{cursor:pointer}
g.reg.pickable .ring{stroke:var(--gold);stroke-width:5;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.3}}
.legend{display:grid;grid-template-columns:auto 1fr;gap:.3rem .6rem;font-size:.9rem;align-items:center}
.legend svg{width:38px;height:38px;display:block}
details summary{cursor:pointer;font-family:"IM Fell English",Georgia,serif;font-size:1.25rem}
.win{font-size:1.6rem}
.inspect{margin-top:.5rem;padding-top:.5rem;border-top:1px dotted var(--rule);font-size:.92rem}
.coach{border:2px solid var(--gold);background:var(--paper3)}
.coach h3{color:var(--gold)}
.hl{box-shadow:0 0 0 3px var(--gold)!important}
.rolls{display:grid;gap:.8rem;margin:.5rem 0}
.rollrow{padding:.55rem .7rem;border:1px solid var(--rule);background:var(--paper)}
.rollrow.F{border-left:5px solid var(--free)} .rollrow.S{border-left:5px solid var(--throne)}
.rollrow .lbl{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:.35rem}
.dset{display:flex;flex-wrap:wrap;gap:.35rem}
.d6{width:40px;height:40px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.25rem;box-shadow:inset 0 0 0 2px var(--paper3),inset 0 0 0 3px var(--rule)}
.d6.spin{animation:spin .12s linear infinite}
@keyframes spin{50%{transform:rotate(12deg) scale(1.05)}}
.d6.hit{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:none}
.d6.rr{border-style:dashed}
.d6.tile{width:64px;height:64px;font-size:1.5rem;border-color:var(--throne);background:var(--ash);color:#f2e6cf;box-shadow:none}
.outcome{font-family:"IM Fell English",Georgia,serif;font-size:1.3rem;margin:.4rem 0}
@media (prefers-reduced-motion:reduce){.d6.spin{animation:none}g.reg.pickable .ring{animation:none}}

.pol{display:grid;grid-template-columns:1fr auto;gap:.3rem .6rem;font-size:.95rem;align-items:center}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:15px;height:15px;border:1px solid var(--rule);background:var(--paper)}
.pip.on{background:var(--ink2)} .pip.war{background:var(--wax-s2);border-color:var(--wax-s)}
.tag{font-size:.75rem;font-style:italic;color:var(--gold)}
.cell.mord{background:var(--ash);color:#d8c6a2;border-color:#1c1410}
.chip.dead{text-decoration:line-through;opacity:.6}
.deck{font-size:.72rem;border:1px solid var(--rule);padding:0 .35rem;margin-left:.3rem}
.combat{font-size:.82rem;font-style:italic;color:var(--ink2);border-top:1px dotted var(--rule);padding-top:.2rem;margin-top:.2rem}
</style>
</head>
