<body>
<div class="gx-app">
<header class="gx-bar">
  <h1>Rampart &amp; Vine</h1>
  <span class="gx-sp"></span>
  <button class="gx-ibtn" data-a="adv" id="advbtn" title="What would the computer do?"><i data-ic="bulb"></i> <span>Advice</span></button>
  <button class="gx-ibtn" data-a="fit" title="Show the whole valley"><i data-ic="fit"></i> <span>Fit all</span></button>
  <button class="gx-ibtn" data-gx="plrd" aria-expanded="false"><i data-ic="players"></i> <span>Players</span></button>
  <button class="gx-ibtn" data-gx="logd" aria-expanded="false"><i data-ic="scroll"></i> <span>Log</span></button>
  <button class="gx-ibtn" data-gx="refd" aria-expanded="false"><i data-ic="tile"></i> <span>Tiles</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false"><i data-ic="book"></i> <span>Rules</span></button>
  <button class="gx-ibtn" data-a="guide" id="guidebtn" aria-pressed="true" title="Guided game: plain-word coaching in the panel"><i data-ic="guide"></i> <span>Guide</span></button>
  <button class="gx-ibtn" data-a="snd" id="sndbtn" aria-label="Sound"><i data-ic="snd"></i></button>
  <button class="gx-ibtn" data-a="mus" id="musbtn" aria-label="Music"><i data-ic="mus"></i></button>
  <button class="gx-ibtn" data-a="speed" id="speedbtn" title="How fast the computer plays"><i data-ic="ff"></i> normal</button>
  <button class="gx-ibtn" data-a="pause" id="pausebtn" hidden><i data-ic="pause"></i></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" title="Settings"><i data-ic="gear"></i> <span>Settings</span></button>
  <button class="gx-ibtn" data-a="new"><i data-ic="plus"></i> <span>New game</span></button>
</header>
<div class="gx-main">
  <main class="gx-board"><div class="view"><canvas id="c3" aria-label="The valley in 3D. Drag to move the map, pinch or scroll to zoom, tap a glowing square to try your tile there."></canvas><div id="map2d" hidden></div><div id="chip" aria-live="polite"></div></div></main>
  <aside class="gx-dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-grab" data-gx="sheet" title="Resize"></span><span class="gx-dt" id="dockt">Rampart &amp; Vine</span><button class="gx-ibtn" data-gx="sheet" aria-label="Resize panel"><i data-ic="vert"></i></button><button class="gx-ibtn gx-hide-narrow" data-gx="dock" aria-label="Hide panel"><i data-ic="hide"></i></button></div>
    <div id="dockmsg" hidden role="status"></div><div class="gx-dock-body" id="dockbody"></div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock"><i data-ic="menu"></i> Panel</button>
</div>
</div>
<section class="gx-drawer wide" id="plrd" role="dialog" aria-label="Players"><div class="gx-drawer-head"><h2><i data-ic="players"></i> Players</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="plrbody"></div></section>
<section class="gx-drawer" id="logd" role="dialog" aria-label="Log"><div class="gx-drawer-head"><h2><i data-ic="scroll"></i> Log</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="logbody"></div></section>
<section class="gx-drawer wide" id="refd" role="dialog" aria-label="Tiles"><div class="gx-drawer-head"><h2><i data-ic="tile"></i> Tiles, figures and scoring</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="refbody"></div></section>
<section class="gx-drawer wide" id="rulesd" role="dialog" aria-label="Rules"><div class="gx-drawer-head"><h2><i data-ic="book"></i> How to play</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="rulesbody"></div></section>
<section class="gx-drawer" id="setd" role="dialog" aria-label="Settings"><div class="gx-drawer-head"><h2><i data-ic="gear"></i> Settings</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="setbody"></div></section>
<div id="modal" hidden></div>
<script src="shell.js"></script>
<script src="trystero.min.js"></script>
<script src="netroom.js"></script>
<script src="perfhud.js"></script>
<script src="gameaudio.js"></script>
<script src="audio-data.js"></script>
<script src="three.min.js"></script>
<script src="data.js"></script>
<script src="geo.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="rules-html.js"></script>
<script src="three3d.js"></script>
<script src="sound.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
