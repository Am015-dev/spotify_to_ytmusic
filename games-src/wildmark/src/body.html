<body>
<div class="gx-app">
<header class="gx-bar">
  <h1><span class="ic" aria-hidden="true" data-art="icon-logo"><svg viewBox="0 0 24 24"><path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7Z" fill="#3f7a4a" stroke="#f3ead2" stroke-width="1.5"/><path d="M7 15 L10.5 9 L14 15Z M12 15 L15 11 L18 15Z" fill="#f3ead2"/></svg></span><span class="tt">Wildmark</span></h1>
  <span id="barstat"></span>
  <span class="gx-sp"></span>
  <button class="gx-ibtn gxh-bulb" id="bulbbtn" data-help type="button" aria-label="Hint"></button>
  <button class="gx-ibtn hintsw" id="hintsB" type="button" aria-pressed="false" aria-label="Hints: move previews, best-value badges and move ratings" title="Hints"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3zM9.5 20h5"/></svg><span>Hints</span></button>
  <button class="gx-ibtn" data-gx="scored" aria-expanded="false" aria-label="Scores" title="Scores"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Scores</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z M12 6v13"/></svg><span>Rules</span></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="Your valley" data-board data-art="table-bg">
    <svg id="map" role="img" aria-label="Hex map of your valley"></svg>
    <div id="cards" role="group" aria-label="Animal scores"></div>
    <div id="seats" role="group" aria-label="Players" hidden></div>
    <div id="acorn"></div>
    <div id="line" aria-live="polite"></div>
    <div id="zoom"><button type="button" id="zoutB" class="zb" aria-label="Zoom out">&minus;</button><button type="button" id="fitB" class="zb" aria-label="Fit the valley">&#9673;</button><button type="button" id="zinB" class="zb" aria-label="Zoom in">+</button></div>
  </main>
  <aside class="gx-dock" id="dock" aria-label="Market">
    <div class="gx-dock-body" id="dockbody">
      <div id="mk" role="group" aria-label="Market: tile and token pairs"></div>
      <div id="acts"></div>
      <div id="logp" aria-label="Season log"></div>
    </div>
  </aside>
</div>
</div>
<div id="start" hidden data-art="title-bg"></div>
<div id="rs" hidden></div>
<div id="pass" hidden></div>
<div id="toast" role="status"></div>
<script src="gx-scenario.js"></script>
<script src="scn.js"></script>
<script src="shell.js"></script>
<script src="gx-kit.js"></script>
<script src="gx-viewport.js"></script>
<script src="gx-help.js"></script>
<script src="gx-tutor.js"></script>
<script src="gx-campaign.js"></script>
<script src="campaign-data.js"></script>
<script src="gameaudio.js"></script>
<script src="gx-music.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="cards.js"></script>
<script src="ai.js"></script>
<script src="art.js"></script>
<script src="ui.js"></script>
<script src="score.js"></script>
<script src="help.js"></script>
<script src="tutor.js"></script>
<script src="campaign.js"></script>
</body>
</html>
