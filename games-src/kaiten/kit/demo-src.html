<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kaiten Kitchen art kit demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0}
:root{--ink:#4a2a22;--paper:#fbf0da;--hd:#4a2a22}
html.night{--ink:#f6e6c4;--hd:#f6e6c4}
body{font-family:'Nunito','Trebuchet MS','Segoe UI',system-ui,'DejaVu Sans',sans-serif;color:var(--ink);min-height:100vh}
header{padding:12px 16px 2px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:24px}
button{font:inherit;font-weight:800;border:2px solid #4a2a22;background:#fbf0da;color:#4a2a22;border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer}
h2{font-size:18px;margin:22px 16px 6px;padding-bottom:3px;border-bottom:2px solid currentColor;opacity:.95}
p.n{margin:2px 16px 8px;font-size:14px;opacity:.9}
.row{display:flex;flex-wrap:wrap;gap:10px;padding:0 16px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;font-size:13px;gap:3px}
.stage{position:relative;margin:6px 16px;border-radius:14px;overflow:hidden;background:#3a2c29}
.beltrow{position:relative;height:150px;overflow:hidden;border-radius:12px;margin:8px 16px;background:#3a2c29}
.beltrow .kk-belt{position:absolute;left:0;right:0;bottom:12px}
.beltrow .riders{position:absolute;left:0;bottom:30px;display:flex;gap:18px;animation:ride 14s linear infinite;white-space:nowrap}
@keyframes ride{from{transform:translateX(100vw)}to{transform:translateX(-90%)}}
.seatbox{position:relative;width:min(100%,360px)}
.seatbox .stack{position:absolute;left:0;right:0;top:6px;display:flex;justify-content:center}
.seatbox .stack>*{margin:0 -14px}
.seatwrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:0 16px}
.icons .cell{text-align:center}
.mod{position:fixed;inset:0;background:#2a1c1088;display:none;align-items:center;justify-content:center;z-index:9}.mod.on{display:flex}
.reveal{display:flex;gap:10px;padding:0 16px;flex-wrap:wrap}
.reveal .h{position:relative}
</style></head><body>
<header><h1>Kaiten Kitchen art kit</h1><button id="mood">Day / night</button><button id="rv">Reveal plates</button><span id="info" style="font-size:13px"></span></header>
<div id="app"></div><div class="mod" id="mod"></div>
<script>/*KIT*/</script>
<script>
(function(){
const $=s=>document.querySelector(s),app=$('#app'),Q=new URLSearchParams(location.search),only=Q.get('only');
const night=Q.get('mood')==='night';if(night)document.documentElement.classList.add('night');
KKKit.applyTable(document.documentElement,night?'night':'day');
$('#mood').onclick=()=>{const n=!document.documentElement.classList.contains('night');document.documentElement.classList.toggle('night',n);KKKit.applyTable(document.documentElement,n?'night':'day')};
const h=(t,txt,cls)=>{const e=document.createElement(t);if(txt)e.textContent=txt;if(cls)e.className=cls;return e};
const sec=(id,title,note,cls)=>{const w=h('div');w.dataset.s=id;if(only&&only!==id){w.style.display='none'}app.appendChild(w);w.appendChild(h('h2',title));if(note)w.appendChild(h('p',note,'n'));const r=h('div',null,cls||'row');w.appendChild(r);return r};
const cell=(el,lab)=>{const c=h('div',null,'cell');c.appendChild(typeof el==='string'?KKKit.el(el):el);if(lab)c.appendChild(h('span',lab));return c};
const T=KKKit.ORDER, t0=performance.now();
// 1 cards at several widths
[[70,'Cards at 70 px (phone hand)','Name 13 px, one big plate illustration, tiny rule badge.'],[100,'Cards at 100 px (phone table / desktop hand)'],[150,'Cards at 150 px'],[240,'Cards at 240 px (enlarged / tap-to-zoom)','Large cards add a short rule caption.']].forEach(([w,t,n])=>{
  const r=sec('cards'+w,t,n);T.forEach(k=>r.appendChild(cell(KKKit.cardEl(k,{w}),w>=100?k:null)));r.appendChild(cell(KKKit.cardEl('wasabi',{w,variant:'nigiri'}),w>=100?'wasabi+nigiri':null));});
// 2 plates
{const r=sec('plates','Bare plates (belt riders, counter stacks)');T.forEach(k=>r.appendChild(cell(KKKit.plateSVG(k,{d:84}),k)));r.appendChild(cell(KKKit.plateSVG('wasabi',{d:84,variant:'nigiri'}),'wasabi+nigiri'));}
// 3 backs, piles
{const r=sec('backs','Card back, deck and discard piles');r.appendChild(cell(KKKit.backSVG({w:70}),'70'));r.appendChild(cell(KKKit.backSVG({w:130}),'130'));r.appendChild(cell(KKKit.backSVG({w:240}),'240'));
 r.appendChild(cell(KKKit.pileSVG({w:90,count:84}),'deck 84'));r.appendChild(cell(KKKit.pileSVG({w:90,count:6}),'deck 6'));r.appendChild(cell(KKKit.pileSVG({w:90,count:0}),'deck empty'));
 r.appendChild(cell(KKKit.pileSVG({w:90,count:23,kind:'discard',top:'tempura'}),'discard 23'));r.appendChild(cell(KKKit.pileSVG({w:90,count:0,kind:'discard'}),'discard empty'));}
// 4 belt
{const w=h('div');w.dataset.s='belt';if(only&&only!=='belt')w.style.display='none';app.appendChild(w);w.appendChild(h('h2','Conveyor belt (seamless scroll, plates riding)'));w.appendChild(h('p','The belt is a tiling SVG segment (96 px period) scrolled by CSS; plates ride in a flex row. Reduced-motion stops the scroll.','n'));
 const b=h('div',null,'beltrow');b.style.height='110px';const rid=h('div',null,'riders');rid.style.bottom='23px';T.forEach(k=>rid.appendChild(KKKit.el(KKKit.plateSVG(k,{d:64}))));const bt=KKKit.beltEl({h:72,period:96,seconds:5});bt.style.bottom='19px';b.appendChild(bt);b.appendChild(rid);w.appendChild(b);
 const s=h('div');s.style.cssText='margin:6px 16px';s.appendChild(KKKit.el(KKKit.beltSegmentSVG({h:72,period:96})));w.appendChild(h('p','One segment (96 x 72):','n'));w.appendChild(s);}
// 5 counters with stacks
{const r=sec('counter','Diner counters: played plates stack in front of each player','Cards overlap along the counter; the cloth runner is the seat colour.');
 const kinds=[['tempura','tempura','salmon','wasabi','squid','roll2','pudding','dumpling'],['sashimi','sashimi','sashimi','egg','chop','roll3'],['dumpling','dumpling','roll1','roll1','pudding','pudding','salmon'],['tempura','sashimi','wasabi','roll2','roll3','chop','egg','squid','pudding'],['pudding','salmon','salmon','tempura']];
 for(let i=0;i<5;i++){const col=h('div',null,'seatwrap');col.appendChild(KKKit.el(KKKit.seatSVG(i,{w:200,score:[23,15,31,8,42][i],active:i===1})));
  const bx=h('div',null,'seatbox');bx.style.height='150px';bx.appendChild(KKKit.el(KKKit.counterSVG({w:340,h:150,seat:i})));const st=h('div',null,'stack');const n=kinds[i].length,cw=60,step=Math.min(cw*.72,(310-cw)/(n-1));kinds[i].forEach((k,j)=>{const c=KKKit.el(KKKit.cardSVG(k,{w:cw}));c.style.marginLeft=j?(step-cw)+'px':'0';c.style.marginRight=0;st.appendChild(c)});st.style.cssText='position:absolute;left:14px;top:18px;display:flex';bx.appendChild(st);col.appendChild(bx);r.appendChild(col)}}
// 6 avatars
{const r=sec('chefs','Five chefs and seat tags');KKKit.PLAYERS.forEach((p,i)=>{r.appendChild(cell(KKKit.avatarSVG(i,{size:96}),p.name))});KKKit.PLAYERS.forEach((p,i)=>r.appendChild(cell(KKKit.avatarSVG(i,{size:44}),'44px')));
 const r2=h('div',null,'row');r2.style.marginTop='10px';app.querySelector('[data-s=chefs]').appendChild(r2);KKKit.PLAYERS.forEach((p,i)=>r2.appendChild(cell(KKKit.seatSVG(i,{w:190,score:i*7+3,active:i===2}))));}
// 7 icons
{const w=h('div');w.dataset.s='icons';if(only&&only!=='icons')w.style.display='none';app.appendChild(w);w.appendChild(h('h2','Scoring rule icons'));w.appendChild(h('p','Used as the badge on each card and in the scoring breakdown. Each is also drawn at 56 px with its card colour.','n'));
 const g=h('div',null,'icons');KKKit.iconNames.forEach(n=>{const c=h('div',null,'cell');c.appendChild(KKKit.el(KKKit.iconSVG(n,{size:56,type:n==='pair'?'tempura':n==='set'?'sashimi':n==='ladder'?'dumpling':n==='swap'?'chop':n==='most'||n==='second'?'roll1':null})));c.appendChild(h('span',n));g.appendChild(c)});w.appendChild(g);
 const r=h('div',null,'row');r.style.marginTop='10px';w.appendChild(r);[22,32,44].forEach(s=>r.appendChild(cell(KKKit.iconSVG('x3',{size:s}),s+'px')));}
// 8 score pad + rounds
{const r=sec('pad','Score pad and round markers');r.appendChild(cell(KKKit.scorePadSVG({w:340,round:2,rows:[{i:0,name:'Mina',rounds:[18,12,null],dessert:null,total:30,you:true},{i:1,name:'Taro',rounds:[15,20,null],dessert:null,total:35},{i:2,name:'Odile',rounds:[22,9,null],dessert:null,total:31},{i:3,name:'Kofi',rounds:[11,14,null],dessert:null,total:25},{i:4,name:'Pip',rounds:[8,-1,null],dessert:null,total:7}]})));
 const c=h('div',null,'seatwrap');c.appendChild(KKKit.el(KKKit.roundTrackSVG(2,{size:44})));c.appendChild(KKKit.el(KKKit.roundTrackSVG(3,{size:30})));const rr=h('div',null,'row');rr.style.padding='0';['todo','current','done'].forEach(s=>rr.appendChild(cell(KKKit.roundMarkerSVG(2,s,{size:48}),s)));c.appendChild(rr);r.appendChild(c);}
// 9 cloche reveal
{const r=sec('reveal','Reveal flourish: covered plates lift their cloches','Press "Reveal plates" (top). Reduced motion: the lids simply vanish.','reveal');
 const hosts=[];['tempura','squid','pudding','wasabi'].forEach((k,i)=>{const hd=h('div',null,'h');hd.appendChild(KKKit.cardEl(k,{w:110}));r.appendChild(hd);hosts.push(hd)});
 const arm=()=>hosts.forEach(hd=>{if(!hd.__kkc){hd.__kkc=KKKit.clocheOn(hd)}});arm();
 $('#rv').onclick=()=>{KKKit.revealAll(hosts,{stagger:160}).then(()=>{hosts.forEach(hd=>hd.__kkc=null);setTimeout(()=>{arm()},1200)})};
 r.appendChild(cell(KKKit.clocheSVG({w:110}),'cloche'));if(Q.get('cover')==='0'){}}
// 10 stress
if(only==='stress'){const r=sec('stress','Stress: 120 cards at 70 px');const t1=performance.now();for(let i=0;i<120;i++)r.appendChild(KKKit.cardEl(T[i%12],{w:70}));window.STRESS_MS=performance.now()-t1;}
if(Q.get('rv')){setTimeout(()=>$('#rv').click(),+Q.get('rv'))}
$('#info').textContent=innerWidth+'x'+innerHeight+' | build '+Math.round(performance.now()-t0)+' ms';
window.DEMO_READY=true;
})();
</script></body></html>
