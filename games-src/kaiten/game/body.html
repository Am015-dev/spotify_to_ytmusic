<body>
<div class="gx-app">
<header class="gx-bar">
  <h1><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fbf0da" stroke="#f6e6c4" stroke-width="1.2"/><circle cx="12" cy="12" r="7" fill="#e5553a"/><circle cx="12" cy="12" r="3.2" fill="#fbf0da"/></svg></span><span class="tt">Kaiten Kitchen</span></h1>
  <span id="barstat"></span>
  <button id="netst" type="button" data-a="netopen" hidden></button>
  <div id="barprompt"></div>
  <span class="gx-sp"></span>
  <button class="gx-ibtn" data-gx="rivald" aria-expanded="false" aria-label="Diners and scores" title="Diners and scores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 14c3 0 6 1.5 6 5"/></svg><span>Diners</span></button>
  <button class="gx-ibtn" data-gx="logd" aria-expanded="false" aria-label="Log" title="Log"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h6M10 12h6M10 16h4"/></svg><span>Log</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z M12 6v13"/></svg><span>Rules</span></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="The diner counter"><div id="bd">
    <div id="tbl"></div>
    <div id="beltz"><div class="lab"><span id="beltTo"></span><span id="beltFrom"></span></div><div id="beltw"><div id="belt" role="group" aria-label="Your plates on the conveyor belt"></div></div></div>
  </div></main>
  <aside class="gx-dock" id="dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-dt">Your turn</span><button class="gx-ibtn" data-gx="dock" aria-label="Hide panel">&#8677;</button></div>
    <div class="gx-dock-body" id="dockbody">
      <div id="promptDock"><div id="prompt" aria-live="polite"></div></div>
      <div id="rt"></div>
      <div id="roster"></div>
      <div id="selinfo"></div>
      <div id="acts"></div>
      <div id="cheat"></div>
    </div>
    <div class="ppop" id="ppop" hidden role="dialog" aria-label="Details"></div>
    <div class="pcard" id="pc" hidden role="dialog" aria-label="Message"></div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock">&#9776; Panel</button>
</div>
</div>
<div id="start" hidden></div>
<div id="rs" hidden></div>
<div id="netbox" hidden></div>
<div id="toast" role="status"></div>
<script src="shell.js"></script>
<script src="perfhud.js"></script>
<script src="trystero.min.js"></script>
<script src="netroom.js"></script>
<script src="kit.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="netstrip.js"></script>
<script src="gameaudio.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
