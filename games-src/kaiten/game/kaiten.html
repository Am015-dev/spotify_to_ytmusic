<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaiten Kitchen</title>
<style>
/* ===== Board-first shell (shared by every game on the shelf) =====
   The page never scrolls. The board fills what the bar and the dock leave; the dock is in flow (never over the board);
   everything else opens in a closable popup (drawer). Games theme it with the --gx-* variables. */
:root{--gx-bar-h:48px;--gx-dock-w:clamp(300px,30vw,420px);--gx-bg:#10151c;--gx-bar:#0b1016;--gx-panel:#f4ecd8;--gx-ink:#231a10;--gx-line:rgba(0,0,0,.25);--gx-accent:#e0a948;--gx-shadow:0 20px 60px rgba(0,0,0,.5);--gx-radius:14px}
html.gx,html.gx body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
.gx-app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--gx-bg)}
.gx-bar{min-height:var(--gx-bar-h);display:flex;align-items:center;gap:6px;padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px));overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;z-index:6}
.gx-bar::-webkit-scrollbar{display:none}
.gx-bar .gx-sp{flex:1 0 8px}
.gx-main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--gx-dock-w);position:relative}
.gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr) 0}
.gx-board{position:relative;min-width:0;min-height:0;overflow:hidden}
.gx-dock{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.gx-dock-head{display:flex;align-items:center;gap:6px;padding:6px 8px 4px;flex:0 0 auto}
.gx-dock-head .gx-dt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-dock-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gx-app.gx-dock-min .gx-dock{visibility:hidden}

.gx-ibtn{appearance:none;border:1px solid var(--gx-line);background:rgba(255,255,255,.08);color:inherit;border-radius:10px;min-width:40px;min-height:40px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;justify-content:center;cursor:pointer;font:inherit;white-space:nowrap}
.gx-ibtn:focus-visible,.gx-drawer button:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
.gx-ibtn .gx-n{font-size:.72rem;opacity:.8}
.gx-ibtn.gx-reopen{position:absolute;right:10px;top:10px;z-index:5;display:none}
.gx-app.gx-dock-min .gx-ibtn.gx-reopen{display:inline-flex}
/* popups */
.gx-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.gx-scrim.on{opacity:1;pointer-events:auto}
.gx-drawer{position:fixed;z-index:41;top:calc(var(--gx-bar-h) + 8px + env(safe-area-inset-top,0px));right:8px;bottom:8px;width:min(520px,calc(100vw - 16px));display:flex;flex-direction:column;background:var(--gx-panel);color:var(--gx-ink);border-radius:var(--gx-radius);box-shadow:var(--gx-shadow);transform:translateX(calc(100% + 16px));transition:transform .22s ease;visibility:hidden}
.gx-drawer.on{transform:none;visibility:visible}
.gx-drawer.wide{width:min(980px,calc(100vw - 16px))}
.gx-drawer-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--gx-line);flex:0 0 auto}
.gx-drawer-head h2{margin:0;font-size:1.15rem;flex:1;min-width:0}
.gx-x{appearance:none;border:0;background:transparent;font-size:1.6rem;line-height:1;cursor:pointer;color:inherit;min-width:40px;min-height:40px;border-radius:10px}
.gx-drawer-body{flex:1;min-height:0;overflow:auto;padding:10px 12px 16px;overscroll-behavior:contain}
/* narrow screens: the dock becomes a sheet under the board (still in flow), the drawers slide up from the bottom */
@media (max-width:999px){
  .gx-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr)}
  .gx-dock{max-height:var(--gx-sheet-h,46dvh);border-radius:var(--gx-radius) var(--gx-radius) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-app.gx-sheet-full .gx-dock{max-height:78dvh}
  .gx-app.gx-dock-min .gx-dock{visibility:visible;max-height:none}
  .gx-app.gx-dock-min .gx-dock-body{display:none}
  .gx-reopen{display:none!important}
  .gx-grab{display:block;width:44px;height:5px;border-radius:3px;background:currentColor;opacity:.35;margin:0 auto}
  .gx-drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88dvh;height:88dvh;border-radius:var(--gx-radius) var(--gx-radius) 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-drawer.wide{width:auto}
  .gx-hide-narrow{display:none!important}
}
@media (min-width:1000px){.gx-grab{display:none}}
@media (prefers-reduced-motion:reduce){.gx-drawer,.gx-scrim{transition:none}}

*{box-sizing:border-box}
:root{--ink:#4a2a22;--paper:#fbf0da;--paper2:#f3e0bd;--wood:#a96b3a;--wood2:#7d4a27;--red:#e5553a;--gold:#e0a31c;--teal:#2a97a0;--green:#3f9a4a;--gx-bg:#3a231d;--gx-bar:#33201a;--gx-panel:#fbf0da;--gx-ink:#4a2a22;--gx-accent:#e0a31c;--gx-dock-w:clamp(330px,30vw,410px);--gx-bar-h:48px;
  --font:'Nunito','Trebuchet MS','Segoe UI',system-ui,'DejaVu Sans',sans-serif;--pd:44px;--hw:84px}
html,body{font-family:var(--font);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:#3a231d}
button{font-family:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px}
.gx-bar{background:var(--gx-bar);color:#fbf0da;gap:8px}
.gx-bar h1{margin:0;font-size:1.15rem;display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:900}
.gx-bar h1 .ic{width:28px;height:28px;display:inline-block}
.gx-bar .gx-ibtn{color:#fbf0da;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.gx-ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#barstat{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;opacity:.96;white-space:nowrap}
#barprompt{flex:1;min-width:0;display:none}
#prompt{font-size:15px;line-height:1.25;font-weight:800}
.gx-board{background:#e6cf9f}
#bd{position:absolute;inset:0;display:flex;flex-direction:column;min-width:0;min-height:0}
/* ---- the table: one counter per diner ---- */
#tbl{flex:1 1 auto;min-height:0;display:grid;gap:6px;padding:6px 8px 4px;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.seat{position:relative;display:flex;align-items:stretch;align-self:center;gap:4px;min-width:0;min-height:0;border-radius:12px;padding:2px 3px 2px 2px;background:rgba(255,250,240,.28)}
.seat.me{grid-column:1/-1;background:rgba(255,250,240,.5);box-shadow:0 0 0 2px rgba(74,42,34,.35)}
.seat.choose{box-shadow:0 0 0 2px rgba(224,163,28,.9)}
.seat.me.choose{box-shadow:0 0 0 3px #e0a31c,0 0 14px 3px rgba(255,200,60,.65)}
.sh{flex:0 0 var(--shw,62px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;padding:0;border:0;background:transparent;cursor:pointer;font:inherit;color:inherit;position:relative}
.sh .av{position:relative;width:var(--av,42px);height:var(--av,42px)}
.sh .av svg{width:100%;height:100%}
.sh .av.act{filter:drop-shadow(0 0 5px #ffc83a) drop-shadow(0 0 2px #ffc83a)}
.sh .sc{position:absolute;right:-8px;top:-5px;min-width:24px;height:24px;border-radius:12px;background:#fffaf0;border:2px solid var(--ink);font-weight:900;font-size:13px;line-height:20px;text-align:center;padding:0 3px}
.sh .nm{font-size:13px;font-weight:800;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .rg{font-size:13px;font-weight:800;line-height:1;color:#2d7a35}
.ctr{flex:1 1 auto;min-width:0;min-height:calc(var(--pd) + 28px);border-radius:10px;border:2px solid var(--ink);background:#b4743f var(--ctr) center/100% 100%;display:flex;flex-wrap:wrap;align-content:center;align-items:flex-start;justify-content:flex-start;gap:3px 5px;padding:4px 6px;overflow:hidden;position:relative}
.seat.me .ctr{gap:4px 8px;padding:6px 10px}
.seat:not(.me) .ctr,html.ph .seat.me .ctr{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;align-items:center;scrollbar-width:none}
.ctr::-webkit-scrollbar{display:none}
.ctr>.grp{flex:0 0 auto}
.grp{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:transparent;padding:0 1px;margin:0;cursor:pointer;font:inherit;min-width:44px;min-height:44px;justify-content:center;color:var(--ink);border-radius:9px}
.grp .pl{position:relative;width:var(--pd);height:var(--pd);flex:0 0 auto}
.grp .pl>svg{position:absolute;left:0;top:0;width:var(--pd);height:var(--pd)}
.grp .pl>svg:nth-child(2){left:6px;top:-2px}.grp .pl>svg:nth-child(3){left:12px;top:-4px}
.grp .bg{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;border-radius:11px;background:#fffaf0;border:2px solid var(--ink);font-weight:900;font-size:13px;line-height:18px;text-align:center;padding:0 3px;z-index:2}
.grp .hn{font-size:13px;font-weight:800;line-height:1.1;white-space:nowrap;background:rgba(255,250,240,.92);border-radius:6px;padding:0 4px;margin-top:2px;border:1px solid rgba(74,42,34,.35)}
.grp.dim .hn{opacity:.8;font-weight:700}
.grp.ok .hn{background:#d8f1c9;border-color:#3f9a4a}
.grp.wait .hn{background:#ffe9a8;border-color:#c98a10}
.grp.waitf .pl{animation:kkpulse 1.4s ease-in-out infinite}
.grp.shelf{margin-left:auto;border:2px dashed rgba(255,250,240,.7);background:rgba(58,35,29,.25);padding:1px 4px;border-radius:10px}
.grp.shelf .hn{background:rgba(255,250,240,.92)}
.grp.land .pl{animation:kk-land .35s ease-out both}
.ctr .none{white-space:nowrap;font-size:14px;font-weight:700;color:#fff6e0;text-shadow:0 1px 2px rgba(0,0,0,.55);align-self:center;padding:0 6px}
@keyframes kkpulse{50%{transform:scale(1.08)}}
.slot{flex:0 0 var(--sl,46px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.slot .sbox{position:relative;width:var(--sl,46px);height:calc(var(--sl,46px)*1.4);display:flex;align-items:center;justify-content:center}
.slot .sbox.empty{border:2px dashed rgba(74,42,34,.5);border-radius:9px;font-weight:900;font-size:15px;color:rgba(74,42,34,.65)}
.slot .sbox.empty.mine{border-color:#e0a31c;color:#9a6a05;animation:kkpulse 1.6s ease-in-out infinite}
.slot .sbox>svg{width:100%;height:100%;position:absolute;inset:0}
.slot .sbox .cv{position:absolute;inset:0}
.slot .sbox .cv>svg{width:100%;height:100%}
.slot .two{display:flex;gap:2px;align-items:center;position:relative}
.slot .st{font-size:13px;font-weight:800;line-height:1;white-space:nowrap;color:#4a2a22}
.slot .st.rd{color:#2d7a35}
/* ---- the belt with your hand ---- */
#beltz{flex:0 0 auto;position:relative;background:#2f1f1a;border-top:3px solid #1c1210;display:flex;flex-direction:column;min-width:0}
#beltz .lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:#f6e6c4;padding:2px 10px 0;gap:8px;min-height:20px;white-space:nowrap}
#beltz .lab span{overflow:hidden;text-overflow:ellipsis;min-width:0}
#beltw{position:relative;padding:8px 0 6px;overflow:hidden}
#beltw .kk-belt{position:absolute;left:0;right:0;bottom:6px;pointer-events:none}
#belt{position:relative;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:28px 10px 4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;justify-content:safe center;align-items:flex-end;min-height:calc(var(--hw)*1.4 + 42px)}
.hc{position:relative;flex:0 0 auto;border:0;background:transparent;padding:0;margin:0;cursor:pointer;font:inherit;transition:transform .16s ease;transform:translateY(0);width:var(--hw);height:calc(var(--hw)*1.4);border-radius:8px}
.hc>svg.kk-card{width:100%;height:100%}
.hc.sel{transform:translateY(-16px);filter:drop-shadow(0 0 7px #ffc83a) drop-shadow(0 6px 5px rgba(0,0,0,.5))}
.hc.rec::after{content:'';position:absolute;inset:-3px;border-radius:10px;border:3px solid #ff7a59;pointer-events:none}
.hc.locked{opacity:.55;filter:grayscale(.4);cursor:default}
.hc .gn{position:absolute;right:-5px;top:-9px;min-width:28px;height:26px;border-radius:13px;background:#d8f1c9;color:#1f6a28;border:2px solid #2d7a35;font-weight:900;font-size:14px;line-height:22px;text-align:center;padding:0 4px;z-index:3;pointer-events:none}
.hc .gn.z{background:#efe3c8;color:#6b5646;border-color:#a8967a}
.hc .pn{position:absolute;left:-4px;top:-8px;width:24px;height:24px;border-radius:12px;background:#e5553a;color:#fff;border:2px solid #fff;font-weight:900;font-size:14px;line-height:20px;text-align:center;z-index:3}
.hc.back{cursor:default}
.hc.ent-pass{animation:entPass .75s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--k,0)*40ms)}
.hc.ent-deal{animation:dealIn .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--k,0)*55ms)}
@keyframes dealIn{from{opacity:0;transform:translateX(-36px) scale(.9)}to{opacity:1;transform:none}}
@keyframes entPass{from{opacity:0;transform:translateX(70vw)}to{opacity:1;transform:none}}
.beltnote{color:#f6e6c4;font-size:14px;font-weight:700;padding:14px 10px;text-align:center;align-self:center;width:100%}
/* ---- dock ---- */
.gx-dock{background:var(--paper);color:var(--ink);border-left:3px solid var(--wood2)}
.gx-dock-head{background:var(--paper2);border-bottom:1px solid rgba(0,0,0,.15)}
.gx-dock-body{display:flex;flex-direction:column;gap:7px;padding:8px;min-height:0}
.gx-dock .gx-ibtn{color:var(--ink);background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.2)}
#dockbody>*{flex-shrink:0}
#promptDock{min-height:2.7em}
#prompt.mine{color:#b5361c}
html.ph.ph-p #prompt,html.ph.ph-p #prompt.mine{color:#fbf0da}
#rt{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
#rt svg{flex:0 0 auto}
#roster{display:flex;flex-wrap:wrap;gap:5px}
.chip{flex:1 1 140px;min-height:44px;border:2px solid #9c8a68;background:#fff8e6;border-radius:10px;padding:2px 6px;display:flex;align-items:center;gap:6px;cursor:pointer;text-align:left;font-size:13px;line-height:1.15;min-width:44px}
.chip .cav{width:30px;height:30px;flex:0 0 auto}
.chip .cav svg{width:100%;height:100%}
.chip .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.chip .ct b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.chip .ct i{font-style:normal;font-size:13px;opacity:.85;white-space:nowrap}
.chip.me{box-shadow:inset 0 0 0 1px var(--ink)}
.chip.wt{background:#ffe9a8;border-color:#c98a10}
.chip.rd{background:#dcefc9;border-color:#3f9a4a}
.chip .tk{font-weight:900;color:#2d7a35}
#selinfo{display:flex;gap:10px;align-items:flex-start;background:#fff8e6;border:2px solid rgba(74,42,34,.35);border-radius:12px;padding:7px 8px;min-height:60px}
#selinfo .sc1{flex:0 0 auto}
#selinfo .si{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:1.3}
#selinfo .si b{font-size:16px}
#selinfo .si .sm{font-size:13px}
#selinfo.idle{background:transparent;border-style:dashed;align-items:center}
#acts{display:flex;gap:6px;flex-wrap:wrap}
#cheat{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.25;border-top:1px solid rgba(74,42,34,.25);padding-top:6px}
#cheat b{font-size:14px}
#cheat .cr{display:flex;align-items:center;gap:7px;min-height:28px}
#cheat .cr svg{width:26px;height:26px;flex:0 0 auto}
html.ph #cheat{display:none}
#acts .btn{flex:1 1 90px}
.btn{appearance:none;border:2px solid var(--ink);background:linear-gradient(180deg,#f0725a,#d9452c);color:#fff;font-weight:800;font-size:15px;min-height:44px;min-width:44px;padding:4px 14px;border-radius:12px;cursor:pointer;text-shadow:0 1px 1px rgba(0,0,0,.4);line-height:1.15}
.btn.alt{background:linear-gradient(180deg,#fff8e6,#f0dcb2);color:var(--ink);text-shadow:none}
.btn.on{background:linear-gradient(180deg,#ffd25a,#e0a31c);color:#3a231d;text-shadow:none}
.btn.go{background:linear-gradient(180deg,#58b564,#2f8a3a)}
.btn.dis,.btn:disabled{opacity:.45;cursor:default}
.btn.small{min-height:44px}
.btn:focus-visible,.hc:focus-visible,.grp:focus-visible,.chip:focus-visible,.sh:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ppop,.pcard{position:absolute;left:0;right:0;background:var(--paper);display:flex;flex-direction:column;z-index:12;box-shadow:0 -4px 14px rgba(0,0,0,.35);border-top:3px solid var(--wood2)}
.ppop{top:0;bottom:0}
.pcard{top:0;bottom:0;z-index:14}
.ph-head{display:flex;align-items:center;gap:6px;padding:6px 8px 4px 12px;flex:0 0 auto;background:var(--paper2);border-bottom:1px solid rgba(0,0,0,.15)}
.ph-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}.ph-t b{font-size:16px}.ph-t span{font-size:13px;opacity:.75}
.px{appearance:none;border:2px solid var(--ink);background:#fff8e6;border-radius:10px;width:44px;height:44px;font-size:26px;line-height:1;cursor:pointer;flex:0 0 auto}
.ph-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ph-body p{margin:0;font-size:14px;line-height:1.35}.sm{font-size:13px;opacity:.88;line-height:1.3}
.cwrap{display:flex;gap:10px;align-items:flex-start}.cardbox{flex:0 0 auto}.cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dotted rgba(0,0,0,.2);align-items:center}.kv b{text-align:right}
.why{background:#ffeab0;border-left:4px solid var(--gold);padding:6px 8px;font-size:13px;line-height:1.35;border-radius:4px}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}.cbtns .btn{flex:1 1 120px}
.rtabs,.mbt{display:flex;gap:6px;flex-wrap:wrap}.rhead{display:flex;gap:10px;align-items:center}
.rrow{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0;align-items:center}
.logl .ll{font-size:14px;padding:3px 0;border-bottom:1px dotted rgba(0,0,0,.2)}.lt{display:inline-block;min-width:34px;opacity:.6;font-size:13px}
.rules h3{margin:12px 0 4px;font-size:1.08rem}.rules p,.rules li{font-size:14.5px;line-height:1.45}.rules ul{padding-left:20px;margin:4px 0}
.rcard{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dotted rgba(0,0,0,.25)}
.rcard .rt{flex:1;min-width:0;font-size:14px;line-height:1.35}.rcard .rt b{font-size:15px}
.mrow{margin:0 0 12px}.mrow .lbl{font-weight:800;margin-bottom:4px}
.tinyc{display:inline-flex;gap:3px;align-items:center;flex-wrap:wrap}
.grpl{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.gtag{display:inline-flex;align-items:center;gap:4px;background:#fff8e6;border:1px solid rgba(74,42,34,.35);border-radius:9px;padding:2px 6px 2px 2px;font-size:13px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2a1c10;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw;font-weight:700}
#toast.on{opacity:1}
/* hand packets flying around the table during a pass */
.pkt{position:fixed;z-index:30;pointer-events:none;width:30px;height:42px;display:flex;align-items:center;justify-content:center}
.pkt svg{position:absolute;inset:0;width:100%;height:100%}
.pkt b{position:relative;font-size:14px;color:#fff;font-weight:900;text-shadow:0 0 3px #000,0 0 3px #000}
.flyc{position:fixed;z-index:31;pointer-events:none}
.flyc svg{width:100%;height:100%}
/* ---- start screen ---- */
#start{position:fixed;inset:0;z-index:60;overflow:auto;background:radial-gradient(ellipse at 50% 15%,#f6d99a,#d9a35c 55%,#8f5a33);display:flex;align-items:flex-start;justify-content:center;padding:12px}
.scard{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px;width:min(580px,100%);display:flex;flex-direction:column;gap:12px;margin:auto;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.scard h1{margin:0;font-size:2rem;display:flex;align-items:center;gap:10px;font-weight:900}.scard h1>span{width:44px;height:44px;display:inline-block}.scard h1 svg{width:100%;height:100%}
.scard .tag{margin:0;font-size:15px}
.chefs{display:flex;gap:6px;justify-content:center}.chefs svg{width:46px;height:46px}
.sbtn{appearance:none;border:2px solid var(--ink);background:linear-gradient(180deg,#fff8e6,#f0dcb2);border-radius:12px;padding:8px 12px;min-height:56px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:15px}
.sbtn b{font-size:16px}.sbtn span{font-size:13px;opacity:.85}
.sbtn.big{background:linear-gradient(180deg,#f0725a,#d9452c);color:#fff}.sbtn.big span{opacity:.95}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:flex;flex-direction:column;gap:6px}.seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.seg .lbl{flex:0 0 118px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.seg .lbl svg{width:26px;height:26px}
.chipb{appearance:none;border:2px solid var(--ink);background:#fff8e6;border-radius:18px;min-height:44px;min-width:44px;padding:4px 12px;cursor:pointer;font-size:14px;font-weight:700}.chipb.on{background:var(--gold);font-weight:900}
.srow2{display:flex;gap:8px;flex-wrap:wrap}
/* ---- round / game end ---- */
#rs{position:fixed;inset:0;z-index:55;background:rgba(40,22,16,.62);display:flex;align-items:center;justify-content:center;padding:8px}
.rsbox{background:var(--paper);border:3px solid var(--ink);border-radius:16px;width:min(560px,100%);max-height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 44px rgba(0,0,0,.55);overscroll-behavior:contain}
.rsbox h2{margin:0;font-size:1.35rem;font-weight:900;display:flex;gap:8px;align-items:center}
.cat{width:100%;border-collapse:collapse;font-size:14px}
.cat th,.cat td{padding:3px 4px;text-align:center;border-bottom:1px dotted rgba(74,42,34,.3)}
.cat th{font-weight:800;font-size:13px}
.cat th svg{width:30px;height:30px;margin:0 auto}
.cat td:first-child,.cat th:first-child{text-align:left;font-weight:800}
.cat td.n{font-weight:900;font-size:16px;min-width:40px}
.cat td.n.z{opacity:.4}
.cat tr.tot td{border-top:2px solid var(--ink);font-size:17px}
.cat tr.cur td{background:#fff3c8}
.cat .sub{display:block;font-size:13px;font-weight:600;opacity:.8}
.cat .lc{display:flex;align-items:center;gap:6px}.cat .lc svg{width:26px;height:26px;flex:0 0 auto}
.padw{display:flex;justify-content:center}.padw svg{max-width:100%;height:auto}
.maki{background:#fff8e6;border:1px solid rgba(74,42,34,.3);border-radius:10px;padding:6px 8px;font-size:14px;line-height:1.35}
.win{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#ffe9a8,#f6c94a);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-weight:900;font-size:17px}
.win svg{width:52px;height:52px;flex:0 0 auto}
.win .crown{width:34px;height:34px}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:conf 2.6s linear infinite}
@keyframes conf{to{transform:translateY(110vh) rotate(540deg)}}
/* ---- online play ---- */
#netst{display:inline-flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0;max-width:36vw;background:rgba(255,255,255,.1);color:#fbf0da;border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:3px 10px;font-size:13px;white-space:nowrap;cursor:pointer;min-height:30px}
#netst .nl{overflow:hidden;text-overflow:ellipsis}#netst .ns{display:none}
.nd{width:10px;height:10px;border-radius:50%;background:#e0a31c;flex:0 0 auto}.nd.ok{background:#7fd65a}.nd.bad{background:#e0583c}
.nst.ok{color:#2e6a1c}.nst.bad,.warn{color:#a0301c;font-weight:800}
#netbox{position:fixed;inset:0;z-index:70;background:rgba(30,18,12,.62);display:flex;align-items:center;justify-content:center;padding:10px}
.nbox{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:14px;width:min(480px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.nbox h2{margin:0;font-size:1.3rem;padding-right:50px}.nbox h3{margin:2px 0 0;font-size:1rem}.nbox p{margin:0;font-size:14px}
.nbox .lbx{position:absolute;right:8px;top:8px}
.nbox .code{font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase}
.invrow,.nrow,.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.invrow input,.nrow input{flex:1 1 150px;min-width:0;min-height:44px;font:inherit;font-size:16px;padding:4px 10px;border:2px solid var(--ink);border-radius:10px;background:#fffdf5;color:var(--ink)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}.plist li{display:flex;align-items:center;gap:6px;font-size:14px;min-height:28px}.plist li svg{width:26px;height:26px}
.online{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:rgba(255,255,255,.35)}
.online summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
.online .nrow{margin:6px 0}.online p{margin:4px 0}
.muted{opacity:.75}
@media (max-width:999px){html:not(.ph) .gx-dock{max-height:43dvh}}

html.ph #start{padding:6px}
html.ph .scard{padding:10px}

html.ph .seg .lbl{flex-basis:96px}
html.ph #selinfo{padding:4px 6px;gap:8px;min-height:0}
html.ph #selinfo .si{font-size:13px;gap:2px}

html.ph .sh .sc{font-size:13px}

#acts .btn,.cbtns .btn{flex-shrink:0}
.ph-body .cbtns{position:sticky;bottom:-10px;background:var(--paper);padding:6px 0 4px;margin-top:auto;z-index:2}
.rsbox .cbtns{position:sticky;bottom:-12px;background:var(--paper);padding:6px 0 4px;z-index:2}

<script>
// ===== Board-first shell: dock toggle, sheet sizing, closable popups (drawers) =====
const GX={key:'gx',open:null,
  init(o){this.key=o&&o.key||'gx';document.documentElement.classList.add('gx');const app=document.querySelector('.gx-app');this.app=app;
    let min=false;try{min=localStorage.getItem(this.key+'_dockmin')==='1'}catch(e){}if(min)app.classList.add('gx-dock-min');
    if(!document.querySelector('.gx-scrim')){const s=document.createElement('div');s.className='gx-scrim';s.addEventListener('click',()=>this.close());document.body.appendChild(s);this.scrim=s}
    document.addEventListener('click',e=>{const t=e.target.closest('[data-gx]');if(!t)return;const a=t.dataset.gx;
      if(a==='dock')this.toggleDock();else if(a==='sheet')this.cycleSheet();else if(a==='close')this.close();else this.toggle(a)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&this.open){this.close();e.stopImmediatePropagation()}},true);
    // resize hook for boards
    const b=document.querySelector('.gx-board');if(b&&window.ResizeObserver)new ResizeObserver(()=>{for(const f of this._rs)try{f(b.clientWidth,b.clientHeight)}catch(e){}}).observe(b)},
  _rs:[],onResize(f){this._rs.push(f)},
  boardSize(){const b=document.querySelector('.gx-board');return b?{w:b.clientWidth,h:b.clientHeight}:{w:innerWidth,h:innerHeight}},
  toggleDock(force){const min=force!=null?!force:!this.app.classList.contains('gx-dock-min');this.app.classList.toggle('gx-dock-min',min);this.app.classList.remove('gx-sheet-full');try{localStorage.setItem(this.key+'_dockmin',min?'1':'0')}catch(e){}},
  // phone sheet: min -> normal -> full -> min
  cycleSheet(){const a=this.app;if(a.classList.contains('gx-dock-min')){this.toggleDock(true)}else if(!a.classList.contains('gx-sheet-full'))a.classList.add('gx-sheet-full');else{a.classList.remove('gx-sheet-full');this.toggleDock(false)}},
  showDock(){if(this.app&&this.app.classList.contains('gx-dock-min'))this.toggleDock(true)},
  toggle(id){if(this.open===id)this.close();else this.show(id)},
  show(id){const d=document.getElementById(id);if(!d)return;if(this.open&&this.open!==id){const o=document.getElementById(this.open);if(o)o.classList.remove('on')}
    this.open=id;d.classList.add('on');this.scrim&&this.scrim.classList.add('on');this._back=document.activeElement;
    for(const b of document.querySelectorAll('[data-gx="'+id+'"]'))b.setAttribute('aria-expanded','true');
    const f=d.querySelector('.gx-x');if(f)f.focus({preventScroll:true});if(this.onShow)this.onShow(id)},
  close(){if(!this.open)return;const id=this.open;const d=document.getElementById(this.open);if(d)d.classList.remove('on');for(const b of document.querySelectorAll('[data-gx="'+this.open+'"]'))b.setAttribute('aria-expanded','false');this.open=null;this.scrim&&this.scrim.classList.remove('on');if(this._back&&this._back.focus)this._back.focus({preventScroll:true});if(this.onClose)this.onClose(id)},
  // build a drawer shell around a body element: <div class=gx-drawer id><head><h2>title</h2><button.gx-x></head><body/></div>
  drawer(id,title,bodyEl,wide){let d=document.getElementById(id);if(!d){d=document.createElement('section');d.id=id;d.className='gx-drawer'+(wide?' wide':'');d.setAttribute('role','dialog');d.setAttribute('aria-label',title);
      d.innerHTML=`<div class="gx-drawer-head"><h2></h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body"></div>`;document.body.appendChild(d)}
    d.querySelector('h2').textContent=title;if(bodyEl){const b=d.querySelector('.gx-drawer-body');if(bodyEl.parentNode!==b){b.innerHTML='';b.appendChild(bodyEl)}}return d}};

<script>
// ---------- PerfHUD: one speed tool for every game on the shelf ----------
// 1. an optional overlay (FPS, frame time avg/p95, level, draws/triangles, heap, dpr, render size): menu "Show speed", ?fps=1 or F9
// 2. "Test speed": 2 s per graphics level with a slow camera orbit, then a result card with Apply and Copy report
// 3. the standard auto step-down: p95 > 50 ms for 3 s steps down a level, then the pixel ratio (floor 0.6);
//    10 s with p95 work < 14 ms steps back up, at most once a minute; a level picked by hand is never changed
// 4. the idle-frame saver: nothing animating and no input for 1.5 s -> PerfHUD.raf() runs at 10 fps (or only on demand)
// Plain script, no modules. Safe in jsdom and without WebGL or requestAnimationFrame: nothing runs and the overlay never shows.
(function(root){
  'use strict';
  const HAS_DOM=typeof window!=='undefined'&&typeof document!=='undefined';
  const UA=(typeof navigator!=='undefined'&&navigator.userAgent)||'';
  const JSDOM=/jsdom/i.test(UA);
  const now=()=>(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  const RAF=HAS_DOM&&!JSDOM&&typeof window.requestAnimationFrame==='function'?window.requestAnimationFrame.bind(window):null;
  const LIVE=!!RAF;
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const NAMES={high:'High',medium:'Medium',med:'Medium',low:'Low'};
  const WIN=2000;                         // stats window (ms)
  const RULE={down:50,downFor:3000,up:14,upFor:10000,upEvery:60000,grace:2000,prStep:.8,prFloor:.6,idleAfter:1500};

  // registered game hooks
  const H={game:'',renderer:null,levels:['high','medium','low'],setLevel:null,getLevel:null,orbit:null,isAuto:null,isAnimating:null,
    onPixelRatio:null,beforeTest:null,anchor:null,corner:'bl',idleMode:'throttle',idleFps:10,autoTop:null,names:null};
  let registered=false;
  // measurement
  let S=[],lastT=0,workAcc=0,workSeen=0,drawn=0,loopOn=false,lastEval=0,lastHud=0;
  // controller
  const C={slowSince:0,fastSince:0,lastUp:-1e9,grace:0,prCap:null,log:[]};
  // idle saver
  let idleOn=false,lastInput=now(),lastIdleDraw=0,pollT=0;const pending=new Set();
  // test
  let testing=false,testT0=0,testLen=0,collect=null;
  // ui
  let hudOn=false,hud=null,card=null,pill=null;

  // ---------- stats ----------
  function pct(a,p){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);return b[Math.min(b.length-1,Math.floor(p*(b.length-1)+.5))]}
  function stats(list){const L=list||S;const n=L.length;if(!n)return {n:0,fps:0,avg:0,p95:0,work:0,refresh:16.7};
    const dts=L.map(s=>s.dt),span=Math.max(1,L[n-1].t-L[0].t+L[0].dt);const ws=L.filter(s=>s.w>=0).map(s=>s.w);
    return {n,fps:n*1000/span,avg:dts.reduce((a,b)=>a+b,0)/n,p95:pct(dts,.95),work:ws.length?pct(ws,.95):-1,refresh:Math.max(4,pct(dts,.1))}}
  function levelName(l){return (H.names&&H.names[l])||NAMES[l]||String(l)}
  function curLevel(){try{return H.getLevel?H.getLevel():null}catch(e){return null}}

    '.phud-card{position:fixed;z-index:2147483001;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box;padding:14px 16px;border-radius:12px;'+
    'background:#12181e;color:#e9eef2;border:1px solid #3a4652;box-shadow:0 12px 40px rgba(0,0,0,.55);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}'+
    '.phud-card h3{margin:0 0 8px;font-size:16px}.phud-card table{width:100%;border-collapse:collapse;margin:4px 0 10px;font-variant-numeric:tabular-nums}'+

    if(idleOn&&!testing)L.push('<b>idle</b> · saving battery ('+(H.idleMode==='demand'?'on demand':H.idleFps+' fps')+')');
    else L.push('<b>'+Math.round(st.fps)+' fps</b>  '+st.avg.toFixed(1)+' / <span class="'+(st.p95>33?'bad':st.p95>20?'w':'')+'">'+st.p95.toFixed(1)+'</span> ms p95'+(st.work>=0?'  work '+st.work.toFixed(1):''));

<script>
// ---------- NetRoom: free peer-to-peer game rooms (WebRTC through Trystero, MIT) ----------
// Players find each other through public Nostr relays; after that the moves go browser to browser.
// The room object has the same shape as the claude.ai "room" capability, so a game's net code runs on either:
//   lobby.join(name) -> room {presence(o), on(type,fn), emit(type,data), onPeers(fn), onConnection(fn), leave()}
//   messages: {peer, data, isMe:false, by}   peers: {peer, isMe, sameTab, kind:'viewer', presence, by, guest:false}
// Tests can point it at a local relay with window.NETROOM_RELAYS=['ws://127.0.0.1:17700'].
const NetRoom=(()=>{
  const APP='game-night-shelf-v1';
  const rand=n=>{const a='abcdefghijkmnpqrstuvwxyz23456789',u=new Uint8Array(n);crypto.getRandomValues(u);return [...u].map(x=>a[x%a.length]).join('')};
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  let myUid=null;
  function uid(){if(myUid)return myUid;myUid=store.get('gns-uid');if(!myUid){myUid='p'+rand(15);store.set('gns-uid',myUid)}return myUid}
  function name(){return (store.get('gns-name')||'').slice(0,24)}
  function setName(n){n=String(n||'').replace(/[<>&"]/g,'').trim().slice(0,24);store.set('gns-name',n);return n}
  function available(){return typeof Trystero!=='undefined'&&typeof RTCPeerConnection!=='undefined'&&!!(window.crypto&&crypto.subtle)}
  // invite codes: 5 letters/digits without look-alikes
  function newCode(){return rand(5)}
  function cleanCode(c){return String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10)}
  // one room per page: joining again (a retry, or another code) first closes the old room, so the host
  // can't stay connected to an abandoned copy while the game listens on the new one
  let active=null;
  function lobby(game){return {join:async roomName=>{if(active){const old=active;active=null;try{await old.leave()}catch(e){}await new Promise(r=>setTimeout(r,250))}
    const r=makeRoom(game,String(roomName));active=r;return r}}}
  function makeRoom(game,roomName){
    const cfg={appId:APP,password:game+'/'+roomName,relayConfig:{redundancy:6,warnOnRelayFailure:false}};
    if(window.NETROOM_RELAYS)cfg.relayConfig.urls=window.NETROOM_RELAYS;
    if(window.NETROOM_ICE)cfg.rtcConfig={iceServers:window.NETROOM_ICE};
    if(window.NETROOM_TURN)cfg.turnConfig=window.NETROOM_TURN;
    const tr=Trystero.joinRoom(cfg,game+'/'+roomName);
    const me=Trystero.selfId,by=uid();
    let pres={name:name()},left=false;
    const remote=new Map(),handlers={},peerFns=[],connFns=[];
    const gA=tr.makeAction('g'),pA=tr.makeAction('p');
    const entry=(p,v)=>({peer:p,isMe:false,sameTab:false,kind:'viewer',presence:v.presence,by:v.by,guest:false});
    const list=()=>[{peer:me,isMe:true,sameTab:true,kind:'viewer',presence:pres,by,guest:false},...[...remote].map(([p,v])=>entry(p,v))];
    const fire=(joined,gone)=>{const ch={peers:list(),joined,left:gone};peerFns.forEach(f=>{try{f(ch)}catch(e){console.error(e)}})};
    const sendPres=target=>{try{pA.send({pr:pres,by},target?{target}:undefined)}catch(e){}};
    const gone=new Set();
    tr.onPeerJoin=p=>{if(left)return;gone.delete(p);sendPres(p)};
    tr.onPeerLeave=p=>{if(left)return;gone.add(p);const v=remote.get(p);if(!v)return;remote.delete(p);fire([],[entry(p,v)])};
    pA.onMessage=(d,info)=>{const p=info&&info.peerId;if(left||!p||gone.has(p)||!d||typeof d!=='object')return;
      const pr=d.pr&&typeof d.pr==='object'&&!Array.isArray(d.pr)?Object.assign({},d.pr):{};if('name' in pr)pr.name=String(pr.name||'').replace(/[<>&"]/g,'').slice(0,24);
      const v={presence:pr,by:typeof d.by==='string'?d.by.slice(0,40):null};
      const old=remote.get(p);remote.set(p,v);if(!old){sendPres(p);fire([entry(p,v)],[]);return}
      // presence is re-sent every few seconds in case one was lost; only a real change is reported
      if(JSON.stringify(old)!==JSON.stringify(v))fire([],[])};
    gA.onMessage=(d,info)=>{const p=info&&info.peerId;if(left||!p||!d||typeof d.t!=='string')return;
      // a message can arrive just before that peer's presence does
      const v=remote.get(p)||{presence:{},by:null};(handlers[d.t]||[]).forEach(f=>{try{f({peer:p,data:d.d,isMe:false,by:v.by})}catch(e){console.error(e)}})};
    setTimeout(()=>connFns.forEach(f=>f(true)),0);
    const hb=setInterval(()=>{if(!left)sendPres()},5000);
    // closing the tab tells the others at once, instead of after WebRTC's ~10 s timeout
    const bye=()=>{if(left)return;left=true;clearInterval(hb);try{tr.leave()}catch(e){}};window.addEventListener('pagehide',bye);
    return {
      self:me,
      presence(o){pres=Object.assign({},pres,o||{});sendPres();fire([],[]);return Promise.resolve()},
      on(t,f){(handlers[t]=handlers[t]||[]).push(f)},
      emit(t,d){if(left)return Promise.resolve();try{return Promise.resolve(gA.send({t,d})).then(()=>{},()=>{})}catch(e){return Promise.resolve()}},
      sendTo(peer,t,d){if(left)return Promise.resolve();try{return Promise.resolve(gA.send({t,d},{target:peer})).then(()=>{},()=>{})}catch(e){return Promise.resolve()}},
      onPeers(f){peerFns.push(f);setTimeout(()=>f({peers:list(),joined:[],left:[]}),0)},
      onConnection(f){connFns.push(f)},
      peerCount(){return remote.size},
      leave(){window.removeEventListener('pagehide',bye);left=true;clearInterval(hb);try{return Promise.resolve(tr.leave())}catch(e){return Promise.resolve()}}};
  }
  // an invite link opens the game with the code filled in: …/game/#join-abcde
  function linkCode(){const m=/^#join-([a-z0-9]{3,10})$/i.exec(location.hash||'');return m?m[1].toLowerCase():''}
  function inviteLink(code){return location.href.split('#')[0]+'#join-'+code}
  return {available,lobby,uid,name,setName,newCode,cleanCode,linkCode,inviteLink};
})();

</script>
<script>
/* KKKit - Kaiten Kitchen art kit. "Conveyor-belt diner": gouache-painted plates, soft rim light, our own faces.
   100% procedural SVG/CSS (no external images). Plain script, global KKKit. */
(function (root) {
'use strict';
const INK = '#4a2a22';          // warm brown ink (never pure black)
const CREAM = '#fbf0da', CREAM2 = '#f1dfbd', WOOD = '#a8693c', WOOD_D = '#6d3f22';
const FONT = "'Nunito','Varela Round','Trebuchet MS','Segoe UI',system-ui,-apple-system,'DejaVu Sans',Verdana,sans-serif";
const NS = 'http://www.w3.org/2000/svg';
const f1 = n => Math.round(n * 10) / 10;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function hash(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = hash(seed) || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function hex(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)]; }
function toHex(a) { return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hex(a), B = hex(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); }
const lighten = (c, t) => mix(c, '#ffffff', t), darken = (c, t) => mix(c, '#2a120c', t);

// ------------------------------------------------------------------ card types
// c = plate colour (distinct hue per food type), rim = rim ornament, rule = badge icon name

    h('div.srow2', hasSave() ? h('button.btn', { 'data-a': 'loadsave', type: 'button' }, 'Continue saved game') : null, h('button.btn.alt', { 'data-a': 'rules', type: 'button' }, 'How to play')));

function showStart() { try { GX.close(); } catch (e) { } closePop(); UI.cards = []; const pc = $('#pc'); if (pc) { pc.hidden = true; pc.innerHTML = ''; } closeRS(); clearTimeout(UI.tm); renderStart(); }
// ---------- events ----------
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-a],[data-start]'); const pop = $('#ppop');
  if (!t) { if (UI.pop && pop && !pop.contains(ev.target) && !ev.target.closest('#pc,.gx-drawer,#rs')) closePop(); return; }
  const a = t.dataset.a, d = t.dataset;

    case 'hint': hint(); break;

    case 'rtab': renderRival(+d.seat); break;

    case 'cont': nextCard(); break;
    case 'take': takeDevice(); break;
    case 'rsnext': afterRound(UI.rsInfo && UI.rsInfo.ge); break;
    case 'rsskip': skipCount(); break;
    case 'rsclose': closeRS(); break;
    case 'again': { const m = UI.mode, c = UI.cfg || {}; UI.cards = []; closeRS(); newGame(m === 'net' ? 'vs' : m, { np: c.np, level: c.level, lv: c.lv }); break; }
    case 'menu': showStart(); break;
    case 'start': newGame(d.m); break;
    case 'guided': newGame('guided'); break;
    case 'opt': { const o = UI.opt = UI.opt || Object.assign({}, DEF, { lv: DEF.lv.slice() }); o[d.k] = isNaN(+d.v) ? d.v : +d.v; if (d.k === 'level') o.lv = [d.v, d.v, d.v, d.v]; renderStart(); break; }
    case 'lv': { const o = UI.opt = UI.opt || Object.assign({}, DEF, { lv: DEF.lv.slice() }); o.lv = (o.lv || DEF.lv).slice(); o.lv[+d.seat - 1] = d.v; renderStart(); break; }
    case 'rules': GX.show('rulesd'); break;
    case 'save': toast(save() ? 'Game saved.' : 'Could not save.'); break;
    case 'loadsave': if (!loadSave()) toast('No saved game.'); break;
    case 'speed': AIDELAY = +d.v; savePrefs(); renderMenu(); break;
    case 'guide': UI.coach.level = d.v; UI.coach.keep = d.v === 'full'; renderMenu(); break;
    case 'hints': UI.prefs.hint = !UI.prefs.hint; savePrefs(); renderMenu(); if (G) render(); break;
    case 'tap2': UI.prefs.tap2 = !UI.prefs.tap2; savePrefs(); renderMenu(); if (G) render(); break;
    case 'sound': UI.prefs.sound = !UI.prefs.sound; savePrefs(); try { if (window.GA) GA.setSfx(UI.prefs.sound); } catch (e) { } renderMenu(); break;
    case 'music': UI.prefs.music = !UI.prefs.music; savePrefs(); try { if (window.GA) GA.setMusic(UI.prefs.music); } catch (e) { } sndMusic(); renderMenu(); break;

});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (UI.pop) closePop(); else if (UI.rsOpen && UI.mode && G && G.phase === 'over' && UI.overShown) closeRS(); } });
// ---------- phone mode ----------
function applyPhone() {
  const q = /[?&]phone=(\d)/.exec(location.search); const w = innerWidth, hh = innerHeight, short = Math.min(w, hh);
  let ph = short <= 500 || (window.matchMedia && matchMedia('(pointer:coarse)').matches && short <= 600);
  if (q) ph = q[1] === '1';
  const r = document.documentElement.classList, was = r.contains('ph');
  r.toggle('ph', ph); document.documentElement.style.setProperty('--dockh', Math.max(150, Math.min(206, Math.round(hh * .26))) + 'px'); r.toggle('ph-p', ph && w < hh); r.toggle('ph-l', ph && w >= hh);
  placePrompt(); if (was !== ph) { if (G && UI.started) render(); }

let rzT = 0;
function onResize() { clearTimeout(rzT); rzT = setTimeout(() => { applyPhone(); if (G && UI.started) render(); }, 60); }
// ---------- boot ----------
function boot() {

  GX.drawer('rulesd', 'How to play', buildRules(), true);
  GX.drawer('logd', 'Log', h('div#logbody'));
  GX.drawer('rivald', 'Diners and scores', h('div#rivalbody'));
  GX.drawer('setd', 'Menu', h('div#setbody'));

  loadPrefs(); applyPhone();
  addEventListener('resize', onResize); addEventListener('orientationchange', onResize);
  const bd = $('#board'); if (window.ResizeObserver) new ResizeObserver(() => { if (G && UI.started) { clearTimeout(rzT); rzT = setTimeout(() => { if (G && UI.started) render(); }, 40); } }).observe(bd);
  try { if (window.GA) { const A = typeof GA_DATA !== 'undefined' ? GA_DATA : {}; GA.init({ sfx: A.sfx || {}, music: A.music || {}, key: 'kk' }); GA.setSfx(UI.prefs.sound); GA.setMusic(UI.prefs.music); } } catch (e) { }
  try { if (window.PerfHUD && PerfHUD.register) PerfHUD.register({ game: 'Kaiten Kitchen', anchor: '.gx-board', corner: 'tl', isAnimating: () => !!UI.busy, idleMode: 'demand' }); } catch (e) { }

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
// ===================== part 6: sound (shared gameaudio samples; silent without Web Audio) =====================
// SND_MAP: one line per event. s:null falls back to nothing (the sample may be re-tuned by ear later).
const SND_MAP = { click: { s: 'click', vol: .5 }, clink: { s: 'clink', vol: .7 }, slide: { s: 'slide', vol: .55 }, pass: { s: 'pass', vol: .6 }, pick: { s: 'pick', vol: .6 }, cloche: { s: 'cloche', vol: .65 }, coin: { s: 'coin', vol: .6 },
  tick: { s: 'tick', vol: .4 }, round: { s: 'round', vol: .7 }, win: { s: 'win', vol: .8 }, error: { s: 'error', vol: .5 } };
function snd(name, o) {
  try {
    if (UI.prefs && UI.prefs.sound === false) return;
    const m = SND_MAP[name] || { s: name, vol: 1 }; if (!m.s || !window.GA || !GA.has(m.s)) return;
    const oo = Object.assign({}, o || {}); oo.vol = (oo.vol != null ? oo.vol : 1) * (m.vol != null ? m.vol : 1); GA.play(m.s, oo);
  } catch (e) { }
}
function sndMusic() {
  try {
    if (!window.GA) return;
    if (UI.prefs.music === false || !G || !UI.started) { GA.music(null); GA.stopLoop && GA.stopLoop('belt'); return; }
    GA.music('main', { vol: .32 }); if (GA.loop) GA.loop('belt', { vol: .16, fade: 1.5 });
  } catch (e) { }
}
document.addEventListener('click', e => { const t = e.target.closest('button'); if (t && !t.disabled && !t.matches('.hc,[data-a=serve],[data-a=rsnext]')) snd('click'); }, true);
