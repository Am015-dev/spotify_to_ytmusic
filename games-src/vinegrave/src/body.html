<div class="gx-app">
<header class="gx-bar">
  <h1><span class="ic" aria-hidden="true"><svg><use href="#s-leaf"/></svg></span><span class="tt">Vinegrave</span></h1>
  <span id="barstat"></span>
  <span class="gx-sp"></span>
  <button class="gx-ibtn gxh-bulb" id="bulbbtn" data-help type="button" aria-label="Hint"></button>
  <button class="gx-ibtn" data-gx="scored" aria-expanded="false" aria-label="Scores and players" title="Scores"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Scores</span></button>
  <button class="gx-ibtn" data-gx="logd" aria-expanded="false" aria-label="Log" title="Log"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h6M10 12h6M10 16h4"/></svg><span>Log</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z M12 6v13"/></svg><span>Rules</span></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="The island"><div id="bd" data-art="board-map">
    <div id="opp" role="group" aria-label="Explorers"></div>
    <div id="vtabs" role="tablist" aria-label="Board areas"><button type="button" role="tab" data-a="tab" data-t="map">Map</button><button type="button" role="tab" data-a="tab" data-t="row">Market</button><button type="button" role="tab" data-a="tab" data-t="track">Research</button></div>
    <div id="mapw"><div id="map" role="group" aria-label="Dig sites"></div><button id="track" type="button" data-art="track-bg" aria-label="Research track"></button></div>
    <div id="rowwrap"><div id="row" role="group" aria-label="Market: items and artifacts"></div></div>
  </div></main>
  <aside class="gx-dock" id="dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-grab" data-gx="sheet"></span><span class="gx-dt" id="docktitle">Your turn</span><button class="gx-ibtn" data-gx="dock" aria-label="Hide panel">&#8677;</button></div>
    <div class="gx-dock-body" id="dockbody">
      <div id="prompt" aria-live="polite"></div>
      <div id="qbox" hidden></div>
      <div id="myres"></div>
      <div id="hand" role="group" aria-label="Your hand"></div>
      <div id="acts"></div>
      <div id="extra"></div>
    </div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock">&#9776; Panel</button>
</div>
</div>
<div id="start" class="ov" data-art="title-bg" hidden></div>
<div id="pass" class="ov" hidden></div>
<div id="rs" class="ov" hidden></div>
<div id="iscrim" hidden></div>
<div id="insp" role="dialog" aria-label="Details" hidden></div>
<div id="fx" hidden></div>
<div id="toast" role="status"></div>
<div id="tbanner" aria-live="polite"></div>
