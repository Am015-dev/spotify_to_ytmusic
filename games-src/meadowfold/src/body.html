<body>
<div class="gx-app">
<header class="gx-bar">
  <h1><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 20 L9 7 L13 13 L16 9 L22 20Z" fill="#9fcf8f" stroke="#fffaf0" stroke-width="1.4" stroke-linejoin="round"/><circle cx="17" cy="6" r="3" fill="#f2d675" stroke="#fffaf0" stroke-width="1.2"/></svg></span><span class="tt">Meadowfold</span></h1>
  <span class="gx-sp"></span>
  <button class="gx-ibtn" id="hintB" type="button" aria-label="Hint" title="Hint"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3zM9.5 20h5"/></svg><span>Hint</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z M12 6v13"/></svg><span>Rules</span></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="Your valley" data-board>
    <div id="topbar"><div id="barstat" role="group" aria-label="Players"></div><div id="endw" role="status" hidden></div></div>
    <nav id="rail" aria-label="Panels">
      <button type="button" class="rb" id="railRow" data-pp="row" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 4c-3 0-5 2-5 4 0 3 3 4 3 7h4c0-3 3-4 3-7 0-2-2-4-5-4zM10 19h4M7 11 4 12M17 11l3 1"/></svg><span>Animals</span><i class="bd" id="bdRow"></i></button>
      <button type="button" class="rb" id="railMine" data-pp="mine" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 9h6M9 13h6"/></svg><span>My cards</span><i class="bd" id="bdMine"></i></button>
      <button type="button" class="rb" id="railScore" data-pp="score" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Scoring</span></button>
      <button type="button" class="rb" id="railTot" data-gx="scored" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6 4h12v4a6 6 0 0 1-12 0zM9 20h6M12 14v6"/></svg><span>Totals</span></button>
    </nav>
    <section id="strip" aria-label="Animal cards"></section>
    <div id="vbanner" hidden></div>
    <div id="mapw"><svg id="map" role="img" aria-label="Your valley board"></svg><div id="whyl" aria-live="polite"></div></div>
    <div id="tray"><div id="line" aria-live="polite"></div><div id="central" role="group" aria-label="Token pockets and your tokens"></div></div>
    <div id="seats" hidden></div>
  </main>
  <div id="pscrim" data-ppx></div>
  <aside class="gx-dock pp" id="dock" aria-label="Animal cards" role="dialog">
    <div class="pph"><h2 id="ppt">Animals</h2><button type="button" class="ppx" data-ppx aria-label="Close panel">&times;</button></div>
    <div class="gx-dock-body" id="dockbody"></div>
  </aside>
  <aside class="pp" id="scorep" aria-label="How scoring works" role="dialog">
    <div class="pph"><h2>How you score</h2><button type="button" class="ppx" data-ppx aria-label="Close panel">&times;</button></div>
    <div class="ppb" id="scorebody"></div>
  </aside>
  <aside id="rivalp" hidden></aside>
</div>
</div>
<div id="start" hidden></div>
<div id="rs" hidden></div>
<div id="pass" hidden></div>
<div id="toast" role="status"></div>
<script src="gx-scenario.js"></script>
<script src="scn.js"></script>
<script src="shell.js"></script>
<script src="gx-kit.js"></script>
<script src="gx-viewport.js"></script>
<script src="gameaudio.js"></script>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="art.js"></script>
<script src="ui.js"></script>
<script src="tutor.js"></script>
</body>
</html>
