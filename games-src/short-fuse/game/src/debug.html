<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short Fuse debug</title>
<style>
:root{--bg:#f6f3ee;--ink:#222;--mut:#666;--blu:#2c6fd1;--red:#c8322b;--yel:#d9a400;--hid:#888;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--ink:#eee;--mut:#aaa;--card:#2a2926}}
[hidden]{display:none!important}
body{margin:0;padding:12px 16px;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.wrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}@media (max-width:800px){.wrap{grid-template-columns:1fr}}
.st{margin:4px 0;padding:4px;background:var(--card);border-radius:6px;overflow-x:auto;white-space:nowrap}.st.act{outline:2px solid var(--yel)}
.who{display:inline-block;min-width:120px;color:var(--mut)}
.w{display:inline-block;min-width:26px;margin:1px;padding:2px 4px;border-radius:4px;color:#fff;text-align:center;font-weight:600}
.w.blu{background:var(--blu)}.w.red{background:var(--red)}.w.yel{background:var(--yel);color:#222}.w.hid{background:var(--hid)}.w.cut{opacity:.45;text-decoration:line-through}
.w i{font-size:10px;margin-left:2px}.w b,.side{font-size:10px;background:#0006;color:#fff;border-radius:3px;padding:0 2px;margin-left:2px}
.eq{display:inline-block;margin:2px;padding:2px 6px;border-radius:4px;background:var(--card)}.eq.ready{outline:2px solid #3a3}.eq.used{opacity:.5}
.ms div{font-size:12px;color:var(--mut);word-break:break-all}#log{max-height:320px;overflow:auto;font-size:12px}#log .bad{color:var(--red)}#log .good{color:#3a3}#log .big{font-weight:700}
#dock{padding:6px;background:var(--card);border-radius:6px;margin:6px 0}#dock select{width:100%}#help{font-size:12px}
</style></head><body>
<div class="bar"><b>Short Fuse - debug view</b>
<select id="job"></select><select id="np"><option>2</option><option>3</option><option selected>4</option><option>5</option></select>
<select id="lv"><option>easy</option><option selected>normal</option><option>hard</option></select>
<label>human seat <select id="human"><option value="-1">none</option><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option><option value="4">5</option></select></label>
<input id="seed" placeholder="seed" size="6"><button id="new">New game</button><button id="step">Step</button><button id="auto">Auto-play</button><button id="tick">+10 s clock</button>
<label>view as <select id="viewas"><option value="-1">everything</option><option value="0">seat 1</option><option value="1">seat 2</option><option value="2">seat 3</option><option value="3">seat 4</option><option value="4">seat 5</option></select></label>
<label><input type="checkbox" id="wwk"> what we know</label></div>
<div class="wrap"><div><div id="board"></div><div id="dock"></div><div id="help"></div></div><div id="log"></div></div>
<script src="data.js"></script><script src="engine.js"></script><script src="ai.js"></script><script src="debug-ui.js"></script>
</body></html>
