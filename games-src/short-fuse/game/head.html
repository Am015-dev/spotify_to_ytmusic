<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Short Fuse</title>
<meta name="description" content="Short Fuse: a cartoon demolition crew defuses rigged charges together. A co-op deduction game for 2-5 players, with computer crew, hot-seat and 66 jobs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/*SHELL_CSS*/
[hidden]{display:none!important}
:root{--ink:#1c1838;--cream:#fff2d4;--paper:#fff6e2;--paper2:#f5dfb4;--orange:#ff8a1f;--orange2:#e8681c;--teal:#16b3a6;--purple:#8f5bff;--green:#52c23a;--green2:#2e9e2a;--red:#ef3b2d;--red2:#b3140c;--yellow:#ffc928;--blue:#2f86ff;--blue2:#1c62d9;--navy:#2b2f63;--navy2:#1f2250;
  --fd:'Lilita One','Arial Black',Impact,system-ui,sans-serif;--fb:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --gx-bg:#f4c48a;--gx-bar:#1f2250;--gx-panel:#fff6e2;--gx-ink:#1c1838;--gx-line:rgba(28,24,56,.25);--gx-accent:#ff8a1f;--gx-dock-w:clamp(320px,29vw,420px);--gx-bar-h:52px;--gx-radius:16px;--gx-shadow:0 18px 50px rgba(28,24,56,.45)}
body{font-family:var(--fb);color:var(--ink);background:var(--gx-bg);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- top bar ---------- */
.gx-bar{background:linear-gradient(#2b2f63,#1f2250);color:#fff;box-shadow:0 3px 0 rgba(28,24,56,.6);border-bottom:4px solid transparent;border-image:repeating-linear-gradient(-45deg,#ffc928 0 10px,#1c1838 10px 20px) 4}
.gx-bar h1{margin:0 4px 0 0;font:1.45rem/1 var(--fd);letter-spacing:.5px;color:#ffc928;text-shadow:0 2px 0 #1c1838,2px 0 0 #1c1838,-2px 0 0 #1c1838,0 -2px 0 #1c1838;white-space:nowrap;display:flex;align-items:center;gap:6px}
.gx-bar h1 svg{flex:none}
.jobchip{font:.85rem var(--fd);background:#ff8a1f;color:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px 8px;white-space:nowrap;text-shadow:0 1px 0 var(--ink);cursor:pointer;min-height:32px}
.gx-bar .gx-ibtn{background:linear-gradient(#3a3f86,#2b2f63);border:2px solid #14163a;color:#fff;font:700 .9rem var(--fb);box-shadow:0 3px 0 #14163a;min-height:40px;border-radius:12px}
.gx-bar .gx-ibtn:hover{background:linear-gradient(#4a50a6,#353a79)}
.gx-bar .gx-ibtn:active{box-shadow:0 1px 0 #14163a;background:#2b2f63}
.gx-bar .gx-ibtn[aria-expanded=true]{background:linear-gradient(#ff9d3d,#e8681c)}
.gx-ibtn svg{width:20px;height:20px;flex:none}
.menuwrap{position:relative;display:flex;gap:6px}
@media (max-width:639px){.jobchip .jn{display:none}.gx-bar .gx-ibtn>span{display:none}.gx-bar h1 .tt{display:none}.gx-bar{gap:4px;padding-left:6px;padding-right:6px}.gx-bar .gx-ibtn{min-width:40px;padding:4px 7px}}
@media (min-width:640px) and (max-width:899px){.gx-bar{gap:4px}.gx-bar .gx-ibtn{padding:4px 8px;gap:4px;font-size:.82rem}.gx-ibtn svg{width:17px;height:17px}}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{appearance:none;border:2.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:800 .92rem var(--fb);padding:6px 12px;min-height:40px;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;text-align:left}
.btn:hover{background:#fff4d6}
.btn:active{box-shadow:0 1px 0 var(--ink);background:#ffe6a8}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:0 1px 0 var(--ink)}
.btn.go{background:linear-gradient(#ffa24a,#ff7a12);color:#fff;text-shadow:0 1px 0 var(--ink);font:1.05rem var(--fd);letter-spacing:.4px}
.btn.go:hover{background:linear-gradient(#ffb466,#ff8a1f)}
.btn.go[disabled]{background:#d8c9b2;text-shadow:none;color:#6d6582}
.btn.blue{background:linear-gradient(#5fb0ff,#2f86ff);color:#fff;text-shadow:0 1px 0 var(--ink)}
.btn.small{min-height:34px;padding:3px 9px;font-size:.82rem;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.btn.wide{width:100%}
.btn.on{background:#ffe066}
.btn svg{width:18px;height:18px;flex:none}
.lg-good{color:#1d7a3a}.lg-bad{color:#b3140c}.lg-big{font-weight:900}.lg-eq{color:#5b3fc4}.lg-turn{color:#8a8398;font-size:.75rem}.lg-prompt{color:#0b6b8a;font-style:italic}
.tiny{font-size:.75rem;color:#5a5480}
/* ---------- start screen ---------- */
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:radial-gradient(130% 90% at 50% 0%,#ffe3b0,#f2a86a 70%,#e98d4f);overflow:hidden}
#start .st-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(#2b2f63,#1f2250);border-bottom:5px solid transparent;border-image:repeating-linear-gradient(-45deg,#ffc928 0 12px,#1c1838 12px 24px) 5;color:#fff;flex:none}
#start .st-head h1{margin:0;font:clamp(1.6rem,4vw,2.4rem)/1 var(--fd);color:#ffc928;letter-spacing:1px;text-shadow:0 3px 0 #1c1838,3px 0 0 #1c1838,-3px 0 0 #1c1838,0 -3px 0 #1c1838}
#start .st-head p{margin:0;font-weight:800;font-size:.9rem;opacity:.9}
#start .st-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr);gap:12px;padding:12px 14px;overflow:hidden}
#start .pane{min-height:0;overflow:auto;background:rgba(255,246,226,.92);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(28,24,56,.4);overscroll-behavior:contain}
#start h2{margin:2px 0 6px;font:1.2rem var(--fd);letter-spacing:.3px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.quick .btn{flex-direction:column;align-items:flex-start;min-height:62px;font-size:.95rem}
.quick .btn small{font-weight:700;font-size:.72rem;opacity:.8}
.box{margin:8px 0 4px;font:900 .78rem var(--fb);text-transform:uppercase;letter-spacing:1px;color:#6d4a10;display:flex;align-items:center;gap:6px}
.box::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,#c08a3d 0 6px,transparent 6px 10px)}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.jt{appearance:none;position:relative;border:2.5px solid var(--ink);border-radius:12px;background:linear-gradient(#fff,#fde9c6);min-height:58px;padding:4px 3px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;box-shadow:0 3px 0 rgba(28,24,56,.45)}
.jt b{font:1.25rem/1 var(--fd);color:var(--navy)}
.jt span{font:800 .58rem/1.1 var(--fb);text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.jt.done{background:linear-gradient(#e7ffd9,#bdf0a8)}
.jt.locked{background:linear-gradient(#ece6da,#d6cdbb);color:#6d6582}
.jt.locked b{color:#6d6582}
.jt.sel{outline:4px solid #ff8a1f;outline-offset:1px;background:linear-gradient(#fff6c8,#ffe066)}
.jt i{position:absolute;top:-7px;right:-6px;font-style:normal;font-size:.7rem;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 4px;line-height:15px}
.jt i.t{left:-6px;right:auto;background:#ffd9d4}
.brief{display:grid;gap:6px}
.brief .bt{display:flex;align-items:baseline;gap:8px}
.brief .bt b{font:2rem/1 var(--fd);color:var(--orange2);-webkit-text-stroke:1px var(--ink)}
.brief .bt h3{margin:0;font:1.35rem var(--fd)}
.flav{font-style:italic;color:#4b3a20;background:#fff3d6;border-radius:10px;padding:6px 9px;border:2px dashed #c08a3d;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font:800 .72rem var(--fb);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;background:#fff;display:inline-flex;align-items:center;gap:4px}
.tag.r{background:#ffd9d4}.tag.y{background:#fff1b3}.tag.b{background:#d9ecff}.tag.t{background:#e8e3ff}.tag.e{background:#dff7e8}
.mix{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.mw{width:20px;height:28px;border-radius:5px;border:2px solid var(--ink);display:inline-grid;place-items:center;font:.72rem var(--fd);color:#fff;text-shadow:0 1px 0 var(--ink)}
.mw.b{background:linear-gradient(#56a6ff,#1c62d9)}.mw.r{background:linear-gradient(#ff6048,#c11d1d)}.mw.y{background:linear-gradient(#ffe455,#ffb300);color:var(--ink);text-shadow:none}.mw.q{background:repeating-linear-gradient(45deg,#454d8e 0 4px,#3a4180 4px 8px)}
.setup{display:grid;gap:8px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .btn{min-width:44px}
.seat{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:5px 7px}
.seat .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--sc)}
.seat select,.setup select{font:800 .85rem var(--fb);border:2px solid var(--ink);border-radius:9px;padding:5px 6px;background:#fff7e8;min-height:36px;max-width:100%}
.seat .nm{font:800 .9rem var(--fb);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.lbl{font:900 .78rem var(--fb);text-transform:uppercase;letter-spacing:.8px;color:#6d4a10}
.chk{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.88rem;min-height:36px}
.chk input{width:20px;height:20px}
@media (max-width:820px){#start .st-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1.1fr);overflow:hidden}.quick{grid-template-columns:repeat(3,1fr)}.quick .btn{min-height:54px;padding:4px 7px;font-size:.82rem}}
@media (max-width:480px){.quick .btn small{display:none}#start .st-head p{display:none}#start .st-body{padding:8px;gap:8px}.jobs{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}}
/* ---------- drawers ---------- */
.gx-drawer{border:4px solid var(--ink)}
.gx-drawer-head{background:linear-gradient(#ffd27a,#ffb347);border-bottom:3px solid var(--ink);border-radius:12px 12px 0 0}
.gx-drawer-head h2{font:1.25rem var(--fd);letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.gx-drawer-head h2 svg{width:22px;height:22px}
.gx-drawer-body{line-height:1.42}
.gx-drawer-body h3{font:1.1rem var(--fd);margin:12px 0 4px;letter-spacing:.3px}
.gx-drawer-body h4{margin:10px 0 2px;font:900 .9rem var(--fb)}
.gx-drawer-body p,.gx-drawer-body li{font-size:.92rem}
.mcard{border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 0 rgba(28,24,56,.4)}
.mcard .mh{background:linear-gradient(#2c9db0,#1f7489);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--ink)}
.mcard .mh b{font:2.4rem/1 var(--fd);color:#ffc928;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.mcard .mh h3{margin:0;font:1.4rem var(--fd);text-shadow:0 2px 0 var(--ink)}
.mcard .mb{padding:10px 12px;display:grid;gap:8px}
.rule{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start;background:#fff8e6;border:2px solid var(--ink);border-radius:12px;padding:6px 8px}
.rule .ri{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;background:#ffc928}
.rule .ri svg{width:26px;height:26px}
.rule b{font:1rem var(--fd)}
.rule p{margin:2px 0 0;font-size:.86rem}
.now{background:#e9fff1;border:2px solid #2e9e2a;border-radius:12px;padding:6px 9px;font-size:.88rem}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.eqc{border:3px solid var(--ink);border-radius:14px;background:linear-gradient(#3a3f86,#2b2f63);color:#fff;overflow:hidden;box-shadow:0 3px 0 rgba(28,24,56,.45);display:flex;flex-direction:column}
.eqc .et{display:flex;align-items:center;gap:6px;background:#ff8a1f;border-bottom:3px solid var(--ink);padding:4px 8px;font:1rem var(--fd);text-shadow:0 1px 0 var(--ink)}
.eqc .et b{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ink);border:2px solid var(--ink);text-shadow:none;font-size:.9rem}
.eqc .ex{padding:6px 8px;font-size:.82rem;line-height:1.35;flex:1}
.eqc .es{padding:3px 8px 6px;font:900 .74rem var(--fb);color:#ffe066;text-transform:uppercase;letter-spacing:.6px}
.eqc.locked{filter:saturate(.55) brightness(.92)}.eqc.used{background:repeating-linear-gradient(45deg,#2b2f63 0 8px,#353a75 8px 16px)}.eqc.ready .es{color:#9dff7a}
.eqc .tm{font:800 .66rem var(--fb);background:rgba(255,255,255,.15);border-radius:6px;padding:1px 6px;margin-left:auto}
.reflist{display:grid;gap:6px}
.ref{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;border-bottom:1px dashed rgba(28,24,56,.25);padding:4px 0}
.ref .rc{font:1rem var(--fd);background:#ffc928;border:2px solid var(--ink);border-radius:9px;min-width:34px;text-align:center;padding:1px 4px}
.ref b{font-weight:900}
.ref small{display:inline-block;margin-left:4px;font-weight:800;font-size:.7rem;background:#efe8ff;border-radius:6px;padding:0 5px}
.wk{width:100%;border-collapse:collapse;font-size:.82rem}
.wk th,.wk td{border:1px solid rgba(28,24,56,.2);padding:3px 4px;text-align:left;vertical-align:top}
.wk th{background:#ffe9b8}
.wk td.c{background:#e7ffd9;font-weight:900}
.loglist div{padding:2px 0;border-bottom:1px dotted rgba(28,24,56,.15);font-size:.88rem}
.setgrid{display:grid;gap:10px}
.setgrid .row .btn{min-width:64px}
#perfslot{display:flex;gap:6px;flex-wrap:wrap}
.credits-audio h3{margin-top:14px}
kbd{font:800 .8rem var(--fb);border:2px solid var(--ink);border-radius:6px;padding:0 5px;background:#fff}
/* online play */
.online{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px;margin:0 0 10px;box-shadow:0 2px 0 rgba(28,24,56,.35)}
.online>summary{cursor:pointer;font:800 .95rem var(--fb);min-height:28px;display:flex;align-items:center}
.online p{margin:4px 0}.online .muted,.nbox .muted,.nbox .tiny{color:#5a5480}.online .small,.nbox .small{font-size:.85rem}
.online .warn,.nbox .warn,.netst .warn{color:var(--red2);font-weight:800}
.nrow{display:flex;gap:6px;margin:6px 0}.nrow input{flex:1;min-width:0;font:800 .9rem var(--fb);border:2px solid var(--ink);border-radius:9px;padding:5px 8px;background:#fff7e8;min-height:36px}
.netst{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:700 .78rem var(--fb);background:#e9f2ff;border:2px solid var(--ink);border-radius:10px;padding:3px 7px;margin-bottom:6px}.netst[hidden]{display:none}
.netst>span{flex:1 1 auto;min-width:0}.netst .btn.small{min-height:28px;padding:1px 8px}
#netbox{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(28,24,56,.55);padding:12px}#netbox[hidden]{display:none}
.nbox{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 rgba(28,24,56,.5);padding:12px 14px;width:min(440px,100%);max-height:100%;overflow:auto;color:var(--ink)}
.nbox h2{margin:0 28px 6px 0;font:1.25rem var(--fd)}.nbox h3{margin:8px 0 4px;font:1rem var(--fd)}.nbox p{margin:4px 0}
.nbox .lbx{position:absolute;top:8px;right:8px}
.nbox .code{font:1.5rem var(--fd);letter-spacing:3px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 8px}
.invrow{display:flex;gap:6px}.invlink{flex:1;min-width:0;font:700 .78rem var(--fb);border:2px solid var(--ink);border-radius:9px;padding:4px 7px;background:#fff}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px}.plist li{display:flex;align-items:center;gap:7px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px 8px;font-size:.9rem}
.plist li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
.nbox .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.res,.pill.danger{animation:none}}

.linkbtn{background:none;border:0;padding:6px 4px;font:700 .75rem var(--fb);color:#4a4f7a;text-decoration:underline;cursor:pointer;min-height:32px}
.legend{font-size:.8rem;background:#fff7e8;border:2px solid var(--ink);border-radius:10px;padding:4px 8px;margin:4px 0}
.gloss dt{font-weight:900;margin-top:6px}.gloss dd{margin:0 0 0 0}
.stat .pill[title]{cursor:help}
.swt{display:inline-flex;align-items:center;gap:6px;font:800 .85rem var(--fb);border:2px solid var(--ink);border-radius:999px;background:#fff7e8;padding:3px 10px 3px 4px;min-height:36px;cursor:pointer}
.swt i{width:34px;height:20px;border-radius:999px;background:#bbb;border:2px solid var(--ink);position:relative;flex:none}.swt i::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-sizing:border-box;transition:left .15s}
.swt.on i{background:#52c23a}.swt.on i::after{left:15px}
/*TABLE_CSS*/
</style>
</head>
