<body>
<div class="gx-app">
<header class="gx-bar">
  <h1><svg class="ico" viewBox="0 0 24 24" style="width:26px;height:26px;stroke:#e3b24b"><path d="M3 17c3 2 6 2 9 0s6-2 9 0M12 3v11M12 4l6 7h-6M12 6l-5 6h5"/></svg><span class="tt">Tidewake</span></h1>
  <span class="barstat" id="barstat"></span>
  <span class="gx-sp"></span>
  <button class="gx-ibtn gxh-bulb" id="bulbbtn" data-help type="button" aria-label="Hint"><span>Hint</span></button>
  <button class="gx-ibtn" data-gx="crewd" aria-expanded="false" title="Captains, hands and piles"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 14c3 0 6 1.5 6 5"/></svg><span>Crews</span></button>
  <button class="gx-ibtn" data-gx="logd" aria-expanded="false" title="Log"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h6M10 12h6M10 16h4"/></svg><span>Log</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" title="How to play"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z M12 6v13"/></svg><span>Rules</span></button>
  <button class="gx-ibtn" data-gx="piecesd" aria-expanded="false" title="Every current, leviathan and expansion piece"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M13 17h8M17 13v8"/></svg><span>Pieces</span></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" title="Menu: sound, speed, graphics, new game" aria-label="Menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="The sea chart"><canvas id="c3" aria-label="The Tidewake sea chart in 3D, a 6 by 6 board. Tap a square or a gold start mark."></canvas><div id="fb" hidden aria-label="The sea chart"></div><div id="chip" aria-hidden="true"></div><div id="ov" aria-hidden="true"></div></main>
  <aside class="gx-dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-grab" data-gx="sheet" title="Resize"></span><span class="gx-dt" id="dockt">Tidewake</span><button class="gx-ibtn" data-gx="sheet" aria-label="Resize the panel" id="sheetbtn">&#8645;</button><button class="gx-ibtn" data-gx="dock" aria-label="Hide panel">&#8677;</button></div>
    <div class="gx-dock-body" id="dockbody"><div id="pin" class="pin" hidden></div><div id="netst" class="netst" hidden></div><div id="cards" class="cards" hidden></div><nav id="road" class="road" aria-label="Turn order"></nav><div id="stepsw" class="steps"></div><div id="res" aria-live="polite"></div><div id="main"></div><div id="coach"></div></div>
    <div id="ps" class="ps" aria-label="Controls"></div>
    <div id="ppop" class="ppop" hidden role="dialog" aria-label="Details"></div>
    <div id="pc" class="pcard" hidden role="dialog" aria-label="Message"></div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock">&#9776; Panel</button>
</div>
</div>
<section class="gx-drawer wide" id="rulesd" role="dialog" aria-label="How to play"><div class="gx-drawer-head"><h2>How to play</h2><button class="gx-x" data-gx="close" aria-label="Close">&times;</button></div><div class="gx-drawer-body" id="rulesbody"></div></section>
<section class="gx-drawer wide" id="piecesd" role="dialog" aria-label="Pieces"><div class="gx-drawer-head"><h2>Pieces</h2><button class="gx-x" data-gx="close" aria-label="Close">&times;</button></div><div class="gx-drawer-body" id="piecesbody"></div></section>
<section class="gx-drawer" id="crewd" role="dialog" aria-label="Crews"><div class="gx-drawer-head"><h2>Crews and piles</h2><button class="gx-x" data-gx="close" aria-label="Close">&times;</button></div><div class="gx-drawer-body" id="crewbody"></div></section>
<section class="gx-drawer" id="logd" role="dialog" aria-label="Log"><div class="gx-drawer-head"><h2>Log</h2><button class="gx-x" data-gx="close" aria-label="Close">&times;</button></div><div class="gx-drawer-body" id="logbody"></div></section>
<section class="gx-drawer" id="setd" role="dialog" aria-label="Menu"><div class="gx-drawer-head"><h2>Menu</h2><button class="gx-x" data-gx="close" aria-label="Close">&times;</button></div><div class="gx-drawer-body" id="setbody"></div></section>
<section class="gx-drawer" id="credd" role="dialog" aria-label="Credits"><div class="gx-drawer-head"><h2>Credits</h2><button class="gx-x" data-gx="close" aria-label="Close">&times;</button></div><div class="gx-drawer-body" id="credbody"><h3>Tidewake</h3><p>A tile-laying survival game about steering junks along wake currents while leviathans stir. The mechanics follow a published game family; <b>names, texts, board art and ship art here are original.</b></p><!--CREDITS--></div></section>
<div id="start" role="dialog" aria-label="New game" hidden></div>
<div id="netbox" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>
<script src="shell.js"></script>
<script src="gx-viewport.js"></script>
<script src="gx-help.js"></script>
<script src="gx-campaign.js"></script>
<script src="campaign-data.js"></script>
<script src="perfhud.js"></script>
<script src="trystero.min.js"></script>
<script src="netroom.js"></script>
<script src="three.min.js"></script>
<script src="kit.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="netstrip.js"></script>
<script src="texts.js"></script>
<script src="gameaudio.js"></script>
<script src="audio-data.js"></script>
<script src="sound.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
