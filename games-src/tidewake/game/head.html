<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidewake</title>
<meta name="description" content="Tidewake: lantern-ship captains steer junks along wake currents on a haunted 6x6 sea, dodging leviathans. A tile-laying survival game for 1-8 players with computer captains, hot-seat and a guided first game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/*SHELL_CSS*/
[hidden]{display:none!important}
:root{--ink:#14232b;--ink2:#2a4650;--paper:#f3e6bf;--paper2:#e7d39a;--teal:#1d7c83;--teal2:#0f4f5b;--deep:#0b2a33;--gold:#e3b24b;--gold2:#b98a23;--red:#c8432f;--green:#2f9b64;--viol:#8a56c4;
  --fd:'IM Fell English SC','Cormorant Garamond',Georgia,serif;--fb:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --gx-bg:#0b2a33;--gx-bar:#0b2a33;--gx-panel:#f3e6bf;--gx-ink:#14232b;--gx-line:rgba(20,35,43,.28);--gx-accent:#e3b24b;--gx-dock-w:clamp(330px,29vw,430px);--gx-bar-h:50px;--gx-radius:14px;--gx-shadow:0 18px 50px rgba(0,0,0,.55)}
body{font-family:var(--fb);font-weight:600;font-size:17px;line-height:1.25;color:var(--ink);background:var(--gx-bg);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-weight:700;font-size:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* top bar */
.gx-bar{background:linear-gradient(#10414c,#0b2a33);color:#fff2c4;border-bottom:3px solid var(--gold2);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.gx-bar h1{margin:0 6px 0 0;font:1.5rem/1 var(--fd);letter-spacing:.5px;color:var(--gold);text-shadow:0 2px 3px #000;white-space:nowrap;display:flex;align-items:center;gap:6px}
.gx-bar .gx-ibtn{background:linear-gradient(#2d6d78,#173f4a);border:2px solid var(--gold2);color:#fff2c4;font:700 .95rem var(--fb);box-shadow:0 2px 0 #0a1a20;min-height:40px;border-radius:11px}
.gx-bar .gx-ibtn[aria-expanded=true]{background:linear-gradient(#e8b84a,#a77a22);color:#14232b}
.barstat{font:700 .92rem var(--fb);color:#cfe9e4;white-space:nowrap;display:flex;gap:10px;align-items:center}
.barstat b{color:var(--gold)}
@media (max-width:639px){.gx-bar .gx-ibtn>span{display:none}.gx-bar h1 .tt{display:none}.gx-bar{gap:4px;padding-left:6px;padding-right:6px}.gx-bar .gx-ibtn{min-width:40px;padding:4px 7px}.barstat .lg{display:none}}
@media (min-width:640px) and (max-width:899px){.gx-bar{gap:4px}.gx-bar .gx-ibtn{padding:4px 8px;gap:4px;font-size:.85rem}svg.ico{width:17px;height:17px}}
/* board */
.gx-board{background:radial-gradient(120% 100% at 50% 40%,#17525d,#0b2a33 70%)}
#c3{display:block;width:100%;height:100%;touch-action:none;outline:none}
#fb{position:absolute;inset:0;overflow:hidden}
#chip{position:absolute;left:8px;top:8px;z-index:3;pointer-events:none;font:700 .88rem var(--fb);background:rgba(11,42,51,.85);color:#fff2c4;border:1px solid var(--gold2);border-radius:10px;padding:3px 9px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chip:empty{display:none}
/* dock */
.gx-dock{background:linear-gradient(#f3e6bf,#e9d7a2);color:var(--ink);border-left:4px solid var(--gold2);box-shadow:-6px 0 14px rgba(0,0,0,.35)}
.gx-dock-head{background:linear-gradient(#e8c466,#c99a35);border-bottom:2px solid #7a5a14}
.gx-dock-head .gx-dt{font:1.15rem var(--fd);letter-spacing:.3px}
.gx-dock .gx-ibtn{background:#fbf2d4;border:2px solid #7a5a14;color:var(--ink);min-height:36px;min-width:36px;border-radius:10px}
.gx-dock-body{padding:8px 10px 12px;display:flex;flex-direction:column;gap:8px}
@media (max-width:999px){:root{--gx-sheet-h:46dvh}.gx-dock{border-left:0;border-top:3px solid var(--gold2);box-shadow:0 -6px 14px rgba(0,0,0,.35)}
  .gx-app:not(.gx-dock-min) .gx-dock{height:var(--gx-sheet-h)}.gx-app.gx-sheet-full:not(.gx-dock-min) .gx-dock{height:78dvh}.gx-dock-body{padding:6px 8px 10px;gap:6px}}
@media (max-width:560px){:root{--gx-sheet-h:47dvh}}
@media (min-width:1000px){#sheetbtn{display:none}}
.btn{appearance:none;border:2px solid #7a5a14;background:linear-gradient(#fff6d8,#ecd48f);color:var(--ink);border-radius:10px;padding:6px 12px;min-height:40px;cursor:pointer;font:700 1rem var(--fb);box-shadow:0 2px 0 #7a5a14;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{box-shadow:0 0 0 #7a5a14;background:#e0c477}
.btn.pri{background:linear-gradient(#2d8d96,#14606b);color:#fff6d8;border-color:#0a3a42;box-shadow:0 2px 0 #0a3a42;font-size:1.1rem;min-height:46px}
.btn.warn{background:linear-gradient(#e0705a,#b23a26);color:#fff;border-color:#6d1f12;box-shadow:0 2px 0 #6d1f12}
.btn.small{min-height:34px;padding:3px 9px;font-size:.92rem}
.btn.on{background:linear-gradient(#e8b84a,#b98a23);border-color:#6a4a0a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tiny{font-size:.85rem;opacity:.85;margin:2px 0}
h3{font:1.2rem var(--fd);margin:12px 0 4px}
p{margin:4px 0 6px}
/* roadmap */
.road{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:1px 0 3px;flex:none}
.road::-webkit-scrollbar{display:none}
.rs{flex:1 0 auto;min-width:54px;border:2px solid #7a5a14;border-radius:9px;background:#fbf2d4;padding:2px 5px;text-align:center;font:700 .78rem/1.15 var(--fb);position:relative;white-space:nowrap}
.rs i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);vertical-align:-1px;margin-right:3px}
.rs.cur{background:#ffe08a;border-color:#14232b;box-shadow:0 0 0 2px var(--teal)}
.rs.dead{opacity:.45;text-decoration:line-through}
.rs.me{outline:2px dotted var(--teal2)}
.steps{display:flex;gap:3px;flex:none;font:700 .8rem var(--fb)}
.steps span{flex:1;text-align:center;padding:2px 3px;border-radius:7px;background:rgba(20,35,43,.1);border:1.5px solid transparent}
.steps span.on{background:var(--teal);color:#fff6d8;border-color:var(--teal2)}
.steps span.done{background:rgba(47,155,100,.25)}
/* prompts */
.prompt{background:#fff8e1;border:2px solid #7a5a14;border-radius:12px;padding:8px 10px;box-shadow:0 2px 0 rgba(122,90,20,.5)}
.prompt h4{margin:0 0 3px;font:1.1rem var(--fd)}
.prompt.alert{background:#ffe9d6;border-color:var(--red)}
.prompt.ask{background:#efe3ff;border-color:var(--viol)}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opts .btn{justify-content:flex-start;text-align:left;white-space:normal;line-height:1.1}
.qtimer{height:7px;border-radius:5px;background:rgba(20,35,43,.18);overflow:hidden;margin-top:5px}
.qtimer i{display:block;height:100%;width:100%;background:var(--red)}
.hand{display:flex;gap:6px;align-items:flex-end;flex:none}
.hc{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;border-radius:10px;position:relative;flex:0 0 auto;line-height:0}
.hc img,.hc svg.cardart{width:78px;height:78px;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.hc.sel{outline:3px solid var(--gold2);outline-offset:1px;border-radius:12px}
.hc.back img{opacity:.9}
.hc .n{position:absolute;left:3px;top:2px;font:700 .75rem var(--fb);background:rgba(11,42,51,.85);color:#fff2c4;border-radius:6px;padding:0 5px;line-height:1.3}
.hc.sp .lbl{position:absolute;left:0;right:0;bottom:3px;text-align:center;font:700 .62rem var(--fb);color:#fff;line-height:1}
.hacts{display:flex;flex-direction:column;gap:5px;justify-content:center;min-width:0;flex:1}
@media (max-width:560px){.hc img,.hc svg.cardart{width:64px;height:64px}.steps{display:none}.coach p{font-size:.92rem}.coach h4{font-size:.98rem}body{font-size:16px}}
.res{background:#10414c;color:#fff2c4;border-radius:11px;padding:7px 10px;border:2px solid var(--gold2);font:700 1.02rem/1.2 var(--fb)}
.res.bad{background:#7a2416}
.res.big{background:#8a56c4}
.res small{display:block;font-weight:600;opacity:.85;font-size:.85rem}
.warn-l{color:#a3281a;font-weight:700}
.good-l{color:#1d6b43;font-weight:700}
.coach{background:#e4f2ee;border:2px solid var(--teal);border-radius:12px;padding:7px 9px}
.coach h4{margin:0 0 2px;font:1.05rem var(--fd);display:flex;gap:6px;align-items:center}
.coach h4 .gsw{margin-left:auto}
.coach p{margin:2px 0 5px}
.coach.light{padding:5px 8px;background:#eaf5f2}
.rec{background:#fff1c4;border:2px solid var(--gold2);border-radius:12px;padding:7px 9px}
.rec b{font-family:var(--fd);font-weight:400}
.dice{display:flex;gap:8px;align-items:center}
.die{width:46px;height:46px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:700 1.9rem/1 Georgia,serif;border:2px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.die.g{background:linear-gradient(#f3c957,#c8912a);color:#4a2c08}
.die.b{background:linear-gradient(#4a82da,#1e4aa0);color:#fff8e2}
.die.roll{animation:tumble .5s linear infinite}
@keyframes tumble{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.gsw{font:700 .8rem var(--fb);border:2px solid var(--teal2);background:#fff;border-radius:999px;padding:1px 9px;cursor:pointer;min-height:30px}
.gsw.full{background:var(--teal);color:#fff6d8}
.passbox{text-align:center;padding:14px 10px}
.passbox .big{font:1.5rem var(--fd);margin:4px 0 8px}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);vertical-align:-3px}
.startpick{display:grid;grid-template-columns:auto repeat(6,1fr);gap:3px;align-items:center;font-size:.8rem}
.startpick .btn{min-height:34px;padding:0;font-size:.85rem}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.85rem}
/* drawers */
.gx-drawer{background:#f3e6bf;color:var(--ink)}
.gx-drawer-head{background:linear-gradient(#e8c466,#c99a35)}
.gx-drawer-head h2{font:1.3rem var(--fd);margin:0;flex:1;display:flex;gap:8px;align-items:center}
.gx-drawer-body{font-size:1.02rem}
.gx-drawer h3{border-bottom:2px solid var(--gold2);padding-bottom:2px}
.gx-drawer ul{margin:4px 0 8px;padding-left:20px}
.gx-drawer li{margin:2px 0}
.guess{background:#fff1c4;border-left:4px solid var(--gold2);padding:3px 8px;border-radius:6px;font-size:.95rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.pgrid .pc{text-align:center;font-size:.8rem;position:relative;line-height:1.05}
.pgrid .pc img{width:100%;height:auto;display:block}
.pgrid .pc .x2{position:absolute;right:3px;top:2px;background:#0b2a33;color:#ffe08a;font:700 .75rem var(--fb);padding:0 5px;border-radius:6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lcard{border:2px solid #7a5a14;border-radius:10px;background:#fbf2d4;padding:4px;text-align:center;font-size:.82rem;line-height:1.1}
.lcard img{width:84px;height:84px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.xcard{border:2px solid #7a5a14;border-radius:10px;background:#fbf2d4;padding:6px 8px}
.xcard svg{width:46px;height:46px;float:left;margin:0 8px 2px 0}
.lg2 td,.lg2 th{padding:2px 8px;text-align:left;font-size:.92rem;border-bottom:1px solid rgba(0,0,0,.15)}
.logl{font-size:.95rem;border-bottom:1px solid rgba(0,0,0,.12);padding:2px 0}
.logl.bad{color:#a3281a}.logl.big{font-weight:700}.logl.turn{color:var(--teal2);margin-top:4px;font-weight:700}
.setgrid{display:grid;gap:12px}
.lbl{font:1.05rem var(--fd);margin-bottom:3px}
.swt{appearance:none;border:2px solid #7a5a14;background:#fff;border-radius:999px;padding:4px 12px 4px 6px;min-height:38px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;font:700 .95rem var(--fb)}
.swt i{width:30px;height:18px;border-radius:9px;background:#9aa;position:relative;display:inline-block}
.swt i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.swt.on i{background:var(--teal)}.swt.on i:after{left:14px}
/* start screen */
#start{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 100% at 50% 0,#17525d,#0b2a33 75%);color:#fff2c4;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.stin{max-width:980px;margin:0 auto;padding:12px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.stin h1{font:2.6rem/1 var(--fd);color:var(--gold);margin:6px 0 2px;text-shadow:0 3px 4px #000;display:flex;align-items:center;gap:10px}
.stin .tag{font-size:1.1rem;color:#cfe9e4;margin:0 0 8px}
.stcard{background:rgba(243,230,191,.96);color:var(--ink);border:2px solid var(--gold2);border-radius:14px;padding:10px 12px;margin:10px 0}
.stcard h2{font:1.3rem var(--fd);margin:0 0 6px}
.stcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.stcols{grid-template-columns:1fr}.stin h1{font-size:2rem}}
.seat{display:grid;grid-template-columns:auto minmax(100px,170px) auto auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dotted rgba(0,0,0,.25)}
.seat select{font:700 .95rem var(--fb);min-height:36px;border-radius:8px;border:2px solid #7a5a14;background:#fff;padding:0 4px}
.seg{display:inline-flex;border:2px solid #7a5a14;border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:#fff8e1;padding:4px 10px;min-height:36px;cursor:pointer;font:700 .95rem var(--fb)}
.seg button.on{background:var(--teal);color:#fff6d8}
.seg button+button{border-left:2px solid #7a5a14}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
.opt input{margin-top:5px;width:20px;height:20px;flex:none}
.opt small{display:block;font-weight:600;opacity:.8}
.cw{display:flex;gap:4px;flex-wrap:wrap}
.online{background:#fff8e1;border:2px solid #7a5a14;border-radius:12px;padding:6px 10px;color:var(--ink)}
.online>summary{cursor:pointer;font:800 1rem var(--fb);min-height:30px;display:flex;align-items:center}
.online p{margin:4px 0}.online .muted,.nbox .muted,.nbox .tiny{opacity:.8}.online .small,.nbox .small{font-size:.88rem}
.online .warn,.nbox .warn,.netst .warn{color:var(--red);font-weight:800}
.nrow{display:flex;gap:6px;margin:6px 0}.nrow input{flex:1;min-width:0;font:700 1rem var(--fb);border:2px solid #7a5a14;border-radius:9px;padding:5px 8px;background:#fffdf2;color:var(--ink);min-height:38px}
.netst{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:700 .8rem var(--fb);background:#dff0f1;border:2px solid var(--teal2);border-radius:10px;padding:3px 7px}.netst[hidden]{display:none}
.netst>span{flex:1 1 auto;min-width:0}.netst .btn.small{min-height:28px;padding:1px 8px}
#netbox{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(5,25,30,.6);padding:12px}#netbox[hidden]{display:none}
.nbox{position:relative;background:var(--paper);border:3px solid var(--gold2);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.45);padding:12px 14px;width:min(440px,100%);max-height:100%;overflow:auto;color:var(--ink)}
.nbox h2{margin:0 28px 6px 0;font:1.3rem var(--fd)}.nbox h3{margin:8px 0 4px;font:1.05rem var(--fd)}.nbox p{margin:4px 0}
.nbox .lbx{position:absolute;top:8px;right:8px}
.nbox .code{font:1.5rem var(--fd);letter-spacing:3px;background:#fffdf2;border:2px solid #7a5a14;border-radius:8px;padding:0 8px}
.invrow{display:flex;gap:6px}.invlink{flex:1;min-width:0;font:700 .8rem var(--fb);border:2px solid #7a5a14;border-radius:9px;padding:4px 7px;background:#fffdf2;color:var(--ink)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px}.plist li{display:flex;align-items:center;gap:7px;background:#fffdf2;border:2px solid #7a5a14;border-radius:10px;padding:3px 8px;font-size:.95rem}
.plist li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
.nbox .acts,.online .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seat .tag{font-size:.9rem}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}
</style>
</head>
