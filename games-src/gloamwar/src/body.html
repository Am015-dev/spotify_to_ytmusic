<body>
<div class="gx-app" id="app">
  <div class="gx-board" id="board" data-board>
    <div id="map"></div>
    <div id="hudL"><button class="rb" data-gx="setd" id="menuB" type="button" aria-label="Menu"></button><button class="rb" id="helpB" type="button" aria-label="Help: screen guide, lessons, map key, rules">?</button><button class="rb" type="button" id="logB" aria-label="War log and last dice"></button></div>
    <div id="msg" aria-live="polite" role="button" tabindex="0" aria-label="What to do now"></div>
    <div id="side">
      <div class="pc d" id="cD" role="button" tabindex="0" aria-label="Dawn League: points, armies, regions"><i class="pt"></i><div><span>Dawn</span><b id="vD">0/4</b><small id="sD"></small></div></div>
      <div class="pc g" id="cG" role="button" tabindex="0" aria-label="Gloam: points, armies, regions"><i class="pt"></i><div><span>Gloam</span><b id="vG">0/10</b><small id="sG"></small></div></div>
      <div class="pc t" id="cT" role="button" tabindex="0" aria-label="Taint track and the Company"><i class="pt"></i><div><span>Taint</span><b id="vT">0/12</b><em class="bar"><u id="tBar"></u></em></div></div>
      <div id="rival" aria-label="Rival dice"><span class="rl" id="rlab">Rival dice</span><div id="rdice"></div><div id="hunt" title="Dice in the hunt box"></div></div>
    </div>
    <div id="zoomb"><button type="button" id="keyB" class="rb" aria-label="Map key: what every icon means">Key</button><button type="button" id="bulbbtn" class="rb gx-ibtn gxh-bulb" data-help aria-label="Hint"></button><button type="button" id="zin" class="rb" aria-label="Zoom in">+</button><button type="button" id="zout" class="rb" aria-label="Zoom out">−</button></div>
    <div id="phase" role="status"><b id="phT"></b><span id="phS"></span></div>
  </div>
  <div id="dock">
    <div id="drow"><div id="mydice"></div><div id="tabs">
      <button class="tab" id="tCards" type="button" aria-label="Your cards"></button>
      <button class="tab" id="tNat" type="button" aria-label="Nations: how close each is to war"></button>
      <button class="tab" id="tComp" type="button" aria-label="The Company and the hunt"></button>
    </div></div>
    <div id="acts"></div>
  </div>
</div>
<div id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div>
<div id="battle" role="dialog" aria-modal="true" aria-label="Battle"></div>
<div id="toast"></div>
<div class="scr on" id="title">
  <svg id="crest" viewBox="0 0 200 200" aria-hidden="true"></svg>
  <h1 class="logo">GLOAM<i>WAR</i></h1>
  <p class="tag">An old map. Two great alliances. One small Company carrying the Hollow Crown to the Kiln.</p>
  <div class="trow"><button class="btn pri big" id="playD" type="button">Play the Dawn League</button></div>
  <div class="trow"><button class="btn red big" id="playG" type="button">Play the Gloam</button></div>
  <div class="trow"><span class="seg" id="segL"></span></div>
  <div class="trow"><span id="tutSlot"></span><button class="btn" id="howB" type="button">How to play</button><button class="btn" data-gx="setd" type="button" id="tMenuB">Settings</button></div>
</div>
<div class="scr" id="res"><p class="big" id="resH"></p><p id="resP" style="max-width:34ch;font-family:var(--fell);font-size:1.15rem"></p><div class="row" id="resRow" style="justify-content:center"></div></div>
<script src="gx-scenario.js"></script>
<script src="scn.js"></script>
<script src="shell.js"></script>
<script src="gx-kit.js"></script>
<script src="gx-viewport.js"></script>
<script src="gx-help.js"></script>
<script src="gx-tutor.js"></script>
<script src="gameaudio.js"></script>
<script src="icons.js"></script>
<script src="map.js"></script>
<script src="data.js"></script>
<script src="cards.js"></script>
<script src="engine.js"></script>
<script src="combat.js"></script>
<script src="effects.js"></script>
<script src="ai.js"></script>
<script src="mapview.js"></script>
<script src="ui.js"></script>
<script src="sheets.js"></script>
<script src="tutor.js"></script>
</body></html>
