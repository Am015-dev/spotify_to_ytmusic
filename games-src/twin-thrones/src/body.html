<body>
<div class="gx-app">
<header class="gx-bar">
  <h1>Twin Thrones</h1>
  <span class="ttchip" id="pts0" data-score="0" title="Your points: tap for the breakdown"><i class="cd">You</i><b>0</b></span>
  <span class="ttchip riv" id="pts1" data-score="1" title="Rival points: tap for the breakdown"><i class="cd">Rival</i><b>0</b></span>
  <span class="gx-sp"></span>
  <button class="gx-ibtn ttic" data-city="1" aria-label="Rival city"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M5 20V10l3 2 4-5 4 5 3-2v10"/><path d="M10 20v-4h4v4"/></svg></button>
  <button class="gx-ibtn ttic" data-gx="cardsd" aria-expanded="false" aria-label="All cards"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg></button>
  <button class="gx-ibtn ttic" data-gx="logd" aria-expanded="false" aria-label="Log"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
  <button class="gx-ibtn ttic" data-gx="rulesd" aria-expanded="false" aria-label="How to play"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4"/><path d="M12 17.6h.01"/></svg></button>
  <button class="gx-ibtn ttic" id="menubtn" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<button class="gx-ibtn ttic" id="hintbtn" aria-pressed="false" aria-label="Hints on or off"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="The duel"><div id="bd"></div><div id="zoom" hidden></div></main>
  <aside class="gx-dock" id="dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-grab" data-gx="sheet"></span><span class="gx-dt" id="dt">Your move</span><button class="gx-ibtn" data-gx="dock" aria-label="Hide panel">&#8677;</button></div>
    <div class="gx-dock-body" id="dockbody"><div id="msg" aria-live="polite"></div><div id="sub"></div><div id="acts"></div></div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock">&#9776; Panel</button>
</div>
</div>
<div id="start"></div><div id="res" hidden></div><div id="toast" role="status"></div><div id="banner" aria-hidden="true"></div>
<div id="rulesbox" hidden></div><div id="logbox" hidden></div><div id="cardsbox" hidden></div>
<script src="shell.js"></script>
<script src="gameaudio.js"></script>
<script src="gx-viewport.js"></script>
<script src="gx-help.js"></script>
<script src="gx-tutor.js"></script>
<script src="gx-scenario-tutor.js"></script>
<script src="gx-music.js"></script>
<script src="gx-campaign.js"></script>
<script src="campaign-data.js"></script>
<script src="gx-scenario.js"></script>
<script src="scn.js"></script>
<script src="assets.js"></script>
<script src="art.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="sound.js"></script>
<script src="ui.js"></script>
<script src="lessons.js"></script>
</body></html>
