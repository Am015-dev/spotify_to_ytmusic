<body>
<div class="gx-app">
<header class="gx-bar">
  <h1>Shipwreck Isle</h1>
  <span id="netst" class="netst" role="status" hidden></span>
  <span class="gx-sp"></span>
  <button class="gx-ibtn" data-gx="campd" aria-expanded="false" data-ico="tent"><span>Camp</span></button>
  <button class="gx-ibtn" data-gx="logd" aria-expanded="false" data-ico="scroll"><span>Log</span></button>
  <button class="gx-ibtn" data-gx="cardsd" aria-expanded="false" data-ico="cards"><span>Cards</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" data-ico="book"><span>Rules</span></button>
  <button class="gx-ibtn menub" data-a="menu" aria-expanded="false" aria-controls="moremenu" aria-label="More: sound, speed, graphics, new game" data-ico="menu"></button>
  <div class="more" id="moremenu">
  <button class="gx-ibtn" data-a="snd" id="sndbtn" aria-label="Sound">🔊</button>
  <button class="gx-ibtn" data-a="mus" id="musbtn" aria-label="Sea sounds">🌊 On</button>
  <button class="gx-ibtn" data-a="speed" id="speedbtn" title="How fast the computer plays">⏩ normal</button>
  <button class="gx-ibtn" data-a="gfx" id="gfxbtn" title="Graphics quality and speed" aria-haspopup="dialog" aria-controls="gfxpop" aria-expanded="false">Graphics</button>
  <button class="gx-ibtn" data-a="pause" id="pausebtn" hidden>⏸ Pause</button>
  <button class="gx-ibtn" data-a="new" data-ico="plus"><span>New game</span></button>
  </div>
</header>
<div class="gx-main">
  <main class="gx-board"><div class="view"><div id="labels" aria-label="Island tiles"></div><canvas id="c3" aria-label="The island, in 3D. Drag to turn it, scroll to zoom, tap a tile to plan there."></canvas><div id="map2d" hidden></div><div id="chip" aria-hidden="true"></div></div></main>
  <aside class="gx-dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-grab" data-gx="sheet" title="Resize"></span><span class="gx-dt" id="dockt">Plan the day</span><button class="gx-ibtn" data-gx="sheet" aria-label="Resize panel" id="sheetbtn">↕</button><button class="gx-ibtn gx-hide-narrow" data-gx="dock" aria-label="Hide panel">⇥</button></div>
    <nav id="roadmap" class="roadmap" hidden aria-label="Where you are in the day"></nav><div id="dockmsg" hidden role="status"></div><div class="gx-dock-body"><div id="hud"></div><div id="story" hidden aria-live="polite"></div><div id="panel"></div></div>
    <div id="step" aria-live="polite"></div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock">☰ Panel</button>
</div>
</div>
<section class="gx-drawer" id="campd" role="dialog" aria-label="Camp"><div class="gx-drawer-head"><h2 data-ico="tent">Camp</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="campbody"></div></section>
<section class="gx-drawer" id="logd" role="dialog" aria-label="Log"><div class="gx-drawer-head"><h2 data-ico="scroll">Log</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="logbody"></div></section>
<section class="gx-drawer wide" id="cardsd" role="dialog" aria-label="Card list"><div class="gx-drawer-head"><h2 data-ico="cards">Card list</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="cardsbody"></div></section>
<section class="gx-drawer wide" id="rulesd" role="dialog" aria-label="Rules"><div class="gx-drawer-head"><h2 data-ico="book">How to play</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="rulesbody"></div></section>
<div id="gfxpop" class="gfxpop" role="dialog" aria-label="Graphics and speed" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="modal" hidden></div>
<script src="shell.js"></script>
<script src="perfhud.js"></script>
<script src="trystero.min.js"></script>
<script src="netroom.js"></script>
<script src="three.min.js"></script>
<script src="data-gen.js"></script>
<script src="data.js"></script>
<script src="cards-ev.js"></script>
<script src="cards-adv.js"></script>
<script src="text.js"></script>
<script src="rules-html.js"></script>
<script src="engine.js"></script>
<script src="phases.js"></script>
<script src="scen.js"></script>
<script src="moves.js"></script>
<script src="ai.js"></script>
<script src="flavor.js"></script>
<script src="story.js"></script>
<script src="flow.js"></script>
<script src="advisor.js"></script>
<script src="plan-ui.js"></script>
<script src="three3d.js"></script>
<script src="gameaudio.js"></script>
<script src="audio-data.js"></script>
<script src="sound.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
