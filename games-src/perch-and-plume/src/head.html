<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perch &amp; Plume</title>
<style>
/*SHELL_CSS*/
*{box-sizing:border-box}
:root{--fs:13px;--ink:#2a2116;--paper:#f6eedb;--paper2:#ebdfc2;--moss:#23412f;--moss2:#2f5640;--F:#4f7a45;--G:#c9a443;--W:#3f8193;--acc:#e0a948;--red:#b8423a;
  --gx-bg:#1c2a20;--gx-bar:#16221a;--gx-panel:#f6eedb;--gx-ink:#2a2116;--gx-accent:#e0a948;--gx-sheet-h:47dvh;--sw:62px;--gxc-accent:#e0a948}
@media (min-width:1024px){:root{--fs:16px;--gx-dock-w:clamp(380px,39vw,580px)}}
html,body{margin:0;height:100%;overflow:hidden;font-size:var(--fs);color:var(--ink);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:#1c2a20}
button{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
.gx-app{height:100dvh}
.gx-bar{background:var(--gx-bar);color:var(--paper);gap:6px}
.gx-bar h1{margin:0;font-size:calc(var(--fs)*1.25);display:flex;align-items:center;gap:6px;white-space:nowrap}
.gx-bar h1 .ic{width:26px;height:26px;display:inline-block}
.gx-bar .gx-ibtn{color:var(--paper);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22);font-size:var(--fs)}
.gx-ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#barstat{font-size:var(--fs);font-weight:700;white-space:nowrap;background:rgba(224,169,72,.18);border:1px solid rgba(224,169,72,.5);border-radius:12px;padding:2px 8px}
@media (max-width:640px){.gx-bar h1 .tt,.gx-bar .gx-ibtn span{display:none}.gx-bar{padding-left:6px;padding-right:6px;gap:4px}}
.gx-board{background:#2c3b28}
#bd{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px;padding:4px 6px 6px;background:radial-gradient(ellipse at 50% 30%,#3d5a3a,#22311f 75%)}
/* ---- other players */
#opps{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:44px}
#opps::-webkit-scrollbar{display:none}
.opp{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:44px;padding:2px 10px 2px 4px;border-radius:22px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.28);color:var(--paper);cursor:pointer;font-size:var(--fs)}
.opp .pt{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto;display:block}
.opp .pt svg,.opp .pt img{width:100%;height:100%}
.opp b{font-weight:700}
.opp.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.opp.pulse{animation:pulse .6s ease 2}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 14px var(--acc)}}
/* ---- feeder, tray, deck */
#mid{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:60px}
#feeder{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:4px;border-radius:12px;background:rgba(120,84,46,.75);border:2px solid #8a6238;flex:0 0 auto;width:min(40%,240px)}
.die{appearance:none;border:0;padding:2px;aspect-ratio:1;border-radius:8px;background:#f6eedb;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0}
.die .fi{width:100%;height:100%}
.die.gone{visibility:hidden}
#tray{flex:1 1 auto;display:flex;gap:4px;min-width:0;justify-content:center}
.deck{appearance:none;flex:0 0 auto;width:52px;min-height:56px;border-radius:8px;border:2px solid var(--paper);background:var(--moss2);color:var(--paper);font-size:var(--fs);font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px}
/* ---- the mat: three habitat rows */
#mat{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:4px}
.row{flex:1 1 0;min-height:0;display:grid;grid-template-columns:var(--rh,64px) repeat(5,var(--sw,minmax(0,1fr)));justify-content:center;gap:4px;padding:3px;border-radius:12px;position:relative}
.row[data-h="0"]{background:linear-gradient(90deg,rgba(79,122,69,.95),rgba(79,122,69,.55))}
.row[data-h="1"]{background:linear-gradient(90deg,rgba(201,164,67,.95),rgba(201,164,67,.55))}
.row[data-h="2"]{background:linear-gradient(90deg,rgba(63,129,147,.95),rgba(63,129,147,.55))}
.row .rowart{position:absolute;inset:0;border-radius:12px;overflow:hidden;z-index:0;opacity:.6}
.row .rowart .art{width:100%;height:100%}
.row>*:not(.rowart){position:relative;z-index:1}
.ract{appearance:none;border:2px solid rgba(255,255,255,.65);border-radius:10px;background:rgba(20,28,18,.62);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:2px;min-height:44px;line-height:1.1;font-size:var(--fs)}
.ract b{font-size:calc(var(--fs)*1.15)}
.ract .bon{font-size:var(--fs);opacity:.95;color:#ffe2a0}
.ract:disabled{opacity:.55;cursor:default}
.ract.fire{animation:fire .7s ease}
@keyframes fire{40%{background:var(--acc);color:var(--ink);transform:scale(1.06)}}
.slot{border-radius:8px;border:2px dashed rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;color:var(--paper);font-size:var(--fs);min-width:0;min-height:0;background:rgba(0,0,0,.12);position:relative}
.slot .ec{display:flex;align-items:center;gap:2px;font-weight:700;background:#1b2519;color:#fff8e6;border-radius:9px;padding:2px 8px}
.slot .ec .egi{width:12px;height:15px}
.slot.next{border-style:solid;border-color:rgba(255,255,255,.75)}
/* ---- bird cards */
.bc{position:relative;border-radius:8px;background:var(--paper);color:var(--ink);overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.35);border:2px solid #fff8e6;display:flex;flex-direction:column;cursor:pointer;min-width:0;min-height:0}
.bc .pic{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#ddd}
.bc .pic .art,.slot .bc .pic .art{position:absolute;inset:0;width:100%;height:100%;display:block}
img.art.fi,img.art.egi,img.art.nsi{position:static;display:inline-block;object-fit:contain}
.bc .pic .art svg{position:absolute;inset:0;width:100%;height:100%}
.bc .pic .art.ph svg:not(.phbg){left:8%;top:12%;width:84%;height:84%}
.bc .vp{position:absolute;right:2px;top:2px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:var(--moss);color:#fff;font-weight:700;font-size:var(--fs);display:flex;align-items:center;justify-content:center;line-height:1}
.bc .pwbar{flex:0 0 5px}
.bc .pwbar.brown{background:#8a5a32}.bc .pwbar.pink{background:#d77aa0}.bc .pwbar.white{background:#e9e4d6;border-top:1px solid #bbb}.bc .pwbar.none{background:#bbb}
.bc .meta{display:flex;align-items:center;gap:2px;padding:1px 3px;font-size:var(--fs);min-height:18px;flex-wrap:wrap}
.bc .egi{width:12px;height:15px;display:inline-block}
.bc .egi svg{width:100%;height:100%}
.bc .tk{font-weight:700;font-size:var(--fs);padding:0 3px;border-radius:6px;background:#e8dcc0}
.slot .bc{position:absolute;inset:0}
.bc.on-board .meta{justify-content:center}
.bc .nm{font-weight:700;font-size:var(--fs);line-height:1.12;padding:2px 4px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bc .cost{display:flex;gap:1px;align-items:center;padding:0 3px;flex-wrap:wrap}
.bc .cost .fi{width:18px;height:18px}
.bc .cost i{font-style:normal;font-size:var(--fs);font-weight:700;padding:0 1px}
.bc .habs{display:flex;gap:2px;padding:1px 3px 3px}
.bc .habs i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.3)}
.hF{background:var(--F)}.hG{background:var(--G)}.hW{background:var(--W)}
.fi{display:inline-block;width:20px;height:20px;flex:0 0 auto}
.fi svg{width:100%;height:100%}
.nsi{display:inline-block;width:16px;height:16px}
.nsi svg{width:100%;height:100%}
.tcard{width:min(62px,30%);aspect-ratio:3/4;flex:0 1 auto;position:relative}
.tcard .bc{position:absolute;inset:0}
/* chapter goal tracker + result */
#goalbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:30px;padding:3px 10px;border-radius:15px;background:rgba(224,169,72,.22);border:2px solid var(--acc);color:#fff3d6;font-size:var(--fs);font-weight:700}
#goalbar .gk{background:var(--acc);color:var(--ink);border-radius:9px;padding:0 7px;font-size:calc(var(--fs)*.85);text-transform:uppercase;letter-spacing:.04em}
#goalbar .gt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#goalbar.met{background:rgba(110,180,90,.35);border-color:#9fd37f}
#goalbar .gm{color:#bff0a0}
.goalres{width:min(520px,100%);border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;flex-direction:column;gap:4px;text-align:center;font-size:var(--fs)}
.goalres.met{background:rgba(110,180,90,.3);border:2px solid #9fd37f}.goalres.miss{background:rgba(184,66,58,.3);border:2px solid #e08a82}
.goalres b{font-size:calc(var(--fs)*1.15)}
.goalstars{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;align-items:center}
.goalstars li{opacity:.55}.goalstars li.on{opacity:1;color:#ffe08a;font-weight:700}
.ovl .yr{font-size:calc(var(--fs)*1.1);font-weight:700}
/* title keeps the top bar (Rules, Menu, sound) like the other shelf games; Goals/Log/hint only exist in a game */
#title{top:var(--gx-bar-h,52px)}
#title .art.bgart{top:var(--gx-bar-h,52px);height:auto;bottom:0}
body:has(#title:not([hidden])) #goalsbtn,body:has(#title:not([hidden])) [data-gx="logd"],body:has(#title:not([hidden])) #bulbbtn{display:none}
.goalline{background:rgba(224,169,72,.22);border:2px solid var(--acc);border-radius:12px;padding:6px 10px}
body:has(#title:not([hidden])) #barstat{display:none}
.gx-set-nav{flex-wrap:wrap}
.gx-set-nav .gx-chip{flex:0 0 auto;white-space:nowrap;padding:2px 12px}
.tbirds{gap:10px;margin-top:16px}.tbirds .bc{width:92px;height:116px}
/* drawers and their scrim sit above every overlay (the title keeps the top bar) */
.gx-scrim{z-index:56}.gx-drawer{z-index:57}
@media (max-width:640px){.gx-drawer{bottom:0;right:0;width:100%;border-radius:14px 14px 0 0}}
/* bubbles are always opaque; story-map title never breaks mid-word */
.gxh-bub,.gxh-bub.gxt-bub{animation:none!important;opacity:1!important;background:#f3e6bf!important}
.gxc-htitle{font-size:14px;overflow-wrap:normal;word-break:normal;text-wrap:balance;hyphens:none}
.gxc-head .gxc-ib,.gxc-head button{white-space:nowrap}
@media (min-width:1024px){.gxc-htitle,.gxc-htitle b{font-size:19px!important}}
/* card finish: habitat colour band, power text laid out like a real card */
.bc .hband{position:absolute;left:0;right:0;top:0;height:6px;display:flex;z-index:2}
.bc .hband i{flex:1;display:block}
.bc .pwt{margin:1px 3px 0;padding:2px 4px;border-radius:5px;font-size:10.5px;line-height:1.15;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;border-left:4px solid #bbb;background:#efe5cb}
.bc .pwt.brown{border-left-color:#8a5a32;background:#f1e0c8}.bc .pwt.pink{border-left-color:#d77aa0;background:#f8e2ec}.bc .pwt.white{border-left-color:#c9c3b2;background:#f4f1e8}
.bc.on-board .hband{height:4px}
/* glowing legal targets */
.glow{outline:3px solid #ffd76a;outline-offset:1px;box-shadow:0 0 14px 3px rgba(255,215,106,.85);animation:gl 1.2s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 4px 1px rgba(255,215,106,.5)}}
.sel{transform:translateY(-6px);outline:3px solid #fff;box-shadow:0 0 16px #fff}
.firing{animation:firing .65s ease;z-index:5}
@keyframes firing{0%{transform:scale(1)}35%{transform:scale(1.14);box-shadow:0 0 22px 6px #ffd76a}100%{transform:scale(1)}}
.popfx{position:fixed;z-index:70;pointer-events:none;padding:3px 9px;border-radius:12px;background:var(--moss);color:#fff;font-weight:700;font-size:var(--fs);white-space:nowrap;animation:popup 1.1s ease forwards;box-shadow:0 2px 8px rgba(0,0,0,.4)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-10px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
.chainline{position:fixed;z-index:69;pointer-events:none;border-radius:10px;border:3px solid #ffd76a;box-shadow:0 0 18px #ffd76a;animation:chain 1.2s ease forwards}
@keyframes chain{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}
/* ---- dock */
.gx-dock{background:var(--paper);color:var(--ink)}
.gx-dock-head{font-size:var(--fs)}
.gx-dock-head .gx-ibtn{background:rgba(0,0,0,.06)}
#dockbody{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
#prompt{font-weight:700;font-size:calc(var(--fs)*1.08);line-height:1.25;min-height:1.3em}
#acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{appearance:none;border:1px solid rgba(0,0,0,.25);border-radius:10px;background:#fffaf0;color:var(--ink);min-height:44px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:var(--fs);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--moss);color:#fff;border-color:var(--moss)}
.btn:disabled{opacity:.5;cursor:default}
.btn .fi{width:22px;height:22px}
#foodrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--fs)}
#foodrow .fd{display:inline-flex;align-items:center;gap:3px;font-weight:700}
#foodrow .fd.zero{opacity:.45}
#foodrow .fd .fi{width:24px;height:24px}
#hand{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none;min-height:248px}
#hand::-webkit-scrollbar{display:none}
#hand .bc{flex:0 0 auto;width:calc((100% - 16px) / 3);height:238px}
#hand .bc .pic{flex:0 0 56px}
#hand .bc .nm{font-size:14px}
#hand .bc .pwt{font-size:13px;line-height:1.15;-webkit-line-clamp:6;margin:2px 3px;padding:2px 3px}
#hand .bc.cant{filter:saturate(.45) brightness(.92)}
#hand .empty{font-size:var(--fs);opacity:.7;padding:8px}
@media (max-width:999px){#feeder{grid-template-columns:repeat(3,44px);width:auto;gap:4px;padding:5px}.die{width:44px;height:44px;padding:4px}}
@media (max-width:999px) and (max-height:700px){:root{--gx-sheet-h:41dvh}#feeder{grid-template-columns:repeat(5,36px);gap:2px;padding:4px}.die{width:36px;height:36px;padding:2px}.tcard{width:36px}.deck{width:44px;min-height:48px}#mid{min-height:0;gap:4px}#opps{min-height:40px}.opp{min-height:40px}#goalbar{min-height:26px;padding:1px 8px}#hand{min-height:200px}#hand .bc{height:196px;width:calc((100% - 16px) / 3)}#hand .bc .pwt{-webkit-line-clamp:3}}
@media (max-width:999px) and (orientation:landscape) and (max-height:520px){.gx-main{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr)}.gx-dock{max-height:none;border-radius:0}.gx-grab{display:none}.gx-dock-head .gx-ibtn{display:none}
#hand{flex-wrap:wrap;overflow-x:hidden;min-height:0}#hand .bc{width:calc((100% - 12px) / 3);height:176px}.gx-drawer{top:calc(var(--gx-bar-h) + 6px);left:auto;right:6px;bottom:6px;width:min(520px,calc(100vw - 12px));height:auto;max-height:none;border-radius:var(--gx-radius);transform:translateX(calc(100% + 16px))}.ttl{margin-top:8px;font-size:30px}.tbirds{display:none}.tmenu{margin-top:8px;gap:8px}.tmenu .btn,.tmenu button[data-gxt-open]{min-height:48px}}
@media (min-width:1000px){#hand{flex-wrap:wrap;overflow-x:hidden;overflow-y:visible}#hand .bc{width:172px;height:300px}#hand .bc .pic{flex-basis:110px}#hand .bc .nm{font-size:16px}#hand .bc .pwt{font-size:16px;-webkit-line-clamp:6;margin:2px 4px}.tcard{width:min(96px,30%)}#feeder{width:min(36%,300px)}.deck{width:72px;min-height:80px}#opps{min-height:52px}:root{--rh:96px}}
/* ---- overlays */
.ovl{position:fixed;inset:0;z-index:50;overflow:auto;background:radial-gradient(ellipse at 50% 20%,#3d5a3a,#16221a 80%);color:var(--paper);display:flex;flex-direction:column;align-items:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ovl .art.bgart{position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.55}
.ovl h2{margin:6px 0;font-size:calc(var(--fs)*1.5);text-align:center}
.ovl p{margin:4px 0;font-size:var(--fs);text-align:center;max-width:560px;line-height:1.35}
.ttl{font-size:calc(var(--fs)*2.6);margin:24px 0 4px;text-align:center;color:#fff3d6;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.sub{opacity:.9;font-size:calc(var(--fs)*1.08)}
.tmenu{display:flex;flex-direction:column;gap:10px;width:min(360px,100%);margin-top:18px}
.tmenu .btn{justify-content:center;width:100%;min-height:52px;font-size:calc(var(--fs)*1.1)}
.tmenu .btn.big{min-height:60px;font-size:calc(var(--fs)*1.35);background:var(--acc);border-color:#b07a2a;color:var(--ink)}
.tmenu .btn small{font-weight:400;opacity:.85}
.tmenu button[data-gxt-open]{appearance:none;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(255,255,255,.1);color:var(--paper);min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs)}
.tbirds{display:flex;gap:6px;margin-top:10px;justify-content:center}
.cfg{width:min(520px,100%);background:rgba(0,0,0,.25);border-radius:14px;padding:10px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.cfg .lab{font-weight:700;font-size:var(--fs)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .btn{flex:1 1 auto;justify-content:center;min-width:44px}
.seg .btn.on{background:var(--acc);border-color:#b07a2a}
.seatrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seatrow .nm{min-width:68px;font-weight:700}
.keepgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.keepgrid .bc{width:104px;height:150px}
.keepgrid .bc .pic{flex:0 0 58px}
.keepgrid .bc.off{opacity:.45;filter:grayscale(.6)}
.keepgrid .fbtn{appearance:none;width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.3);background:rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.keepgrid .fbtn .fi{width:44px;height:44px}
.keepgrid .fbtn.off{opacity:.4}
.keepgrid .fbtn.on,.keepgrid .bc.on{border-color:#ffd76a;box-shadow:0 0 12px #ffd76a}
.bonc{width:min(250px,46%);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px;border:3px solid transparent;cursor:pointer;text-align:left;appearance:none;font-size:var(--fs)}
.bonc b{display:block;font-size:calc(var(--fs)*1.08)}
.bonc.on{border-color:#ffd76a;box-shadow:0 0 12px #ffd76a}
.stand{width:min(560px,100%);border-collapse:collapse;background:rgba(0,0,0,.25);border-radius:12px;overflow:hidden;font-size:var(--fs);margin:8px 0}
.stand th,.stand td{padding:6px 5px;text-align:center;border-bottom:1px solid rgba(255,255,255,.12)}
.stand th:first-child,.stand td:first-child{text-align:left}
.stand tr.win td{color:#ffe2a0;font-weight:700}
.pop{position:fixed;inset:0;z-index:55;background:rgba(10,14,10,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.pop .card{width:min(340px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:16px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.pop .bigpic{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden}
.pop .bigpic .art{position:absolute;inset:0;width:100%;height:100%}
.pop .bigpic .art svg{position:absolute;inset:0;width:100%;height:100%}
.pop .bigpic .art.ph svg:not(.phbg){left:10%;top:12%;width:80%;height:84%}
.pop h3{margin:8px 0 4px;font-size:calc(var(--fs)*1.3)}
.pop .facts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:var(--fs);margin:4px 0}
.pop .pw{border-radius:10px;padding:8px;font-size:var(--fs);margin:6px 0;line-height:1.35}
