<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animations</title>
<style>
  :root { --bg: #111215; --card: #1d2025; --card2: #24272d; --line: #2d3138; --ink: #ecebe7; --mute: #9599a1; --dim: #6c7078; --accent: #f2b33d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex-wrap: wrap;
           background: rgba(17,18,21,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; } header h1 span { color: var(--accent); }
  nav.tabs { display: flex; gap: 4px; } nav.tabs a { text-decoration: none; padding: 6px 10px; border-radius: 7px; color: var(--mute); }
  nav.tabs a.on { background: var(--card2); color: var(--ink); } nav.tabs a:hover { color: var(--ink); }
  .ctl { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--mute); font-size: 13px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--card); border: 0; padding: 5px 10px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: #15171a; }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  main { padding: 18px 22px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; }
  .clip { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .view { position: relative; aspect-ratio: 16 / 9; background: var(--bgc, #1b1d22) center / cover no-repeat; }
  .view.check { background: repeating-conic-gradient(#3a3d44 0 25%, #2a2d33 0 50%) 0 0 / 22px 22px; }
  .view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .view .tag { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 999px; }
  .meta { padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .meta b { font-size: 15px; } .meta span { color: var(--dim); font-size: 12px; }
  .meta .sp { flex: 1; }
  .btn { background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 12.5px; text-decoration: none; color: var(--ink); }
  .empty { color: var(--mute); padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>Flow <span>Animations</span></h1>
  <nav class="tabs"><a href="board.html">Production</a><a href="assets.html">Assets</a><a href="screens.html">Screens</a><a class="on" href="anims.html">Animations</a><a href="music.html">Music</a><a href="flow.html">Flow planner</a></nav>
  <div class="ctl">
    <span class="seg" id="mode"><button data-m="cut" class="on">Transparent (game-ready)</button><button data-m="src">Original from Flow</button><button data-m="both">Side by side</button></span>
    <label>Background <select id="bg"><option value="table">Game table</option><option value="#1b1d22">Dark</option><option value="#2a8f8a">Teal</option><option value="#f4f2ee">Light</option><option value="check">Checker</option></select></label>
  </div>
</header>
<main id="out"></main>
<script>
// Clips from flow-video/<game>/: <name>.webm = cut out with vm/cutout_video.py (VP9 + alpha, plays transparent in Chrome/Edge/Firefox), <name>.mp4 = Flow original.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let CLIPS = [], TABLES = {}, MODE = 'cut';
const tableOf = g => { const t = TABLES[g] || []; const f = t.find(x => !x.includes('phone')) || t[0]; return f ? `/repo/${g}/media/${f}` : ''; };
function view(c, src, tag) {
  const bg = $('bg').value, cls = bg === 'check' ? 'view check' : 'view';
  const style = bg === 'table' ? `background-image:url('${esc(tableOf(c.game))}')` : bg === 'check' ? '' : `--bgc:${bg}`;
  return `<div class="${cls}" style="${style}"><video src="/${esc(src)}" autoplay loop muted playsinline></video><span class="tag">${tag}</span></div>`;
}
function draw() {
  if (!CLIPS.length) { $('out').innerHTML = '<div class="empty">No clips yet in flow-video/&lt;game&gt;/.</div>'; return; }
  $('out').innerHTML = CLIPS.map(c => `<div class="clip">
    ${MODE !== 'src' ? view(c, c.webm, 'transparent WebM') : ''}${MODE !== 'cut' && c.mp4 ? view(c, c.mp4, 'Flow original') : ''}
    <div class="meta"><b>${esc(c.name)}</b><span>${esc(c.game)} · ${c.kb} KB · ${new Date(c.t * 1000).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
      <span class="sp"></span>${c.sheet ? `<a class="btn" href="/${esc(c.sheet)}" target="_blank">Frames</a>` : ''}<a class="btn" href="/${esc(c.webm)}" download>WebM</a></div></div>`).join('');
}
$('mode').onclick = e => { const b = e.target.closest('button'); if (!b) return; MODE = b.dataset.m; $('mode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
$('bg').onchange = draw;
Promise.all([fetch('anims.json', { cache: 'no-store' }).then(r => r.json()), fetch('tables.json', { cache: 'no-store' }).then(r => r.json())])
  .then(([c, t]) => { CLIPS = c; TABLES = t; draw(); });
</script>
</body>
</html>
