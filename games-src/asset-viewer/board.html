<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg: #111215; --rail: #16181c; --card: #1d2025; --card2: #24272d; --line: #2d3138; --ink: #ecebe7; --mute: #9599a1; --dim: #6c7078; --accent: #f2b33d;
          --planned: #5b616b; --redo: #e0574a; --generated: #c9a24a; --approved: #4cb36b; --prepped: #4fa3c9; --pushed: #8d97ff; --wired: #b98cff; --crossed: #4fb3ad; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex-wrap: wrap;
           background: rgba(17,18,21,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; } header h1 span { color: var(--accent); }
  nav.tabs { display: flex; gap: 4px; } nav.tabs a { text-decoration: none; padding: 6px 10px; border-radius: 7px; color: var(--mute); }
  nav.tabs a.on { background: var(--card2); color: var(--ink); } nav.tabs a:hover { color: var(--ink); }
  .btn { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
  .btn:hover { border-color: #49505a; } .btn.primary { background: var(--accent); color: #1b1404; border-color: var(--accent); font-weight: 600; }
  a.btn { color: var(--ink); text-decoration: none; text-align: center; }
  #upd { margin-left: auto; color: var(--dim); font-size: 12px; }
  main { padding: 18px 22px 60px; max-width: 1500px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--mute); font-size: 12.5px; margin: 6px 0 16px; }
  .legend i, .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .funnel { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-bottom: 18px; }
  .funnel div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .funnel b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .funnel small { color: var(--mute); }
  .funnel div::before { content: ""; display: block; height: 4px; border-radius: 2px; margin-bottom: 8px; background: var(--c); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--dim); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--mute); } td.num b { color: var(--ink); }
  tr.g { cursor: pointer; } tr.g:hover td { background: #171a1e; } tr.g.on td { background: #221f14; }
  .gname { display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .gname img { width: 56px; height: 30px; object-fit: cover; border-radius: 5px; background: #000; }
  .stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); min-width: 260px; }
  .stack i { display: block; height: 100%; }
  .ready { font-weight: 700; font-variant-numeric: tabular-nums; }
  .detail { margin-top: 26px; }
  .detail h2 { margin: 0 0 6px; font-size: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .detail .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 14px; }
  .detail .tools input, .detail .tools select { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .cols { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; align-items: start; overflow-x: auto; }
  .col { background: #15171b; border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 120px; }
  .col h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--mute); display: flex; justify-content: space-between; }
  .col h3::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; display: inline-block; }
  .col h3 span:first-child { flex: 1; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; max-height: 70vh; overflow: auto; }
  .t { background: var(--card); border: 1px solid transparent; border-radius: 7px; overflow: hidden; cursor: pointer; padding: 0; text-align: left; position: relative; }
  .t:hover { border-color: var(--accent); }
  .t img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #f4f2ee; display: block; }
  .t .ph { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 10px; padding: 4px; text-align: center;
           background: repeating-linear-gradient(45deg, #1f2227 0 7px, #1a1c20 7px 14px); }
  .t span { display: block; font-size: 10.5px; padding: 3px 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t.note::after { content: "✎"; position: absolute; top: 3px; right: 4px; font-size: 11px; background: var(--redo); color: #fff; border-radius: 4px; padding: 0 3px; }
  .t.k3d::before { content: "3D"; position: absolute; top: 3px; left: 4px; font-size: 10px; font-weight: 700; background: #8d97ff; color: #10122a; border-radius: 4px; padding: 0 4px; }
  .t.k3d img { background: #d9d9d9; }
  #rv model-viewer { width: 100%; height: calc(100vh - 60px); background: #2a2d33; border-radius: 8px; }
  /* review */
  #rv { position: fixed; inset: 0; z-index: 20; background: rgba(8,9,11,.96); display: grid; grid-template-columns: 1fr 380px; }
  #rv[hidden] { display: none; }
  #rv .stage { display: flex; align-items: center; justify-content: center; padding: 30px; position: relative; gap: 18px; }
  #rv .stage img { max-width: 100%; max-height: calc(100vh - 60px); background: #f4f2ee; border-radius: 8px; }
  #rv .stage .old { max-width: 38%; opacity: .8; outline: 2px solid var(--redo); }
  #rv .side { background: var(--rail); border-left: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  #rv h2 { margin: 0; font-size: 18px; word-break: break-word; }
  #rv .meta { color: var(--mute); font-size: 12.5px; }
  #rv .prompt { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12.5px; line-height: 1.5; color: #d4d3cf; }
  #rv textarea { width: 100%; min-height: 70px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
  #rv .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #rv .acts button { padding: 12px; border-radius: 10px; border: 0; font-weight: 700; cursor: pointer; font-size: 15px; }
  #rv .keep { background: var(--approved); color: #0b1a10; } #rv .redo { background: var(--redo); color: #fff; }
  #rv .acts .clear { grid-column: 1 / -1; background: var(--card2); color: var(--ink); font-weight: 500; font-size: 13px; padding: 8px; }
  #rv .keys { color: var(--dim); font-size: 12px; }
  #rv .keys kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--mute); }
  #rv .close { position: absolute; top: 12px; left: 12px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #15171a; padding: 8px 14px; border-radius: 8px;
           z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Production <span>Board</span></h1>
  <nav class="tabs"><a class="on" href="board.html">Production</a><a href="assets.html">Assets</a><a href="screens.html">Screens</a><a href="anims.html">Animations</a><a href="flow.html">Flow planner</a><a href="index.html">3D votes</a></nav>
  <button class="btn primary" id="reviewAll">Review new images</button>
  <span id="upd"></span>
</header>
<main>
  <div class="legend" id="legend"></div>
  <div class="funnel" id="funnel"></div>
  <table><thead><tr><th>Game</th><th>Pipeline</th><th class="num">Ready</th><th class="num">To review</th><th class="num">Redo</th><th class="num">Planned</th><th class="num">Approved</th><th class="num">In repo</th><th class="num">Wired</th></tr></thead>
    <tbody id="games"></tbody></table>
  <section class="detail" id="detail"></section>
</main>
<div id="rv" hidden role="dialog" aria-modal="true" aria-label="Review image">
  <div class="stage" id="rvStage"></div>
  <div class="side" id="rvSide"></div>
</div>
<div id="toast"></div>
<script>
// Pipeline per generated 2D picture (stages from flow_status.py): planned -> generated -> approved -> prepped -> pushed -> wired,
// with redo (sent back to Flow) and crossed (replaced by an approved 3D model). Keep/Redo posts to /votes2d (votes2d.py).
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nice = g => g.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const ST = [['planned', 'Planned'], ['redo', 'Redo'], ['generated', 'To review'], ['approved', 'Approved'], ['prepped', 'Prepped (repo media)'],
            ['pushed', 'Pushed to GitHub'], ['wired', 'Wired in game'], ['crossed', 'Crossed out (3D)']];
const LABEL = Object.fromEntries(ST);
let ITEMS = [], COVERS = {}, GAME = '', Q = '', WAVE = '', QUEUE = [], QI = 0;

async function load() {
  const d = await fetch('flow.json', { cache: 'no-store' }).then(r => r.json());
  COVERS = d.covers || {};
  ITEMS = [];
  for (const b of d.batches) if (b.root === 'flow-2d')
    for (const i of b.items) ITEMS.push({ game: b.game, wave: b.wave, ratio: b.ratio, batch: b.kind, ...i });
  for (const c of d.crossed || []) ITEMS.push({ game: c.game, name: c.name, wave: c.wave, stage: 'crossed', prompt: `Replaced by the approved 3D model ${c.twin}.` });
  // 3D models: approved -> on GitHub -> wired; votes are cast on the 3D page (index.html)
  for (const m of d.models || []) ITEMS.push({ game: m.game, name: m.name, kind: '3d', wave: '3D models', stage: m.stage, thumb: m.src, glb: m.glb, kb: m.kb,
    prompt: m.replaces.length ? `3D model; replaces the painted ${m.replaces.join(', ')}.` : '3D model for the board; the game code has to load it.' });
  $('upd').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  draw();
}
const count = (list, s) => list.filter(i => i.stage === s).length;
const stack = list => `<div class="stack">${ST.map(([s]) => { const n = count(list, s); return n ? `<i style="width:${n / list.length * 100}%;background:var(--${s})" title="${LABEL[s]}: ${n}"></i>` : ''; }).join('')}</div>`;
// "ready" = approved or further along, out of everything that is not crossed out
const ready = list => { const live = list.filter(i => i.stage !== 'crossed'); return live.length ? Math.round(live.filter(i => ['approved', 'prepped', 'pushed', 'wired'].includes(i.stage)).length / live.length * 100) : 0; };

function draw() {
  $('legend').innerHTML = ST.map(([s, l]) => `<span><i style="background:var(--${s})"></i>${l}</span>`).join('');
  $('funnel').innerHTML = ST.map(([s, l]) => `<div style="--c:var(--${s})"><b>${count(ITEMS, s)}</b><small>${l}</small></div>`).join('');
  const games = [...new Set(ITEMS.map(i => i.game))].sort();
  $('games').innerHTML = games.map(g => {
    const l = ITEMS.filter(i => i.game === g), cov = COVERS[g] || COVERS[g === 'thornbound' ? 'thornbound-throne' : g] || '';
    return `<tr class="g ${g === GAME ? 'on' : ''}" data-g="${g}"><td><div class="gname">${cov ? `<img src="${esc(cov)}" alt="">` : ''}${esc(nice(g))}</div></td>
      <td>${stack(l)}</td><td class="num"><span class="ready">${ready(l)}%</span></td><td class="num"><b>${count(l, 'generated')}</b></td><td class="num">${count(l, 'redo')}</td>
      <td class="num">${count(l, 'planned')}</td><td class="num">${count(l, 'approved')}</td><td class="num">${count(l, 'prepped') + count(l, 'pushed')}</td><td class="num">${count(l, 'wired')}</td></tr>`;
  }).join('');
  detail();
}
function filtered() {
  const q = Q.toLowerCase();
  return ITEMS.filter(i => i.game === GAME && (!WAVE || i.wave === WAVE) && (!q || i.name.includes(q) || (i.prompt || '').toLowerCase().includes(q) || (i.note || '').toLowerCase().includes(q)));
}
function detail() {
  if (!GAME) { $('detail').innerHTML = '<p style="color:var(--mute)">Pick a game to see every picture by stage, or press <b>Review new images</b>.</p>'; return; }
  const all = ITEMS.filter(i => i.game === GAME), list = filtered(), waves = [...new Set(all.map(i => i.wave))].sort();
  const keepFocus = document.activeElement && document.activeElement.id === 'q';
  $('detail').innerHTML = `<h2>${esc(nice(GAME))} <span class="ready" style="font-size:14px;color:var(--mute)">${ready(all)}% ready</span>
      <button class="btn primary" data-review="${GAME}">Review ${count(all, 'generated')} new</button>
      <a class="btn" href="screens.html#${GAME}" style="text-decoration:none">See in game</a></h2>
    <div class="tools"><input id="q" type="search" placeholder="Search name, prompt, note" value="${esc(Q)}">
      <select id="wave"><option value="">All waves</option>${waves.map(w => `<option ${w === WAVE ? 'selected' : ''}>${esc(w)}</option>`).join('')}</select>
      <span style="color:var(--dim);font-size:12px">${list.length} pictures · click one to review it</span></div>
    <div class="cols">${ST.filter(([s]) => s !== 'crossed' || count(all, 'crossed')).map(([s, l]) => { const c = list.filter(i => i.stage === s);
      return `<div class="col" style="--c:var(--${s})"><h3><span>${l}</span><span>${c.length}</span></h3><div class="tiles">${c.map(i => `<button class="t ${i.note ? 'note' : ''} ${i.kind === '3d' ? 'k3d' : ''}" data-n="${esc(i.name)}" data-k="${i.kind || '2d'}" title="${esc(i.name + (i.note ? ' · ' + i.note : ''))}">
        ${i.thumb ? `<img src="${esc(i.thumb)}" loading="lazy" alt="">` : i.old ? `<img src="${esc(i.old)}" loading="lazy" alt="" style="opacity:.45">` : `<div class="ph">${esc((i.prompt || '').slice(0, 50))}</div>`}
        <span>${esc(i.name)}</span></button>`).join('')}</div></div>`; }).join('')}</div>`;
  if (keepFocus) { const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

// ---------- review: one picture at a time, K = keep, R = redo (note), arrows skip ----------
function review(list, start = 0) { QUEUE = list; QI = start; if (!QUEUE.length) return toast('Nothing to review here'); showRv(); }
function showRv() {
  const i = QUEUE[QI]; if (!i) { closeRv(); return toast('Review done'); }
  $('rvStage').innerHTML = `<button class="btn close" id="rvx">Close (Esc)</button>
    ${i.kind === '3d' ? `<model-viewer src="/${esc(i.glb)}" camera-controls auto-rotate shadow-intensity="1" exposure="1.1"></model-viewer>` : ''}
    ${i.old ? `<img class="old" src="/${esc(i.old)}" alt="previous" title="previous picture (sent to redo)">` : ''}
    ${i.kind === '3d' ? '' : i.thumb ? `<img src="/${esc(i.full)}" alt="${esc(i.name)}">` : `<div style="color:var(--mute)">${i.stage === 'redo' ? 'Waiting for Flow to make it again' : 'Not generated yet'}</div>`}`;
  $('rvSide').innerHTML = `<div class="meta">${QI + 1} / ${QUEUE.length} · ${esc(nice(i.game))} · ${esc(i.wave || '')} · ${esc(i.ratio || '')}</div>
    <h2>${esc(i.name)}</h2><div class="meta">Stage: <b style="color:var(--${i.stage})">${LABEL[i.stage]}</b>${i.twin ? ` · approved 3D model “${esc(i.twin)}” covers this` : ''}</div>
    <div class="prompt">${esc(i.prompt || '')}</div>
    ${i.kind === '3d' ? '' : `<label class="meta" for="note">Note for the redo (added to the prompt)</label><textarea id="note" maxlength="300" placeholder="e.g. less dark, no text, rounder shape">${esc(i.note || '')}</textarea>`}
    <div class="acts">${i.kind === '3d' ? `<a class="btn" href="index.html" style="grid-column:1/-1">Vote on the 3D page</a>` : `<button class="keep" id="rvk">Keep (K)</button><button class="redo" id="rvr">Redo (R)</button>
      ${i.vote ? '<button class="clear" id="rvc">Clear my vote</button>' : ''}`}</div>
    <div class="keys"><kbd>K</kbd> keep · <kbd>R</kbd> redo · <kbd>←</kbd> <kbd>→</kbd> previous / next · <kbd>Esc</kbd> close</div>
    <a class="btn" href="screens.html#${i.game}" style="text-decoration:none;text-align:center">See it in the game</a>`;
  $('rv').hidden = false;
  $('rvx').onclick = closeRv; if ($('rvk')) { $('rvk').onclick = () => vote('ok'); $('rvr').onclick = () => vote('redo'); }
  if ($('rvc')) $('rvc').onclick = () => vote(null);
}
function closeRv() { $('rv').hidden = true; load(); }
async function vote(v) {
  const i = QUEUE[QI], note = $('note') ? $('note').value : '';
  if (i.kind === '3d') return toast('3D models are voted on the 3D page');
  const r = await fetch('votes2d', { method: 'POST', body: JSON.stringify({ key: `${i.game}/${i.name}`, v, note }) });
  if (!r.ok) return toast('Save failed');
  i.vote = v; i.note = note; toast(v === 'ok' ? 'Kept' : v === 'redo' ? 'Sent to redo' : 'Vote cleared');
  QI++; showRv();
}
function toast(m) { $('toast').textContent = m; $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1400); }

document.addEventListener('click', e => {
  const tr = e.target.closest('tr.g'); if (tr) { GAME = tr.dataset.g === GAME ? '' : tr.dataset.g; WAVE = ''; Q = ''; draw(); return $('detail').scrollIntoView({ behavior: 'smooth' }); }
  const t = e.target.closest('.t'); if (t) { const l = filtered().filter(i => i.stage !== 'crossed'); return review(l, Math.max(0, l.findIndex(i => i.name === t.dataset.n && (i.kind || '2d') === t.dataset.k))); }
  const rb = e.target.closest('[data-review]'); if (rb) return review(ITEMS.filter(i => i.game === rb.dataset.review && i.stage === 'generated' && i.kind !== '3d'));
});
document.addEventListener('input', e => { if (e.target.id === 'q') { Q = e.target.value; detail(); } });
document.addEventListener('change', e => { if (e.target.id === 'wave') { WAVE = e.target.value; detail(); } });
$('reviewAll').onclick = () => review(ITEMS.filter(i => i.stage === 'generated' && i.kind !== '3d'));
document.addEventListener('keydown', e => {
  if ($('rv').hidden || e.target.id === 'note') { if (e.key === 'Escape' && !$('rv').hidden) closeRv(); return; }
  if (e.key === 'Escape') closeRv(); else if (e.key === 'k' || e.key === 'K') vote('ok'); else if (e.key === 'r' || e.key === 'R') vote('redo');
  else if (e.key === 'ArrowRight') { QI = Math.min(QI + 1, QUEUE.length - 1); showRv(); } else if (e.key === 'ArrowLeft') { QI = Math.max(QI - 1, 0); showRv(); }
});
load();
</script>
</body>
</html>
