<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<symbol id="i-log" viewBox="0 0 24 24"><path d="M7 4h10.5A2.5 2.5 0 0 1 20 6.5V17"/><path d="M4 6.5A2.5 2.5 0 0 1 9 6.5V18a2.5 2.5 0 0 0 2.5 2.5h7A2.5 2.5 0 0 0 21 18v-1H11"/><path d="M12 9h5M12 12.5h5"/></symbol>
<symbol id="i-tiles" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.6"/><path d="M16.75 5.6v3.3M15.1 7.25h3.3"/></symbol>
<symbol id="i-rules" viewBox="0 0 24 24"><path d="M12 6.2C9.8 4.6 6.8 4.1 3.5 4.6v14.2c3.3-.5 6.3 0 8.5 1.6 2.2-1.6 5.2-2.1 8.5-1.6V4.6c-3.3-.5-6.3 0-8.5 1.6z"/><path d="M12 6.2v14.2"/></symbol>
<symbol id="i-snd" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z"/><path d="M16 9a4.2 4.2 0 0 1 0 6M18.7 6.4a8 8 0 0 1 0 11.2"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></symbol>
<symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17.5V6.2l11-2.2v11.4"/><circle cx="6.6" cy="17.6" r="2.5"/><circle cx="17.6" cy="15.5" r="2.5"/></symbol>
<symbol id="i-nomusic" viewBox="0 0 24 24"><path d="M9 17.5V6.2l11-2.2v11.4"/><circle cx="6.6" cy="17.6" r="2.5"/><circle cx="17.6" cy="15.5" r="2.5"/><path d="M3 3l18 18"/></symbol>
<symbol id="i-speed" viewBox="0 0 24 24"><path d="M4 6.5l7 5.5-7 5.5zM12.5 6.5l7 5.5-7 5.5z" fill="currentColor"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5.5v13M15.5 5.5v13" stroke-width="3"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.5l11 6.5-11 6.5z" fill="currentColor"/></symbol>
<symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-gfx" viewBox="0 0 24 24"><path d="M12 3l2.1 6.9L21 12l-6.9 2.1L12 21l-2.1-6.9L3 12l6.9-2.1z"/><path d="M19 3.5v3M17.5 5h3"/></symbol>
<symbol id="i-resize" viewBox="0 0 24 24"><path d="M12 3.5v17M8 7.5l4-4 4 4M8 16.5l4 4 4-4"/></symbol>
<symbol id="i-hide" viewBox="0 0 24 24"><path d="M3.5 12h12M11 7l5 5-5 5M20 4.5v15"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
<symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20.5c0-4 3.1-6.7 7-6.7s7 2.7 7 6.7"/></symbol>

<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5.5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5v1.2A4 4 0 0 0 8 11M16 6h3.5v1.2A4 4 0 0 1 16 11M12 13.5v3.5M8 20.5h8M9.5 17h5"/></symbol>
</defs></svg>
<div class="gx-app">
<header class="gx-bar">
  <h1><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#gz1"/></svg><span>Sunglaze</span></h1>
  <span class="gx-sp"></span>
  <button class="gx-ibtn" data-a="coach" id="coachbtn" title="Guided play: the panel explains every step"><svg class="ic" aria-hidden="true"><use href="#i-guide"/></svg><span>Guide</span></button>
  <button class="gx-ibtn" data-gx="plrd" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-players"/></svg><span>Players</span></button>
  <button class="gx-ibtn" data-gx="logd" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-log"/></svg><span>Log</span></button>
  <button class="gx-ibtn" data-gx="refd" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-tiles"/></svg><span>Tile list</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-rules"/></svg><span>Rules</span></button>
  <button class="gx-ibtn" data-a="snd" id="sndbtn" aria-label="Sound"><svg class="ic" aria-hidden="true"><use href="#i-snd"/></svg></button>
  <button class="gx-ibtn" data-a="mus" id="musbtn" aria-label="Music"><svg class="ic" aria-hidden="true"><use href="#i-music"/></svg></button>
  <button class="gx-ibtn" data-a="speed" id="speedbtn" title="How fast the computer plays"><svg class="ic" aria-hidden="true"><use href="#i-speed"/></svg><span>normal</span></button>
  <button class="gx-ibtn" data-a="gfx" id="gfxbtn" title="Graphics quality (Auto picks by device; drops a level if frames stutter)"><svg class="ic" aria-hidden="true"><use href="#i-gfx"/></svg><span>Graphics</span></button>
  <button class="gx-ibtn perfb" data-perfhud="show" aria-pressed="false" title="Show frame rate and frame time">Show speed</button>
  <button class="gx-ibtn perfb" data-perfhud="test" title="Measure each graphics level and recommend one">Test speed</button>
  <button class="gx-ibtn" data-a="pause" id="pausebtn" hidden><svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg></button>
  <button class="gx-ibtn" data-a="new"><svg class="ic" aria-hidden="true"><use href="#i-new"/></svg><span>New game</span></button>
</header>
<div class="gx-main">
  <main class="gx-board"><div class="view"><canvas id="c3" aria-label="The courtyard table in 3D. Tap a glowing tile to pick its glaze, then a glowing rack. Drag to tilt, scroll to zoom, double-click to reset."></canvas><div id="map2d" hidden></div><div id="chip" aria-hidden="true"></div></div></main>
  <aside class="gx-dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-grab" data-gx="sheet" title="Resize"></span><span class="gx-dt" id="dockt">Sunglaze</span><button class="gx-ibtn" data-gx="sheet" aria-label="Resize panel"><svg class="ic" aria-hidden="true"><use href="#i-resize"/></svg></button><button class="gx-ibtn gx-hide-narrow" data-gx="dock" aria-label="Hide panel"><svg class="ic" aria-hidden="true"><use href="#i-hide"/></svg></button></div>
    <div id="dockmsg" hidden role="status"></div><div id="ph-z" aria-live="polite"><div id="ph-st"></div><div id="ph-pop" class="ph-card" hidden></div><div id="ph-card" class="ph-card" hidden></div></div><div class="gx-dock-body" id="dockbody" aria-live="polite"></div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg> Panel</button>
</div>
</div>
<section class="gx-drawer wide" id="plrd" role="dialog" aria-label="Players"><div class="gx-drawer-head"><h2><svg class="ic" aria-hidden="true"><use href="#i-players"/></svg> Players and scores</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="plrbody"></div></section>
<section class="gx-drawer" id="logd" role="dialog" aria-label="Log"><div class="gx-drawer-head"><h2><svg class="ic" aria-hidden="true"><use href="#i-log"/></svg> Log</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="logbody"></div></section>
<section class="gx-drawer wide" id="refd" role="dialog" aria-label="Tile list"><div class="gx-drawer-head"><h2><svg class="ic" aria-hidden="true"><use href="#i-tiles"/></svg> Tiles, tokens and scoring</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="refbody"></div></section>
<section class="gx-drawer wide" id="rulesd" role="dialog" aria-label="Rules"><div class="gx-drawer-head"><h2><svg class="ic" aria-hidden="true"><use href="#i-rules"/></svg> How to play</h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body" id="rulesbody"></div></section>
<div id="modal" hidden></div>
<div id="defs"></div>

<script src="gx-help.js"></script>

<script src="gx-campaign.js"></script>
<script src="campaign-data.js"></script>
<script src="perfhud.js"></script>
<script src="gameaudio.js"></script>
<script src="audio-data.js"></script>
<script src="trystero.min.js"></script>
<script src="netroom.js"></script>
<script src="three.min.js"></script>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="rules-html.js"></script>
<script src="three3d.js"></script>
<script src="sound.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
<script src="ui8.js"></script>
<script src="ui9.js"></script>
<script src="campaign.js"></script>
<script src="hlp.js"></script>
<script src="tutor.js"></script>
</body>
</html>
