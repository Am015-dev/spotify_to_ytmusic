<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0c">
<title>Onyx Atelier</title>
<style>
/*FONTS*/
:root{--lac:#0b0a0c;--lac2:#141216;--lac3:#1d1a1f;--gold:#d8b45a;--gold2:#f1d68c;--gold3:#8f7231;--ink:#f3ead6;--mute:#bfb294;
--w:#e3ecf5;--u:#2f63d6;--g:#17a468;--r:#d4243f;--k:#3a3a44;--p:#efe2d6;--o:#e0b13e;
--deco:'Limelight',Georgia,serif;--body:'Josefin Sans',system-ui,sans-serif;--cell:52px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--lac);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
::selection{background:var(--gold);color:var(--lac)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
svg{display:block}
/* black lacquer with a faint gold deco lattice */
body{background-color:var(--lac);background-image:
 linear-gradient(135deg,rgba(216,180,90,.05) 25%,transparent 25%),linear-gradient(225deg,rgba(216,180,90,.05) 25%,transparent 25%),
 linear-gradient(45deg,rgba(216,180,90,.05) 25%,transparent 25%),linear-gradient(315deg,rgba(216,180,90,.05) 25%,transparent 25%);
 background-size:28px 28px;background-position:14px 0,14px 0,0 0,0 0}
#app{position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
/* top bar: menu, the one status line, hint, rules */
#bar{flex:0 0 44px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--gold3)}
.ib{flex:0 0 44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--gold)}
.ib svg{width:22px;height:22px}
.ib[aria-pressed="true"]{background:rgba(216,180,90,.18)}
#status{flex:1 1 auto;min-width:0;text-align:center;font-size:15px;font-weight:700;letter-spacing:.02em;line-height:1.15;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#status.rv{font-size:13px}
#status.rv{color:#f0a6b0}
/* player strips */
.ps{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;padding:3px 2px;position:relative;border-radius:10px;transition:background .3s}
.ps.turn{background:linear-gradient(180deg,rgba(216,180,90,.13),rgba(216,180,90,.03))}
.ps .top{display:flex;align-items:center;gap:5px;min-height:24px;font-size:13px;flex-wrap:nowrap;overflow:hidden}
.ps .nm{font-family:var(--deco);font-size:15px;color:var(--gold2);letter-spacing:.04em}
.ps.turn .nm::after{content:"";display:inline-block;width:7px;height:7px;margin-left:5px;border-radius:50%;background:var(--gold2);vertical-align:middle;box-shadow:0 0 6px var(--gold)}
.race{display:flex;gap:5px;align-items:center;flex:1 1 auto;min-width:0;flex-wrap:nowrap}
.race b{font-size:15px;color:var(--ink)}.race span{display:inline-flex;align-items:center;gap:2px;white-space:nowrap;color:var(--mute);font-size:13px}
.race svg{width:15px;height:15px}
.favs{display:flex;gap:2px;align-items:center}
.favb{border:0;background:none;padding:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.favb svg{width:24px;height:24px}.favb{position:relative;flex:0 0 auto}.favb .fx{position:absolute;right:-2px;bottom:-2px;font-size:13px;background:var(--gold2);color:#1a1408;border-radius:7px;min-width:14px;line-height:14px;text-align:center}
.race span{flex:0 0 auto}.resb{flex:0 0 auto}
.resb{border:1px solid var(--gold3);background:var(--lac2);border-radius:6px;height:28px;padding:0 6px;font-size:13px;color:var(--gold2);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.resb[disabled]{opacity:.55;cursor:default}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.col{position:relative;border:1px solid rgba(216,180,90,.28);background:linear-gradient(180deg,var(--lac3),var(--lac2));border-radius:8px;min-height:44px;padding:2px 0 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
#rival .cols{gap:2px}#rival .col{min-height:24px;flex-direction:row;gap:2px;padding:1px 2px;border-radius:6px}
#rival .col .bn{position:static;font-size:13px}
#me .resb{min-height:44px;min-width:44px}#me .top{align-items:center}
#rival .col.glow::after{content:'';position:absolute;left:0;right:0;top:-10px;bottom:-10px}
#rival .col .tn{font-size:13px}
#rival .top{min-height:22px}
.col .gm{width:22px;height:22px}
#rival .col .gm{width:15px;height:15px;flex:0 0 auto}
.col .tn{font-size:15px;font-weight:700;line-height:1}
.col .tn.z{opacity:.4}
.col .bn{position:absolute;top:1px;right:2px;font-size:13px;font-weight:700;color:var(--gold2);line-height:1}
.col .bn.z{display:none}
.col .cp{font-size:13px;color:var(--mute);line-height:1.1}
.col.full{border-color:var(--gold)}
/* board + side */
#mid{flex:0 0 auto;display:flex;gap:6px;align-items:stretch;justify-content:center;padding:4px 0}
#boardwrap{position:relative;padding:5px;border-radius:6px;background:linear-gradient(145deg,#2a2418,#0f0d0a);box-shadow:0 0 0 1px var(--gold3),0 0 0 3px var(--lac),0 0 0 4px var(--gold),0 6px 14px rgba(0,0,0,.6)}
#board{display:grid;grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(5,var(--cell));gap:0;background:
 repeating-linear-gradient(0deg,transparent 0 calc(var(--cell) - 1px),rgba(216,180,90,.22) calc(var(--cell) - 1px) var(--cell)),
 repeating-linear-gradient(90deg,transparent 0 calc(var(--cell) - 1px),rgba(216,180,90,.22) calc(var(--cell) - 1px) var(--cell)),#0e0c0f}
.cell{position:relative;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.cell::before{content:"";position:absolute;inset:30%;border:1px solid rgba(216,180,90,.18);transform:rotate(45deg)}
.cell .gm{width:76%;height:76%;position:relative;z-index:1;transition:transform .18s cubic-bezier(.2,.8,.3,1.2),filter .2s}
.cell.glow .gm{filter:drop-shadow(0 0 5px rgba(241,214,140,.85))}
.cell.sel .gm{transform:scale(1.14) translateY(-3px);filter:drop-shadow(0 0 7px #fff)}
.cell.sel::after{content:"";position:absolute;inset:3px;border:2px solid var(--gold2);border-radius:50%}
.cell.dim .gm{opacity:.35}
.cell.rv::after{content:"";position:absolute;inset:3px;border:2px solid #f08a9a;border-radius:50%}
#side{display:flex;flex-direction:column;gap:5px;align-items:stretch;justify-content:flex-start;min-width:100px;flex:1 1 0;max-width:130px}
.sbox{border:1px solid rgba(216,180,90,.35);border-radius:8px;padding:3px 4px;background:rgba(20,18,22,.85);text-align:center;font-size:13px;color:var(--mute)}
.sbox .row{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.sbox svg{width:22px;height:22px}
.pat{border:0;background:none;padding:0;width:44px;height:44px;position:relative}
.pat svg{width:44px;height:44px}
.pat.gone{opacity:.25}
.pat.glow{filter:drop-shadow(0 0 6px var(--gold2))}
.btn{border:1px solid var(--gold);background:linear-gradient(180deg,#2a2416,#15120c);color:var(--gold2);border-radius:8px;min-height:44px;padding:4px 8px;font-weight:700;font-size:14px;letter-spacing:.03em}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));color:#1a1408;border-color:var(--gold2)}
.btn[disabled]{opacity:.45;cursor:default}
.btn small{display:block;font-weight:400;font-size:13px;letter-spacing:0}
#takebtn .pv{display:flex;justify-content:center;gap:1px;margin-top:1px}
#takebtn .pv svg{width:15px;height:15px}
/* pyramid */
#pyr{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:var(--rg,4px);padding:2px 0}
.prow{display:flex;justify-content:center;gap:4px;align-items:center}
.card{position:relative;width:var(--cw);height:var(--ch);flex:0 0 auto;border-radius:6px;border:1px solid var(--gold);padding:0;overflow:hidden;
 background:radial-gradient(120% 90% at 50% 0%,#24202a,#0c0b0e 70%);box-shadow:inset 0 0 0 2px #0c0b0e,inset 0 0 0 3px rgba(216,180,90,.55),0 2px 5px rgba(0,0,0,.6);text-align:left;transition:transform .2s cubic-bezier(.2,.8,.3,1.2),box-shadow .2s}
.card.t2{background:radial-gradient(120% 90% at 50% 0%,#33171d,#0d0909 72%)}
.card.t3{background:radial-gradient(120% 90% at 50% 0%,#0f2b2a,#070c0c 72%)}
.card .fan{position:absolute;left:50%;top:52%;width:150%;height:150%;transform:translate(-50%,-50%);opacity:.16;pointer-events:none}
.card .pt{position:absolute;left:4px;top:2px;font-family:var(--deco);font-size:calc(min(var(--ch),var(--cw)*1.3)*.30);line-height:1;color:var(--gold2)}
.card .crs{position:absolute;left:3px;top:calc(min(var(--ch),var(--cw)*1.3)*.33);display:flex;gap:0}
.card .crs svg{width:calc(min(var(--ch),var(--cw)*1.3)*.17);height:calc(min(var(--ch),var(--cw)*1.3)*.17)}
.card .bg{position:absolute;right:3px;top:3px;width:calc(min(var(--ch),var(--cw)*1.3)*.34);height:calc(min(var(--ch),var(--cw)*1.3)*.34)}
.card .bg2{position:absolute;right:calc(min(var(--ch),var(--cw)*1.3)*.22);top:3px;width:calc(min(var(--ch),var(--cw)*1.3)*.34);height:calc(min(var(--ch),var(--cw)*1.3)*.34)}
.card .ab{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:calc(min(var(--ch),var(--cw)*1.3)*.24);height:calc(min(var(--ch),var(--cw)*1.3)*.24);color:var(--gold2)}
.card .cost{position:absolute;left:2px;right:2px;bottom:2px;display:flex;flex-wrap:wrap-reverse;gap:1px;justify-content:flex-start}
.chip{font-style:normal;min-width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1;padding:0 2px;border:1px solid rgba(0,0,0,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.c-w{background:var(--w);color:#14202c}.c-u{background:var(--u);color:#fff}.c-g{background:var(--g);color:#fff}.c-r{background:var(--r);color:#fff}.c-k{background:#55555f;color:#fff;border-color:#c9c9d4}.c-p{background:var(--p);color:#3a2a20}.c-o{background:var(--o);color:#2a1d00}
.chip.ok{outline:1px solid rgba(255,255,255,.0)}
.card.can{box-shadow:inset 0 0 0 2px #0c0b0e,inset 0 0 0 3px var(--gold2),0 0 0 2px var(--gold2),0 0 12px rgba(241,214,140,.55)}
.card.glow{box-shadow:inset 0 0 0 2px #0c0b0e,inset 0 0 0 3px var(--gold2),0 0 0 2px var(--gold2),0 0 12px rgba(241,214,140,.55)}
.card.can::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,240,200,.22) 50%,transparent 65%);transform:translateX(-120%);animation:shine 1.1s .2s 1 ease-out forwards}
@keyframes shine{to{transform:translateX(120%)}}
.card.hint,.cell.hint{animation:hintp .9s 2}
@keyframes hintp{50%{transform:translateY(-4px) scale(1.08)}}
.card.rvp{transform:translateY(-6px) scale(1.08);box-shadow:0 0 0 3px #f08a9a}
.card.empty{border:1px dashed rgba(216,180,90,.3);background:none;box-shadow:none}
.card.back{background:repeating-conic-gradient(from 0deg at 50% 100%,var(--cbk,#1b1710) 0 6deg,#0d0b08 6deg 12deg);display:flex;align-items:center;justify-content:center;flex-direction:column}
.card.back .tier{font-family:var(--deco);color:var(--gold2);font-size:calc(min(var(--ch),var(--cw)*1.3)*.32);line-height:1}
.card.back .left{font-size:13px;color:var(--mute);font-weight:700}
.card.back.none{opacity:.3}
/* sheets and modals */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:linear-gradient(180deg,#1c1913,#0c0b0d);border-top:2px solid var(--gold);border-radius:14px 14px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.6);animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet .x,.modal .x{position:absolute;right:6px;top:6px;width:44px;height:44px;padding:0}
.zoom{display:flex;gap:12px;align-items:flex-start}
.zoom .card{--cw:112px;--ch:146px;flex:0 0 auto}
.zoom .info{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.35;padding-top:2px}
.zoom h3{margin:0 0 4px;font-family:var(--deco);font-weight:400;color:var(--gold2);font-size:18px;letter-spacing:.03em;padding-right:36px}
.zoom p{margin:0 0 4px}
.zoom .pay{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:4px 0}
.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{flex:1 1 0}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#1c1913,#0c0b0d);border:1px solid var(--gold);box-shadow:0 0 0 4px var(--lac),0 0 0 5px var(--gold3),0 20px 40px rgba(0,0,0,.7);border-radius:6px;padding:16px 16px 14px;font-size:14px;line-height:1.4}
.modal h2{font-family:var(--deco);font-weight:400;color:var(--gold2);margin:0 0 8px;font-size:22px;text-align:center;letter-spacing:.04em;padding:0 36px}
.modal h3{font-family:var(--deco);font-weight:400;color:var(--gold);margin:12px 0 4px;font-size:16px}
.modal p,.modal li{margin:0 0 6px}.modal ul{padding-left:18px;margin:0 0 6px}
.pats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.patc{border:1px solid var(--gold);background:var(--lac2);border-radius:8px;width:94px;padding:6px 4px;text-align:center;font-size:13px;line-height:1.25}
.patc svg{width:56px;height:56px;margin:0 auto 2px}
.patc b{display:block;color:var(--gold2);font-size:13px}
.ref{display:flex;flex-wrap:wrap;gap:4px}.ref .card{--cw:54px;--ch:70px}
/* title */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:radial-gradient(90% 60% at 50% 35%,#211c12,#0b0a0c 70%)}
#title .sun{position:absolute;left:50%;top:34%;width:min(130vw,720px);height:min(130vw,720px);transform:translate(-50%,-50%);opacity:.5;pointer-events:none}
#title h1{position:relative;font-family:var(--deco);font-weight:400;font-size:clamp(40px,13vw,64px);line-height:.95;margin:0;text-align:center;color:var(--gold2);letter-spacing:.06em;text-shadow:0 2px 0 #4a3a14,0 0 24px rgba(216,180,90,.35)}
#title .sub{position:relative;font-size:15px;color:var(--mute);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
#title .gems{position:relative;display:flex;gap:6px;margin:4px 0 10px}
#title .gems svg{width:34px;height:34px}
#title .btn{position:relative;width:min(80vw,300px);font-size:17px;min-height:50px}
.seg{position:relative;display:flex;gap:6px}#title .seg .btn{width:auto;flex:1 1 0;min-height:44px;font-size:14px;padding:4px 12px}
.seg .btn[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408}
/* fx */
.fly{position:fixed;z-index:60;pointer-events:none;transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .5s;will-change:transform}
.pop{position:fixed;z-index:61;pointer-events:none;font-family:var(--deco);font-size:22px;color:var(--gold2);text-shadow:0 2px 4px #000;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-6px) scale(1.1);opacity:1}100%{transform:translateY(-34px) scale(1);opacity:0}}
/* story mode: the floating goal card (never takes taps) and shared-map theming */
#obj{position:fixed;left:50%;top:46px;transform:translateX(-50%);z-index:25;pointer-events:none;width:max-content;max-width:min(94vw,560px);padding:5px 12px 6px;border:1px solid var(--gold3);border-radius:8px;background:rgba(11,10,12,.86);box-shadow:0 4px 14px rgba(0,0,0,.5);text-align:center;font-size:13px;line-height:1.2;color:var(--ink);white-space:nowrap}
#obj b{display:block;color:var(--gold2);font-weight:700}#obj span{display:block;color:var(--mute)}#obj.bad{border-color:#c0504a}#obj.bad span{color:#f0a49e}
.oa-pt{width:100%;height:100%;display:block}.gxc .oa-story-out{margin:2px 0 8px;text-align:center;font-style:italic}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:62;pointer-events:none;font-family:var(--deco);font-size:26px;color:var(--gold2);text-shadow:0 2px 6px #000,0 0 18px rgba(216,180,90,.6);opacity:0;white-space:nowrap}
#toast.on{animation:toast 1.3s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
/* guide: floating window, never dims, never blocks (W645) */
#coach{position:fixed;left:0;top:0;width:0;height:0;z-index:45}
#coach .tmap{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;overflow:visible}
#coach .tmap line{stroke:#f1d68c;stroke-width:1.5;stroke-dasharray:3 2}#coach .tmap circle{fill:#f1d68c}
#coach .tlab{position:fixed;min-height:30px;padding:3px 9px;border-radius:15px;border:1px solid #1d160a;background:#f1e3bf;color:#1d160a;font:700 12px/1.1 inherit;font-family:inherit;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.6);cursor:pointer}
#coach .tlab.on{background:#f1d68c;outline:2px solid #fff}
#coach .tring{position:fixed;display:none;pointer-events:none;border-radius:12px;border:3px solid #f1d68c;box-shadow:0 0 12px rgba(241,214,140,.8);animation:tpulse 1.4s ease-in-out infinite}
@keyframes tpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.55}}
#coach .twin{position:fixed;left:8px;top:60px;width:min(320px,calc(100vw - 16px));box-sizing:border-box;background:#f1e3bf;color:#1d160a;border-radius:12px;padding:6px 12px 10px;font-size:15px;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.6)}
#coach .thead{display:flex;align-items:center;gap:4px;margin:0 -6px 2px 0;cursor:move;touch-action:none;user-select:none}
#coach .tno{flex:1 1 auto;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6b5420}
#coach .tb{min-width:36px;min-height:36px;border:0;border-radius:8px;background:#1d160a;color:#f1d68c;font:700 17px/1 inherit;font-family:inherit;padding:0}
#coach .ttl{display:block;font-size:16px}
#coach .tsay{margin:4px 0;font-weight:600}#coach .twhy{margin:0 0 4px;font-size:13px;color:#4a3a14}#coach .twhy:empty{display:none}
#coach .tchk{list-style:none;margin:4px 0;padding:0;font-size:13px}#coach .tchk li{padding-left:22px;position:relative;margin:2px 0}
#coach .tchk li::before{content:'';position:absolute;left:2px;top:1px;width:12px;height:12px;border:2px solid #6b5420;border-radius:3px}
#coach .tchk li.ok{color:#4f6b1f}#coach .tchk li.ok::before{background:#6b8f2a;border-color:#6b8f2a}
#coach .tfoot{display:flex;justify-content:flex-end}
#coach .tfoot .btn{min-height:44px;font-size:14px;padding:2px 14px;background:#1d160a;color:#f1d68c}
#coach .tchip{position:fixed;right:8px;bottom:8px;min-height:44px;padding:4px 14px;border-radius:22px;border:2px solid #1d160a;background:#f1e3bf;color:#1d160a;font:700 14px/1 inherit;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.6)}

/* player portraits, panels, log, curved bar (W636) */
.pbtn{flex:0 0 auto;border:0;background:none;padding:0;min-height:44px;min-width:56px;display:flex;align-items:center}
.av{position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:44px;border-radius:22px;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,#3a3120,#15120c);box-shadow:0 0 0 2px var(--lac),inset 0 0 8px rgba(0,0,0,.6)}
.av .nm{font-size:13px;letter-spacing:0}.ps.turn .nm::after{display:none}
