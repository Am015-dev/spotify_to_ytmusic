<!doctype html><meta charset=utf-8><body style="margin:0;background:#000"><canvas id=c width=512 height=512></canvas>
<script src="three.min.js"></script><script src="gx-glb.js"></script>
<script>
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),alpha:true,antialias:true,preserveDrawingBuffer:true,premultipliedAlpha:false});
r.setSize(512,512,false);r.setClearColor(0,0);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;
const sc=new THREE.Scene();
{const es=new THREE.Scene();const g=new THREE.Mesh(new THREE.SphereGeometry(10,32,16),new THREE.MeshBasicMaterial({side:THREE.BackSide,vertexColors:true}));
 const pos=g.geometry.attributes.position,col=[];for(let i=0;i<pos.count;i++){const y=pos.getY(i)/10;const c=new THREE.Color().setHSL(.08,.5,.25+.55*Math.max(0,y)+.15);col.push(c.r,c.g,c.b)}g.geometry.setAttribute('color',new THREE.Float32BufferAttribute(col,3));es.add(g);
 const l=new THREE.Mesh(new THREE.SphereGeometry(2,16,8),new THREE.MeshBasicMaterial({color:0xfff2d0}));l.position.set(5,6,5);es.add(l);
 const pm=new THREE.PMREMGenerator(r);sc.environment=pm.fromScene(es,.04).texture}
sc.add(new THREE.HemisphereLight(0xfff0d8,0x5a3a20,.6));const k=new THREE.DirectionalLight(0xfff0d0,2.2);k.position.set(3,5,4);sc.add(k);const rim=new THREE.DirectionalLight(0xffb060,1.2);rim.position.set(-4,2,-3);sc.add(rim);
const cam=new THREE.PerspectiveCamera(28,1,.1,100);
window.setup=async()=>{const src=await GXGLB.load('lamp.glb');const o=GXGLB.prep(src,{h:2,ground:false});window.pivot=new THREE.Group();pivot.add(o);sc.add(pivot);
 const sz=o.userData.size;const R=Math.max(sz.x,sz.z,sz.y);cam.position.set(0,.35*R,4.3*R*.9);cam.lookAt(0,-.02*R,0);return sz.toArray()};
window.frame=i=>{pivot.rotation.y=i/24*Math.PI*2;r.render(sc,cam);return document.getElementById('c').toDataURL('image/png')};
</script>
