<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
const names=new URLSearchParams(location.search).get('m').split(',');
const W=420,H=420;const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W*names.length,H);r.toneMapping=THREE.ACESFilmicToneMapping;r.outputColorSpace=THREE.SRGBColorSpace;document.body.append(r.domElement);

const hdr=await new RGBELoader().loadAsync('/assets/hdri/brown_photostudio_02_1k.hdr');hdr.mapping=THREE.EquirectangularReflectionMapping;

for(let i=0;i<names.length;i++){

 const cam=new THREE.PerspectiveCamera(30,1,.1,100);const d=Math.max(s.x,s.y,s.z)*2.4;cam.position.set(c.x+d*.5,c.y+d*.3,c.z+d*.85);cam.lookAt(c);

}
window.__info=info;window.__done=true;
</script>
