 const [wd,wn,wr]=await Promise.all([tex(P+'walnut_veneer/Diffuse.jpg',[2,1]),tex(P+'walnut_veneer/nor_gl.jpg',[2,1],false),tex(P+'walnut_veneer/Rough.jpg',[2,1],false)]);
 const wood=pbr(wd,wn,wr,{color:new THREE.Color('#a87a52')});

 for(const y of [.71,.09]){const b=new THREE.Mesh(new THREE.BoxGeometry(9,.025,.016),wood);b.position.set(0,y,.038);G.add(b)}
 const rail=new THREE.Mesh(new THREE.BoxGeometry(9,.07,.07),wood);rail.position.set(0,.8,.035);rail.castShadow=rail.receiveShadow=true;G.add(rail);

 // floor
 {const rep=[3.2,2.6];const[fd,fn,fr]=await Promise.all([tex(P+'wood_floor/Diffuse.jpg',rep),tex(P+'wood_floor/nor_gl.jpg',rep,false),tex(P+'wood_floor/Rough.jpg',rep,false)]);
  const f=new THREE.Mesh(new THREE.PlaneGeometry(9,6),pbr(fd,fn,fr,{color:new THREE.Color(night?'#c9b8a0':'#f2e2c8'),roughness:.5}));f.rotation.x=-Math.PI/2;f.position.set(0,0,3);f.receiveShadow=true;G.add(f)}
 // rug: real velour with a woven-style border drawn on top
 {const img=await TL.loadAsync(P+'velour_velvet/Diffuse.jpg');const c=document.createElement('canvas');c.width=1536;c.height=1024;const g=c.getContext('2d');
  g.fillStyle=g.createPattern(img.image,'repeat');g.fillRect(0,0,c.width,c.height);
  g.fillStyle='rgba(45,12,22,.46)';g.fillRect(0,0,c.width,c.height);
  g.strokeStyle='#d7bc84';g.lineWidth=22;g.strokeRect(40,40,c.width-80,c.height-80);g.lineWidth=6;g.strokeRect(86,86,c.width-172,c.height-172);
  g.fillStyle='rgba(0,0,0,.1)';for(let i=0;i<2200;i++)g.fillRect(Math.random()*c.width,Math.random()*c.height,2,2);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=aniso;const nrm=await tex(P+'velour_velvet/nor_gl.jpg',[6,4],false);
  const rug=new THREE.Mesh(new THREE.BoxGeometry(3.4,.014,2.3),new THREE.MeshStandardMaterial({map:t,normalMap:nrm,roughness:1}));rug.position.set(0,.007,1.3);rug.receiveShadow=true;G.add(rug)}
 // console + TV
 const TS=+(Q.get('tvs')||1.25);const CX=+(Q.get('cx')||-1.97),TVX=+(Q.get('tvx')||-1.97);
 const con=await model('modern_wooden_cabinet',0,(grp,m)=>{const b=box(m),s=+(Q.get('cw')||1.0)/(b.max.x-b.min.x);m.scale.setScalar(s);const b2=box(m);m.position.set(CX-(b2.min.x+b2.max.x)/2,-b2.min.y,.04-b2.min.z)});

 const tv=await model('Television_01','Television_01_2k_nologo.gltf',(grp,m)=>{m.scale.setScalar(+(Q.get('tvs')||1.25));const b2=box(m);m.position.set(TVX-(b2.min.x+b2.max.x)/2,cb.max.y-b2.min.y,cb.min.z+.09-b2.min.z)});

 {const cxw=(tb.min.x+tb.max.x)/2,cyw=(tb.min.y+tb.max.y)/2,pp=(px,py)=>toEm(V(cxw+(px-480)/1333*TS,cyw-(py-400)/1333*TS,tb.max.z));meta.screen=[pp(148,172),pp(638,545)];meta.knobs=[pp(762,245),pp(762,350)];meta.tvtop=pp(480,95);meta.screenBezel=[pp(122,150),pp(662,568)]}
 meta.tvfront=[toEm(V(tb.min.x,tb.max.y,tb.max.z)),toEm(V(tb.max.x,tb.max.y,tb.max.z)),toEm(V(tb.max.x,tb.min.y,tb.max.z)),toEm(V(tb.min.x,tb.min.y,tb.max.z))];
}else if(LAYER==='sprite'){

 {const b=box(tb);meta.table={min:b.min.toArray(),max:b.max.toArray(),top:[toEm(V(b.min.x,b.max.y,b.min.z)),toEm(V(b.max.x,b.max.y,b.min.z)),toEm(V(b.max.x,b.max.y,b.max.z)),toEm(V(b.min.x,b.max.y,b.max.z))]}}
 const ch=await model('mid_century_lounge_chair',0,(grp,m)=>{m.scale.setScalar(.72);const b2=box(m);m.position.set(-(b2.min.x+b2.max.x)/2,-b2.min.y,-(b2.min.z+b2.max.z)/2);grp.rotation.y=+(Q.get('cry')||-0.75);grp.position.set(+(Q.get('cx')||1.78),0,+(Q.get('cz')||1.05))});
 {const b=box(ch);meta.chair={min:b.min.toArray(),max:b.max.toArray()}}

}

Object.assign(key.shadow.camera,{left:-5,right:5,top:4,bottom:-3,near:.5,far:14});key.shadow.radius=7;key.shadow.bias=-.0004;key.shadow.normalBias=.02;sc.add(key,key.target);

if(night){const lamp=new THREE.PointLight('#ffb866',10,10,1.5);lamp.position.set(2.45,1.6,.7);lamp.castShadow=true;lamp.shadow.mapSize.set(1024,1024);lamp.shadow.bias=-.001;sc.add(lamp);
