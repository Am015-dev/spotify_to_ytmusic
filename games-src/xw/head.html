<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebula Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
:root{--bg:#07061a;--panel:#141233;--panel2:#1c1944;--ink:#ecebff;--muted:#a3a0cc;--line:#39357a;--gold:#ffc86b;--c0:#f08a3a;--c1:#e0304a;--c2:#39c27f;--good:#56e39a;--bad:#ff5a6a;--white:#f3f3ff;--red:#ff4a4a;--green:#4aff8a;--shadow:rgba(0,0,0,.45);--radius:12px}
/* dark-first: the battlefield is deep space, so the interface stays dark unless the page is explicitly set to light */
:root[data-theme="light"]{--bg:#f4f1ff;--panel:#ffffff;--panel2:#efeaff;--ink:#17133a;--muted:#5d5890;--line:#c9c2f0;--shadow:rgba(40,20,90,.15)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07061a;--panel:#141233;--panel2:#1c1944;--ink:#ecebff;--muted:#a3a0cc;--line:#39357a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 30% 0%,#2a1450 0%,var(--bg) 55%) fixed,var(--bg);color:var(--ink);font:15px/1.4 "Exo 2",system-ui,sans-serif}
h1,h2,h3,.head{font-family:Orbitron,"Exo 2",sans-serif;letter-spacing:.04em}
.gx-bar{background:linear-gradient(90deg,#1a1240,#2c1452);border-bottom:2px solid var(--gold);gap:.45rem}
.gx-bar h1{margin:0 .6rem 0 0;font-size:1.35rem;color:var(--gold);white-space:nowrap;text-shadow:0 0 12px rgba(255,200,107,.5)}
.btn{font:600 .92rem "Exo 2",sans-serif;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:.42rem .75rem;cursor:pointer;min-height:40px;text-align:left}
.btn:hover:not([disabled]){border-color:var(--gold)}.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}.btn small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.btn.primary{background:linear-gradient(180deg,#ffcf7a,#f0a340);color:#1b1030;border-color:#ffdca0}.btn.primary small{color:#3a2a10}
.btn.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,107,.35) inset}.btn.ghost{background:transparent}
.gx-bar .btn{flex:0 0 auto;padding:.3rem .6rem;min-height:40px;white-space:nowrap}
/* board-first shell, themed with the game's own colours */
:root{--gx-bar-h:52px;--gx-dock-w:clamp(320px,30vw,420px);--gx-bg:var(--bg);--gx-bar:#1a1240;--gx-panel:var(--panel);--gx-ink:var(--ink);--gx-line:var(--line);--gx-accent:var(--gold);--gx-shadow:0 20px 60px #000;--gx-radius:14px;--gx-sheet-h:46dvh}
.gx-app{background:radial-gradient(ellipse at 30% 0%,#2a1450 0%,var(--bg) 55%),var(--bg);color:var(--ink)}
.gx-board{background:#05040f}
.gx-dock{background:var(--panel);border-left:2px solid var(--line);color:var(--ink)}
.gx-dock-head{border-bottom:1px solid var(--line);font-family:Orbitron,"Exo 2",sans-serif;color:var(--gold);font-size:.9rem;letter-spacing:.03em}
.gx-dock-head .gx-ibtn{color:var(--ink)}
.gx-dock-body{padding:.55rem .75rem .8rem;display:flex;flex-direction:column;gap:.5rem}
.gx-ibtn{border-color:var(--line)}
.gx-drawer{border:2px solid var(--gold)}.gx-drawer-head h2{color:var(--gold);font-size:1.05rem}
#roster,#log,#bbody{display:none}.gx-drawer #roster{display:grid}.gx-drawer #log{display:block}.gx-drawer #bbody{display:block}
.gx-ibtn.gx-reopen{top:auto;bottom:10px;right:10px;background:rgba(20,18,50,.85);color:var(--ink)}
@media (max-width:999px){.gx-dock{border-left:0;border-top:2px solid var(--gold);box-shadow:0 -6px 24px rgba(0,0,0,.5)}.gx-grab{color:var(--muted)}}
.stage{position:absolute;inset:0;overflow:hidden;background:#05040f}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
body.flat .stage{display:none}#map{display:none;position:absolute;inset:0;width:100%;height:100%}body.flat #map{display:block}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);background:rgba(12,10,34,.82);border:1.5px solid var(--c0);border-radius:8px;padding:1px 6px;font-size:.74rem;white-space:nowrap;color:#fff;text-align:center}
.tag.s1{border-color:var(--c1)}.tag b{display:block;font-size:.78rem}.tag span em{font-style:normal;margin-right:2px}.tag .ps{color:var(--gold)}.tag .h{color:#ffd0a0}.tag .sh{color:#7fd4ff}.tag .st{color:var(--bad)}.tag .f{color:#9f9}.tag .e{color:#8ef}.tag .l{color:#ff9}.tag .io{color:#6cf}
.tag.on{box-shadow:0 0 0 2px var(--gold)}.tag.sel{background:rgba(60,40,120,.9)}
.pop{position:absolute;transform:translate(-50%,-50%);font:800 1.3rem Orbitron,"Exo 2",system-ui,sans-serif;pointer-events:none;animation:popup 1.4s ease-out forwards;text-shadow:0 0 8px #000,0 2px 0 #000}
.pop.hurt{color:#ff8a60}.pop.crit{color:#ff3a3a;font-size:1.6rem}.pop.miss{color:#9fe}.pop.tok{color:#b6ffb0}.pop.lock{color:#ffee70}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-230%)}}
.viewbar{position:absolute;left:6px;top:6px;display:flex;gap:6px;z-index:2}.viewbar .btn{min-height:40px;padding:.2rem .55rem;background:rgba(20,18,50,.8);font-size:.85rem}
.box{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:.7rem .85rem;box-shadow:0 4px 16px var(--shadow)}
.box h3{margin:.1rem 0 .5rem;font-size:.95rem;color:var(--gold)}
.steps{display:flex;gap:4px;margin:0}.st{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:.2rem 0;font-size:.74rem;color:var(--muted)}
.st b{display:block;font:800 1rem Orbitron,"Exo 2",system-ui,sans-serif}.st i{display:block;font-style:normal;font-size:.66rem}.st.on{border-color:var(--gold);color:var(--ink);background:rgba(255,200,107,.12)}.st.done b::after{content:" ✓"}
.head{font-size:1rem;color:var(--gold);margin:.2rem 0 .3rem}.how{margin:.2rem 0 .5rem;padding-left:1.2rem}.tip{background:rgba(255,200,107,.1);border:1px dashed var(--gold);border-radius:8px;padding:.3rem .5rem;font-size:.86rem}
.small{font-size:.85rem}.muted{color:var(--muted)}.warn{color:#ffb070}.bad{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}.acts.col{flex-direction:column}.acts.col .btn{width:100%}
.shipTabs{display:flex;gap:.3rem;flex-wrap:wrap;margin:.3rem 0}.tab{padding:.25rem .5rem;min-height:40px}
.dialwrap{display:flex;gap:.7rem;align-items:flex-start;flex-wrap:wrap}.dialinfo{flex:1;min-width:150px}
table.dial{border-collapse:separate;border-spacing:3px}table.dial th{font:800 .8rem Orbitron,"Exo 2",system-ui,sans-serif;color:var(--muted);padding-right:2px}
.mv{width:44px;height:44px;border-radius:9px;border:2px solid transparent;font:800 1.15rem "Exo 2";cursor:pointer;position:relative;padding:0}
.mv small{position:absolute;right:3px;bottom:1px;font-size:.6rem;opacity:.7}
.mv.w{background:#f3f3ff;color:#16133a}.mv.g{background:#4be08a;color:#06301a}.mv.r{background:#ff5a5a;color:#3a0808}
.mv.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,107,.5)}.mv.sugg{outline:3px dashed #7fd4ff;outline-offset:1px}
.dice{display:flex;gap:6px;flex-wrap:wrap;margin:.3rem 0}.die{width:46px;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;position:relative}
.die i{font:600 .55rem "Exo 2";font-style:normal;text-transform:uppercase;opacity:.85}.die.atk{background:#7a1020;color:#fff;border:2px solid #ff5a6a}.die.def{background:#0f5a32;color:#fff;border:2px solid #4be08a}
.die.blank{opacity:.55}.preview{background:var(--panel2);border-radius:8px;padding:.35rem .55rem}
.shipc{border:1.5px solid var(--line);border-radius:10px;padding:.3rem .5rem;background:var(--panel2);font-size:.84rem}.shipc .stats{display:inline}.shipc b.nm{font-size:.92rem}.shipc .vs{color:var(--muted);margin:0 .3rem}
.shipc .row2{margin-top:.15rem}.shipc .more{float:right;min-height:30px;padding:0 .45rem;font-size:.75rem}.shipc.two{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;padding:0;border:0;background:none}.shipc.two>div{border:1.5px solid var(--line);border-radius:10px;padding:.3rem .45rem;background:var(--panel2);min-width:0}
.acts.grid{display:grid;grid-template-columns:repeat(5,minmax(40px,1fr));gap:4px}.acts.grid .btn{text-align:center;padding:0;min-height:40px;font-size:.85rem}.acts.grid .gl{font-size:.7rem;color:var(--muted);text-align:center;align-self:center}
.acts.grid.g9{grid-template-columns:repeat(9,minmax(0,1fr))}.acts.grid.g9 .btn{min-width:0}
.acts.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}.acts.tiles .btn{text-align:center;font-size:.82rem;padding:.2rem .3rem}
.acts.main{position:sticky;bottom:-.8rem;background:var(--panel);padding:.35rem 0 .5rem;margin-bottom:-.5rem;z-index:1}
#lastlog{border-top:1px solid var(--line);padding-top:.35rem}#lastlog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lastlog .s0{color:#ffc79a}#lastlog .s1{color:#ff9aa6}
#prompt .head{margin-top:0}#prompt p{margin:.25rem 0}#prompt h2{margin:.2rem 0;font-size:1.1rem}
@media (max-width:999px){.gx-dock-body{gap:.35rem;padding:.4rem .6rem .7rem}.st{padding:.1rem 0;font-size:.72rem}.st b{display:inline;font-size:.8rem;margin-right:.25rem}.st i{display:none}
  .shipc .tp{display:none}.shipc{font-size:.8rem}.dice .die{width:38px;height:38px;font-size:1.05rem}#prompt .btn small{font-size:.72rem}
  #lastlog div+div{display:none}.acts{margin-top:.35rem}.acts.col{gap:.3rem}.dialinfo .tip{display:none}}
.bld h3{margin:.8rem 0 .3rem;font-size:.9rem;color:var(--muted)}.bld .card{cursor:default}
details.how2 summary{cursor:pointer;color:var(--muted);font-size:.84rem;min-height:28px}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:560px){.roster{grid-template-columns:1fr}}
.fac h3{margin:.1rem 0 .4rem}.fac.f0 h3{color:var(--c0)}.fac.f1 h3{color:var(--c1)}.fac.f2 h3{color:var(--c2)}
.card{border:1.5px solid var(--line);border-radius:10px;padding:.35rem .5rem;margin-bottom:.4rem;background:var(--panel2);cursor:pointer}.card.on{border-color:var(--gold)}.card.dead{opacity:.45;text-decoration:line-through}
.stats span{display:inline-block;min-width:2.2em;text-align:center;border-radius:6px;margin-right:3px;font-weight:800;font-size:.82rem;padding:0 .2rem}
.stats .ps{background:#5a4a10;color:#ffe08a}.stats .a{background:#6a1020;color:#ff9aa0}.stats .g{background:#0e4a2a;color:#9fffc0}.stats .h{background:#4a3a20;color:#ffd6a0}.stats .s{background:#103a5a;color:#9fdcff}
.ab,.ups,.crit{margin:.2rem 0 0;font-size:.78rem}.ups span{display:inline-block;background:rgba(127,212,255,.12);border-radius:5px;padding:0 .3rem;margin:1px}.ups .gone{text-decoration:line-through;opacity:.5}.crit{color:#ff8a8a}
#log{margin:0;padding-left:0;list-style:none;font-size:.86rem}#log li{margin:.1rem 0;padding-left:.6rem;border-left:2px solid var(--line)}#log li:first-child{border-left-color:var(--gold)}#log .s0{color:#ffc79a}#log .s1{color:#ff9aa6}
#modal{position:fixed;inset:0;background:rgba(5,4,20,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}#modal.hidden{display:none}
.dlg{background:var(--panel);border:2px solid var(--gold);border-radius:16px;max-width:720px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:1rem 1.2rem;box-shadow:0 20px 60px #000}
.dlg h1{margin:.1rem 0;color:var(--gold);font-size:2rem;text-shadow:0 0 18px rgba(255,200,107,.5)}.dlg h3{margin:.8rem 0 .3rem;font-size:.9rem;color:var(--muted)}.lead{font-size:1.02rem}
.row{display:flex;gap:.4rem;flex-wrap:wrap}.row select{font:inherit;background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:.35rem}
.exps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.4rem}.ex{text-align:left;background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:.35rem .5rem;cursor:pointer}.ex.on{border-color:var(--good)}.ex small{display:block;color:var(--muted);font-size:.74rem}
table.stats{width:100%;border-collapse:collapse}table.stats td,table.stats th{border-bottom:1px solid var(--line);padding:.25rem;text-align:left}table.stats tr.dead{opacity:.6}
.rules h3{color:var(--gold)}.rules p,.rules li{font-size:.92rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){.tag{font-size:.6rem;padding:0 4px}.tag b{font-size:.64rem;max-width:84px;overflow:hidden;text-overflow:ellipsis}.gx-bar h1{font-size:1rem}.gx-bar .btn{font-size:.82rem;padding:.25rem .5rem}.dlg{max-height:calc(100dvh - 20px)}#modal{align-items:flex-end;padding:10px}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}
.stats b{font-weight:inherit}.stats b.chg{color:#ffd76a;text-decoration:underline dotted}

/* ---- guidance layer ---- */
.gx-gear{display:none}.gx-more{display:contents}
@media (max-width:999px){.gx-gear{display:inline-flex}.gx-more{display:none;position:fixed;top:calc(var(--gx-bar-h) + 4px);right:8px;z-index:45;flex-direction:column;gap:6px;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:8px;box-shadow:0 12px 40px #000}.gx-more.open{display:flex}.gx-more .btn{width:100%}}
@media (max-width:700px){.gx-bar .btn[data-gx]{font-size:.78rem;padding:.25rem .45rem}.gx-bar h1{font-size:.92rem;margin-right:.2rem}}
.legend{align-self:center;background:rgba(12,10,34,.78);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:.72rem;color:#dcdaf5;max-width:min(560px,calc(100vw - 110px));line-height:1.35}
.legend b{font-weight:800;margin-left:4px}.legend .ps{color:var(--gold)}.legend .h{color:#ffd0a0}.legend .sh{color:#7fd4ff}.legend .f{color:#9f9}.legend .e{color:#8ef}.legend .sx{color:var(--bad)}.legend .l{color:#ff9}
body.flat .legend,body.flat .lgbtn{display:none!important}
.lgbtn{display:none}@media (max-width:700px){.legend{font-size:.66rem;padding:2px 6px;display:none}.legend.open{display:block}.lgbtn{display:inline-flex}}
.stats span i{font-style:normal;font-weight:600;font-size:.7rem;opacity:.85}
.stats span.pulse{animation:npulse 1.1s ease-in-out 2;box-shadow:0 0 0 2px #ffd76a}
@keyframes npulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.stats span.pulse{animation:none}}
.dlegend{font-size:.74rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.2rem .45rem;align-items:center;margin:.1rem 0 .25rem}.dlegend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:2px}.sw.g{background:#4be08a}.sw.w{background:#f3f3ff}.sw.r{background:#ff5a5a}
#coach{display:flex;flex-direction:column;gap:.4rem}#coach:empty{display:none}
.coach,.adv,.recap,.result,.brief{border-radius:10px;padding:.4rem .55rem;font-size:.86rem;line-height:1.35}
.coach{background:rgba(127,212,255,.1);border:1.5px solid #7fd4ff}.coach .cn,.recap .cn{display:inline-flex;width:1.35em;height:1.35em;border-radius:50%;background:#7fd4ff;color:#07203a;font-weight:800;align-items:center;justify-content:center;font-size:.8rem;margin-right:.2rem}
.linkb{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.78rem;padding:0 .2rem;min-height:24px}
.adv{background:rgba(255,200,107,.12);border:1.5px solid var(--gold);position:relative;padding-right:2.2rem}.adv .gx-x{position:absolute;right:2px;top:0;font-size:1.3rem;min-height:30px;min-width:30px;color:var(--ink)}
.recap{background:var(--panel2);border:1.5px solid var(--line)}.recap.coach{border-color:#7fd4ff}.recap h3{margin:0 0 .2rem;font-size:.88rem;color:var(--gold)}.recap ul{margin:.1rem 0;padding-left:1.1rem}.recap li{margin:.1rem 0}.recap .acts{margin-top:.25rem}
.btn.sm{min-height:34px;padding:.2rem .6rem;font-size:.82rem}
.result{background:var(--panel2);border-left:4px solid var(--muted)}.result.hurt{border-left-color:var(--bad)}.result.good{border-left-color:var(--good)}.result .crit{color:#ff8a8a;margin-top:.15rem}
.brief{background:linear-gradient(180deg,rgba(255,200,107,.1),transparent);border:1.5px solid var(--gold)}.brief h3{margin:0 0 .2rem;font-size:.88rem;color:var(--gold)}.brief p{margin:.2rem 0}
#radio:empty{display:none}#radio{color:#cfe6ff;font-style:italic}#radio b{font-style:normal}#radio .f0{color:var(--c0)}#radio .f1{color:var(--c1)}#radio .f2{color:var(--c2)}
.na-adv{min-height:32px;padding:2px 8px;font-size:.8rem;color:var(--ink);flex:0 0 auto}
.btn.big{font-size:1rem;padding:.55rem .9rem}.acts.grid .btn.rec{box-shadow:0 0 0 3px rgba(255,200,107,.6)}.acts.grid .btn.rec::after{content:"★";font-size:.7rem;margin-left:2px}
.btn.rep{border-color:#ff8a8a}
.launchbar{display:flex;align-items:center;gap:.8rem;justify-content:space-between;position:sticky;top:-1rem;background:var(--panel);padding:.2rem 0;z-index:2}.launchbar .btn{font-size:1.05rem;padding:.5rem 1.2rem}
@media (max-width:700px){.launchbar h1{font-size:1.45rem;white-space:nowrap}.launchbar .btn{white-space:nowrap;padding:.45rem .8rem}.gx-bar{gap:4px;padding-left:6px;padding-right:6px}}
label small.bio{display:block;color:var(--muted);font-size:.74rem;max-width:230px}
.debrief ul{padding-left:1.1rem}.debrief li{margin:.25rem 0}.debrief .hook{background:rgba(127,212,255,.1);border:1px dashed #7fd4ff;border-radius:8px;padding:.35rem .55rem}.debrief details{margin:.4rem 0}
.tag.coach{border-color:var(--gold);background:rgba(60,40,10,.9);color:#ffe7b0;font-weight:700;transform:translate(-50%,-50%);white-space:normal;text-align:center;max-width:160px}.tag.coach small{font-weight:400}
.roster .bio{margin:.1rem 0}
#recap:empty{display:none}
@media (max-width:999px){.na-sum .gx-dock{max-height:60dvh}}
/* phone planning: the sheet shrinks to the dial and Lock */
.na-plan .qwhy,.na-plan #shipcard,.na-plan #lastlog,.na-plan #radio,.na-plan details.how2,.na-plan .dialinfo .dname{display:none}
@media (min-width:701px) and (max-width:999px){.dialinfo .tip{display:block!important;font-size:.8rem}}

/* ---- round flow: roadmap, queue, step boxes ---- */
.gx-dock-top{flex:0 0 auto;padding:.35rem .6rem .35rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.3rem;background:rgba(0,0,0,.12)}
.gx-dock-top:has(#queue:empty) #steps:empty{display:none}
.road{display:flex;gap:3px;align-items:stretch}
.road .rn{font:800 .78rem Orbitron,"Exo 2",system-ui,sans-serif;color:var(--gold);display:flex;align-items:center;justify-content:center;padding:0 .3rem;white-space:nowrap;border:1.5px solid var(--gold);border-radius:8px;background:rgba(255,200,107,.1)}
.road .ph{flex:1 1 0;min-width:0;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);padding:.12rem .1rem;font:600 .74rem "Exo 2",system-ui,sans-serif;cursor:pointer;text-align:center;min-height:38px;line-height:1.15}
.road .ph b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.road .ph i{display:block;font-style:normal;font-size:.64rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.road .ph.next{opacity:.55}.road .ph.done{color:var(--good);border-color:rgba(86,227,154,.45)}.road .ph.on{border-color:var(--gold);background:rgba(255,200,107,.2);color:var(--ink);box-shadow:0 0 0 2px rgba(255,200,107,.25)}
