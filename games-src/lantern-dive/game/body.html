<body>
<div class="gx-app">
<header class="gx-bar">
  <h1><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#0e2146" stroke="#ffd873" stroke-width="1.4"/><circle cx="13" cy="9" r="4.4" fill="#ffe9a6" stroke="#0b1f3a" stroke-width="1"/><path d="M13 13.4C13 16 10 16 8 19" fill="none" stroke="#ffd873" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="tt">Lantern Dive</span></h1>
  <span id="barstat"></span>
  <button id="netst" type="button" data-a="netopen" hidden></button>
  <div id="barprompt"></div>
  <span class="gx-sp"></span>
  <button class="gx-ibtn" data-gx="jobd" aria-expanded="false" aria-label="All jobs" title="All jobs"><svg viewBox="0 0 24 24"><path d="M6 3H17A2 2 0 0 1 19 5V19A2 2 0 0 1 17 21H6ZM6 3V21M10 8H16M10 12H16M10 16H14"/></svg><span>Jobs</span></button>
  <button class="gx-ibtn" data-gx="logd" aria-expanded="false" aria-label="Log" title="Log"><svg viewBox="0 0 24 24"><path d="M4 5C7 4 10 4 12 6C14 4 17 4 20 5V19C17 18 14 18 12 20C10 18 7 18 4 19ZM12 6V20"/></svg><span>Log</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5C9.5 7 14.5 7 14.5 9.5C14.5 11.5 12 11.5 12 14M12 17V17.5"/></svg><span>Rules</span></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="The dive table"><div id="bd">
    <div id="opp"></div>
    <div id="felt"><div id="felttxt"></div><div id="roster"></div><div id="pool"></div><div id="slots"></div><div id="lead"></div><div id="pile"></div></div>
    <div id="mine"></div>
    <div id="handz"><div id="hand" role="group" aria-label="Your cards"></div></div>
  </div></main>
  <aside class="gx-dock" id="dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-dt">Your turn</span><button class="gx-ibtn" data-gx="dock" aria-label="Hide panel">&#8677;</button></div>
    <div class="gx-dock-body" id="dockbody">
      <div id="dockscroll">
        <div id="tip"></div>
        <div id="promptDock"><div id="prompt" aria-live="polite"></div></div>
        <div id="psub" hidden></div>
        <div id="news" aria-live="polite"></div>
        <div id="info"></div>
        <div id="jobsum"></div>
        <div id="dockpile"></div>
      </div>
      <div id="acts"></div>
    </div>
    <div class="ppop" id="ppop" hidden role="dialog" aria-label="Details"></div>
    <div class="pcard" id="pc" hidden role="dialog" aria-label="Message"></div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock">&#9776; Panel</button>
</div>
</div>
<div id="start" hidden></div>
<div id="dlg" hidden></div>
<div id="rs" hidden></div>
<div id="pass" hidden></div>
<div id="netbox" hidden></div>
<div id="toast" role="status"></div>
<script type="text/plain" id="pixi-src" src="pixi.min.js"></script>
<script src="shell.js"></script>
<script src="gx-viewport.js"></script>
<script src="gx-campaign.js"></script>
<script src="campaign-data.js"></script>
<script src="perfhud.js"></script>
<script src="trystero.min.js"></script>
<script src="netroom.js"></script>
<script src="data.js"></script>
<script src="kit.js"></script>
<script src="art-data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="netstrip.js"></script>
<script src="gameaudio.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
