<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lantern Dive</title>
<style>
/*SHELL_CSS*/
*{box-sizing:border-box}
:root{--ink:#e8f4ff;--ink2:#b9d2ee;--navy:#06142b;--deep:#0a2347;--panel:#0f2d57;--panel2:#143a6b;--line:rgba(160,205,255,.28);--gold:#ffd873;--gold2:#e0a31c;--coral:#e2607f;--tide:#3f82da;--kelp:#3fa86d;--star:#f1b82e;--ok:#35c27b;--bad:#e0583c;
  --gx-bg:#06142b;--gx-bar:#06142b;--gx-panel:#0f2d57;--gx-ink:#e8f4ff;--gx-accent:#ffd873;--gx-dock-w:clamp(330px,30vw,410px);--gx-bar-h:48px;
  --font:'Nunito','Trebuchet MS','Segoe UI',system-ui,'DejaVu Sans',sans-serif;--hw:84px;--cw:76px;--dw:46px}
html,body{font-family:var(--font);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:#06142b}
button{font-family:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px}
.gx-bar{background:var(--gx-bar);color:var(--ink);gap:8px;border-bottom:1px solid var(--line)}
.gx-bar h1{margin:0;font-size:1.15rem;display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:900}
.gx-bar h1 .ic{width:28px;height:28px;display:inline-block}
.gx-bar .gx-ibtn{color:var(--ink);background:rgba(255,255,255,.08);border-color:var(--line)}
.gx-ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#barstat{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;white-space:nowrap;color:var(--gold)}
#barstat .tm{font-variant-numeric:tabular-nums;background:rgba(255,216,115,.18);border:1px solid var(--gold);border-radius:10px;padding:0 8px}
#barstat .tm.low{background:#8a2a1c;border-color:#ff9c7a;color:#fff}
#barprompt{flex:1;min-width:0;display:none}
#prompt{font-size:15px;line-height:1.25;font-weight:800}
.gx-board{background:#06142b}
#bd{position:absolute;inset:0;display:flex;flex-direction:column;min-width:0;min-height:0;background:#07203f var(--tableimg,none) center/cover no-repeat}
#pxc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;display:block}
#bd>*:not(#pxc){position:relative;z-index:1}
/* ---- other divers ---- */
#opp{flex:0 0 auto;display:flex;gap:4px;padding:5px 5px 2px;align-items:stretch;justify-content:center;flex-wrap:wrap}
.op{flex:1 1 0;min-width:0;max-width:260px;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:3px 3px 4px;border-radius:12px;background:rgba(7,28,58,.62);border:2px solid rgba(160,205,255,.25);color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:44px}
.op.act{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,216,115,.45),0 0 14px rgba(255,216,115,.5)}
.op .top{display:flex;align-items:center;gap:5px;min-width:0}
.op .av{position:relative;flex:0 0 auto;width:var(--av,38px);height:var(--av,38px)}
.op .av svg{width:100%;height:100%}
.op .av .cm{position:absolute;right:-5px;bottom:-4px;width:19px;height:19px}
.op .av .cm svg{width:100%;height:100%}
.op .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.op .nm{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .cnt{display:flex;flex-direction:column;align-items:flex-start;gap:0;font-size:13px;font-weight:800;color:var(--ink2);white-space:nowrap}
.op .cnt b{color:var(--ink)}
.op .pg{flex:0 0 auto;display:flex;align-items:center;gap:3px;min-height:22px}
.op .pg .tok{width:22px;height:22px}
.op .shown{position:relative;width:30px;height:42px;flex:0 0 auto}
.op .shown svg.card{width:100%;height:100%}
.op .shown .mk{position:absolute;right:-6px;top:-5px;width:19px;height:19px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.op .shown .mk svg{width:100%;height:100%}
.op .jobs{display:flex;flex-direction:column;gap:2px;margin-top:2px;min-height:0}
.jc{display:flex;align-items:center;gap:4px;min-height:22px;border-radius:7px;padding:0 5px 0 4px;font-size:13px;font-weight:800;line-height:1.1;background:#fbf3dd;color:#2b2a22;border:2px solid #0b1f3a;white-space:nowrap;overflow:hidden;cursor:pointer;font-family:inherit;text-align:left;width:100%}
.jc .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.op .jc{white-space:normal;min-height:28px;padding:1px 4px;line-height:1.05;cursor:inherit;overflow-wrap:anywhere}
.op .jobs{min-height:calc(var(--jr,1)*31px)}
.jc.opp .sm{width:14px;height:14px}.jc.opp .sm svg{width:9px;height:9px}
#jobsum{display:flex;flex-direction:column;gap:5px}
.jsh{font-size:13px;font-weight:900;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.jsr{appearance:none;display:flex;align-items:center;gap:8px;text-align:left;background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:12px;padding:5px 8px;min-height:44px;color:inherit;font:inherit;cursor:pointer}
.jsr.ok{border-color:var(--ok);background:rgba(53,194,123,.14)}.jsr.bad{border-color:var(--bad);background:rgba(224,88,60,.16)}
.jsr .jav{flex:0 0 32px;width:32px;height:32px}.jsr .jav svg{width:100%;height:100%}
.jsr .jtx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}.jsr .jtx b{font-size:13px}.jsr .jtx span{font-size:14px}
.jsr .jst{flex:0 0 22px;width:22px;height:22px;color:var(--ink)}
#dockpile{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#dockpile #pile,#dockpile #lead{position:static}
.op .jc .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;text-overflow:clip}
.jc .sm{flex:0 0 auto;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;font-weight:900;color:#fff;background:var(--gold2);border:1.5px solid #0b1f3a}
.jc .sm svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4}
.jc.ok{background:#dff3e4}.jc.ok .sm{background:var(--ok)}
.jc.bad{background:#f6d9d4;text-decoration:line-through;text-decoration-thickness:1.5px}.jc.bad .sm{background:var(--bad)}
.jc.me{min-height:28px;font-size:13px}
.jc .df{flex:0 0 auto;display:flex;gap:2px}.jc .df i{width:6px;height:6px;border-radius:50%;background:var(--gold2);border:1px solid #0b1f3a}
.jc.more{background:rgba(7,28,58,.55);color:var(--ink);border-color:var(--line);justify-content:center}
/* the drone's double row (two divers) */
.op.drone{flex:1 1 100%;max-width:none}
.drow{display:flex;gap:4px;justify-content:center;padding:2px 2px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.drow::-webkit-scrollbar{display:none}
.dstack{position:relative;flex:0 0 auto;width:var(--dw);height:calc(var(--dw)*1.4 + 10px)}
.dstack .dbk{position:absolute;left:0;bottom:0;width:100%;height:calc(100% - 9px);border-radius:6px;background:#1a3f77;border:2px solid #0b1f3a;opacity:.9}
.dstack .dbk.none{opacity:0}
.dstack .dc{position:absolute;left:0;top:0;width:100%;height:calc(var(--dw)*1.4);border:0;background:transparent;padding:0;cursor:default;border-radius:6px}
.dstack .dc.can{cursor:pointer}
.dstack .dc.dim{opacity:.5}
.dstack .dc.sel{transform:translateY(-6px)}
.dstack .dc svg.card,.hc svg.card{width:100%;height:100%}
/* ---- the felt: trick slots in the middle ---- */
#felt{flex:1 1 auto;min-height:100px;position:relative}
.tslot{position:absolute;width:var(--cw);height:calc(var(--cw)*1.4);transform:translate(-50%,-50%);border-radius:9px;border:2px dashed rgba(160,205,255,.3);display:flex;align-items:center;justify-content:center}
.tslot.turn{border-color:var(--gold);box-shadow:0 0 14px 2px rgba(255,216,115,.5);animation:ldpulse 1.6s ease-in-out infinite}
.tslot .tc{position:absolute;inset:0;border:0;padding:0;background:transparent;margin:0;cursor:default}
.tslot .tc svg.card{width:100%;height:100%}
.tslot .tn{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:1px;font-size:12px;font-weight:800;white-space:nowrap;color:var(--ink2);text-shadow:0 1px 2px #000;pointer-events:none;display:none}
.tslot.win{box-shadow:0 0 16px 4px rgba(255,216,115,.85)}
#felttxt{position:absolute;left:8px;right:8px;top:6px;text-align:center;pointer-events:none;font-size:13px;font-weight:800;color:var(--ink2);text-shadow:0 1px 2px #000}
#pile{position:absolute;right:6px;bottom:4px;display:flex;gap:6px;align-items:center}
.pbtn{appearance:none;border:2px solid var(--line);background:rgba(7,28,58,.7);color:var(--ink);border-radius:12px;min-height:44px;min-width:44px;padding:2px 10px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
#lead{position:absolute;left:6px;bottom:4px;display:flex;gap:6px;align-items:center;font-size:13px;font-weight:800;color:var(--ink2)}
/* the pool of jobs on the table while they are being handed out */
#pool{position:absolute;inset:4px 6px;display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;align-content:center;align-content:safe center;overflow-y:auto;overscroll-behavior:contain}
.jcard{appearance:none;position:relative;width:min(48%,168px);min-height:64px;border-radius:12px;background:#fbf3dd;color:#27261f;border:3px solid #0b1f3a;padding:6px 8px 6px 12px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.jcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:9px 0 0 9px;background:var(--gold2)}
.jcard b{font-size:14px;line-height:1.2;font-weight:900}
.jcard span{font-size:13px;line-height:1.25;font-weight:600;opacity:.92}
.jcard .dd{display:flex;gap:3px;align-items:center;font-size:13px;font-weight:800}.jcard .dd i{width:9px;height:9px;border-radius:50%;background:var(--gold2);border:1.5px solid #0b1f3a}
.jcard.sel{outline:4px solid var(--gold);outline-offset:1px;transform:translateY(-3px)}
.jcard.off{opacity:.6;cursor:default}
.jcard.bad{background:#f6d9d4}
/* ---- my seat and hand ---- */
#mine{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:2px 6px 0;min-height:44px}
#mine .me{flex:0 0 auto;display:flex;align-items:center;gap:5px;cursor:pointer;background:rgba(7,28,58,.62);border:2px solid rgba(160,205,255,.25);border-radius:12px;padding:2px 6px 2px 3px;min-height:44px;min-width:44px;color:inherit;font:inherit}
#mine .me.act{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,216,115,.45),0 0 14px rgba(255,216,115,.5)}
#mine .me .av{position:relative;width:36px;height:36px}#mine .me .av svg{width:100%;height:100%}
#mine .me .av .cm{position:absolute;right:-5px;bottom:-4px;width:18px;height:18px}#mine .me .av .cm svg{width:100%;height:100%}
#mine .me .who{display:flex;flex-direction:column;line-height:1.1;min-width:0}#mine .nm{font-size:13px;font-weight:900}#mine .cnt{font-size:13px;font-weight:800;color:var(--ink2)}
#mine .mjobs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:center}
#mine .mjobs::-webkit-scrollbar{display:none}
#mine .mjobs .jc{flex:0 0 auto;width:auto;max-width:none;min-height:34px;padding:0 8px 0 5px}
#mine .tok{width:30px;height:30px;flex:0 0 auto}
#handz{flex:0 0 auto;position:relative;background:linear-gradient(180deg,rgba(2,10,24,0),rgba(2,10,24,.55) 30%)}
#hand{position:relative;overflow:visible;min-height:calc(var(--hw)*1.4 + 24px)}
.hc{position:absolute;border:0;background:transparent;padding:0;margin:0;cursor:pointer;font:inherit;width:var(--hw);height:calc(var(--hw)*1.4);border-radius:8px}
.hc.sel{transform:translateY(-16px)}
.hc.dim{cursor:default}
.hc.pinged{margin-top:-9px}.hc.pinged::after{content:'';position:absolute;inset:-2px;border-radius:9px;border:3px solid var(--ok);pointer-events:none}
.hc .gotb{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--gold);color:#2a1d04;border:2px solid #0b1f3a;border-radius:9px;padding:0 7px;font-size:13px;font-weight:900;line-height:17px;pointer-events:none;z-index:3}
.hc.got::after{content:'';position:absolute;inset:-2px;border-radius:9px;border:3px solid var(--gold);pointer-events:none}
.hc .rm{position:absolute;left:50%;margin-left:-13px;top:-16px;width:26px;height:26px;z-index:2;pointer-events:none}
.hc .rm svg{width:100%;height:100%}
.hc.pk::after{content:'';position:absolute;inset:0;border-radius:8px;border:4px solid var(--ok);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);pointer-events:none}
.handnote{color:var(--ink2);font-size:14px;font-weight:700;padding:14px 10px;text-align:center;align-self:center;width:100%}
@keyframes ldpulse{50%{transform:scale(1.06)}}
.tslot.turn{animation:none}
/* ---- dock ---- */
.gx-dock{background:var(--panel);color:var(--ink);border-left:3px solid #1d4f8c}
.gx-dock-head{background:var(--panel2);border-bottom:1px solid var(--line)}
.gx-dock-body{display:flex;flex-direction:column;gap:7px;padding:8px;min-height:0}
.gx-dock .gx-ibtn{color:var(--ink);background:rgba(255,255,255,.08);border-color:var(--line)}
#dockbody>*{flex-shrink:0}
.gx-dock-body{overflow:hidden}
#dockscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain}
#dockscroll>*{flex-shrink:0}
#acts{flex:0 0 auto}
#promptDock{min-height:2.7em}
#prompt{font-size:16px;line-height:1.3;font-weight:800}
#prompt small{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px}
#prompt.mine{color:var(--gold)}
#info{font-size:13.5px;line-height:1.35;color:var(--ink2);background:rgba(255,255,255,.05);border-radius:10px;padding:6px 8px}
#info b{color:var(--ink)}
#info.why{border-left:4px solid var(--gold);background:rgba(255,216,115,.1)}
#acts{display:flex;gap:6px;flex-wrap:wrap}
#acts .btn{flex:1 1 96px}
#felt.roston #pool{top:78px}
#roster{z-index:3;position:absolute;left:8px;right:8px;top:34px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;pointer-events:none}
.rchip{display:flex;align-items:center;gap:5px;min-height:34px;border-radius:12px;padding:2px 8px 2px 3px;background:rgba(255,255,255,.07);border:2px solid var(--line);font-size:13px;font-weight:800}
.rchip svg{width:26px;height:26px}.rchip.w{border-color:var(--gold)}.rchip.r{border-color:var(--ok)}
.btn{appearance:none;border:2px solid #0b1f3a;background:linear-gradient(180deg,#ffe28a,#e0a31c);color:#2a1d04;font-weight:900;font-size:15px;min-height:44px;min-width:44px;padding:4px 14px;border-radius:12px;cursor:pointer;line-height:1.15}
.btn.alt{background:linear-gradient(180deg,#27578f,#173f70);color:var(--ink);border-color:#0b1f3a;box-shadow:inset 0 0 0 1px var(--line)}
.btn.go{background:linear-gradient(180deg,#58d28c,#2a9a5c);color:#04230f}
.btn.bad{background:linear-gradient(180deg,#f08a70,#c8452c);color:#fff}
.btn.on{background:linear-gradient(180deg,#9be6ff,#43a8d8);color:#06243a}
.btn.dis,.btn:disabled{opacity:.42;cursor:default}
.btn:focus-visible,.hc:focus-visible,.op:focus-visible,.jc:focus-visible,.jcard:focus-visible,.dc:focus-visible,.me:focus-visible,.pbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ppop,.pcard{position:absolute;left:0;right:0;background:var(--panel);display:flex;flex-direction:column;z-index:12;box-shadow:0 -4px 14px rgba(0,0,0,.5);border-top:3px solid #1d4f8c}
.ppop{top:0;bottom:0}.pcard{top:0;bottom:0;z-index:14}
.ph-head{display:flex;align-items:center;gap:6px;padding:6px 8px 4px 12px;flex:0 0 auto;background:var(--panel2);border-bottom:1px solid var(--line)}
.ph-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}.ph-t b{font-size:16px}.ph-t span{font-size:13px;opacity:.8}
.px{appearance:none;border:2px solid var(--line);background:rgba(255,255,255,.08);border-radius:10px;width:44px;height:44px;font-size:26px;line-height:1;cursor:pointer;flex:0 0 auto;color:var(--ink)}
.ph-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.av56 svg{width:100%;height:100%}
.ph-body p{margin:0;font-size:14px;line-height:1.4}.sm{font-size:13px;opacity:.9;line-height:1.3}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dotted var(--line);align-items:center}.kv b{text-align:right}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}.cbtns .btn{flex:1 1 120px}
.tipcard{background:rgba(255,216,115,.14);border:2px solid var(--gold);border-radius:12px;padding:7px 9px;display:flex;flex-direction:column;gap:5px}
.tipcard b{font-size:15px;color:var(--gold)}.tipcard p{margin:0;font-size:14px;line-height:1.35;white-space:pre-line}
.tipcard .tr{display:flex;gap:6px;justify-content:flex-end}
.rules h3{margin:12px 0 4px;font-size:1.08rem;color:var(--gold)}.rules p,.rules li{font-size:14.5px;line-height:1.45}.rules ul,.rules ol{padding-left:20px;margin:4px 0}
.logl .ll{font-size:14px;padding:3px 0;border-bottom:1px dotted var(--line)}.lt{display:inline-block;min-width:30px;opacity:.6;font-size:13px}
.mrow{margin:0 0 12px}.mrow .lbl{font-weight:800;margin-bottom:4px}.mbt{display:flex;gap:6px;flex-wrap:wrap}
.tinyc{display:inline-flex;gap:3px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.rcard{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.rcard .rt{flex:1;min-width:0;font-size:14px;line-height:1.35}.rcard .rt b{font-size:15px}
.cgrid{display:flex;flex-wrap:wrap;gap:6px}.cgrid .cdv{width:44px}
.jlist .jr{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--line);font-size:13.5px;line-height:1.3}
.jlist .jr .nn{flex:0 0 28px;opacity:.7;font-weight:800}.jlist .jr .dd{flex:0 0 auto;font-weight:900;color:var(--gold);min-width:56px;text-align:right}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#02122a;color:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw;font-weight:700}
#toast.on{opacity:1}
.pkt{position:fixed;z-index:30;pointer-events:none;width:30px;height:42px}
.pkt svg{position:absolute;inset:0;width:100%;height:100%}
.flyc{position:fixed;z-index:31;pointer-events:none}.flyc svg{width:100%;height:100%}
/* ---- start screens ---- */
#start{position:fixed;inset:0;z-index:60;overflow:auto;background:radial-gradient(ellipse at 50% 15%,#1a5ea3,#0a2a55 55%,#04122a);display:flex;align-items:flex-start;justify-content:center;padding:12px}
.scard{background:rgba(12,38,76,.96);border:2px solid var(--line);border-radius:18px;padding:16px;width:min(580px,100%);display:flex;flex-direction:column;gap:12px;margin:auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.scard h1{margin:0;font-size:2rem;font-weight:900}
.scard .tag{margin:0;font-size:15px}
.sbtn{appearance:none;border:2px solid #0b1f3a;background:linear-gradient(180deg,#27578f,#173f70);color:var(--ink);border-radius:12px;padding:8px 12px;min-height:56px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:15px;box-shadow:inset 0 0 0 1px var(--line)}
.sbtn b{font-size:16px}.sbtn span{font-size:13px;opacity:.88}
.sbtn.big{background:linear-gradient(180deg,#ffe28a,#e0a31c);color:#2a1d04;box-shadow:none}.sbtn.big span{opacity:.9}
.opts{display:flex;flex-direction:column;gap:6px}.seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.seg .lbl{flex:0 0 118px;font-weight:800;font-size:14px}
