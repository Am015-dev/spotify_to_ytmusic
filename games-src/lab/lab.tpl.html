<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LAB: every scenario</title>
<style>
:root{--bg:#17120e;--card:#241c16;--fg:#f3e9da;--mut:#b9a88f;--acc:#f0b04a;--line:#3a2f25;--ok:#6cc78a;--bad:#e0574a;--blue:#9fd6ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:rgba(23,18,14,.96);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:grid;gap:8px}
h1{font-size:1.2rem;margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}h1 small{color:var(--mut);font-weight:400;font-size:.85rem}
h1 a{color:var(--acc);font-size:.85rem;font-weight:600;text-decoration:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip,.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 14px;font:600 13px system-ui;cursor:pointer;min-height:40px;touch-action:manipulation}
.chip[aria-pressed=true]{background:var(--acc);color:#2a1808;border-color:var(--acc)}
main{padding:12px 16px 40px;display:grid;gap:10px;max-width:900px;margin:0 auto}
.g{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.g>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;gap:6px;min-height:44px}
.g>summary::-webkit-details-marker{display:none}
.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.top h2{margin:0;font-size:1.05rem}
.top .pr{font:700 12px ui-monospace,Menlo,monospace;color:var(--mut)}.top .bd{color:var(--bad)}
.track{height:8px;border-radius:5px;background:#120d09;border:1px solid var(--line);overflow:hidden}.track i{display:block;height:100%;background:var(--ok)}
.gb{padding:0 14px 12px;display:grid;gap:6px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.gl{font:800 11px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:8px 0 0}
.lrow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lrow b{display:block;font-size:14px;overflow-wrap:anywhere}.lrow small{display:block;color:var(--blue);font-size:12px;overflow-wrap:anywhere}
.lrow .go{grid-row:1;grid-column:2;display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:64px;border-radius:10px;border:1.5px solid var(--acc);background:rgba(240,176,74,.14);color:var(--acc);font:800 14px system-ui;text-decoration:none}
.lrow .rs{grid-column:1/3;display:flex;gap:6px}
.lrow .rs button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--fg);font:700 13px system-ui;cursor:pointer;touch-action:manipulation}
.lrow[data-res=ok]{border-color:#2f7d4f}.lrow[data-res=bad]{border-color:#b3382c}
.lrow .rs button[aria-pressed=true][data-s=ok]{background:#2f7d4f;border-color:#2f7d4f}
.lrow .rs button[aria-pressed=true][data-s=bad]{background:#b3382c;border-color:#b3382c}
.lrow .rs button[aria-pressed=true][data-s=skip]{background:#6b5a48;border-color:#6b5a48}
.lrow input{grid-column:1/3;width:100%;min-height:44px;padding:0 10px;border-radius:10px;border:1.5px solid #b3382c;background:#150d08;color:var(--fg);font:500 16px system-ui}
.empty{color:var(--mut);padding:20px 0;text-align:center}
#fb{position:fixed;z-index:50;left:12px;right:12px;bottom:12px;max-width:520px;margin:auto;background:var(--card);border:1.5px solid var(--acc);border-radius:12px;padding:10px;display:grid;gap:8px}
#fb textarea{width:100%;min-height:110px;background:#150d08;color:var(--fg);border:1px solid var(--line);border-radius:8px;font:12px system-ui}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2f7d4f;color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;pointer-events:none}
[hidden]{display:none!important}
</style></head><body>
<header><h1>🧪 LAB <small id="sum"></small><a href="index.html">Shelf</a><a href="status.html">Status</a><a href="asset-viewer/games.html">Games tab</a></h1>
<div class="chips" role="group" aria-label="Filter"><button class="chip" data-f="all" aria-pressed="true">All</button><button class="chip" data-f="todo" aria-pressed="false">Not checked</button><button class="chip" data-f="bad" aria-pressed="false">Problems</button><button class="btn" id="tm" aria-pressed="false">🧪 Test mode</button><button class="btn" id="cp">Copy results</button></div></header>
<main id="m"><div class="empty">Loading&hellip;</div></main>
<div id="toast" hidden></div>
<script>
<!--CORE-->
</script>
<script>
(function(){
var L=GXLAB,$=function(s){return document.querySelector(s)},esc=L.esc,F='all',SC={},UP=[];
var NAMES=<!--NAMES-->;
function scenList(slug){return SC[slug]||[]}
function counts(slug){var l=scenList(slug),c={ok:0,bad:0,skip:0,n:l.length};l.forEach(function(d){var s=L.scnRes(slug,d.id).s;if(s)c[s]++});return c}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},1600)}
function draw(){
 var open={};document.querySelectorAll('details.g[open]').forEach(function(d){open[d.dataset.slug]=1});
 var slugs=Object.keys(SC).filter(function(s){return SC[s].length}).sort(function(a,b){return (NAMES[a]||a).localeCompare(NAMES[b]||b)}),h='',T=0,D=0,B=0;
 slugs.forEach(function(slug){
  var c=counts(slug),l=scenList(slug);T+=c.n;D+=c.ok;B+=c.bad;
  var rows=l.filter(function(d){var s=L.scnRes(slug,d.id).s;return F==='all'||(F==='todo'&&!s)||(F==='bad'&&s==='bad')});
  if(F!=='all'&&!rows.length)return;
  h+='<details class="g" data-slug="'+slug+'"'+(open[slug]||F!=='all'?' open':'')+'><summary><div class="top"><h2>'+esc(NAMES[slug]||slug)+'</h2><span class="pr">'+c.ok+'/'+c.n+' ✅'+(c.bad?' · <span class="bd">'+c.bad+' ❌</span>':'')+(c.skip?' · '+c.skip+' ⏭':'')+'</span></div><div class="track"><i style="width:'+(c.n?Math.round(c.ok/c.n*100):0)+'%"></i></div></summary><div class="gb"><div class="tools"><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="'+slug+'/index.html?test=1">Open in test mode</a><button class="btn" data-copy="'+slug+'">Copy results</button></div>';
  var seen={};rows.forEach(function(d){if(!seen[d.group]){seen[d.group]=1;h+='<div class="gl">'+esc(d.group)+'</div>'}
   var v=L.scnRes(slug,d.id);
   h+='<div class="lrow" data-k="'+esc(slug+'/'+d.id)+'" data-res="'+(v.s||'')+'"><div><b>'+esc(d.name)+'</b>'+(d.ask?'<small>'+esc(d.ask)+'</small>':'')+'</div><a class="go" href="'+slug+'/index.html?scn='+encodeURIComponent(d.id)+'&amp;test=1">▶ GO</a><div class="rs">'+[['ok','✅ Works'],['bad','❌ Problem'],['skip','⏭ Skip']].map(function(a){return '<button type="button" data-s="'+a[0]+'" data-slug="'+slug+'" data-id="'+esc(d.id)+'" aria-pressed="'+(v.s===a[0])+'">'+a[1]+'</button>'}).join('')+'</div>'+(v.s==='bad'?'<input type="text" maxlength="200" placeholder="What went wrong? (optional)" aria-label="Note" data-note="'+esc(d.id)+'" data-slug="'+slug+'" value="'+esc(v.n||'')+'">':'')+'</div>'});
  h+='</div></details>'});
 $('#m').innerHTML=h||'<div class="empty">'+(F==='all'?'No scenarios yet.':'Nothing here.')+'</div>';
 $('#sum').textContent=D+'/'+T+' ✅'+(B?' · '+B+' ❌':'');
 $('#tm').setAttribute('aria-pressed',L.testOn()?'true':'false');$('#tm').textContent=L.get('gx_test')==='1'?'🧪 Test mode: ON':'🧪 Test mode: off'}
document.addEventListener('click',function(e){
 var f=e.target.closest('[data-f]');if(f){F=f.dataset.f;document.querySelectorAll('[data-f]').forEach(function(x){x.setAttribute('aria-pressed',x===f)});draw();return}
 if(e.target.closest('#tm')){L.setTest(L.get('gx_test')!=='1');draw();return}
 var cp=e.target.closest('#cp,[data-copy]');if(cp){var sl=cp.dataset.copy?[cp.dataset.copy]:Object.keys(SC).filter(function(s){return SC[s].length});
  L.copy(sl.map(function(s){return L.text(UP,s,SC[s],NAMES[s]||s)}).join('\n\n'),function(ok){if(ok)toast('Copied');else toast('Select and copy the text')});return}
 var b=e.target.closest('.rs button');if(b){var cur=L.scnRes(b.dataset.slug,b.dataset.id).s;L.setScn(UP,b.dataset.slug,b.dataset.id,cur===b.dataset.s?null:b.dataset.s);draw()}});
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.note)L.setScn(UP,t.dataset.slug,t.dataset.note,'bad',t.value)});
Promise.all([fetch('scenarios.json',{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return{}}),fetch('updates.json',{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return[]})]).then(function(a){SC=a[0]||{};UP=a[1]||[];draw()});
})();
</script></body></html>
