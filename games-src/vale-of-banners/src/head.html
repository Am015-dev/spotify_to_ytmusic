<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2a1f">
<title>Vale of Banners</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6 22V3h12l-3 4 3 4H8' fill='%23c0392b' stroke='%23f4ecd8'/%3E%3C/svg%3E">
<style>
/*SHELL_CSS*/
:root{--gx-bg:#1d2a1f;--gx-bar:#16201a;--gx-panel:#f4ecd8;--gx-ink:#2a2014;--gx-accent:#d9a21b;--fs:13px;--fs2:15px;--hex:46px;--gx-sheet-h:40dvh;
  --parch:#f4ecd8;--parch2:#e9dcbc;--ink:#2a2014;--river:#4f86c6;--meadow:#8fbf5a;--keep:#2f5d3a;--saffron:#d9a21b;--crimson:#c0392b}
@media (min-width:1024px){:root{--fs:16px;--fs2:18px}}
html,body{margin:0;height:100%;background:var(--gx-bg);color:#f4ecd8;font-size:var(--fs);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;font-size:var(--fs)}
.gx-app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.gx-bar{background:var(--gx-bar);color:#f4ecd8}
.gx-bar h1{font-size:var(--fs2);margin:0 4px 0 0;white-space:nowrap;display:flex;align-items:center;gap:6px}
.gx-bar h1 svg{width:22px;height:22px}
#barstat{font-size:var(--fs);white-space:nowrap;opacity:.95}
.gx-ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gx-ibtn span{font-size:var(--fs)}
.gx-board{background:radial-gradient(ellipse at 50% 40%,#3b5a3a,#1d2a1f 75%)}
.gx-board[data-art]{background-size:cover}
#bd{position:absolute;inset:0;overflow:hidden}
.gx-dock{background:var(--parch);color:var(--ink)}
.gx-dock-head{color:var(--ink)}
.gx-dock-head .gx-dt{font-size:var(--fs2)}
.gx-dock .gx-ibtn{color:var(--ink)}
/* market */
#mk{position:absolute;display:grid;gap:4px}
.stall{background:rgba(244,236,216,.12);border:1px solid rgba(244,236,216,.25);border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:3px 2px;gap:3px;min-width:0}
.stall.lane{background:rgba(20,14,10,.45);border-style:dashed}
.sth{display:flex;align-items:center;gap:4px;font-size:var(--fs);font-weight:700;white-space:nowrap}
.pip{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:#fbf6ea;color:#2a2014;font-weight:800;font-size:var(--fs);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.sttiles{display:flex;flex-direction:column;gap:3px;align-items:center}
.stgoods{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:20px}
.gchip{min-width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:var(--fs);font-weight:800;color:#2a2014;border:1px solid rgba(0,0,0,.35);background-size:contain;background-repeat:no-repeat;background-position:center}
#mk.ph .lane{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px}
#mk.ph .lane .sttiles{flex-direction:row;gap:6px}
.lane .sttiles{flex-direction:row;flex-wrap:wrap;justify-content:center}
/* hex tiles (DOM, clip-path) */
.hx{width:var(--hex);height:calc(var(--hex) * 1.1547);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;cursor:pointer;border:0;padding:0;color:#2a2014;line-height:1;background-size:cover;background-position:center}
.hx .gl{font-size:calc(var(--hex) * .42);filter:drop-shadow(0 1px 0 rgba(255,255,255,.4))}
.hx .nn{font-size:var(--fs);font-weight:800}
.hx.hasart .gl{opacity:0}
.hx.empty{cursor:default}
.tilebtn{background:none;border:0;padding:0;cursor:pointer;position:relative;display:block}
.tilebtn .hx{pointer-events:none}
.glow{animation:glow 1.1s ease-in-out infinite;filter:drop-shadow(0 0 6px #ffe680) drop-shadow(0 0 2px #fff)}
@keyframes glow{50%{filter:drop-shadow(0 0 12px #ffd23a) drop-shadow(0 0 3px #fff)}}
.dim{opacity:.45}
.cost{position:absolute;right:-6px;bottom:-4px;background:#7a2a1c;color:#fff;border-radius:9px;font-size:var(--fs);font-weight:800;padding:0 4px;line-height:17px;pointer-events:none;z-index:2;border:1px solid #fff}
#mk.small .cost{display:none}
#mk.two .stall:not(.lane) .sttiles{display:grid;grid-template-columns:1fr 1fr;gap:2px}
@media (min-width:1000px){#mk:not(.ph) .lane{grid-column:span 2}}
/* estate */
#es{position:absolute}
.cell{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:default}
.cell .hx{cursor:inherit}
.cell.glow{cursor:pointer;z-index:3}
.cell .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:max(var(--fs),calc(var(--hex)*.3));color:rgba(30,20,10,.75)}
.cell.built .num{display:none}
.cell .badge{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:var(--fs);font-weight:800;color:#2a2014;background:rgba(255,255,255,.75);border-radius:6px;padding:0 3px;line-height:16px}
.regline{position:absolute;pointer-events:none}
/* opponents strip */
#opp{position:absolute;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.och{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:2px solid transparent;border-radius:10px;padding:2px 8px;min-height:40px;color:#f4ecd8;cursor:pointer;font-size:var(--fs)}
.och.now{border-color:#ffd23a}
.och b{font-size:var(--fs)}
.och .ban{width:12px;height:22px;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
/* dock */
#dockbody{padding:4px 10px 10px;display:flex;flex-direction:column;gap:6px}
@media (max-width:999px){#store{--hex:40px}.gx-dock-head{padding:2px 8px 0}.res{font-size:var(--fs);padding:2px 6px}.die{width:44px;height:44px}}
#prompt{font-weight:700;font-size:var(--fs2);line-height:1.25}
#chainb{display:none;background:linear-gradient(90deg,#d9a21b,#f6d36b);color:#2a2014;border-radius:8px;padding:4px 8px;font-weight:800}
#chainb.on{display:block;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:var(--fs);font-weight:700;opacity:.8;min-width:56px}
.die{width:48px;height:48px;border-radius:10px;background:#fbf6ea;border:2px solid #2a2014;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#2a2014;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.die.used{opacity:.3;cursor:default}
.die.sel{outline:3px solid #c0392b;outline-offset:2px}
.die.white{background:#fff;border-style:dashed;width:32px;height:32px;font-size:var(--fs2)}
.res{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:var(--fs2);background:rgba(0,0,0,.06);border-radius:8px;padding:2px 8px;min-height:32px}
.res i{font-style:normal}
#store{display:flex;gap:6px}
#store .slot{width:calc(var(--hex) + 6px);height:calc(var(--hex) * 1.1547 + 6px);border:2px dashed rgba(42,32,20,.3);border-radius:10px;display:flex;align-items:center;justify-content:center}
#store .slot.sel{border:3px solid #c0392b}
#goods{display:flex;gap:6px;flex-wrap:wrap}
.gbtn{display:inline-flex;align-items:center;gap:4px;border:2px solid rgba(42,32,20,.35);border-radius:10px;background:#fff8e6;min-height:44px;padding:2px 8px;cursor:pointer;color:#2a2014;font-weight:700}
.btn{appearance:none;border:0;border-radius:12px;min-height:44px;padding:6px 14px;font-weight:800;cursor:pointer;background:#2f5d3a;color:#fff;font-size:var(--fs2)}
.btn.alt{background:#e9dcbc;color:#2a2014;border:1px solid rgba(42,32,20,.3)}
.btn.warn{background:#c0392b}
.btn:disabled{opacity:.4;cursor:default}
#acts{display:flex;gap:8px;flex-wrap:wrap}
.tip{font-size:var(--fs);opacity:.85;line-height:1.3}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,14,10,.72);padding:12px;box-sizing:border-box}
.ov[hidden]{display:none}
.card{background:var(--parch);color:var(--ink);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:16px 18px;box-sizing:border-box}
.card h2{margin:0 0 6px;font-size:calc(var(--fs2) * 1.2)}
.card p{margin:6px 0;line-height:1.35}
#start{background:#1d2a1f center/cover no-repeat;flex-direction:column}
#start .tcard{background:rgba(244,236,216,.94);color:var(--ink);border-radius:18px;padding:18px 20px;width:min(420px,100%);box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:10px;max-height:calc(100dvh - 24px);overflow:auto}
#start h1{font-size:calc(var(--fs2) * 1.9);margin:4px 0 0;color:#2f5d3a}
#start .sub{margin:0 0 6px;font-size:var(--fs2)}
#start .big{font-size:calc(var(--fs2) * 1.15);min-height:56px;background:#c0392b}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{min-height:44px;min-width:44px;border-radius:10px;border:2px solid rgba(42,32,20,.3);background:#fff8e6;color:#2a2014;font-weight:700;padding:4px 10px;cursor:pointer}
.seg button.on{background:#2f5d3a;color:#fff;border-color:#2f5d3a}
.srow{display:flex;flex-direction:column;gap:4px;text-align:left}
.srow>span{font-weight:700}
#tv .tbig{display:flex;gap:14px;align-items:center}
#tv .tbig .hx{--hex:110px}
#tv .acts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#rs table{border-collapse:collapse;width:100%;font-size:var(--fs)}
#rs td,#rs th{padding:4px 6px;border-bottom:1px solid rgba(42,32,20,.2);text-align:right}
#rs td:first-child,#rs th:first-child{text-align:left}
#toast{position:fixed;left:50%;top:calc(var(--gx-bar-h) + 8px);transform:translateX(-50%);z-index:45;background:#2a2014;color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
.fly{position:fixed;z-index:44;pointer-events:none;transition:transform .42s cubic-bezier(.3,.7,.3,1);will-change:transform}
.popn{position:fixed;z-index:46;pointer-events:none;font-weight:900;font-size:var(--fs2);color:#fff;text-shadow:0 2px 3px #000,0 0 6px #000;animation:rise 1.2s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{transform:translate(-50%,-44px);opacity:0}}
.ribbon{position:fixed;z-index:43;pointer-events:none;height:6px;border-radius:3px;background:linear-gradient(90deg,#f6d36b,#d9a21b);transform-origin:0 50%;animation:rib .7s ease-out forwards}
@keyframes rib{0%{opacity:0;transform:scaleX(0) rotate(var(--a))}30%{opacity:1}100%{opacity:0;transform:scaleX(1) rotate(var(--a))}}
.drawer-body{color:var(--ink)}
.rules h3{margin:12px 0 4px}
.rules p,.rules li{line-height:1.4}
.minies{position:relative;margin:8px auto}
#start .tcard .btn{font-size:var(--fs)}
#start .tcard .btn.big{font-size:calc(var(--fs2) * 1.15)}
.hx .gl{font-size:max(13px,calc(var(--hex) * .42))}
.cell .num{color:#1d140a;text-shadow:0 0 3px rgba(255,255,255,.9),0 0 1px #fff}
.cell .hx{opacity:1}
.sth{color:#fff;text-shadow:0 1px 2px #000}
html body .gx-bar .gx-ibtn span{font-size:var(--fs)!important}
/* Story map (shared kit) text floor on wide screens */
@media (min-width:1024px){html body :is(.gxc-act b,.gxc-act small,.gxc-lab,.gxc-small,.gxc-tag,.gxc-goal,.gxc-st){font-size:max(16px,1em)!important}}
html body,html body .gxc,html body .gxc-screen,html body .gxc-map{--gxc-a1:#2f5d3a!important;--gxc-a2:#7a4410!important;--gxc-a3:#2a3a6e!important}
html body .gxc-disc,html body .gxc-pt-e,html body .gxc-lock{color:#fff!important;text-shadow:0 1px 3px #000,0 0 2px #000}
.gl::before{content:attr(data-g)}
.cell .num{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:max(20px,calc(var(--hex)*.46));height:max(20px,calc(var(--hex)*.46));border-radius:50%;background:#fbf6ea;color:#1d140a!important;text-shadow:none!important;font-size:max(var(--fs),calc(var(--hex)*.28));box-shadow:0 1px 2px rgba(0,0,0,.4)}
html body .gxc-lock{font-size:0!important}
html body .gxc-lock::before{content:'\1F512';font-size:16px}
html.gx-noanim .fly,html.gx-reduce .fly{transition:none}
</style>
</head>
