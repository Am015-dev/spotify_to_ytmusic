<body>
<div class="gx-app" id="app">
<main class="board gx-board" id="board" data-board aria-label="The map">
  <svg id="map" viewBox="0 0 980 600" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Map"></svg>
  <div id="banner" aria-live="polite"></div>
</main>
<div class="strips" id="race" aria-live="polite"></div>
<div id="rivalcard" aria-live="polite"></div>
<nav class="hud-r" aria-label="Game buttons">
  <button class="ib" id="mktb" type="button" aria-label="Market"><svg viewBox="0 0 512 512" class="ic"><use href="#i-amphora"/></svg><b id="mktn"></b></button>
  <button class="ib" id="plb" type="button" aria-label="Points"><svg viewBox="0 0 512 512" class="ic"><use href="#i-laurel"/></svg></button>
  <button class="ib" id="helpb" type="button" aria-label="Rules">?</button>
  <button class="ib" id="menub" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" class="ic ln"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</nav>
<div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">&minus;</button></div>
<div class="ptop"><p id="prompt" aria-live="polite"></p><button type="button" class="ib sm" id="promptq" aria-label="What does this card do?" hidden>?</button></div>
<section class="dock" id="dock" aria-label="Your turn">
  <div class="prow"><button type="button" class="round" id="undob" aria-label="Undo" hidden><svg viewBox="0 0 24 24" class="ic ln"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 8"/></svg></button><div id="acts"></div></div>
  <div id="hand" role="group" aria-label="Your cards"></div>
  <div id="store" aria-label="Your storehouse"></div>
</section>
</div>
<div id="sheet" class="sheet" role="dialog" aria-label="Choice" hidden></div>
<div id="start" class="ov" hidden></div>
<div id="result" class="ov" hidden></div>
<div id="drawer" class="ov dr" role="dialog" aria-label="Info" hidden></div>
<div id="fx" aria-hidden="true"></div>
<div id="finger" aria-hidden="true"></div>
<div id="gbub" class="bub" aria-hidden="true"></div>
<div id="note" class="bub res" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="icondefs"></defs></svg>
<script src="gx-scenario.js"></script>
<script src="scn.js"></script>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="art.js"></script>
<script src="gx-scenario-tutor.js"></script>
<script src="ui.js"></script>
<script src="lessons-a.js"></script>
<script src="lessons-b.js"></script>
<script src="lessons-c.js"></script>
<script src="lessons-d.js"></script>
<script src="lessons.js"></script>
</body>
</html>
