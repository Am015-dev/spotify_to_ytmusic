<body>
<div class="gx-app">
<header class="gx-bar">
  <h1><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#2c5f6c" stroke="#e8f0f6" stroke-width="1.4"/><path d="M12 4l2.2 6.5 6.3 2.2-6.3 1.6L12 20l-2.2-5.7-6.3-1.6 6.3-2.2z" fill="#fff4dc"/></svg></span><span class="tt">Final Approach</span></h1>
  <span id="barstat"></span>
  <button id="netst" type="button" data-a="netopen" hidden></button>
  <div id="barprompt"></div>
  <span class="gx-sp"></span>
  <button class="gx-ibtn" data-gx="crewd" aria-expanded="false" aria-label="Flight briefing" title="Flight briefing"><svg viewBox="0 0 24 24"><path d="M3 17l8-3 2-9 2 9 6 3M12 14v7"/></svg><span>Flight</span></button>
  <button class="gx-ibtn" data-gx="logd" aria-expanded="false" aria-label="Log" title="Log"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h6M10 12h6M10 16h4"/></svg><span>Log</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z M12 6v13"/></svg><span>Rules</span></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="The control panel"><div id="bd"><div id="pz" role="group" aria-label="Cockpit control panel"></div><div id="recap" hidden data-a="recapx"></div><div id="endv"></div></div></main>
  <aside class="gx-dock" id="dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-dt">Cockpit</span><button class="gx-ibtn" data-gx="dock" aria-label="Hide panel">&#8677;</button></div>
    <div class="gx-dock-body" id="dockbody">
      <div id="goal"></div>
      <div id="promptDock"><div id="prompt" aria-live="polite"></div></div>
      <div class="tipb" id="pc" hidden role="region" aria-label="Tip"></div>
      <div id="feed" hidden aria-live="polite"></div>
      <div id="selinfo"></div>
      <div id="rt"></div>
      <div id="says"></div>
      <div id="roster"></div>
      <div id="cheat"></div>
    </div>
    <div id="acts"></div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock">&#9776; Panel</button>
</div>
</div>
<div id="start" hidden></div>
<div id="pass" hidden></div>
<div id="rs" hidden></div>
<div id="netbox" hidden></div>
<div id="toast" role="status"></div>
<script type="text/plain" id="pixi-src" src="pixi.min.js"></script>
<script src="shell.js"></script>
<script src="perfhud.js"></script>
<script src="trystero.min.js"></script>
<script src="netroom.js"></script>
<script src="art-data.js"></script>
<script src="data.js"></script>
<script src="layout.js"></script>
<script src="engine.js"></script>
<script src="aiw.js"></script>
<script src="ai.js"></script>
<script src="netstrip.js"></script>
<script src="gameaudio.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
