<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Final Approach</title>
<style>
/*SHELL_CSS*/
*{box-sizing:border-box}
:root{--ink:#14202c;--paper:#eef2f5;--paper2:#dbe3ea;--steel:#8f9daa;--blue:#2f6fd0;--orange:#e8821f;--gold:#f2b92c;--red:#d8402c;--green:#2f9a4a;--gx-bg:#0f1c26;--gx-bar:#0c1822;--gx-panel:#eef2f5;--gx-ink:#14202c;--gx-accent:#f2b92c;--gx-dock-w:clamp(330px,30vw,410px);--gx-bar-h:48px;
  --font:'Nunito','Trebuchet MS','Segoe UI',system-ui,'DejaVu Sans',sans-serif}
html,body{font-family:var(--font);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:#0f1c26}
button{font-family:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px}
.gx-bar{background:var(--gx-bar);color:#e8f0f6;gap:8px}
.gx-bar h1{margin:0;font-size:1.15rem;display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:900}
.gx-bar h1 .ic{width:28px;height:28px;display:inline-block}
.gx-bar .gx-ibtn{color:#e8f0f6;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.gx-ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#barstat{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;opacity:.96;white-space:nowrap}
#barprompt{flex:1;min-width:0;display:none}
#prompt{font-size:15px;line-height:1.25;font-weight:800}
.gx-board{background:#17303a}
#bd{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#2a5160,#10222c 80%)}
#pxc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;display:block}
#pz{position:absolute;inset:0;z-index:1}
/* ---- the panel: DOM layer (hit targets, and the whole picture when the painted table is off) ---- */
.w{position:absolute;border-radius:12px;border:2px solid #7e8c99;background:#1d3340;overflow:hidden;color:#e8f0f6}
.w .tl{position:absolute;left:6px;top:2px;font-size:13px;font-weight:800;opacity:.85;pointer-events:none;letter-spacing:.04em;text-transform:uppercase;z-index:3;text-shadow:0 1px 2px #000}
.sp{position:absolute;top:0;bottom:0;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 3px;border-left:1px solid rgba(255,255,255,.18)}
.sp .nm{font-size:13px;font-weight:800;line-height:1;opacity:.9;text-shadow:0 1px 2px #000}
.sp .pls{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%;min-height:20px;align-items:center}
.sp .pl{width:17px;height:17px;border-radius:50%;background:#3a4d66;border:1.5px solid #fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:#fff}
.sp .tf{font-size:13px;font-weight:900;font-style:normal;background:#222;border:1.5px solid #f4e9c8;color:#f4e9c8;border-radius:4px;padding:0 2px;line-height:15px;display:inline-flex;align-items:center;gap:1px;white-space:nowrap}
.sp .tf .tfd{font-style:normal;display:inline-block;min-width:13px;text-align:center}.sp .tf b{font-weight:900}
.sp .bdg{position:absolute;left:0;right:0;top:2px;display:flex;gap:2px;justify-content:center;pointer-events:none}
.sp .bot{display:flex;align-items:center;justify-content:center;gap:3px;line-height:1}
.sp .tb{font-size:13px;font-weight:900;font-style:normal;background:#fff;color:#14202c;border-radius:4px;padding:0 2px;line-height:14px;white-space:nowrap;letter-spacing:-.03em}
.sp.you{background:rgba(242,185,44,.28);box-shadow:inset 0 0 0 2px var(--gold)}
.ar{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:800;line-height:1.15;text-shadow:0 1px 2px #000;text-align:center}
.ar small{font-size:13px;opacity:.9;font-weight:700}
.ar u,.ar .fx{text-decoration:none;font-style:normal}
html.ph .ar u,html.ph .ar .fx,html.ph .ar .fp{display:none}
.ar .fpd{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;margin-right:3px;vertical-align:-1px}.ar .fpd.p{background:#2f6fd0}.ar .fpd.c{background:#e8821f}
.w.altc{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px}
.rtleft{font-weight:900;white-space:nowrap}.rtleft.low{color:#ff7a5c;animation:rtlow .8s ease-in-out infinite}@keyframes rtlow{50%{opacity:.45}}
.altnow .rtleft{background:#0c1822;border:1.5px solid #ffd27a;border-radius:9px;padding:0 6px;font-size:14px;color:#ffe08a}.altnow .rtleft.low{color:#ff7a5c;border-color:#ff7a5c}
.hudc .rtleft{font-size:16px;color:#ffe08a}.hudc .rtleft.low{color:#ff7a5c}
.altnow{display:flex;align-items:baseline;gap:7px;font-size:13px;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px #000}.altnow b{font-size:14px}
.fp.p{color:#9cc0ff;font-weight:900}.fp.c{color:#ffbd78;font-weight:900}
.altdots{display:flex;gap:3px;align-items:center}
.ad{width:19px;height:19px;border-radius:50%;border:2px solid rgba(255,255,255,.8);position:relative;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:900;line-height:1;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}.ad.p{background:#2f6fd0}.ad.c{background:#e8821f}.ad.past{opacity:.35}.ad.cur{box-shadow:0 0 0 3px var(--gold)}
.ad.rr::after{content:'';position:absolute;right:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:#a77bf0;border:1.5px solid #fff}
.w.altw{cursor:pointer}
html.ph .ar{font-size:13px;flex-direction:row;gap:3px;flex-wrap:nowrap}
html.ph .ar .rr{position:absolute;top:1px;right:1px;width:9px;height:9px;margin:0}
html.ph .w .tl{display:none}
.ar.cur{background:rgba(242,185,44,.3);box-shadow:inset 0 0 0 2px var(--gold)}
.ar.past{opacity:.5}
.ar .rr{display:inline-block;width:14px;height:14px;border-radius:50%;background:#7a4fc4;border:1.5px solid #fff;margin-left:3px;vertical-align:middle}
.ar .fp{font-weight:900}.ar .fp.p{color:#8fb7ff}.ar .fp.c{color:#ffb56a}
.slot{position:absolute;border:2px solid #5d6f7f;border-radius:14px;background:#0e1c25;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:visible;font:inherit;color:#e8f0f6}
.slot::before{content:'';position:absolute;inset:-6px}
.slot.p{border-color:var(--blue)}.slot.c{border-color:var(--orange)}.slot.n{border-color:#a9b6c2}
.slot .cap{position:absolute;left:-8px;right:-8px;top:1px;text-align:center;font-size:13px;font-weight:800;line-height:1;letter-spacing:-.03em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000,0 0 4px #000;opacity:.95}
.slot .cap.mid{top:50%;transform:translateY(-50%)}
.slot .sl{position:absolute;left:0;right:0;bottom:-1px;text-align:center;font-size:13px;font-weight:800;line-height:1;opacity:.9;pointer-events:none;text-shadow:0 1px 2px #000;white-space:nowrap}
.slot.legal{box-shadow:0 0 0 3px var(--gold),0 0 14px 4px rgba(242,185,44,.7);animation:pulse 1.2s ease-in-out infinite;z-index:4}
.slot.full{cursor:default}
.slot.dim{opacity:.4;animation:none;box-shadow:none}
.slot.deadly{box-shadow:0 0 0 3px #e0402c,0 0 10px 3px rgba(224,64,44,.75)!important;animation:none!important;z-index:5}.slot.deadly::after{content:'✕';position:absolute;right:1px;top:-2px;color:#ff6b55;font-weight:900;font-size:14px;text-shadow:0 1px 2px #000}
.slot.done.legal{box-shadow:inset 0 0 0 3px #43d65a,0 0 0 2px #43d65a;animation:none;opacity:.75}
#goal:empty,#goal[hidden]{display:none}
.goalb{display:flex;flex-direction:column;gap:2px;width:100%;min-height:44px;text-align:left;background:#14202c;color:#f2f6f9;border:2px solid #3b5268;border-radius:10px;padding:3px 7px;font:inherit;font-size:13px;line-height:1.25;cursor:pointer}
.goalb.on{border-color:var(--gold)}.goalb .gr b{color:#ffe08a}
.goalb .gc{display:flex;flex-wrap:wrap;gap:3px 4px}.goalb .c{padding:0 6px;border-radius:8px;background:rgba(255,255,255,.14);white-space:nowrap;font-weight:700}
.goalb .c.ok{background:#2c7a43}.goalb .c.bad{background:#b33a28}.goalb .dg{color:#ffd27a;font-weight:800}
.goalb .grs{display:none}html.ph.ph-l .goalb .gr{display:none}html.ph.ph-l .goalb .grs{display:block}html.ph.ph-l.fabrief #selinfo{display:none}html.ph.ph-l .goalb .dg{font-size:13px}
html.ph #says .say{flex:1 1 calc(50% - 5px);min-height:44px;padding:2px 6px;font-size:14px;line-height:1.15}
html.ph.ph-l #selinfo .cofl,html.ph.ph-l #selinfo .fits{display:none}
@media (max-height:700px){html.ph.ph-p #selinfo .cofl,html.ph.ph-p #selinfo .fits{display:none}}
.say.rec{border-color:var(--gold)!important;font-weight:800}.say.more{opacity:.8}
#selinfo .warn.dead{border-color:#e0402c}
.dial .spn{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:#ffd27a}
.slot.need{box-shadow:0 0 0 3px #ff5a3c,0 0 14px 4px rgba(255,90,60,.65);animation:needp 1s ease-in-out infinite;z-index:5}
.slot.just{animation:justp 1.8s ease-out 1}
#pz .hl{outline:3px dashed #8fe6ff;outline-offset:2px;animation:hlp 1.1s ease-in-out infinite;z-index:6}
@keyframes needp{50%{box-shadow:0 0 0 5px #ff5a3c,0 0 22px 8px rgba(255,90,60,.45)}}
@keyframes justp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.95)}30%{box-shadow:0 0 0 8px rgba(255,255,255,.7)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
@keyframes hlp{50%{outline-color:rgba(143,230,255,.6);outline-offset:4px}}
.dv{width:78%;height:78%;border-radius:22%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;line-height:1;color:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4);position:relative}
.dv.b{background:linear-gradient(180deg,#4a86e8,#2f6fd0)}.dv.o{background:linear-gradient(180deg,#f29a3e,#e8821f)}.dv.k{background:#33333f}.dv.t{background:#f4efe0;color:#14202c;border-radius:50%}.dv.q{font-size:20px}
.dv.cof::after{content:'';position:absolute;right:-5px;top:-5px;width:14px;height:14px;border-radius:50%;background:#5a3418;border:2px solid #fff}
.sw{position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:50%;background:#d83b3b;border:1.5px solid #fff;pointer-events:none}
.sw.on{background:#43d65a}
.slot.done{box-shadow:inset 0 0 0 3px #43d65a,0 0 0 2px #43d65a}.slot.done .cap{color:#b8ffc4}.slot .dn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:20px;font-weight:900;line-height:1;color:#5be673;text-shadow:0 1px 2px #000;pointer-events:none}
/* seat letter (P = Pilot, C = Co-pilot) inside the bottom-left corner of each empty slot: the seat is never told by colour alone */
.slot .seat{position:absolute;left:2px;bottom:2px;width:15px;height:15px;border-radius:4px;border:1px solid rgba(255,255,255,.9);color:#fff;font-size:13px;font-style:normal;font-weight:900;line-height:13px;text-align:center;pointer-events:none;z-index:2}.slot .seat.p{background:#2f6fd0}.slot .seat.c{background:#c8650f}
.slot .seat~.sl{padding-left:14px}
.badge{position:absolute;border-radius:10px;background:rgba(10,22,30,.78);border:1.5px solid rgba(255,255,255,.35);color:#f2f6f9;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;line-height:1.1;text-align:center}
.badge b{font-size:15px}
.dial{position:absolute;border-radius:50%;border:3px solid #9ba7b4;background:linear-gradient(180deg,#78b6e8 50%,#7a5a38 50%);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-shadow:0 1px 3px #000;text-align:center;font-size:13px;line-height:1.1}
.dial i{position:absolute;left:50%;top:50%;width:70%;height:4px;margin:-2px 0 0 -35px;background:#fff;border-radius:2px;transform-origin:50% 50%}
.gau{position:absolute;border-radius:90px 90px 14px 14px;border:3px solid #9ba7b4;background:#14232d;color:#e8f0f6;font-weight:800;font-size:13px;text-align:center;line-height:1.15}
.gau .mk{position:absolute;bottom:2px;font-size:13px;font-weight:900;line-height:17px;padding:0 4px;border-radius:7px;color:#fff;border:1.5px solid rgba(255,255,255,.85);text-shadow:0 1px 1px rgba(0,0,0,.5)}.gau .mk.b{left:0;background:#2f6fd0}.gau .mk.o{right:0;background:#d8741a}
.badge.brk{flex-direction:column;gap:0;line-height:1.05;background:rgba(80,14,10,.8);border-color:#ff9d8a}.badge.brk b{font-size:16px}
.bar{position:absolute;border-radius:10px;border:2px solid #9ba7b4;background:#15222c;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#4fd1c1,#1f8f84)}
.bar{overflow:visible}.bar i{border-radius:8px}
.bar span{position:absolute;left:0;right:0;bottom:100%;margin-bottom:1px;display:flex;align-items:center;justify-content:flex-start;padding-left:4px;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;line-height:1}
.dial.wnd{align-items:flex-end}.dial.wnd span{position:relative;bottom:-12px;background:#0c1822;border:1.5px solid #9fd0ff;border-radius:8px;padding:0 5px;white-space:nowrap;font-size:13px}
.tray{position:absolute;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px}
.tray.p{background:rgba(47,111,208,.28);box-shadow:inset 0 0 0 2px rgba(47,111,208,.7)}.tray.c{background:rgba(232,130,31,.26);box-shadow:inset 0 0 0 2px rgba(232,130,31,.75)}
.tray.c .who{left:auto;right:8px}
.tray .who{position:absolute;left:8px;top:-19px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;opacity:.95;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap}
.die{appearance:none;border:0;background:transparent;padding:0;margin:0;cursor:pointer;flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center}
.die::before{content:'';position:absolute;inset:-4px}
.die .dv{width:100%;height:100%}
.die.sel .dv{box-shadow:0 0 0 3px var(--gold),0 0 14px 4px rgba(242,185,44,.8);transform:translateY(-8px)}
.die.rrm .dv{box-shadow:0 0 0 3px #7a4fc4,0 0 12px 3px rgba(122,79,196,.8)}
.die.used{opacity:.0;pointer-events:none}
.die.cover{cursor:default}
.hudc{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;pointer-events:none;font-weight:800;text-shadow:0 1px 3px #000;color:#f2f6f9;line-height:1.15}
.hudc b{font-size:15px}.hudc span{font-size:13px;opacity:.92}
.chipr{position:absolute;display:flex;gap:4px;align-items:center;justify-content:center;pointer-events:none}
.tk{width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:inline-block}
.tk.cf{background:#5a3418}.tk.rr{background:#7a4fc4}.tk.off{opacity:.25}
.tokrow{position:absolute;display:flex;gap:4px;align-items:center;justify-content:center}
.tokrow .ch{width:34px;height:34px;border-radius:50%;background:#f4efe0;color:#14202c;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--gold),0 0 20px 7px rgba(242,185,44,.55)}}
html.fapx .w,html.fapx .dial,html.fapx .gau,html.fapx .bar{background:transparent!important;border-color:transparent!important}
html.fapx .dial i,html.fapx .bar i{display:none}

html.fapx #bd #pz{transition:opacity .5s}html.fapx #bd.ending #pz{opacity:0;pointer-events:none}
html.fapx .badge:not(.brk){background:transparent!important;border-color:transparent!important;text-shadow:0 1px 3px #000}
#pxc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;display:block}
html.fapx .tray{background:transparent;box-shadow:none}
html.fapx .sp .pl,html.fapx .sp .tf .tfd{opacity:0}

/* ---- log ---- */
.lgr{margin:0 0 6px}.lgr summary{font-weight:900;font-size:15px;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:4px;border-bottom:1px solid rgba(0,0,0,.15)}.lgr summary .lgn{font-weight:600;opacity:.6}.lgr .ll{padding:3px 0 3px 10px}

#prompt.mine{color:#b5361c}

.sp .pls{flex-wrap:nowrap!important}.sp .pl+.pl{margin-left:-7px}

#selinfo .eff{font-size:13px;opacity:.85}
.cof .cv{min-width:58px;text-align:center;font-weight:900;font-size:16px}
