<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Thornbound Throne</title>
<style>
/*SHELL_CSS*/
:root{--ink:#f6e6b4;--gold:#e8c867;--bg:#120b0e;--panel:#241419;--panel2:#33202a;--line:rgba(232,200,103,.35);--fd:'TB Display','Cinzel',Georgia,serif;--fb:'TB Body','EB Garamond',Georgia,serif;--gx-bg:#0c0709;--gx-bar:#1a0f13;--gx-panel:#f3e6bf;--gx-ink:#231a10;--gx-accent:#e8c867;--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}

.gx-board{container-type:size}

.rv-t small{font-size:.8rem;opacity:.9;white-space:nowrap}.rv-t i{font-style:normal;font-weight:700;color:#fff3c4}

.gx-dock{position:relative}

.ppop:not([hidden]){display:flex;flex-direction:column;background:#f3e6bf;color:#231a10;border-top:3px solid #c99a35}
.ppop.in,.pcard.in{animation:ppin .16s ease-out}@keyframes ppin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* start screen + drawers */

.st-box{width:min(640px,100%);box-sizing:border-box;padding:16px 14px calc(20px + var(--sab));display:flex;flex-direction:column;gap:10px}

/* ===== phone layout (html.ph) ===== */
html.ph{--bar:44px}
html.ph .gx-app{padding:var(--sat) var(--sar) 0 var(--sal);box-sizing:border-box}
html.ph .gx-main{display:contents}
