<body>
<div class="gx-app">
<header class="gx-bar">
  <h1><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z" fill="#e8c05a" stroke="#5a3a12" stroke-width="1.4"/><path d="M7 15V10l2-1.5V7h1.5v1h3V7H15v1.5l2 1.5v5z" fill="#2a1f14"/></svg></span><span class="tt">Vellum Shire</span></h1>
  <div id="score" class="score" aria-live="polite"></div>
  <span class="gx-sp"></span>
  <button class="gx-ibtn gxh-bulb" id="bulbbtn" data-help type="button" aria-label="Hint"></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="Stalls, your estate and your tray"><div id="bd" data-board>
    <div id="hud"></div>
    <div id="stalls" aria-label="Stalls 1 to 6 and the ink stall"></div>
    <div id="estwrap"><div id="esttabs"></div><div id="estate" aria-label="Estate"></div></div>
    <div id="tray" aria-label="Your dice, workers, silver, storage and goods"></div>
  </div></main>
  <aside class="gx-dock" id="dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-grab" data-gx="sheet"></span><span class="gx-dt" id="prompt" aria-live="polite">Your turn</span><button class="gx-ibtn" data-gx="dock" aria-label="Hide panel">&#8677;</button></div>
    <div class="gx-dock-body" id="dockbody">
      <div id="detail"></div>
      <div id="acts"></div>
    </div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock">&#9776; Panel</button>
</div>
</div>
<div id="fx" aria-hidden="true"></div>
<div id="banner" aria-live="polite"></div>
<div id="start" class="ov" hidden></div>
<div id="rs" class="ov" hidden></div>
<script src="gx-scenario.js"></script>
<script src="scn.js"></script>
<script src="shell.js"></script>
<script src="gx-kit.js"></script>
<script src="gx-viewport.js"></script>
<script src="gx-help.js"></script>
<script src="gx-tutor.js"></script>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="ui1.js"></script>
<script src="ui2.js"></script>
<script src="ui3.js"></script>
</body>
</html>
