<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redline Rally</title>
<style>
*{box-sizing:border-box}
:root{--bg:#10141c;--panel:#1a2230;--panel2:#252f42;--ink:#f1f4fa;--mute:#9aa7bd;--red:#ff4d3a;--gold:#ffc23a;--green:#3ec47c;--blue:#4a9bff;--asph:#2b3039;--cw:clamp(44px,12.2vw,70px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.25 system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.hasart{background-color:transparent}
/* ---- title ---- */
#title{align-items:center;justify-content:flex-start;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 20%,#3a2230 0,#171c28 55%,#0c0f16 100%) center/cover no-repeat;overflow:auto}
#title::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,77,58,.08) 46px 50px);pointer-events:none}
.tbox{margin:auto;position:relative;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch;background:rgba(14,18,28,.78);border:1px solid #33405a;border-radius:18px;padding:18px}
.logo{margin:0;text-align:center;font-size:clamp(30px,9vw,46px);line-height:1;color:#fff;text-shadow:0 3px 0 var(--red)}
.logo small{display:block;font-size:14px;letter-spacing:.2em;color:var(--gold);text-shadow:none;margin-top:6px}
.row{display:flex;gap:8px}.row>*{flex:1}
.lbl{font-size:14px;color:var(--mute);margin:2px 0 -4px}
.opt{min-height:44px;border-radius:12px;border:2px solid #34415a;background:var(--panel);padding:6px 8px;font-weight:700}
.opt.on{border-color:var(--gold);background:#3a3322;color:#fff}
.opt small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.big{min-height:54px;border-radius:14px;border:0;background:linear-gradient(#c9301a,#a21e0e);color:#fff;font-weight:900;font-size:21px;box-shadow:0 4px 0 #6e1209}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #8c1a10}
.ghostb{min-height:44px;border-radius:12px;border:1px solid #3a4866;background:transparent;color:var(--ink);font-weight:700}
/* ---- game ---- */
#game{--gx-bg:#0c1018;--gx-bar:#141a26;--gx-panel:#1a2230;--gx-ink:#f1f4fa;--gx-line:#2a354b;--gx-accent:#ffc23a;--gx-dock-w:clamp(320px,32vw,440px);color:var(--ink)}
.gx-bar h1{margin:0;font-size:18px;white-space:nowrap}
.gx-bar .pill{white-space:nowrap}
.gx-dock{background:var(--panel);border-left:2px solid #324059}
.gx-board{background:#245c37}
.ghostb span{display:block;font-weight:400;font-size:14px;color:var(--mute)}
button.qt{appearance:none;border:0;background:transparent;color:var(--gold);cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;font-size:16px;padding:0;width:100%}
.qt::after{content:' \25be';margin-left:6px}.qt[aria-expanded=true]::after{content:' \25b4'}#quickBody>.row,#quickBody>.lbl{margin-top:6px}
.lede{margin:0;text-align:center;color:var(--mute);font-size:16px}
.qh{margin:0;font-size:18px;color:var(--gold);font-weight:700}
.pill{background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:14px;display:inline-flex;align-items:center}
.pill b{color:var(--gold)}
#cvw{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#msg{text-align:center;font-weight:800;font-size:16px;padding:6px 10px;background:#141a26;border-bottom:1px solid #2a354b;min-height:34px}
#msg.warn{color:#ff8f7a}#msg.good{color:#8cf0b4}
#panel{padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px}
#gears{display:flex;align-items:center;gap:6px;background:var(--panel2) center/contain no-repeat;border-radius:14px;padding:4px 6px}
.gl{font-size:14px;color:var(--mute);width:42px;line-height:1.1}
.gb{flex:1;min-height:44px;border-radius:12px;border:2px solid #3b4a68;background:#1d2636;font-weight:900;font-size:20px;position:relative}
.gb.on{border-color:var(--gold);background:#4a3d1a;color:#fff}
.gb.off{opacity:1;color:#9aa7bd;border-style:dashed;border-color:#3b4a68;background:#141a26}.gb.off small{color:#9aa7bd}
.gb i{position:absolute;right:3px;top:0;font-size:14px;font-style:normal;color:#ff9b7a}
#hand{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;min-height:calc(var(--cw)*1.4)}
.cd{width:var(--cw);height:calc(var(--cw)*1.4);flex:0 0 auto;border-radius:9px;border:2px solid #8a98b4;background:linear-gradient(#f4f1e6,#d9d4c0) center/cover no-repeat;color:#1c2230;position:relative;padding:0;font-weight:900;transition:transform .12s}
.cd .v{position:absolute;left:0;right:0;top:2px;font-size:calc(var(--cw)*.5);line-height:1;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.cd .t{position:absolute;left:0;right:0;bottom:3px;font-size:14px;text-align:center;font-weight:800}
.cd.s1{background-color:#cfe6ff}.cd.s2{background-color:#cdf0d6}.cd.s3{background-color:#ffe9b8}.cd.s4{background-color:#ffc9bd}
.cd.H{background:linear-gradient(#5a2a2a,#2a1212);color:#ffb7a0;border-color:#8a3a30}.cd.H .v{text-shadow:none}
.cd.X{background:linear-gradient(#3a2c5a,#1d1630);color:#d9c8ff;border-color:#6d58a8}.cd.X .v{text-shadow:none}
.cd.hasart .v{text-shadow:0 0 4px #000,0 0 2px #000;color:#fff}.cd.hasart .t{color:#fff;text-shadow:0 0 3px #000}
.cd.sel{transform:translateY(-12px);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 8px 14px rgba(0,0,0,.5)}
.cd.dead{opacity:.55}
.cd.back{background:linear-gradient(135deg,#a8321f,#3a1410);border-color:#e08a70}
#acts{display:flex;gap:6px;align-items:center}
#acts button{min-height:46px;border-radius:12px;border:2px solid #3b4a68;background:#1d2636;font-weight:800;padding:0 10px}
#acts .go{flex:1.4;border:0;background:linear-gradient(#c9301a,#a21e0e);color:#fff;font-size:20px;box-shadow:0 3px 0 #6e1209}
#acts .go:disabled{background:#3a4254;box-shadow:none;color:#d7deeb}
#acts .bo.on{border-color:var(--gold);background:#4a3d1a}
#acts .bo:disabled{opacity:.4}
.chips{display:flex;gap:6px;font-size:14px;color:var(--mute);justify-content:center;flex-wrap:wrap}
.chips b{color:var(--ink)}
.chips span{display:inline-flex;align-items:center;gap:4px}
.ic{width:14px;height:14px;display:inline-block;background:center/contain no-repeat}
.reveal{display:flex;gap:6px;justify-content:center;align-items:center;min-height:calc(var(--cw)*1.4)}
.slipq{display:flex;gap:8px}.slipq button{flex:1;min-height:52px;border-radius:12px;border:2px solid #3b4a68;background:#1d2636;font-weight:900;font-size:17px}
.slipq .y{background:linear-gradient(#1f7a46,#175c35);color:#fff;border:0}
.slipq .y.risk{background:linear-gradient(#8a5a12,#6b430b)}
.slipq button.qt{background:linear-gradient(90deg,#33476b calc(var(--qt)*100%),#1d2636 calc(var(--qt)*100%))}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(5,8,14,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.sheet{position:relative;width:min(520px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid #3a4866;border-radius:16px;padding:18px 16px 16px}
.sheet h2{margin:0 0 8px;font-size:22px}
.sheet h3{margin:12px 0 4px;font-size:16px;color:var(--gold)}
.sheet p,.sheet li{font-size:15px;line-height:1.35;margin:4px 0}
.sheet ul{padding-left:18px;margin:4px 0}
.xb{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:12px;border:1px solid #3a4866;background:var(--panel2);font-size:20px;font-weight:900}
.stand{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;background:var(--panel2);margin:5px 0}
.stand .n{width:28px;font-weight:900;font-size:20px;color:var(--gold);text-align:center}
.stand .pt{width:44px;height:44px;border-radius:50%;background:#394762 center/cover no-repeat;flex:0 0 auto;border:3px solid;display:flex;align-items:center;justify-content:center;font-weight:900}
.stand small{display:block;color:var(--mute);font-size:14px}
.stand.you{outline:2px solid var(--gold)}
.podium{background:#171c28 center/cover no-repeat;border-radius:12px;padding:38px 16px 34px;margin-bottom:8px;text-align:center}
.ic.hud{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.ic.f-lap,.ic.f-place,.ic.f-gear,.ic.f-stress,.ic.f-heat{border-radius:50%}
.ic.f-lap{background-color:#4a9bff}.ic.f-place{background-color:#ffc23a}.ic.f-gear{background-color:#9aa7bd}.ic.f-stress{background-color:#8a52d6}.ic.f-heat{background-color:#ff6a3a}
.ic.hasart{background-color:transparent!important;border-radius:0}
.gl{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;width:auto}.gl .ic.hud{margin:0;width:20px;height:20px}
.tray{border-radius:10px;padding:5px 8px;background-color:rgba(255,255,255,.04);background-position:center;background-repeat:no-repeat}
.tray.hasart{background-size:100% 100%!important;background-color:transparent}.tray.hasart span,.tray.hasart b{color:#fff;text-shadow:0 1px 2px #000}
.cd.U{background:linear-gradient(#e4f5f0,#bfe0d6);border-color:#3a9a86;color:#12352d}.cd.U .t{font-size:14px;line-height:1;bottom:2px;left:0;right:0;overflow:hidden}.cd.U.hasart .t{color:#fff}
.upgrid{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.upc{display:flex;align-items:center;gap:12px;text-align:left;min-height:64px;padding:6px 8px;border-radius:12px;border:2px solid #3b4a68;background:#1d2636}
.upc:disabled{opacity:.35}.upc .cd{flex:0 0 auto;--cw:46px}.upc .un{display:flex;flex-direction:column}.upc small{color:var(--mute);font-size:14px}
#sndT,#m5{min-height:44px;border-radius:12px;border:1px solid #3a4866;background:transparent;font-weight:700;color:var(--ink)}
#sndT{flex:0 0 auto;min-width:78px}
#tutSlot .gxt-menu{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;text-align:left}#tutSlot .gxt-menu span{font-size:14px;color:var(--mute);font-weight:400}
#howTut .gxt-menu{width:100%;margin-top:10px;padding:8px 12px;text-align:left}
@media (max-width:600px){#tTrk,.gx-bar h1{display:none}.gx-bar{gap:4px;padding-left:6px;padding-right:6px}.pill{padding:3px 8px}.gx-ibtn{min-width:40px;padding:4px 6px}.gx-bar .gx-sp{flex:0 0 0}}
.pill b{margin-left:4px}
@media (min-width:900px){:root{--cw:66px}#hand{gap:6px}.lbl,small,.pill,.pill b,.chips,.chips b,.chips span,.gl,.gb i,.cd .t,.cd.U .t,.tray span,.opt small,.logo small,.upc small,.gxt-menu span,.stand small,.stand .n{font-size:16px}html body :is(.ghostb span,.gx-ibtn span,.gxt-menu span,.gxc-lab,.gxc-act b,.gxc-act small,.gxc-sh-t,.gxc-tag){font-size:16px!important}}
html body .gxc-node .gxc-disc{color:#fff!important;background:#2e1c0c!important}html body .gxc-node .gxc-lock{filter:grayscale(1) brightness(3);opacity:1!important}
@media (max-height:600px){#msg{padding:3px 8px;min-height:26px;font-size:14px}.gb{min-height:38px}#acts button{min-height:40px}}

/* ---- playable pass (W395): turn banner, readable cards, glow/dim, engine pips ---- */
#banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:8px;max-width:calc(100% - 16px);padding:7px 16px;border-radius:999px;background:#121826;border:2px solid var(--bc,#ffc23a);color:#fff;font-weight:900;font-size:17px;line-height:1.2;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.55)}
#banner.on{display:flex;animation:bnIn .3s ease-out}
#banner i{width:14px;height:14px;border-radius:50%;background:var(--bc,#ffc23a);flex:0 0 auto}
#banner.round i{display:none}
#banner.rate{left:8px;transform:none;max-width:calc(100% - 140px);font-size:15px;padding:6px 12px}   /* the round rating stays clear of the minimap (top right) */
@keyframes bnIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
#msg{font-size:16px;line-height:1.3;min-height:44px;display:flex;align-items:center;justify-content:center;padding:6px 12px;max-height:3.3em;overflow:hidden}
#gears .gl{font-size:14px;line-height:1.1;max-width:46px;font-weight:800}
.gb{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:2px 0}
.gb b{font-size:21px}.gb small{font-size:14px;font-weight:700;color:#c9d3e6;margin-top:2px}.gb.on small{color:#ffe6a0}.gb.glow{box-shadow:0 0 0 2px #ffc23a}
:root{--ch:calc(var(--cw)*1.55)}
#hand{min-height:var(--ch)}
.cd{height:var(--ch)}
.cd .k{position:absolute;left:0;right:0;top:2px;font-size:14px;line-height:1.1;text-align:center;font-weight:800}
.cd .v{top:calc(var(--ch)*.24);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.62)}
.cd .t{bottom:2px;left:-2px;right:-2px;font-size:14px;line-height:1.1;font-weight:700;white-space:nowrap;letter-spacing:-.02em}
.cd.H .t,.cd.X .t{color:#e8dcff}
.cd.glow{animation:cdGlow 1.4s ease-in-out infinite}
@keyframes cdGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,194,58,0)}50%{box-shadow:0 0 0 3px rgba(255,194,58,.85)}}
.cd.dim{opacity:.5;filter:saturate(.6)}
.cd.flip{animation:cdFlip .38s ease-out}
@keyframes cdFlip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
#acts .go.glow{animation:goGlow 1.2s ease-in-out infinite}
@keyframes goGlow{0%,100%{box-shadow:0 3px 0 #6e1209,0 0 0 0 rgba(255,194,58,0)}50%{box-shadow:0 3px 0 #6e1209,0 0 0 5px rgba(255,194,58,.8)}}
.reveal{min-height:var(--ch)}
.who{text-align:center;font-weight:900;font-size:16px;margin:2px 0 4px}
.tray .eng{gap:6px}.tray em{font-style:normal;color:#d5deee}
.pips{display:inline-flex;gap:3px}.pip{width:12px;height:12px;border-radius:50%;border:2px solid #ff9b5a;background:transparent}.pip.on{background:#ff7a3a}
.turn5{margin:4px 0 10px 20px;padding:0}.turn5 li{margin:4px 0;font-size:16px}
.podium .rl{margin:6px 8px 0;font-size:16px;line-height:1.35;color:#f1f4fa}
@media (prefers-reduced-motion:reduce){.cd.glow,#acts .go.glow{animation:none}.cd.glow{box-shadow:0 0 0 2px #ffc23a}}
.gxt-n{display:none}.gxt-dots i{width:5px;height:5px}
@media (max-width:600px){#panel{min-height:0}}
@media (max-width:999px) and (max-height:520px){html .gx-main{grid-template-columns:minmax(0,1fr) 330px!important;grid-template-rows:minmax(0,1fr)!important}html .gx-dock{max-height:none!important;border-radius:0!important}html .gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr) 0!important}}

@media (min-width:900px){#coach{font-size:16px}#coach button{font-size:16px}.swapb{font-size:16px}}
@media (max-width:420px){.gx-bar{gap:3px;padding-left:4px;padding-right:4px}.gx-ibtn{min-width:38px;padding:4px 5px}.pill{padding:3px 6px}}
