<body>
<div id="title" class="screen">
  <div class="tbox">
    <h1 class="logo">Redline Rally<small>CARD-DRIVEN RACING</small></h1>
    <p class="lede">Brake and keep your heat, or push and burn it.</p>
    <button class="big" id="playB">Play &#9654;</button>
    <button class="ghostb" id="storyB">Story chapters<span id="storyLine"></span></button>
    <div id="tutSlot"></div>
    <div class="quick" id="quick"><button type="button" class="qh qt" id="quickT" aria-expanded="false">Quick game options</button><div id="quickBody" hidden>
    <div class="lbl">Track</div>
    <div class="row" id="s-track"></div>
    <div class="lbl">Laps</div>
    <div class="row" id="s-laps"></div>
    <div class="lbl">Rival drivers</div>
    <div class="row" id="s-opp"></div>
    <div class="lbl">Players on this device</div>
    <div class="row" id="s-hum"></div>
    <div class="lbl">Upgrades</div>
    <div class="row" id="s-upg"></div>
    <div class="lbl">Rival skill</div>
    <div class="row" id="s-diff"></div>
    </div></div>
    <div class="row"><button class="ghostb" id="howB">How to play</button><button class="ghostb" data-snd id="sndT" aria-label="Sound"></button></div>
  </div>
</div>
<div id="game" class="gx-app" hidden>
  <header class="gx-bar">
    <h1>Redline Rally</h1>
    <span class="pill"><i class="ic hud f-lap" data-art="icon-lap"></i>Lap <b id="tLap">1/2</b></span><span class="pill"><i class="ic hud f-place" data-art="icon-place"></i>Place <b id="tPos">1/5</b></span><span class="pill" id="tTrk"></span>
    <span class="gx-sp"></span>
    <button class="gx-ibtn gxh-bulb" id="bulbbtn" data-help type="button" aria-label="Hint: what should I do?" title="Hint"></button>
    <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" aria-label="Rules"><span>Rules</span></button>
    <button class="gx-ibtn" id="sndB" data-snd aria-label="Sound"></button>
    <button class="gx-ibtn" id="menuB" aria-label="Menu"><span>Menu</span></button>
  </header>
  <div class="gx-main">
    <main class="gx-board"><div id="cvw"><canvas id="cv"></canvas><div id="banner" aria-live="polite"></div></div></main>
    <aside class="gx-dock" aria-label="What to do now">
      <div class="gx-dock-head"><span class="gx-grab" data-gx="sheet" title="Resize"></span><span class="gx-dt" id="dockt">Your move</span></div>
      <div class="gx-dock-body"><div id="msg" aria-live="polite"></div><div id="panel"></div></div>
    </aside>
    <button class="gx-ibtn gx-reopen" data-gx="dock">&#9776; Panel</button>
  </div>
</div>
<div id="modal" hidden></div>
<script src="gx-scenario.js"></script>
<script src="shell.js"></script>
<script src="gx-viewport.js"></script>
<script src="gx-help.js"></script>
<script src="gx-tutor.js"></script>
<script src="gameaudio.js"></script>
<script src="gx-music.js"></script>
<script src="gx-campaign.js"></script>
<script src="campaign-data.js"></script>
<script src="scn.js"></script>
<script src="story.js"></script>
<script src="data.js"></script>
<script src="track.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="art.js"></script>
<script src="sound.js"></script>
<script src="ui.js"></script>
<script src="tutor.js"></script>
<script src="camp.js"></script>
</body></html>
