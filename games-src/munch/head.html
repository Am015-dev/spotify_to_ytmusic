<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doorkick Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800&display=swap">
<style>
@property --w{syntax:"<length>";inherits:true;initial-value:124px}
@property --u{syntax:"<length>";inherits:true;initial-value:1px}
@property --hw{syntax:"<length>";inherits:true;initial-value:100px}
@property --sw{syntax:"<length>";inherits:true;initial-value:80px}
/* Layout: a candle-lit tavern table. Rivals sit along the top, the door and treasure decks flank the fight in the middle,
   your leather mat with your gear and hand sits at the bottom, the step coach is a parchment panel at the side. */
:root{
  --ink:#2b1a10; --muted:#6e5640; --paper:#f3e6c8; --paper2:#e6d2a6; --edge:#9c7440;
  --wood:#5b3720; --wood2:#3a2213; --wood3:#1f1109; --leather:#4a2616; --leather2:#2e160b;
  --brass:#e2b457; --brass2:#9a6620; --brass3:#5e3a0e; --cream:#f5e7c8; --cream2:#cfb68c;
  --red:#b3261e; --red2:#e0503c; --gold:#c07d12; --good:#2f7d34; --blue:#2c6aa8; --violet:#6a3fb0;
  --card:#f6ecd4; --shadow:rgba(20,8,2,.45); --glow:rgba(255,176,80,.55);
  --hand:"Alegreya",Georgia,"DejaVu Serif","Times New Roman",serif; --title:"Cinzel","Trajan Pro",Georgia,"DejaVu Serif",serif;
  --note:"Alegreya",Georgia,"DejaVu Serif",serif; --cardt:"Alegreya SC","Alegreya",Georgia,"DejaVu Serif",serif; --logo:"Cinzel Decorative","Cinzel",Georgia,serif;
  --tex-wood:none; --tex-leather:none; --tex-parch:none;
  --bg-hall:#1a0e07;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#e8d6ae;--paper2:#d6bd8a;--bg-hall:#0d0703;--wood:#4a2c18;--wood2:#2c190d;--shadow:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#e8d6ae;--paper2:#d6bd8a;--bg-hall:#0d0703;--wood:#4a2c18;--wood2:#2c190d;--shadow:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* shell theme */
:root{--gx-bg:var(--bg-hall);--gx-bar:var(--wood2);--gx-panel:var(--paper);--gx-ink:var(--ink);--gx-line:rgba(90,55,20,.35);--gx-accent:var(--brass);--gx-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);--gx-radius:14px;--gx-bar-h:52px;--gx-sheet-h:36dvh}
body{margin:0;background:var(--bg-hall);color:var(--ink);font:18px/1.35 var(--hand)}
button{font:inherit;color:inherit}
.ic{width:1.05em;height:1.05em;flex:none;vertical-align:-.16em;display:inline-block;overflow:visible}
/* the tavern: dark panelled wall, warm light from off-screen candles */
.gx-app{background:radial-gradient(120% 90% at 30% 0%,rgba(255,160,70,.16),transparent 60%),radial-gradient(90% 70% at 90% 100%,rgba(255,120,40,.08),transparent 60%),linear-gradient(rgba(10,4,1,.55),rgba(10,4,1,.78)),var(--tex-wood),linear-gradient(90deg,#2a170b,#3a2213 50%,#2a170b);background-size:auto,auto,auto,340px 170px,auto;color:var(--cream)}
/* top bar: polished dark wood with a brass rail */
.gx-bar{background:linear-gradient(#3b2313,#24140a 70%,#1a0d06),var(--tex-wood);background-blend-mode:multiply;border-bottom:1px solid #000;box-shadow:inset 0 -2px 0 var(--brass2),inset 0 -3px 0 #000,inset 0 1px 0 rgba(255,210,150,.12),0 6px 0 rgba(0,0,0,0.39);gap:7px;padding-left:12px;padding-right:12px;color:var(--cream)}
.gx-bar h1{font:900 1.45rem/1 var(--logo);margin:0 8px 0 0;white-space:nowrap;flex:none;letter-spacing:.01em;background:linear-gradient(#fff3c4,#f0c35a 45%,#b0741c 55%,#f7d983);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.85)) drop-shadow(0 0 8px rgba(255,170,60,.25))}
.gx-bar h1 span{background:linear-gradient(#ffb0a0,#e0503c 45%,#8a1a12 55%,#ff8a6a);-webkit-background-clip:text;background-clip:text;color:transparent}
.gx-ibtn{border:1px solid #0d0603;background:linear-gradient(#5a3620,#3a2011 60%,#2a160b);color:var(--cream);border-radius:10px;box-shadow:inset 0 0 0 1px rgba(226,180,87,.55),inset 0 1px 0 rgba(255,230,180,.3),0 2px 0 #0d0603,0 3px 0 rgba(0,0,0,0.32);flex:none;padding:3px 11px;font-weight:600;text-shadow:0 1px 0 #000;transition:transform .12s ease,box-shadow .12s ease,filter .12s}
.gx-ibtn .ic{width:1.2em;height:1.2em;color:var(--brass)}
.gx-ibtn:hover{filter:brightness(1.18);box-shadow:inset 0 0 0 1px rgba(255,210,120,.8),inset 0 1px 0 rgba(255,230,180,.4),0 3px 0 #0d0603,0 6px 0 rgba(0,0,0,0.35)}
.gx-ibtn:active{transform:translateY(1px);box-shadow:inset 0 0 0 1px rgba(226,180,87,.5),0 0 0 #000}
.gx-ibtn[aria-expanded="true"]{background:linear-gradient(#f7d983,#d59a32 55%,#9a6620);color:#2b1a10;text-shadow:0 1px 0 rgba(255,240,200,.6)}
.gx-ibtn[aria-expanded="true"] .ic{color:#4a2a08}
.gx-ibtn:focus-visible,.gx-drawer button:focus-visible{outline:3px solid #ffd76a;outline-offset:2px}
/* the dock: a parchment ledger with a leather header */
.gx-dock{background:radial-gradient(130% 60% at 50% 0%,rgba(255,250,235,.55),transparent 70%),var(--tex-parch),linear-gradient(var(--paper),var(--paper2));color:var(--ink);border-left:1px solid #000;box-shadow:inset 3px 0 0 var(--brass2),inset 4px 0 0 #1a0d06,-6px 0 0 rgba(0,0,0,0.28)}
.gx-dock-head{background:linear-gradient(#5a2f1a,#3a1c0e),var(--tex-leather);background-blend-mode:multiply;color:var(--cream);border-bottom:2px solid var(--brass2);box-shadow:0 3px 0 rgba(60,30,10,0.24);min-height:48px}
.gx-dock-head .gx-dt{font:700 1rem var(--title);letter-spacing:.03em;text-shadow:0 1px 0 #000}
.gx-dock-body{padding:9px 13px 13px}
.gx-drawer{background:radial-gradient(130% 50% at 50% 0%,rgba(255,250,235,.55),transparent 70%),var(--tex-parch),linear-gradient(var(--paper),var(--paper2));border:1px solid #1a0d06;box-shadow:var(--gx-shadow),inset 0 0 0 2px var(--brass2),inset 0 0 0 3px #1a0d06}
.gx-drawer-head{background:linear-gradient(#5a2f1a,#3a1c0e),var(--tex-leather);background-blend-mode:multiply;color:var(--cream);border-radius:var(--gx-radius) var(--gx-radius) 0 0;border-bottom:2px solid var(--brass2);margin:3px 3px 0}
.gx-drawer-head h2{font:700 1.2rem var(--title);letter-spacing:.03em;text-shadow:0 1px 0 #000}
.gx-x{color:var(--cream)}
.gx-x:hover{color:#ffd76a}
.gx-reopen{background:linear-gradient(#5a3620,#2a160b)}
.gx-scrim{background:radial-gradient(circle at 50% 40%,rgba(20,8,2,.35),rgba(10,4,1,.7))}
/* buttons: parchment, gold-lacquer primary, crimson and emerald lacquer */
.btn{--b1:#fbf2dc;--b2:#e8d3a4;--b3:#c9a86c;border:1px solid #3a2213;background:linear-gradient(var(--b1),var(--b2) 60%,var(--b3));color:var(--ink);border-radius:9px;padding:5px 13px;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(90,50,10,.25),0 2px 0 #3a2213,0 4px 0 rgba(40,20,5,0.21);min-height:40px;font-weight:600;transition:transform .12s ease,box-shadow .12s ease,filter .12s;display:inline-flex;align-items:center;gap:6px}
.btn .ic{width:1.15em;height:1.15em}
.btn:hover{filter:brightness(1.05) saturate(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 0 rgba(90,50,10,.25),0 3px 0 #3a2213,0 7px 0 rgba(40,20,5,0.24)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #3a2213}
.btn.primary{--b1:#fff0b8;--b2:#f0bf4c;--b3:#b87818;color:#2b1405;font-weight:800;text-shadow:0 1px 0 rgba(255,245,210,.7);border-color:#4a2a06}
.btn.danger{--b1:#f08070;--b2:#c0392b;--b3:#7a1a12;color:#fff4e8;text-shadow:0 1px 0 rgba(0,0,0,.5);border-color:#3a0a06}
.btn.good{--b1:#9edc8a;--b2:#3f9a48;--b3:#1f5a26;color:#f4ffe8;text-shadow:0 1px 0 rgba(0,0,0,.5);border-color:#0d2a10}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:grayscale(.6);box-shadow:0 1px 0 #3a2213}
.btn:focus-visible,.card:focus-visible,.gchip:focus-visible,.opp:focus-visible{outline:3px solid #2c8ae8;outline-offset:3px}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 0 #3a2213,0 0 0 5px rgba(255,200,80,.45),0 0 0 6px rgba(255,180,60,0.3)}}
/* panels: parchment with a gilt hairline */
.paper{background:var(--tex-parch),linear-gradient(var(--paper),var(--paper2));color:var(--ink);border:1px solid #2a170b;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,245,220,.55),0 5px 0 var(--shadow)}
.box{padding:10px 12px}
h2,h3{font-family:var(--title);font-weight:700;margin:.2rem 0 .4rem;text-wrap:balance;letter-spacing:.02em}
h3{font-size:1.02rem}
.small{font-size:.85rem}.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border:1px solid #5a3a18;border-radius:99px;font-size:.8rem;background:linear-gradient(#fbf2dc,#e6d0a0);color:var(--ink);white-space:nowrap;box-shadow:inset 0 1px 0 #fff8,0 1px 0 rgba(0,0,0,0.17)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ptok{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;font-size:.78em;line-height:1;color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 0 0 1.5px #f0c860,0 0 0 2.5px #2a170b,0 2px 0 rgba(0,0,0,0.35);text-shadow:0 1px 0 rgba(0,0,0,.5);vertical-align:.05em;margin-right:.15em}
/* ===== the board: rival strip / table / your area ===== */
.gx-board{display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;container-type:size}
.opps{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;flex:none;padding:2px 2px 6px;scrollbar-width:thin}
/* rivals: tooled leather plaques */
.opp{flex:1 0 150px;max-width:270px;min-height:48px;padding:4px 10px 4px 12px;cursor:pointer;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;font:inherit;color:var(--cream);transition:transform .15s ease,box-shadow .15s ease}
.opp.paper{background:radial-gradient(120% 120% at 20% 0%,rgba(255,200,140,.18),transparent 55%),var(--tex-leather),linear-gradient(#5a2d18,#34170a);border:1px solid #120704;border-radius:10px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),inset 0 0 0 4px rgba(226,180,87,.35),0 4px 0 rgba(0,0,0,0.35)}
.opp:hover{box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),inset 0 0 0 4px rgba(255,210,120,.7),0 8px 0 rgba(0,0,0,0.39)}
.opp.active{outline:0;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),inset 0 0 0 4px #ffd76a,0 0 0 2px #ffd76a,0 0 0 6px rgba(255,190,70,0.33)}
.opp .lv{font:800 1.7rem/1 var(--title);color:#ffd76a;text-shadow:0 2px 0 #000;grid-row:1/3;grid-column:2;display:flex;align-items:baseline}
.opp .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;text-shadow:0 1px 0 #000}
.opp .st{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;color:var(--cream2)}
.opp .st .ic{color:var(--brass)}
.face{width:30px;height:30px;flex:none}
/* the table: planked tavern wood, a brass-bound rim, candle light and a vignette */
.table{flex:1 1 auto;min-height:0;perspective:1100px;container-type:size;--sw:clamp(46px,25cqh,96px)}
.felt{height:100%;transform:rotateX(10deg);transform-origin:50% 100%;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;overflow:hidden;position:relative;border-radius:18px;
  background:radial-gradient(70% 60% at 50% 48%,rgba(255,190,110,.10),transparent 70%),var(--tex-wood),repeating-linear-gradient(0deg,#6a3f22 0 3px,#5a3520 3px 9px,#71452a 9px 14px);background-size:auto,340px 170px,auto;
  border:1px solid #0d0603;box-shadow:inset 0 0 0 5px #2a160b,inset 0 0 0 6px rgba(226,180,87,.55),inset 0 0 0 9px #1f1008,inset 0 2px 0 9px rgba(255,210,150,.08),0 10px 16px rgba(0,0,0,.5),0 4px 0 #120804}
.felt.paper{color:var(--cream)}
.felt::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(60% 70% at 18% -5%,rgba(255,196,120,.32),transparent 65%),radial-gradient(55% 60% at 86% 0%,rgba(255,170,90,.22),transparent 62%);z-index:0}
.felt::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 105% at 50% 42%,transparent 52%,rgba(10,4,0,.42) 78%,rgba(10,4,0,.78) 100%);z-index:0}
.felt>*{position:relative;z-index:1}
[data-gfx="high"] .felt::before{animation:candle 5.2s ease-in-out infinite;will-change:opacity}
@keyframes candle{0%,100%{opacity:1}12%{opacity:.86}18%{opacity:.97}37%{opacity:.9}52%{opacity:1}64%{opacity:.84}71%{opacity:.95}88%{opacity:.9}}
/* the decks: real stacked cards with a printed back */
.pile{display:grid;gap:6px;justify-items:center;align-content:start}
.pile .stack{width:var(--sw);height:calc(var(--sw)*1.42);border-radius:calc(var(--sw)*.08);display:grid;place-items:center;text-align:center;position:relative;color:var(--cream);overflow:visible;
  box-shadow:var(--deck,0 0 0 #000),0 calc(var(--sw)*.06) 0 rgba(0,0,0,.45);transform:rotate(-1.5deg)}
.pile.pr .stack{transform:rotate(1.5deg)}
.pile .stack .back{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.pile .stack .back svg,.pile .stack .back img{width:100%;height:100%;display:block}
.pile .stack .dn{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font:700 clamp(.5rem,calc(var(--sw)*.12),.85rem)/1 var(--title);letter-spacing:.08em;color:#ffe7a0;text-shadow:0 1px 0 #000;white-space:nowrap}
.pile .stack .n{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 5px;border-radius:13px;display:grid;place-items:center;font:700 .78rem/1 var(--title);color:#2b1405;background:radial-gradient(circle at 35% 30%,#fff3c4,#e2b457 50%,#8a5a14);box-shadow:0 0 0 1.5px #2a170b,0 2px 0 rgba(0,0,0,0.42)}
.pile .lbl{font-size:.74rem;color:var(--cream2);white-space:nowrap;text-shadow:0 1px 0 #000}
.pile .card.xs{--w:calc(var(--sw)*.9)}
.arena{height:100%;min-height:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:safe center;overflow:auto;--cw:clamp(56px,calc((100cqh - var(--res,110px))/1.42),210px);position:relative;border-radius:50%/40%}
.arena::before{content:"";position:absolute;inset:4% 2%;border-radius:50%;background:radial-gradient(closest-side,rgba(30,12,4,.35),rgba(30,12,4,.18) 70%,transparent 100%);box-shadow:inset 0 0 0 1px rgba(226,180,87,.12);pointer-events:none;z-index:-1}
.arena .vs{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:8px;font:700 1.1rem var(--title)}
.arena .card{--w:min(var(--cw),calc((100cqw - 2*var(--sw) - 80px)/var(--n,1) - 12px))}
.arena .mon{display:grid;gap:4px;justify-items:center;min-width:0}
.arena .mon>.small{color:var(--cream);text-shadow:0 1px 0 #000;font-weight:600}
/* the clash: two medallions and crossed swords */
.score{display:inline-flex;align-items:center;gap:8px;padding:3px 14px 3px 6px;border-radius:99px;font-variant-numeric:tabular-nums;color:var(--cream);border:1px solid #0d0603;position:relative;
  background:linear-gradient(#3a4a64,#1e2838);box-shadow:inset 0 0 0 1.5px rgba(200,220,255,.4),inset 0 1px 0 rgba(255,255,255,.25),0 4px 0 rgba(0,0,0,0.39)}
.score.mons{background:linear-gradient(#6a1c16,#360c08);box-shadow:inset 0 0 0 1.5px rgba(255,180,150,.4),inset 0 1px 0 rgba(255,255,255,.2),0 4px 0 rgba(0,0,0,0.39)}
.score .sl{font:600 .82rem/1.1 var(--hand);max-width:14em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .num{order:-1;display:grid;place-items:center;min-width:1.9em;height:1.9em;padding:0 .2em;border-radius:50%;font:800 1.25rem/1 var(--title);color:#2b1405;background:radial-gradient(circle at 35% 28%,#fff6d0,#f0c35a 45%,#9a6620);box-shadow:0 0 0 2px #2a170b,0 2px 0 rgba(0,0,0,0.42),inset 0 -2px 0 rgba(90,50,10,0.35)}
.score.mons .num{order:2;background:radial-gradient(circle at 35% 28%,#ffd0c0,#e0503c 45%,#6a1410);color:#fff4e8;text-shadow:0 1px 0 #000}
.score.mons{padding:3px 6px 3px 14px}
.score.win{box-shadow:inset 0 0 0 1.5px #ffd76a,0 0 0 2px rgba(255,215,106,.6),0 0 0 7px rgba(255,190,70,0.3),0 4px 0 rgba(0,0,0,0.39)}
.score.lose{filter:saturate(.75) brightness(.9)}
.vsx{width:2.1em;height:2.1em;display:grid;place-items:center;color:#ffd76a;filter:drop-shadow(0 2px 2px #000)}
.vsx .ic{width:100%;height:100%}
.clash .score.hero.enter{animation:clashL .55s cubic-bezier(.2,1.4,.4,1)}
.clash .score.mons.enter{animation:clashR .55s cubic-bezier(.2,1.4,.4,1)}
.clash .vsx.enter{animation:clashX .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes clashL{from{transform:translateX(-90px) scale(.8);opacity:0}}
@keyframes clashR{from{transform:translateX(90px) scale(.8);opacity:0}}
@keyframes clashX{0%{transform:scale(0) rotate(-90deg);opacity:0}60%{transform:scale(1.5) rotate(10deg);opacity:1}}
.num.bump{animation:bump .5s cubic-bezier(.2,1.8,.4,1)}@keyframes bump{40%{transform:scale(1.45)}}
.fxdelta{position:absolute;top:-6px;left:50%;font:800 1.15rem/1 var(--title);pointer-events:none;white-space:nowrap;transform:translateX(-50%);text-shadow:0 2px 0 #000;animation:floatup 1.1s ease-out forwards;z-index:5}
.fxdelta.up{color:#9dff8a}.fxdelta.dn{color:#ff8a7a}
@keyframes floatup{0%{transform:translate(-50%,6px) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.25);opacity:1}100%{transform:translate(-50%,-44px) scale(1);opacity:0}}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}
.arena .row.mons{flex-wrap:nowrap}
.empty{font:italic 500 1.2rem var(--note);color:var(--cream);text-align:center;padding:6px 10px;text-shadow:0 1px 0 #000}
.empty.small{font-size:.9rem;color:var(--cream2)}
.rollbox{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--cream);text-shadow:0 1px 0 #000}
.rollbox .dwrap{width:38px;height:38px;flex:none}
.rollbox .die3{scale:.65;transform-origin:0 0}
/* your area: a stitched leather mat */
.mine{flex:none;padding:6px 12px 4px;--hw:clamp(62px,calc(21cqh/1.42),140px);display:grid;gap:4px}
.mine.paper{color:var(--cream);background:radial-gradient(90% 140% at 50% 0%,rgba(255,190,120,.16),transparent 60%),var(--tex-leather),linear-gradient(#5a2d18,#2e150a);border:1px solid #0d0603;border-radius:14px;box-shadow:inset 0 0 0 5px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,220,170,.18),0 6px 0 rgba(0,0,0,0.35);position:relative}
.mine.paper::before{content:"";position:absolute;inset:5px;border-radius:10px;border:1.5px dashed rgba(226,180,87,.45);pointer-events:none}
.mine .top{display:flex;gap:10px;align-items:center;min-width:0;white-space:nowrap;position:relative}
.mine .top .who{font:700 1.1rem/1.1 var(--title);overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;text-shadow:0 1px 0 #000}
.mine .top .str{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto;color:var(--cream2)}
.mine .top .str b{color:#ffd76a;font-size:1.05rem}

/* buttons, rival plaques and gear chips no longer lift on hover: a 1-2 px lift moves the hit box off a still pointer at the edge, hover flips every frame and the table repaints non-stop (on Low the "Let it be" button never stopped jittering) */
