<body>
<div class="gx-app">
<header class="gx-bar">
  <h1><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="9" fill="#2a8a80" stroke="#f8eed8" stroke-width="1.6"/><ellipse cx="12" cy="8" rx="8" ry="3" fill="#5fc6a8" stroke="#f8eed8" stroke-width="1.2"/><circle cx="9" cy="14" r="1.6" fill="#f8eed8"/><circle cx="14" cy="16" r="1.2" fill="#f8eed8"/></svg></span><span class="tt">Cauldron Fair</span></h1>
  <span id="barstat"></span>
  <button id="netst" type="button" data-a="netopen" hidden></button>
  <div id="barprompt"></div>
  <span class="gx-sp"></span>
  <button class="gx-ibtn" data-gx="scored" aria-expanded="false" aria-label="Scores and players" title="Scores and players"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Scores</span></button>
  <button class="gx-ibtn" data-gx="logd" aria-expanded="false" aria-label="Log" title="Log"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h6M10 12h6M10 16h4"/></svg><span>Log</span></button>
  <button class="gx-ibtn" data-gx="refd" aria-expanded="false" aria-label="Chips and cards" title="Chips, books and cards"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="12" height="17" rx="2"/><path d="M8 7h4M8 11h4M19 7v13"/></svg><span>Cards</span></button>
  <button class="gx-ibtn" data-gx="rulesd" aria-expanded="false" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z M12 6v13"/></svg><span>Rules</span></button>
  <button class="gx-ibtn" data-gx="setd" aria-expanded="false" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>
<div class="gx-main">
  <main class="gx-board" id="board" aria-label="The cauldrons"><div id="bd">
    <div id="others" role="group" aria-label="The other cauldrons"></div>
    <div id="cz">
      <div id="me"></div>
      <div id="caul"><div id="cwrap"><div id="cpot" role="group" aria-label="Your cauldron"></div><div id="bagi"></div><div id="cbad" class="cbad" hidden></div></div></div>
    </div>
  </div></main>
  <aside class="gx-dock" id="dock" aria-label="What to do now">
    <div class="gx-dock-head"><span class="gx-grab" data-gx="sheet"></span><span class="gx-dt">Your turn</span><button class="gx-ibtn" data-gx="dock" aria-label="Hide panel">&#8677;</button></div>
    <div class="gx-dock-body" id="dockbody">
      <div id="promptDock"><div id="prompt" aria-live="polite"></div></div>
      <div id="qbox" hidden></div>
      <div id="acts"></div>
      <div id="risk"></div>
      <div id="hint" hidden></div>
      <div id="fort"></div>
      <div id="roster"></div>
    </div>
    <div class="pcard" id="pc" hidden role="dialog" aria-label="Message"></div>
  </aside>
  <button class="gx-ibtn gx-reopen" data-gx="dock">&#9776; Panel</button>
</div>
</div>
<div id="start" hidden></div>
<div id="rs" hidden></div>
<div id="netbox" hidden></div>
<div id="toast" role="status"></div>
<script type="text/plain" id="pixi-src" src="pixi.min.js"></script>
<script src="shell.js"></script>
<script src="perfhud.js"></script>
<script src="trystero.min.js"></script>
<script src="netroom.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="kit.js"></script>
<script src="art-data.js"></script>
<script src="netstrip.js"></script>
<script src="gameaudio.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
