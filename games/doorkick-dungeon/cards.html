 Skygrif" loading="lazy" width="224" height="224"><figcaption><b>Stampeding Skygrif</b><em>Level 16 · 4 treasures · 2 levels</em><span>Won’t chase anyone of level 3 or lower.</span><span class="bad">Bad stuff: You drop things as you flee: each other player takes one treasure card from your table or hand.</span></figcaption></figure><figure class="c" data-s="timeshare pitchman your level doesn’t count: fight him with bonuses only. you sign up: lose 1,000 gold worth of items, or all of them."><img src="cards/pitchman.webp" alt="Timeshare Pitchman" loading="lazy" width="224" height="224"><figcaption><b>Timeshare Pitchman</b><em>Level 14 · 4 treasures</em><span>Your level doesn’t count: fight him with bonuses only.</span><span class="bad">Bad stuff: You sign up: lose 1,000 gold worth of items, or all of them.</span></figcaption></figure><figure class="c" data-s="pharaoh wrappington undead. won’t chase level 3 or lower; anyone higher who flees loses 2 levels even when they get away. lose all your items and your whole hand."><img src="cards/pharaoh.webp" alt="Pharaoh Wrappington" loading="lazy" width="224" height="224"><figcaption><b>Pharaoh Wrappington</b><em>Level 16 · 4 treasures · 2 levels</em><span>Undead. Won’t chase level 3 or lower; anyone higher who flees loses 2 levels even when they get away.</span><span class="bad">Bad stuff: Lose all your items and your whole hand.</span></figcaption></figure><figure class="c" data-s="limping imp +1 to run away. a whack with its crutch: lose a level."><img src="cards/imp.webp" alt="Limping Imp" loading="lazy" width="224" height="224"><figcaption><b>Limping Imp</b><em>Level 1 · 1 treasure</em><span>+1 to run away.</span><span class="bad">Bad stuff: A whack with its crutch: lose a level.</span></figcaption></figure><figure class="c" data-s="furious rooster beat it with fire or flame and gain an extra level. painful pecking: lose a level."><img src="cards/rooster.webp" alt="Furious Rooster" loading="lazy" width="224" height="224 nace" loading="lazy" width="224" height="224"><figcaption><b>Ficus of Menace</b><em>Level 1 · 1 treasure</em><span>An Elf who beats it draws an extra treasure.</span><span class="bad">Bad stuff: None: you always get away.</span></figcaption></figure><figure class="c" data-s="barfabunny beat it with no help and no bonuses at all and gain an extra level. projectile sick: discard your whole hand."><img src="cards/barfabunny.webp" alt="Barfabunny" loading="lazy" width="224" height="224"><figcaption><b>Barfabunny</b><em>Level 6 · 2 treasures</em><span>Beat it with no help and no bonuses at all and gain an extra level.</span><span class="bad">Bad stuff: Projectile sick: discard your whole hand.</span></figcaption></figure><figure class="c" data-s="nitpicking nerd +6 against warriors. you become a plain human: lose your races and classes."><img src="cards/nerd.webp" alt="Nitpicking Nerd" loading="lazy" width="224" height="224"><figcaption><b>Nitpicking Nerd</b><em>Level 6 · 2 treasures</em><span>+6 against Warriors.</span><span class="bad">Bad stuff: You become a plain Human: lose your races and classes.</span></figcaption></figure><figure class="c" data-s="turbo slugs -2 to run away. roll a die: lose that many items or cards from your hand, your pick."><img src="cards/slugs.webp" alt="Turbo Slugs" loading="lazy" width="224" height="224"><figcaption><b>Turbo Slugs</b><em>Level 4 · 2 treasures</em><span>-2 to run away.</span><span class="bad">Bad stuff: Roll a die: lose that many items or cards from your hand, your pick.</span></figcaption></figure><figure class="c" data-s="tentaclopolis +4 against elves. won’t chase anyone of level 4 or lower, except elves. grabbed, slimed and gobbled. dead."><img src="cards/tentacles.webp" alt="Tentaclopolis" loading="lazy" width="224" height="224"><figcaption><b>Tentaclopolis</b><em>Level 18 · 4 treasures · 2 levels</em><span>+4 against Elves. Won’t chase anyone of level 4 or lower, except Elves.</span><span class="bad">Bad stuff: Grabbe d your whole hand to send one lone monster away and take its treasure (no level). "><img src="cards/wizard.webp" alt="Wizard" loading="lazy" width="224" height="224"><figcaption><b>Wizard</b><span>Flight: discard up to 3 cards, +1 each to run away. Charm: discard your whole hand to send one lone monster away and take its treasure (no level).</span></figcaption></figure><figure class="c" data-s="thief backstab: discard a card to give a fighter -2 (once per victim per fight). steal: discard a card to try for a small item: roll 4+, or lose a level. "><img src="cards/thief.webp" alt="Thief" loading="lazy" width="224" height="224"><figcaption><b>Thief</b><span>Backstab: discard a card to give a fighter -2 (once per victim per fight). Steal: discard a card to try for a small item: roll 4+, or lose a level.</span></figcaption></figure><figure class="c" data-s="cleric resurrection: instead of kicking a new door, take the top door discard and discard a card. turning: discard up to 3 cards against undead, +3 each. "><img src="cards/cleric.webp" alt="Cleric" loading="lazy" width="224" height="224"><figcaption><b>Cleric</b><span>Resurrection: instead of kicking a new door, take the top door discard and discard a card. Turning: discard up to 3 cards against undead, +3 each.</span></figcaption></figure></div><h2>Races <small>3</small></h2><div class="grid"><figure class="c" data-s="elf +1 to run away. go up a level for each monster you help someone kill. "><img src="cards/elf.webp" alt="Elf" loading="lazy" width="224" height="224"><figcaption><b>Elf</b><span>+1 to run away. Go up a level for each monster you help someone kill.</span></figcaption></figure><figure class="c" data-s="dwarf carry any number of big items. hold up to 6 cards. "><img src="cards/dwarf.webp" alt="Dwarf" loading="lazy" width="224" height="224"><figcaption><b>Dwarf</b><span>Carry any number of Big items. Hold up to 6 cards.</span></figcaption></figure><figure class="c" data-s="halfling -1 to run away. once per turn, sell one item for double its price. "><img src="cards/halfling.webp" alt="Halfling" loading="lazy" width="224" height="224"><figcaption><b>Halfling</b><span>-1 to run away. Once per turn, sell one item for double its price.</span></figcaption></figure></div><h2>Specials <small>11</small></h2><div class="grid"><figure class="c" data-s="mixed heritage you may have two races. with one race, you get its perks and none of its drawbacks. "><img src="cards/mixed.webp" alt="Mixed Heritage" loading="lazy" width="224" height="224"><figcaption><b>Mixed Heritage</b><span>You may have two races. With one race, you get its perks and none of its drawbacks.</span></figcaption></figure><figure class="c" data-s="double major you may have two classes. with one class, you get its perks and none of its drawbacks. "><img src="cards/double.webp" alt="Double Major" loading="lazy" width="224" height="224"><figcaption><b>Double Major</b><span>You may have two classes. With one class, you get its perks and none of its drawbacks.</span></figcaption></figure><figure class="c" data-s="uninvited guest play with a monster from your hand during any fight: it joins in. "><img src="cards/uninvited.webp" alt="Uninvited Guest" loading="lazy" width="224" height="224"><figcaption><b>Uninvited Guest</b><span>Play with a monster from your hand during any fight: it joins in.</span></figcaption></figure><figure class="c" data-s="loophole wear one item the rules would not allow (any restriction or slot). lose this card when you lose that item. "><img src="cards/loophole.webp" alt="Loophole" loading="lazy" width="224" height="224"><figcaption><b>Loophole</b><span>Wear one item the rules would not allow (any restriction or slot). Lose this card when you lose that item.</span></figcaption></figure><figure class="c" data-s="heavenly favor however it is drawn, every cleric goes up a level at once, even to win. "><img src="cards/favor.webp" alt="Heavenly Favor" loading="lazy" width="224" height="224"><figc
