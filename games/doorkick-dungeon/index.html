<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doorkick Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Permanent+Marker&display=swap">
<style>
/* Layout: a sheet of graph paper on a desk; the dungeon table is tilted in CSS 3D, your hand fans along the bottom, the step coach sits at the side. */
:root{
  --paper:#fbfaf4; --grid:#cfe3f3; --grid2:#e4eef7; --ink:#2b2233; --muted:#6a6178; --desk:#d9c6a5; --desk2:#c7b08a;
  --red:#e03131; --gold:#f08c00; --good:#2f9e44; --blue:#1c7ed6; --violet:#7048e8; --card:#fffef9; --door:#ffe8cc; --treas:#fff3bf; --shadow:rgba(60,40,20,.25);
  --hand:"Patrick Hand","Comic Sans MS","Chalkboard SE","Segoe Print",cursive; --title:"Permanent Marker","Arial Black",Impact,sans-serif; --note:"Gochi Hand","Patrick Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1f2230;--grid:#2d3448;--grid2:#262b3c;--ink:#f1eee6;--muted:#aaa3b8;--desk:#14151d;--desk2:#0e0f15;--card:#fffef9;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1f2230;--grid:#2d3448;--grid2:#262b3c;--ink:#f1eee6;--muted:#aaa3b8;--desk:#14151d;--desk2:#0e0f15;--card:#fffef9;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--desk);background-image:radial-gradient(circle at 20% 10%,var(--desk2) 0 1px,transparent 1.5px);background-size:9px 9px;color:var(--ink);font:18px/1.35 var(--hand)}
button{font:inherit;color:inherit}
header{display:flex;gap:8px;align-items:center;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--paper);border-bottom:3px solid var(--ink);position:sticky;top:0;z-index:5;overflow-x:auto;flex-wrap:nowrap}
header h1{font:400 1.6rem/1 var(--title);margin:0 10px 0 0;white-space:nowrap;transform:rotate(-2deg)}
header h1 span{color:var(--red)}
.btn{border:2.5px solid var(--ink);background:var(--paper);border-radius:12px 14px 11px 15px/14px 11px 15px 12px;padding:5px 12px;cursor:pointer;white-space:nowrap;box-shadow:2px 3px 0 var(--ink);min-height:40px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:#ffd43b;color:#2b2233;font-weight:700}
.btn.danger{background:#ffc9c9;color:#2b2233}
.btn.good{background:#b2f2bb;color:#2b2233}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.card:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:2px 3px 0 var(--ink),0 0 0 6px rgba(255,212,59,.45)}}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px 16px;max-width:1500px;margin:0 auto}
.wrap>*{min-width:0}
.paper{background:var(--paper);background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px,12px 12px,60px 60px,60px 60px;border:2.5px solid var(--ink);border-radius:6px 10px 8px 12px;box-shadow:4px 6px 0 var(--shadow)}
.box{padding:10px 12px}
h2,h3{font-family:var(--title);font-weight:400;margin:.2rem 0 .4rem;text-wrap:balance}
h3{font-size:1.1rem}
.small{font-size:.85rem}.muted{color:var(--muted)}
/* opponents */
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opp{padding:8px 10px;position:relative;cursor:pointer}
.opp.active{outline:4px solid #ffd43b;outline-offset:-2px}
.opp .lv{font:400 2.1rem/1 var(--title);float:right;color:var(--red)}
.opp .nm{font-weight:700;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;padding:0 7px;border:2px solid var(--ink);border-radius:10px;font-size:.8rem;background:var(--paper);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.face{width:30px;height:30px;flex:none}
/* the table */
.table{margin-top:12px;perspective:1100px;padding:10px}
.felt{transform:rotateX(18deg);transform-origin:50% 100%;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;min-height:280px}
.pile{display:grid;gap:10px;justify-items:center}
.pile .stack{width:96px;height:134px;border:2.5px solid var(--ink);border-radius:10px;display:grid;place-items:center;font:400 1rem var(--title);text-align:center;box-shadow:3px 3px 0 var(--ink),6px 6px 0 var(--shadow);position:relative;color:#2b2233}
.pile .stack.door{background:repeating-linear-gradient(45deg,var(--door) 0 10px,#ffd8a8 10px 20px)}
.pile .stack.treas{background:repeating-linear-gradient(-45deg,var(--treas) 0 10px,#ffec99 10px 20px)}
.pile .stack .n{position:absolute;bottom:4px;right:8px;font:400 .9rem var(--hand)}
.pile .lbl{font-size:.8rem;color:var(--muted)}
.arena{min-height:250px;display:grid;gap:10px;align-content:start}
.arena .vs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font:400 1.4rem var(--title)}
.score{padding:4px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);font-variant-numeric:tabular-nums}
.score.win{background:#b2f2bb;color:#2b2233}.score.lose{background:#ffc9c9;color:#2b2233}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end}
.empty{font:400 1.3rem var(--note);color:var(--muted);text-align:center;padding:30px 10px}
/* cards */
.card{--w:124px;width:var(--w);height:calc(var(--w)*1.42);border:2.5px solid #2b2233;border-radius:10px 12px 9px 13px;background:var(--card);color:#2b2233;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:5px 6px;position:relative;cursor:pointer;box-shadow:2px 3px 0 #2b2233;transition:transform .18s ease,box-shadow .18s ease;text-align:left;font:15px/1.1 var(--hand);overflow:hidden;flex:none}
.card:hover{transform:translateY(-8px) rotate(-1deg);box-shadow:4px 8px 0 #2b2233;z-index:3}
.card.door{background:linear-gradient(var(--card),var(--card)) padding-box;border-top:8px solid #f76707}
.card.tr{border-top:8px solid #f59f00}
.card .cn{font:400 .8rem/1 var(--title);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:4px;margin-top:1px}
.card .art{width:100%;height:100%;min-height:0}
.card .cx{font-size:.72rem;line-height:1.05;max-height:3.3em;overflow:hidden}
.card .tag{font:400 .95rem/1 var(--title);color:#e03131;white-space:nowrap}
.card .gold{position:absolute;bottom:2px;right:5px;font-size:.66rem;color:#8a5a00;background:var(--card);padding-left:3px}
.card{padding-bottom:12px}
.card .kind{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:#6a6178;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.sel{outline:4px solid var(--blue);transform:translateY(-12px)}
.card.play{box-shadow:2px 3px 0 #2b2233,0 0 0 4px #ffd43b}
.card.dim{opacity:.55}
.card.sug::after{content:"SUGGESTED";position:absolute;left:-26px;top:10px;transform:rotate(-38deg);background:#ffd43b;font:700 .6rem var(--hand);padding:1px 30px;letter-spacing:.08em}
.card.sm{--w:92px}.card.sm .cx{display:none}
.card.xs{--w:70px}.card.xs .cx,.card.xs .kind{display:none}.card.xs .tag{font-size:.7rem}.card.xs .cn{font-size:.62rem}
.card.eqoff{filter:grayscale(.7);opacity:.75}
.card.fly{animation:fly .5s ease-out}@keyframes fly{from{transform:translateY(-60px) rotate(-8deg) scale(.7);opacity:0}}
.card.flip{animation:flip .55s ease-out}@keyframes flip{from{transform:rotateY(90deg) scale(1.2)}}
.hand{display:flex;gap:6px;overflow-x:auto;padding:14px 6px 8px;min-height:200px;align-items:flex-end}
.hand .card:nth-child(odd){rotate:-1.5deg}.hand .card:nth-child(even){rotate:1.2deg}
.mine{margin-top:12px}
.mine .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.mine .lv{font:400 2.6rem/1 var(--title);color:var(--red)}
.tableau{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
/* dice (CSS 3D cube) */
.die3{width:58px;height:58px;position:relative;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(25deg)}
.die3.roll{animation:tumble .8s cubic-bezier(.2,.8,.3,1)}@keyframes tumble{from{transform:rotateX(720deg) rotateY(540deg) translateY(-80px)}}
.die3 i{position:absolute;inset:0;border:2.5px solid #2b2233;border-radius:10px;background:#fff;display:grid;place-items:center;font:400 1.8rem var(--title);color:#2b2233;backface-visibility:hidden}
.die3 i:nth-child(1){transform:translateZ(29px)}.die3 i:nth-child(2){transform:rotateY(90deg) translateZ(29px)}.die3 i:nth-child(3){transform:rotateY(180deg) translateZ(29px)}
.die3 i:nth-child(4){transform:rotateY(-90deg) translateZ(29px)}.die3 i:nth-child(5){transform:rotateX(90deg) translateZ(29px)}.die3 i:nth-child(6){transform:rotateX(-90deg) translateZ(29px)}
/* side panel */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.steps span{font-size:.8rem;padding:1px 8px;border:2px solid var(--ink);border-radius:10px;background:var(--paper)}
.steps span.on{background:#ffd43b;color:#2b2233}.steps span.done{opacity:.55}
#prompt .who{font:400 1.2rem var(--title)}
#prompt ol{margin:.3rem 0 .5rem;padding-left:1.3rem}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:.4rem 0}
.tip{background:#fff9db;color:#2b2233;border:2px dashed #f08c00;border-radius:10px;padding:6px 9px;font-size:.9rem;margin:.4rem 0}
.warn{color:var(--red)}
#log{max-height:320px;overflow:auto;padding-left:1.2rem;margin:0;font-size:.9rem}
#log li{margin:.1rem 0}
#log li b{font-weight:700}
.modal{position:fixed;inset:0;background:rgba(20,15,30,.55);display:grid;place-items:center;z-index:20;padding:16px}
.dlg{max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:16px 18px}
.dlg .opts{display:grid;gap:8px;margin-top:8px}
.dlg .opt{text-align:left;display:block;width:100%}
.dlg .opt small{display:block;color:var(--muted)}
.dlg .rec{background:#fff3bf;color:#2b2233}
.dlg .rec::after{content:" ← suggested";font-size:.8rem;color:#8a5a00}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn.on{background:#a5d8ff;color:#2b2233}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.banner{font:400 1.2rem var(--title);text-align:center;padding:4px;color:var(--red)}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:400 2.4rem var(--title);color:var(--red);text-shadow:3px 3px 0 #fff,-2px -2px 0 #fff;z-index:30;pointer-events:none;animation:pop 1.1s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,-30%) scale(.4) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);opacity:1}100%{transform:translate(-50%,-80%) scale(1) rotate(-3deg);opacity:0}}
.zgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.zoom .card{--w:260px;font-size:20px;margin:auto}.zoom .card .cx{max-height:none;font-size:1rem}.zoom .card .cn{font-size:1.2rem}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{order:-1}#log{max-height:160px}}
@media (max-width:700px){header h1{font-size:1.2rem}.felt{transform:none;grid-template-columns:1fr 1fr;}.felt .arena{grid-column:1/-1;grid-row:2}.pile{grid-auto-flow:row;justify-content:center}.pile .stack{width:70px;height:98px;font-size:.8rem}.card{--w:104px}.card.sm{--w:80px}.table{perspective:none}
  .zgrid{grid-template-columns:1fr}.zoom .card{--w:200px}
  .modal{align-items:end;padding:0}.dlg{max-height:86vh;border-radius:14px 14px 0 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Doorkick <span>Dungeon</span></h1>
  <button class="btn" data-a="snd" id="sndbtn" aria-label="Sound">🔊</button>
  <button class="btn" data-a="mus" id="musbtn" aria-label="Music">🎵 On</button>
  <button class="btn" data-a="speed" id="speedbtn" title="How fast the computer plays">⏩ normal</button>
  <button class="btn" data-a="pause" id="pausebtn" title="Pause the computer">⏸</button>
  <button class="btn" data-a="hints" id="hintbtn" title="Suggested moves">💡 On</button>
  <button class="btn" data-a="rules">Rules</button>
  <button class="btn" data-a="new">New game</button>
</header>
<div class="wrap">
  <main id="app"></main>
  <aside id="side" class="side"></aside>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>
<script>
// ---------- the card table: the 168-card base deck (94 door, 74 treasure). Names and texts are original; numbers and effects follow the real cards.
// ref = id of the real card in cards-base.json (the audit trail). Effects are data (ops) plus a few special keys (sp) the engine knows.
const TRAITNAME={human:'Human',elf:'Elf',dwarf:'Dwarf',halfling:'Halfling',warrior:'Warrior',wizard:'Wizard',thief:'Thief',cleric:'Cleric'};
const EXPS=[];
const M=(ref,n,lvl,tr,x,badt,bad,o)=>Object.assign({ref,d:'door',t:'monster',n,lvl,tr,lv:1,x,badt,bad},o||{});
const I=(ref,n,slot,b,g,x,o)=>Object.assign({ref,d:'tr',t:'item',n,slot:slot==='1h'||slot==='2h'||slot==='-'?null:slot,hands:slot==='1h'?1:slot==='2h'?2:0,b,g,x},o||{});
const O=(ref,n,b,g,x,o)=>Object.assign({ref,d:'tr',t:'oneshot',n,b,g,x},o||{});
const C=(ref,n,x,ops,o)=>Object.assign({ref,d:'door',t:'curse',n,x,ops},o||{});
const L=(ref,n,x,o)=>Object.assign({ref,d:'tr',t:'level',n,x:x||'Go up a level. Play on anyone, any time, but never to reach the winning level.'},o||{});
const CARDS=[
// ---- classes and races (generic fantasy archetypes keep their plain names) ----
{ref:'base-warrior',k:'warrior',d:'door',t:'class',cls:'warrior',n:'Warrior',art:'warrior',cp:3,x:'Berserk: in a fight, discard up to 3 cards, +1 each. You win ties.'},
{ref:'base-wizard',k:'wizard',d:'door',t:'class',cls:'wizard',n:'Wizard',art:'wizard',cp:3,x:'Flight: discard up to 3 cards, +1 each to run away. Charm: discard your whole hand to send one lone monster away and take its treasure (no level).'},
{ref:'base-thief',k:'thief',d:'door',t:'class',cls:'thief',n:'Thief',art:'thief',cp:3,x:'Backstab: discard a card to give a fighter -2 (once per victim per fight). Steal: discard a card to try for a small item: roll 4+, or lose a level.'},
{ref:'base-cleric',k:'cleric',d:'door',t:'class',cls:'cleric',n:'Cleric',art:'cleric',cp:3,x:'Resurrection: instead of kicking a new door, take the top door discard and discard a card. Turning: discard up to 3 cards against undead, +3 each.'},
{ref:'base-elf',k:'elf',d:'door',t:'race',race:'elf',n:'Elf',art:'elf',cp:3,x:'+1 to run away. Go up a level for each monster you help someone kill.'},
{ref:'base-dwarf',k:'dwarf',d:'door',t:'race',race:'dwarf',n:'Dwarf',art:'dwarf',cp:3,x:'Carry any number of Big items. Hold up to 6 cards.'},
{ref:'base-halfling',k:'halfling',d:'door',t:'race',race:'halfling',n:'Halfling',art:'half',cp:3,x:'-1 to run away. Once per turn, sell one item for double its price.'},
{ref:'base-half-breed',k:'mixed',d:'door',t:'special',sp:'half',n:'Mixed Heritage',cp:2,x:'You may have two races. With one race, you get its perks and none of its drawbacks.'},
{ref:'base-super-munchkin',k:'double',d:'door',t:'special',sp:'super',n:'Double Major',cp:2,x:'You may have two classes. With one class, you get its perks and none of its drawbacks.'},
// ---- monsters (37) ----
M('base-3-872-orcs','The Endless Goblin Horde',10,3,'+6 against Dwarves (it is a long story).','Roll a die: 1–2 and you are trampled to death, otherwise lose that many levels.',[['orcs']],{vs:[{race:'dwarf',b:6}],k:'horde'}),
M('base-amazon','Shieldmaiden Champion',8,2,'Never attacks a woman: a female fighter just gets 1 treasure from her.','Lose your class(es); with no class, lose 3 levels.',[['clsOr',3]],{sp:'amazon',k:'amazon'}),
M('base-bigfoot','Hairy Hat-Muncher',12,3,'+3 against Dwarves and Halflings.','Flattens you and eats your hat: lose the headgear you wear.',[['item','headW']],{vs:[{race:'dwarf',b:3},{race:'halfling',b:3}],k:'hatmuncher'}),
M('base-bullrog','Horned Inferno',18,5,'Won’t chase anyone of level 4 or lower.','You are toasted to a crisp. Dead.',[['death']],{lv:2,nop:4,k:'inferno'}),
M('base-crabs','Pinch Mites',1,1,'You can’t run away from them.','Lose your armor and everything worn below the waist.',[['item','armor','all'],['item','below','all']],{sp:'noescape',k:'mites'}),
M('base-drooling-slime','Sock Slurper',1,1,'+4 against Elves.','Lose the footgear you wear; with none, lose a level.',[['itemOr','footW',1]],{vs:[{race:'elf',b:4}],k:'slurper'}),
M('base-face-sucker','Kissy Leech',8,2,'+6 against Elves.','It kisses your face off, hat and all: lose all headgear and a level.',[['item','head','all'],['lvl',1]],{vs:[{race:'elf',b:6}],k:'leech'}),
M('base-floating-nose','Hovering Sniffer',10,3,'Bribe it with an item worth 200 gold or more to make it leave. A garlic gargle kills it outright.','You can’t escape it, nothing helps: lose 3 levels.',[['lvl',3]],{sp:'nose',k:'sniffer'}),
M('base-flying-frogs','Kamikaze Toads',2,1,'-1 to run away.','They bite: lose 2 levels.',[['lvl',2]],{runm:-1,k:'toads'}),
M('base-gazebo','Menacing Pergola',8,2,'Nobody can help you against it.','Lose 3 levels.',[['lvl',3]],{sp:'nohelp',k:'pergola'}),
M('base-gelatinous-octahedron','Jiggling Pyramid',2,1,'+1 to run away.','Drop all your Big items.',[['item','big','all']],{runm:1,k:'pyramid'}),
M('base-ghoulfiends','Grave Gnawers',8,2,'No items or bonuses count against them: fight with your level alone.','Your level drops to the lowest level at the table.',[['lowest']],{sp:'lvlonly',k:'gnawers'}),
M('base-harpies','Off-Key Sirens',4,2,'+5 against Wizards.','Their singing is awful: lose 2 levels.',[['lvl',2]],{vs:[{cls:'wizard',b:5}],k:'sirens'}),
M('base-hippogriff','Stampeding Skygrif',16,4,'Won’t chase anyone of level 3 or lower.','You drop things as you flee: each other player takes one treasure card from your table or hand.',[['hippo']],{lv:2,nop:3,k:'skygrif'}),
M('base-insurance-salesman','Timeshare Pitchman',14,4,'Your level doesn’t count: fight him with bonuses only.','You sign up: lose 1,000 gold worth of items, or all of them.',[['gold',1000]],{sp:'bonusonly',k:'pitchman'}),
M('base-king-tut','Pharaoh Wrappington',16,4,'Undead. Won’t chase level 3 or lower; anyone higher who flees loses 2 levels even when they get away.','Lose all your items and your whole hand.',[['item','any','all'],['hand','all']],{lv:2,nop:3,undead:true,sp:'escape2',k:'pharaoh'}),
M('base-lame-goblin','Limping Imp',1,1,'+1 to run away.','A whack with its crutch: lose a level.',[['lvl',1]],{runm:1,k:'imp'}),
M('base-large-angry-chicken','Furious Rooster',2,1,'Beat it with fire or flame and gain an extra level.','Painful pecking: lose a level.',[['lvl',1]],{sp:'fire',k:'rooster'}),
M('base-lawyers','Litigation Lizards',6,2,'Never attack a Thief (professional courtesy): a Thief may instead swap 2 treasures in hand for 2 new ones.','An injunction: starting on your left, each player draws a card from your hand; discard the rest.',[['lawyer']],{sp:'lawyer',k:'lizards'}),
M('base-leperchaun','Pickpocket Pixie',4,2,'+5 against Elves.','Takes 2 of your items: the players on either side each pick one.',[['pixie']],{vs:[{race:'elf',b:5}],k:'pixie'}),
M('base-maul-rat','Hellmouse',1,1,'+3 against Clerics.','A nasty nip: lose a level.',[['lvl',1]],{vs:[{cls:'cleric',b:3}],k:'hellmouse'}),
M('base-mr-bones','Rattlebones',2,1,'Undead. If you flee, lose a level even if you get away.','A bony touch: lose 2 levels.',[['lvl',2]],{undead:true,sp:'escape1',k:'rattle'}),
M('base-net-troll','Forum Troll',10,3,'No special powers, and very upset about it.','The highest-level player(s) each take one item from you.',[['troll']],{k:'troll'}),

<script>
// the in-game rules, written in our own words
const RULES_HTML=`
<p><b>Goal.</b> Be the first hero to reach <b>level 10</b>. You can only gain that last level by killing a monster (a few special cards are exceptions).</p>
<p><b>Start.</b> Everyone is a level 1 human with no class and gets 4 door cards and 4 treasure cards. Before the first turn you may play any races, classes and items from your hand.</p>
<h3>Your turn</h3>
<ol>
<li><b>Get ready.</b> Play races, classes and items, change what you wear, and sell items worth 1,000 gold for one level. You can't sell your way to level 10.</li>
<li><b>Kick open the door.</b> Turn over the top door card.
 <ul><li>A <b>monster</b>: you must fight it.</li><li>A <b>curse</b>: it hits you at once.</li><li>Anything else goes into your hand.</li></ul></li>
<li><b>If you didn't fight a monster:</b> either <b>look for trouble</b> (fight a monster from your own hand) or <b>loot the room</b> (draw a door card face down).</li>
<li><b>Charity.</b> If you hold more than 5 cards (6 for dwarves), give the extras to the lowest-level player. If that's you, discard them.</li>
</ol>
<h3>Fighting</h3>
<ul>
<li>Your <b>combat strength</b> is your level plus the bonuses of the items you wear. The monster's strength is its level plus any boosts.</li>
<li>You win if your strength is <b>higher</b>. Ties go to the monster, unless you are a warrior.</li>
<li>Anyone can join in: <b>one-shot</b> items (potions and so on) add to either side, and <b>monster boosts</b> make a monster tougher or weaker. <b>Wandering monsters</b> add another monster to the fight.</li>
<li>You may <b>ask one player for help</b> and promise them some of the treasure. Their strength adds to yours. You gain the levels; they get what you promised.</li>
<li><b>Winning:</b> gain a level per monster (some big monsters give 2) and draw the treasures shown.</li>
<li><b>Running away:</b> roll a die for each monster. On 5 or 6 you get away. Otherwise that monster's <b>Bad Stuff</b> happens to you. A helper has to run too.</li>
<li><b>Death:</b> you keep your level, race and class, but lose everything else. Starting with the highest level, the other players each take one card from your body. On your next turn you come back with 4 new cards from each deck.</li>
</ul>
<h3>Items</h3>
<ul>
<li>You can wear 1 headgear, 1 armor and 1 footgear, plus items for your 2 hands.</li>
<li>You can have only 1 <b>Big</b> item at a time (dwarves can have any number).</li>
<li>Items you can't use are carried and give no bonus.</li>
<li>You can only change what you wear on your own turn, outside a fight.</li>
</ul>
<h3>Races and classes</h3>
<ul>
<li><b>Elf:</b> +1 to run away, and +1 level for each monster you help kill.</li>
<li><b>Dwarf:</b> any number of Big items, and a 6-card hand.</li>
<li><b>Halfling:</b> sell one item a turn for double. If you fail to run away, discard a card to roll again.</li>
<li><b>Warrior:</b> win ties. Discard up to 3 cards in a fight for +1 each.</li>
<li><b>Wizard:</b> discard up to 3 cards for +1 each to run away. Discard your whole hand (3+ cards) to charm a single monster away and keep its treasure.</li>
<li><b>Thief:</b> discard a card to give a player in a fight −2 (once per victim per fight). Discard a card to try to steal a small item: roll 4+ or lose a level.</li>
<li><b>Cleric:</b> discard up to 3 cards for +3 each against undead.</li>
</ul>
<p class="small muted">A half-blood card lets you have two races, and a double-class card two classes. Curses can be played on anyone: here that's on your turn, during fights, or when someone else's turn starts. Names, card texts and art in this game are original. The rules follow the real card game.</p>`;

</script>
<script>
// ---------- doodle art: every picture is generated as felt-tip SVG from a seed (no image files) ----------
const INK='#2b2233';
const FELT=['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#38d9a9','#4dabf7','#9775fa','#f783ac','#a9e34b','#63e6be','#ff8787','#74c0fc'];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function prng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,t|1);r^=r+Math.imul(r^r>>>7,r|61);return((r^r>>>14)>>>0)/4294967296}}
const f1=n=>Math.round(n*10)/10;
// a wobbly closed blob through n points around (cx,cy)
function blob(r,cx,cy,rad,n,wob,sy){const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const rr=rad*(1-wob/2+r()*wob);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*(sy||1)])}
  let d=`M${f1((pts[0][0]+pts[1][0])/2)},${f1((pts[0][1]+pts[1][1])/2)}`;for(let i=1;i<=n;i++){const p=pts[i%n],q=pts[(i+1)%n];d+=` Q${f1(p[0])},${f1(p[1])} ${f1((p[0]+q[0])/2)},${f1((p[1]+q[1])/2)}`}return d+'Z'}
// jittered line (felt-tip wobble)
function wl(r,x1,y1,x2,y2,j){const mx=(x1+x2)/2+(r()-.5)*j,my=(y1+y2)/2+(r()-.5)*j;return `M${f1(x1)},${f1(y1)} Q${f1(mx)},${f1(my)} ${f1(x2)},${f1(y2)}`}
const st=(w)=>`fill="none" stroke="${INK}" stroke-width="${w||3}" stroke-linecap="round" stroke-linejoin="round"`;
// felt fill: the colour is printed slightly off the ink line, like a colouring book
function felt(d,col,r){const dx=f1((r()-.5)*5),dy=f1((r()-.5)*5);return `<path d="${d}" fill="${col}" opacity=".9" transform="translate(${dx},${dy})"/><path d="${d}" ${st(3.2)}/>`}

  const nt=Math.min(7,2+Math.floor(lvl/3));for(let i=0;i<nt;i++){const tx=-mw+4+i*((2*mw-8)/Math.max(1,nt-1));o+=`<path d="M${f1(tx-3)},${f1(my+1)} l3,6 l3,-6Z" fill="#fff" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`}

// items by slot
function itemArt(key,slot){const r=prng(hash('i'+key));const col=FELT[Math.floor(r()*FELT.length)];let o='';
  switch(slot){

  default:o=felt(blob(r,0,0,30,6,.3),col,r)+`<text x="0" y="12" text-anchor="middle" font-size="34" font-family="var(--hand)" fill="${INK}">?</text>`}

// curse: a storm cloud with a spiral; race/class: a face with ears/hat
function curseArt(key){const r=prng(hash('c'+key));return felt(blob(r,0,-10,34,9,.35,.6),'#adb5bd',r)+`<path d="M-8,-12 q8,-10 14,0 q4,10 -8,10 q-8,-2 -4,-8" ${st(2.5)}/>`+`<path d="M-10,18 L-18,36 L-8,32 L-14,50" ${st(3)} stroke="#f59f00"/><path d="M14,18 L8,32 L18,30 L12,46" ${st(3)} stroke="#f59f00"/>`}
function heroArt(key,kind){const r=prng(hash('h'+key));const skin=['#ffe0c2','#f1c27d','#c68642','#8d5524','#e0ac69'][Math.floor(r()*5)];let o='';

  if(kind==='dwarf')o+=felt(`M-24,4 Q-26,44 0,50 Q26,44 24,4 Q12,14 0,12 Q-12,14 -24,4Z`,'#e8590c',r);

function cardArt(def,key){const t=def.t;
  if(t==='monster')return monsterArt(key,def.lvl||1);

<script>
// ---------- Doorkick Dungeon engine: all rules live here. State is G (plain JSON); every move goes through gameAct(ds, seat). ----------
// Rule ids [R..]/[H..] refer to rules-notes.md.

// ---- random ----
function rnd(n){let t=(G.rng+=0x6D2B79F5);t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return Math.floor(((t^t>>>14)>>>0)/4294967296*n)}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const d6=()=>1+rnd(6);

const D=k=>DEF[k];

const cname=id=>cd(id).n;
const tagged=(id,t)=>(cd(id).tags||[]).includes(t);
function lg(s,t){G.log.unshift({s,t});if(G.log.length>R.CAP)G.log.length=R.CAP}
function fx(t,x){UI.fx.push({t,x,at:Date.now()+Math.random()});if(UI.fx.length>30)UI.fx.shift()}
function drawOne(deck){const k=deck==='door'?'door':'tr',dk=deck==='door'?'dd':'td';if(!G[k].length){if(!G[dk].length)return null;G[k]=shuffle(G[dk]);G[dk]=[];lg(-1,`The ${deck==='door'?'door':'treasure'} discards are shuffled into a new deck.`)}return G[k].pop()}
function discard(id){if(id==null)return;const c=cd(id);(c.d==='door'?G.dd:G.td).push(id)}
// a card arriving in a hand; some cards act the moment you get them [R: Hoard!, Divine Intervention]
function gain(p,id){if(id==null)return;const c=cd(id);
  if(c.sp==='hoard'){lg(p.i,`${p.nm} finds ${c.n} and draws 3 more treasures!`);discard(id);for(let i=0;i<3;i++)gain(p,drawOne('treasure'));return}
  if(c.sp==='divine'){discard(id);lg(p.i,`${p.nm} reveals ${c.n}: every Cleric goes up a level!`);for(const o of alive())if(isCls(o,'cleric'))gainLv(o,1,c.n,true);return}

function drawTo(p,deck,n){for(let i=0;i<n;i++){const id=drawOne(deck);if(id==null)break;gain(p,id)}}
// ---- player helpers ----
const P=i=>G.pl[i];

function races(p){const r=p.race.map(id=>cd(id).race);return r.length?r:['human']}
function classes(p){return p.cls.map(id=>cd(id).cls)}
const isRace=(p,r)=>races(p).includes(r);

const has=(p,f)=>isRace(p,f)||isCls(p,f);
// Mixed Heritage / Double Major with a single card: all perks, no drawbacks [R §9]
const pureRace=p=>p.half!=null&&p.race.length===1, pureCls=p=>p.sup!=null&&p.cls.length===1;
function fixDual(p){if(!p.race.length&&p.half!=null){discard(p.half);p.half=null}if(!p.cls.length&&p.sup!=null){discard(p.sup);p.sup=null}}
function handLimit(p){return isRace(p,'dwarf')?R.DWARF_HAND:R.HAND}
function eqItems(p){return p.eq.filter(e=>e.on).map(e=>e.id)}
function itemBonus(p,cb){let b=0;const mirror=p.curse.some(id=>cd(id).pers&&cd(id).pers.noweap);
  for(const e of p.eq){if(!e.on)continue;const c=cd(e.id);if(mirror&&cb&&c.hands)continue;b+=(c.elfb&&isRace(p,'elf'))?c.elfb:(c.b||0)}return b}
function persMod(p,k){let b=0;for(const id of p.curse){const c=cd(id);if(c.pers&&c.pers[k])b+=c.pers[k]}if(k==='str'&&p.sexPen)b-=5;return b}

const highestLvl=()=>Math.max(...alive().map(o=>o.lvl));
// ---- equipment rules [R §8] ----
const SLOTS=['head','armor','foot'];
function reqOK(p,c,e){if(e&&e.cheat!=null)return true;const q=c.req;if(!q)return true;

// why p can't wear item id now (null = it can); ignore = an item to leave out of the check
function equipWhy(p,id,ignore){const c=cd(id);if(c.t!=='item')return 'not an item';const e=p.eq.find(x=>x.id===id);if(!reqOK(p,c,e))return 'your race, class or sex can’t use it';

  return null}
function bigCap(p){return isRace(p,'dwarf')?99:1+(p.hire!=null?1:0)}
function bigCount(p,ex){return p.eq.filter(e=>e.id!==ex&&cd(e.id).big&&e.cheat==null).length}

// ---- setup ----
function newGame(mode,n){n=n||DEFN;const seed=DEFSEED!=null?DEFSEED:Math.floor(Math.random()*2**31);
  const ids=[];const C={};let k=0;for(const def of CARDS){if(def.x3&&!DEFEX[def.x3])continue;for(let c=0;c<(def.cp||1);c++){C[k]=def.k;ids.push(k++)}}

  for(const id of ids)(D(C[id]).d==='door'?G.door:G.tr).push(id);shuffle(G.door);shuffle(G.tr);
  const names=UI.names||HERO_NAMES;

    G.pl.push({i,nm:names[i]||('Hero '+(i+1)),sex:(UI.sexes&&UI.sexes[i])||(i%2?'f':'m'),lvl:1,hand:[],eq:[],race:[],cls:[],curse:[],half:null,sup:null,hire:null,human,lv:(LVMIX&&LVMIX[i])||UI.lvl||'normal',gone:false,dead:false,fresh:false,soldT:false,halfT:false,sexPen:false,st:{kills:0,helps:0,deaths:0,runs:0,cursed:0,levels:0}})}
  lg(-1,'A new dungeon opens. Everyone draws 4 door and 4 treasure cards.');
  for(const p of G.pl){drawTo(p,'door',R.START);drawTo(p,'treasure',R.START)}

  let best=-1,who=[];for(const p of G.pl){const r=d6();if(r>best){best=r;who=[p.i]}else if(r===best)who.push(p.i)}G.active=who[rnd(who.length)];
  lg(-1,`${P(G.active).nm} rolls highest and goes first.`);

  UI.info=false;UI.menu=null;UI.fx=[];UI.sell=null;refresh()}
const HERO_NAMES=['Pip','Morwen','Grub','Tansy','Bodkin','Wrenna'];
// ---- levels and victory [R §12] ----
function gainLv(p,n,why,canWin){if(n<=0||p.dead)return 0;const cap=canWin?R.WIN:R.WIN-1;const before=p.lvl;p.lvl=Math.max(before,Math.min(cap,p.lvl+n));const got=p.lvl-before;if(got>0){p.st.levels+=got;fx('lvl',p.i)}
  if(got<n&&!canWin&&p.lvl===R.WIN-1)lg(p.i,`${p.nm} stays at level ${R.WIN-1}: the last level only comes from killing a monster.`);
  if(p.lvl>=R.WIN&&!G.winner){G.winner='P'+(p.i+1);G.winText=`${p.nm} reaches level ${R.WIN} by ${why}!`;lg(p.i,G.winText);fx('win',p.i)}return got}
function loseLv(p,n){const b=p.lvl;p.lvl=Math.max(1,p.lvl-n);return b-p.lvl}
// ---- choices: anything a player must decide mid-effect becomes G.q (humans answer through validMoves, the AI through aiPick) ----
function choose(who,why,opts,cont,text){if(!opts.length){resume(cont,null);return}
  if(!P(who).human){resume(cont,aiPick(P(who),why,opts,cont));return}

function resume(cont,v){const h=CONT[cont.k];if(!h){console.error('no continuation '+cont.k);return}h(cont,v);if(!G.q)runOps()}
// the op queue: Bad Stuff and curses are lists of ops applied in order; a choice pauses the queue
function queue(p,ops,src,front){const it=ops.map(op=>({p:p.i,op,src}));if(front)G.ops.unshift(...it);else G.ops.push(...it)}

  if(!G.q&&!G.ops.length&&G.then){const t=G.then;G.then=null;THEN[t]()}}

function itemPool(p,what){let es=p.eq.slice();

function itemWorth(p,id){const c=cd(id);const e=p.eq.find(x=>x.id===id);return (e&&e.on?(c.b||0)*3:0)+(c.run||0)*2+(c.g||0)/400}

function playCard(p,id,tgt,opt){const c=cd(id);const cb=G.cb;const s=p.i;

function playOneShot(p,id,c,tgt){const cb=G.cb;const s=p.i;

<script>
// ---------- computer players: rule-based Normal; Easy adds mistakes; Hard keeps a safety margin, plays the leader harder and saves its tricks ----------
// The AI reads only public information about other seats (levels, tables, hand sizes), never their hands or the decks.
function threat(o){return o.lvl*10+pStr(o)}
function leader(ex){return alive().filter(o=>o.i!==ex).sort((a,b)=>threat(b)-threat(a))[0]}
function cardValue(p,id){const c=cd(id);switch(c.t){
  case 'item':return (c.b||0)*3+(c.run||0)*2+(c.g||0)/300+(reqOK(p,c)?2:-3)+(c.sp?2:0);
  case 'oneshot':return (c.b||0)*2+(c.sp?5:0)+(c.g||0)/400;
  case 'level':return 9;case 'curse':return 4;case 'monster':return 2+(c.lvl<pStr(p)?3:0);case 'enh':return 3+(c.b>0?1:0);
  case 'race':case 'class':return 5;default:return 4}}
function aiLootPick(o,loot){return loot.slice().sort((a,b)=>cardValue(o,b)-cardValue(o,a))[0]}
function aiWantsWard(p,c){const heavy=(c.ops||[]).some(o=>['lvl','death','item','pick','clsOr1','race','cls','swap','tax','pers','sex'].includes(o[0]));return heavy&&(p.lvl>=3||p.eq.length>0)}
function aiLawyerSwap(f){return true}
function aiGlue(o,r){const w=P(r.w);const c=mdef(runMon(r));const nasty=(c.bad||[]).some(x=>x[0]==='death'||(x[0]==='lvl'&&(x[1]==='all'||x[1]>=2)));return (threat(w)>=threat(o)||w.lvl>=8)&&nasty}
// a choice the rules hand to this seat
function aiPick(p,why,opts,cont){const worth=id=>id==='hand'?3:itemWorth(p,id)+cardValue(p,id)/3;
  switch(why){
  case 'lose':case 'taxpay':case 'slug':return opts.slice().sort((a,b)=>worth(a)-worth(b))[0];
  case 'trait':return opts.slice().sort((a,b)=>cardValue(p,a)-cardValue(p,b))[0];
  case 'handOr':return p.hand.length<=2||(p.lvl<=2)?'hand':(p.hand.reduce((a,id)=>a+cardValue(p,id),0)>14?'lvl':'hand');
  case 'take':case 'loot':case 'dowse':return opts.slice().sort((a,b)=>(b==='hand'?3:cardValue(p,b))-(a==='hand'?3:cardValue(p,a)))[0];
  }return opts[0]}
function aiWantsWindow(o){const cur=curPl();if(!cur||cur===o)return false;const vm=playsFor(o.i).filter(m=>{const c=cd(m.card);return c.t==='curse'||c.t==='level'||c.sp==='steal'||c.sp==='hire'});
  return !!aiWindowPick(o,vm)}
function aiWindowPick(p,vm){const cur=curPl();
  const lv=vm.find(m=>cd(m.card).t==='level'&&m.tgt===p.i);if(lv)return lv;

<script>

function cardMoves(me,id){return myMoves(me).filter(m=>m.card===id)}
function moveLabel(m){const c=m.card!=null?cd(m.card):null;switch(m.act){
  case 'play':if(c.t==='level')return m.tgt===viewSeat()?'Go up a level':`Give ${esc(P(m.tgt).nm)} a level`;if(c.sp==='steal')return `Steal a level from ${esc(P(m.tgt).nm)}`;if(c.sp==='illusion')return `Swap ${esc(mdef(G.cb.mons[m.tgt]).n)} for ${esc(cname(m.opt))}`;if(c.sp==='borrow')return `Take ${esc(cname(m.opt))} from ${esc(P(m.tgt).nm)}`;if(c.sp==='transfer')return `Make ${esc(P(m.tgt).nm)} fight instead`;if(c.sp==='garlic'&&typeof m.tgt==='number')return 'Kill the Hovering Sniffer outright';if(c.sp==='mate')return `Give ${esc(mdef(G.cb.mons[m.tgt]).n)} a date`;
    if(c.t==='curse')return `Curse ${esc(P(m.tgt).nm)}${m.tgt===viewSeat()?' (yourself!)':''}`;if(c.t==='enh')return `Boost ${esc(mdef(G.cb.mons[m.tgt]).n)} (${c.b>0?'+':''}${c.b})`;if(c.sp==='wander')return `Send in ${esc(cname(m.tgt))} as a wandering monster`;if(c.sp==='cheat')return `Cheat: wear ${esc(cname(m.tgt))} against the rules`;
    if(m.tgt==='p')return `Use for the heroes (+${c.b||0})`;if(m.tgt==='m')return `Use for the monsters (+${c.b||0})`;if(typeof m.tgt==='number'&&G.cb&&G.cb.mons[m.tgt])return `Use on ${esc(mdef(G.cb.mons[m.tgt]).n)}`;
    if(c.t==='item')return equipWhy(P(viewSeat()),m.card)||bigWhy(P(viewSeat()),m.card)?'Put into play (carried)':'Put on';if(c.t==='race'||c.t==='class')return 'Become '+esc(c.n);if(c.t==='level')return 'Go up a level';return 'Play';
  case 'equip':return 'Wear it';case 'unequip':return 'Take it off (carry)';case 'sell':return 'Sell';case 'trouble':return `Look for trouble: fight it (level ${c.lvl})`;
  case 'give':return `Give to ${esc(P(m.tgt).nm)}`;case 'toss':return 'Discard';case 'berserk':return 'Berserk: discard for +1';case 'turn':return 'Turn undead: discard for +3';case 'flight':return 'Flight spell: discard for +1 to run';
  case 'backstab':return `Backstab ${esc(P(m.tgt).nm)}: discard for -2`;case 'steal':return `Steal it from ${esc(P(m.tgt).nm)} (discard a card, roll 4+)`;
  case 'drop':return c.t==='race'||c.t==='class'?'Discard this '+(c.t==='race'?'race':'class'):'Let the Porter go';case 'resurrect':return 'Discard this and take the top door discard instead of kicking';case 'join':return 'Add it to the fight (undead join undead)';
  case 'skip':return `Walk past ${esc(mdef(G.cb.mons[m.tgt]).n)}`;case 'shoo':return `Shoo off ${esc(mdef(G.cb.mons[m.tgt]).n)} (Cleric)`;case 'charm':return `✨ Charm ${esc(mdef(G.cb.mons[m.tgt]).n)} (discard your whole hand)`;case 'bribe':return `Bribe the Sniffer with ${esc(c.n)}`;case 'use':return 'Use '+esc(c.n);
  default:return m.act}}
function menuHTML(me){const u=UI.menu;if(u.ask){const cb=G.cb;const opts=validMoves(me).filter(m=>m.act==='ask');const who=[...new Set(opts.map(m=>m.tgt))];
    return `<div class="dlg paper"><h2>Ask for help</h2><p>Pick a helper and how many of the ${cbTreasure(cb)} treasures you offer. They add their strength (${who.map(i=>esc(P(i).nm)+' '+pStr(P(i))).join(', ')}).</p><div class="opts">${who.map(i=>`<div><b>${esc(P(i).nm)}</b> (strength ${pStr(P(i))}${pStr(P(i))+sideStr(cb)>monStr(cb)?', enough to win':''}) <div class="acts">${opts.filter(m=>m.tgt===i).map(m=>`<button class="btn" data-mv='${esc(JSON.stringify(m))}'>offer ${m.opt}</button>`).join('')}</div></div>`).join('')}</div><div class="acts"><button class="btn" data-a="close">Cancel</button></div></div>`}
  const id=u.card;const ms=cardMoves(me,id);const c=cd(id);const sug=UI.hints?aiSuggest(me):null;
  return `<div class="dlg paper zoom"><div class="zgrid">${cardHTML(id)}<div><h2>${esc(c.n)}</h2><p>${esc(c.x||'')}</p>${c.t==='monster'?`<p class="small">Level ${c.lvl} · ${c.tr} treasure${c.tr===1?'':'s'}${(c.lv||1)>1?` · ${c.lv} levels`:''}<br>Bad Stuff: ${esc(c.badt||'lose a level')}</p>`:''}${c.t==='item'?`<p class="small">${kindLabel(c)} · +${c.b||0} · ${c.g||0} gold${c.req?` · ${[].concat(c.req).map(r=>r[0]==='!'?'not '+(TRAITNAME[r.slice(1)]||r.slice(1)):(TRAITNAME[r]||r)+' only').join(', ')}`:''}</p>`:''}
    <div class="opts">${ms.map(m=>`<button class="btn opt ${sug&&mvKey(sug)===mvKey(m)?'rec':''}" data-mv='${esc(JSON.stringify(m))}'>${moveLabel(m)}</button>`).join('')||'<p class="small muted">You can\'t use this card right now.</p>'}</div>
    <div class="acts"><button class="btn" data-a="close">Close</button></div></div></div></div>`}
function zoomHTML(){const id=UI.zoom;const c=cd(id);return `<div class="dlg paper zoom"><div class="zgrid">${cardHTML(id)}<div><h2>${esc(c.n)}</h2><p>${esc(c.x||'')}</p>${c.badt?`<p>Bad Stuff: ${esc(c.badt)}</p>`:''}<div class="acts"><button class="btn" data-a="close">Close</button></div></div></div></div>`}
function passHTML(s){return `<div class="dlg paper" style="text-align:center"><h2>Pass the device to ${esc(P(s).nm)}</h2><p>Everyone else, look away: ${esc(P(s).nm)}'s hand is secret.</p><button class="btn primary" data-a="iam">I'm ${esc(P(s).nm)}: show my cards</button></div>`}
function endHTML(){const ps=G.pl.slice().sort((a,b)=>b.lvl-a.lvl);return `<div class="dlg paper"><h2>🏆 ${esc(G.winText)}</h2><table style="width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums"><tr><th align="left">Hero</th><th>Level</th><th>Kills</th><th>Helps</th><th>Deaths</th><th>Cursed</th></tr>${ps.map(p=>`<tr style="${'P'+(p.i+1)===G.winner?'background:#fff3bf;color:#2b2233':''}"><td>${esc(p.nm)}</td><td align="center">${p.lvl}</td><td align="center">${p.st.kills}</td><td align="center">${p.st.helps}</td><td align="center">${p.st.deaths}</td><td align="center">${p.st.cursed}</td></tr>`).join('')}</table><div class="acts"><button class="btn primary" data-a="new">Play again</button></div></div>`}
function startHTML(){const n=UI.n||DEFN;let saved=null;try{saved=localStorage.getItem(SAVE)}catch(e){}
  return `<div class="dlg paper start"><h2 style="font-size:2rem">Doorkick <span style="color:var(--red)">Dungeon</span></h2><p>Kick open doors, fight monsters, grab the loot and stab your friends in the back. First hero to <b>level 10</b> wins, and the last level only comes from killing a monster.</p>
   <h3>Who plays?</h3><div class="seg">${[['F','Me vs computer'],['hot','Friends on one device'],['ai','Watch the computer']].map(([k,l])=>`<button class="btn ${ (UI.mode||'F')===k?'on':''}" data-set="mode" data-v="${k}">${l}</button>`).join('')}</div>
   <h3>Heroes at the table</h3><div class="seg">${[3,4,5,6].map(k=>`<button class="btn ${n===k?'on':''}" data-set="n" data-v="${k}">${k}</button>`).join('')}</div>
   <h3>Computer skill</h3><div class="seg">${['easy','normal','hard'].map(k=>`<button class="btn ${(UI.lvl||'normal')===k?'on':''}" data-set="lvl" data-v="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
   <h3>Expansions</h3><div class="grid2">${EXPS.map(e=>`<button class="btn ${DEFEX[e.k]?'on':''}" data-set="ex" data-v="${e.k}" title="${esc(e.d)}"><b>${esc(e.n)}</b><br><span class="small">${esc(e.d)}</span></button>`).join('')||'<span class="small muted">The base game.</span>'}</div>
   <div class="acts" style="margin-top:12px"><button class="btn primary pulse" data-start="${UI.mode||'F'}">Start</button>${saved?'<button class="btn" data-a="load">Continue saved game</button>':''}<button class="btn" data-a="rules">How to play</button></div></div>`}
function rulesHTML(){return `<div class="dlg paper"><h2>How to play</h2>${RULES_HTML}<div class="acts"><button class="btn" data-a="close">Close</button></div></div>`}
// ---- input ----
function uiAct(m){const me=viewSeat();const s=m.seat!=null?m.seat:me;UI.menu=null;if(m.act==='sell')UI.sell=null;const ok=gameAct(m,s);if(!ok)render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-mv],[data-a],[data-card],[data-start],[data-set],[data-opp]');if(!t)return;
  if(t.dataset.mv){uiAct(JSON.parse(t.dataset.mv));return}
  const a=t.dataset.a;
  if(a==='close'){UI.menu=null;UI.zoom=null;UI.rules=false;render();return}
  if(a==='askmenu'){UI.menu={ask:true};render();return}
  if(a==='sellmode'){UI.sell=[];render();return}
  if(a==='sellx'){UI.sell=null;render();return}
  if(a==='iam'){UI.lastSeat=UI.pass;UI.pass=null;render();return}
  if(a==='rules'){UI.rules=true;if(!G){$('#modal').innerHTML=rulesHTML();return}render();return}
  if(a==='new'){G=null;UI.info=true;render();return}
  if(a==='load'){try{G=JSON.parse(localStorage.getItem(SAVE));UI.pass=null;UI.lastSeat=-1;refresh()}catch(e){G=null;render()}return}
  if(a==='pause'){UI.pause=!UI.pause;$('#pausebtn').textContent=UI.pause?'▶':'⏸';if(!UI.pause)schedule();return}
  if(a==='speed'){UI.speed=UI.speed>=2?0.5:UI.speed*2;try{localStorage.setItem('dkd_speed',UI.speed)}catch(e){};$('#speedbtn').textContent='⏩ '+(UI.speed<1?'slow':UI.speed>1?'fast':'normal');return}
  if(a==='hints'){UI.hints=!UI.hints;try{localStorage.setItem('dkd_hints',UI.hints?'1':'0')}catch(e){};$('#hintbtn').textContent='💡 '+(UI.hints?'On':'Off');render();return}
  if(a==='snd'&&typeof toggleSound==='function'){toggleSound();return}
  if(a==='mus'&&typeof toggleMusic==='function'){toggleMusic();return}
  if(t.dataset.set){const k=t.dataset.set,v=t.dataset.v;if(k==='n')UI.n=+v;else if(k==='mode')UI.mode=v;else if(k==='lvl')UI.lvl=v;else if(k==='ex'){DEFEX[v]=!DEFEX[v];try{localStorage.setItem('dkd_ex',JSON.stringify(DEFEX))}catch(e){}}render();return}
  if(t.dataset.start){UI.pass=null;UI.lastSeat=-1;newGame(t.dataset.start,UI.n||DEFN);return}
  if(t.dataset.card!==undefined&&G){const id=+t.dataset.card;const me=viewSeat();
    if(t.closest('.dlg')){return}
    if(UI.sell){if(me>=0&&sellable(P(me)).includes(id)){const i=UI.sell.indexOf(id);if(i>=0)UI.sell.splice(i,1);else UI.sell.push(id);render()}return}
    const ms=cardMoves(me,id);
    if(ms.length===1&&['give','toss','equip','unequip'].includes(ms[0].act)){uiAct(ms[0]);return}
    if(ms.length){UI.menu={card:id};render();return}UI.zoom=id;render();return}
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Escape'){UI.menu=null;UI.zoom=null;UI.rules=false;if(G)render();return}
  if(!G||G.winner)return;const me=viewSeat();if(sideToAct()!==me)return;const vm=validMoves(me);const f=a=>vm.find(m=>m.act===a);
  const k=e.key.toLowerCase();const m=k==='k'?f('kick'):k==='l'?f('loot'):k==='e'?f('end'):k==='f'?f('fight'):k==='r'?f('run'):k===' '||k==='enter'?(f('kick')||f('fight')||f('pass')||f('end')||f('ready')||f('loot')):null;
  if(m&&!UI.menu&&UI.pass==null){e.preventDefault();uiAct(m)}});
function humanTurn(){if(!G||G.winner)return false;const s=sideToAct();return s>=0&&P(s).human}
try{const ex=JSON.parse(localStorage.getItem('dkd_ex')||'null');if(ex)Object.assign(DEFEX,ex)}catch(e){}
render();

</script>
</body>
</html>
