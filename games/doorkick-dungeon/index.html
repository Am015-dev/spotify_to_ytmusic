/* ===== Board-first shell (shared by every game on the shelf) =====
   The page never scrolls. The board fills what the bar and the dock leave; the dock is in flow (never over the board);
   everything else opens in a closable popup (drawer). Games theme it with the --gx-* variables. */
:root{--gx-bar-h:48px;--gx-dock-w:clamp(300px,30vw,420px);--gx-bg:#10151c;--gx-bar:#0b1016;--gx-panel:#f4ecd8;--gx-ink:#231a10;--gx-line:rgba(0,0,0,.25);--gx-accent:#e0a948;--gx-shadow:0 20px 60px rgba(0,0,0,.5);--gx-radius:14px}
html.gx,html.gx body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
.gx-app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--gx-bg)}
.gx-bar{min-height:var(--gx-bar-h);display:flex;align-items:center;gap:6px;padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px));overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;z-index:6}
.gx-bar::-webkit-scrollbar{display:none}
.gx-bar .gx-sp{flex:1 0 8px}
.gx-main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--gx-dock-w);position:relative}
.gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr) 0}
.gx-board{position:relative;min-width:0;min-height:0;overflow:hidden}
.gx-dock{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.gx-dock-head{display:flex;align-items:center;gap:6px;padding:6px 8px 4px;flex:0 0 auto}
.gx-dock-head .gx-dt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-dock-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gx-app.gx-dock-min .gx-dock{visibility:hidden}

.gx-ibtn{appearance:none;border:1px solid var(--gx-line);background:rgba(255,255,255,.08);color:inherit;border-radius:10px;min-width:40px;min-height:40px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;justify-content:center;cursor:pointer;font:inherit;white-space:nowrap}
.gx-ibtn:focus-visible,.gx-drawer button:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
.gx-ibtn .gx-n{font-size:.72rem;opacity:.8}
.gx-ibtn.gx-reopen{position:absolute;right:10px;top:10px;z-index:5;display:none}
.gx-app.gx-dock-min .gx-ibtn.gx-reopen{display:inline-flex}
/* popups */
.gx-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.gx-scrim.on{opacity:1;pointer-events:auto}
.gx-drawer{position:fixed;z-index:41;top:calc(var(--gx-bar-h) + 8px + env(safe-area-inset-top,0px));right:8px;bottom:8px;width:min(520px,calc(100vw - 16px));display:flex;flex-direction:column;background:var(--gx-panel);color:var(--gx-ink);border-radius:var(--gx-radius);box-shadow:var(--gx-shadow);transform:translateX(calc(100% + 16px));transition:transform .22s ease;visibility:hidden}
.gx-drawer.on{transform:none;visibility:visible}
.gx-drawer.wide{width:min(980px,calc(100vw - 16px))}
.gx-drawer-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--gx-line);flex:0 0 auto}
.gx-drawer-head h2{margin:0;font-size:1.15rem;flex:1;min-width:0}
.gx-x{appearance:none;border:0;background:transparent;font-size:1.6rem;line-height:1;cursor:pointer;color:inherit;min-width:40px;min-height:40px;border-radius:10px}
.gx-drawer-body{flex:1;min-height:0;overflow:auto;padding:10px 12px 16px;overscroll-behavior:contain}
/* narrow screens: the dock becomes a sheet under the board (still in flow), the drawers slide up from the bottom */
@media (max-width:999px){
  .gx-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr)}
  .gx-dock{max-height:var(--gx-sheet-h,46dvh);border-radius:var(--gx-radius) var(--gx-radius) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-app.gx-sheet-full .gx-dock{max-height:78dvh}
  .gx-app.gx-dock-min .gx-dock{visibility:visible;max-height:none}
  .gx-app.gx-dock-min .gx-dock-body{display:none}
  .gx-reopen{display:none!important}
  .gx-grab{display:block;width:44px;height:5px;border-radius:3px;background:currentColor;opacity:.35;margin:0 auto}
  .gx-drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88dvh;height:88dvh;border-radius:var(--gx-radius) var(--gx-radius) 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-drawer.wide{width:auto}
  .gx-hide-narrow{display:none!important}
}
@media (min-width:1000px){.gx-grab{display:none}}
@media (prefers-reduced-motion:reduce){.gx-drawer,.gx-scrim{transition:none}}

/* Layout: a candle-lit tavern table. Rivals sit along the top, the door and treasure decks flank the fight in the middle,
   your leather mat with your gear and hand sits at the bottom, the step coach is a parchment panel at the side. */
:root{
  --ink:#2b1a10; --muted:#6e5640; --paper:#f3e6c8; --paper2:#e6d2a6; --edge:#9c7440;
  --wood:#5b3720; --wood2:#3a2213; --wood3:#1f1109; --leather:#4a2616; --leather2:#2e160b;
  --brass:#e2b457; --brass2:#9a6620; --brass3:#5e3a0e; --cream:#f5e7c8; --cream2:#cfb68c;
  --red:#b3261e; --red2:#e0503c; --gold:#c07d12; --good:#2f7d34; --blue:#2c6aa8; --violet:#6a3fb0;
  --card:#f6ecd4; --shadow:rgba(20,8,2,.45); --glow:rgba(255,176,80,.55);
  --hand:"Alegreya",Georgia,"DejaVu Serif","Times New Roman",serif; --title:"Cinzel","Trajan Pro",Georgia,"DejaVu Serif",serif;
  --note:"Alegreya",Georgia,"DejaVu Serif",serif; --cardt:"Alegreya SC","Alegreya",Georgia,"DejaVu Serif",serif; --logo:"Cinzel Decorative","Cinzel",Georgia,serif;
  --tex-wood:none; --tex-leather:none; --tex-parch:none;
  --bg-hall:#1a0e07;
  color-scheme:light;
}

:root[data-theme="dark"]{--paper:#e8d6ae;--paper2:#d6bd8a;--bg-hall:#0d0703;--wood:#4a2c18;--wood2:#2c190d;--shadow:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}

body{margin:0;background:var(--bg-hall);color:var(--ink);font:18px/1.35 var(--hand)}

.card{--w:124px;--acc:#8a5a14;--acc2:#c8902e;--acc3:#4a2a06;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.075);color:var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;

  padding:calc(var(--u)*2.2) calc(var(--u)*6) calc(var(--u)*2.6);margin:0 -calc(var(--u)*2);border-radius:calc(var(--u)*1.6);background:linear-gradient(var(--acc2),var(--acc) 55%,var(--acc3));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.65),0 0 0 1.8px rgba(255,220,150,.55),0 2px 0 rgba(0,0,0,0.32);

}

<script>
// ===== Board-first shell: dock toggle, sheet sizing, closable popups (drawers) =====
const GX={key:'gx',open:null,
  init(o){this.key=o&&o.key||'gx';document.documentElement.classList.add('gx');const app=document.querySelector('.gx-app');this.app=app;
    let min=false;try{min=localStorage.getItem(this.key+'_dockmin')==='1'}catch(e){}if(min)app.classList.add('gx-dock-min');
    if(!document.querySelector('.gx-scrim')){const s=document.createElement('div');s.className='gx-scrim';s.addEventListener('click',()=>this.close());document.body.appendChild(s);this.scrim=s}
    document.addEventListener('click',e=>{const t=e.target.closest('[data-gx]');if(!t)return;const a=t.dataset.gx;
      if(a==='dock')this.toggleDock();else if(a==='sheet')this.cycleSheet();else if(a==='close')this.close();else this.toggle(a)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&this.open){this.close();e.stopImmediatePropagation()}},true);
    // resize hook for boards
    const b=document.querySelector('.gx-board');if(b&&window.ResizeObserver)new ResizeObserver(()=>{for(const f of this._rs)try{f(b.clientWidth,b.clientHeight)}catch(e){}}).observe(b)},
  _rs:[],onResize(f){this._rs.push(f)},
  boardSize(){const b=document.querySelector('.gx-board');return b?{w:b.clientWidth,h:b.clientHeight}:{w:innerWidth,h:innerHeight}},
  toggleDock(force){const min=force!=null?!force:!this.app.classList.contains('gx-dock-min');this.app.classList.toggle('gx-dock-min',min);this.app.classList.remove('gx-sheet-full');try{localStorage.setItem(this.key+'_dockmin',min?'1':'0')}catch(e){}},
  // phone sheet: min -> normal -> full -> min
  cycleSheet(){const a=this.app;if(a.classList.contains('gx-dock-min')){this.toggleDock(true)}else if(!a.classList.contains('gx-sheet-full'))a.classList.add('gx-sheet-full');else{a.classList.remove('gx-sheet-full');this.toggleDock(false)}},
  showDock(){if(this.app&&this.app.classList.contains('gx-dock-min'))this.toggleDock(true)},
  toggle(id){if(this.open===id)this.close();else this.show(id)},
  show(id){const d=document.getElementById(id);if(!d)return;if(this.open&&this.open!==id){const o=document.getElementById(this.open);if(o)o.classList.remove('on')}
    this.open=id;d.classList.add('on');this.scrim&&this.scrim.classList.add('on');this._back=document.activeElement;
    for(const b of document.querySelectorAll('[data-gx="'+id+'"]'))b.setAttribute('aria-expanded','true');
    const f=d.querySelector('.gx-x');if(f)f.focus({preventScroll:true});if(this.onShow)this.onShow(id)},
  close(){if(!this.open)return;const id=this.open;const d=document.getElementById(this.open);if(d)d.classList.remove('on');for(const b of document.querySelectorAll('[data-gx="'+this.open+'"]'))b.setAttribute('aria-expanded','false');this.open=null;this.scrim&&this.scrim.classList.remove('on');if(this._back&&this._back.focus)this._back.focus({preventScroll:true});if(this.onClose)this.onClose(id)},
  // build a drawer shell around a body element: <div class=gx-drawer id><head><h2>title</h2><button.gx-x></head><body/></div>
  drawer(id,title,bodyEl,wide){let d=document.getElementById(id);if(!d){d=document.createElement('section');d.id=id;d.className='gx-drawer'+(wide?' wide':'');d.setAttribute('role','dialog');d.setAttribute('aria-label',title);
      d.innerHTML=`<div class="gx-drawer-head"><h2></h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body"></div>`;document.body.appendChild(d)}
    d.querySelector('h2').textContent=title;if(bodyEl){const b=d.querySelector('.gx-drawer-body');if(bodyEl.parentNode!==b){b.innerHTML='';b.appendChild(bodyEl)}}return d}};

</script>
<script>
// ---------- the card table: the 168-card base deck (94 door, 74 treasure). Names and texts are original; numbers and effects follow the real cards.
// ref = id of the real card in cards-base.json (the audit trail). Effects are data (ops) plus a few special keys (sp) the engine knows.
const TRAITNAME={human:'Human',elf:'Elf',dwarf:'Dwarf',halfling:'Halfling',warrior:'Warrior',wizard:'Wizard',thief:'Thief',cleric:'Cleric'};
const EXPS=[];
const M=(ref,n,lvl,tr,x,badt,bad,o)=>Object.assign({ref,d:'door',t:'monster',n,lvl,tr,lv:1,x,badt,bad},o||{});
const I=(ref,n,slot,b,g,x,o)=>Object.assign({ref,d:'tr',t:'item',n,slot:slot==='1h'||slot==='2h'||slot==='-'?null:slot,hands:slot==='1h'?1:slot==='2h'?2:0,b,g,x},o||{});
const O=(ref,n,b,g,x,o)=>Object.assign({ref,d:'tr',t:'oneshot',n,b,g,x},o||{});
const C=(ref,n,x,ops,o)=>Object.assign({ref,d:'door',t:'curse',n,x,ops},o||{});
const L=(ref,n,x,o)=>Object.assign({ref,d:'tr',t:'level',n,x:x||'Go up a level. Play on anyone, any time, but never to reach the winning level.'},o||{});
const CARDS=[
// ---- classes and races (generic fantasy archetypes keep their plain names) ----
{ref:'base-warrior',k:'warrior',d:'door',t:'class',cls:'warrior',n:'Warrior',art:'warrior',cp:3,x:'Berserk: in a fight, discard up to 3 cards, +1 each. You win ties.'},

<script>
// the in-game rules, written in our own words
const RULES_HTML=`
<p><b>Goal.</b> Be the first hero to reach <b>level 10</b>. You can only gain that last level by killing a monster (a few special cards are exceptions).</p>
<p><b>Start.</b> Everyone is a level 1 human with no class and gets 4 door cards and 4 treasure cards. Before the first turn you may play any races, classes and items from your hand.</p>
<h3>Your turn</h3>
<ol>
<li><b>Get ready.</b> Play races, classes and items, change what you wear, and sell items worth 1,000 gold for one level. You can't sell your way to level 10.</li>
<li><b>Kick open the door.</b> Turn over the top door card.
 <ul><li>A <b>monster</b>: you must fight it.</li><li>A <b>curse</b>: it hits you at once.</li><li>Anything else goes into your hand.</li></ul></li>
<li><b>If you didn't fight a monster:</b> either <b>look for trouble</b> (fight a monster from your own hand) or <b>loot the room</b> (draw a door card face down).</li>
<li><b>Charity.</b> If you hold more than 5 cards (6 for dwarves), give the extras to the lowest-level player. If that's you, discard them.</li>
</ol>
<h3>Fighting</h3>
<ul>
<li>Your <b>combat strength</b> is your level plus the bonuses of the items you wear. The monster's strength is its level plus any boosts.</li>
<li>You win if your strength is <b>higher</b>. Ties go to the monster, unless you are a warrior.</li>
<li>Anyone can join in: <b>one-shot</b> items (potions and so on) add to either side, and <b>monster boosts</b> make a monster tougher or weaker. <b>Wandering monsters</b> add another monster to the fight.</li>
<li>You may <b>ask one player for help</b> and promise them some of the treasure. Their strength adds to yours. You gain the levels; they get what you promised.</li>
<li><b>Winning:</b> gain a level per monster (some big monsters give 2) and draw the treasures shown.</li>
<li><b>Running away:</b> roll a die for each monster. On 5 or 6 you get away. Otherwise that monster's <b>Bad Stuff</b> happens to you. A helper has to run too.</li>
<li><b>Death:</b> you keep your level, race and class, but lose everything else. Starting with the highest level, the other players each take one card from your body. On your next turn you come back with 4 new cards from each deck.</li>
</ul>
<h3>Items</h3>
<ul>
<li>You can wear 1 headgear, 1 armor and 1 footgear, plus items for your 2 hands.</li>
<li>You can have only 1 <b>Big</b> item at a time (dwarves can have any number).</li>
<li>Items you can't use are carried and give no bonus.</li>
<li>You can only change what you wear on your own turn, outside a fight.</li>
</ul>
<h3>Races and classes</h3>
<ul>
<li><b>Elf:</b> +1 to run away, and +1 level for each monster you help kill.</li>
<li><b>Dwarf:</b> any number of Big items, and a 6-card hand.</li>
<li><b>Halfling:</b> sell one item a turn for double. If you fail to run away, discard a card to roll again.</li>
<li><b>Warrior:</b> win ties. Discard up to 3 cards in a fight for +1 each.</li>
<li><b>Wizard:</b> discard up to 3 cards for +1 each to run away. Discard your whole hand (3+ cards) to charm a single monster away and keep its treasure.</li>
<li><b>Thief:</b> discard a card to give a player in a fight −2 (once per victim per fight). Discard a card to try to steal a small item: roll 4+ or lose a level.</li>
<li><b>Cleric:</b> discard up to 3 cards for +3 each against undead.</li>
</ul>
<p class="small muted">A half-blood card lets you have two races, and a double-class card two classes. Curses can be played on anyone: here that's on your turn, during fights, or when someone else's turn starts. Names, card texts and art in this game are original. The rules follow the real card game.</p>`;

</script>

<script>
// ---------- Doorkick Dungeon engine: all rules live here. State is G (plain JSON); every move goes through gameAct(ds, seat). ----------

    G.pl.push({i,nm:names[i]||('Hero '+(i+1)),sex:(UI.sexes&&UI.sexes[i])||(i%2?'f':'m'),lvl:1,hand:[],eq:[],race:[],cls:[],curse:[],half:null,sup:null,hire:null,human,lv:(LVMIX&&LVMIX[i])||UI.lvl||'normal',gone:false,dead:false,fresh:false,soldT:false,halfT:false,sexPen:false,st:{kills:0,helps:0,deaths:0,runs:0,cursed:0,levels:0}})}

  for(const p of G.pl){drawTo(p,'door',R.START);drawTo(p,'treasure',R.START)}

  let best=-1,who=[];for(const p of G.pl){const r=d6();if(r>best){best=r;who=[p.i]}else if(r===best)who.push(p.i)}G.active=who[rnd(who.length)];
  G.first=G.active;G.rv={};G.mom=[];lg(-1,`${P(G.active).nm} rolls highest and goes first.`);
  G.phase='setup';G.setupOrd=G.pl.map((_,j)=>(G.active+j)%n);G.setupI=0;
  UI.info=false;UI.menu=null;UI.fx=[];UI.sell=null;refresh()}
const HERO_NAMES=['Pip','Morwen','Grub','Tansy','Bodkin','Wrenna'];
// ---- levels and victory [R §12] ----
function gainLv(p,n,why,canWin){if(n<=0||p.dead)return 0;const cap=canWin?R.WIN:R.WIN-1;const before=p.lvl;p.lvl=Math.max(before,Math.min(cap,p.lvl+n));const got=p.lvl-before;if(got>0){p.st.levels+=got;fx('lvl',p.i)}

// ---- choices: anything a player must decide mid-effect becomes G.q (humans answer through validMoves, the AI through aiPick) ----

function aiFight(p,vm){const cb=G.cb;const by=a=>vm.filter(m=>m.act===a);const win=winning(cb);const gap=monStr(cb)-sideStr(cb)+(fighters(cb).some(f=>isCls(f,'warrior'))?0:1);

function rulesHTML(){return RULES_HTML}
// ---- input ----
function uiAct(m){const me=viewSeat();const s=m.seat!=null?m.seat:me;UI.menu=null;if(m.act==='sell')UI.sell=null;const ok=gameAct(m,s);if(!ok)render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-mv],[data-a],[data-card],[data-start],[data-set],[data-opp]');if(!t)return;
  if(t.dataset.mv){uiAct(JSON.parse(t.dataset.mv));return}
  const a=t.dataset.a;
  if(a==='close'){UI.menu=null;UI.zoom=null;UI.rules=false;if(GX.open==='dkCard')GX.close();render();return}
  if(a==='askmenu'){UI.menu={ask:true};render();return}
  if(a==='sellmode'){UI.sell=[];render();return}
  if(a==='sellx'){UI.sell=null;render();return}
  if(a==='iam'){UI.lastSeat=UI.pass;UI.pass=null;render();return}
  if(a==='rules'){GX.show('dkRules');return}
  if(a==='new'){G=null;UI.info=true;UI.menu=null;UI.zoom=null;UI.sell=null;GX.close();render();return}
  if(a==='load'){try{G=JSON.parse(localStorage.getItem(SAVE));UI.pass=null;UI.lastSeat=-1;refresh()}catch(e){G=null;render()}return}
  if(a==='gfx'&&typeof GFX!=='undefined'){GFX.cycle();syncGfxBtn();return}
  if(a==='pause'){UI.pause=!UI.pause;$('#pausebtn').innerHTML=ic(UI.pause?'play':'pause');syncMenu();if(!UI.pause)schedule();return}
  if(a==='speed'){UI.speed=UI.speed>=2?0.5:UI.speed*2;try{localStorage.setItem('dkd_speed2',UI.speed)}catch(e){};$('#speedbtn').innerHTML=SPEEDN(UI.speed);syncMenu();return}
  if(a==='hints'){UI.hints=!UI.hints;try{localStorage.setItem('dkd_hints',UI.hints?'1':'0')}catch(e){};$('#hintbtn').innerHTML=ic('hint')+' '+(UI.hints?'On':'Off');syncMenu();render();return}
  if(a==='snd'&&typeof toggleSound==='function'){toggleSound();syncMenu();return}
  if(a==='mus'&&typeof toggleMusic==='function'){toggleMusic();syncMenu();return}
  if(t.dataset.set){const k=t.dataset.set,v=t.dataset.v;if(k==='n')UI.n=+v;else if(k==='mode')UI.mode=v;else if(k==='lvl')UI.lvl=v;else if(k==='ex'){DEFEX[v]=!DEFEX[v];try{localStorage.setItem('dkd_ex',JSON.stringify(DEFEX))}catch(e){}}render();return}
  if(t.dataset.opp!=null&&t.dataset.card===undefined){UI.oppView=+t.dataset.opp;render();GX.show('dkOpp');const d=$('#dkOpp .gx-drawer-body');if(d)d.scrollTop=0;return}
  if(t.dataset.start){UI.pass=null;UI.lastSeat=-1;newGame(t.dataset.start,UI.n||DEFN);return}
  if(t.dataset.card!==undefined&&G){const id=+t.dataset.card;const me=viewSeat();
    if(t.closest('.dlg')||t.closest('#dkCard')){return}
    if(UI.sell){if(me>=0&&sellable(P(me)).includes(id)){const i=UI.sell.indexOf(id);if(i>=0)UI.sell.splice(i,1);else UI.sell.push(id);render()}return}
    const ms=cardMoves(me,id);
    if(ms.length===1&&['give','toss','equip','unequip'].includes(ms[0].act)){uiAct(ms[0]);return}
    if(ms.length){UI.menu={card:id};render();return}UI.zoom=id;render();return}
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Escape'){UI.menu=null;UI.zoom=null;UI.rules=false;if(G)render();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('span[data-gx]')){e.preventDefault();e.target.click();return}
  if(GX.open)return;
  if(!G||G.winner)return;const me=viewSeat();if(sideToAct()!==me)return;const vm=validMoves(me);const f=a=>vm.find(m=>m.act===a);
  const k=e.key.toLowerCase();const m=k==='k'?f('kick'):k==='l'?f('loot'):k==='e'?f('end'):k==='f'?f('fight'):k==='r'?f('run'):k===' '||k==='enter'?(f('kick')||f('fight')||f('pass')||f('end')||f('ready')||f('loot')):null;
  if(m&&!UI.menu&&UI.pass==null){e.preventDefault();uiAct(m)}});
function humanTurn(){if(!G||G.winner)return false;const s=sideToAct();return s>=0&&P(s).human}
try{const ex=JSON.parse(localStorage.getItem('dkd_ex')||'null');if(ex)Object.assign(DEFEX,ex)}catch(e){}
// ---- board-first shell: popups for the diary, rivals, card details and rules ----
GX.init({key:'dkd'});
GX.drawer('dkLog','Dungeon diary',$('#dkLogBody'));
GX.drawer('dkOpp','Rivals: gear and cards',$('#dkOppBody'),true);
GX.drawer('dkCard','Card',$('#dkCardBody'));
GX.drawer('dkRules','How to play',$('#dkRulesBody'),true);$('#dkRulesBody').innerHTML=rulesHTML();
GX.drawer('dkMenu','Menu',$('#dkMenuBody'));
$('#speedbtn').innerHTML=SPEEDN(UI.speed);$('#hintbtn').innerHTML=ic('hint')+' '+(UI.hints?'On':'Off');if(typeof GFX!=='undefined'){GFX.init();syncGfxBtn()}
GX.onClose=id=>{if(id==='dkCard'&&((UI.menu&&UI.menu.card!=null)||UI.zoom!=null)){UI.menu=null;UI.zoom=null;if(G)render()}};
render();

</script>
</body>
</html>
