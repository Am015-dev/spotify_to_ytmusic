<title>Via Tessera</title>
<style>
/* Via Tessera: a Roman floor mosaic. Marble panels, terracotta and lapis, umber grout. Phone first (375x553 up); text >= 12 px. */
:root {
  --marble: #f1e9da; --marble2: #e6dac4; --vein: #d3c3a6; --grout: #2b2018; --umber: #3b2416; --ink: #2a1c12; --ink2: #5a4334;
  --terra: #b5532f; --terra2: #8f3b1f; --lapis: #1f4e8c; --ochre: #c9963a; --gold: #e2b44f; --verd: #2f6b5e;
  --you: #b23a2a; --riv: #1d6a63;
  --brick: #b5532f; --food: #d9a833; --tool: #6c7a86; --wine: #6e2a5e; --cloth: #2d6fb0;
  --serif: 'Cinzel', 'Trajan Pro', Georgia, serif; --sans: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  --tap: 44px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--grout); color: var(--ink); font-family: var(--sans); font-size: 15px; }
::selection { background: var(--ochre); color: var(--ink); }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.ic { width: 20px; height: 20px; fill: currentColor; flex: none; }
.ic.ln { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
/* top bar: a strip of marble with the race */

/* board: the mosaic map */
.board { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; overflow: hidden; background: var(--grout); touch-action: none; }
#map { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.zoom { position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--grout); background: var(--marble); color: var(--ink); font-size: 24px; font-weight: 700; line-height: 1; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
#banner { position: absolute; left: 50%; top: 10px; transform: translateX(-50%) translateY(-8px); padding: 7px 14px; border-radius: 10px; background: rgba(43,32,24,.92); color: var(--marble); font-family: var(--serif); font-size: 15px; font-weight: 700; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis; }
#banner.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#rivalcard { position: absolute; left: 6px; top: 6px; pointer-events: none; }
#rivalcard .mini { transform: scale(.82); transform-origin: top left; }

/* map pieces (SVG) */
.rt { fill: none; stroke-linecap: round; }
.rt.land { stroke: #6b3d1f; stroke-width: 4; stroke-dasharray: 7 4; }
.rt.sea { stroke: #e9f1f6; stroke-width: 2.6; stroke-dasharray: 2 5; opacity: .9; }
.slot { fill: rgba(241,233,218,.0); }
.slot.glow { fill: rgba(226,180,79,.95); stroke: var(--grout); stroke-width: 2; }
.slotn { font: 700 13px var(--sans); fill: var(--grout); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.slothit { fill: transparent; }
.city .disc { stroke: var(--grout); stroke-width: 3; }
.city .lab { font: 700 calc(12px * var(--k, 1)) var(--sans); fill: var(--ink); paint-order: stroke; stroke: rgba(241,233,218,.92); stroke-width: calc(4px * var(--k, 1)); text-anchor: middle; pointer-events: none; }
.city .cap { font: 700 calc(15px * var(--k, 1)) var(--serif); }
.city.glow .ring { stroke: var(--gold); stroke-width: 5; fill: none; }
.city.sel .ring { stroke: #fff; stroke-width: 5; fill: none; }
.city .hit { fill: transparent; }
.cost { pointer-events: none; }
.cost rect { fill: var(--marble); stroke: var(--grout); stroke-width: 2; }
.cost text { font: 700 13px var(--sans); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.house { stroke: var(--grout); stroke-width: 1.5; }
.house.hslot { stroke-width: 2; stroke-dasharray: 3 2; }
.prov .pl { font: 700 calc(12px * var(--k, 1)) var(--serif); fill: rgba(43,32,24,.78); text-anchor: middle; letter-spacing: .05em; pointer-events: none; paint-order: stroke; stroke: rgba(241,233,218,.55); stroke-width: 3px; }
.prov .mk { stroke: var(--grout); stroke-width: 2.5; }
.prov .mkring { fill: none; }
.prov.glow .mkring { stroke: var(--gold); stroke-width: 5; fill: none; }
.prov.sel .mkring { stroke: #fff; stroke-width: 5; fill: none; }
.prov .hit { fill: transparent; }
.prov:not(.glow) .hit { pointer-events: none; }
.prov:not(.glow) { pointer-events: none; }
.slot.canb { fill: #7fc46a; }
.col { pointer-events: none; }
.col.glow .halo { fill: rgba(226,180,79,.9); }
.col.sel .halo { fill: #fff; }
.colhit { fill: transparent; }
.prodpop { font: 700 14px var(--sans); fill: #fff; paint-order: stroke; stroke: var(--grout); stroke-width: 4px; text-anchor: middle; pointer-events: none; }

/* dock */
.btn { min-height: 44px; min-width: 64px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--grout); background: var(--terra); color: #fff8ec; font-size: 15px; font-weight: 700; box-shadow: 0 3px 0 var(--terra2), 0 4px 8px rgba(0,0,0,.2); }
.btn.alt { background: var(--marble); color: var(--ink); box-shadow: 0 3px 0 var(--vein), 0 4px 8px rgba(0,0,0,.15); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--terra2); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.glow { box-shadow: 0 0 0 3px var(--gold), 0 3px 0 var(--terra2); }
/* storehouse: 12 slots + coins */
#store { display: flex; align-items: center; gap: 3px; height: 34px; }
.slots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; flex: 1; height: 30px; padding: 2px; border-radius: 6px; background: var(--grout); }
.sl { border-radius: 3px; background: #4a3a2c; display: flex; align-items: center; justify-content: center; color: #fff; }
.sl .ic { width: 16px; height: 16px; }
.sl.brick { background: var(--brick); } .sl.food { background: var(--food); color: var(--ink); } .sl.tool { background: var(--tool); } .sl.wine { background: var(--wine); } .sl.cloth { background: var(--cloth); }
.sl.colL, .sl.colS { background: var(--marble2); color: var(--you); }
.sl.new { animation: pop .5s ease-out; }
.coins { display: flex; align-items: center; gap: 3px; height: 30px; padding: 0 8px 0 4px; border-radius: 15px; background: var(--grout); color: var(--gold); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; min-width: 58px; }
.coins .ic { width: 22px; height: 22px; }
.storebtn { border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 3px; flex: 1; min-height: 34px; }
/* hand of cards */
#hand { display: flex; gap: 4px; height: 96px; overflow-x: auto; overflow-y: hidden; padding: 3px 1px 1px; scrollbar-width: none; }
#hand::-webkit-scrollbar { display: none; }
.cd { flex: none; width: 60px; height: 88px; border-radius: 8px; border: 2px solid var(--grout); background: linear-gradient(#fbf6ec, #eadfca); position: relative; display: flex; flex-direction: column; align-items: center; padding: 3px 2px 2px; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .15s ease-out; }
.cd .top { width: 100%; height: 6px; border-radius: 3px; }
.cd .art { width: 34px; height: 34px; margin-top: 4px; color: var(--terra2); }
.cd .nm { font-size: 11.5px; letter-spacing: -.01em; font-weight: 700; line-height: 1.05; text-align: center; margin-top: 2px; color: var(--ink); word-break: break-word; }
.cd .god { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 4px; background: var(--grout); color: var(--gold); display: flex; align-items: center; justify-content: center; }
.cd .god .ic { width: 15px; height: 15px; }
.cd.glow { border-color: var(--terra); }
.cd.sel { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), 0 6px 10px rgba(0,0,0,.3); }
.cd.used { opacity: .38; }
.cd.hint::after { content: ''; position: absolute; inset: -4px; border-radius: 10px; border: 3px dashed var(--gold); pointer-events: none; }
.cd.spec .art { color: var(--ink2); }
.hand-sep { flex: none; width: 2px; margin: 8px 2px; background: var(--vein); border-radius: 1px; }
.pile { flex: none; width: 46px; height: 88px; border-radius: 8px; border: 2px dashed var(--vein); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink2); font-size: 12px; text-align: center; line-height: 1.1; }
.pile b { font-size: 18px; color: var(--ink); }

/* bottom sheet (market, trade, choices) */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--marble); border-top: 4px solid var(--terra2); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.4); padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); max-height: 70%; overflow-y: auto; transform: translateY(0); transition: transform .22s ease-out; }
.sheet[hidden] { display: block; transform: translateY(110%); pointer-events: none; visibility: hidden; }
.sh-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sh-head h2 { flex: 1; margin: 0; font-family: var(--serif); font-size: 17px; color: var(--terra2); }
.x { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--grout); background: var(--marble2); font-size: 22px; line-height: 1; }
.mrow { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.mc { flex: none; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mc .cd { width: 76px; height: 100px; }
.mc .cd .art { width: 40px; height: 40px; }
.price { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; min-height: 22px; }
.g { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 4px; border: 1.5px solid var(--grout); color: #fff; }
.g .ic { width: 15px; height: 15px; }
.g.brick { background: var(--brick); } .g.food { background: var(--food); color: var(--ink); } .g.tool { background: var(--tool); } .g.wine { background: var(--wine); } .g.cloth { background: var(--cloth); } .g.any { background: #fff; color: var(--ink); font-weight: 700; font-size: 13px; }
.g.sur { border-style: dashed; }
.mc .note { font-size: 12px; color: var(--ink2); text-align: center; min-height: 15px; }
.mc.can .cd { border-color: var(--terra); box-shadow: 0 0 0 3px var(--gold); }
.mc.no .cd { opacity: .5; }
.deckn { font-size: 13px; color: var(--ink2); margin: 2px 0 0; }
/* trade rows */
.trow { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--vein); }
.trow .g { width: 30px; height: 30px; } .trow .g .ic { width: 20px; height: 20px; }
.trow .nm { flex: 1; font-size: 15px; } .trow .nm small { color: var(--ink2); font-size: 13px; display: block; }
.trow .q { width: 34px; text-align: center; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.trow .q.buy { color: var(--verd); } .trow .q.sell { color: var(--terra2); }
.step { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--grout); background: var(--marble2); font-size: 22px; font-weight: 700; }
.step[disabled] { opacity: .35; }
.tsum { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 15px; }
.tsum .grow { flex: 1; }
.choice { display: flex; gap: 8px; flex-wrap: wrap; }
.choice .btn { flex: 1; }
.lead { margin: 0 0 6px; font-size: 15px; color: var(--ink2); }

/* overlays: title, result, info */
.ov { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(27,20,14,.72); }
.ov[hidden] { display: none; }
.panel { width: min(420px, 100%); max-height: 100%; overflow-y: auto; background: var(--marble); border: 3px solid var(--grout); border-radius: 14px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.title-art { height: 150px; border-radius: 10px; margin: -4px -4px 12px; background-size: cover; background-position: 45% 45%; border: 3px solid var(--grout); position: relative; overflow: hidden; }
.title-art h1 { position: absolute; left: 0; right: 0; bottom: 10px; margin: 0; text-align: center; font-family: var(--serif); font-size: 34px; color: #fff8ec; letter-spacing: .06em; text-shadow: 0 2px 0 var(--grout), 0 0 14px rgba(0,0,0,.6); }
.panel h2 { font-family: var(--serif); color: var(--terra2); margin: 0 0 8px; font-size: 20px; }
.panel p { margin: 0 0 10px; line-height: 1.35; }
.panel .btn { width: 100%; margin-top: 8px; }
/* text sits at least 8 px inside the column the buttons draw */
.panel h2, .panel > p, .panel .rules, .panel .small, .sh-head h2, .sheet .lead, .sheet .deckn, .sheet .tsum .small { padding-left: 8px; padding-right: 8px; }
.seg { display: flex; gap: 6px; margin: 6px 0; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 2px solid var(--grout); background: var(--marble2); font-weight: 700; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--lapis); color: #fff; }
.small { font-size: 13px; color: var(--ink2); }
.sc-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; font-variant-numeric: tabular-nums; }
.sc-table th, .sc-table td { padding: 5px 4px; border-bottom: 1px solid var(--vein); text-align: right; }
.sc-table th:first-child, .sc-table td:first-child { text-align: left; }
.sc-table tr.tot td { font-weight: 700; font-size: 16px; border-bottom: 0; }
.sc-table .gi { display: inline-flex; align-items: center; gap: 5px; }
.sc-table .gi .ic { width: 18px; height: 18px; color: var(--terra2); }
.dr .panel { max-height: 92%; }
.rules h3 { font-family: var(--serif); color: var(--terra2); font-size: 16px; margin: 12px 0 4px; }
.rules p, .rules li { font-size: 15px; line-height: 1.4; }
.rules ul { padding-left: 18px; margin: 4px 0 8px; }
.ref { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--vein); font-size: 14px; }
.ref .cd { transform: scale(.75); margin: -11px -7px; }
.ref .t { flex: 1; } .ref .t b { display: block; font-size: 15px; }

/* feedback */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.fly { position: absolute; display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; background: rgba(43,32,24,.9); color: #fff8ec; font-weight: 700; font-size: 15px; transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .7s; white-space: nowrap; }
.fly .g { width: 20px; height: 20px; }
#finger { position: fixed; z-index: 45; width: 44px; height: 44px; pointer-events: none; display: none; }
#finger.on { display: block; animation: tapme 1.1s ease-in-out 3; }
#finger svg { width: 44px; height: 44px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
@keyframes tapme { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-3px, -8px) scale(.92); } }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.popin { animation: pop .45s ease-out; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* landscape phones: tighter panels */
@media (max-height: 500px) and (min-aspect-ratio: 3/2) {
  .title-art { height: 64px; } .title-art h1 { font-size: 24px; bottom: 6px; }
  .panel .tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .ov { padding: 8px; } .panel { padding: 10px 12px; } .panel > p { margin-bottom: 4px; }
}

/* guide and result bubbles: text sits next to its target with an arrow touching it */
.bub { position: fixed; z-index: 46; left: 0; top: 0; max-width: 260px; padding: 9px 12px; border-radius: 12px; background: #fff8ec; color: var(--ink); border: 2px solid var(--gold); --bc: var(--gold); font: 700 16px/1.2 var(--sans); box-shadow: 0 4px 14px rgba(0,0,0,.4); pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .15s; }
.bub.on { opacity: 1; visibility: visible; }
.bub.res { background: #2b2018; color: #fff8ec; border-color: #f1e9da; --bc: #f1e9da; z-index: 47; font-weight: 600; }
.bub::after { content: ''; position: absolute; width: 0; height: 0; border: 10px solid transparent; }
.bub.top::after { left: calc(var(--ax, 20px) - 10px); top: 100%; border-top-color: var(--bc); border-bottom-width: 0; }
.bub.bottom::after { left: calc(var(--ax, 20px) - 10px); bottom: 100%; border-bottom-color: var(--bc); border-top-width: 0; }
.bub.left::after { top: calc(var(--ay, 20px) - 10px); left: 100%; border-left-color: var(--bc); border-right-width: 0; }
.bub.right::after { top: calc(var(--ay, 20px) - 10px); right: 100%; border-right-color: var(--bc); border-left-width: 0; }
#prompt.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-width: 1024px) { .bub { max-width: 320px; font-size: 17px; } }
.city .ring, .city .disc, .city > use, .city .house { transform: scale(var(--ms, 1)); }
.bub .sub { font-weight: 400; font-size: 14px; margin-top: 3px; opacity: .85; }
#map.far .prov .pl { display: none; }

/* ===== screen v2: the map is the screen; everything else floats on it ===== */
#app { display: block; padding: 0; }
.board { position: absolute; inset: 0; }
.strips { position: fixed; z-index: 12; left: calc(6px + env(safe-area-inset-left)); top: calc(6px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 5px; width: 168px; }
.strip { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 2px 6px; padding: 5px 8px 5px 6px; min-height: 48px; border-radius: 12px; border: 2px solid var(--grout); background: rgba(43,32,24,.9); color: var(--marble); text-align: left; font-size: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.35); }
.strip .dot { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--marble); grid-row: 1; }
.strip .nm { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip b.sc { font-size: 22px; font-family: var(--serif); color: var(--gold); font-variant-numeric: tabular-nums; }
.strip .cnt { grid-column: 1 / 4; display: flex; gap: 9px; font-size: 13px; color: #e6dac4; white-space: nowrap; }
.strip .cnt span { display: inline-flex; align-items: center; gap: 2px; }
.strip .cnt .ic { width: 14px; height: 14px; }
.strip .rc { grid-column: 1 / 4; font-size: 13px; line-height: 1.2; color: var(--gold); white-space: normal; }
.strip.turn { box-shadow: 0 0 0 3px var(--gold), 0 3px 8px rgba(0,0,0,.35); }
.hud-r { position: fixed; z-index: 12; right: calc(6px + env(safe-area-inset-right)); top: calc(6px + env(safe-area-inset-top)); display: flex; gap: 6px; }
.ib { position: relative; width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--grout); background: var(--marble); color: var(--ink); display: flex; align-items: center; justify-content: center; font: 700 24px var(--serif); box-shadow: 0 3px 8px rgba(0,0,0,.4); padding: 0; }
.ib .ic { width: 26px; height: 26px; }
.ib.sm { width: 44px; height: 44px; font-size: 22px; }
.ib b { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--terra); color: #fff; font: 700 13px/20px var(--sans); text-align: center; }
.ib.low b { background: var(--gold); color: var(--ink); animation: pop .5s ease-out 2; }
.ib.glow { box-shadow: 0 0 0 3px var(--gold); }
.zoom { position: fixed; z-index: 11; right: calc(6px + env(safe-area-inset-right)); top: 66px; display: flex; flex-direction: column; gap: 6px; }
.ptop { position: fixed; z-index: 12; left: 0; right: 0; top: calc(112px + env(safe-area-inset-top)); display: flex; justify-content: center; gap: 6px; pointer-events: none; padding: 0 64px 0 8px; }
.ptop > * { pointer-events: auto; }
#prompt { margin: 0; max-width: 100%; min-height: 44px; display: flex; align-items: center; padding: 6px 16px; border-radius: 22px; background: rgba(251,246,236,.97); border: 2px solid var(--grout); box-shadow: 0 3px 10px rgba(0,0,0,.4); font-size: 16px; font-weight: 700; line-height: 1.15; color: var(--ink); text-align: center; }
#prompt.wait { color: var(--ink2); font-weight: 600; }
.dock { position: fixed; z-index: 12; left: 0; right: 0; bottom: 0; padding: 0 6px calc(6px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.prow { display: flex; justify-content: flex-end; align-items: center; gap: 8px; min-height: 56px; pointer-events: none; }
.prow > * { pointer-events: auto; }
#acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
#acts .btn { min-height: 52px; min-width: 52px; padding: 0 20px; border-radius: 26px; font-size: 17px; border-width: 3px; }
