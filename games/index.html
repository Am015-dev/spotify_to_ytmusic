<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Board Games</title>
<style>
:root{--bg:#0d0b22;--ink:#ecebff;--muted:#a3a0cc;--card:#1a173d;--line:#3a3580;--gold:#ffc86b}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ff;--ink:#17133a;--muted:#5d5890;--card:#fff;--line:#d3ccf5}}
:root[data-theme="dark"]{--bg:#0d0b22;--ink:#ecebff;--muted:#a3a0cc;--card:#1a173d;--line:#3a3580}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:2rem 16px}
h1{margin:0 0 .3rem}p{color:var(--muted)}
a.card{display:block;border:1.5px solid var(--line);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;background:var(--card);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--gold)}a.card b{font-size:1.2rem}
</style>
</head>
<body><main>
<h1>Browser board games</h1>
<p>Single-file adaptations with original names and art, computer opponents and hot-seat play.</p>
<a class="card" href="crown-city-smash/"><b>Crown City Smash</b><br>Giant-monster dice brawl with 3D kaiju, Mindbug and six more expansions.</a>
<a class="card" href="nebula-aces/"><b>Nebula Aces</b><br>Tactical starfighter dogfight: plan secret maneuvers, then fly and fire.</a>
</main></body>
</html>
