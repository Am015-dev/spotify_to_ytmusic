/* ===== Board-first shell (shared by every game on the shelf) =====
   The page never scrolls. The board fills what the bar and the dock leave; the dock is in flow (never over the board);
   everything else opens in a closable popup (drawer). Games theme it with the --gx-* variables. */
:root{--gx-bar-h:52px;--gx-dock-w:clamp(300px,28vw,520px);--gx-bg:#10151c;--gx-bar:#0b1016;--gx-panel:#f4ecd8;--gx-ink:#231a10;--gx-line:rgba(0,0,0,.25);--gx-accent:#e0a948;--gx-shadow:0 20px 60px rgba(0,0,0,.5);--gx-radius:14px}
html.gx,html.gx body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
.gx-app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--gx-bg)}
.gx-bar{min-height:var(--gx-bar-h);display:flex;align-items:center;gap:6px;padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px));overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;z-index:6}
.gx-bar::-webkit-scrollbar{display:none}
.gx-bar .gx-sp{flex:1 0 8px}
.gx-main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--gx-dock-w);position:relative}
.gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr) 0}
.gx-board{position:relative;min-width:0;min-height:0;overflow:hidden}
.gx-dock{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.gx-dock-head{display:flex;align-items:center;gap:6px;padding:6px 8px 4px;flex:0 0 auto}
.gx-dock-head .gx-dt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-dock-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gx-app.gx-dock-min .gx-dock{visibility:hidden}

.gx-ibtn{appearance:none;border:1px solid var(--gx-line);background:rgba(255,255,255,.08);color:inherit;border-radius:10px;min-width:44px;min-height:44px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;justify-content:center;cursor:pointer;font:inherit;white-space:nowrap}
.gx-ibtn:focus-visible,.gx-drawer button:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
.gx-ibtn .gx-n{font-size:.875rem;opacity:.8}
.gx-ibtn.gx-reopen{position:absolute;right:10px;top:10px;z-index:5;display:none}
.gx-app.gx-dock-min .gx-ibtn.gx-reopen{display:inline-flex}
/* popups */
.gx-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.gx-scrim.on{opacity:1;pointer-events:auto}
.gx-drawer{position:fixed;z-index:41;top:calc(var(--gx-bar-h) + 8px + env(safe-area-inset-top,0px));right:8px;bottom:8px;width:min(520px,calc(100vw - 16px));display:flex;flex-direction:column;background:var(--gx-panel);color:var(--gx-ink);border-radius:var(--gx-radius);box-shadow:var(--gx-shadow);padding:31px;transform:translateX(calc(100% + 16px));transition:transform .22s ease;visibility:hidden}
.gx-drawer.on{transform:none;visibility:visible}
.gx-drawer.wide{width:min(980px,calc(100vw - 16px))}
.gx-drawer-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--gx-line);flex:0 0 auto}
.gx-drawer-head h2{margin:0;font-size:1.15rem;flex:1;min-width:0}
.gx-x{appearance:none;border:0;background:transparent;font-size:1.6rem;line-height:1;cursor:pointer;color:inherit;min-width:44px;min-height:44px;border-radius:10px}
.gx-drawer-body{flex:1;min-height:0;overflow:auto;padding:10px 12px 16px;overscroll-behavior:contain}
/* phones (portrait, or anything under 720 px wide): the dock becomes a sheet under the board (still in flow), the drawers slide up
   from the bottom. Any landscape window >= 720 px wide (a 1366 laptop at 150 % = 910x512) keeps the side dock: board left at full height. */
@media (max-width:719px),(max-width:999px) and (orientation:portrait){
  .gx-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr)}
  .gx-dock{max-height:var(--gx-sheet-h,40dvh);border-radius:var(--gx-radius) var(--gx-radius) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-app.gx-sheet-full .gx-dock{max-height:78dvh}
  .gx-app.gx-dock-min .gx-dock{visibility:visible;max-height:none}
  .gx-app.gx-dock-min .gx-dock-body{display:none}
  .gx-reopen{display:none!important}
  .gx-grab{display:block;width:44px;height:5px;border-radius:3px;background:currentColor;opacity:.35;margin:0 auto}
  .gx-drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88dvh;height:88dvh;border-radius:var(--gx-radius) var(--gx-radius) 0 0;transform:translateY(100%);padding-bottom:calc(31px + env(safe-area-inset-bottom,0px))}
  .gx-drawer.wide{width:auto}
  .gx-hide-narrow{display:none!important}
}
@media (min-width:1000px),(min-width:720px) and (orientation:landscape){.gx-grab{display:none}}
/* big screens: popups grow with the screen instead of staying a phone-width column */
@media (min-width:1280px) and (orientation:landscape){.gx-drawer{width:min(640px,36vw)}.gx-drawer.wide{width:min(1180px,calc(100vw - 16px))}}
@media (prefers-reduced-motion:reduce){.gx-drawer,.gx-scrim{transition:none}}

/* ===== GX kit styles (load after shell.css). Themed by the shell's --gx-* variables. ===== */
:root{--gx-text:1;--gx-anim:1;--gx-chip:rgba(0,0,0,.07);--gx-chip-on:var(--gx-accent)}
/* text size: games opt in by using these classes, the kit's own panels always follow it */
.gx-drawer-body,.gx-dock-body,.gx-recap,.gx-tx{font-size:calc(1em * var(--gx-text,1))}
/* settings */
.gx-set-nav{position:sticky;top:-10px;z-index:2;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0;margin:-10px 0 4px;background:var(--gx-panel)}
.gx-set-nav::-webkit-scrollbar{display:none}
.gx-sec{padding:4px 0 12px;border-bottom:1px solid var(--gx-line);scroll-margin-top:56px}
.gx-sec:last-child{border-bottom:0}
.gx-sec h3{margin:8px 0 6px;font-size:1.02em;letter-spacing:.02em}
.gx-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 0}
.gx-row-l{flex:1 1 9em;min-width:0;font-weight:600}
.gx-row-l small{display:block;font-weight:400;opacity:.75;font-size:max(14px,.82em)}
.gx-row-k{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gx-seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.gx-sb,.gx-tg,.gx-chip{appearance:none;font:inherit;color:inherit;min-height:44px;min-width:44px;padding:4px 12px;border-radius:10px;border:1px solid var(--gx-line);background:var(--gx-chip);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;white-space:nowrap}
.gx-sb[aria-pressed=true],.gx-tg[aria-checked=true],.gx-chip[aria-pressed=true]{background:var(--gx-chip-on);border-color:transparent;color:#1d140b;font-weight:700}
.gx-sb:disabled{opacity:.4;cursor:default}
.gx-tg{min-width:64px}
.gx-chip{min-height:44px;padding:2px 11px;border-radius:99px;font-size:max(14px,.88em)}
.gx-sb:focus-visible,.gx-tg:focus-visible,.gx-chip:focus-visible,.gx-ref-it:focus-visible,.gx-ref-q:focus-visible,.gx-recap button:focus-visible,.gx-sl input:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
.gx-sl{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.gx-sl input{width:min(190px,44vw);accent-color:var(--gx-accent);height:28px}
.gx-sl output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.gx-links{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.gx-small{font-size:max(14px,.85em);opacity:.8;margin:6px 0}
.gx-about-n{font-weight:700;margin:4px 0}
/* reference */
.gx-ref-top{position:sticky;top:-10px;z-index:2;background:var(--gx-panel);margin:-10px -12px 6px;padding:10px 12px 6px;border-bottom:1px solid var(--gx-line)}
.gx-ref.big .gx-ref-top{display:none}
.gx-ref-q{width:100%;box-sizing:border-box;min-height:44px;font:inherit;padding:6px 12px;border-radius:10px;border:1px solid var(--gx-line);background:rgba(255,255,255,.6);color:inherit}
.gx-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0 0}
.gx-chips::-webkit-scrollbar{display:none}
.gx-chips>*{flex:none}
.gx-ref-list[hidden],.gx-ref-big[hidden]{display:none}
.gx-ref-n{font-size:max(14px,.82em);opacity:.75;padding-top:4px}
.gx-ref-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:8px}
.gx-ref-it{appearance:none;font:inherit;color:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:12px;border:1px solid var(--gx-line);background:rgba(255,255,255,.35);cursor:pointer;min-height:64px}
.gx-ref-it:hover{background:rgba(255,255,255,.55)}
.gx-ref-pic{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:52px}
.gx-ref-pic>img,.gx-ref-pic>svg{max-width:100%;height:auto;display:block}
.gx-ref-pic.big{width:min(240px,62vw);margin:4px auto 8px;display:flex}
.gx-ref-tx{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.gx-ref-tx b{font-size:1em}
.gx-ref-c{font-size:max(14px,.8em);font-weight:700;padding:0 6px;border-radius:99px;background:var(--gx-chip)}
.gx-ref-m{font-size:max(14px,.8em);opacity:.75;flex-basis:100%}
.gx-ref-d{font-size:max(14px,.86em);flex-basis:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gx-ref-big h3{margin:4px 0 2px;text-align:center;font-size:1.25em}
.gx-ref-big .gx-ref-m{text-align:center}
.gx-ref-full{font-size:1.02em;line-height:1.5;max-width:40em;margin:10px auto}
.gx-ref-x{max-width:40em;margin:8px auto;font-size:max(14px,.9em)}
.gx-ref-big .gx-chips{justify-content:center;flex-wrap:wrap}
.gx-tag{font-size:max(14px,.8em);padding:2px 9px;border-radius:99px;background:var(--gx-chip)}
.gx-ref-bh{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-10px;background:var(--gx-panel);padding:6px 0;z-index:2}
.gx-ref-nav{display:inline-flex;align-items:center;gap:6px}
.gx-ref-big:focus{outline:none}
/* recap strip */
.gx-recap{box-sizing:border-box;min-width:0;max-width:calc(100% - 16px);align-self:stretch;margin:6px 8px;border-radius:12px;background:rgba(0,0,0,.07);border:1px solid var(--gx-line)}
.gx-recap[hidden]{display:none}
.gx-recap-top{display:flex;align-items:stretch}
.gx-recap-h{appearance:none;flex:1;min-width:0;display:flex;align-items:center;gap:8px;font:inherit;color:inherit;background:transparent;border:0;padding:6px 10px;min-height:44px;text-align:left;cursor:pointer}
.gx-recap-h b{white-space:nowrap;font-size:max(14px,.86em)}
.gx-recap-n{font-size:max(14px,.75em);font-weight:700;min-width:1.6em;text-align:center;border-radius:99px;padding:1px 6px;background:var(--gx-accent);color:#1d140b}
.gx-recap-1{flex:1;min-width:0;font-size:max(14px,.84em);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-recap-x{appearance:none;border:0;background:transparent;color:inherit;font-size:1.4em;min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}
.gx-recap-l{margin:0;padding:0 12px 8px 30px;font-size:max(14px,.86em);max-height:9.5em;overflow:auto;line-height:1.4}
/* update notice */
.gx-update{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;appearance:none;font:inherit;font-weight:700;padding:10px 18px;min-height:48px;border-radius:99px;border:0;background:var(--gx-accent);color:#1d140b;box-shadow:var(--gx-shadow);cursor:pointer;max-width:calc(100vw - 24px)}
/* left-handed: the dock and the drawers swap sides on wide screens; games can flip their own button rows with html.lefty */
@media (min-width:1000px),(min-width:720px) and (orientation:landscape){
  html.lefty .gx-main{grid-template-columns:var(--gx-dock-w) minmax(0,1fr)}
  html.lefty .gx-app.gx-dock-min .gx-main{grid-template-columns:0 minmax(0,1fr)}
  html.lefty .gx-dock{grid-column:1;grid-row:1}
  html.lefty .gx-board{grid-column:2;grid-row:1}
  html.lefty .gx-drawer{right:auto;left:8px;transform:translateX(calc(-100% - 16px))}
  html.lefty .gx-drawer.on{transform:none}
  html.lefty .gx-ibtn.gx-reopen{right:auto;left:10px}
}
/* reduce motion / animations off */
html.gx-reduce *,html.gx-reduce *::before,html.gx-reduce *::after,html.gx-noanim *,html.gx-noanim *::before,html.gx-noanim *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
/* colour-blind symbols: games add <i class="gx-cbm">▲</i> next to colour-coded pieces; shown only with html.cb */
.gx-cbm{display:none;font-style:normal}
html.cb .gx-cbm{display:inline}

/* ===== D0 shell polish: one type scale, one toast, one Goal card, calm motion ===== */
:root{--gx-fs-min:14px;--gx-fs-body:16px;--gx-fs-lg:18px;--gx-fs-h2:22px;--gx-fs-h1:28px;--gx-tap:44px;--gx-sp:8px;
  --gx-toast-bg:#241a10;--gx-toast-ink:#fff7e6;--gx-ease:cubic-bezier(.2,.7,.2,1)}
.gx-drawer-body,.gx-dock-body,.gx-tx{font-size:calc(var(--gx-fs-body) * var(--gx-text,1));line-height:1.45}
.gx-dock-head .gx-dt{font-size:var(--gx-fs-body)}
.gx-drawer-head h2{font-size:var(--gx-fs-lg)}
.gx-sec h3{font-size:var(--gx-fs-body)}
/* secondary text keeps 4.5:1: lighten by size, not by opacity */
.gx-row-l small,.gx-small,.gx-ref-m,.gx-ref-n,.gx-recap-1{opacity:.9}
.gx-ibtn,.gx-sb,.gx-tg,.gx-chip,.gx-x,.gx-recap-x,.gx-recap-h,.gx-goal-go,.gx-toast{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.gx-ibtn:active,.gx-sb:active,.gx-tg:active{transform:translateY(1px)}
/* toast (GX.toast): one at a time, bottom centre, clear of the dock; tap to close */
.gx-toast{position:fixed;left:50%;bottom:calc(var(--gx-toast-y,16px) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;box-sizing:border-box;
  width:max-content;max-width:min(420px,calc(100vw - 32px));display:flex;flex-direction:column;gap:2px;padding:12px 16px;min-height:var(--gx-tap);
  border-radius:var(--gx-radius);background:var(--gx-toast-bg);color:var(--gx-toast-ink);border:1px solid rgba(255,255,255,.22);
  box-shadow:0 10px 28px rgba(0,0,0,.5);font-size:var(--gx-fs-body);line-height:1.35;font-weight:500;cursor:pointer;animation:gx-toast-in .22s var(--gx-ease) both}
.gx-toast.top{bottom:auto;top:calc(var(--gx-bar-h) + 10px + env(safe-area-inset-top,0px))}
.gx-toast.good{border-left:4px solid #7ddc8a}.gx-toast.warn{border-left:4px solid #ffc861}
.gx-toast.out{opacity:0;transition:opacity .16s}
.gx-toast-t{font-size:var(--gx-fs-body);font-weight:800}
.gx-toast-h{font-size:var(--gx-fs-min);font-weight:500;opacity:.8}
.gx-toast:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
@media (max-width:719px),(max-width:999px) and (orientation:portrait){.gx-toast:not(.top){bottom:calc(var(--gx-toast-y,16px) + 8px + env(safe-area-inset-bottom,0px))}}
@keyframes gx-toast-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
/* Goal card (GX.goalCard / GX.goalHTML): one sentence, at most 3 bullets, one primary button */
.gx-goal-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(5,3,6,.62);overscroll-behavior:contain}
.gx-goal{box-sizing:border-box;width:min(380px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:20px 16px 16px;
  border-radius:var(--gx-radius);background:var(--gx-panel);color:var(--gx-ink);border:2px solid var(--gx-accent);box-shadow:var(--gx-shadow);animation:gx-toast-in .22s var(--gx-ease) both;transform:none}
.gx-goal-wrap .gx-goal{animation-name:gx-goal-in}
.gx-goal-k{font-size:var(--gx-fs-min);font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.gx-goal-t{margin:0;font-size:var(--gx-fs-h2);line-height:1.15}
.gx-goal-g{margin:0;font-size:var(--gx-fs-lg);line-height:1.35;font-weight:700}
.gx-goal-b{margin:0;padding:0 0 0 20px;font-size:var(--gx-fs-body);line-height:1.4;display:flex;flex-direction:column;gap:4px}
.gx-goal-p{display:flex;justify-content:center;max-height:28dvh}
.gx-goal-p>img,.gx-goal-p>svg{max-width:100%;max-height:28dvh;height:auto;width:auto}
.gx-goal-go{appearance:none;font:inherit;font-weight:800;font-size:var(--gx-fs-body);min-height:48px;padding:0 20px;border-radius:24px;border:0;background:var(--gx-accent);color:#1d140b;cursor:pointer}
.gx-goal-go:focus-visible{outline:3px solid var(--gx-ink);outline-offset:2px}
@keyframes gx-goal-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-height:620px){.gx-goal{gap:8px;padding:14px 14px 12px}.gx-goal-p{display:none}}
@media (prefers-reduced-motion:reduce){.gx-toast,.gx-goal{animation:none}.gx-toast.out{transition:none}}
html.gx-reduce .gx-toast,html.gx-noanim .gx-toast,html.gx-reduce .gx-goal,html.gx-noanim .gx-goal{animation:none}

/* gx-help.css: coach bubbles, the lightbulb, the ghost finger and the rules cards (see gx-help.js and GX-KIT.md section 9).
   Everything the kit draws carries data-help. Override the look with the --gxh-* variables on :root. */
:root{--gxh-bg:#f3e6bf;--gxh-ink:#231a10;--gxh-accent:#c99a35;--gxh-glow:#ffe08a;--gxh-btn:#7a1f31;--gxh-btn-ink:#fff6dc;--gxh-z:80;--gxh-font:inherit}
.gxh-bub{position:fixed;left:0;top:0;z-index:var(--gxh-z);box-sizing:border-box;width:max-content;max-width:min(300px,calc(100vw - 16px));padding:8px 10px 8px 10px;border-radius:12px;background:var(--gxh-bg);color:var(--gxh-ink);border:2px solid var(--gxh-accent);box-shadow:0 8px 22px rgba(0,0,0,.55);font:600 14px/1.28 var(--gxh-font);text-align:left;visibility:hidden;animation:gxh-in .18s ease-out both}
.gxh-bub.on{visibility:visible}
.gxh-bub *{box-sizing:border-box}
.gxh-bub .gxh-tt{font-weight:800;font-size:14.5px;margin:0 0 2px}
.gxh-bub .gxh-tx{font-weight:600;font-size:14px}
.gxh-bub .gxh-bd{display:flex;gap:8px;align-items:flex-start}
.gxh-bub .gxh-sp{flex:0 0 36px;width:36px;height:36px}
.gxh-bub .gxh-sp svg{width:100%;height:100%}
.gxh-bub .gxh-row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;clear:both}
.gxh-bub .gxh-ok,.gxh-bub .gxh-link{font:800 14px/1 var(--gxh-font);min-height:44px;padding:0 12px;border-radius:16px;border:0;cursor:pointer}
.gxh-bub .gxh-ok{background:var(--gxh-btn);color:var(--gxh-btn-ink);margin-left:auto}
/* 44 px tap box, same 32 px look: the extra 6 px is a transparent border pulled back with negative margin */
.gxh-bub .gxh-ok{box-sizing:border-box;min-height:44px;border:6px solid transparent;background-clip:padding-box;margin-top:-6px;margin-bottom:-6px;margin-right:-6px}
.gxh-bub .gxh-link{background:transparent;color:var(--gxh-btn);text-decoration:underline;padding:0;min-height:44px;display:inline-flex;align-items:center}
.gxh-arr{position:absolute;width:12px;height:12px;background:var(--gxh-bg);border:2px solid var(--gxh-accent);transform:rotate(45deg)}
.gxh-a-top .gxh-arr{top:-8px;border-right:0;border-bottom:0}
.gxh-a-bottom .gxh-arr{bottom:-8px;border-left:0;border-top:0}
.gxh-a-left .gxh-arr{left:-8px;border-top:0;border-right:0}
.gxh-a-right .gxh-arr{right:-8px;border-bottom:0;border-left:0}
.gxh-ring{position:fixed;left:0;top:0;z-index:calc(var(--gxh-z) - 1);pointer-events:none;border-radius:14px;border:3px solid var(--gxh-glow);box-shadow:0 0 0 3px rgba(255,224,138,.35),0 0 18px 4px var(--gxh-glow);animation:gxh-pulse 1.1s ease-in-out 3}
.gxh-ring.round{border-radius:50%}
.gxh-ring.soft{border-width:2px;box-shadow:0 0 12px 2px var(--gxh-glow);opacity:.9}
.gxh-ring.from{border-style:dashed;animation:none;box-shadow:0 0 10px 1px var(--gxh-glow)}
/* calm (owner, Nov 2026): the ring pulses 3 times, then rests as a still ring. The finger stays in the DOM (its data-tx/ty name the target) but is not
   shown while the bubble is open (one helper at a time); GXH.bulb({finger:true}) shows it for 3 taps. */
.gxh-finger{position:fixed;left:0;top:0;z-index:calc(var(--gxh-z) + 1);pointer-events:none;width:0;height:0}
.gxh-finger.gxh-off{display:none}
.gxh-finger i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.18) 66%,rgba(255,255,255,0) 74%);box-shadow:0 0 12px rgba(255,255,255,.6)}
.gxh-finger b{position:absolute;left:-3px;top:2px;width:10px;height:26px;border-radius:5px;background:#fff;opacity:.9;transform:rotate(-24deg);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gxh-bulb{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.gxh-bulb svg{width:24px;height:24px;display:block;fill:#ffd95a;stroke:#6b4a00;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,217,90,.7))}
.gxh-bulb.gxh-float{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:calc(var(--gxh-z) - 2);width:44px;height:44px;border-radius:50%;border:2px solid var(--gxh-accent);background:#2a1820}
.gxh-bulb.lit svg{filter:drop-shadow(0 0 8px #ffd95a)}
.gxh-rules{position:fixed;inset:0;z-index:calc(var(--gxh-z) + 10);display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(5,3,6,.72);overscroll-behavior:contain;touch-action:pan-y}
.gxh-rules .gxh-card{position:relative;box-sizing:border-box;width:min(360px,100%);max-height:calc(100% - 8px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px 14px 12px;border-radius:16px;background:var(--gxh-bg);color:var(--gxh-ink);border:3px solid var(--gxh-accent);box-shadow:0 18px 50px rgba(0,0,0,.7);font:600 15px/1.3 var(--gxh-font)}
.gxh-rules .gxh-x{position:absolute;right:4px;top:4px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.08);color:var(--gxh-ink);font:700 22px/1 var(--gxh-font);cursor:pointer}
.gxh-rules .gxh-pic{display:flex;align-items:center;justify-content:center;min-height:120px;max-height:34dvh;padding:6px 0;background:rgba(0,0,0,.06);border-radius:12px;margin-top:22px}
.gxh-rules .gxh-pic svg{max-width:100%;max-height:30dvh;height:auto}
.gxh-rules .gxh-rt{font-weight:800;font-size:19px;line-height:1.15;padding-right:30px}
.gxh-rules .gxh-rx{font-weight:600;font-size:16px}
.gxh-rules .gxh-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.gxh-rules .gxh-nav button{min-height:44px;min-width:76px;padding:0 14px;border-radius:22px;border:2px solid var(--gxh-btn);background:transparent;color:var(--gxh-btn);font:800 15px/1 var(--gxh-font);cursor:pointer}
.gxh-rules .gxh-nav button.gxh-next{background:var(--gxh-btn);color:var(--gxh-btn-ink)}
.gxh-rules .gxh-nav button[disabled]{opacity:.3}
.gxh-rules .gxh-dots{display:flex;gap:6px}
.gxh-rules .gxh-dots i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.25)}
.gxh-rules .gxh-dots i.on{background:var(--gxh-btn)}
.gxh-pics{display:flex;align-items:flex-end;justify-content:center;gap:8px;flex-wrap:nowrap}
.gxh-pics figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.gxh-pics svg{width:64px;height:64px}
.gxh-pics figcaption{font:800 14px/1.1 var(--gxh-font);text-align:center;max-width:76px}
.gxh-pics .gxh-ar{font:800 24px/1 var(--gxh-font);align-self:center;color:var(--gxh-btn)}
.gxh-set{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0}
.gxh-set>span{flex:1 0 90px;font-weight:700}
.gxh-set button{min-height:44px;padding:0 12px;border-radius:19px;border:2px solid var(--gxh-accent);background:transparent;color:inherit;font:700 14px/1 var(--gxh-font);cursor:pointer}
.gxh-set button[aria-pressed=true]{background:var(--gxh-accent);color:#1b1208}
@keyframes gxh-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes gxh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.75}}
@media (prefers-reduced-motion:reduce){.gxh-bub,.gxh-ring{animation:none}.gxh-finger{display:none}}
@media (max-height:600px){.gxh-rules .gxh-pic{min-height:84px;margin-top:20px}.gxh-pics svg{width:50px;height:50px}.gxh-rules .gxh-card{gap:6px;padding:10px 12px}}
/* short phones (375x553 and landscape): a compact bubble, title and button on one line, no picture */
@media (max-height:620px){.gxh-bub{max-width:min(350px,calc(100vw - 12px));padding:6px 9px}.gxh-bub .gxh-sp{display:none}.gxh-bub .gxh-tt{padding-right:84px;min-height:24px;line-height:24px;margin:0}.gxh-bub .gxh-tx{font-size:14px;line-height:1.25}
.gxh-bub .gxh-row2{position:absolute;right:6px;top:4px;margin:0}.gxh-bub .gxh-ok{min-height:44px;border-width:8px;margin:-8px -8px -8px 0;padding:0 12px}.gxh-bub .gxh-bd>div{min-width:0}
.gxh-bub.gxh-bulbb .gxh-row2{position:static;margin-top:2px}}
/* compact form: used by gx-help.js when no free spot exists on a crowded board */
.gxh-bub.gxh-compact{max-width:min(350px,calc(100vw - 12px));padding:6px 9px}.gxh-bub.gxh-compact .gxh-sp{display:none}.gxh-bub.gxh-compact .gxh-tt{padding-right:84px;min-height:24px;line-height:24px;margin:0}.gxh-bub.gxh-compact .gxh-tx{font-size:14px;line-height:1.25}
.gxh-bub.gxh-compact .gxh-row2{position:absolute;right:6px;top:4px;margin:0}.gxh-bub.gxh-compact .gxh-ok{min-height:44px;border-width:8px;margin:-8px -8px -8px 0;padding:0 12px}.gxh-bub.gxh-compact .gxh-bd>div{min-width:0}
.gxh-bub.gxh-compact .gxh-tx{padding-right:104px}
@media (max-height:620px){.gxh-bub .gxh-tx{padding-right:104px}}
.gxh-bub.gxh-compact.gxh-bulbb .gxh-row2{position:static;margin-top:2px}


/* gx-tutor.css: the staged tutorial (spotlight, bubble, progress dots, end card). Bubble styles come from gx-help.css (.gxh-bub); see GX-KIT.md section 10.
   Everything the kit draws carries data-help. Override with --gxt-* (and the --gxh-* variables of the help kit). */
:root{--gxt-z:90;--gxt-dim:rgba(8,4,10,.62)}
.gxt-cell{position:fixed;z-index:var(--gxt-z);background:var(--gxt-dim);touch-action:none;-webkit-tap-highlight-color:transparent;cursor:default}
.gxt-cell.gxt-clear{background:transparent}
.gxt-ring{position:fixed;left:0;top:0;z-index:calc(var(--gxt-z) + 1);pointer-events:none;border-radius:14px;border:3px solid var(--gxh-glow,#ffe08a);box-shadow:0 0 0 3px rgba(255,224,138,.35),0 0 18px 4px var(--gxh-glow,#ffe08a);animation:gxt-pulse 1.1s ease-in-out 3}
/* calm (owner, Nov 2026): 3 pulses, then a still ring; after ~8 s with no tap it pulses 3 more times once (.gxt-again), then rests for good.
   The finger is not shown next to the bubble (one helper at a time) unless the game opts in: GXT.start({finger:true}) = 3 taps, then gone. */
.gxt-ring.gxt-again{animation:gxt-pulse2 1.1s ease-in-out 3}
.gxt-fin.gxt-off{display:none}
.gxt-ring.soft{border-width:2px;box-shadow:0 0 12px 2px var(--gxh-glow,#ffe08a);opacity:.9;animation:none}
.gxt-fin{position:fixed;left:0;top:0;z-index:calc(var(--gxt-z) + 3);pointer-events:none;width:0;height:0}
.gxt-fin i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.18) 66%,rgba(255,255,255,0) 74%);box-shadow:0 0 12px rgba(255,255,255,.6)}
.gxt-fin b{position:absolute;left:-3px;top:2px;width:10px;height:26px;border-radius:5px;background:#fff;opacity:.9;transform:rotate(-24deg);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gxh-bub.gxt-bub{z-index:calc(var(--gxt-z) + 4);animation:gxh-in .18s ease-out both}
.gxt-bub.gxt-shake{animation:gxt-shake .38s ease-in-out both}
.gxt-bub.gxt-nobtn .gxh-tt{padding-right:0}
.gxt-top{position:fixed;left:0;right:0;top:0;z-index:calc(var(--gxt-z) + 5);min-height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 10px;background:#160b11;color:#f3e6bf;font:700 14px/1 var(--gxh-font,inherit);border-bottom:1px solid rgba(201,154,53,.5)}
.gxt-prog{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden}
.gxt-dots{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;min-width:0;overflow:hidden}
@media (max-width:480px){.gxt-dots{display:none}}
.gxt-dots i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(243,230,191,.28);flex:0 0 auto}
.gxt-dots i.done{background:#c99a35}
.gxt-dots i.on{background:#ffe08a;box-shadow:0 0 6px #ffe08a;transform:scale(1.35)}
.gxt-n{opacity:.85;white-space:nowrap}
.gxt-skip{flex:0 0 auto;min-height:44px;padding:0 12px;border-radius:14px;border:1px solid rgba(243,230,191,.5);background:transparent;color:#f3e6bf;font:700 14px/1 var(--gxh-font,inherit);cursor:pointer}
.gxt-pill{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:calc(var(--gxt-z) + 5);padding:6px 14px;border-radius:16px;background:rgba(22,11,17,.9);color:#f3e6bf;border:1px solid rgba(201,154,53,.6);font:700 14px/1.2 var(--gxh-font,inherit);pointer-events:none;white-space:nowrap}
.gxt-end{position:fixed;inset:0;z-index:calc(var(--gxt-z) + 10);display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(5,3,6,.7);box-sizing:border-box}
.gxt-endc{box-sizing:border-box;width:min(340px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;padding:18px 16px 16px;border-radius:18px;background:var(--gxh-bg,#f3e6bf);color:var(--gxh-ink,#231a10);border:3px solid var(--gxh-accent,#c99a35);box-shadow:0 18px 50px rgba(0,0,0,.7);font:600 15px/1.3 var(--gxh-font,inherit)}
.gxt-ek{align-self:center;width:46px;height:46px;border-radius:50%;background:var(--gxh-btn,#7a1f31);color:var(--gxh-btn-ink,#fff6dc);font:800 28px/46px var(--gxh-font,inherit)}
.gxt-et{font-weight:800;font-size:22px;line-height:1.15}
.gxt-ex{font-weight:600;font-size:15px}
.gxt-eb{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.gxt-b{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--gxh-btn,#7a1f31);background:transparent;color:var(--gxh-btn,#7a1f31);font:800 16px/1 var(--gxh-font,inherit);cursor:pointer}
.gxt-b.pri{background:var(--gxh-btn,#7a1f31);color:var(--gxh-btn-ink,#fff6dc)}
@keyframes gxt-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.025);opacity:.75}}
@keyframes gxt-pulse2{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.025);opacity:.75}}
@keyframes gxt-shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.gxt-ring,.gxt-ring.gxt-again,.gxt-bub.gxt-shake{animation:none}.gxt-fin{display:none}}

/* the between-steps wait: three dots that pulse 3 times, then rest (still visible), no words (gx-tutor.js tick) */
.gxt-pill.gxt-wait{display:flex;gap:6px;align-items:center;padding:9px 14px}
.gxt-pill.gxt-wait i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.6;animation:gxtDot 1s 3 ease-in-out}
.gxt-pill.gxt-wait i:nth-child(2){animation-delay:.15s}.gxt-pill.gxt-wait i:nth-child(3){animation-delay:.3s}
@keyframes gxtDot{0%,100%{opacity:.6;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.gxt-pill.gxt-wait i{animation:none;opacity:.8}}

/* Shared menu look for every game (injected last by build-all.py, with the self-hosted faces from shell/fonts).
   One title face (Cinzel), one body face (Alegreya Sans), text >= 13 px, text never absolutely positioned on top of other text. */
:root{--gx-title:"Cinzel",Georgia,serif;--gx-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html body,html body *{font-family:var(--gx-body)!important}
html body :is(h1,h2,h3,h4,.gx-title,.title,.logo,.ttl,.gxc-htitle,.gxc-htitle *,.gxc-title,.gxt-et){font-family:var(--gx-title)!important;font-weight:700;letter-spacing:.02em}
/* menu text floor: the small print under a button and labels never go under 13 px */
html body :is(.gxt-menu span,.gxt-menu small,.menu .btn small,.modal .btn small,.modal p,.modal li,.modal label){font-size:max(14px,1em)}
html body :is(small,.small,.muted,.lbl,.box,.gx-ibtn span,.gx-set small){font-size:max(14px,.9em)!important}
/* ===== D0: shared floors for every game (loaded last) ===== */
/* type scale: 16 body on phones, nothing under 14; touch targets 44; calm motion */
html:root body :is(.gx-ibtn,.gx-sb,.gx-tg,.gxc-btn,.gxc-ib,.gxh-set button,.gxt-b,.gx-goal-go,.gx-bar .gx-ibtn){min-height:44px;min-width:44px}
html body :is(.gxc-lab,.gxc-st,.gxh-pics figcaption,.gxt-n,.gxt-skip,.gxt-pill){font-size:max(14px,1em)}
html body :is(.gx-drawer-body p,.gx-drawer-body li,.gx-dock-body p,.gx-dock-body li){font-size:max(14px,1em)}
html body :is(.gxc-sheet,.gxc-scene,.gxc-res,.gx-drawer) :is(p,li,small){color:inherit}
/* text over painted art: a soft dark halo keeps 4.5:1 when the art is busy */
html.sk .gx-bar .gx-ibtn,html.sk .gx-bar{text-shadow:0 1px 2px rgba(0,0,0,.75)}
html.sk .gxc-act b,html.sk .gxc-act small{text-shadow:0 1px 3px rgba(0,0,0,.9)}
/* panels never swallow the art on phones: docks are capped, sheets slide not fade */
@media (max-width:999px) and (orientation:portrait){.gx-dock{max-height:min(var(--gx-sheet-h,40dvh),44dvh)}}
@media (max-width:719px) and (orientation:landscape){.gx-dock{max-height:min(var(--gx-sheet-h,40dvh),34dvh)}}
/* short desktop windows (landscape, 720-999 px wide): side dock, board at full height. This file loads last, so it also undoes
   per-game "(max-width:999px)" sheet heights/rows; games in their own phone layout (html.ph) keep theirs. */
@media (min-width:720px) and (max-width:999px) and (orientation:landscape){
  html:not(.ph) body .gx-main{grid-template-columns:minmax(0,1fr) var(--gx-dock-w);grid-template-rows:minmax(0,1fr)}
  html:not(.ph) body .gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr) 0}
  html:not(.ph) body .gx-app .gx-dock,html:not(.ph) body .gx-app.gx-sheet-full .gx-dock{height:auto;max-height:none;border-radius:0}
  html:not(.ph) body .gx-app.gx-dock-min .gx-dock{visibility:hidden}
}
/* calm motion: no looping pulses for people who asked for less, nothing flashes faster than ~1 Hz */
@media (prefers-reduced-motion:reduce){
  html body :is(.gxh-ring,.gxt-ring,.gxc-node.next .gxc-disc,.gxh-bub,.gxt-bub){animation:none!important}
  html body *{scroll-behavior:auto!important}
}
html body :is(.gxh-ring,.gxt-ring){animation-duration:1.6s}

:root{--paper:#eadbb4;--paper2:#e0cc9d;--paper3:#d3bb85;--ink:#1f1812;--ink2:#4a3b2a;--ink3:#6b5840;--red:#9a2117;--red2:#6e130d;--sea:#cdbf98;--sea2:#b9a979;
 --dawn:#f3e7c6;--gloam:#7c1810;--gold:#a8842c;--gx-bg:var(--paper);--gx-panel:#efe2bf;--gx-ink:var(--ink);--gx-accent:var(--red);
 --fell:'IM Fell English',Georgia,'Times New Roman',serif;--fellsc:'IM Fell English SC','IM Fell English',Georgia,serif;--sans:'Alegreya Sans',Georgia,serif}
html{font-size:15px}
@media (min-width:1024px){html{font-size:17px}}
body{background:var(--paper2);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
::selection{background:var(--red);color:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.gx-app{grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);background:var(--paper2)}
#top,#dock,#board{min-width:0}
/* ---------- top bar */
#top{display:flex;align-items:center;gap:6px;padding:4px 8px;padding-top:calc(4px + env(safe-area-inset-top,0px));background:var(--paper);border-bottom:2px solid var(--ink);min-height:48px;position:relative;z-index:3}
#top::after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:3px;border-top:1px solid var(--ink);pointer-events:none}
.ib{min-width:44px;height:44px;border-radius:6px;border:1.5px solid var(--ink);background:var(--paper2);display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-family:var(--fellsc);font-size:1.05rem}
.ib svg{width:22px;height:22px}
#race{flex:1;min-width:0;display:flex;gap:5px;align-items:center;justify-content:center}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:2px 6px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);line-height:1.05;height:44px;cursor:pointer}
.chip b{font-family:var(--fell);font-size:1.15rem;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip span{font-size:.87rem;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.chip.g{background:var(--gloam);color:var(--paper);border-color:var(--red2)}.chip.g span{color:#f0d9b5}
.chip.t b{color:var(--red)}
.chip.turn{border-style:dashed}
/* ---------- board */
#board{position:relative;overflow:auto;scrollbar-width:none;touch-action:none;background:var(--sea);overscroll-behavior:none}
#board::-webkit-scrollbar{display:none}
#zoomb{position:absolute;left:6px;bottom:6px;z-index:2;display:flex;flex-direction:column;gap:6px}
#zoomb button{width:44px;height:44px;border-radius:6px;border:1.5px solid var(--ink);background:rgba(234,219,180,.94);font-family:var(--fell);font-size:1.5rem;line-height:1;display:flex;align-items:center;justify-content:center}
#vturn{font-family:var(--fellsc);color:var(--ink2);margin-right:6px}
#map{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#map svg{display:block}
.rg{stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.rg.glow{fill:#f6e7b0;animation:none}
.rgsel{fill:none;stroke:var(--red);stroke-width:5;pointer-events:none}
.rgglow{fill:rgba(154,33,23,.30);stroke:var(--red);stroke-width:6;pointer-events:none;animation:glowin 1.1s ease-out 3}
@keyframes glowin{0%{fill:rgba(154,33,23,.55)}100%{fill:rgba(154,33,23,.30)}}
.rgflash{fill:rgba(154,33,23,.32);stroke:var(--red2);stroke-width:5;pointer-events:none;opacity:0;transition:opacity .5s}
.lbl{font-family:var(--fell);fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.lbl.minor{fill:var(--ink2)}
.zoomed-out .lbl.minor{display:none}
.tok{cursor:pointer}
.tok text{pointer-events:none}
body.scr-on .gx-app{visibility:hidden}
body.tut #bulbbtn{visibility:hidden}
#tutSlot .btn b,#tutSlot .btn span,#tutSlot button b,#tutSlot button span{display:block}
#tutSlot button{min-height:52px;padding:4px 14px;line-height:1.2}
.tok .hit{fill:transparent}
.tokring{fill:none;stroke:var(--red);stroke-width:5;stroke-dasharray:9 6}
.tok.legal .tokring{stroke:#1f1812}
.tok.sel .tokring{stroke:var(--red);stroke-dasharray:none;stroke-width:7}
.mv{transition:transform .55s cubic-bezier(.2,.8,.2,1)}
/* ---------- dock */
#dock{background:var(--paper);border-top:2px solid var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;position:relative;z-index:3}
#dock::before{content:'';position:absolute;left:0;right:0;top:-7px;height:3px;border-bottom:1px solid var(--ink);pointer-events:none}
#msg{font-family:var(--fell);font-size:1.08rem;line-height:1.25;min-height:1.4em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg .who{color:var(--red)}
#drow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:48px}
#mydice{flex-wrap:wrap;justify-content:center}
.die{width:46px;height:46px;border-radius:7px;border:2px solid var(--ink);background:var(--dawn);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;transition:transform .18s ease-out,box-shadow .18s}
.die svg{width:34px;height:34px}
.die.g{background:var(--gloam);border-color:#2a0805}
.die.g svg path{fill:#f3e2be}
.die.used{opacity:.25}
.die.can{box-shadow:0 2px 0 var(--ink)}
.die.sel{transform:translateY(-5px);box-shadow:0 6px 0 var(--red)}
.die.mini{width:22px;height:22px;border-width:1.5px;border-radius:4px}.die.mini svg{width:16px;height:16px}
#rival{position:absolute;right:6px;bottom:6px;z-index:2;background:rgba(234,219,180,.92);border:1.5px solid var(--ink);border-radius:6px;padding:3px 5px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none;max-width:132px}
#rival .rl{font-family:var(--fellsc);font-size:.87rem;line-height:1;color:var(--ink2)}
#rdice{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
#hunt{display:flex;align-items:center;gap:2px;font-family:var(--fell);font-size:1rem;color:var(--red)}
#hunt svg{width:20px;height:20px}
#acts{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;max-height:170px;overflow-y:auto;scrollbar-width:thin}
#acts::-webkit-scrollbar{display:none}
.act{flex:1 1 30%;min-height:48px;min-width:96px;max-width:100%;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper2);padding:4px 9px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;line-height:1.1}
.act b{font-family:var(--fell);font-weight:400;font-size:1.05rem;line-height:1.05}
.act small{font-size:.87rem;color:var(--ink2);line-height:1.1;max-width:100%}
.act.low{flex:0 1 auto;min-width:80px;opacity:.85}
.act.pri{background:var(--ink);color:var(--paper)}.act.pri small{color:#d9c79e}
.act.red{background:var(--red);color:var(--paper);border-color:var(--red2)}.act.red small{color:#f2d6b8}
.act:disabled{opacity:.4}
#tabs{display:flex;gap:6px}
.tab{flex:1;min-width:0;height:44px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);font-family:var(--fellsc);font-size:1rem;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;white-space:nowrap}
.tab svg{width:18px;height:18px;flex:0 0 auto}
@media (max-width:400px){.tab{font-size:.92rem;gap:3px}}
.tab em{font-style:normal;font-family:var(--fell);background:var(--ink);color:var(--paper);border-radius:9px;padding:0 6px;font-size:.9rem;line-height:1.3}
/* ---------- sheets */
.gx-sheet,.sheet{background:var(--paper)!important;color:var(--ink)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82%;overflow:auto;z-index:40;border-top:3px double var(--ink);padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 24px rgba(31,24,18,.35)}
.sheet:not(.on){visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.sheet.on{transform:none;visibility:visible}
.sheet h2{font-family:var(--fellsc);font-weight:400;font-size:1.35rem;margin:2px 0 8px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto}
.sheet p{margin:4px 0 8px;line-height:1.35;max-width:62ch}
#scrim{position:fixed;inset:0;background:rgba(31,24,18,.42);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
.card{border:1.5px solid var(--ink);border-radius:6px;background:var(--paper2);padding:8px 10px;margin:0 0 8px;position:relative}
.card .ct{font-family:var(--fell);font-size:1.15rem;display:flex;gap:6px;align-items:center}
.card .ct svg{width:22px;height:22px;flex:0 0 auto}
.card .ctype{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2)}
.card .eff{margin:4px 0;line-height:1.3}
.card .cb{border-top:1px dashed var(--ink3);padding-top:4px;font-size:.9rem;color:var(--ink2)}
.card .cb b{font-family:var(--fell);font-weight:400;color:var(--red)}
.card.g{background:#e9c9b0}
.card.can{border-width:2.5px;border-color:var(--red)}
.card.no{opacity:.62}
.card .play{display:block;margin-top:6px;min-height:44px}
.btn{min-height:44px;padding:0 14px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper2);font-family:var(--fell);font-size:1.08rem}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);color:var(--paper);border-color:var(--red2)}
.btn.big{min-height:52px;font-size:1.25rem;padding:0 22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* political track */
.pol{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}
.pol .box{border:1.5px solid var(--ink);border-radius:4px;min-height:70px;padding:4px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;background:var(--paper2)}
.pol .box.war{background:#e3b9a1;border-color:var(--red2)}
.pol .lab{font-family:var(--fellsc);font-size:.85rem;grid-column:span 1;text-align:center}
.ntok{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--ink);border-radius:12px;padding:1px 7px 1px 3px;font-size:.85rem;background:var(--paper);white-space:nowrap}
.ntok i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--ink)}
.ntok.sleep{border-style:dashed;opacity:.8}
.ntok.g{background:var(--gloam);color:var(--paper)}
/* company */
.track{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin:6px 0}
.track span{border:1px solid var(--ink);height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--fell);font-size:.85rem;background:var(--paper2)}
.track span.on{background:var(--red);color:var(--paper)}
.track span.end{background:var(--ink);color:var(--paper)}
.comp{display:flex;gap:6px;flex-wrap:wrap}
.cmp{border:1.5px solid var(--ink);border-radius:6px;padding:4px 8px;background:var(--paper2);display:flex;align-items:center;gap:6px;min-height:44px}
.cmp svg{width:22px;height:22px}
.cmp.guide{border-width:2.5px;border-color:var(--red)}
.cmp.dead{opacity:.35;text-decoration:line-through}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tile{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--fell);font-size:1rem;background:var(--paper2);position:relative}
.tile.r::after{content:'';position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--red);border:1px solid var(--paper)}
.tile.sp{background:#e3b9a1}.tile.d{background:#cfe0c0}
.tile svg{width:20px;height:20px}
/* battle */
#battle{position:fixed;left:8px;right:8px;top:50%;transform:translateY(-50%) scale(.96);opacity:0;pointer-events:none;z-index:45;background:var(--paper);border:3px double var(--ink);border-radius:8px;padding:10px 12px;transition:opacity .2s,transform .2s;max-width:520px;margin:0 auto;max-height:92%;overflow:auto;box-shadow:0 12px 30px rgba(31,24,18,.45)}
#battle.on{opacity:1;transform:translateY(-50%);pointer-events:auto}
#battle h3{font-family:var(--fellsc);font-weight:400;font-size:1.3rem;margin:0 0 6px;text-align:center}
.bside{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start}
.barmy{border:1.5px solid var(--ink);border-radius:6px;padding:6px;text-align:center;background:var(--paper2);min-height:92px}
.barmy.g{background:var(--gloam);color:var(--paper)}
.barmy .nm{font-family:var(--fell);font-size:1.02rem}
.barmy .u{font-family:var(--fell);font-size:1.5rem;font-variant-numeric:tabular-nums}
.barmy .s{font-size:.82rem}
.bvs{font-family:var(--fellsc);align-self:center;font-size:1.1rem}
.rolls{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;min-height:30px;margin-top:4px}
.cd6{width:26px;height:26px;border:1.5px solid currentColor;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--fell);font-size:1rem}
.cd6.hit{background:var(--red);color:var(--paper);border-color:var(--red2)}
.barmy.g .cd6.hit{background:var(--paper);color:var(--red)}
.bnote{font-size:.95rem;text-align:center;margin:6px 0;min-height:1.3em;font-family:var(--fell)}
.bcards{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.bcard{flex:0 0 150px;border:1.5px solid var(--ink);border-radius:6px;padding:6px;background:var(--paper2);text-align:left;min-height:64px}
.bcard b{font-family:var(--fell);font-weight:400;color:var(--red);font-size:1.02rem;display:block}
.bcard small{font-size:.82rem;line-height:1.2;display:block}
/* title + setup */
.scr{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:var(--paper);text-align:center;overflow:auto}
.scr.on{display:flex}
#title{background:radial-gradient(120% 90% at 50% 40%,#f1e4c0 0%,#e2cf9f 60%,#c9b07a 100%)}
#title .logo{font-family:var(--fellsc);font-weight:400;font-size:3rem;margin:0;letter-spacing:.04em;line-height:1;color:var(--ink)}
#title .logo i{color:var(--red);font-style:normal}
#title .tag{max-width:30ch;margin:0;font-size:1.05rem;line-height:1.35;font-family:var(--fell)}
#crest{width:150px;height:150px}
.trow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{min-height:44px;padding:0 14px;border:0;background:var(--paper2);font-family:var(--fell);font-size:1.05rem}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
#res .big{font-family:var(--fellsc);font-size:2.2rem;margin:0}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:var(--paper);font-family:var(--fell);font-size:1.05rem;padding:6px 14px;border-radius:4px;opacity:0;pointer-events:none;z-index:50;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.g{background:var(--red)}
.pop{position:absolute;font-family:var(--fell);font-size:1.25rem;color:var(--red);pointer-events:none;z-index:20;transition:transform 1s ease-out,opacity 1s;text-shadow:0 0 4px var(--paper),0 0 2px var(--paper)}
@media (max-height:620px) and (orientation:portrait){#dock{gap:4px;padding-top:4px}#msg{font-size:1rem;min-height:1.2em}.act{flex-basis:22%;min-width:80px;min-height:44px;padding:2px 7px}.act small{display:none}.act b{font-size:.98rem;white-space:normal;line-height:1.05}.die{width:44px;height:44px}#drow{min-height:44px}#acts{min-height:44px;max-height:96px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (orientation:landscape) and (max-height:500px){
 .gx-app{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}
 #top{grid-column:1/3}#board{grid-column:1;grid-row:2}#dock{grid-column:2;grid-row:2;border-top:0;border-left:2px solid var(--ink);overflow:auto}
 #dock::before{display:none}#drow{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="gx-app" id="app">
  <div id="top">
    <button class="ib" data-gx="setd" id="menuB" type="button" aria-label="Menu"></button>
    <div id="race">
      <div class="chip" id="cD" role="button" tabindex="0" aria-label="Dawn victory points"><span>Dawn</span><b id="vD">0/4</b></div>
      <div class="chip g" id="cG" role="button" tabindex="0" aria-label="Gloam victory points"><span>Gloam</span><b id="vG">0/10</b></div>
      <div class="chip t" id="cT" role="button" tabindex="0" aria-label="Taint and the Company"><span>Taint</span><b id="vT">0/12</b></div>
    </div>
    <button class="ib gx-ibtn gxh-bulb" id="bulbbtn" data-help type="button" aria-label="Hint"></button>
    <button class="ib" id="helpB" type="button" aria-label="Rules">?</button>
  </div>
  <div class="gx-board" id="board" data-board><div id="map"></div><div id="zoomb"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button></div><div id="rival" aria-label="Rival dice"><span class="rl" id="rlab">Rival dice</span><div id="rdice"></div><div id="hunt" title="Dice in the hunt box"></div></div></div>
  <div id="dock">
    <div id="msg" aria-live="polite" role="button" tabindex="0" aria-label="Chronicle of the war"></div>
    <div id="drow"><div id="mydice" style="display:flex;gap:6px"></div></div>
    <div id="acts"></div>
    <div id="tabs">
      <button class="tab" id="tCards" type="button"></button>
      <button class="tab" id="tNat" type="button"></button>
      <button class="tab" id="tComp" type="button"></button>
    </div>
  </div>
</div>
<div id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div>
<div id="battle" role="dialog" aria-modal="true" aria-label="Battle"></div>
<div id="toast"></div>
<div class="scr on" id="title">
  <svg id="crest" viewBox="0 0 200 200" aria-hidden="true"></svg>
  <h1 class="logo">GLOAM<i>WAR</i></h1>
  <p class="tag">An old map. Two great alliances. One small Company carrying the Hollow Crown to the Kiln.</p>
  <div class="trow"><button class="btn pri big" id="playD" type="button">Play the Dawn League</button></div>
  <div class="trow"><button class="btn red big" id="playG" type="button">Play the Gloam</button></div>
  <div class="trow"><span class="seg" id="segL"></span></div>
  <div class="trow"><span id="tutSlot"></span><button class="btn" id="howB" type="button">How to play</button><button class="btn" data-gx="setd" type="button" id="tMenuB">Settings</button></div>
</div>
<div class="scr" id="res"><p class="big" id="resH"></p><p id="resP" style="max-width:34ch;font-family:var(--fell);font-size:1.15rem"></p><div class="row" id="resRow" style="justify-content:center"></div></div>
<script>
/* GX scenarios: "spawn the requirement only". Open any game with  ?scn=<id>  and it skips menus / tutorial offers, seeds the RNG,

       name: 'Tutorial: Help button',               // shown in the "Test:" tag
       ask: 'Is the Help button label readable?',   // ONE line for the owner (8 words or fewer is best)
       ls: { dkd_offer: '1' },                      // optional: localStorage seeded for this scenario (a private in-memory store: the player's saves are never touched)
       seed: 7,                                     // optional RNG seed (default: hash of id)

     {kind:'tap', sel:'.fbtns .smash', name:'SMASH', state:() => any, expect:(before, after) => true|false|'why'}
                                                                  the runner touch-taps the element; the engine state must then change as expected
     {kind:'hold', sel:'#pshop .obc', ms:700, name:'hold a card', state:..., expect:...}   like tap, but the runner presses and holds ms (touch: CDP touchStart..touchEnd; pc: mouse hover); state is read WHILE held
     {kind:'fn', name:'sound played', fn:() => true|false|'why'}   anything else
     {kind:'play', name:'buy a card', snap:() => engine numbers, steps:[{sel:'.card', until:() => done, max:3}, ...], idle:() => settled, verify:(before, after) => true|'why'}

                                                                  true, then verify(before, after) asserts the OUTCOME in the engine. step = {sel: css|() => Element, ready?: () => bool,
                                                                  skip?: () => bool, until?: () => bool (tap again, up to max times, until true), after?: ms}

   runs every scenario with it and the scenario MUST then fail, or the scenario does not count) and  fp:() => engine fingerprint  (glow-response check).
   Invariants added to EVERY scenario (no per-game code): no console/page error, no failed same-origin request, no text under 11 px / clipped / overlapping,
   no covered button, no horizontal scroll, every element marked  data-engine="G.pl.0.en"  shows the engine value, every glowing legal target
   (GXS.glowSel, default .bf-tgt,.glow,[data-legal]) responds to a real tap.
   Universal asserts the runner adds to every scenario: no page error, no horizontal scroll, the Test tag shows, the board/game fills the screen. */

  function menuClose() { try { if (typeof GX !== 'undefined' && GX.close) GX.close(); } catch (e) { } [].slice.call(document.querySelectorAll('.gx-x,[data-gx-close],.gxc-x')).forEach(function (b) { if (S.vis(b)) b.click(); }); document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); }

    var els = [].slice.call(document.querySelectorAll('body *')).filter(function (e) { return !/^(SCRIPT|STYLE|NOSCRIPT|OPTION)$/i.test(e.tagName) && !e.closest(SKIPSEL) && S.vis(e); });

<script>
/* Gloamwar rules engine. All state in one JSON-safe G (no functions); pending questions are {h, side, d}. Node + page.
   API: newGame(o), validMoves(G), performMove(G, mv), sideToAct(G), checkInvariants(G), vpOf(G, side).
   Sides: 'D' Dawn League (free peoples), 'G' the Gloam. Combat lives in combat.js, card effects in effects.js. */
var ENG = {};
function rngNext(G) { var t = G.rs = (G.rs + 0x6D2B79F5) | 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function d6(G) { return 1 + Math.floor(rngNext(G) * 6); }
function shuffleG(G, a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rngNext(G) * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function other(s) { return s === 'D' ? 'G' : 'D'; }
function natSide(n) { return NATIONS[n].side; }
function log(G, side, txt, k) { G.log.push({ t: G.turn, s: side, x: txt, k: k || '' }); if (G.log.length > 400) G.log.shift(); G.ev.push({ k: 'log', c: k || '', s: side, x: txt }); }
function ev(G, o) { G.ev.push(o); }

// ---------------------------------------------------------------- setup
function newGame(o) {
  o = o || {};
  var G = { v: 1, rs: (o.seed || 1) | 0, turn: 0, phase: 'start', act: 'D', A: {}, IN: {}, R: {}, dead: {}, ctl: {}, C: {}, pol: {}, log: [], ev: [], win: null, pend: null,
    F: { loc: ELF_START, prog: 0, hid: true, taint: 0, road: -1, guide: 'orrin', tried: false, moved: 0, declared: false },
    pool: [], drawn: [], spec: { D: [], G: [] }, specIn: [], hb: { g: 0, d: 0 }, retrieved: 0, dice: { D: [], G: [] }, used: { D: [], G: [] }, lamps: { D: 3, G: 0 }, lampUsed: { D: 0, G: 0 },
    deck: {}, hand: { D: [], G: [] }, table: { D: [], G: [] }, disc: [], minionSeen: 0, flags: {}, stats: { battles: 0, hunts: 0, tiles: 0 } };
  NAT_ORDER.forEach(function (n) { G.pol[n] = { s: NATIONS[n].pol, a: NATIONS[n].act }; G.R[n] = REINF[n].slice(); G.dead[n] = [0, 0, 0]; });
  Object.keys(SETUP).forEach(function (rid) { G.A[rid] = {}; Object.keys(SETUP[rid]).forEach(function (n) { G.A[rid][n] = SETUP[rid][n].slice(); }); });
  Object.keys(CHARS).forEach(function (c) { G.C[c] = CHARS[c].start; });
  G.pool = HUNT_STD.map(function (t, i) { return { i: i, v: t.v, r: t.r || 0 }; });
  ['DC', 'DS', 'GC', 'GS'].forEach(function (k) { G.deck[k] = shuffleG(G, CARDS.filter(function (c) { return c.deck === k; }).map(function (c) { return c.id; })); });
  if (o.deal) o.deal(G);
  startTurn(G);
  return G;
}
function sideToAct(G) { return G.pend ? G.pend.side : G.act; }

// ---------------------------------------------------------------- army helpers
function units(a) { var u = 0; if (!a) return 0; for (var n in a) u += a[n][0] + a[n][1]; return u; }
function leaders(a) { var l = 0; if (!a) return 0; for (var n in a) l += a[n][2]; return l; }
function armySide(a) { for (var n in a) if (a[n][0] + a[n][1] + a[n][2] > 0) return natSide(n); return null; }
function armyAt(G, rid, side) { var a = G.A[rid]; return a && armySide(a) === side && units(a) > 0 ? a : null; }
function anyAt(G, rid, side) { var a = G.A[rid]; return a && armySide(a) === side ? a : null; }   // includes lone Gloamriders
function inAt(G, rid) { var a = G.IN[rid]; return a && units(a) + leaders(a) > 0 ? a : null; }
function charsAt(G, rid, side) { var r = []; for (var c in G.C) if (G.C[c] === rid && (CHARS[c].side || 'D') === side) r.push(c); return r; }
function ownerSide(rid) { var r = REG[rid]; return r.nat ? natSide(r.nat) : null; }
function controller(G, rid) { return G.ctl[rid] || ownerSide(rid); }
function isSettle(rid) { var s = REG[rid].set; return s === 'town' || s === 'city' || s === 'strong'; }
function besieged(G, rid) { return !!inAt(G, rid); }
function clean(G, rid) {   // drop empty entries; FP leaders without units die
  ['A', 'IN'].forEach(function (k) {
    var a = G[k][rid]; if (!a) return; var u = units(a);
    for (var n in a) { if (u === 0 && a[n][2] > 0 && natSide(n) === 'D') { G.dead[n][2] += a[n][2]; a[n][2] = 0; } if (a[n][0] + a[n][1] + a[n][2] === 0) delete a[n]; }

  });

}
