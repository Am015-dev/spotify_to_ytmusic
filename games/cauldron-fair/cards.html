<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cauldron Fair fortune cards</title>
<style>
:root{--bg:#241730;--card:#37254a;--fg:#fff6dc;--mut:#cbbbe0;--acc:#f2b81e;--line:#53396e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:22px 0 8px;color:var(--acc)}h2.blue{color:#8fc0f5}h2.purple{color:#c9a4f0}h2 small{color:var(--mut);font-weight:400}p{color:var(--mut);margin:0 0 12px}
input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin:0 0 6px;position:sticky;top:6px;z-index:2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.c[hidden]{display:none}
.c img,.ph{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;background:var(--bg)}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3rem;color:var(--acc)}.ph small{font-size:.7rem;color:var(--mut)}
figcaption{padding:8px 10px 10px;display:grid;gap:3px;font-size:.82rem}figcaption b{font-size:.95rem}figcaption em{font-style:normal;font-weight:800;font-size:.72rem;letter-spacing:.04em}
.c.blue em{color:#8fc0f5}.c.purple em{color:#c9a4f0}figcaption span{color:var(--mut)}
a{color:var(--acc)}
</style></head><body>
<h1>Cauldron Fair: all 24 fortune cards</h1>
<p><a href="index.html">&larr; Back to the game</a></p>
<input id="q" type="search" placeholder="Search cards" aria-label="Search cards">
<h2 class="blue">Blue cards: last the whole day <small>11</small></h2><div class="grid"><figure class="c blue" data-s="lucky seven if your white chips add up to exactly 7 when you stop, move your droplet one space. blue"><img src="media/fortune-lucky7.webp" alt="Lucky Seven" loading="lazy" width="256" height="256"><figcaption><b>Lucky Seven</b><em>ALL DAY</em><span>If your white chips add up to exactly 7 when you stop, move your droplet one space.</span></figcaption></figure><figure class="c blue" data-s="spilled brew if your pot explodes this round, the player on your left takes any 2-chip from the shop. blue"><img src="media/fortune-spilled.webp" alt="Spilled Brew" loading="lazy" width="256" height="256"><figcaption><b>Spilled Brew</b><em>ALL DAY</em><span>If your pot explodes this round, the player on your left takes any 2-chip from the shop.</span></figcaption></figure><figure class="c blue" data-s="do-over right after your 5th chip you may tip all your chips back into the bag and start the round again. once. blue"><img src="media/fortune-doover.webp" alt="Do-Over" loading="lazy" width="256" height="256"><figcaption><b>Do-Over</b><em>ALL DAY</em><span>Right after your 5th chip you may tip all your chips back into the bag and start the round again. Once.</span></figcaption></figure><figure class="c blue" data-s="twice rolled whoever rolls the bonus die this round rolls it twice and gets both results. blue"><img src="media/fortune-twice.webp" alt="Twice Rolled" loading="lazy" width="256" height="256"><figcaption><b>Twice Rolled</b><em>ALL DAY</em><span>Whoever rolls the bonus die this round rolls it twice and gets both results.</span></figcaption></figure><figure class="c blue" data-s="thick skin the explosion limit is 9 this round instead of 7. blue"><img src="media/fortune-thick.webp" alt="Thick Skin" loading="lazy" width="256" height="256"><figcaption><b>Thick Skin</b><em>ALL DAY</em><span>The explosion limit is 9 this round instead of 7.</span></figcaption></figure><figure class="c blue" data-s="marrow fair this round every orange chip moves 1 extra space. blue"><img src="media/fortune-marrowfair.webp" alt="Marrow Fair" loading="lazy" width="256" height="256"><figcaption><b>Marrow Fair</b><em>ALL DAY</em><span>This round every orange chip moves 1 extra space.</span></figcaption></figure><figure class="c blue" data-s="peek and pick if you stop without exploding, draw up to 5 chips from your bag and place one of them. blue"><img src="media/fortune-peek.webp" alt="Peek and Pick" loading="lazy" width="256" height="256"><figcaption><b>Peek and Pick</b><em>ALL DAY</em><span>If you stop without exploding, draw up to 5 chips from your bag and place one of them.</span></figcaption></figure><figure class="c blue" data-s="ruby glint if your scoring space shows a ruby, score 2 vp, even if your pot exploded. blue"><img src="media/fortune-glint.webp" alt="Ruby Glint" loading="lazy" width="256" height="256"><figcaption><b>Ruby Glint</b><em>ALL DAY</em><span>If your scoring space shows a ruby, score 2 VP, even if your pot exploded.</span></figcaption></figure><figure class="c blue" data-s="spring water at the end of the round every flask is refilled for free. blue"><img src="media/fortune-spring.webp" alt="Spring Water" loading="lazy" width="256" height="256"><figcaption><b>Spring Water</b><em>ALL DAY</em><span>At the end of the round every flask is refilled for free.</span></figcaption></figure><figure class="c blue" data-s="frothing pot this round you may put the first white chip you draw back into the bag. blue"><img src="media/fortune-froth.webp" alt="Frothing Pot" loading="lazy" width="256" height="256"><figcaption><b>Frothing Pot</b><em>ALL DAY</em><span>This round you may put the first white chip you draw back into the bag.</span></figcaption></figure><figure class="c blue" data-s="red spark if your scoring space shows a ruby, take 1 extra ruby. blue"><img src="media/fortune-spark.webp" alt="Red Spark" loading="lazy" width="256" height="256"><figcaption><b>Red Spark</b><em>ALL DAY</em><span>If your scoring space shows a ruby, take 1 extra ruby.</span></figcaption></figure></div><h2 class="purple">Purple cards: happen at once <small>13</small></h2><div class="grid"><figure class="c purple" data-s="pedlar's pick take a black chip, or any 2-chip, or 3 rubies. purple"><img src="media/fortune-pick.webp" alt="Pedlar's Pick" loading="lazy" width="256" height="256"><figcaption><b>Pedlar's Pick</b><em>NOW</em><span>Take a black chip, or any 2-chip, or 3 rubies.</span></figcaption></figure><figure class="c purple" data-s="a little slide move your droplet forward one space. purple"><img src="media/fortune-slide.webp" alt="A Little Slide" loading="lazy" width="256" height="256"><figcaption><b>A Little Slide</b><em>NOW</em><span>Move your droplet forward one space.</span></figcaption></figure><figure class="c purple" data-s="swap stall you may trade 1 ruby for any 1-chip except purple and black. purple"><img src="media/fortune-swap.webp" alt="Swap Stall" loading="lazy" width="256" height="256"><figcaption><b>Swap Stall</b><em>NOW</em><span>You may trade 1 ruby for any 1-chip except purple and black.</span></figcaption></figure><figure class="c purple" data-s="kind alms the player or players with the fewest rubies take 1 ruby. purple"><img src="media/fortune-alms.webp" alt="Kind Alms" loading="lazy" width="256" height="256"><figcaption><b>Kind Alms</b><em>NOW</em><span>The player or players with the fewest rubies take 1 ruby.</span></figcaption></figure><figure class="c purple" data-s="underdog gift the player or players with the fewest victory points take a green 1. purple"><img src="media/fortune-underdog.webp" alt="Underdog Gift" loading="lazy" width="256" height="256"><figcaption><b>Underdog Gift</b><em>NOW</em><span>The player or players with the fewest victory points take a green 1.</span></figcaption></figure><figure class="c purple" data-s="clear the pods score 4 vp, or take one white 1 out of your bag. purple"><img src="media/fortune-clear.webp" alt="Clear the Pods" loading="lazy" width="256" height="256"><figcaption><b>Clear the Pods</b><em>NOW</em><span>Score 4 VP, or take one white 1 out of your bag.</span></figcaption></figure><figure class="c purple" data-s="rat swarm count your rat tails again: move your rat stone that many extra spaces. purple"><img src="media/fortune-swarm.webp" alt="Rat Swarm" loading="lazy" width="256" height="256"><figcaption><b>Rat Swarm</b><em>NOW</em><span>Count your rat tails again: move your rat stone that many extra spaces.</span></figcaption></figure><figure class="c purple" data-s="lucky dip everyone draws 5 chips. the lowest total takes a blue 2, everyone else takes a ruby. chips go back. purple"><img src="media/fortune-dip.webp" alt="Lucky Dip" loading="lazy" width="256" height="256"><figcaption><b>Lucky Dip</b><em>NOW</em><span>Everyone draws 5 chips. The lowest total takes a blue 2, everyone else takes a ruby. Chips go back.</span></figcaption></figure><figure class="c purple" data-s="rat bribe you may move your rat stone back 1 to 3 spaces and take that many rubies. purple"><img src="media/fortune-bribe.webp" alt="Rat Bribe" loading="lazy" width="256" height="256"><figcaption><b>Rat Bribe</b><em>NOW</em><span>You may move your rat stone back 1 to 3 spaces and take that many rubies.</span></figcaption></figure><figure class="c purple" data-s="rat bounty take any 4-chip, or score 1 vp for each rat tail you trail the leader by. purple"><img src="media/fortune-bounty.webp" alt="Rat Bounty" loading="lazy" width="256" height="256"><figcaption><b>Rat Bounty</b><em>NOW</em><span>Take any 4-chip, or score 1 VP for each rat tail you trail the leader by.</span></figcaption></figure><figure class="c purple" data-s="fork in the road move your droplet 2 spaces, or take a purple chip. purple"><img src="media/fortune-fork.webp" alt="Fork in the Road" loading="lazy" width="256" height="256"><figcaption><b>Fork in the Road</b><em>NOW</em><span>Move your droplet 2 spaces, or take a purple chip.</span></figcaption></figure><figure class="c purple" data-s="fairground dice everyone rolls the bonus die once and takes the result. purple"><img src="media/fortune-dice.webp" alt="Fairground Dice" loading="lazy" width="256" height="256"><figcaption><b>Fairground Dice</b><em>NOW</em><span>Everyone rolls the bonus die once and takes the result.</span></figcaption></figure><figure class="c purple" data-s="haggler's hour draw 4 chips. you may swap one for the next higher chip of its colour; if none can, take a green 1. chips go back. purple"><img src="media/fortune-haggle.webp" alt="Haggler's Hour" loading="lazy" width="256" height="256"><figcaption><b>Haggler's Hour</b><em>NOW</em><span>Draw 4 chips. You may swap one for the next higher chip of its colour; if none can, take a green 1. Chips go back.</span></figcaption></figure></div>
<script>
var q=document.getElementById("q");q.addEventListener("input",function(){var v=q.value.trim().toLowerCase();document.querySelectorAll(".c").forEach(function(c){c.hidden=v&&c.dataset.s.indexOf(v)<0})})
</script></body></html>
