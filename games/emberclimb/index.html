<title>Emberclimb</title>
<style>
:root{--bg:#14100e;--panel:#241a15;--line:#4a3426;--ember:#f2872b;--ember2:#ffb35c;--ink:#f5e9d8;--mute:#b79f86;--hp:#c93a3a;--blk:#4a8fd8;--nrg:#f2c230;--atk:#c8472b;--skl:#3d8fd0;--pwr:#9a5fd0;--cw:clamp(58px,min(17vw,15.5vh),124px);--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Alegreya Sans',Georgia,serif;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.btn{background:linear-gradient(#f2872b,#c8561b);color:#1a0e06;font-weight:700;border-radius:12px;padding:12px 22px;min-height:46px;min-width:46px;box-shadow:0 3px 0 #7a3410;letter-spacing:.03em}
.btn.alt{background:linear-gradient(#4a3426,#31221a);color:var(--ink);box-shadow:0 3px 0 #1a100b}
.btn[disabled]{opacity:.4;pointer-events:none}
.art{position:relative;background-repeat:no-repeat;background-position:center;overflow:hidden}
.art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.1;padding:3%;color:rgba(255,255,255,.88);text-shadow:0 1px 2px #000;background:var(--ph,#5a3a2a);border-radius:inherit}
.art.has .ph{display:none}
.art.k-card,.art.k-bg,.art.k-board{background-size:cover}
.art.k-portrait,.art.k-token,.art.k-icon,.art.k-ui,.art.k-fx{background-size:contain}
.art.k-token .ph,.art.k-icon .ph,.art.k-ui .ph{border-radius:50%}
.art.noph .ph{display:none}
/* title */
#title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(16px + var(--safe));position:relative;overflow:hidden}
#title .bg{position:absolute;inset:0;z-index:0;--ph:radial-gradient(circle at 50% 30%,#6a2a12,#14100e 70%)}
#title>*:not(.bg){position:relative;z-index:1}
h1,h2,.btn,.ct,.cname{font-family:'Cinzel',Georgia,serif}h1{margin:0;font-size:clamp(34px,10vw,64px);letter-spacing:.12em;color:var(--ember2);text-shadow:0 3px 0 #5a2108,0 0 24px rgba(242,135,43,.55);text-align:center}
.sub{color:var(--mute);text-align:center;margin:4px 0 0}
.heroes{display:flex;gap:8px;width:100%;max-width:640px;justify-content:center}
.hero{flex:1;max-width:150px;background:rgba(36,26,21,.88);border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;transition:transform .15s}
.hero.sel{border-color:var(--ember);transform:translateY(-4px);box-shadow:0 0 16px rgba(242,135,43,.5)}
.hero .art{width:100%;aspect-ratio:3/4;border-radius:8px}
.hero b{display:block;font-size:14px;margin-top:4px}.hero i{display:block;font-size:13px;color:var(--mute);font-style:normal}
.refline{font-size:14px;color:var(--ink);text-align:center;max-width:420px;background:rgba(0,0,0,.45);border-radius:8px;padding:6px 10px;min-height:2.6em}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.seg button{padding:8px 14px;border:2px solid var(--line);background:#241a15;min-height:44px}.seg button.on{border-color:var(--ember);color:var(--ember2)}
/* top bar */
.top{display:flex;align-items:center;gap:5px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;overflow:hidden;background:rgba(20,16,14,.92);z-index:5;font-size:13px;flex:none}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 7px;flex:none;min-height:30px;font-size:13px;white-space:nowrap}
.chip.tap{min-height:40px;min-width:40px;justify-content:center}
.pots{display:flex;gap:6px}.pot{width:38px;height:38px;flex:none;border-radius:50%;border:2px dashed var(--line);background:#1a120e;padding:3px}.pot .art{width:100%;height:100%;border-radius:50%}.pot.full{border:2px solid var(--ember2)}
/* map */
#map{flex:1;position:relative;min-height:0}
#map .bg{position:absolute;inset:0;--ph:linear-gradient(#2a1a12,#14100e)}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:3px solid var(--line);background:#2a1d16;display:flex;align-items:center;justify-content:center;font-size:20px;padding:0}
.node .art{position:absolute;inset:2px;border-radius:50%}
.node.vis{opacity:.45}.node.here{border-color:#fff}
.node.glow{border-color:var(--ember2);box-shadow:0 0 0 4px rgba(242,135,43,.35),0 0 18px var(--ember);animation:pulse 1.1s infinite}
.node.t-e{border-color:#c93a3a}.node.t-b{width:64px;height:64px;margin:-32px 0 0 -32px;border-color:#f2c230}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(242,135,43,.15),0 0 26px var(--ember)}}
.hint{position:absolute;left:0;right:0;bottom:calc(8px + var(--safe));text-align:center;z-index:3;pointer-events:none}
.hint span{background:rgba(0,0,0,.6);padding:5px 12px;border-radius:999px;font-size:14px}
/* battle */
#stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#stage .bg{position:absolute;inset:0;--ph:linear-gradient(#2d1d17,#17110e)}
.enemies{position:relative;z-index:2;flex:1.1;display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,20px);padding:6px 6px 0;min-height:0}
.en{position:relative;display:flex;flex-direction:column;align-items:center;flex:1;max-width:190px;min-width:0;padding:4px 2px;border-radius:12px}
.en .art{width:min(100%,calc(var(--cw)*2.3));aspect-ratio:1;border-radius:14px}
.en.dead{opacity:.25;pointer-events:none;filter:grayscale(1)}
.en.glow{animation:pulse 1s infinite;outline:3px solid var(--ember2)}
.en .nm{font-size:13px;color:var(--mute);margin-top:2px}
.bar{position:relative;width:88%;height:14px;background:#1a0c0c;border:1px solid #000;border-radius:7px;overflow:hidden;margin-top:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e0504a,#9c2323);transition:width .3s}
.bar b{position:absolute;inset:0;text-align:center;font-size:10px;line-height:14px;text-shadow:0 1px 1px #000}
.blkchip{position:absolute;right:2px;top:46%;background:var(--blk);color:#fff;border-radius:8px;padding:1px 6px;font-size:12px;font-weight:700;z-index:3}
.intent{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:15px;font-weight:700;min-height:28px;margin-bottom:3px}
.intent .art{width:22px!important;height:22px;aspect-ratio:auto!important;border-radius:50%!important}
.intent.atk{color:#ff8b7a}.intent.def{color:#8ec1ff}.intent.buf{color:#ffd36a}.intent.deb{color:#d9a2ff}
.stc{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px;min-height:16px}
.stc span{font-size:10px;background:#000a;border-radius:6px;padding:0 4px;display:inline-flex;align-items:center;gap:2px}
.stc .art{width:12px;height:12px;border-radius:50%}
.mid{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 8px;flex:none;width:100%;max-width:640px;margin:0 auto}
.heropan{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:rgba(20,14,11,.82);border:2px solid var(--line);border-radius:12px;padding:4px 6px;min-width:0}
.heropan.act{border-color:var(--ember2)}.heropan.dead{opacity:.35}
.heropan .art{width:calc(var(--cw)*.85);aspect-ratio:3/4;border-radius:8px;flex:none}
.heropan .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.orbs{display:flex;gap:3px;min-height:20px}.orb{width:20px;height:20px;border-radius:50%;border:1px solid #fff6;font-size:10px;text-align:center;line-height:18px}.orb.L{background:#4a7bff}.orb.F{background:#6fd0e8}.orb.D{background:#6a3aa8}
.energy{width:clamp(44px,calc(var(--cw)*.8),64px);height:clamp(44px,calc(var(--cw)*.8),64px);border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#ffe9a0,#f2a41b 60%,#9a5a05);color:#2b1700;font-weight:800;font-size:clamp(15px,calc(var(--cw)*.3),24px);display:flex;align-items:center;justify-content:center;border:3px solid #fff3;position:relative}
.energy .art{position:absolute;inset:0;border-radius:50%}.energy span{position:relative;z-index:1}
.hand{position:relative;z-index:6;flex:none;display:flex;justify-content:center;align-items:flex-end;height:calc(var(--cw)*1.4 + 14px);padding:0 4px calc(4px + var(--safe));margin-bottom:2px}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);flex:none;border-radius:calc(var(--cw)*.08);border:2px solid #000;background:#e9d8b8;color:#2a1a0e;font-size:calc(var(--cw)*.105);display:flex;flex-direction:column;overflow:hidden;transition:transform .18s,box-shadow .18s;box-shadow:0 2px 6px #000a}
.hand .card{margin:0 calc(var(--cw)*-.06)}
.card.t-A{--tc:var(--atk)}.card.t-S{--tc:var(--skl)}.card.t-P{--tc:var(--pwr)}.card.t-X{--tc:#777}
.card .ct{height:calc(var(--cw)*.2);background:var(--tc);color:#fff;font-weight:700;display:flex;align-items:center;padding-left:calc(var(--cw)*.27);font-size:.92em;white-space:nowrap;overflow:hidden}
.card .cart{position:relative;height:calc(var(--cw)*.55);border-bottom:2px solid #0004;--ph:#7a5a42}
.card .cart .art{position:absolute;inset:0}
.card .cx{position:absolute;left:calc(var(--cw)*-.01);top:calc(var(--cw)*-.01);width:calc(var(--cw)*.27);height:calc(var(--cw)*.27);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e89a10);color:#2b1700;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.2em;border:2px solid #000;z-index:2}
.card .cb{flex:1;padding:calc(var(--cw)*.03) calc(var(--cw)*.04);overflow:hidden;line-height:1.12}
.card .cl{display:block}
.card .cfr{position:absolute;inset:0;pointer-events:none}
.card.rare{box-shadow:0 0 0 2px #f2c230 inset,0 2px 6px #000a}.card.unc{box-shadow:0 0 0 2px #8ec1ff inset,0 2px 6px #000a}
.hand .card.ok{box-shadow:0 0 0 2px #7dff9a inset,0 0 10px #7dff9a88}
.hand .card.no{filter:grayscale(.7) brightness(.75)}
.hand .card.sel{transform:translate(var(--sx,0px),calc(var(--cw)*-1.8)) scale(1.5);z-index:20;box-shadow:0 0 0 3px var(--ember2),0 8px 22px #000}
.fly{position:fixed;z-index:60;pointer-events:none}
.pop{position:fixed;z-index:70;pointer-events:none;font-weight:800;font-size:26px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:popup .9s ease-out forwards}
.pop.dmg{color:#ffd0c0}.pop.blk{color:#9fd0ff}.pop.heal{color:#8dff9d}.pop.buf{color:#ffd36a;font-size:18px}.pop.deb{color:#d9a2ff;font-size:18px}.pop.die{color:#fff;font-size:44px}
@keyframes popup{0%{transform:translateY(0) scale(.5);opacity:0}20%{transform:translateY(-12px) scale(1.25);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
.lunge{animation:lunge .45s}@keyframes lunge{40%{transform:translateY(24px) scale(1.12)}}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ctl{position:relative;z-index:7;display:flex;justify-content:space-between;align-items:center;padding:4px 10px;flex:none;width:100%;max-width:640px;margin:0 auto}
.piles{display:flex;gap:6px}
.piles .chip{min-height:44px;min-width:44px;justify-content:center}
.endbtn.pulse{animation:pulse 1.1s infinite}
.die{font-size:60px}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,6,4,.9);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + var(--safe))}
.ov h2{margin:0 0 8px;font-size:18px;color:var(--ember2);display:flex;align-items:center;justify-content:space-between}
.ov .x{width:44px;height:44px;font-size:22px;border-radius:50%;background:var(--panel)}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--cw)*1.05),1fr));gap:8px;align-content:start;justify-items:center;padding-bottom:20px}
.rules{flex:1;overflow:auto;font-size:14px;line-height:1.45}
.rules p{margin:0 0 8px}
.reward{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 10px calc(14px + var(--safe));position:relative}
.reward .bg,.panelbg{position:absolute;inset:0;z-index:0;--ph:linear-gradient(#2a1a12,#14100e)}
.reward>*:not(.bg){position:relative;z-index:1}
.picks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.picks .card{--cw:clamp(86px,25vw,150px);cursor:pointer}
.big{--cw:clamp(86px,25vw,150px)}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px;width:100%;max-width:640px}
.item{font-size:13px;background:rgba(36,26,21,.9);border:2px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.item.sold{opacity:.3;pointer-events:none}.item .art{width:56px;height:56px;border-radius:10px}
.item .price{color:var(--nrg);font-weight:700}.item.poor .price{color:#c66}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.evart{width:min(70vw,260px);aspect-ratio:4/3;border-radius:14px}
.toast{position:fixed;left:50%;top:42%;transform:translateX(-50%);z-index:65;background:rgba(0,0,0,.75);padding:10px 20px;border-radius:999px;font-size:20px;animation:popup 1.4s forwards;pointer-events:none}
.ghost{position:fixed;z-index:30;font-size:34px;pointer-events:none;animation:nudge 1.2s infinite}@keyframes nudge{50%{transform:translateY(-14px)}}
.over{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;padding:20px;text-align:center}
.over>*:not(.bg){position:relative;z-index:1}
.orb{position:relative}.orbart{position:absolute;inset:0;border-radius:50%}.stanceart{display:inline-block;width:16px;height:16px;vertical-align:middle;margin-left:3px}.dieart{display:inline-block;width:56px;height:56px;vertical-align:middle}.cbk{display:inline-block;width:14px;height:20px;margin-left:3px;vertical-align:middle}@keyframes fxfade{from{opacity:1;transform:scale(.7)}to{opacity:0;transform:scale(1.3)}}
/* gx-help.css: coach bubbles, the lightbulb, the ghost finger and the rules cards (see gx-help.js and GX-KIT.md section 9).
   Everything the kit draws carries data-help. Override the look with the --gxh-* variables on :root. */
:root{--gxh-bg:#f3e6bf;--gxh-ink:#231a10;--gxh-accent:#c99a35;--gxh-glow:#ffe08a;--gxh-btn:#7a1f31;--gxh-btn-ink:#fff6dc;--gxh-z:80;--gxh-font:inherit}
.gxh-bub{position:fixed;left:0;top:0;z-index:var(--gxh-z);box-sizing:border-box;width:max-content;max-width:min(292px,calc(100vw - 16px));padding:8px 10px 8px 10px;border-radius:12px;background:var(--gxh-bg);color:var(--gxh-ink);border:2px solid var(--gxh-accent);box-shadow:0 8px 22px rgba(0,0,0,.55);font:600 14px/1.28 var(--gxh-font);text-align:left;visibility:hidden;animation:gxh-in .18s ease-out both}
.gxh-bub.on{visibility:visible}
.gxh-bub *{box-sizing:border-box}
.gxh-bub .gxh-tt{font-weight:800;font-size:14.5px;margin:0 0 2px}
.gxh-bub .gxh-tx{font-weight:600;font-size:13.5px}
.gxh-bub .gxh-bd{display:flex;gap:8px;align-items:flex-start}
.gxh-bub .gxh-sp{flex:0 0 36px;width:36px;height:36px}
.gxh-bub .gxh-sp svg{width:100%;height:100%}
.gxh-bub .gxh-row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;clear:both}
.gxh-bub .gxh-ok,.gxh-bub .gxh-link{font:800 13px/1 var(--gxh-font);min-height:32px;padding:0 12px;border-radius:16px;border:0;cursor:pointer}
.gxh-bub .gxh-ok{background:var(--gxh-btn);color:var(--gxh-btn-ink);margin-left:auto}
/* 44 px tap box, same 32 px look: the extra 6 px is a transparent border pulled back with negative margin */
.gxh-bub .gxh-ok{box-sizing:border-box;min-height:44px;border:6px solid transparent;background-clip:padding-box;margin-top:-6px;margin-bottom:-6px;margin-right:-6px}
.gxh-bub .gxh-link{background:transparent;color:var(--gxh-btn);text-decoration:underline;padding:0;min-height:32px;display:inline-flex;align-items:center}
.gxh-arr{position:absolute;width:12px;height:12px;background:var(--gxh-bg);border:2px solid var(--gxh-accent);transform:rotate(45deg)}
.gxh-a-top .gxh-arr{top:-8px;border-right:0;border-bottom:0}
.gxh-a-bottom .gxh-arr{bottom:-8px;border-left:0;border-top:0}
.gxh-a-left .gxh-arr{left:-8px;border-top:0;border-right:0}
.gxh-a-right .gxh-arr{right:-8px;border-bottom:0;border-left:0}
.gxh-ring{position:fixed;left:0;top:0;z-index:calc(var(--gxh-z) - 1);pointer-events:none;border-radius:14px;border:3px solid var(--gxh-glow);box-shadow:0 0 0 3px rgba(255,224,138,.35),0 0 18px 4px var(--gxh-glow);animation:gxh-pulse 1.1s ease-in-out infinite}
.gxh-ring.round{border-radius:50%}
.gxh-ring.soft{border-width:2px;box-shadow:0 0 12px 2px var(--gxh-glow);opacity:.9}
.gxh-ring.from{border-style:dashed;animation:none;box-shadow:0 0 10px 1px var(--gxh-glow)}
.gxh-finger{position:fixed;left:0;top:0;z-index:calc(var(--gxh-z) + 1);pointer-events:none;width:0;height:0}
.gxh-finger i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.18) 66%,rgba(255,255,255,0) 74%);box-shadow:0 0 12px rgba(255,255,255,.6)}
.gxh-finger b{position:absolute;left:-3px;top:2px;width:10px;height:26px;border-radius:5px;background:#fff;opacity:.9;transform:rotate(-24deg);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gxh-bulb{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.gxh-bulb svg{width:24px;height:24px;display:block;fill:#ffd95a;stroke:#6b4a00;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,217,90,.7))}
.gxh-bulb.gxh-float{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:calc(var(--gxh-z) - 2);width:44px;height:44px;border-radius:50%;border:2px solid var(--gxh-accent);background:#2a1820}
.gxh-bulb.lit svg{filter:drop-shadow(0 0 8px #ffd95a)}
.gxh-rules{position:fixed;inset:0;z-index:calc(var(--gxh-z) + 10);display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(5,3,6,.72);overscroll-behavior:contain;touch-action:pan-y}
.gxh-rules .gxh-card{position:relative;box-sizing:border-box;width:min(360px,100%);max-height:calc(100% - 8px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px 14px 12px;border-radius:16px;background:var(--gxh-bg);color:var(--gxh-ink);border:3px solid var(--gxh-accent);box-shadow:0 18px 50px rgba(0,0,0,.7);font:600 15px/1.3 var(--gxh-font)}
.gxh-rules .gxh-x{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.08);color:var(--gxh-ink);font:700 22px/1 var(--gxh-font);cursor:pointer}

.gxt-skip{flex:0 0 auto;min-height:28px;padding:0 10px;border-radius:14px;border:1px solid rgba(243,230,191,.5);background:transparent;color:#f3e6bf;font:700 12px/1 var(--gxh-font,inherit);cursor:pointer}
.gxt-pill{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:calc(var(--gxt-z) + 5);padding:6px 14px;border-radius:16px;background:rgba(22,11,17,.9);color:#f3e6bf;border:1px solid rgba(201,154,53,.6);font:700 13px/1.2 var(--gxh-font,inherit);pointer-events:none;white-space:nowrap}
.gxt-end{position:fixed;inset:0;z-index:calc(var(--gxt-z) + 10);display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(5,3,6,.7);box-sizing:border-box}

.gxt-ek{align-self:center;width:46px;height:46px;border-radius:50%;background:var(--gxh-btn,#7a1f31);color:var(--gxh-btn-ink,#fff6dc);font:800 28px/46px var(--gxh-font,inherit)}

.gxt-b{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--gxh-btn,#7a1f31);background:transparent;color:var(--gxh-btn,#7a1f31);font:800 16px/1 var(--gxh-font,inherit);cursor:pointer}
.gxt-b.pri{background:var(--gxh-btn,#7a1f31);color:var(--gxh-btn-ink,#fff6dc)}
@keyframes gxt-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.025);opacity:.75}}
@keyframes gxt-shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.gxt-ring,.gxt-bub.gxt-shake{animation:none}}
@media (max-height:620px){.gxt-endc{gap:6px;padding:12px 14px}.gxt-ek{display:none}.gxt-et{font-size:19px}.gxt-b{min-height:44px}.gxt-top{height:30px}}

/* ===== GX campaign styles: chapter map, story scenes, boss card, result. Theme with the --gxc-* variables. ===== */
:root{--gxc-bg:#1b1410;--gxc-paper:#efe0bd;--gxc-paper2:#e2cc9b;--gxc-ink:#2a1d10;--gxc-dim:rgba(42,29,16,.68);--gxc-line:rgba(60,38,14,.28);
  --gxc-go:#c9662a;--gxc-go-ink:#fff8ec;--gxc-gold:#f2b93b;--gxc-a1:#4f8a4b;--gxc-a2:#c07a2c;--gxc-a3:#8e3b46;--gxc-road:#b98a52;--gxc-radius:16px;
  --gxc-font:inherit;--gxc-head:inherit}
.gxc{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:var(--gxc-ink);font-family:var(--gxc-font);
  background:radial-gradient(120% 70% at 50% 0%,#3a2a1c 0%,var(--gxc-bg) 70%);overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.gxc[hidden]{display:none}
.gxc *{box-sizing:border-box}
.gxc button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gxc button:focus-visible{outline:3px solid var(--gxc-gold);outline-offset:2px}
.gxc-screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;width:100%;max-width:560px;margin:0 auto}
.gxc-map-on .gxc-screen{justify-content:flex-start;padding:0;max-width:640px}
.gxc-dim{color:var(--gxc-dim)}
.gxc-small{font-size:13px;margin:6px 0 0;text-align:center}
.gxc-row{display:flex;gap:8px;justify-content:center;margin-top:14px;width:100%}
.gxc-row.wrap{flex-wrap:wrap}
.gxc-btn{min-height:46px;min-width:88px;padding:8px 21px;border-radius:12px;border:2px solid var(--gxc-line);background:rgba(255,255,255,.35);color:var(--gxc-ink);font-weight:700;letter-spacing:.01em}
.gxc-btn.go{background:linear-gradient(#dc7a3a,var(--gxc-go));border-color:#8f4317;color:var(--gxc-go-ink);box-shadow:0 3px 0 #7a3712,0 6px 14px rgba(0,0,0,.25);flex:1 1 auto;max-width:220px}
.gxc-btn.go:active{transform:translateY(2px);box-shadow:0 1px 0 #7a3712}
.gxc-btn.soft{background:#f7e7b8;border-color:#c9a14a}
.gxc-btn.ghost{background:rgba(255,255,255,.22)}
.gxc-ib{min-height:44px;min-width:44px;padding:4px 21px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fbefd6;font-weight:600;white-space:nowrap;flex:0 0 auto}
.gxc-tag{display:inline-block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:rgba(60,38,14,.12);margin-right:6px;font-weight:700}
/* portraits: image or emoji badge in a painted ring */
.gxc-pt{--gxc-pt:64px;--gxc-ptc:#6b4a2b;width:var(--gxc-pt);height:var(--gxc-pt);flex:0 0 var(--gxc-pt);border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 55%),var(--gxc-ptc);border:3px solid #f6e6c2;box-shadow:0 0 0 2px rgba(60,38,14,.5),0 6px 16px rgba(0,0,0,.3)}
.gxc-pt img{width:100%;height:100%;object-fit:cover;display:block}
.gxc-pt-e{font-size:calc(var(--gxc-pt) * .52);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
/* ---- map ---- */
.gxc-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;flex:0 0 auto;color:#fbefd6}
.gxc-htitle{flex:1 1 auto;line-height:1.2;min-width:0;text-align:center;font-family:var(--gxc-head);font-size:19px;white-space:normal;overflow-wrap:anywhere;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.gxc-score{color:var(--gxc-gold)}
.gxc-map{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  border-radius:var(--gxc-radius) var(--gxc-radius) 0 0;
  background:
    radial-gradient(60% 40% at 20% 15%,rgba(110,150,80,.28),transparent 70%),
    radial-gradient(50% 35% at 85% 55%,rgba(200,140,60,.22),transparent 70%),
    radial-gradient(70% 40% at 30% 92%,rgba(150,60,70,.22),transparent 70%),
    repeating-radial-gradient(circle at 70% 30%,rgba(120,80,30,.035) 0 2px,transparent 2px 9px),
    linear-gradient(#f1e3c2,var(--gxc-paper2));box-shadow:inset 0 0 40px rgba(90,55,20,.45)}
.gxc-path{position:relative;width:100%;margin:0 auto;max-width:560px}
.gxc-road{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:visible}
.gxc-road path{fill:none;stroke-linecap:round}
.gxc-road-edge{stroke:rgba(90,58,24,.45);stroke-width:26px}
.gxc-road-fill{stroke:var(--gxc-road);stroke-width:20px}
.gxc-road-dash{stroke:#f6e6c2;stroke-width:3px;stroke-dasharray:2 10;opacity:.85}

  background:linear-gradient(90deg,transparent,rgba(60,38,14,.82) 15%,rgba(60,38,14,.82) 85%,transparent);color:#fbefd6;z-index:2;text-align:center;line-height:1.1}
.gxc-act b{font-size:14px;letter-spacing:.04em}
.gxc-act small{font-size:13px;line-height:1.25;opacity:.85;white-space:normal;max-width:100%;padding:0 18px}
.gxc-node{position:absolute;transform:translateX(-50%);width:64px;height:64px;padding:0;border:0;background:none;z-index:3;display:flex;flex-direction:column;align-items:center}
.gxc-disc{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff8ec;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 55%),var(--gxc-a1);border:3px solid #f6e6c2;box-shadow:0 0 0 2px rgba(60,38,14,.55),0 5px 10px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.gxc-node.a2 .gxc-disc{background-color:var(--gxc-a2);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 55%)}
.gxc-node.a3 .gxc-disc{background-color:var(--gxc-a3);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 55%)}
.gxc-node.boss .gxc-disc{width:62px;height:62px;margin-top:-3px;border-color:var(--gxc-gold);box-shadow:0 0 0 2px #6b3c10,0 0 0 6px rgba(242,185,59,.35),0 6px 12px rgba(0,0,0,.35)}

.gxc-node.boss .gxc-disc::after{content:'♛';position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:17px;color:var(--gxc-gold);text-shadow:0 1px 2px #000}
.gxc-node.locked .gxc-disc{filter:grayscale(.85) brightness(.85);opacity:.75}
.gxc-lock{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:16px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.gxc-node.won .gxc-disc{border-color:var(--gxc-gold)}
.gxc-node.next .gxc-disc{animation:gxc-pulse 1.6s ease-in-out infinite}
@keyframes gxc-pulse{0%,100%{box-shadow:0 0 0 2px rgba(60,38,14,.55),0 0 0 0 rgba(242,185,59,.7)}50%{box-shadow:0 0 0 2px rgba(60,38,14,.55),0 0 0 10px rgba(242,185,59,0)}}
.gxc-node .gxc-stars{position:absolute;top:50px;left:50%;transform:translateX(-50%);gap:0;padding:0 4px;border-radius:99px;background:rgba(60,38,14,.75)}
.gxc-node .gxc-st{font-size:13px}
.gxc-lab{position:absolute;left:66px;top:14px;width:max-content;max-width:min(150px,38vw);text-align:left;font-size:13.5px;font-weight:700;line-height:1.15;color:var(--gxc-ink);
  background:rgba(246,230,194,.88);padding:3px 8px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* sheets and toasts sit over the map */
.gxc-sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88%;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;z-index:5;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));

.gxc-slist{list-style:none;margin:8px 0 0;padding:0;width:100%;text-align:left;font-size:14.5px}
.gxc-slist li{display:flex;gap:8px;align-items:center;padding:4px 0}
.gxc-slist i{font-style:normal;font-size:18px;color:rgba(60,38,14,.25)}
.gxc-slist li.on i{color:var(--gxc-gold);text-shadow:0 1px 0 #9c6a12}
.gxc-rw{list-style:none;padding:0;margin:8px 0}.gxc-rw li{padding:6px 0;border-bottom:1px solid var(--gxc-line)}
.gxc-toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:rgba(30,20,10,.92);color:#fbefd6;padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
/* ---- story scene ---- */
.gxc-scene,.gxc-boss,.gxc-res{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px;border-radius:var(--gxc-radius);
  background:linear-gradient(#f6e9cb,var(--gxc-paper));box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 30px rgba(140,95,40,.25);max-height:100%;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;max-width:100%}
.gxc-sc-title{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--gxc-dim);font-weight:700;margin-bottom:12px}
.gxc-sc-who{margin-bottom:8px}
.gxc-sc-name{font-family:var(--gxc-head);font-weight:800;font-size:18px;min-height:1.2em}
.gxc-sc-text{font-size:18px;line-height:1.4;margin:10px 0 12px;min-height:3.2em;max-width:30em;cursor:pointer}
.gxc-sc-text.in{animation:gxc-in .3s ease-out}
@keyframes gxc-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gxc-dots{display:flex;gap:6px}.gxc-dots i{width:8px;height:8px;border-radius:50%;background:rgba(60,38,14,.2)}.gxc-dots i.was{background:rgba(60,38,14,.45)}.gxc-dots i.on{background:var(--gxc-go)}
/* ---- boss card ---- */
.gxc-boss-on{background:radial-gradient(100% 60% at 50% 30%,#5a2230 0%,#1a0d10 75%)}
.gxc-boss-on.a1{background:radial-gradient(100% 60% at 50% 30%,#2d5a2c 0%,#0f1a0e 75%)}
.gxc-boss-on.a2{background:radial-gradient(100% 60% at 50% 30%,#6a4318 0%,#1a120a 75%)}
.gxc-boss{border:3px solid var(--gxc-gold);position:relative;padding-top:14px}
.gxc-boss-tag{margin-bottom:10px;background:linear-gradient(#f6c552,#c98d17);color:#3a2205;font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;padding:5px 18px;border-radius:99px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.gxc-boss .gxc-pt{border-color:var(--gxc-gold)}
.gxc-boss h2{margin:12px 0 2px;font-family:var(--gxc-head);font-size:26px;line-height:1.1}
.gxc-boss-pers{margin:4px 0 8px;font-style:italic;font-size:16px;color:var(--gxc-dim)}
/* ---- result ---- */
.gxc-res-on.won{background:radial-gradient(100% 60% at 50% 25%,#6b5320 0%,var(--gxc-bg) 75%)}
.gxc-res-on.has-art{background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.72)),var(--gxc-art) center/cover no-repeat}
.gxc-res-k{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--gxc-dim);font-weight:700}
.gxc-res h2{margin:4px 0 6px;font-family:var(--gxc-head);font-size:28px}
.gxc-quote{display:flex;gap:10px;align-items:center;text-align:left;width:100%;margin:12px 0 4px;padding:10px;border-radius:12px;background:rgba(60,38,14,.08)}
.gxc-quote b{font-size:13px}.gxc-quote p{margin:2px 0 0;font-style:italic;font-size:15px;line-height:1.3}
.gxc-unl{width:100%;margin-top:10px;text-align:left;padding:10px 12px;border-radius:12px;border:2px dashed #c9a14a;background:rgba(242,185,59,.14)}
.gxc-unl>b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.gxc-unl-i{padding:3px 0;font-size:15px}
/* short phones (375x553): tighter scene, smaller portraits */
@media (max-height:600px){
  .gxc-screen{padding:8px 12px}
  .gxc-scene,.gxc-boss,.gxc-res{padding:14px 12px}
  .gxc-sc-who .gxc-pt{--gxc-pt:84px!important}
  .gxc-boss .gxc-pt{--gxc-pt:104px!important}
  .gxc-boss{padding-top:10px}.gxc-boss-tag{margin-bottom:6px}.gxc-boss h2{font-size:22px;margin-top:8px}
  .gxc-sc-text{font-size:16.5px;margin:6px 0 8px}
  .gxc-stars.big .gxc-st{font-size:36px}
  .gxc-res h2{font-size:23px}
}
html.gx-reduce .gxc *,html.gx-noanim .gxc *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.gxc *{animation:none!important}}

.tmain{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(300px,100%)}.tmain>.btn{width:100%;font-size:20px;min-height:56px}.trow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}.trow .btn{width:calc(50% - 5px);min-height:44px;padding:8px 6px;font-size:14px}.trow .chip{width:44px;justify-content:center}
.gxt-menu.primary,.tmain>.gxt-menu{width:100%}
/* hand readability (R2): bigger hand cards, >=11px cost / name / key number, full text on tap-hold */
:root{--hw:clamp(58px,min(21vw,15.5vh),124px)}
.hand{--cw:var(--hw)}
.card .ct{height:auto;min-height:calc(var(--cw)*.2);padding:1px calc(var(--cw)*.13) 1px calc(var(--cw)*.27);font-size:max(11px,.92em);line-height:1.05;white-space:normal;overflow:hidden;max-height:calc(var(--cw)*.3)}
.card .cx{font-size:max(12px,.16*var(--cw));display:flex;align-items:center;justify-content:center}
.card .ck{position:absolute;right:2px;bottom:calc(var(--cw)*.69);z-index:3;min-width:calc(var(--cw)*.32);padding:0 4px;border-radius:9px;background:rgba(20,10,4,.88);color:#fff;font-weight:800;font-size:max(12px,.17*var(--cw));line-height:1.25;text-align:center;border:1px solid #fff6}
.card .ck.k-b{background:rgba(26,64,112,.92)}.card .ck.k-p{background:rgba(30,90,44,.92)}
.hand .card .cb{font-size:max(7px,.9em)}
.peek{position:fixed;inset:0;z-index:90;background:rgba(10,6,4,.78);display:flex;align-items:center;justify-content:center;pointer-events:auto}
.peek .card{--cw:min(62vw,240px);font-size:calc(var(--cw)*.075);margin:0}
.peek .card .cb{font-size:max(15px,1em)}.peek .card .ct{max-height:none;font-size:max(15px,.95em)}
.peek .card .ck{font-size:max(15px,.17*var(--cw))}
/* audit R2: phone text >= 13px, PC >= 16px, contrast >= 4.5 */
.art .ph{font-size:13px;color:#fff;background:var(--ph,#3a2418);text-shadow:none;overflow:hidden;word-break:break-word}
.art .ph::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:inherit}.art .ph{isolation:isolate}
.art.k-portrait .ph,.art.k-token .ph{font-size:13px}
.bar{height:19px}.bar i{background:linear-gradient(#b83a35,#8a1f1f)}.bar b{font-size:13px;line-height:19px;color:#fff;text-shadow:0 1px 2px #000}
.stc span{font-size:13px}.stc{min-height:19px}
.card .ct{background:color-mix(in srgb,var(--tc) 62%,#000);font-size:max(13px,.92em);color:#fff}
.card .cx{font-size:max(13px,.16*var(--cw))}
.card .ck{font-size:max(13px,.17*var(--cw))}
.hand .card .cb{display:none}
.hand .card.sel .cb{display:block;font-size:13px;line-height:1.1;overflow:hidden}
.card .ct{overflow-wrap:anywhere}
.hero b{font-size:14px}.hero i{font-size:13px;color:#d6c3ad}
.top,.chip,.en .nm,.intent,.refline,.hero b,.hero i,.piles .chip{font-size:13px}
@media (min-width:900px){
  .art .ph,.art.k-portrait .ph,.art.k-token .ph,.top,.chip,.en .nm,.refline,.hero b,.hero i,.piles .chip,.bar b,.stc span,.intent,.intent .ph,.card .ct,.card .cx,.card .ck,.hand .card.sel .cb,.peek .card .cb{font-size:16px}
  .bar{height:22px}.bar b{line-height:22px}
  .trow .btn{font-size:16px}
  html body .gxh-bub,html body .gxh-bub *,html body .gxt-top *{font-size:max(16px,1em)!important}
}

.gxt-menu{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;line-height:1.2}.gxt-menu b,.gxt-menu span{display:block;font-size:max(13px,1em)}.gxt-menu span{font-weight:400;opacity:.85}
.item.picked{border-color:var(--ember);box-shadow:0 0 12px rgba(242,135,43,.6)}
.shopdet{display:flex;flex-direction:column;align-items:center;gap:8px}
.shopdet .card{--cw:min(48vw,190px)}.shopdet .card .cb,.shopdet .card .cb .cl{display:block;font-size:max(13px,.09*var(--cw))}
@media (max-width:700px){
  .heropan .art{display:none}
  .heropan{min-height:0;padding:4px 8px}
  .hand{height:calc(var(--cw)*1.62 + 8px)}
  .hand .card{height:calc(var(--cw)*1.62)}
  .card .cart{height:calc(var(--cw)*.62)}
  .card .ck{bottom:calc(var(--cw)*.82)}
}
.card .ct{display:block;text-align:left;line-height:1.05;max-height:none!important;flex:none}
.hand.dense .card{margin:0 calc(var(--cw)*-.125)}
.hand.dense .card .ct{padding-right:calc(var(--cw)*.04)}
.stc:empty{display:none}
@media (max-width:700px){.heropan{padding:2px 8px!important}.heropan .inf{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}}

<script>
/* GX scenarios: "spawn the requirement only". Open any game with  ?scn=<id>  and it skips menus / tutorial offers, seeds the RNG,
   builds the exact engine state of ONE scenario directly (no playing through), shows a tiny "Test: <name>" tag and exposes
   window.GXSCN = {id, name, ask, ready, checks}. `ask` is the one line the owner should try ("Tap SMASH over Downtown");
   `checks` are the machine asserts the runner (scripts/scn-run.js + scenarios.spec.js) runs at 390x763, 375x553 and 1366x768.
   ?scn=list  ->  window.GXSLIST = [{id, name, ask, sizes}]  (no setup, used by the runner and the shelf).

   A game registers its scenarios in ONE small file (scn.js) inlined right after this one and BEFORE the game scripts:
