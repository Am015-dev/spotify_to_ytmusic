<style>
:root{--bg:#120b0e;--card:#241419;--fg:#f6e6b4;--mut:#c4ab9a;--acc:#e8c867;--line:#40242c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}

<h2>Relics (Kingdom cards) <small>17</small></h2><div class="grid"><figure class="c" data-s="roaming company  all your cards gain pathfinder. your active cards also count as being in your hand for the purposes of journeying. relics (kingdom cards)"><img src="cards/kc01.webp" alt="Roaming Company" loading="lazy" width="224" height="224"><figcaption><b>Roaming Company</b><span>All your cards gain Pathfinder. Your Active cards also count as being in your Hand for the purposes of Journeying.</span></figcaption></figure><figure class="c" data-s="statue wrights  gain 1 influence if you have a card in any council. if you have a card in each of the three councils you may discard this card to gain 2 more influence. relics (kingdom cards)"><img src="cards/kc02.webp" alt="Statue Wrights" loading="lazy" width="224" height="224"><figcaption><b>Statue Wrights</b><span>Gain 1 influence if you have a card in any Council. If you have a card in each of the three Councils you may discard this card to gain 2 more influence.</span></figcaption></figure><figure class="c" data-s="paper diadems  if you are first on the order track, your followers gain +1 vote; if you are not first, they gain +2 votes. relics (kingdom cards)"><img src="cards/kc03.webp" alt="Paper Diadems" loading="lazy" width="224" height="224"><figcaption><b>Paper Diadems</b><span>If you are first on the Order Track, your Followers gain +1 Vote; if you are not first, they gain +2 Votes.</span></figcaption></figure><figure class="c" data-s="veiled patron  bold: bold: discard your bidding card; place this card in your supply. passive: when resolving attrition, instead of reducing hand size you may/must discard this card (it absorbs one attrition). relics (kingdom cards)"><img src="cards/kc04.webp" alt="Veiled Patron" loading="lazy" width="224" height="224"><figcaption><b>Veiled Patron</b><span>Bold: Bold: Discard your Bidding card; place this card in your Supply. Passive: when resolving Attrition, instead of reducing Hand Size you may/must discard this card (it absorbs one Attrition).</span></figcaption></figure><figure class="c" data-s="sentinel towers  +5 strength to your bidding card and occupying cards. when you are the first to resolve your bid, gain 1 influence. bold: you may not steal kingdom cards. relics (kingdom cards)"><img src="cards/kc05.webp" alt="Sentinel Towers" loading="lazy" width="224" height="224"><figcaption><b>Sentinel Towers</b><span>+5 Strength to your Bidding card and Occupying cards. When you are the first to resolve your Bid, gain 1 influence. Bold: you may not steal Kingdom Cards.</span></figcaption></figure><figure class="c" data-s="buried hall  burn one of your tactics to gain 1 lore; if that tactic was unexhausted gain 2 more lore. relics (kingdom cards)"><img src="cards/kc06.webp" alt="Buried Hall" loading="lazy" width="224" height="224"><figcaption><b>Buried Hall</b><span>Burn one of your Tactics to gain 1 lore; if that Tactic was Unexhausted gain 2 more lore.</span></figcaption></figure><figure class="c" data-s="the lighthouse  bold: bold: discard your bidding card. acquire the site of power card with the lowest (or tied lowest) lore cost. discard this card. relics (kingdom cards)"><img src="cards/kc07.webp" alt="The Lighthouse" loading="lazy" width="224" height="224"><figcaption><b>The Lighthouse</b><span>Bold: Bold: Discard your Bidding card. Acquire the Site of Power card with the lowest (or tied lowest) Lore cost. Discard this card.</span></figcaption></figure><figure class="c" data-s="vast archive  your faction cards with exactly 1 printed lore gain +1 lore. relics (kingdom cards)"><img src="cards/kc08.webp" alt="Vast Archive" loading="lazy" width="224" height="224"><figcaption><b>Vast Archive</b><span>Your Faction Cards with exactly 1 printed Lore gain +1 Lore.</span></figcaption></figure><figure class="c" data-s="cutthroat crew  when you attempt to steal a kingdom card, add +3 strength to the stealing card. whenever a kingdom card is stolen, gain 1 influence; if an opponent steals this card, they gain that influence instead. relics (kingdom cards)"><img src="cards/kc09.webp" alt="Cutthroat Crew" loading="lazy" width="224" height="224"><figcaption><b>Cutthroat Crew</b><span>When you attempt to steal a Kingdom Card, add +3 Strength to the stealing card. Whenever a Kingdom Card is stolen, gain 1 influence; if an opponent steals THIS card, they gain that influence instead.</span></figcaption></figure><figure class="c" data-s="shadow assembly  bold: bold: discard your bidding card; place this card on a region. action: govern with one of your active cards in this region. relics (kingdom cards)"><img src="cards/kc10.webp" alt="Shadow Assembly" loading="lazy" width="224" height="224"><figcaption><b>Shadow Assembly</b><span>Bold: Bold: Discard your Bidding card; place this card on a Region. Action: Govern with one of your Active cards in this Region.</span></figcaption></figure><figure class="c" data-s="trade league hall  bold: bold: discard your bidding card; place this card on a location. whenever any player claims this location's reward, this card's owner gains 1 influence. relics (kingdom cards)"><img src="cards/kc11.webp" alt="Trade League Hall" loading="lazy" width="224" height="224"><figcaption><b>Trade League Hall</b><span>Bold: Bold: Discard your Bidding card; place this card on a Location. Whenever any player claims this Location's Reward, this card's owner gains 1 influence.</span></figcaption></figure><figure class="c" data-s="crystal warrens  whenever you journey with a card that has pathfinder, gain 1 influence and 1 additional lore. relics (kingdom cards)"><img src="cards/kc12.webp" alt="Crystal Warrens" loading="lazy" width="224" height="224"><figcaption><b>Crystal Warrens</b><span>Whenever you Journey with a card that has Pathfinder, gain 1 influence and 1 additional lore.</span></figcaption></figure><figure class="c" data-s="faraway hermitage  if you have no lore in your supply, gain 1 influence; otherwise gain 1 lore. relics (kingdom cards)"><img src="cards/kc13.webp" alt="Faraway Hermitage" loading="lazy" width="224" height="224"><figcaption><b>Faraway Hermitage</b><span>If you have no lore in your Supply, gain 1 influence; otherwise gain 1 lore.</span></figcaption></figure><figure class="c" data-s="counterfeit amnesties  move any one card from your discard pile to your hand. relics (kingdom cards)"><img src="cards/kc14.webp" alt="Counterfeit Amnesties" loading="lazy" width="224" height="224"><figcaption><b>Counterfeit Amnesties</b><span>Move any one card from your Discard Pile to your Hand.</span></figcaption></figure><figure class="c" data-s="honour guard of sixes  you may activate your favour even if you do not hold it. if you do hold it you may activate it twice; each activation is a separate action. relics (kingdom cards)"><img src="cards/kc15.webp" alt="Honour Guard of Sixes" loading="lazy" width="224" height="224"><figcaption><b>Honour Guard of Sixes</b><span>You may activate your Favour even if you do not hold it. If you do hold it you may activate it twice; each activation is a separate Action.</span></figcaption></figure><figure class="c" data-s="derelict manor  discard one of your cards from a council to increase your hand size by one. discard this card. relics (kingdom cards)"><img src="cards/kc16.webp" alt="Derelict Manor" loading="lazy" width="224" height="224"><figcaption><b>Derelict Manor</b><span>Discard one of your cards from a Council to increase your Hand Size by one. Discard this card.</span></figcaption></figure><figure class="c" data-s="monarch's seal-ring  on acquire: increase hand size by 1; when you no longer occupy this card decrease hand size by 1. whenever you win a clash in a region where you have an active heir, gain 1 influence. relics (kingdom cards)"><img src="cards/kc17.webp" alt="Monarch's Seal-Ring" loading="lazy" width="224" height="224"><figcaption><b>Monarch's Seal-Ring</b><span>On acquire: increase Hand Size by 1; when you no longer Occupy this card decrease Hand Size by 1. Whenever you win a Clash in a Region where you have an Active Heir, gain 1 influence.</span></figcaption></figure></div><h2>Secrets (Kingdom cards) <small>17</small></h2><div class="grid"><figure class="c" data-s="sky harbour  whenever any of your cards are removed from a council you may move them to your hand. whenever you journey with any of your cards you may move it to the bottom of your deck. secrets (kingdom cards)"><img src="cards/kc18.webp" alt="Sky Harbour" loading="lazy" width="224" height="224"><figcaption><b>Sky Harbour</b><span>Whenever any of your cards are removed from a Council you may move them to your Hand. Whenever you Journey with any of your cards you may move it to the bottom of your Deck.</span></figcaption></figure><figure class="c" data-s="rumours underground  choose any number of players; each moves all cards in their hand to the bottom of their deck (any order) then draws that many cards. secrets (kingdom cards)"><img src="cards/kc19.webp" alt="Rumours Underground" loading="lazy" width="224" height="224"><figcaption><b>Rumours Underground</b><span>Choose any number of players; each moves all cards in their Hand to the bottom of their Deck (any order) then draws that many cards.</span></figcaption></figure><figure class="c" data-s="cog-wing couriers  swap a card in your hand with one of your cards that is in a council or occupying a kingdom card. repeat the spring action of this card. secrets (kingdom cards)"><img src="cards/kc20.webp" alt="Cog-Wing Couriers" loading="lazy" width="224" height="224"><figcaption><b>Cog-Wing Couriers</b><span>Swap a card in your Hand with one of your cards that is in a Council or Occupying a Kingdom Card. Repeat the spring Action of this card.</span></figcaption></figure><figure class="c" data-s="tome of real names  reveal your hand. return to owners' hands all opponents' cards in the current clash that have the same printed strength and/or archetype as a card you revealed. discard this card. secrets (kingdom cards)"><img src="cards/kc21.webp" alt="Tome of Real Names" loading="lazy" width="224" height="224"><figcaption><b>Tome of Real Names</b><span>Reveal your Hand. Return to owners' Hands all opponents' cards in the current Clash that have the same printed Strength and/or Archetype as a card you revealed. Discard this card.</span></figcaption></figure><figure class="c" data-s="dead lamp  move any number of your supporters in the current region to either another unresolved region or your supply (player board). secrets (kingdom cards)"><img src="cards/kc22.webp" alt="Dead Lamp" loading="lazy" width="224" height="224"><figcaption><b>Dead Lamp</b><span>Move any number of your Supporters in the current Region to either another unresolved Region or your Supply (Player Board).</span></figcaption></figure><figure class="c" data-s="tavern keeper  choose a region; look at all face-down cards there. you may choose two of your face-down cards next to any regions and swap their positions. secrets (kingdom cards)"><img src="cards/kc23.webp" alt="Tavern Keeper" loading="lazy" width="224" height="224"><figcaption><b>Tavern Keeper</b><span>Choose a Region; look at all face-down cards there. You may choose two of your face-down cards next to any Regions and swap their positions.</span></figcaption></figure><figure class="c" data-s="chamberlain's ledger  move one of your active cards into a council. discard any number of cards in that council. discard this card. secrets (kingdom cards)"><img src="cards/kc24.webp" alt="Chamberlain's Ledger" loading="lazy" width="224" height="224"><figcaption><b>Chamberlain's Ledger</b><span>Move one of your Active cards into a Council. Discard any number of cards in that Council. Discard this card.</span></figcaption></figure><figure class="c" data-s="the ferryman  swap a card in your hand with one of your cards in the lost pile. secrets (kingdom cards)"><img src="cards/kc25.webp" alt="The Ferryman" loading="lazy" width="224" height="224"><figcaption><b>The Ferryman</b><span>Swap a card in your Hand with one of your cards in the Lost Pile.</span></figcaption></figure><figure class="c" data-s="crone of autumn  burn this card. then acquire up to two cards from the great road and occupy them with cards from your hand. secrets (kingdom cards)"><img src="cards/kc26.webp" alt="Crone of Autumn" loading="lazy" width="224" height="224"><figcaption><b>Crone of Autumn</b><span>Burn this card. Then acquire up to two cards from the Great Road and Occupy them with cards from your Hand.</span></figcaption></figure><figure class="c" data-s="herald of applause  when adjusting the order track at the start of the year, you choose the position of each marker on the track. secrets (kingdom cards)"><img src="cards/kc27.webp" alt="Herald of Applause" loading="lazy" width="224" height="224"><figcaption><b>Herald of Applause</b><span>When adjusting the Order Track at the Start of the Year, you choose the position of each marker on the track.</span></figcaption></figure><figure class="c" data-s="wax pretender  once per round you may activate an opponent's favour during its associated step. if that opponent currently holds the favour disc, do not rotate it. secrets (kingdom cards)"><img src="cards/kc28.webp" alt="Wax Pretender" loading="lazy" width="224" height="224"><figcaption><b>Wax Pretender</b><span>Once per Round you may activate an opponent's Favour during its associated Step. If that opponent currently holds the Favour disc, do not rotate it.</span></figcaption></figure><figure class="c" data-s="mirror of many faces  choose one of your active cards in the current clash. for the rest of the round it becomes a copy of any card in the lost pile, except its strength stays unchanged. secrets (kingdom cards)"><img src="cards/kc29.webp" alt="Mirror of Many Faces" loading="lazy" width="224" height="224"><figcaption><b>Mirror of Many Faces</b><span>Choose one of your Active cards in the current Clash. For the rest of the Round it becomes a copy of any card in the Lost Pile, except its Strength stays unchanged.</span></figcaption></figure><figure class="c" data-s="sirens' mere  choose a location. move any number of heralds to that location. discard this card. secrets (kingdom cards)"><img src="cards/kc30.webp" alt="Sirens' Mere" loading="lazy" width="224" height="224"><figcaption><b>Sirens' Mere</b><span>Choose a Location. Move any number of Heralds to that Location. Discard this card.</span></figcaption></figure><figure class="c" data-s="dawn-blue chime  move all your cards from the lost pile to the top or bottom of your deck, in any order. discard this card. secrets (kingdom cards)"><img src="cards/kc31.webp" alt="Dawn-Blue Chime" loading="lazy" width="224" height="224"><figcaption><b>Dawn-Blue Chime</b><span>Move all your cards from the Lost Pile to the top or bottom of your Deck, in any order. Discard this card.</span></figcaption></figure><figure class="c" data-s="rusted colossus  move one of your active cards to your hand. secrets (kingdom cards)"><img src="cards/kc32.webp" alt="Rusted Colossus" loading="lazy" width="224" height="224"><figcaption><b>Rusted Colossus</b><span>Move one of your Active cards to your Hand.</span></figcaption></figure><figure class="c" data-s="dead king's helm  whenever one of your cards is eliminated you may move it to your hand. secrets (kingdom cards)"><img src="cards/kc33.webp" alt="Dead King's Helm" loading="lazy" width="224" height="224"><figcaption><b>Dead King's Helm</b><span>Whenever one of your cards is Eliminated you may move it to your Hand.</span></figcaption></figure><figure class="c" data-s="dead king's gaze  bold: bold: discard your bidding card; place this card in your supply. when acquiring a card from the great road you may look at the top two face-down kingdom deck cards and treat them as face-up. secrets (kingdom cards)"><img src="cards/kc34.webp" alt="Dead King's Gaze" loading="lazy" width="224" height="224"><figcaption><b>Dead King's Gaze</b><span>Bold: Bold: Discard your Bidding card; place this card in your Supply. When acquiring a card from the Great Road you may look at the top two face-down Kingdom Deck cards and treat them as face-up.</span></figcaption></figure></div><h2>Oaths (Kingdom cards) <small>17</small></h2><div class="grid"><figure class="c" data-s="knives' fellowship  your heirs gain deadly (night) and retreat (day). when your heir eliminates one or more cards, gain 1 influence. if any active opponent follower is in a clash with your heir, eliminate your heir. oaths (kingdom cards)"><img src="cards/kc35.webp" alt="Knives' Fellowship" loading="lazy" width="224" height="224"><figcaption><b>Knives' Fellowship</b><span>Your Heirs gain Deadly (Night) and Retreat (Day). When your Heir Eliminates one or more cards, gain 1 influence. If any Active opponent Follower is in a Clash with your Heir, Eliminate your Heir.</span></figcaption></figure><figure class="c" data-s="village muster  your followers/cavalry gain deploy (1) (autumn). move a follower from your discard pile to your hand. oaths (kingdom cards)"><img src="cards/kc36.webp" alt="Village Muster" loading="lazy" width="224" height="224"><figcaption><b>Village Muster</b><span>Your Followers/Cavalry gain Deploy (1) (Autumn). Move a Follower from your Discard Pile to your Hand.</span></figcaption></figure><figure class="c" data-s="siege workshop  your cards with deploy(1) (autumn) also gain deploy(1) as a spring action. place 1 influence token on one of your active cards that has deploy. oaths (kingdom cards)"><img src="cards/kc37.webp" alt="Siege Workshop" loading="lazy" width="224" height="224"><figcaption><b>Siege Workshop</b><span>Your cards with Deploy(1) (Autumn) also gain Deploy(1) as a Spring action. Place 1 influence token on one of your Active cards that has Deploy.</span></figcaption></figure><figure class="c" data-s="grand joust  all players choose a card from hand and place it face-down; reveal. 1) all cards with the same strength are discarded. 2) the remaining card with highest strength wins. 3) return non-discarded cards to hands. the winner claims any location reward. discard this card. oaths (kingdom cards)"><img src="cards/kc38.webp" alt="Grand Joust" loading="lazy" width="224" height="224"><figcaption><b>Grand Joust</b><span>All players choose a card from Hand and place it face-down; reveal. 1) All cards with the same Strength are discarded. 2) The remaining card with highest Strength wins. 3) Return non-discarded cards to Hands. The winner claims any Location Reward. Discard this card.</span></figcaption></figure><figure class="c" data-s="goose-rider post  your heirs gain flank (day). oaths (kingdom cards)"><img src="cards/kc39.webp" alt="Goose-Rider Post" loading="lazy" width="224" height="224"><figcaption><b>Goose-Rider Post</b><span>Your Heirs gain Flank (Day).</span></figcaption></figure><figure class="c" data-s="concealed ways  swap one of your active cards in the current clash with one of your cards that is in a council or occupying a kingdom card. oaths (kingdom cards)"><img src="cards/kc40.webp" alt="Concealed Ways" loading="lazy" width="224" height="224"><figcaption><b>Concealed Ways</b><span>Swap one of your Active cards in the current Clash with one of your cards that is in a Council or Occupying a Kingdom Card.</span></figcaption></figure><figure class="c" data-s="banner marshal  your heirs gain deploy (1) (autumn). if your heir is eliminated, move it to your hand and discard this card. oaths (kingdom cards)"><img src="cards/kc41.webp" alt="Banner Marshal" loading="lazy" width="224" height="224"><figcaption><b>Banner Marshal</b><span>Your Heirs gain Deploy (1) (Autumn). If your Heir is Eliminated, move it to your Hand and discard this card.</span></figcaption></figure><figure class="c" data-s="rally standard  move up to two of your supporters from the map and/or lost pile to your player board. oaths (kingdom cards)"><img src="cards/kc42.webp" alt="Rally Standard" loading="lazy" width="224" height="224"><figcaption><b>Rally Standard</b><span>Move up to two of your Supporters from the Map and/or Lost Pile to your Player Board.</span></figcaption></figure><figure class="c" data-s="frozen bastion  bold: bold: discard your bidding card; place this card on a region. all opponents' total strength in this region is halved (rounded up). discard this card. oaths (kingdom cards)"><img src="cards/kc43.webp" alt="Frozen Bastion" loading="lazy" width="224" height="224"><figcaption><b>Frozen Bastion</b><span>Bold: Bold: Discard your Bidding card; place this card on a Region. All opponents' total Strength in this Region is halved (rounded up). Discard this card.</span></figcaption></figure><figure class="c" data-s="contraband gap  choose one of your active cards in the current clash; it gains retreat until end of clash. when that card retreats you may journey with it. oaths (kingdom cards)"><img src="cards/kc44.webp" alt="Contraband Gap" loading="lazy" width="224" height="224"><figcaption><b>Contraband Gap</b><span>Choose one of your Active cards in the current Clash; it gains Retreat until end of Clash. When that card Retreats you may Journey with it.</span></figcaption></figure><figure class="c" data-s="hunting-horn of the swans  choose one of your active cards in the current clash; it gains ambush until end of clash. oaths (kingdom cards)"><img src="cards/kc45.webp" alt="Hunting-Horn of the Swans" loading="lazy" width="224" height="224"><figcaption><b>Hunting-Horn of the Swans</b><span>Choose one of your Active cards in the current Clash; it gains Ambush until end of Clash.</span></figcaption></figure><figure class="c" data-s="blade that dreamed  gain +5 strength in the current clash. discard this card and its occupying card. oaths (kingdom cards)"><img src="cards/kc46.webp" alt="Blade That Dreamed" loading="lazy" width="224" height="224"><figcaption><b>Blade That Dreamed</b><span>Gain +5 Strength in the current Clash. Discard this card and its Occupying card.</span></figcaption></figure><figure class="c" data-s="broken gnomon  place this card on a region and discard your occupying card. skip the day and night steps of all clashes in this card's region (for the round). discard this card. oaths (kingdom cards)"><img src="cards/kc47.webp" alt="Broken Gnomon" loading="lazy" width="224" height="224"><figcaption><b>Broken Gnomon</b><span>Place this card on a Region and discard your Occupying card. Skip the Day and Night steps of all Clashes in this card's Region (for the Round). Discard this card.</span></figcaption></figure><figure class="c" data-s="oddment band  unexhaust one of your tactics (follow any setup text on it). discard this card and its occupying card. oaths (kingdom cards)"><img src="cards/kc48.webp" alt="Oddment Band" loading="lazy" width="224" height="224"><figcaption><b>Oddment Band</b><span>Unexhaust one of your Tactics (follow any SETUP text on it). Discard this card and its Occupying card.</span></figcaption></figure><figure class="c" data-s="feast of thorns  bold: bold: discard your bidding card; place this card on a region. treat any printed information on opponents' cards in this region as blank, except strength and archetype. discard this card. oaths (kingdom cards)"><img src="cards/kc49.webp" alt="Feast of Thorns" loading="lazy" width="224" height="224"><figcaption><b>Feast of Thorns</b><span>Bold: Bold: Discard your Bidding card; place this card on a Region. Treat any printed information on opponents' cards in this Region as blank, except Strength and Archetype. Discard this card.</span></figcaption></figure><figure class="c" data-s="dead king's lance  choose one of your active cards in the current clash; it gains deadly until end of clash. discard this card and its occupying card. oaths (kingdom cards)"><img src="cards/kc50.webp" alt="Dead King's Lance" loading="lazy" width="224" height="224"><figcaption><b>Dead King's Lance</b><span>Choose one of your Active cards in the current Clash; it gains Deadly until end of Clash. Discard this card and its Occupying card.</span></figcaption></figure><figure class="c" data-s="dead king's aegis  choose one of your active cards in the current clash; it gains invulnerable until end of clash. discard this card. oaths (kingdom cards)"><img src="cards/kc51.webp" alt="Dead King's Aegis" loading="lazy" width="224" height="224"><figcaption><b>Dead King's Aegis</b><span>Choose one of your Active cards in the current Clash; it gains Invulnerable until end of Clash. Discard this card.</span></figcaption></figure></div>
