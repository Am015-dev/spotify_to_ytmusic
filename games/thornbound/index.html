<style>
/* ===== Board-first shell (shared by every game on the shelf) =====
   The page never scrolls. The board fills what the bar and the dock leave; the dock is in flow (never over the board);
   everything else opens in a closable popup (drawer). Games theme it with the --gx-* variables. */
:root{--gx-bar-h:48px;--gx-dock-w:clamp(300px,30vw,420px);--gx-bg:#10151c;--gx-bar:#0b1016;--gx-panel:#f4ecd8;--gx-ink:#231a10;--gx-line:rgba(0,0,0,.25);--gx-accent:#e0a948;--gx-shadow:0 20px 60px rgba(0,0,0,.5);--gx-radius:14px}
html.gx,html.gx body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
.gx-app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--gx-bg)}
.gx-bar{min-height:var(--gx-bar-h);display:flex;align-items:center;gap:6px;padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px));overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;z-index:6}
.gx-bar::-webkit-scrollbar{display:none}
.gx-bar .gx-sp{flex:1 0 8px}
.gx-main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--gx-dock-w);position:relative}
.gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr) 0}
.gx-board{position:relative;min-width:0;min-height:0;overflow:hidden}
.gx-dock{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.gx-dock-head{display:flex;align-items:center;gap:6px;padding:6px 8px 4px;flex:0 0 auto}
.gx-dock-head .gx-dt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-dock-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gx-app.gx-dock-min .gx-dock{visibility:hidden}

.gx-ibtn{appearance:none;border:1px solid var(--gx-line);background:rgba(255,255,255,.08);color:inherit;border-radius:10px;min-width:40px;min-height:40px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;justify-content:center;cursor:pointer;font:inherit;white-space:nowrap}
.gx-ibtn:focus-visible,.gx-drawer button:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
.gx-ibtn .gx-n{font-size:.72rem;opacity:.8}
.gx-ibtn.gx-reopen{position:absolute;right:10px;top:10px;z-index:5;display:none}
.gx-app.gx-dock-min .gx-ibtn.gx-reopen{display:inline-flex}
/* popups */
.gx-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.gx-scrim.on{opacity:1;pointer-events:auto}
.gx-drawer{position:fixed;z-index:41;top:calc(var(--gx-bar-h) + 8px + env(safe-area-inset-top,0px));right:8px;bottom:8px;width:min(520px,calc(100vw - 16px));display:flex;flex-direction:column;background:var(--gx-panel);color:var(--gx-ink);border-radius:var(--gx-radius);box-shadow:var(--gx-shadow);transform:translateX(calc(100% + 16px));transition:transform .22s ease;visibility:hidden}
.gx-drawer.on{transform:none;visibility:visible}
.gx-drawer.wide{width:min(980px,calc(100vw - 16px))}
.gx-drawer-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--gx-line);flex:0 0 auto}
.gx-drawer-head h2{margin:0;font-size:1.15rem;flex:1;min-width:0}
.gx-x{appearance:none;border:0;background:transparent;font-size:1.6rem;line-height:1;cursor:pointer;color:inherit;min-width:40px;min-height:40px;border-radius:10px}
.gx-drawer-body{flex:1;min-height:0;overflow:auto;padding:10px 12px 16px;overscroll-behavior:contain}
/* narrow screens: the dock becomes a sheet under the board (still in flow), the drawers slide up from the bottom */
@media (max-width:999px){
  .gx-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr)}
  .gx-dock{max-height:var(--gx-sheet-h,46dvh);border-radius:var(--gx-radius) var(--gx-radius) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-app.gx-sheet-full .gx-dock{max-height:78dvh}
  .gx-app.gx-dock-min .gx-dock{visibility:visible;max-height:none}
  .gx-app.gx-dock-min .gx-dock-body{display:none}
  .gx-reopen{display:none!important}
  .gx-grab{display:block;width:44px;height:5px;border-radius:3px;background:currentColor;opacity:.35;margin:0 auto}
  .gx-drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88dvh;height:88dvh;border-radius:var(--gx-radius) var(--gx-radius) 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-drawer.wide{width:auto}
  .gx-hide-narrow{display:none!important}
}
@media (min-width:1000px){.gx-grab{display:none}}
@media (prefers-reduced-motion:reduce){.gx-drawer,.gx-scrim{transition:none}}

<script>
// ===== Board-first shell: dock toggle, sheet sizing, closable popups (drawers) =====
const GX={key:'gx',open:null,
  init(o){this.key=o&&o.key||'gx';document.documentElement.classList.add('gx');const app=document.querySelector('.gx-app');this.app=app;
    let min=false;try{min=localStorage.getItem(this.key+'_dockmin')==='1'}catch(e){}if(min)app.classList.add('gx-dock-min');
    if(!document.querySelector('.gx-scrim')){const s=document.createElement('div');s.className='gx-scrim';s.addEventListener('click',()=>this.close());document.body.appendChild(s);this.scrim=s}
    document.addEventListener('click',e=>{const t=e.target.closest('[data-gx]');if(!t)return;const a=t.dataset.gx;
      if(a==='dock')this.toggleDock();else if(a==='sheet')this.cycleSheet();else if(a==='close')this.close();else this.toggle(a)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&this.open){this.close();e.stopImmediatePropagation()}},true);
    // resize hook for boards
    const b=document.querySelector('.gx-board');if(b&&window.ResizeObserver)new ResizeObserver(()=>{for(const f of this._rs)try{f(b.clientWidth,b.clientHeight)}catch(e){}}).observe(b)},
  _rs:[],onResize(f){this._rs.push(f)},
  boardSize(){const b=document.querySelector('.gx-board');return b?{w:b.clientWidth,h:b.clientHeight}:{w:innerWidth,h:innerHeight}},
  toggleDock(force){const min=force!=null?!force:!this.app.classList.contains('gx-dock-min');this.app.classList.toggle('gx-dock-min',min);this.app.classList.remove('gx-sheet-full');try{localStorage.setItem(this.key+'_dockmin',min?'1':'0')}catch(e){}},
  // phone sheet: min -> normal -> full -> min
  cycleSheet(){const a=this.app;if(a.classList.contains('gx-dock-min')){this.toggleDock(true)}else if(!a.classList.contains('gx-sheet-full'))a.classList.add('gx-sheet-full');else{a.classList.remove('gx-sheet-full');this.toggleDock(false)}},
  showDock(){if(this.app&&this.app.classList.contains('gx-dock-min'))this.toggleDock(true)},
  toggle(id){if(this.open===id)this.close();else this.show(id)},
  show(id){const d=document.getElementById(id);if(!d)return;if(this.open&&this.open!==id){const o=document.getElementById(this.open);if(o)o.classList.remove('on')}
    this.open=id;d.classList.add('on');this.scrim&&this.scrim.classList.add('on');this._back=document.activeElement;
    for(const b of document.querySelectorAll('[data-gx="'+id+'"]'))b.setAttribute('aria-expanded','true');
    const f=d.querySelector('.gx-x');if(f)f.focus({preventScroll:true});if(this.onShow)this.onShow(id)},
  close(){if(!this.open)return;const id=this.open;const d=document.getElementById(this.open);if(d)d.classList.remove('on');for(const b of document.querySelectorAll('[data-gx="'+this.open+'"]'))b.setAttribute('aria-expanded','false');this.open=null;this.scrim&&this.scrim.classList.remove('on');if(this._back&&this._back.focus)this._back.focus({preventScroll:true});if(this.onClose)this.onClose(id)},
  // build a drawer shell around a body element: <div class=gx-drawer id><head><h2>title</h2><button.gx-x></head><body/></div>
  drawer(id,title,bodyEl,wide){let d=document.getElementById(id);if(!d){d=document.createElement('section');d.id=id;d.className='gx-drawer'+(wide?' wide':'');d.setAttribute('role','dialog');d.setAttribute('aria-label',title);

    d.querySelector('h2').textContent=title;if(bodyEl){const b=d.querySelector('.gx-drawer-body');if(bodyEl.parentNode!==b){b.innerHTML='';b.appendChild(bodyEl)}}return d}};

<script>
// ---------- PerfHUD: one speed tool for every game on the shelf ----------
// 1. an optional overlay (FPS, frame time avg/p95, level, draws/triangles, heap, dpr, render size): menu "Show speed", ?fps=1 or F9
// 2. "Test speed": 2 s per graphics level with a slow camera orbit, then a result card with Apply and Copy report
// 3. the standard auto step-down: p95 > 50 ms for 3 s steps down a level, then the pixel ratio (floor 0.6);
//    10 s with p95 work < 14 ms steps back up, at most once a minute; a level picked by hand is never changed
// 4. the idle-frame saver: nothing animating and no input for 1.5 s -> PerfHUD.raf() runs at 10 fps (or only on demand)
// Plain script, no modules. Safe in jsdom and without WebGL or requestAnimationFrame: nothing runs and the overlay never shows.
(function(root){
  'use strict';
  const HAS_DOM=typeof window!=='undefined'&&typeof document!=='undefined';
  const UA=(typeof navigator!=='undefined'&&navigator.userAgent)||'';
  const JSDOM=/jsdom/i.test(UA);
  const now=()=>(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  const RAF=HAS_DOM&&!JSDOM&&typeof window.requestAnimationFrame==='function'?window.requestAnimationFrame.bind(window):null;
  const LIVE=!!RAF;
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const NAMES={high:'High',medium:'Medium',med:'Medium',low:'Low'};
  const WIN=2000;                         // stats window (ms)
  const RULE={down:50,downFor:3000,up:14,upFor:10000,upEvery:60000,grace:2000,prStep:.8,prFloor:.6,idleAfter:1500};

  // registered game hooks
  const H={game:'',renderer:null,levels:['high','medium','low'],setLevel:null,getLevel:null,orbit:null,isAuto:null,isAnimating:null,
    onPixelRatio:null,beforeTest:null,anchor:null,corner:'bl',idleMode:'throttle',idleFps:10,autoTop:null,names:null};
  let registered=false;
  // measurement
  let S=[],lastT=0,workAcc=0,workSeen=0,drawn=0,loopOn=false,lastEval=0,lastHud=0;
  // controller
  const C={slowSince:0,fastSince:0,lastUp:-1e9,grace:0,prCap:null,log:[]};
  // idle saver
  let idleOn=false,lastInput=now(),lastIdleDraw=0,pollT=0;const pending=new Set();
  // test
  let testing=false,testT0=0,testLen=0,collect=null;
  // ui
  let hudOn=false,hud=null,card=null,pill=null;

  // ---------- stats ----------
  function pct(a,p){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);return b[Math.min(b.length-1,Math.floor(p*(b.length-1)+.5))]}
  function stats(list){const L=list||S;const n=L.length;if(!n)return {n:0,fps:0,avg:0,p95:0,work:0,refresh:16.7};
    const dts=L.map(s=>s.dt),span=Math.max(1,L[n-1].t-L[0].t+L[0].dt);const ws=L.filter(s=>s.w>=0).map(s=>s.w);
    return {n,fps:n*1000/span,avg:dts.reduce((a,b)=>a+b,0)/n,p95:pct(dts,.95),work:ws.length?pct(ws,.95):-1,refresh:Math.max(4,pct(dts,.1))}}
  function levelName(l){return (H.names&&H.names[l])||NAMES[l]||String(l)}
  function curLevel(){try{return H.getLevel?H.getLevel():null}catch(e){return null}}
  function auto(){try{return H.isAuto?!!H.isAuto():true}catch(e){return false}}
  function animating(){try{return H.isAnimating?!!H.isAnimating():true}catch(e){return true}}
  function pr(){try{return H.renderer?H.renderer.getPixelRatio():(HAS_DOM?window.devicePixelRatio||1:1)}catch(e){return 1}}

  // ---------- the measuring loop: one rAF callback per display frame while the game is awake ----------
  function startLoop(){if(!LIVE||loopOn)return;loopOn=true;lastT=0;RAF(tick)}
  function tick(t){
    if(idleOn&&!testing&&!hudOn){loopOn=false;lastT=0;return}
    RAF(tick);
    if(typeof document!=='undefined'&&document.hidden){lastT=0;S=[];return}
    if(lastT&&!idleOn){const dt=t-lastT;const w=workSeen?workAcc:-1;S.push({t,dt,w});if(collect)collect.push({t,dt,w})}
    lastT=t;workAcc=0;workSeen=0;
    while(S.length&&t-S[0].t>WIN)S.shift();
    if(testing&&H.orbit){try{H.orbit(Math.min(1,(now()-testT0)/testLen))}catch(e){}}
    if(t-lastEval>250){lastEval=t;control(t)}
    if(hudOn&&t-lastHud>500){lastHud=t;drawHud()}
    if(!testing&&!idleOn&&H.isAnimating&&now()-lastInput>RULE.idleAfter&&!animating())idle(true);
  }

  // ---------- auto step-down / step-up ----------
  function note(s){C.log.push(Math.round(now())+' '+s);if(C.log.length>20)C.log.shift()}
  function hitch(ms){C.grace=now()+(ms==null?RULE.grace:ms);C.slowSince=C.fastSince=0;S=[]}
  function applyPR(){if(!H.renderer)return;try{const base=H.basePR?H.basePR():pr();const v=C.prCap==null?base:Math.min(base,C.prCap);
      if(H.onPixelRatio)H.onPixelRatio(v);else H.renderer.setPixelRatio(v)}catch(e){}}
  function control(t){
    const T=now();
    if(!H.setLevel||!H.getLevel){return}
    if(!auto()){if(C.prCap!=null){C.prCap=null;applyPR()}C.slowSince=C.fastSince=0;return}
    if(testing||idleOn||T<C.grace||(typeof document!=='undefined'&&document.hidden)){C.slowSince=C.fastSince=0;return}
    const st=stats();if(st.n<4&&!(st.n>=1&&st.avg>RULE.down*4))return; // very slow frames (>200 ms, e.g. 3 s in SwiftShader) leave fewer than 4 in the 2 s window: they still count as slow
    if(st.p95>RULE.down){C.fastSince=0;if(!C.slowSince)C.slowSince=T;else if(T-C.slowSince>=RULE.downFor)stepDown(st);return}
    C.slowSince=0;
    // "under 14 ms": the game's own work per frame when it reports it (PerfHUD.raf), and every display frame on time
    // (a 60 Hz display never shows intervals under 16.7 ms, so without work numbers "every frame on time" stands in for it)
    const onTime=st.p95<=Math.max(RULE.up,st.refresh*1.3+1);const fast=onTime&&(st.work>=0?st.work<RULE.up:true);
    if(fast){if(!C.fastSince)C.fastSince=T;else if(T-C.fastSince>=RULE.upFor&&T-C.lastUp>=RULE.upEvery)stepUp(st)}else C.fastSince=0}
  function stepDown(st){const L=H.levels,i=L.indexOf(curLevel());C.slowSince=0;
    if(i>=0&&i<L.length-1){note('down '+L[i]+'->'+L[i+1]+' p95 '+st.p95.toFixed(0));set(L[i+1],'auto');hitch();return}
    if(!H.renderer)return;const cur=C.prCap==null?pr():C.prCap;if(cur<=RULE.prFloor+1e-3)return;
    C.prCap=Math.max(RULE.prFloor,Math.round(cur*RULE.prStep*100)/100);note('pixel ratio '+C.prCap);applyPR();hitch()}
  function stepUp(st){const L=H.levels,i=L.indexOf(curLevel());C.fastSince=0;const T=now();
    if(C.prCap!=null){const base=H.basePR?H.basePR():C.prCap/RULE.prStep;const v=Math.round(C.prCap/RULE.prStep*100)/100;C.prCap=v>=base-1e-3?null:v;note('pixel ratio up '+(C.prCap||'full'));applyPR();C.lastUp=T;hitch();return}
    const top=H.autoTop!=null?Math.max(0,L.indexOf(typeof H.autoTop==='function'?H.autoTop():H.autoTop)):0;
    if(i>top){note('up '+L[i]+'->'+L[i-1]+' work '+st.work.toFixed(1));set(L[i-1],'auto');C.lastUp=T;hitch()}}
  function set(l,why){try{H.setLevel(l,why)}catch(e){}}
  // the resolution cap the controller wants; games pass their own pixel ratio through this in their resize code
  function pixelRatio(want){return C.prCap==null?want:Math.min(want,C.prCap)}

  // ---------- idle-frame saver ----------
  function raf(fn){if(!RAF)return 0;
    const run=ts=>{const t0=now();if(idleOn)lastIdleDraw=t0;try{fn(ts)}finally{workAcc+=now()-t0;workSeen++;drawn++}};
    if(idleOn&&!testing){if(H.idleMode==='demand'){pending.add({fn:run,to:0});return -1}

    if(on){note('idle');if(!pollT)pollT=setInterval(()=>{if(testing||animating())idle(false)},250);if(hudOn)drawHud()}
    else{if(pollT){clearInterval(pollT);pollT=0}for(const e of pending){clearTimeout(e.to);RAF(e.fn)}pending.clear();lastT=0;hitch(400);startLoop()}}
  function wake(){lastInput=now();if(idleOn)idle(false)}

  // ---------- overlay ----------
  const CSS='#perfhud{position:fixed;z-index:2147483000;pointer-events:none;left:8px;top:8px;margin:0;padding:4px 7px;border-radius:7px;background:rgba(8,12,16,.62);color:#dff3e4;'+
    'font:600 11px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;opacity:.72;contain:content;text-shadow:0 1px 0 #000;user-select:none}'+
    '#perfhud b{color:#fff}#perfhud .w{color:#ffcf6e}#perfhud .bad{color:#ff8f7e}'+
    '.phud-card{position:fixed;z-index:2147483001;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box;padding:14px 16px;border-radius:12px;'+
    'background:#12181e;color:#e9eef2;border:1px solid #3a4652;box-shadow:0 12px 40px rgba(0,0,0,.55);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}'+
    '.phud-card h3{margin:0 0 8px;font-size:16px}.phud-card table{width:100%;border-collapse:collapse;margin:4px 0 10px;font-variant-numeric:tabular-nums}'+
    '.phud-card td,.phud-card th{padding:3px 4px;text-align:right;border-bottom:1px solid #26303a}.phud-card td:first-child,.phud-card th:first-child{text-align:left}'+
    '.phud-card tr.phud-rec td{color:#9ff0b0;font-weight:700}.phud-card .phud-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}'+

// ===================== The Thornbound Throne: rules engine =====================
// Plain JS, no dependencies. Works in the browser (global TB) and in node (require('./engine.js') after data.js).
// G is ONE serialisable object (JSON-safe, no functions). All randomness goes through G.rng (mulberry32), so a game is a pure function
// of (seed, sequence of moves). Engine steps that still have to run sit on the agenda G.ag as {h:handlerKey,d:data}; the one thing the
// game is waiting for is G.q (a "question"): either one seat, or several seats answering simultaneously and secretly (bids, face-down cards).
// Public API (all take G first):  TB.newGame(opts)  TB.moves(G,seat)  TB.apply(G,move)  TB.pending(G)  TB.view(G,seat)  TB.stripView(G,seat)
//                                 TB.scores(G)  TB.invariants(G)  TB.describe(G)   plus TB.card(id,G) helpers for the UI.
// Card ids: faction card = seat*100+k (k 0..13 basic, 14..18 site of power). Kingdom cards are the ints 1..51. Locations 0..5
// (castle, wilderness, harvest field, battlefield, shrine, necropolis); location l belongs to region l>>1.
(function(g){
const TB=g.TB=g.TB||{};const D=TB.DATA;
let G=null;
const COUNCILS=D.COUNCILS,NLOC=6,NREG=3;
const LEN={short:4,standard:5,extended:6};
// ---------------------------------------------------------------- rng
function rnd(n){let t=(G.rng=(G.rng+0x6D2B79F5)|0);t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return Math.floor(((t^t>>>14)>>>0)/4294967296*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const x=a[i];a[i]=a[j];a[j]=x}return a}
const clone=o=>JSON.parse(JSON.stringify(o));
const own=id=>(id/100)|0;
function stat(k){G.stats[k]=(G.stats[k]||0)+1}
function lg(t,seat,c){G.logN++;G.log.push({i:G.logN,r:G.round,t,s:seat==null?-1:seat,c:c||''});if(G.log.length>600)G.log.splice(0,G.log.length-600)}
const nm=s=>G.pl[s].name;
const FN=s=>D.FNAME[G.pl[s].fac];
// ---------------------------------------------------------------- card data
function cdef(id){const s=own(id),k=id%100;return k<14?D.BASIC[k]:D.SITE[G.pl[s].fac][k-14]}
function cname(id){if(id<0)return 'a hidden card';const k=id%100;return k<14?D.BASICNAMES[G.pl[own(id)].fac][k]:cdef(id).nm}
const KCD=n=>D.KC[n-1];
const kname=n=>KCD(n).nm;
const NOMOD={};
function cm(id){return G.cmod[id]||(G.cmod[id]={})}
// where is a card (active region index) -> -1 when not Active
function regOf(id){for(let r=0;r<NREG;r++)if(G.reg[r].up.includes(id))return r;return -1}
function downReg(id){for(let r=0;r<NREG;r++)if(G.reg[r].down.includes(id))return r;return -1}
const holds=(s,n)=>G.pl[s].ks.some(x=>x&&x.kc===n);
const hqHas=(P,def)=>P.hq.some(id=>cdef(id).id===def);
const holdsHQ=(s,def)=>hqHas(G.pl[s],def);
const isHeirCard=id=>eff(id).ar==='heir';
function blankLvl(id){const r=regOf(id);if(r<0)return 0;const sd=own(id);let b=0;
  for(const k of G.reg[r].kc){if(k.n===49&&k.o!==sd){b=Math.max(b,2);stat('kc49')}}
  if(G.clash&&G.clash.r===r&&cdef(id).ar!=='heir'){for(let o=0;o<G.np;o++){if(o===sd)continue;for(const c of (G.clash.cards[o]||[]))if(cdef(c).fx.includes('hedge')){b=1}}}
  return b}
// effective card information: strength, archetype, traits, commands, effect codes, votes, lore
function eff(id){const sd=own(id),m=G.cmod[id]||NOMOD,d=cdef(id),src=m.copy!=null?cdef(m.copy):d,bl=blankLvl(id);
  const tr=new Set(),cmd={},fx=new Set();let s=d.s,ar=bl===1?'':src.ar,v=bl?0:src.v,l=bl?0:src.l;
  const addCm=(c)=>{const o=cmd[c.n];if(!o)cmd[c.n]={n:c.n,x:c.x||0,self:!!c.self};else{if((c.x||0)>o.x)o.x=c.x;if(!c.self)o.self=false}};
  if(!bl){for(const t of src.tr)tr.add(t);for(const c of src.cm)addCm(c);for(const f of src.fx)fx.add(f)}
  if(m.add)for(const a of m.add){const ad=cdef(a);s+=ad.s;if(!bl){for(const t of ad.tr)tr.add(t);for(const c of ad.cm)addCm(c);for(const f of ad.fx)fx.add(f)}}
  if(m.gt)for(const t of m.gt)tr.add(t.t);
  if(m.gc)for(const c of m.gc)addCm(c);
  // global grants from what the owner holds (these are "gained", never blanked)
  const P=G.pl[sd];
  if(holds(sd,1))tr.add('path');
  if(hqHas(P,'cln_hq2')&&!tr.has('res'))tr.add('res');
  const a=ar;
  if(a==='heir'){if(holds(sd,35)){addCm({n:'deadly'});addCm({n:'retreat'})}if(holds(sd,39))addCm({n:'flank'});if(holds(sd,41))addCm({n:'deploy',x:1});
    if(G.rm.mandate.includes(sd))tr.add('inv');if(G.rm.lanes.includes(sd))addCm({n:'deadly'})}
  if(a==='trader'&&hqHas(P,'cln_hq1'))addCm({n:'flank'});
  if((a==='follower'||a==='cavalry')&&holds(sd,36))addCm({n:'deploy',x:1});
  if(hqHas(P,'nob_hq')&&d.v===0)v+=1;
  if(a==='follower'&&holds(sd,3))v+=(G.order[0]===sd?1:2);
  if(holds(sd,8)&&d.l===1&&!bl)l+=1;
  return {s,ar:a,tr,cm:cmd,fx,v,l}}
const strOf=id=>eff(id).s;
const hasCmd=(id,n)=>!!eff(id).cm[n];
// ---------------------------------------------------------------- zones
function removeFrom(arr,x){const i=arr.indexOf(x);if(i>=0){arr.splice(i,1);return true}return false}
// take a faction card out of whatever zone holds it (returns the zone name); the caller puts it somewhere else
function detach(id){const sd=own(id),P=G.pl[sd];let z=null;
  for(const k of ['hand','deck','disc','site','hq']){if(removeFrom(P[k],id)){z=k;break}}
  if(!z){for(let r=0;r<NREG;r++){if(removeFrom(G.reg[r].up,id)){z='up';break}if(removeFrom(G.reg[r].down,id)){z='down';break}}}
  if(!z){for(const c of COUNCILS)if(removeFrom(G.council[c],id)){z='council';break}}
  if(!z&&removeFrom(G.lost,id))z='lost';
  if(!z&&removeFrom(G.burned,id))z='burned';
  if(!z){for(let s=0;s<G.np;s++){const ks=G.pl[s].ks;for(let i=0;i<ks.length;i++)if(ks[i]&&ks[i].occ===id){ks[i].occ=null;z='occ';break}if(z)break}}
  if(!z){for(let s=0;s<G.np;s++)if(G.pl[s].bid===id){G.pl[s].bid=null;z='bid';break}}
  if(!z&&G.limbo.includes(id)){removeFrom(G.limbo,id);z='limbo'}
  if(G.clash){for(const s in G.clash.cards)removeFrom(G.clash.cards[s],id);removeFrom(G.clash.added,id)}
  const m=G.cmod[id];if(m){if(z==='up'||z==='council'){m.tok=0}}
  for(const s in G.peek)removeFrom(G.peek[s],id);
  return z}
function enforceHand(seat){now('enforceHand',{seat})}
function toHand(seat,id){const P=G.pl[seat];detach(id);if(P.hand.length>=P.hs){P.deck.unshift(id);lg(nm(seat)+' has no room in hand: '+cname(id)+' goes on top of their deck.',seat)}else P.hand.push(id)}
function toDisc(id){detach(id);G.pl[own(id)].disc.push(id)}
function toLost(id){detach(id);G.lost.push(id)}
function toBurn(id){detach(id);G.burned.push(id)}
function toDeckTop(id){detach(id);G.pl[own(id)].deck.unshift(id)}
function toDeckBottom(id){detach(id);G.pl[own(id)].deck.push(id)}
// Active card leaves the map: remove tokens & fix up
function leaveActive(id){const m=G.cmod[id];if(m)m.tok=0}
// ---------------------------------------------------------------- resources
function gainInf(seat,n,why){if(n<=0)return 0;G.pl[seat].inf+=n;stat('inf');if(why){const k='src:'+G.pl[seat].fac+':'+why;G.stats[k]=(G.stats[k]||0)+n}if(why)lg(nm(seat)+' gains '+n+' Influence ('+why+').',seat);return n}
function stealInf(thief,victim,n){const a=Math.min(n,G.pl[victim].inf);if(a<=0)return 0;G.pl[victim].inf-=a;G.pl[thief].inf+=a;lg(nm(thief)+' steals '+a+' Influence from '+nm(victim)+'.',thief);return a}
function loseInf(seat,n){const a=Math.min(n,G.pl[seat].inf);G.pl[seat].inf-=a;return a}
function gainLore(seat,n,why){if(n<=0)return;G.pl[seat].lore+=n;stat('lore');if(why)lg(nm(seat)+' gains '+n+' Lore ('+why+').',seat);now('siteBuy',{seat})}
function setHS(seat,v){const P=G.pl[seat];const nv=Math.max(3,Math.min(8,v));if(nv!==v)stat('hsClamp');P.hs=nv}
// ---------------------------------------------------------------- agenda / questions
function now(h,d){G.ag.splice(G.agI++,0,{h,d:d||{}})}
function later(h,d){G.ag.push({h,d:d||{}})}
const AG={},PICKH={},SELH={},QH={};
function mkq(kind,title,seats,simul,ctx){return {kind,title,seats:seats.slice(),simul:!!simul,o:{},ctx:ctx||{},got:{}}}
// one seat picks one option. opts: [{k,label,...}] (k unique). Answer calls PICKH[h](seat,opt,ctx)
function askPick(seat,kind,title,opts,h,ctx){if(!opts.length)return false;const q=mkq(kind,title,[seat],false,ctx);q.h=h;q.t='pick';
  q.o[seat]=opts.map(o=>Object.assign({t:'pick'},o));G.q=q;return true}
// one seat picks any number of items in order. items: [{v,label}]. Answer calls SELH[h](seat,chosenValues,ctx)
function askSel(seat,kind,title,items,h,ctx,lim){lim=lim||{};const q=mkq(kind,title,[seat],false,ctx);q.h=h;q.t='sel';q.items=items;q.chosen=[];q.budget=lim.budget||null;q.min=lim.min||0;q.max=lim.max==null?items.length:lim.max;
  if(q.max>items.length)q.max=items.length;if(q.min>q.max)q.min=q.max;
  if(!items.length){return false}
  buildSel(q,seat);G.q=q;return true}
function buildSel(q,seat){const o=[];const spent=q.budget?q.chosen.reduce((t,c)=>t+q.budget.cost[c],0):0;const left=q.items.filter(it=>!q.chosen.some(c=>c===it.v)&&(!q.budget||q.budget.cost[it.v]<=q.budget.cap-spent));
  if(q.chosen.length<q.max)for(const it of left)o.push({t:'sel',k:'s:'+it.v,v:it.v,label:it.label});
  if(q.chosen.length>=q.min)o.push({t:'seldone',k:'done',label:q.chosen.length?'Done ('+q.chosen.length+' chosen)':'Choose none'});
  q.o[seat]=o}
// a yes/no style helper
function askYN(seat,kind,title,yes,no,h,ctx){return askPick(seat,kind,title,[{k:'yes',label:yes,yes:1},{k:'no',label:no,yes:0}],h,ctx)}
function flow(){let n=0;while(G&&G.phase!=='over'&&!G.q&&G.ag.length){if(n++>6000)throw new Error('agenda runaway');const x=G.ag.shift();G.agI=0;if(!AG[x.h])throw new Error('no agenda handler '+x.h);AG[x.h](x.d)}G.agI=0}
// ---------------------------------------------------------------- order helpers
const pos=s=>G.order.indexOf(s);
function seatsFrom(list){return list.slice().sort((a,b)=>pos(a)-pos(b))}
const others=s=>G.order.filter(x=>x!==s);
const cardsOfSeatActive=s=>{const o=[];for(let r=0;r<NREG;r++)for(const id of G.reg[r].up)if(own(id)===s)o.push(id);return o};
const regionName=r=>D.RNAMES[r];
const locName=l=>D.LOCS[l][1];
const councilName=c=>D.COUNCIL_NAMES[c];
const votesOf=id=>eff(id).v;
function cvotes(seat,c){let v=0;for(const id of G.council[c])if(own(id)===seat)v+=votesOf(id);const mk=G.cmk[c][seat];v+=mk[0];if(G.council.relics.concat(G.council.secrets,G.council.oaths).some(id=>own(id)===seat&&cdef(id).fx.includes('whisperer')))v+=mk[1];return v}
function slotOf(seat,n){return G.pl[seat].ks.findIndex(x=>x&&x.kc===n)}
const occCount=s=>G.pl[s].ks.filter(x=>x&&x.occ!=null).length;

// ---------------------------------------------------------------- setup
const newRM=()=>({masonry:[],tempests:-1,lanes:[],mandate:[],lock:{}});
TB.newGame=function(o){o=o||{};const pls=o.players||[];const np=pls.length;if(np<2||np>4)throw new Error('The Thornbound Throne is for 2 to 4 players (solo mode is not built yet).');
  const seed=o.seed!=null?(o.seed>>>0):Math.floor(Math.random()*2147483647);const len=LEN[o.length]?o.length:'standard';
  G={v:1,seed,rng:seed,np,len,rounds:LEN[len],round:0,phase:'setup',step:'',order:[],pl:[],reg:[],council:{relics:[],secrets:[],oaths:[]},cmk:{relics:[],secrets:[],oaths:[]},
    lost:[],burned:[],kburn:[],limbo:[],klimbo:[],road:[0,0,0,0],kdeck:[],kdisc:[],fav:{h:-1,u:3},cmod:{},rm:newRM(),used:{},cord:[],clash:null,peek:{},loc:[],bstr:[],bq:[],taken:false,
    ag:[],agI:0,q:null,log:[],logN:0,stats:{},over:null,bidRev:false};
  for(let r=0;r<NREG;r++)G.reg.push({up:[],down:[],took:[],kc:[],done:false,n:0});
  for(let l=0;l<NLOC;l++)G.loc.push({kc:[]});
  for(const c of COUNCILS)for(let i=0;i<np;i++)G.cmk[c].push([0,0]);
  for(let i=0;i<np;i++){const f=pls[i].faction;if(D.FACTIONS.indexOf(f)<0)throw new Error('unknown faction '+f);
    const P={seat:i,name:pls[i].name||D.FSHORT[f],ai:pls[i].ai||null,fac:f,inf:0,lore:0,hs:6,hand:[],deck:[],disc:[],site:[],hq:[],ks:[null,null,null],sup:[],
      tac:D.TACTICS[f].map(t=>({ex:false,mk:t.mk,burn:false})),herald:-1,supp:{b:5,r:[0,0,0],x:[0,0,0],l:0},mk:[0,0,0,0,0,0],bid:null,gate:0};
    G.pl.push(P);G.peek[i]=[];
    for(let k=14;k<19;k++)P.site.push(i*100+k);
    const deck=[];for(let k=0;k<13;k++)deck.push(i*100+k);shuffle(deck);P.deck=deck;P.hand=[i*100+13];
    while(P.hand.length<6)P.hand.push(P.deck.shift())}
  G.order=o.order?o.order.slice():shuffle([...Array(np).keys()]);
  G.kdeck=shuffle([...Array(51).keys()].map(x=>x+1));
  for(let i=3;i>=0;i--)G.road[i]=G.kdeck.shift();
  lg('The Thornbound Throne begins: '+np+' players, '+G.rounds+' rounds ('+len+'). Order: '+G.order.map(s=>nm(s)).join(', ')+'.');

// ---------------------------------------------------------------- API
function setG(x){G=x}
TB.pending=function(Gx){return Gx.q?{seats:Gx.q.seats.slice(),kind:Gx.q.kind,title:Gx.q.title,simul:Gx.q.simul,type:Gx.q.t}:null};
TB.moves=function(Gx,seat){if(!Gx.q||!Gx.q.seats.includes(seat))return [];return (Gx.q.o[seat]||[]).map(o=>Object.assign({seat},o))};
TB.question=function(Gx,seat){const q=Gx.q;if(!q||!q.seats.includes(seat))return null;return {kind:q.kind,title:q.title,type:q.t,simul:q.simul,seats:q.seats.slice(),max:q.max,chosen:q.chosen?q.chosen.slice():undefined}};
TB.apply=function(Gx,mv){G=Gx;
  try{const q=G.q;if(!q)return {ok:false,err:'nothing is pending'};const seat=mv&&mv.seat;
    if(!q.seats.includes(seat))return {ok:false,err:'not your decision'};
    const opt=(q.o[seat]||[]).find(o=>o.k===mv.k);if(!opt)return {ok:false,err:'illegal move'};
    G.agI=0;const log0=G.logN;answer(q,seat,opt);flow();
    return {ok:true,log:G.log.filter(e=>e.i>log0)}}
  catch(e){return {ok:false,err:e.message,exc:true,stack:e.stack}}};
function answer(q,seat,opt){
  if(q.t==='pick'){G.q=null;PICKH[q.h](seat,opt,q.ctx)}
  else if(q.t==='sel'){if(opt.t==='sel'){q.chosen.push(opt.v);if(q.chosen.length<q.max){buildSel(q,seat);return}}G.q=null;SELH[q.h](seat,q.chosen,q.ctx)}
  else if(q.t==='menu'){G.q=null;QH.menu(seat,opt,q.ctx)}
  else if(q.t==='simul'){const S=SIM[q.h];if(S.ans(q,seat,opt)){removeFrom(q.seats,seat);delete q.o[seat]}if(!q.seats.length){G.q=null;S.fin(q)}}
  else throw new Error('bad question type')}
const SIM={};
// ---------------------------------------------------------------- round skeleton
AG.roundStart=()=>{G.round++;G.phase='start';G.step='';G.rm=newRM();G.used={};G.cord=[];G.clash=null;G.bidRev=false;G.taken=false;
  for(const R of G.reg){R.took=[];R.done=false;R.n=0}
  lg('Round '+G.round+' of '+G.rounds+' begins.',null,'big');
  later('startYear');later('bidPlace');later('bidReveal');later('bidOrder');later('bidNext');later('bidEnd');later('heralds',{i:0});later('placeCards');
  later('menus',{step:'spring',i:0});later('clashOrder');later('regionLoop',{i:0});later('menus',{step:'autumn',i:0});later('winter')};
// ---------------------------------------------------------------- start of the year
function attrition(seat){const P=G.pl[seat];stat('attrition');
  P.deck=P.deck.concat(shuffle(P.disc.splice(0)));
  const si=P.sup.indexOf(4);
  if(si>=0){stat('kc4');P.sup.splice(si,1);G.kdisc.push(4);lg(nm(seat)+' suffers Attrition: the Veiled Patron is discarded instead of losing hand size.',seat,'warn')}
  else{if(P.hs>3){P.hs--;lg(nm(seat)+' suffers Attrition: their Discard Pile becomes a new Deck and hand size drops to '+P.hs+'.',seat,'warn')}else lg(nm(seat)+' suffers Attrition: their Discard Pile becomes a new Deck (hand size is already at the minimum).',seat,'warn')}}
function drawUp(seat){const P=G.pl[seat];let att=false;while(P.hand.length<P.hs){if(!P.deck.length){if(att)break;att=true;attrition(seat);if(!P.deck.length)break;continue}P.hand.push(P.deck.shift())}if(P.hand.length>P.hs)enforceHand(seat)}
function drawN(seat,n){const P=G.pl[seat];let att=false;for(let i=0;i<n&&P.hand.length<P.hs;i++){if(!P.deck.length){if(att)break;att=true;attrition(seat);if(!P.deck.length)break}P.hand.push(P.deck.shift())}if(P.hand.length>P.hs)enforceHand(seat)}

SELH.discardDown=(seat,ch)=>{for(const id of ch)toDisc(id);lg(nm(seat)+' discards '+ch.length+' card'+(ch.length>1?'s':'')+' to fit their hand size.',seat);enforceHand(seat)};

  askPick(d.seat,'applause','Herald of Applause: who takes place '+(d.chosen.length+1)+' on the Order Track?',d.left.map(s=>({k:'s'+s,who:s,label:nm(s)+' ('+G.pl[s].inf+' Influence)'})),'applause',d)};
PICKH.applause=(seat,opt,d)=>{const left=d.left.filter(x=>x!==opt.who);now('applause',{seat:d.seat,left,chosen:d.chosen.concat([opt.who])})};

function bidStrOf(seat){const P=G.pl[seat];if(P.bid==null)return -1;let s=strOf(P.bid);if(holds(seat,5))s+=5;return s}

AG.bidOrder=()=>{G.step='bidres';G.bq=G.order.filter(s=>G.pl[s].bid!=null).sort((a,b)=>G.bstr[b]-G.bstr[a]||pos(a)-pos(b));G.bfirst=true};
function canSteal(seat,s2,j){const T=G.pl[s2].ks[j];if(!T||T.occ==null)return false;if(holds(seat,5))return false;
  const bid=G.pl[seat].bid;let mine=G.bstr[seat]+(holds(seat,9)?3:0);let theirs=strOf(T.occ)+(holds(s2,5)?5:0);if(cdef(bid).fx.includes('steal0'))theirs=0;return mine>theirs}
function bidOpts(seat){const o=[];G.road.forEach((kc,i)=>{if(kc)o.push({t:'take',k:'gr:'+i,kc,i,label:'Take '+kname(kc)+' from the Great Road'})});

<script>
// ===================== The Thornbound Throne: computer players =====================
// Three levels, one rule: a computer seat decides only from what its seat may know. Every decision first builds a "world" with TB.poison():
// a copy of the game in which everything the seat cannot see (rivals' hands, every deck order, face-down cards it has not peeked at, unrevealed
// bids, the RNG) is replaced by a random arrangement consistent with the seat's view. Heuristics below read only the seat's own cards and
// public information, so their result does not depend on which hidden world was drawn; the hard level uses the sampled worlds on purpose.
//   easy   : plays the heuristics 55% of the time, otherwise a random legal move; never plans ahead.
//   normal : the heuristics (region values, Kingdom Card values, ambush/retreat/flank logic, Govern/Journey economy, Herald placement).
//   hard   : heuristics plus determinised rollouts: for the big hidden-information decisions (bid, face-down cards, Herald, clash order, tied
//            Clash, Day actions, Great Road choice) it samples worlds consistent with its view, plays each candidate to the end of the round
//            with the normal policy for everybody, and keeps the best average result. Time-boxed (default 220 ms per decision).
// API: TB.AI.choose(G,seat,level) -> a move from TB.moves(G,seat);  TB.AI.step(G) plays every pending computer seat once;

<script>
// ---------- NetRoom: free peer-to-peer game rooms (WebRTC through Trystero, MIT) ----------
// Players find each other through public Nostr relays; after that the moves go browser to browser.
// The room object has the same shape as the claude.ai "room" capability, so a game's net code runs on either:
//   lobby.join(name) -> room {presence(o), on(type,fn), emit(type,data), onPeers(fn), onConnection(fn), leave()}
//   messages: {peer, data, isMe:false, by}   peers: {peer, isMe, sameTab, kind:'viewer', presence, by, guest:false}
// Tests can point it at a local relay with window.NETROOM_RELAYS=['ws://127.0.0.1:17700'].
const NetRoom=(()=>{
  const APP='game-night-shelf-v1';
  const rand=n=>{const a='abcdefghijkmnpqrstuvwxyz23456789',u=new Uint8Array(n);crypto.getRandomValues(u);return [...u].map(x=>a[x%a.length]).join('')};
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  let myUid=null;
  function uid(){if(myUid)return myUid;myUid=store.get('gns-uid');if(!myUid){myUid='p'+rand(15);store.set('gns-uid',myUid)}return myUid}
  function name(){return (store.get('gns-name')||'').slice(0,24)}
  function setName(n){n=String(n||'').replace(/[<>&"]/g,'').trim().slice(0,24);store.set('gns-name',n);return n}
  function available(){return typeof Trystero!=='undefined'&&typeof RTCPeerConnection!=='undefined'&&!!(window.crypto&&crypto.subtle)}
  // invite codes: 5 letters/digits without look-alikes
  function newCode(){return rand(5)}
  function cleanCode(c){return String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10)}
  // one room per page: joining again (a retry, or another code) first closes the old room, so the host
  // can't stay connected to an abandoned copy while the game listens on the new one
  let active=null;
  function lobby(game){return {join:async roomName=>{if(active){const old=active;active=null;try{await old.leave()}catch(e){}await new Promise(r=>setTimeout(r,250))}
    const r=makeRoom(game,String(roomName));active=r;return r}}}
  function makeRoom(game,roomName){
    const cfg={appId:APP,password:game+'/'+roomName,relayConfig:{redundancy:6,warnOnRelayFailure:false}};
    if(window.NETROOM_RELAYS)cfg.relayConfig.urls=window.NETROOM_RELAYS;
    if(window.NETROOM_ICE)cfg.rtcConfig={iceServers:window.NETROOM_ICE};
    if(window.NETROOM_TURN)cfg.turnConfig=window.NETROOM_TURN;
    const tr=Trystero.joinRoom(cfg,game+'/'+roomName);
    const me=Trystero.selfId,by=uid();
    let pres={name:name()},left=false;
    const remote=new Map(),handlers={},peerFns=[],connFns=[];
    const gA=tr.makeAction('g'),pA=tr.makeAction('p');
    const entry=(p,v)=>({peer:p,isMe:false,sameTab:false,kind:'viewer',presence:v.presence,by:v.by,guest:false});
    const list=()=>[{peer:me,isMe:true,sameTab:true,kind:'viewer',presence:pres,by,guest:false},...[...remote].map(([p,v])=>entry(p,v))];
    const fire=(joined,gone)=>{const ch={peers:list(),joined,left:gone};peerFns.forEach(f=>{try{f(ch)}catch(e){console.error(e)}})};
    const sendPres=target=>{try{pA.send({pr:pres,by},target?{target}:undefined)}catch(e){}};
    const gone=new Set();
    tr.onPeerJoin=p=>{if(left)return;gone.delete(p);sendPres(p)};
    tr.onPeerLeave=p=>{if(left)return;gone.add(p);const v=remote.get(p);if(!v)return;remote.delete(p);fire([],[entry(p,v)])};
    pA.onMessage=(d,info)=>{const p=info&&info.peerId;if(left||!p||gone.has(p)||!d||typeof d!=='object')return;
      const pr=d.pr&&typeof d.pr==='object'&&!Array.isArray(d.pr)?Object.assign({},d.pr):{};if('name' in pr)pr.name=String(pr.name||'').replace(/[<>&"]/g,'').slice(0,24);
      const v={presence:pr,by:typeof d.by==='string'?d.by.slice(0,40):null};
      const old=remote.get(p);remote.set(p,v);if(!old){sendPres(p);fire([entry(p,v)],[]);return}
      // presence is re-sent every few seconds in case one was lost; only a real change is reported
      if(JSON.stringify(old)!==JSON.stringify(v))fire([],[])};
    gA.onMessage=(d,info)=>{const p=info&&info.peerId;if(left||!p||!d||typeof d.t!=='string')return;
      // a message can arrive just before that peer's presence does
      const v=remote.get(p)||{presence:{},by:null};(handlers[d.t]||[]).forEach(f=>{try{f({peer:p,data:d.d,isMe:false,by:v.by})}catch(e){console.error(e)}})};
    setTimeout(()=>connFns.forEach(f=>f(true)),0);
    const hb=setInterval(()=>{if(!left)sendPres()},5000);
    // closing the tab tells the others at once, instead of after WebRTC's ~10 s timeout
    const bye=()=>{if(left)return;left=true;clearInterval(hb);try{tr.leave()}catch(e){}};window.addEventListener('pagehide',bye);
    return {
      self:me,
      presence(o){pres=Object.assign({},pres,o||{});sendPres();fire([],[]);return Promise.resolve()},
      on(t,f){(handlers[t]=handlers[t]||[]).push(f)},
      emit(t,d){if(left)return Promise.resolve();try{return Promise.resolve(gA.send({t,d})).then(()=>{},()=>{})}catch(e){return Promise.resolve()}},
      sendTo(peer,t,d){if(left)return Promise.resolve();try{return Promise.resolve(gA.send({t,d},{target:peer})).then(()=>{},()=>{})}catch(e){return Promise.resolve()}},
      onPeers(f){peerFns.push(f);setTimeout(()=>f({peers:list(),joined:[],left:[]}),0)},
      onConnection(f){connFns.push(f)},
      peerCount(){return remote.size},
      leave(){window.removeEventListener('pagehide',bye);left=true;clearInterval(hb);try{return Promise.resolve(tr.leave())}catch(e){return Promise.resolve()}}};
  }
  // an invite link opens the game with the code filled in: …/game/#join-abcde
  function linkCode(){const m=/^#join-([a-z0-9]{3,10})$/i.exec(location.hash||'');return m?m[1].toLowerCase():''}
  function inviteLink(code){return location.href.split('#')[0]+'#join-'+code}
  return {available,lobby,uid,name,setName,newCode,cleanCode,linkCode,inviteLink};
})();

</script>

// ---------- online play: what one seat may be told (a WHITELIST) ----------
// netStrip(G, seat) builds a NEW object. Nothing is copied by default: every field that leaves the host's page is listed below, so a field the engine
// adds later is simply absent until somebody lists it. The engine's own TB.stripView does the hiding of other seats' hand / deck / face-down cards /
// unrevealed bid / Kingdom Deck order / question options (hidden-test.js proves it with a poison test); this file is the second wall: it drops
// rng, seed, the agenda, the stats counters (an empty object is sent) and anything unlisted, and keeps only the last 150 log lines.
// seat = -1 is a spectator (everything hidden). Pure function of (G, seat), no globals except TB.
const NET_TOP=['v','np','len','rounds','round','phase','step','order','reg','council','cmk','lost','burned','kburn','limbo','klimbo','road','kdisc','fav','cmod','rm','used','cord','loc','bq','taken','bidRev','bfirst','curReg'];
const NET_PL=['seat','name','ai','fac','inf','lore','hs','hand','deck','disc','site','hq','ks','sup','tac','herald','supp','mk','bid','gate'];
const NET_Q=['kind','title','seats','simul','t','h','o','ctx','items','chosen','budget','min','max','pl','st'];
const NET_CL=['r','parts','first','cards','added','used','bonus','n','skip','winner','tot','tied','tp'];
const NET_REG=['up','down','took','kc','done','n'];
function netPlain(x){ // deep copy of plain JSON data only (no functions, no prototypes)
  if(x===null||typeof x==='number'||typeof x==='boolean'||typeof x==='string')return x;
  if(Array.isArray(x))return x.map(netPlain);

  return null}

  const o=netPick(V,NET_TOP);
  o.seed=0;o.me=seat;o.ag=[];o.agI=0;o.stats={};   // stats: the engine's eff() bumps counters in it, so it must exist, but the host's numbers (they name revealed cards) are not sent
  o.pl=V.pl.map(p=>{const q=netPick(p,NET_PL);if(p.seat===seat&&Array.isArray(p.peek))q.peek=p.peek.slice();return q});
  o.reg=V.reg.map(R=>netPick(R,NET_REG));

  o.peek={};if(seat>=0)o.peek[seat]=(V.peek&&V.peek[seat]||[]).slice();
  o.clash=V.clash?netPick(V.clash,NET_CL):null;

<script>
// ---------- online play: free peer-to-peer rooms (net/netroom.js over WebRTC) ----------
// The HOST's page runs the game: it holds the real G (hands, decks, face-down cards, bids, the seeded RNG), runs the engine and the computer seats.
// Every other player's page only draws what ITS seat may see: after each change the host sends every peer its own copy of the state made by
// netStrip(G, seat) (src/netstrip.js, a whitelist: no rival hand, deck, face-down card or unrevealed bid, no Kingdom deck order, no seed or rng),
// compressed and cut into 3200-character chunks, throttled to 300 ms plus a 3 s heartbeat. A client sends back only {k: move key}; the host checks
// that the sender owns a human seat, that the seat is asked something and that TB.moves(G, seat) offers that key, and applies it through the same
// doMove() a local click uses. Anything else is ignored.
// Simultaneous decisions (bids, face-down cards) are the engine's own: G.q.seats lists the seats that have NOT answered yet, so everybody can see
// who is still deciding, and the answers stay in the host's G until the engine reveals them.
// Seats go to the players in join order (host = seat 0, then the next factions), empty seats go to the computer. A player who leaves is replaced
// by the computer (a pending question included) and gets the seat back when the same browser (NetRoom.uid) rejoins. Latecomers watch.
// If the HOST leaves the game is over ("The host left"): the others never hold the hidden state, so nobody can take over (no host migration).
// The host's own page also draws only its own hand (viewSeat() = my seat, no pass-the-device screen).

  seatPeer:[],seatUid:[],seatName:[],away:[],evLog:[],evId:0,evSeen:0,rk:null,recC:{},lastSent:{},lastLobby:'',lastTxt:'',pend:null,pendT:0,mid:0,pendN:0,ack:{},conn:null,lastSt:'',wasMine:false,

    seatPeer:[],seatUid:[],seatName:[],away:[],evLog:[],evId:0,evSeen:0,rk:null,recC:{},lastSent:{},lastLobby:'',lastTxt:'',pend:null,mid:0,pendN:0,ack:{},wasMine:false});

function playClash(ev,root){const panel=root.querySelector('#clp');if(!panel)return;const w=ev.winner;

    return {faction:FK[G.pl[s].fac],name:shortName(s)+(ids.length>1?' (+'+(ids.length-1)+')':'')+(ev.supp[s]?' +'+ev.supp[s]+' sup.':''),card:spec,strength:ev.tot[s],winner:w===s}});
  const sz=Math.max(70,Math.min(110,Math.floor((root.clientWidth-30)/Math.max(2,items.length))-14,UI.land?84:110));
  const cp=TBKit.clashPanel(panel,items,{size:sz,tie:w<0});UI._cp=cp;

const RULES_HTML=`<div class="rules">
<h3>The goal</h3><p>You lead one of four factions competing for the throne. The game lasts a fixed number of rounds (4, 5 or 6). When the last round ends, the player with the most <b>Influence</b> wins. Ties go to whoever holds the Kingdom's Favour, then to the better place on the Order Track.</p>
<h3>How a round goes</h3><ol class="rl">
<li><b>Start of the year.</b> Everyone refills their hand to their hand size. Players are ranked by Influence: the leader acts first.</li>
<li><b>Bids.</b> Everyone secretly picks one card as a bid. Its printed Strength is the bid. Highest first, each player may take a Kingdom Card from the Great Road, steal one from a rival whose occupying card is strictly weaker than their bid, or take their bid card back. A Kingdom Card you take sits on your board (at most two) with your bid card tucked under it.</li>
<li><b>Heralds.</b> In turn order each player puts their one Herald on any location. It is public, so it can be a bluff.</li>
<li><b>Face-down cards.</b> Everyone secretly plays one card next to each of the three regions. With fewer than three cards you place them all before the others.</li>
<li><b>Spring actions.</b> In turn order you may use Spring abilities. The universal one is sending Supporters from your board to a region: each adds 1 Strength in the first clash you fight there.</li>
<li><b>Summer: the clashes.</b> The player in last place sets the order of the three regions. For each region: flip the cards, use Day abilities in turn order (Ambush adds a face-down card from your hand, Retreat pulls cards back, Flank moves a card to another unresolved region), then Night effects (Deadly eliminates every opposing active card; an eliminated card goes to the shared Lost Pile unless it is Resilient or Invulnerable). Add up Strength: cards plus Supporters plus bonuses. Highest total wins. A tie lets the tied players each play one more card face-down or pass; if nobody plays, nobody wins.</li>
<li><b>Winning a clash.</b> The winner picks one of the region's two locations and gains its Influence and its bonus effect. If their Herald is on that location they also gain 1 Influence and steal 1 from every rival Herald standing there.</li>
<li><b>Autumn.</b> Once each you may <b>Govern</b> (move a hand card that has votes into one of three Councils) and <b>Journey</b> (send a hand card that shows Lore away, gain that much Lore, and spend Lore on your faction's Site of Power cards). Other Autumn abilities such as Rally and Deploy also work now.</li>
<li><b>Winter.</b> Heralds go home. Supporters on the map go to the Lost Pile. Every active card goes to its owner's discard pile, except cards that carry Influence tokens, which lose one token and stay.</li>
</ol>
<h3>Locations</h3><ul><li><b>Spire Court</b> +1 and Govern with a card from hand or the table (every other card in that Council is discarded).</li><li><b>Thornwild</b> +1 and Journey.</li><li><b>Gleaning Meadow</b> +1 and claim the Kingdom's Favour.</li><li><b>Cairn Field</b> +2, nothing else.</li><li><b>Moss Altar</b> +1 and put up to three cards at the bottom of your deck.</li><li><b>Ossuary</b> +1, reshuffle your discard pile and draw up to three from it.</li></ul>
<h3>Councils</h3><p>Cards with votes go into Councils. <b>Coin</b>: when you claim a Herald reward you may remove your cards there for extra Influence equal to their votes. <b>Whispers</b>: in Autumn spread markers on locations; four on one location claims its bonus effect. <b>Pledges</b>: in Autumn bring Supporters back from the map or the Lost Pile, one per vote, and one more for the strictly largest voter.</p>
<h3>Attrition</h3><p>If you must draw and your deck is empty, your discard pile becomes your new deck and your hand size drops by one (never below 3, never above 8). A short game of 4 or 5 rounds usually hits this around round 3.</p>
<h3>The Kingdom's Favour</h3><p>A disc with three uses. Claim it at the Gleaning Meadow. While you hold it you may use your faction's Favour action; each use spends one of three charges.</p>
<h3>Reading your cards</h3><p>Top left: Strength. Top right: the Lore cost (Site of Power cards only). Bottom line: votes and lore. Invulnerable cards cannot be eliminated, Resilient cards go to the discard instead of the Lost Pile, Pathfinder cards go to the discard when used for a Journey.</p>
<h3>On this screen</h3><p>The map is the game. Tap a location or a region's card slots for details; tap the throne for the Great Road and Councils. Tap a card in your hand for a large view and its actions. The step list under the map always shows where you are in the round, and the highlighted button is the recommendation of a strong computer player.</p>
</div>`;
function setupDrawers(){
  GX.drawer('rulesd','How to play',(()=>{const d=document.createElement('div');d.innerHTML=RULES_HTML;return d})(),true);
  GX.drawer('logd','Log',(()=>{const d=document.createElement('div');d.id='logbody';return d})());
  GX.drawer('boardd','My board and piles',(()=>{const d=document.createElement('div');d.id='boardbody';return d})());
  GX.drawer('setd','Menu',(()=>{const d=document.createElement('div');d.id='setbody';return d})());
  GX.onShow=id=>{if(id==='logd')renderLog();if(id==='setd')renderMenu();if(id==='boardd')renderBoardDrawer()}}
// ===================== part 6: sound, phone layout, boot, test hooks =====================
const SFXMAP={tap:'click',place:'place',flip:'flip',clash:'clash',win:'win',tie:'clash',inf:'influence',herald:'herald',bid:'bid',bell:'bell',fanfare:'fanfare',lose:'lose',err:'error'};
let _ac=null;
function synth(name){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;_ac=_ac||new AC();const c=_ac,o=c.createOscillator(),g=c.createGain();const f={tap:520,place:180,flip:400,clash:120,win:660,tie:300,inf:880,herald:260,bid:440,bell:330,fanfare:550,lose:150,err:100}[name]||400;
  o.frequency.value=f;o.type=name==='clash'?'sawtooth':'triangle';g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.18);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2)}catch(e){}}
function sfx(name){if(!UI.sound)return;const n=SFXMAP[name]||name;try{if(window.GA&&GA.has(n)){GA.play(n,{duck:['win','fanfare','clash','bell'].includes(n)});return}}catch(e){}synth(name)}
let _lastInf=null;
function snd(mv,res){if(!mv)return;const t=mv.t,k=G&&G.q?G.q.kind:'';
  if(t==='bid')sfx('bid');else if(t==='place')sfx('place');else if(t==='pick'&&mv.loc!=null&&k==='herald')sfx('herald');else if(t==='take'||t==='steal')sfx('bid');else sfx('tap');
  try{const inf=G.pl.reduce((a,p)=>a+p.inf,0);if(_lastInf!=null&&inf>_lastInf)setTimeout(()=>sfx('inf'),200);_lastInf=inf;if(G.over)setTimeout(()=>sfx(G.pl[G.over.winner].ai?'lose':'fanfare'),300)}catch(e){}}
function musicFor(){try{if(!window.GA||!UI.music)return;GA.music(G&&G.round>=G.rounds?'tense':'main',{fade:1.5})}catch(e){}}
// ---------------------------------------------------------------- phone mode
function phDetect(){try{const P=new URLSearchParams(location.search);if(P.has('phone'))return P.get('phone')!=='0'}catch(e){}
  const s=Math.min(innerWidth,innerHeight);if(s<=500)return true;let c=false;try{c=matchMedia('(pointer:coarse)').matches}catch(e){}return c&&s<=600}
function phApply(){const was=UI.phone;const on=phDetect();const root=document.documentElement;
  UI.phone=on;UI.land=innerWidth>innerHeight;root.classList.toggle('ph',on);root.classList.toggle('ph-p',on&&!UI.land);root.classList.toggle('ph-l',on&&UI.land);
  if(on){const W=innerWidth,H=innerHeight,bar=44;const bs=UI.land?H:Math.min(W,Math.max(Math.round(W*.75),H-bar-270));root.style.setProperty('--bs',bs+'px');root.style.setProperty('--bar','44px')}
  else root.style.removeProperty('--bs');
  if(was!==on&&G){UI.mapReset=true;renderAll()}}
function phoneRefresh(){}
let _rz=0;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{const l=UI.land,p=UI.phone;phApply();if(G&&UI.started)renderAll()},120)});
addEventListener('orientationchange',()=>setTimeout(()=>{phApply();if(G)renderAll()},200));
// ---------------------------------------------------------------- boot
function boot(){
  try{UI.sound=localStorage.getItem('tb_snd')!=='0';UI.music=localStorage.getItem('tb_mus')==='1';UI.lowGfx=localStorage.getItem('tb_gfx')==='low'}catch(e){}
  try{if(window.GA&&typeof GA_DATA!=='undefined'){GA.init({sfx:GA_DATA.sfx,music:GA_DATA.music,key:'tbt'});GA.setSfx(UI.sound);GA.setMusic(UI.music)}}catch(e){}
  try{if(window.PerfHUD)PerfHUD.register({game:'Thornbound Throne',levels:['high','low'],names:{high:'High',low:'Low'},getLevel:()=>UI.lowGfx?'low':'high',isAuto:()=>false,setLevel:(l,why)=>{if(why==='apply'){UI.lowGfx=l==='low';UI.mapReset=true;G&&renderAll()}},isAnimating:()=>UI.busy,anchor:'.gx-board',corner:'tl'})}catch(e){}
  GX.init({key:'tb'});setupDrawers();phApply();netInit();
  TBKit.ready.then(()=>{document.documentElement.classList.add('tb-ready');if(!UI.started)showStart()});
  document.addEventListener('pointerdown',()=>{try{if(window.GA)GA.unlock();if(UI.music)musicFor()}catch(e){}},{once:true})}
function startUiReady(){return TBKit.ready}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
