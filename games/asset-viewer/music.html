<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Music</title>
<style>
  :root { --bg: #111215; --card: #1d2025; --card2: #24272d; --line: #2d3138; --ink: #ecebe7; --mute: #9599a1; --dim: #6c7078; --accent: #f2b33d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex-wrap: wrap;
           background: rgba(17,18,21,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; } header h1 span { color: var(--accent); }
  nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; } nav.tabs a { text-decoration: none; padding: 6px 10px; border-radius: 7px; color: var(--mute); }
  nav.tabs a.on { background: var(--card2); color: var(--ink); } nav.tabs a:hover { color: var(--ink); }
  #sum { margin-left: auto; color: var(--dim); font-size: 12px; }
  main { padding: 18px 16px 60px; max-width: 1500px; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .head { display: flex; gap: 12px; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); }
  .head img, .head .ph { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--card2); flex: none; }
  .head h2 { font-size: 15px; margin: 0; } .head small { color: var(--mute); }
  .t { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .t:last-child { border-bottom: 0; }
  .t .nm { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; } .t .nm small { color: var(--dim); font-variant-numeric: tabular-nums; }
  audio { width: 100%; height: 32px; }
  .empty { color: var(--mute); padding: 40px; }
</style>
</head>
<body><div style="position:sticky;top:0;z-index:99;background:#3a2f12;color:#ffe9a8;font:13px system-ui;padding:6px 12px">Read-only snapshot of 13 Oct 2026 13:39. Voting and Flow runs work only in the local viewer.</div>
<header>
  <h1>Game <span>Music</span></h1>
  <nav class="tabs"><a href="board.html">Production</a><a href="assets.html">Assets</a><a href="screens.html">Screens</a><a href="anims.html">Animations</a><a class="on" href="music.html">Music</a><a href="games.html">Games</a><a href="../lab.html">🧪 LAB</a><a href="flow.html">Flow planner</a></nav>
  <span id="sum">loading…</span>
</header>
<main id="out"></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nice = g => g.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
// music.json: {game: {cover, tracks: [{name, url, kb}]}} (serve.py live, export_static.py for GitHub Pages)
fetch('music.json', { cache: 'no-cache' }).then(r => r.json()).then(M => {
  const games = Object.keys(M).sort(), n = games.reduce((a, g) => a + M[g].tracks.length, 0);
  $('sum').textContent = `${n} tracks in ${games.length} games`;
  if (!games.length) { $('out').innerHTML = '<div class="empty">No music folders found.</div>'; return; }
  $('out').innerHTML = games.map(g => `<section class="game"><div class="head">${M[g].cover ? `<img src="${esc(M[g].cover)}" alt="" loading="lazy">` : '<div class="ph"></div>'}
    <div><h2>${esc(nice(g))}</h2><small>${M[g].tracks.length} tracks</small></div></div>
    ${M[g].tracks.map(t => `<div class="t"><div class="nm"><span>${esc(t.name)}</span><small>${(t.kb / 1024).toFixed(1)} MB</small></div>
      <audio controls preload="none" src="${esc(t.url)}"></audio></div>`).join('')}</section>`).join('');
  // one track at a time
  document.addEventListener('play', e => document.querySelectorAll('audio').forEach(a => a !== e.target && a.pause()), true);
}).catch(() => { $('sum').textContent = 'music.json failed to load'; });
</script>
</body>
</html>
