<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crown City Smash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff3cf; --paper2:#ffe39a; --card:#fffaf0; --ink:#1a1320; --ink2:#4a3b52; --muted:#7b6c80;
  --red:#e63946; --yellow:#ffd23f; --blue:#3a86ff; --green:#2ec27e; --purple:#9b5de5; --orange:#ff8c42; --cyan:#4cc9f0;
  --sky1:#ffb347; --sky2:#ff6f61; --sea:#3aa6d9; --dot:rgba(26,19,32,.13); --shadow:#1a1320;
  --energy:#2ec27e; --heart:#e63946; --star:#f4a300; --claw:#1a1320;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#231a2e; --paper2:#3a2a4a; --card:#2e2340; --ink:#fff3dc; --ink2:#e2d3ee; --muted:#b3a3c0;
  --dot:rgba(255,243,220,.07); --shadow:#000; --claw:#fff3dc; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#231a2e; --paper2:#3a2a4a; --card:#2e2340; --ink:#fff3dc; --ink2:#e2d3ee; --muted:#b3a3c0;
  --dot:rgba(255,243,220,.07); --shadow:#000; --claw:#fff3dc; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font:600 16px/1.4 Nunito,"Trebuchet MS",sans-serif;
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:11px 11px}
h1,h2,h3,.bang{font-family:Bangers,Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.6rem 1.2rem;background:var(--red);color:#fff;border-bottom:4px solid #1a1320}
header h1{margin:0;font-size:2.3rem;line-height:1;color:var(--yellow);-webkit-text-stroke:1.5px #1a1320;text-shadow:3px 3px 0 #1a1320;transform:rotate(-1.5deg)}
header .sub{font-weight:800;opacity:.95}
header .spacer{flex:1}
header .btn{background:#fff;color:#1a1320}
.btn{border:3px solid #1a1320;background:var(--card);padding:.38rem .85rem;border-radius:10px;box-shadow:3px 3px 0 var(--shadow);font-weight:900;line-height:1.2;transition:transform .08s}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--yellow);color:#1a1320}
.btn.danger{background:var(--red);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-weight:700;font-size:.8rem;color:inherit;opacity:.8}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:1rem;padding:1rem 1.2rem;max-width:1560px;margin:0 auto}
@media (max-width:1020px){.wrap{grid-template-columns:1fr;padding:.6rem 16px}}
.board{min-width:0;position:relative}
#map{width:100%;height:auto;display:block;border:4px solid #1a1320;border-radius:14px;box-shadow:6px 6px 0 var(--shadow);background:#ffb347}
#banner{position:absolute;left:50%;top:14px;transform:translateX(-50%) rotate(-1deg);max-width:88%;background:#fff;color:#1a1320;border:3px solid #1a1320;border-radius:12px;padding:.35rem .9rem;box-shadow:4px 4px 0 #1a1320;font-weight:900;text-align:center;pointer-events:none;transition:opacity .3s}
#banner:empty{opacity:0}
#banner b{color:var(--red)}
.side{display:flex;flex-direction:column;gap:.85rem;min-width:0}
.box{background:var(--card);border:3px solid #1a1320;border-radius:14px;box-shadow:5px 5px 0 var(--shadow);padding:.7rem .85rem}
.box h3{margin:0 0 .4rem;font-size:1.45rem;line-height:1}
.muted{color:var(--muted)} .small{font-size:.88rem}
#prompt .who{font-family:Bangers,Impact,sans-serif;font-size:1.7rem;letter-spacing:.04em;line-height:1}
#prompt .msg{margin:.3rem 0 .2rem}
.acts{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.5rem}
.acts .btn{flex:1 1 auto;text-align:center}
.dicebox{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;min-height:66px}
.die{width:50px;height:50px;border-radius:12px;border:3px solid #1a1320;background:#fffdf5;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:3px 3px 0 var(--shadow);position:relative}
.die svg{width:36px;height:36px;display:block}
.die.kept{background:var(--yellow);transform:translateY(-4px);box-shadow:3px 7px 0 var(--shadow)}
.die.kept::after{content:"KEEP";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#1a1320;color:#fff;font:10px/1 Bangers,Impact,sans-serif;letter-spacing:.08em;padding:2px 5px;border-radius:5px}
.die.extra{border-color:var(--green);border-style:solid;outline:2px dashed var(--green);outline-offset:1px}
.die[disabled]{cursor:default}
.die.spin{animation:spin .45s ease-out}
@keyframes spin{0%{transform:rotate(-200deg) scale(.4);opacity:.2}70%{transform:rotate(12deg) scale(1.1)}100%{transform:none}}
.rolls{display:flex;gap:.35rem;align-items:center;margin-top:.55rem;font-weight:800}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid #1a1320;background:var(--yellow)}
.pip.used{background:transparent}
.market{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.pc{border:3px solid #1a1320;border-radius:12px;background:#fffdf5;color:#1a1320;display:flex;flex-direction:column;overflow:hidden;box-shadow:3px 3px 0 var(--shadow);min-height:168px}
.pc .hd{display:flex;align-items:center;gap:.3rem;padding:.25rem .35rem;background:var(--purple);color:#fff;border-bottom:3px solid #1a1320}
.pc.D .hd{background:var(--red)}
.pc .cost{flex:none;width:28px;height:28px;border-radius:50%;background:var(--energy);border:2.5px solid #1a1320;color:#fff;display:flex;align-items:center;justify-content:center;font:1.1rem/1 Bangers,Impact,sans-serif}
.pc .nm{font:1.02rem/1 Bangers,Impact,sans-serif;letter-spacing:.03em}
.pc .ty{font:.7rem/1 Bangers,Impact,sans-serif;letter-spacing:.08em;padding:.12rem .35rem;background:#1a1320;color:#fff;align-self:flex-start;margin:.3rem .35rem 0;border-radius:4px}
.pc p{margin:.25rem .4rem .3rem;font-size:.8rem;line-height:1.25;flex:1}
.pc .buy{margin:0 .35rem .35rem;padding:.2rem;font-size:.85rem}
.mine{display:flex;flex-direction:column;gap:.35rem}
.mc{border:2.5px solid #1a1320;border-radius:9px;padding:.25rem .5rem;background:#fffdf5;color:#1a1320;font-size:.85rem}
.mc b{font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:1.02rem;letter-spacing:.03em;color:var(--purple)}
.legend{display:grid;grid-template-columns:34px 1fr;gap:.3rem .5rem;align-items:center;font-size:.86rem}
.legend svg{width:30px;height:30px;border:2px solid #1a1320;border-radius:7px;background:#fffdf5}
#log{max-height:230px;overflow:auto;font-size:.86rem;margin:0;padding-left:1.1rem}
#log li{margin:.12rem 0}
#log li.me{font-weight:900}
.hidden{display:none!important}
#modal{position:fixed;inset:0;background:rgba(26,19,32,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--card);border:4px solid #1a1320;border-radius:18px;box-shadow:8px 8px 0 #1a1320;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:1rem 1.2rem}
.dlg h2{margin:0 0 .4rem;font-size:2rem;line-height:1;color:var(--red)}
.dlg .acts{flex-direction:column}
.dlg .acts .btn{text-align:left}
.start h2{font-size:2.8rem;color:var(--yellow);-webkit-text-stroke:1.5px #1a1320;text-shadow:3px 3px 0 #1a1320}
.row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.35rem 0}
.row .btn{padding:.25rem .6rem}
.row .btn.on{background:var(--yellow);color:#1a1320}
.monpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.4rem}
.monpick button{border:3px solid #1a1320;border-radius:12px;background:#fffdf5;padding:.2rem;box-shadow:3px 3px 0 var(--shadow)}
.monpick button.on{background:var(--yellow)}
.monpick svg{width:100%;height:auto;display:block}
.monpick span{display:block;font:.85rem/1 Bangers,Impact,sans-serif;letter-spacing:.04em;color:#1a1320;padding-bottom:.15rem}
@media (max-width:560px){.monpick{grid-template-columns:repeat(3,minmax(0,1fr))}.market{grid-template-columns:1fr}.pc{min-height:0}}
.hl{outline:5px solid var(--blue)!important;outline-offset:3px;position:relative;z-index:5}
#coach{border-color:var(--blue)}
#coach h3{color:var(--blue)}
.rules h3{margin:.8rem 0 .2rem;font-size:1.35rem;color:var(--purple)}
.rules p,.rules li{font-size:.93rem}
g.seat{cursor:pointer}
.score{display:none}
@media (max-width:700px){.score{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-top:.6rem}
 .sc{border:2.5px solid #1a1320;border-radius:9px;background:var(--card);font-size:.82rem;overflow:hidden}
 .sc b{display:block;color:#1a1320;padding:.05rem .4rem;font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.04em;border-bottom:2px solid #1a1320}
 .sc span{display:block;padding:.1rem .4rem;font-weight:900}
 .sc.on{outline:3px solid var(--yellow)} .sc.ko{opacity:.5}}
/* v2: guided steps, expansion, nicer pieces */
.steps{display:flex;gap:3px;margin:0 0 .5rem;flex-wrap:wrap}
.st{flex:1 1 0;min-width:52px;text-align:center;font:.78rem/1.1 Nunito,sans-serif;font-weight:900;border:2.5px solid #1a1320;border-radius:8px;padding:.18rem .1rem;background:#fffdf5;color:#7b6c80}
.st b{display:block;font:1.05rem/1 Bangers,Impact,sans-serif;letter-spacing:.04em}
.st.done{background:#d9f5e3;color:#1a1320}
.st.done b::after{content:" ✓"}
.st.on{background:var(--yellow);color:#1a1320;transform:translateY(-2px);box-shadow:2px 3px 0 #1a1320}
#prompt .head{font:1.3rem/1.1 Bangers,Impact,sans-serif;letter-spacing:.04em;margin:.3rem 0 .1rem;color:var(--red)}
.how{margin:.2rem 0 .3rem;padding-left:1.3rem}
.how li{margin:.12rem 0}
.tip{margin-top:.4rem;background:var(--paper2);color:#1a1320;border:2px dashed #1a1320;border-radius:9px;padding:.3rem .55rem;font-size:.9rem}
.preview{margin-top:.6rem;font-size:.9rem;background:#fffdf5;color:#1a1320;border:2.5px solid #1a1320;border-radius:9px;padding:.3rem .55rem}
.preview:empty{display:none}
.btn.primary:not([disabled]){animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:3px 3px 0 var(--shadow)}50%{box-shadow:3px 3px 0 var(--shadow),0 0 0 4px rgba(255,210,63,.55)}}
@media (prefers-reduced-motion:reduce){.btn.primary{animation:none!important}.die.spin{animation:none!important}}
.btn.cons{background:#e8f4ff;color:#1a1320}
.btn.evo{background:#e9ffe0;color:#1a1320}
.btn.cons small,.btn.evo small{font-size:.74rem}
.die{background:linear-gradient(160deg,#ffffff 0%,#fff6dc 70%,#f1e2b8 100%)}
.die.kept{background:linear-gradient(160deg,#fff4a8 0%,#ffd23f 70%,#f0b700 100%)}
.die.sm{width:40px;height:40px;border-width:2.5px;box-shadow:2px 2px 0 var(--shadow)}
.die.sm svg{width:28px;height:28px}
.mdice{display:flex;flex-wrap:wrap;gap:.35rem;margin:.2rem 0 .5rem}
.pc.C .hd{background:var(--blue)}
.pc .hd .cicon{margin-left:auto;flex:none}
.cicon{width:26px;height:26px;display:block;background:#fffdf5;border:2px solid #1a1320;border-radius:7px}
.pc.sugg{outline:4px solid var(--yellow);outline-offset:2px;position:relative}
.pc.sugg::before{content:"SUGGESTED";position:absolute;top:-11px;right:8px;background:#1a1320;color:var(--yellow);font:11px/1 Bangers,Impact,sans-serif;letter-spacing:.08em;padding:3px 6px;border-radius:5px;z-index:1}
.pc{overflow:visible}
.mc.C b{color:var(--blue)} .mc.E b{color:#23874f} .mc.M{background:#ffe3f2} .mc.M b{color:#b0306f}
.mc.hand{border-style:dashed}
.mc i{font-size:.75rem;color:#7b6c80}
.pass{background:var(--yellow);color:#1a1320;border:2.5px solid #1a1320;border-radius:9px;padding:.3rem .6rem;font-weight:900}
.monpick{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.pc .hd{border-radius:9px 9px 0 0}
/* v3: 3D stage */
.stage{display:none;position:relative;width:100%;border:4px solid #1a1320;border-radius:14px;box-shadow:6px 6px 0 var(--shadow);overflow:hidden;background:#2b1055}
body.three .stage{display:block}
body.three #map{display:none}
.stage canvas{display:block;cursor:pointer}
#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;background:#fffaf0;color:#1a1320;border:2.5px solid #1a1320;border-radius:10px;padding:.1rem .4rem .15rem;box-shadow:3px 3px 0 #1a1320;white-space:nowrap;font-size:.78rem;line-height:1.15;text-align:center;border-top:6px solid var(--mc)}
.tag b{display:block;font:1rem/1 Bangers,Impact,sans-serif;letter-spacing:.05em}
.tag b i{font:italic .7rem Nunito,sans-serif;background:#1a1320;color:#ffd23f;padding:0 .25rem;border-radius:4px;margin-left:.15rem}
.tag span{display:flex;gap:.25rem;justify-content:center;font-weight:900}
.tag em{font-style:normal}.tag .h{color:#e63946}.tag .v{color:#c98500}.tag .e{color:#1f9d5c}.tag .m{color:#b0306f}
.tag.on{background:var(--yellow);transform-origin:bottom center;box-shadow:0 0 0 3px #fff,4px 4px 0 #1a1320}
.tag.ko{opacity:.55;filter:grayscale(1)}
.tag.city{border-color:#e63946;border-top-color:var(--mc)}
@media (max-width:700px){.tag{font-size:.62rem;padding:0 .25rem}.tag b{font-size:.78rem}}
#hud{position:absolute;left:10px;bottom:10px;background:rgba(26,19,32,.82);color:#fff;border:2px solid #ffd23f;border-radius:10px;padding:.25rem .6rem;font-size:.85rem;font-weight:800;pointer-events:none;max-width:75%}
#hud b{font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.05em;color:#ffd23f;font-size:1rem}
.pop{position:absolute;transform:translate(-50%,-50%);font:1.7rem/1 Bangers,Impact,sans-serif;letter-spacing:.04em;-webkit-text-stroke:2px #1a1320;paint-order:stroke fill;pointer-events:none;animation:popup 1.5s ease-out forwards;text-shadow:3px 3px 0 #1a1320}
.pop.hurt{color:#ff4d5a;font-size:2.1rem}.pop.heal{color:#4be08a}.pop.star{color:#ffd23f}.pop.energy{color:#5cf0a0}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-260%) scale(1)}}
body.three #banner{top:12px}

@media (max-width:700px){#hud{font-size:.68rem;padding:.12rem .4rem;left:6px;bottom:6px}#hud b{font-size:.8rem}.pop{font-size:1.2rem}.pop.hurt{font-size:1.5rem}}

@media (max-width:1560px){header .sub{display:none}}
header .btn{padding:.3rem .65rem}
/* v5: expansions + UX */
.exps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.4rem;margin:.2rem 0 .5rem}
.ex{border:2.5px solid #1a1320;border-radius:10px;background:#fffdf5;color:#1a1320;text-align:left;padding:.3rem .5rem;box-shadow:2px 2px 0 var(--shadow)}
.ex b{display:block;font-size:.86rem}.ex small{display:block;font-size:.72rem;color:#5b4d60;line-height:1.2}
.ex.on{background:#d9f5e3;border-color:#1f9d5c}
.btn.mini{padding:.05rem .45rem;font-size:.75rem;margin-left:.3rem}
.die.sugg{outline:3px dashed #3a86ff;outline-offset:2px}
.die.sp-b{background:linear-gradient(160deg,#ffd0d0,#ff8f8f)}.die.sp-b.kept{background:linear-gradient(160deg,#fff4a8,#ffd23f)}
.die.sp-f{background:linear-gradient(160deg,#fff2c4,#f4c95d)}.die.sp-f.kept{background:linear-gradient(160deg,#fff4a8,#ffd23f)}
.mc.K{background:#efe3ff}.mc.K b{color:#6a2fc2}.mc.T b{color:#b35c00}.mc.W b{color:#b0306f}.mc.B{background:#ffe0e0}.mc.B b{color:#c1121f}
table.stats{width:100%;border-collapse:collapse;font-size:.86rem;margin:.4rem 0}
table.stats th,table.stats td{border-bottom:2px solid #1a1320;padding:.25rem .3rem;text-align:center}
table.stats td:first-child,table.stats th:first-child{text-align:left}
table.stats tr.win{background:var(--yellow);color:#1a1320}

/* v6: online */
.online{border:2.5px dashed #1a1320;border-radius:12px;padding:.45rem .6rem;margin:.6rem 0;background:#eef6ff;color:#1a1320}
.online input{border:2.5px solid #1a1320;border-radius:10px;padding:.3rem .5rem;font:inherit;width:9rem;text-transform:lowercase;background:#fff;color:#1a1320}
.code{font:1.8rem/1 Bangers,Impact,sans-serif;letter-spacing:.2em;background:var(--yellow);color:#1a1320;padding:.1rem .5rem;border:2.5px solid #1a1320;border-radius:8px}
.plist{margin:.2rem 0 .4rem;padding-left:1.2rem}.plist li{margin:.1rem 0}
.warn{background:#ffe0e0;color:#8a1020;border:2px solid #c1121f;border-radius:8px;padding:.3rem .5rem}
.emotes{display:flex;gap:.25rem;flex-wrap:wrap;width:100%;margin-top:.2rem}
.emotes .btn{font-size:1.1rem;padding:.1rem .45rem;flex:0 0 auto}
.pop.emote{font-size:3rem;-webkit-text-stroke:0;text-shadow:none}

/* v7: phones */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);color:var(--ink);border-top:4px solid #1a1320;box-shadow:0 -4px 0 rgba(26,19,32,.18);padding:.4rem 12px calc(.45rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.35rem}
#dock .dk-t{font:1.05rem/1.1 Bangers,Impact,sans-serif;letter-spacing:.04em;color:var(--red)}
#dock .dk-t span{font:800 .8rem Nunito,sans-serif;color:var(--muted,#7b6c80)}
#dock .dk-d{display:flex;gap:.5rem;overflow-x:auto;padding:4px 4px 6px}
#dock .dk-d .die{flex:0 0 auto;width:46px;height:46px}
#dock .dk-d .die svg{width:32px;height:32px}
#dock .dk-a{display:flex;gap:.4rem}
#dock .dk-a .btn{flex:1 1 0;min-height:48px;padding:.3rem .4rem;font-size:.95rem}
#dock .dk-a .btn small{display:block;font-size:.7rem}
@media (max-width:700px){
  header{flex-wrap:nowrap;overflow-x:auto;gap:.4rem;padding:.4rem 12px;scrollbar-width:none;position:sticky;top:0;z-index:30}
  header::-webkit-scrollbar{display:none}
  header h1{font-size:1.45rem;white-space:nowrap;flex:0 0 auto}
  header .btn{flex:0 0 auto;padding:.25rem .5rem;font-size:.85rem}
  header .spacer{display:none}
  body.docked #dicewrap{display:none}
  .wrap{padding:.5rem 12px}
  .stage{border-width:3px;border-radius:12px}
  .dlg{padding:.8rem .9rem;max-height:86vh}
  #modal{padding:10px;align-items:flex-end}
  .btn{min-height:40px}
}
#dock .dk-p{font-size:.8rem;font-weight:800;line-height:1.2}

</style>
</head>
<body>
<header>
  <h1>Crown City Smash</h1>
  <span class="sub">Roll, smash and stomp your way to 20 stars</span>
  <span class="spacer"></span>
  <button class="btn" data-a="snd" id="sndbtn" title="Sound effects">🔊</button>
  <button class="btn" data-a="mus" id="musbtn" title="Background music">🎵 On</button>
  <button class="btn" data-a="speed" id="speedbtn" title="How fast the computer plays">⏩ Normal</button>
  <button class="btn" data-a="pause" id="pausebtn" title="Pause the computer (P)">⏸</button>
  <button class="btn" data-a="hints" id="hintbtn" title="Dice hints">💡 On</button>
  <button class="btn" data-a="tour">Tour</button>
  <button class="btn" data-a="rules">Rules</button>
  <button class="btn" data-a="new">New game</button>
</header>
<div class="wrap">
  <div class="board">
    <div id="stage" class="stage"><canvas id="c3"></canvas><div id="tags"></div><div id="hud"></div></div>
    <svg id="map" viewBox="0 0 1000 640" role="img" aria-label="The city arena and the monsters"></svg>
    <div id="banner"></div>
    <div id="score" class="score"></div>
  </div>
  <div class="side">
    <div id="coach" class="box hidden"></div>
    <div id="prompt" class="box"></div>
    <div id="dicewrap" class="box"><h3>Dice</h3><div id="dice" class="dicebox"></div><div id="rolls" class="rolls"></div><div id="preview" class="preview"></div></div>
    <div id="marketwrap" class="box"><h3>Power cards for sale</h3><div id="market" class="market"></div></div>

  for(let k=1;k<n;k++){const j=(i+k)%n;if(G.pl[j].alive){r=j;break}}for(let k=1;k<n;k++){const j=(i-k+n)%n;if(G.pl[j].alive){l=j;break}}return [...new Set([l,r].filter(x=>x!==null&&x!==i))]}

// ---------- setup ----------
function newGame(mode,n,mon){
  n=n||UI.n||DEFN;mon=(mon===undefined?UI.mon:mon);const xp=UI.xp||DEFX,evoOn=UI.evo;
  const pool=[0,1,2,3,4,5,6,7,8].filter(m=>xp!=='base'||m<6);
  const others=shuffle(pool.filter(m=>m!==mon));
  const mons=mode==='solo'?[mon,...others]:shuffle(pool.slice());
  const lvl=UI.lvl||DEFLV;const pl=[];for(let i=0;i<n;i++)pl.push({i,m:mons[i],hp:10,vp:0,en:0,mb:xp==='base'?0:1,cards:[],evo:[],hand:[],edeck:[],alive:true,human:mode==='hot',tok:{},lvl:LVMIX?LVMIX[i%LVMIX.length]:lvl,cult:0,wk:0});
  if(mode==='solo'){const seat=rnd(n);const hm=pl[0].m;pl[0].m=pl[seat].m;pl[seat].m=hm;pl[seat].human=true}
  if(mode==='net'){const used=new Set();const desc=NET.seats.slice(0,n).map(h=>{let m=h.mon;if(!(Number.isInteger(m)&&pool.includes(m))||used.has(m))m=null;if(m!==null)used.add(m);return Object.assign({},h,{m})});
    const free=shuffle(pool.filter(m=>!used.has(m)));desc.forEach(h=>{if(h.m===null)h.m=free.pop()});
    const all=[...desc,...Array.from({length:n-desc.length},()=>({m:free.pop(),peer:null}))];shuffle(all);
    all.forEach((h,i)=>Object.assign(pl[i],{m:h.m,human:!!h.peer,peer:h.peer||null,uid:h.uid||null}))}
  pl.forEach(p=>p.edeck=shuffle([0,1,2,3,4,5]));
  const deck=xp==='exp'?MBDECK.slice():xp==='trial'?[...BASEDECK,...MBDECK]:BASEDECK.slice();
  const ex=Object.assign({},DEFEX||UI.ex||{});ex.evo=evoOn;
  G={gid:Math.random(),ex,mode,n,xp,evoOn,pl,city:-1,bay:-1,bayOn:n>=5,deck:shuffle(deck),disc:[],market:[],dice:[],rolls:0,phase:'start',active:0,turn:1,tid:0,log:[],winner:null,winText:'',tf:{},less:0,rollId:0,step:1};
  refill();UI.choice=null;UI.roll=null;UI.pick=null;UI.busy=false;UI.info=false;UI.fx={};UI.banner='';UI.stats=false;clearTimeout(UI.statsT);
  lg(-1,`A new rampage begins with ${n} monsters: ${pl.map(mname).join(', ')}.`);
  if(xp!=='base')lg(-1,`Mindbug ${xp==='exp'?'Experience (only the new cards)':'Trial (new cards mixed in)'}: every monster starts with 1 Mindbug token.`);
  if(evoOn)lg(-1,'Evolutions are on: resolve three hearts to draw an evolution card.');
  if(G.bayOn)lg(-1,'With 5 or more monsters, the Harbor is open as a second city space.');
  const on=EXPS.filter(e=>e.k!=='evo'&&ex[e.k]).map(e=>e.n);if(on.length)lg(-1,'Expansions: '+on.join(', ')+'.');
  exSetup(()=>startTurn());
}

// ---------- asking (humans get a modal, computers answer at once) ----------
function ask(i,title,text,options,aiPick,cb,extra){
  if(isHuman(i)&&!G.winner){UI.choice=Object.assign({title,text,options,cb,who:i},extra||{});render();return}
  cb(aiPick())}
function seq(list,fn,done){let k=0;const next=()=>{if(k>=list.length){done();return}fn(list[k++],next)};next()}

// ---------- turn flow ----------
function startTurn(){
  if(G.winner)return;
  const p=cur();G.phase='start';G.tid++;G.tf={dealt:0,culler:false,ones:false};G.bugBy=-1;G.step=1;UI.banner='';
  alive().forEach(q=>{if(q.i!==p.i)q.tok.shield=false});
  const flyers=alive().filter(q=>q.i!==p.i&&has(q,'wings')&&q.en>=2);
  seq(flyers,(q,next)=>ask(q.i,'Membrane Wings',`${mname(p)} is about to take a turn. Pay 2 energy to take no damage from it this turn?`,
      [{k:'y',l:'Spread wings (pay 2 ⚡)',d:`You have ${q.en} energy.`},{k:'n',l:'Save the energy'}],
      ()=>aiWings(q,p)?'y':'n',k=>{if(k==='y'){q.en-=2;q.tok.shield=true;lg(q.i,`${mname(q)} spreads its wings against ${mname(p)}.`)}next()}),
    ()=>{
      if(inTokyo(p.i)){const b=2+has(p,'street');gainVP(p,b);lg(p.i,`${mname(p)} starts in ${where(p.i)} and gains ${b} stars.`)}
      if(has(p,'pen'))gainE(p,has(p,'pen'));
      exStartTurn(p);
      if(checkWin(false)){refresh();return}
      if(!p.alive){endTurn();return}
      const nd=Math.max(1,6+has(p,'skull')-G.less);G.less=0;
      G.dice=[];for(let k=0;k<nd;k++)G.dice.push({f:FACES[rnd(6)],k:false,x:k>=6});G.dice.push(...exDice(p));
      G.rolls=Math.max(0,2+has(p,'brain')+exRerolls(p));G.rollId++;G.phase='roll';G.aiMarked=false;snd('dice');if(p.human)setTimeout(()=>snd('turn'),650);
      lg(p.i,`${mname(p)} rolls ${nd} dice.`);refresh()});
}

function doReroll(kind){const p=cur();

      [{k:'y',l:'MINDBUG! Take these dice',d:`You would get: ${mine.text}.${rec?' Recommended.':''}`},{k:'n',l:'Let it go',d:`${mname(roller)} gets: ${theirs.text}.${rec?'':' Recommended: save your token.'}`}],

// what a set of dice would give monster p (for previews and computer decisions)
function scoreDice(p,dice){const c=countsOf(dice);let vp=0,en=0,hl=0,dmg=0,kill=false,targets=[];const inT=inTokyo(p.i);

  if(has(p,'omni')&&c['1']&&c['2']&&c['3'])vp+=2;

  let amt=c.C;if(amt>0){amt+=has(p,'barbed');if(inT)amt+=has(p,'street')+has(p,'tunnel')+has(p,'pclaw')}amt+=has(p,'acid');
  if(amt>0){targets=has(p,'nova')?alive().filter(q=>q.i!==p.i):inT?alive().filter(q=>!inTokyo(q.i)&&q.i!==p.i):alive().filter(q=>inTokyo(q.i)&&q.i!==p.i);
    dmg=amt;kill=targets.some(q=>q.hp<=amt)}

  if(c.H&&inT)parts.push('hearts wasted (in city)');
  if(dmg&&targets.length)parts.push(`smash ${targets.map(mname).join(', ')} for ${dmg}${kill?' (a knockout!)':''}`);else if(c.C)parts.push('claws hit nobody');
  if(c.H>=3&&G.evoOn)parts.push('an evolution card');

  return {vp,en,hl,dmg,kill,targets,val,text:parts.length?parts.join(', '):'nothing useful'}}
function doResolve(p){

  let q2=false;const echo=bug?0:(G.tf.echo?2:0);

  amt+=has(p,'acid');if(amt>0)amt+=exSmashBonus(p,c);

    for(const j of all){const q=P(j);const a=(tg.includes(q)?amt:0)+(extra[j]||0);const lost=damage(q,a,p);exOnHit(p,q,lost,claws);if(claws&&lost>0)hurt.push(q);
      if(venom&&lost>0&&q.hp>0&&q.hp<=venom&&!(tf.venom?false:q.hp!==1)){q.hp=0;fx(q.i,'VENOM!','hurt');lg(p.i,`${mname(p)}'s venom finishes off ${mname(q)}!`)}
      if(tg.includes(q)&&inTokyo(j))hitList.push({j,lost})}
    if(all.size){snd('smash');out.push(`smashes ${[...all].map(j=>mname(P(j))).join(', ')} for ${amt}`);lg(p.i,`${mname(p)} smashes ${[...all].map(j=>mname(P(j))+' (−'+(tg.map(q=>q.i).includes(j)?amt:0)+(extra[j]?'+'+extra[j]:'')+')').join(', ')}.`);if(claws&&has(p,'alpha'))gainVP(p,has(p,'alpha'))}
    else if(claws)out.push('claws hit nobody');

  const yielders=[];
  const canAsk=hitList.filter(h=>h.lost>0&&!inT&&(P(h.j).hp>0||has(P(h.j),'vjets')));
  seq(canAsk,(h,next)=>{const q=P(h.j);const rec=aiYield(q,h.lost);
      ask(q.i,'Stay or yield?',`${mname(p)} smashed you for ${h.lost}. You have ${Math.max(0,q.hp)} hearts left. If you yield, you leave ${where(q.i)} and ${mname(p)} moves in.${has(q,'vjets')?' Your Vapor Jets cancel the damage if you yield.':''}`,
        [{k:'stay',l:`Stay in ${where(q.i)}`,d:`You keep scoring 2 stars at the start of your turn, but everyone keeps hitting you.${rec?'':' Recommended.'}`},{k:'yield',l:'Yield and run!',d:`Leave the city so you can heal with hearts again.${rec?' Recommended: you are getting low.':''}`}],

}
function takeSpot(p,yielders){let spot=null;if(G.city===-1)spot='city';else if(G.bayOn&&G.bay===-1)spot='bay';if(!spot)return;
  if(spot==='city')G.city=p.i;else G.bay=p.i;snd('stomp');gainVP(p,1+has(p,'penter'));lg(p.i,`${mname(p)} storms into ${where(p.i)} (+${1+has(p,'penter')} star).`);
  for(const h of yielders){const q=P(h.j);if(q.alive&&has(q,'tunnel')){damage(p,has(q,'tunnel'),q,true);lg(q.i,`${mname(q)}'s tunnels collapse under ${mname(p)}.`)}}}
function enterStep(p,yielders){

// apply damage; returns hearts actually lost
function damage(q,a,src,card){
  if(a<=0||!q.alive)return 0;
  if(src&&src.i!==q.i&&has(src,'c_devil'))a+=1;
  const sneak=G.sneak&&src;
  if(!sneak&&q.tok.shield&&src&&src.i===G.active&&q.i!==src.i){fx(q.i,'wings!','heal');return 0}
  if(!sneak&&q.tok.tough){q.tok.tough=false;fx(q.i,'TOUGH!','heal');lg(q.i,`${mname(q)} shrugs off the hit (Tough).`);return 0}
  if(!sneak&&(has(q,'m_chitin')||has(q,'ptough')||has(q,'w_hide'))&&q.tok.tt!==G.tid){q.tok.tt=G.tid;a-=1;if(a<=0){fx(q.i,'tough','heal');return 0}}
  if(!sneak&&a===1&&has(q,'plated')){fx(q.i,'blocked','heal');return 0}
  if(!sneak&&has(q,'chameleon')){let saved=0;for(let k=0;k<a;k++)if(rnd(6)===5)saved++;if(saved){a-=saved;fx(q.i,'dodged '+saved,'heal')}if(a<=0)return 0}

function deaths(){
  for(const q of G.pl){if(!q.alive||q.hp>0)continue;

function checkWin(final){

// ---------- buying ----------
function canBuy(p,k){const id=G.market[k];return id&&p.en>=costOf(p,id)}
function buy(k){const p=cur();const id=G.market[k];if(!id||!canBuy(p,k))return;const b=base(id),C=CARDS[b];
  p.en-=costOf(p,id);G.market[k]=null;refill();snd('buy');lg(p.i,`${mname(p)} buys “${C.n}”.`);
  if(has(p,'news'))gainVP(p,has(p,'news'));
  UI.banner=`<b>${esc(mname(p))}</b> buys ${esc(C.n)}`;
  if(p.stats)p.stats.cards++;
  if(C.t==='K'||C.t==='C'||C.t==='U'){p.cards.push(id);if(b==='growth')heal(p,2);if(b==='smoke')p.tok.smoke=3;if(b==='m_hive')gainMB(p,1)}
  else{G.disc.push(id);playDiscard(p,b,()=>{deaths();after()});return}
  deaths();after();

    if(b==='rush'){lg(p.i,`${mname(p)} goes on a Rampage Rush and takes another turn!`);startTurn();return}

function enterCity(p,why){const o=G.city;if(o>=0)lg(o,`${mname(P(o))} is kicked out of Downtown.`);if(G.bay===p.i)G.bay=-1;G.city=p.i;snd('stomp');gainVP(p,1+has(p,'penter'));lg(p.i,`${mname(p)} ${why} into Downtown!`)}
function playDiscard(p,b,done){const others=alive().filter(q=>q.i!==p.i);
  switch(b){
    case 'kiosk':gainVP(p,1);break;case 'train':gainVP(p,2);break;case 'tower':gainVP(p,3);break;case 'needle':gainVP(p,4);break;
    case 'sirens':others.forEach(q=>loseVP(q,5));break;
    case 'surge':gainE(p,9);break;
    case 'flame':others.forEach(q=>damage(q,2,p,true));break;
    case 'refinery':gainVP(p,2);others.forEach(q=>damage(q,3,p,true));break;
    case 'patch':heal(p,2);break;
    case 'carpet':alive().forEach(q=>damage(q,3,p,true));break;
    case 'jetsq':gainVP(p,5);damage(p,4,null,true);break;
    case 'militia':gainVP(p,2);damage(p,2,null,true);break;
    case 'reactor':gainVP(p,2);heal(p,3);break;
    case 'tanks':gainVP(p,4);damage(p,3,null,true);break;
    case 'cyclone':gainVP(p,2);others.forEach(q=>{const d=Math.floor(q.en/2);q.en-=d;if(d)fx(q.i,'-'+d+'⚡','energy')});break;
    case 'm_swarm':gainVP(p,1);others.forEach(q=>{damage(q,1,p,true);if(q.en>0){q.en--;fx(q.i,'-1⚡','energy')}});break;
    case 'm_storm':gainVP(p,2);if(G.city>=0||G.bay>=0)lg(-1,'The portal storm sucks every monster out of the city!');G.city=-1;G.bay=-1;break;
    case 'm_beacon':gainVP(p,2);gainMB(p,1);break;
    case 'm_blast':gainVP(p,3);others.forEach(q=>{if(q.mb){fx(q.i,'-'+q.mb+' mindbug','hurt');q.mb=0}});break;
    case 'skydive':gainVP(p,2);if(!inTokyo(p.i)){
      const take=spot=>{const o=spot==='city'?G.city:G.bay;if(o>=0)lg(o,`${mname(P(o))} is stomped out of ${where(o)}.`);if(spot==='city')G.city=p.i;else G.bay=p.i;gainVP(p,1+has(p,'penter'));lg(p.i,`${mname(p)} drops from the sky into ${where(p.i)}!`);done()};

    const f=UI.fx[k]||[];f.slice(-3).forEach((e,j)=>{const col={hurt:'#e63946',heal:'#2ec27e',star:'#f4a300',energy:'#2ec27e'}[e.c]||'#fff';

<script>
// ---------- more expansions: cultists, tower, berserk, wickedness, costumes, curses ----------
const EXPS=[
 {k:'evo',n:'Power Up! Evolutions',d:'Resolve three hearts to draw an evolution card for your monster.'},
 {k:'cult',n:'Cultists (Cthulhu pack)',d:'Roll four identical faces to gain a cultist. Spend one any time on your turn for a heart, an energy or an extra reroll.'},
 {k:'tower',n:'Tokyo Tower (King Kong pack)',d:'In the city, resolve four 1s to climb a level of the Tower. Levels give hearts and energy each turn. Own all three to win!'},
 {k:'bers',n:'Berserk (Cybertooth pack)',d:'Resolve four claws to go berserk and roll a wild extra die. Healing with hearts calms you down.'},
 {k:'wick',n:'Wickedness gauge (Dark Edition)',d:'Three 1s give 2 wickedness, three 2s give 1. Reach 3, 6 and 10 to pick a wicked power.'},
 {k:'cost',n:'Costumes (Halloween)',d:'Everyone starts in a costume with a power. Smash a monster with 3+ claws to buy its costume off its back.'},
 {k:'curse',n:'Curses (Anubis pack)',d:'A curse changes the rules for everyone. The Die of Fate can swap it, punish you or bless you.'}];
const exOn=k=>!!(G&&G.ex&&G.ex[k]);
// wickedness tiles (original names and text)
const WTILES={
 w_grudge:{n:'Grudge',lv:3,t:'W',v:4,x:'When your claws hit a monster with more stars than you, steal 1 star from it.'},
 w_last:{n:'Last Roar',lv:3,t:'W',v:3,x:'If you are knocked out with 16 or more stars, you win instead.'},
 w_barbs:{n:'Barbs',lv:3,t:'W',v:5,x:'When you smash with 2 or more claws, deal 1 extra damage.'},
 w_spite:{n:'Spite',lv:3,t:'W',v:3,x:'Whenever claws make you lose hearts, gain 1 energy.'},
 w_tireless:{n:'Tireless',lv:6,t:'W',v:6,x:'You get one extra reroll each turn.'},
 w_hide:{n:'Iron Hide',lv:6,t:'W',v:5,x:'The first time you lose hearts each turn, lose 1 fewer.'},
 w_hunger:{n:'Endless Hunger',lv:6,t:'W',v:5,x:'Heal 1 at the start of your turn, even in the city.'},
 w_greed:{n:'Greed',lv:6,t:'W',v:4,x:'Gain 1 energy at the start of your turn.'},
 w_doom:{n:'Doom Aura',lv:10,t:'W',v:8,x:'At the start of your turn, every other monster loses 1 heart.'},
 w_crown:{n:'Tyrant’s Crown',lv:10,t:'W',v:8,x:'Gain 3 stars now, and 1 star at the start of each of your turns.'}};
// costumes (original names and text)
const COSTUMES={
 c_space:{n:'Space Suit',c:5,t:'U',v:7,x:'You win with 17 stars instead of 20.'},
 c_pirate:{n:'Pirate Hat',c:4,t:'U',v:4,x:'Take 1 energy from each monster your claws damage.'},
 c_vamp:{n:'Vampire Cape',c:4,t:'U',v:4,x:'Heal 1 on any turn your claws damage a monster, even in the city.'},
 c_devil:{n:'Devil Horns',c:5,t:'U',v:6,x:'You deal 1 extra damage whenever you damage a monster.'},
 c_ghost:{n:'Ghost Sheet',c:3,t:'U',v:3,x:'After claws cost you hearts and you survive, heal 1.'},
 c_cheer:{n:'Pom-Poms',c:3,t:'U',v:3,x:'Gain 1 energy whenever another monster smashes someone with claws.'},
 c_zombie:{n:'Zombie Makeup',c:4,t:'U',v:4,x:'When you would be knocked out, stay at 1 heart instead and lose this costume.'},
 c_witch:{n:'Witch Hat',c:3,t:'U',v:3,x:'Your hearts give 1 energy each while you are in the city.'},
 c_tiara:{n:'Royal Tiara',c:5,t:'U',v:5,x:'Gain 1 star at the start of your turn if you are outside the city.'},
 c_robber:{n:'Robber Mask',c:4,t:'U',v:4,x:'Once per turn, when your claws damage a monster, steal 1 star from it.'},
 c_clown:{n:'Clown Nose',c:3,t:'U',v:3,x:'If your final dice include a 1, a 2 and a 3, gain 2 stars and 2 energy.'},
 c_alien:{n:'Alien Antennae',c:3,t:'U',v:4,x:'Power cards cost you 1 energy less.'}};
Object.assign(CARDS,WTILES,COSTUMES);
// curses (original names and text). eff = rule while in play; snake/ankh = Die of Fate results for the roller
const CURSES={
 k_sand:{n:'Sandstorm',x:'Heart dice heal nobody.',s:'Lose 1 heart.',a:'Heal 2 hearts.'},
 k_gold:{n:'Golden Age',x:'Every three-of-a-kind scores 1 extra star.',s:'Lose 1 star.',a:'Gain 2 stars.'},
 k_frog:{n:'Plague of Frogs',x:'Every monster loses 1 energy at the start of its turn.',s:'Lose 2 energy.',a:'Gain 3 energy.'},
 k_pyr:{n:'Pyramid Power',x:'Monsters starting their turn in the city gain 1 extra star.',s:'Every monster in the city loses 2 hearts.',a:'Gain 1 star.'},
 k_ecl:{n:'Eclipse',x:'Everyone gets one reroll fewer.',s:'Lose 1 heart.',a:'Gain 1 energy and heal 1.'},
 k_scar:{n:'Scarab Swarm',x:'Every smash deals 1 extra damage.',s:'Lose 2 hearts.',a:'Heal 2 hearts.'},
 k_toll:{n:'Mummy’s Toll',x:'Power cards cost 1 energy more.',s:'Lose 2 energy.',a:'Gain 2 energy.'},
 k_nile:{n:'Nile Flood',x:'Heart dice heal even inside the city.',s:'Every monster in the city loses 1 heart.',a:'Heal 1 heart.'},
 k_judge:{n:'Judgement',x:'At the start of your turn, if you have the most stars, lose 1 star.',s:'Lose 1 star.',a:'Gain 1 star.'},
 k_dead:{n:'Book of the Dead',x:'Whenever a monster is knocked out, every other monster heals 2.',s:'Lose 1 heart.',a:'Heal 1 heart.'}};
const BFACES=['C2','E2','O','C','C','E'];   // berserk die (guess at the exact faces)
const FFACES=['FE','FW','FS','FA'];        // Die of Fate: eye, water, snake, ankh
const curseOn=k=>exOn('curse')&&G.curse===k;
function faceOf(d){return d.t==='b'?BFACES[rnd(6)]:d.t==='f'?FFACES[rnd(4)]:FACES[rnd(6)]}
function exSetup(done){
  G.tower=[-1,-1,-1];G.pl.forEach(p=>{p.cult=0;p.wk=0;p.stats={dmg:0,stars:0,cards:0,city:0,kos:0}});
  G.wtiles={3:Object.keys(WTILES).filter(k=>WTILES[k].lv===3),6:Object.keys(WTILES).filter(k=>WTILES[k].lv===6),10:Object.keys(WTILES).filter(k=>WTILES[k].lv===10)};
  if(exOn('curse')){G.curseDeck=shuffle(Object.keys(CURSES));G.curse=G.curseDeck.pop();lg(-1,`Curse in play: ${CURSES[G.curse].n}: ${CURSES[G.curse].x}`)}
  if(!exOn('cost')){done();return}
  const pool=shuffle(Object.keys(COSTUMES));
  seq(G.pl.slice(),(p,next)=>{const two=[pool.pop(),pool.pop()];
    ask(p.i,'Pick your costume',`${mname(p)}, choose the costume you start the game in. The other goes into the power card deck.`,two.map(k=>({k,l:COSTUMES[k].n,d:COSTUMES[k].x})),
      ()=>two.sort((a,b)=>COSTUMES[b].v-COSTUMES[a].v)[0],k=>{p.cards.push(k);G.deck.push(two.find(x=>x!==k));lg(p.i,`${mname(p)} dresses up as ${COSTUMES[k].n}.`);next()},{nocancel:true})},
    ()=>{G.deck.push(...pool);shuffle(G.deck);done()})}
function exStartTurn(p){
  if(exOn('tower')){const lv=G.tower.filter(o=>o===p.i).length;const t0=G.tower[0]===p.i,t1=G.tower[1]===p.i;
    let h=(t0?1:0)+(t1?1:0),e=t1?1:0;if(h){p.hp=Math.min(maxhp(p),p.hp+h);fx(p.i,'+'+h+'♥','heal')}if(e)gainE(p,e);if(h||e)lg(p.i,`${mname(p)} draws power from the Tokyo Tower.`)}
  if(has(p,'w_hunger')){p.hp=Math.min(maxhp(p),p.hp+1);fx(p.i,'+1♥','heal')}
  if(has(p,'w_greed'))gainE(p,1);
  if(has(p,'w_crown'))gainVP(p,1);
  if(has(p,'w_doom')){alive().forEach(q=>{if(q.i!==p.i)damage(q,1,p,true)});lg(p.i,`${mname(p)}'s Doom Aura hurts everyone.`);deaths()}
  if(has(p,'c_tiara')&&!inTokyo(p.i))gainVP(p,1);
  if(curseOn('k_frog'))alive().forEach(q=>{if(q.i===p.i&&q.en>0){q.en--;fx(q.i,'-1⚡','energy')}});
  if(curseOn('k_pyr')&&inTokyo(p.i))gainVP(p,1);
  if(curseOn('k_judge')&&alive().every(q=>q.i===p.i||q.vp<p.vp)&&p.vp>0){loseVP(p,1);lg(p.i,`Judgement: ${mname(p)} leads and loses a star.`)}
  if(inTokyo(p.i)&&p.stats)p.stats.city++}
function exDice(p){const x=[];if(exOn('bers')&&p.tok.berserk)x.push({f:BFACES[rnd(6)],k:false,x:true,t:'b'});if(exOn('curse'))x.push({f:FFACES[rnd(4)],k:false,x:true,t:'f'});return x}
function exRerolls(p){return has(p,'w_tireless')-(curseOn('k_ecl')?1:0)}
// Die of Fate and ouch, resolved before everything else
function exPreResolve(p,roller,out){
  if(p!==roller)return;
  const fd=G.dice.find(d=>d.t==='f');
  if(fd&&exOn('curse')){const K=CURSES[G.curse];
    if(fd.f==='FE'){if(!G.curseDeck.length)G.curseDeck=shuffle(Object.keys(CURSES).filter(k=>k!==G.curse));G.curse=G.curseDeck.pop();out.push(`new curse: ${CURSES[G.curse].n}`);lg(-1,`The Eye of Fate opens: the curse becomes ${CURSES[G.curse].n}: ${CURSES[G.curse].x}`);fx(p.i,'NEW CURSE','star')}
    else if(fd.f==='FS'){out.push(`snake: ${K.s.toLowerCase()}`);fateEffect(p,G.curse,false);fx(p.i,'SNAKE!','hurt')}
    else if(fd.f==='FA'){out.push(`ankh: ${K.a.toLowerCase()}`);fateEffect(p,G.curse,true);fx(p.i,'ANKH!','heal')}}
  const od=G.dice.filter(d=>d.t==='b'&&d.f==='O').length;if(od){damage(p,od,null,true);out.push('ouch!')}}
function fateEffect(p,k,good){const h=n=>{p.hp=Math.min(maxhp(p),p.hp+n);fx(p.i,'+'+n+'♥','heal')};
  const city=()=>alive().filter(q=>inTokyo(q.i));
  if(good)({k_sand:()=>h(2),k_gold:()=>gainVP(p,2),k_frog:()=>gainE(p,3),k_pyr:()=>gainVP(p,1),k_ecl:()=>{gainE(p,1);h(1)},k_scar:()=>h(2),k_toll:()=>gainE(p,2),k_nile:()=>h(1),k_judge:()=>gainVP(p,1),k_dead:()=>h(1)})[k]();
  else({k_sand:()=>damage(p,1,null,true),k_gold:()=>loseVP(p,1),k_frog:()=>{const d=Math.min(2,p.en);p.en-=d},k_pyr:()=>city().forEach(q=>damage(q,2,null,true)),k_ecl:()=>damage(p,1,null,true),k_scar:()=>damage(p,2,null,true),k_toll:()=>{const d=Math.min(2,p.en);p.en-=d},k_nile:()=>city().forEach(q=>damage(q,1,null,true)),k_judge:()=>loseVP(p,1),k_dead:()=>damage(p,1,null,true)})[k]()}
// bonus stars and wickedness from number sets
function exSet(p,f,n){let v=0;if(curseOn('k_gold'))v++;
  if(exOn('wick')&&(f==='1'||f==='2')){const before=p.wk;p.wk+=f==='1'?2:1;fx(p.i,'+'+(f==='1'?2:1)+' wicked','star');G.tf.wkFrom=G.tf.wkFrom===undefined?before:Math.min(G.tf.wkFrom,before)}
  return v}
function exHealBlocked(){return curseOn('k_sand')}
function exHealInCity(){return curseOn('k_nile')}
function exSmashBonus(p,c){let a=0;if(c.C>=2&&has(p,'w_barbs'))a++;if(curseOn('k_scar'))a++;return a}
function exOnHit(p,q,lost,claws){if(!claws||lost<=0)return;
  if(p.stats)p.stats.dmg+=lost;
  if(has(p,'c_pirate')&&q.en>0){q.en--;p.en++;fx(p.i,'+1⚡','energy')}
  if(has(p,'c_robber')&&!G.tf.robbed&&q.vp>0){G.tf.robbed=1;loseVP(q,1);gainVP(p,1)}
  if(has(p,'w_grudge')&&q.vp>p.vp){loseVP(q,1);gainVP(p,1)}
  if(has(p,'c_vamp')&&!G.tf.vamp){G.tf.vamp=1;if(p.hp<maxhp(p)){p.hp++;fx(p.i,'+1♥','heal')}}
  if(has(q,'w_spite'))gainE(q,1);
  if(has(q,'c_ghost')&&q.hp>0&&q.hp<maxhp(q)){q.hp++;fx(q.i,'+1♥','heal')}
  alive().forEach(r=>{if(r.i!==p.i&&has(r,'c_cheer')&&!G.tf['ch'+r.i]){G.tf['ch'+r.i]=1;gainE(r,1)}})}
// after the dice: cultists, berserk, tower, costume theft, wicked powers
function exAfterResolve(p,c,hurt,done){const nc=countsOf(G.dice.filter(d=>!d.t));
  if(exOn('cult')&&Object.values(nc).some(v=>v>=4)){p.cult++;fx(p.i,'+1 cultist','star');lg(p.i,`${mname(p)} rolls four of a kind and gains a cultist.`)}
  if(exOn('bers')&&!p.tok.berserk&&c.C>=4){p.tok.berserk=true;fx(p.i,'BERSERK!','hurt');lg(p.i,`${mname(p)} goes BERSERK and will roll the berserk die!`)}
  if(has(p,'c_clown')&&c['1']&&c['2']&&c['3']){gainVP(p,2);gainE(p,2)}
  if(exOn('tower')&&inTokyo(p.i)&&nc['1']>=4){const lv=G.tower.findIndex(o=>o!==p.i);if(lv>=0){const old=G.tower[lv];G.tower[lv]=p.i;fx(p.i,'TOWER '+(lv+1)+'!','star');snd('stomp');lg(p.i,`${mname(p)} climbs the Tokyo Tower: level ${lv+1}${old>=0?' (taken from '+mname(P(old))+')':''}!`)}}
  const steps=[];
  if(exOn('cost')&&c.C>=3){for(const q of hurt){const cs=q.cards.filter(id=>CARDS[base(id)].t==='U');for(const id of cs)steps.push({q,id})}}
  if(exOn('wick')&&G.tf.wkFrom!==undefined){for(const lv of [3,6,10])if(G.tf.wkFrom<lv&&p.wk>=lv&&G.wtiles[lv].length)steps.push({lv})}
  G.tf.wkFrom=undefined;
  seq(steps,(s,next)=>{
    if(s.id){const C=COSTUMES[base(s.id)];if(p.en<C.c||!s.q.cards.includes(s.id)){next();return}
      ask(p.i,'Steal a costume?',`Your claws ripped into ${mname(s.q)}. Pay ${C.c} energy to take its ${C.n}? (${C.x}) You have ${p.en} energy.`,[{k:'y',l:`Take the ${C.n} (${C.c} ⚡)`},{k:'n',l:'Leave it'}],
        ()=>cardValue(p,s.id)>-1?'y':'n',k=>{if(k==='y'){p.en-=C.c;s.q.cards.splice(s.q.cards.indexOf(s.id),1);p.cards.push(s.id);lg(p.i,`${mname(p)} steals ${mname(s.q)}'s ${C.n}!`);fx(p.i,'COSTUME!','star')}next()})}
    else{const opts=G.wtiles[s.lv];
      ask(p.i,`Wickedness ${s.lv}!`,`${mname(p)} is getting wicked. Choose a power:`,opts.map(k=>({k,l:WTILES[k].n,d:WTILES[k].x})),
        ()=>opts.slice().sort((a,b)=>WTILES[b].v-WTILES[a].v)[0],k=>{G.wtiles[s.lv]=opts.filter(x=>x!==k);p.cards.push(k);if(k==='w_crown')gainVP(p,3);lg(p.i,`${mname(p)} gains the wicked power ${WTILES[k].n}.`);fx(p.i,'WICKED!','hurt');next()},{nocancel:true})}},
    done)}
function exDeath(q){
  if(has(q,'c_zombie')){q.hp=1;q.cards.splice(q.cards.findIndex(c=>base(c)==='c_zombie'),1);G.disc.push('c_zombie');fx(q.i,'ZOMBIE!','heal');lg(q.i,`${mname(q)} refuses to die (Zombie Makeup)!`);return true}

function targetOf(p,k){if(G.city===p.i)return new THREE.Vector3(0,1.1,0);if(G.bay===p.i)return new THREE.Vector3(12.5,.7,-6.5);return seatPos(k,G.pl.length)}

    V3.mons=G.pl.map((p,k)=>{const o=buildMonster(p.m);const t=targetOf(p,k);o.g.position.copy(t);o.pos=t.clone();o.to=t.clone();V3.scene.add(o.g);o.state={hp:p.hp,alive:p.alive,loc:locKey(p)};return o});
    tags.innerHTML=G.pl.map((p,k)=>`<div class="tag" data-seat="${k}"></div>`).join('');V3.rollId=-1;clearDice()}

function locKey(p){return !p.alive?'ko':G.city===p.i?'city':G.bay===p.i?'bay':'out'}
function fx3D(k,e){const o=V3.mons[k];if(!o)return;const at=o.g.position.clone().add(new THREE.Vector3(0,4.4,0));
  popLabel(at,e.t,e.c);
  if(e.c==='hurt'){o.flash=1;o.shakeT=.5;V3.shake=Math.min(1,V3.shake+.35);spawn('fire',at.clone().add(new THREE.Vector3(0,-1,0)),6,1.3);spawn('puff',at.clone().add(new THREE.Vector3(0,-1.2,0)),3,.8)}
  else if(e.c==='heal')spawn('heart',at,6,.9);else if(e.c==='star')spawn(/mindbug/i.test(e.t)?'brain':'star',at,8,1);else if(e.c==='energy')spawn('bolt',at,6,.9)}
function popLabel(v,text,c){const st=document.getElementById('stage');const p=v.clone().project(V3.cam);const el=document.createElement('div');el.className='pop '+c;el.textContent=text;
  el.style.left=((p.x+1)/2*100)+'%';el.style.top=((1-p.y)/2*100)+'%';el.style.setProperty('--dx',(Math.random()*40-20)+'px');st.appendChild(el);setTimeout(()=>el.remove(),1600)}
function spawn(kind,at,n,speed){for(let i=0;i<n;i++){const s=sprite(V3.icons[kind],at.x,at.y,at.z,.55,.55);const a=Math.random()*Math.PI*2;
  V3.parts.push({s,v:new THREE.Vector3(Math.cos(a)*speed*(.5+Math.random()),2+Math.random()*3*speed,Math.sin(a)*speed*(.5+Math.random())),life:1+Math.random()*.5,max:1.4,grow:kind==='puff'||kind==='fire'})}}

const DIEFACES={n:['1','2','3','E','C','H'],b:['C2','E2','O','C','C','E'],f:['FE','FW','FS','FA','FE','FW']};
const FACEIDX={'1':0,'2':1,'3':2,E:3,C:4,H:5};
function clearDice(){V3.dice.forEach(d=>V3.tray.remove(d.m));V3.dice=[]}
function dieMats(face){const order=['1','2','3','E','C','H'];return order.map(f=>V3.faceMats[f])}
function upQuat(f,tp){const q=new THREE.Quaternion();const E=new THREE.Euler();
  switch(DIEFACES[tp||'n'].indexOf(f)){case 0:E.set(0,0,Math.PI/2);break;case 1:E.set(0,0,-Math.PI/2);break;case 2:E.set(0,0,0);break;case 3:E.set(Math.PI,0,0);break;case 4:E.set(-Math.PI/2,0,0);break;default:E.set(Math.PI/2,0,0)}
  q.setFromEuler(E);return new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),.62).multiply(q)}
function rollDice3D(rebuild){const n=G.dice.length;if(rebuild){clearDice();
    for(let k=0;k<n;k++){const m=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.05,1.05),dieMats());m.castShadow=true;const ol=new THREE.Mesh(m.geometry,V3.olMat);ol.scale.setScalar(1.08);m.add(ol);V3.tray.add(m);V3.dice.push({m,t:1,k:k})}}
  const cols=n>6?4:3;
  V3.dice.forEach((d,k)=>{const gd=G.dice[k];const home=new THREE.Vector3(((k%(n>6?4:6))-((n>6?4:Math.min(n,6))-1)/2)*1.45,.52,Math.floor(k/(n>6?4:6))*1.35-(n>6?.6:0));d.home=home;
    const spin=!gd.k||rebuild;d.final=upQuat(gd.f,gd.t);
    const src=V3.mons[G.active]?V3.mons[G.active].g.position.clone().sub(V3.tray.position):new THREE.Vector3(0,0,-6);
    if(spin){d.t=0;d.start=new THREE.Vector3(src.x+(Math.random()-.5)*1.5,src.y+3+Math.random()*1.5,src.z+(Math.random()-.5)*1.5);d.axis=new THREE.Vector3(Math.random(),Math.random(),Math.random()).normalize();d.spins=6+Math.random()*6;d.dur=.7+Math.random()*.35}

<script>
// ---------- online multiplayer (room capability). The host runs the game; everyone else sends actions. ----------

function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function packStr(s){if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(new TextEncoder().encode(s));w.close();return 'z'+b64(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}catch(e){}}return 'j'+b64(new TextEncoder().encode(s))}
async function unpackStr(s){const u=unb64(s.slice(1));if(s[0]==='z'){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u);w.close();return await new Response(ds.readable).text()}return new TextDecoder().decode(u)}
function netPush(force){if(!isHost()||!NET.room)return;const now=Date.now();
  if(!force&&now-NET.last<300){if(!NET.timer)NET.timer=setTimeout(()=>{NET.timer=null;netPush(true)},310);return}
  NET.last=now;const seq=++NET.seq;
  let body;if(G){const g=JSON.parse(JSON.stringify(G));g.log=g.log.slice(0,14);
    const c=UI.choice;const pend=c&&c.who!==undefined&&G.pl[c.who]&&G.pl[c.who].peer&&G.pl[c.who].peer!==NET.peer?{title:c.title,text:c.text,options:c.options,who:c.who,dice:!!c.dice,cancel:!!c.cancel}:null;
    const pw=c&&c.who!==undefined?c.who:-1;
    const safe=['roll','buy'].includes(G.phase)&&!c&&!UI.busy;
    body={code:NET.code,ep:NET.ep,g,fx:UI.fx,banner:UI.banner,pend,pw,safe}}else body={code:NET.code,ep:NET.ep,lobby:true};
  packStr(JSON.stringify(body)).then(z=>{const CH=3200,n=Math.ceil(z.length/CH);for(let i=0;i<n;i++)NET.room&&NET.room.emit('st',{s:seq,i,n,d:z.slice(i*CH,(i+1)*CH)}).catch(()=>{})})}
setInterval(()=>{if(isHost())netPush(true)},3000);
let netWon=null;setInterval(()=>{if(isHost()&&G&&G.winner&&netWon!==G.gid){netWon=G.gid;[400,1200,2500,5000,8000].forEach(t=>setTimeout(()=>netPush(true),t))}},300);
function onNetState(msg){if(!NET.on||msg.isMe)return;const d=msg.data;if(!d||typeof d.d!=='string'||!(d.n>0&&d.n<40)||!(d.i>=0&&d.i<d.n))return;
  if(NET.dead.includes(msg.peer))return;
  const k=msg.peer+':'+d.s;const P2=NET.parts[k]=NET.parts[k]||{n:d.n,got:0,c:[]};if(P2.c[d.i]===undefined){P2.c[d.i]=d.d;P2.got++}
  if(P2.got<P2.n)return;delete NET.parts[k];Object.keys(NET.parts).forEach(x=>{const [pp,ss]=x.split(':');if(pp===msg.peer&&+ss<d.s)delete NET.parts[x]});
  unpackStr(P2.c.join('')).then(txt=>{const o=JSON.parse(txt);if(o.code!==NET.code)return;const ep=o.ep|0;
    // only a seated player may take over as host (or anyone, before we have a game)
    const seated=!G||G.pl.some(p=>p.peer===msg.peer);
    if(isHost()){if(!seated||!(ep>NET.ep||(ep===NET.ep&&msg.peer<NET.peer)))return;
      NET.role='client';UI.choice=null;UI.busy=false;NET.hostPeer=msg.peer;NET.ep=ep;NET.applied=d.s;lg(-1,'Another player is running the game now.');NET.room.presence({role:'client'}).catch(()=>{})}
    else{if(!NET.hostPeer||(ep>NET.ep&&seated)){if(NET.hostPeer&&NET.hostPeer!==msg.peer)NET.applied=0;NET.hostPeer=msg.peer;NET.ep=Math.max(NET.ep,ep);NET.expect=null}
      if(msg.peer!==NET.hostPeer||ep<NET.ep||d.s<=NET.applied)return;NET.applied=d.s}
    NET.lastRx=Date.now();if(o.safe&&o.g)NET.safe=JSON.stringify(o.g);applyNet(o)}).catch(()=>{})}
// ---- host migration: if the host leaves, the seated player with the lowest seat number takes over from the last safe state ----
function netMigrate(gone){if(!isClient()||!G||G.winner)return;if(gone&&!NET.dead.includes(gone))NET.dead.push(gone);
  const here=new Set(NET.peers.map(p=>p.peer));
  const cand=G.pl.filter(p=>p.human&&p.peer&&!NET.dead.includes(p.peer)&&(here.has(p.peer)||p.peer===NET.peer));
  const next=cand[0];NET.lastRx=Date.now();
  if(!next){NET.err='The host left and nobody can take over.';render();return}
  if(next.peer!==NET.peer){NET.expect=next.peer;UI.banner=`The host left. ${esc(pname(next)||mname(next))} is taking over…`;render();return}
  let g=null;try{g=JSON.parse(NET.safe||'null')}catch(e){}if(!g)g=G;G=g;
  G.pl.forEach(p=>{if(p.human&&p.peer!==NET.peer&&(NET.dead.includes(p.peer)||!here.has(p.peer))){p.human=false;p.away=true}});
  if(!['roll','buy'].includes(G.phase)){G.phase='roll';G.step=1}
  NET.role='host';NET.ep++;NET.hostPeer=NET.peer;NET.expect=null;NET.mySeat=G.pl.findIndex(p=>p.peer===NET.peer);
  UI.choice=null;UI.busy=false;UI.pending=false;UI.fx={};UI.banner='';NET.err='';
  lg(-1,`The host left. ${pname(G.pl[NET.mySeat])||mname(G.pl[NET.mySeat])}'s page is running the game now.`);
  NET.room.presence({role:'host'}).catch(()=>{});netPush(true);refresh()}
setInterval(()=>{if(!isClient()||!G||G.winner||NET.inLobby||!NET.lastRx)return;if(Date.now()-NET.lastRx>15000)netMigrate(NET.expect||NET.hostPeer)},1000);
function applyNet(o){if(o.lobby||!o.g){if(G){G=null;NET.inLobby=true;render()}return}
  const prevFx=UI.fx||{},prevRoll=G?G.rollId:-1,prevWin=G&&G.winner;G=o.g;if(!Array.isArray(G.deck))G.deck=[];
  NET.mySeat=G.pl.findIndex(p=>p.peer===NET.peer);NET.inLobby=false;UI.info=false;
  const fxn=o.fx||{};for(const k in fxn){const a=fxn[k]||[],b=prevFx[k]||[];const from=a.length<b.length?0:b.length;if(a.length<b.length&&typeof V3!=='undefined')V3.fxSeen[k]=0;
    for(let j=from;j<a.length;j++){if(typeof SND!=='undefined'&&G.pl[k])SND.pitch=[1,.8,1.15,.7,1.3,.9,1.05,.85,1.2][G.pl[k].m]||1;fxSound(a[j].t,a[j].c)}}
  if(G.rollId!==prevRoll)snd('dice');
  if(G.pl[G.active]&&G.active===NET.mySeat&&G.phase==='roll'&&G.rollId!==prevRoll&&G.rolls===2+has(G.pl[G.active],'brain')+exRerolls(G.pl[G.active]))snd('turn');
  if(NET.mySeat>=0&&G.pl[NET.mySeat].away&&NET.room&&Date.now()-(NET.hiT||0)>2500){NET.hiT=Date.now();NET.room.emit('act',{act:'hi'}).catch(()=>{})}
  UI.fx=fxn;UI.banner=o.banner||'';NET.pw=o.pw;UI.choice=o.pend&&o.pend.who===NET.mySeat?Object.assign({},o.pend,{net:true}):null;
  netNames();render()}
// client -> host
function netSend(ds){if(!NET.room)return;const d={};['act','die','card','opt'].forEach(k=>{if(ds[k]!==undefined)d[k]=String(ds[k]).slice(0,24)});NET.room.emit('act',d).catch(()=>{});snd('click')}
function onNetAct(msg){if(!isHost()||!G||msg.isMe)return;let seat=G.pl.findIndex(p=>p.peer===msg.peer&&p.human);
  if(seat<0){const s=G.pl.find(p=>p.away&&(p.peer===msg.peer||(msg.by&&p.uid===msg.by)));if(!s)return;s.peer=msg.peer;s.human=true;s.away=false;NET.dead=NET.dead.filter(x=>x!==msg.peer);lg(s.i,`${mname(s)}'s player is back!`);netPush(true);refresh();return}
  if(msg.data&&msg.data.act==='hi')return;const d=msg.data||{};const ds={};
  if(typeof d.act==='string')ds.act=d.act.slice(0,24);if(d.die!==undefined)ds.die=String(parseInt(d.die,10)||0);if(d.card!==undefined)ds.card=String(parseInt(d.card,10)||0);if(d.opt!==undefined)ds.opt=String(d.opt).slice(0,24);
  gameAct(ds,seat);netPush()}
// emotes
function sendEmote(e){if(!NET.room||!EMOTES.includes(e))return;NET.room.emit('emo',{e}).catch(()=>{})}
function onNetEmo(msg){const e=msg.data&&msg.data.e;if(!EMOTES.includes(e)||!G)return;const seat=G.pl.findIndex(p=>p.peer===msg.peer);if(seat<0)return;
  if(typeof V3!=='undefined'&&V3.on&&V3.mons[seat])popLabel(V3.mons[seat].g.position.clone().add(new THREE.Vector3(0,6.2,0)),e,'emote');
  else{UI.banner=`${esc(mname(G.pl[seat]))} ${e}`;renderPanel()}}
function lobbyHTML(){const host=isHost();const ps=NET.peers.filter(p=>p.kind==='viewer');
  const rows=ps.map(p=>{const pr=p.presence||{};const m=Number.isInteger(pr.mon)?MONS[pr.mon]:null;return `<li><b>${esc(peerName(p))}</b>${p.isMe&&p.sameTab?' (you)':''}${pr.role==='host'?' · host':''}${p.guest?' · guest':''}${m?` · wants ${esc(m.n)}`:''}</li>`}).join('')||'<li class="muted">Connecting…</li>';
  const exs=EXPS.filter(e=>e.k==='evo'?UI.evo:UI.ex[e.k]).map(e=>e.n).join(', ')||'none';
  return `<div class="dlg start" role="dialog" aria-modal="true"><h2>🌐 Online game</h2>
   <p>Invite code: <b class="code">${esc(NET.code)}</b> <span class="small muted">Friends open this same page, press <b>Join a game</b> and type the code.</span></p>
   ${NET.err?`<p class="warn">${esc(NET.err)}</p>`:''}${NET.conn===false&&NET.on?'<p class="small muted">Connecting to the room…</p>':''}
   <h3 style="margin:.4rem 0 .2rem">Players here (${ps.length})</h3><ul class="plist">${rows}</ul>
   <p style="margin:.4rem 0 .2rem"><b>Your monster</b> (if two players pick the same one, one gets a random monster):</p>
   <div class="monpick">${MONS.map((M,k)=>k).filter(k=>UI.xp!=='base'||k<6).map(k=>`<button class="${UI.mon===k?'on':''}" data-mon="${k}"><svg viewBox="-66 -70 132 136">${monArt(k)}</svg><span>${esc(MONS[k].n)}</span></button>`).join('')}</div>
   ${host?`<p class="small">Game: <b>${UI.xp==='base'?'Base game':UI.xp==='trial'?'Mindbug Trial':'Mindbug Experience'}</b> · Expansions: <b>${esc(exs)}</b> · Seats: <b>${Math.min(6,Math.max(UI.n,ps.length))}</b> (empty seats go to <b>${UI.lvl}</b> computer monsters). Change these on the start screen before hosting.</p>
     <div class="acts"><button class="btn primary" data-a="netstart" ${ps.length<1?'disabled':''}>Start the game with ${ps.length} player${ps.length===1?'':'s'}</button><button class="btn" data-a="netleave">Close the room</button></div>`
   :`<p class="tip">Waiting for the host to start the game…</p><div class="acts"><button class="btn" data-a="netleave">Leave</button></div>`}</div>`}
function onlineBlock(){if(!NET.ready)return '<p class="small muted">Checking online play…</p>';
  if(!netAvail())return '<p class="small muted">🌐 Online play works when this page is opened on claude.ai by people signed in and given access to it.</p>';
  return `<div class="online"><b>🌐 Play online with friends</b><span class="small muted"> Share this page with them first (as Contributors or Editors).</span>
    <div class="row"><button class="btn" data-a="nethost">Host a game</button><input id="joincode" placeholder="invite code" maxlength="10" autocomplete="off" value="${esc(UI.joinCode||'')}"><button class="btn" data-a="netjoin">Join a game</button></div>${NET.err&&!NET.on?`<p class="warn">${esc(NET.err)}</p>`:''}</div>`}

document.addEventListener('input',e=>{if(e.target&&e.target.id==='joincode')UI.joinCode=e.target.value});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='joincode'&&e.key==='Enter'){e.preventDefault();netJoin('client',e.target.value)}});

</script>
<script>
// ---------- panel ----------
function humanTurn(){return G&&!G.winner&&isHuman(G.active)&&(!NET.on||G.active===NET.mySeat)}
function uiAct(ds){if(isClient()){netSend(ds);return}gameAct(ds,NET.on?NET.mySeat:undefined)}
const STEPS=['Roll','Resolve','City','Buy','End'];
function stepBar(){const s=G.step||1;return `<div class="steps">${STEPS.map((t,k)=>`<span class="st ${k+1<s?'done':''} ${k+1===s?'on':''}"><b>${k+1}</b>${t}</span>`).join('')}</div>`}
function suggestCard(p){let best=-1,bv=-0.5;G.market.forEach((id,k)=>{if(!canBuy(p,k))return;const v=cardValue(p,id);if(v>bv){bv=v;best=k}});return best}
function renderPanel(){
  const pr=document.getElementById('prompt');const di=document.getElementById('dice'),ro=document.getElementById('rolls'),pv=document.getElementById('preview');
  document.getElementById('banner').innerHTML=G?UI.banner:'';
  if(!G){pr.innerHTML='';di.innerHTML='';ro.innerHTML='';pv.innerHTML='';return}
  const p=cur();let who=esc(mname(p)),head='',msg='',acts='';
  const btn=(a,l,dis,sm,cls)=>`<button class="btn ${cls||''}" data-act="${a}" ${dis?'disabled':''}>${l}${sm?`<small>${sm}</small>`:''}</button>`;
  const me=G.mode==='solo'?G.pl.find(q=>q.human):null;
  if(G.winner){who='Game over';msg=esc(G.winText);acts=btn('again','Play again','','','primary')}
  else if(!humanTurn()){
    head=G.step===1?`Step 1 · ${esc(mname(p))} is rolling`:G.step<=3?`Step 2 · ${esc(mname(p))} resolves its dice`:`Step 4 · ${esc(mname(p))} is shopping`;
    msg=G.step===1?'Watch which dice it keeps (they turn yellow).':G.step===4?'It may buy power cards or play evolutions.':'';
    if(me){msg+=`<div class="tip">You are <b>${esc(mname(me))}</b>. Nothing to do right now: you will get a pop-up if you can ${mbOn()&&me.mb?'use your <b>Mindbug</b> or ':''}yield the city.</div>`}}
  else if(G.phase==='roll'){const nk=G.dice.filter(d=>!d.k).length;
    head='Step 1 · Roll the dice';
    msg=`<ol class="how"><li>Tap the dice you want to <b>keep</b> (here, or right in the city). They turn yellow.</li><li>Press <b>Reroll</b> to throw the others again (${G.rolls} left).</li><li>Happy with the result? Press <b>Resolve</b>.</li></ol>`;
    msg+=`<div class="tip">You are in <b>${where(p.i)}</b>. ${inTokyo(p.i)?'Your claws hit everyone outside. Hearts do nothing here.':G.city===-1?'Downtown is empty, so you will move in after resolving.':'Your claws hit whoever is in the city.'}</div>`;
    acts=btn('reroll',`Reroll ${nk} ${nk===1?'die':'dice'}`,G.rolls<=0||!nk,G.rolls<=0?'no rerolls left':`${G.rolls} left`,G.rolls>0&&nk?'primary':'')+btn('resolve','Resolve dice','','go to step 2',G.rolls<=0||!nk?'primary':'')+btn('hint','💡 Suggest dice','','marks good dice for you');
    if(has(p,'mind'))acts+=btn('mind','Mind Link reroll',p.en<1||!nk,'pay 1 ⚡');
    if(has(p,'smoke')&&p.tok.smoke>0)acts+=btn('smoke','Smoke reroll',!nk,`${p.tok.smoke} puffs left`);
    if(has(p,'lurker'))acts+=btn('lurker','Reroll my 3s',!G.dice.some(d=>d.f==='3'),'Alley Lurker');
    if(has(p,'pack'))acts+=btn('pack','Make a die a 1',G.tf.culler,'Pack Hunter, once a turn');
    if(has(p,'rubber'))acts+=btn('rubber','Bend a die',p.en<2,'Rubber Limbs, 2 ⚡');
    if(has(p,'twist'))acts+=btn('twist','Twist a die','','then discard');
  }else if(G.phase==='buy'){const sg=suggestCard(p);
    head='Step 4 · Buy power cards (optional)';
    msg=`You have <b>${p.en} energy ⚡</b>. Cards you can afford have a yellow <b>Buy</b> button.${sg>=0?`<div class="tip">💡 Suggestion: <b>${esc(CARDS[base(G.market[sg])].n)}</b>.</div>`:'<div class="tip">Nothing great to buy? Save your energy and press <b>End turn</b>.</div>'}`;
    acts=btn('end','End turn','','next monster goes','primary')+btn('sweep','Sweep cards',p.en<2,'pay 2 ⚡ for 3 new')}
  if(humanTurn()){
    if(has(p,'mend'))acts+=btn('mend','Quick Mend',p.en<2||p.hp>=maxhp(p),'2 ⚡ → heal 1');
    p.cards.forEach((id,k)=>{const C=CARDS[base(id)];if(C.t==='C')acts+=btn('use:'+k,`Use ${esc(C.n)}`,!consUsable(p,k),C.kw?C.kw+' · consumable':'consumable','cons')});
    p.hand.forEach((e,k)=>acts+=btn('evo:'+k,`🧬 ${esc(evoName(e))}`,!evoUsable(p,k),EVOFX[evoKey(e)].x,'evo'));
    if(p.cult&&(G.phase==='roll'||G.phase==='buy')){acts+=btn('cult:h',`🕯 Cultist → heart`,p.hp>=maxhp(p),`${p.cult} cultist${p.cult>1?'s':''}`,'cons')+btn('cult:e','🕯 Cultist → energy','',`${p.cult} left`,'cons');if(G.phase==='roll')acts+=btn('cult:r','🕯 Cultist → reroll','','one extra reroll','cons')}}
  if(NET.on&&!G.winner){const w=isHost()?(UI.choice&&UI.choice.who!==undefined?UI.choice.who:-1):(NET.pw===undefined?-1:NET.pw);
    if(w>=0&&w!==NET.mySeat&&G.pl[w])msg+=`<div class="tip">⏳ Waiting for <b>${esc(pname(G.pl[w])||mname(G.pl[w]))}</b> (${esc(mname(G.pl[w]))}) to decide…</div>`;
    if(!humanTurn()&&G.pl[G.active].human&&G.active!==NET.mySeat)msg+=`<div class="small muted">It's ${esc(pname(G.pl[G.active])||'another player')}'s turn.</div>`;
    acts+=`<div class="emotes">${EMOTES.map(e=>`<button class="btn mini" data-emo="${e}" aria-label="send ${e}">${e}</button>`).join('')}</div>`}
  pr.innerHTML=`${G.winner?'':stepBar()}<div class="who" style="color:${MONS[p.m].c};-webkit-text-stroke:1.2px #1a1320">${who}${humanTurn()?' · your turn':''}</div>${head?`<div class="head">${head}</div>`:''}<div class="msg">${msg}</div><div class="acts">${acts}</div>`;
  const canClick=humanTurn()&&G.phase==='roll';
  const spin=UI.rollAnim!==G.rollId&&ANIM;UI.rollAnim=G.rollId;
  const sug=canClick&&UI.hints&&G.rolls>0?suggestMask(p):null;
  di.innerHTML=G.dice.map((d,k)=>`<button class="die ${d.k?'kept':''} ${d.x?'extra':''} ${d.t?'sp-'+d.t:''} ${sug&&sug[k]&&!d.k?'sugg':''} ${spin&&!d.k?'spin':''}" title="${fname(d.f)}${d.t==='b'?' (berserk die)':d.t==='f'?' (Die of Fate)':''}" data-die="${k}" ${canClick?'':'disabled'} aria-label="${fname(d.f)}${d.k?' (kept)':''}">${faceSVG(d.f)}</button>`).join('')||'<span class="muted small">No dice rolled yet.</span>';
  ro.innerHTML=G.phase==='roll'?`Rerolls left: ${Array.from({length:Math.max(G.rolls,2+has(p,'brain'))},(_,k)=>`<span class="pip ${k<G.rolls?'':'used'}"></span>`).join('')}`:'<span class="muted small">Dice resolved.</span>';
  pv.innerHTML=G.phase==='roll'&&G.dice.length?`<b>${humanTurn()?'If you resolve now':'These dice give'}:</b> ${esc(scoreDice(p,G.dice).text)}.`:'';
  const buyOK=humanTurn()&&G.phase==='buy';const sg=buyOK?suggestCard(p):-1;
  document.getElementById('market').innerHTML=G.market.map((id,k)=>{const C=CARDS[base(id)];const c=costOf(p,id);return `<div class="pc ${C.t} ${k===sg?'sugg':''}"><div class="hd"><span class="cost">${c}</span><span class="nm">${esc(C.n)}</span>${cardIcon(id)}</div><span class="ty">${C.t==='K'?'KEEP':C.t==='C'?'CONSUMABLE':'USE NOW'}${C.kw?' · '+C.kw.toUpperCase():''}</span><p>${esc(C.x)}</p>${buyOK?`<button class="btn buy ${canBuy(p,k)?'primary':''}" data-card="${k}" ${canBuy(p,k)?'':'disabled'}>${canBuy(p,k)?'Buy':'Need '+c+' ⚡'}</button>`:''}</div>`}).join('')+`<p class="small muted" style="grid-column:1/-1;margin:.2rem 0 0">${G.deck.length} cards in the deck. <b>Keep</b> cards stay with you. <b>Use now</b> cards happen at once. <b>Consumables</b> wait until you use them.</p>`;
  const who2=me||p;
  document.getElementById('minettl').textContent=me?`Your cards (${mname(me)})`:`${mname(who2)}'s cards`;
  const list=[...who2.cards.map(id=>{const C=CARDS[base(id)];return `<div class="mc ${C.t}"><b>${esc(C.n)}</b>${C.t==='C'?' <i>consumable</i>':''}${base(id)==='smoke'?` (${who2.tok.smoke} puffs)`:''}<br>${esc(C.x)}</div>`}),
    ...who2.evo.map(e=>`<div class="mc E"><b>🧬 ${esc(evoName(e))}</b> <i>evolution</i><br>${esc(EVOFX[evoKey(e)].x)}</div>`),
    ...who2.hand.map(e=>`<div class="mc E hand"><b>🧬 ${esc(evoName(e))}</b> <i>in hand, play on your turn</i><br>${esc(EVOFX[evoKey(e)].x)}</div>`)];
  if(exOn('curse'))list.unshift(`<div class="mc K"><b>𓂀 Curse: ${esc(CURSES[G.curse].n)}</b><br>${esc(CURSES[G.curse].x)}<br><i>Snake: ${esc(CURSES[G.curse].s)} Ankh: ${esc(CURSES[G.curse].a)}</i></div>`);
  if(exOn('tower'))list.unshift(`<div class="mc T"><b>🗼 Tokyo Tower levels: ${G.tower.map((o,l)=>`${l+1}: ${o<0?'free':esc(mname(P(o)))}`).join(' · ')}</b><br>In the city, resolve four 1s to climb. Own all three to win.</div>`);
  if(exOn('wick'))list.unshift(`<div class="mc W"><b>😈 Wickedness: ${who2.wk}</b> (powers at 3, 6 and 10)</div>`);
  if(exOn('bers')&&who2.tok.berserk)list.unshift(`<div class="mc B"><b>😡 BERSERK!</b><br>You roll the berserk die. Heal with hearts to calm down.</div>`);
  if(exOn('cult'))list.unshift(`<div class="mc M"><b>🕯 Cultists: ${who2.cult}</b><br>Four identical faces gain one. Spend one on your turn for a heart, an energy or a reroll.</div>`);

function exIcons(p){let s='';if(exOn('cult')&&p.cult)s+=' 🕯'+p.cult;if(exOn('wick'))s+=' 😈'+p.wk;if(exOn('tower')){const t=G.tower.filter(o=>o===p.i).length;if(t)s+=' 🗼'+t}if(p.tok&&p.tok.berserk)s+=' 😡';return s}
function statsHTML(){const rows=G.pl.map(p=>{const s=p.stats||{};return `<tr class="${'P'+(p.i+1)===G.winner?'win':''}"><td><b style="color:${MONS[p.m].c};-webkit-text-stroke:.6px #1a1320">${esc(mname(p))}</b>${p.human&&G.mode==='solo'?' (you)':''}</td><td>${p.alive?'♥'+p.hp:'K.O.'}</td><td>★${p.vp}</td><td>${s.dmg||0}</td><td>${s.kos||0}</td><td>${s.cards||0}</td><td>${s.city||0}</td></tr>`}).join('');
  return `<div class="dlg" role="dialog" aria-modal="true"><h2>🏆 Game over</h2><p><b>${esc(G.winText)}</b></p><p class="small muted">Round ${G.turn}.</p>
  <table class="stats"><tr><th>Monster</th><th>Hearts</th><th>Stars</th><th>Claw damage</th><th>K.O.s</th><th>Cards</th><th>Turns in city</th></tr>${rows}</table>
  <div class="acts"><button class="btn primary" data-a="new">Play again</button><button class="btn" data-a="closestats">Look at the city</button></div></div>`}
try{const sp=localStorage.getItem('ccs_speed');if(sp!==null)setSpeed(+sp)}catch(e){}
function seatInfo(k){if(!G||UI.info)return;const p=P(k);const hidden=(G.mode==='solo'||G.mode==='net')&&!(NET.on?k===NET.mySeat:p.human);
  UI.peek={title:mname(p)+(pname(p)?' ('+pname(p)+')':''),text:`${MONS[p.m].d}. ${p.alive?`${p.hp}/${maxhp(p)} hearts, ${p.vp} stars, ${p.en} energy${mbOn()?`, ${p.mb} Mindbug token${p.mb===1?'':'s'}`:''}, in ${where(p.i)}.`:'Knocked out.'} Cards: ${p.cards.length?p.cards.map(c=>CARDS[base(c)].n+' ('+CARDS[base(c)].x+')').join(' · '):'none'}.${p.evo.length?' Evolutions: '+p.evo.map(e=>evoName(e)+' ('+EVOFX[evoKey(e)].x+')').join(' · ')+'.':''}${p.hand.length?` ${p.hand.length} evolution card${p.hand.length===1?'':'s'} in hand${hidden?' (hidden)':': '+p.hand.map(evoName).join(', ')}.`:''}`,options:[],cancel:true};render()}
try{init3D()}catch(e){console.warn('3D off',e);V3.on=false;document.body.classList.remove('three')}
if(typeof soundBtns==='function')soundBtns();
renderLegend();render();

</script>
</body>
</html>
