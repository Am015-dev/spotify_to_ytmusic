<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crown City Smash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff3cf; --paper2:#ffe39a; --card:#fffaf0; --ink:#1a1320; --ink2:#4a3b52; --muted:#7b6c80;
  --red:#e63946; --yellow:#ffd23f; --blue:#3a86ff; --green:#2ec27e; --purple:#9b5de5; --orange:#ff8c42; --cyan:#4cc9f0;
  --sky1:#ffb347; --sky2:#ff6f61; --sea:#3aa6d9; --dot:rgba(26,19,32,.13); --shadow:#1a1320;
  --energy:#2ec27e; --heart:#e63946; --star:#f4a300; --claw:#1a1320;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#231a2e; --paper2:#3a2a4a; --card:#2e2340; --ink:#fff3dc; --ink2:#e2d3ee; --muted:#b3a3c0;
  --dot:rgba(255,243,220,.07); --shadow:#000; --claw:#fff3dc; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#231a2e; --paper2:#3a2a4a; --card:#2e2340; --ink:#fff3dc; --ink2:#e2d3ee; --muted:#b3a3c0;
  --dot:rgba(255,243,220,.07); --shadow:#000; --claw:#fff3dc; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font:600 16px/1.4 Nunito,"Trebuchet MS",sans-serif;
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:11px 11px}
h1,h2,h3,.bang{font-family:Bangers,Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.6rem 1.2rem;background:var(--red);color:#fff;border-bottom:4px solid #1a1320}
header h1{margin:0;font-size:2.3rem;line-height:1;color:var(--yellow);-webkit-text-stroke:1.5px #1a1320;text-shadow:3px 3px 0 #1a1320;transform:rotate(-1.5deg)}
header .sub{font-weight:800;opacity:.95}
header .spacer{flex:1}
header .btn{background:#fff;color:#1a1320}
.btn{border:3px solid #1a1320;background:var(--card);padding:.38rem .85rem;border-radius:10px;box-shadow:3px 3px 0 var(--shadow);font-weight:900;line-height:1.2;transition:transform .08s}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--yellow);color:#1a1320}
.btn.danger{background:var(--red);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-weight:700;font-size:.8rem;color:inherit;opacity:.8}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:1rem;padding:1rem 1.2rem;max-width:1560px;margin:0 auto}
@media (max-width:1020px){.wrap{grid-template-columns:1fr;padding:.6rem 16px}}
.board{min-width:0;position:relative}
#map{width:100%;height:auto;display:block;border:4px solid #1a1320;border-radius:14px;box-shadow:6px 6px 0 var(--shadow);background:#ffb347}
#banner{position:absolute;left:50%;top:14px;transform:translateX(-50%) rotate(-1deg);max-width:88%;background:#fff;color:#1a1320;border:3px solid #1a1320;border-radius:12px;padding:.35rem .9rem;box-shadow:4px 4px 0 #1a1320;font-weight:900;text-align:center;pointer-events:none;transition:opacity .3s}
#banner:empty{opacity:0}
#banner b{color:var(--red)}
.side{display:flex;flex-direction:column;gap:.85rem;min-width:0}
.box{background:var(--card);border:3px solid #1a1320;border-radius:14px;box-shadow:5px 5px 0 var(--shadow);padding:.7rem .85rem}
.box h3{margin:0 0 .4rem;font-size:1.45rem;line-height:1}
.muted{color:var(--muted)} .small{font-size:.88rem}
#prompt .who{font-family:Bangers,Impact,sans-serif;font-size:1.7rem;letter-spacing:.04em;line-height:1}
#prompt .msg{margin:.3rem 0 .2rem}
.acts{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.5rem}
.acts .btn{flex:1 1 auto;text-align:center}
.dicebox{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;min-height:66px}
.die{width:50px;height:50px;border-radius:12px;border:3px solid #1a1320;background:#fffdf5;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:3px 3px 0 var(--shadow);position:relative}
.die svg{width:36px;height:36px;display:block}
.die.kept{background:var(--yellow);transform:translateY(-4px);box-shadow:3px 7px 0 var(--shadow)}
.die.kept::after{content:"KEEP";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#1a1320;color:#fff;font:10px/1 Bangers,Impact,sans-serif;letter-spacing:.08em;padding:2px 5px;border-radius:5px}
.die.extra{border-color:var(--green);border-style:solid;outline:2px dashed var(--green);outline-offset:1px}
.die[disabled]{cursor:default}
.die.spin{animation:spin .45s ease-out}
@keyframes spin{0%{transform:rotate(-200deg) scale(.4);opacity:.2}70%{transform:rotate(12deg) scale(1.1)}100%{transform:none}}
.rolls{display:flex;gap:.35rem;align-items:center;margin-top:.55rem;font-weight:800}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid #1a1320;background:var(--yellow)}
.pip.used{background:transparent}
.market{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.pc{border:3px solid #1a1320;border-radius:12px;background:#fffdf5;color:#1a1320;display:flex;flex-direction:column;overflow:hidden;box-shadow:3px 3px 0 var(--shadow);min-height:168px}
.pc .hd{display:flex;align-items:center;gap:.3rem;padding:.25rem .35rem;background:var(--purple);color:#fff;border-bottom:3px solid #1a1320}
.pc.D .hd{background:var(--red)}
.pc .cost{flex:none;width:28px;height:28px;border-radius:50%;background:var(--energy);border:2.5px solid #1a1320;color:#fff;display:flex;align-items:center;justify-content:center;font:1.1rem/1 Bangers,Impact,sans-serif}
.pc .nm{font:1.02rem/1 Bangers,Impact,sans-serif;letter-spacing:.03em}
.pc .ty{font:.7rem/1 Bangers,Impact,sans-serif;letter-spacing:.08em;padding:.12rem .35rem;background:#1a1320;color:#fff;align-self:flex-start;margin:.3rem .35rem 0;border-radius:4px}
.pc p{margin:.25rem .4rem .3rem;font-size:.8rem;line-height:1.25;flex:1}
.pc .buy{margin:0 .35rem .35rem;padding:.2rem;font-size:.85rem}
.mine{display:flex;flex-direction:column;gap:.35rem}
.mc{border:2.5px solid #1a1320;border-radius:9px;padding:.25rem .5rem;background:#fffdf5;color:#1a1320;font-size:.85rem}
.mc b{font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:1.02rem;letter-spacing:.03em;color:var(--purple)}
.legend{display:grid;grid-template-columns:34px 1fr;gap:.3rem .5rem;align-items:center;font-size:.86rem}
.legend svg{width:30px;height:30px;border:2px solid #1a1320;border-radius:7px;background:#fffdf5}
#log{max-height:230px;overflow:auto;font-size:.86rem;margin:0;padding-left:1.1rem}
#log li{margin:.12rem 0}
#log li.me{font-weight:900}
.hidden{display:none!important}
#modal{position:fixed;inset:0;background:rgba(26,19,32,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--card);border:4px solid #1a1320;border-radius:18px;box-shadow:8px 8px 0 #1a1320;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:1rem 1.2rem}
.dlg h2{margin:0 0 .4rem;font-size:2rem;line-height:1;color:var(--red)}
.dlg .acts{flex-direction:column}
.dlg .acts .btn{text-align:left}
.start h2{font-size:2.8rem;color:var(--yellow);-webkit-text-stroke:1.5px #1a1320;text-shadow:3px 3px 0 #1a1320}
.row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.35rem 0}
.row .btn{padding:.25rem .6rem}
.row .btn.on{background:var(--yellow);color:#1a1320}
.monpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.4rem}
.monpick button{border:3px solid #1a1320;border-radius:12px;background:#fffdf5;padding:.2rem;box-shadow:3px 3px 0 var(--shadow)}
.monpick button.on{background:var(--yellow)}
.monpick svg{width:100%;height:auto;display:block}
.monpick span{display:block;font:.85rem/1 Bangers,Impact,sans-serif;letter-spacing:.04em;color:#1a1320;padding-bottom:.15rem}
@media (max-width:560px){.monpick{grid-template-columns:repeat(3,minmax(0,1fr))}.market{grid-template-columns:1fr}.pc{min-height:0}}
.hl{outline:5px solid var(--blue)!important;outline-offset:3px;position:relative;z-index:5}
#coach{border-color:var(--blue)}
#coach h3{color:var(--blue)}
.rules h3{margin:.8rem 0 .2rem;font-size:1.35rem;color:var(--purple)}
.rules p,.rules li{font-size:.93rem}
g.seat{cursor:pointer}
.score{display:none}
@media (max-width:700px){.score{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-top:.6rem}
 .sc{border:2.5px solid #1a1320;border-radius:9px;background:var(--card);font-size:.82rem;overflow:hidden}
 .sc b{display:block;color:#1a1320;padding:.05rem .4rem;font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.04em;border-bottom:2px solid #1a1320}
 .sc span{display:block;padding:.1rem .4rem;font-weight:900}
 .sc.on{outline:3px solid var(--yellow)} .sc.ko{opacity:.5}}
/* v2: guided steps, expansion, nicer pieces */
.steps{display:flex;gap:3px;margin:0 0 .5rem;flex-wrap:wrap}
.st{flex:1 1 0;min-width:52px;text-align:center;font:.78rem/1.1 Nunito,sans-serif;font-weight:900;border:2.5px solid #1a1320;border-radius:8px;padding:.18rem .1rem;background:#fffdf5;color:#7b6c80}
.st b{display:block;font:1.05rem/1 Bangers,Impact,sans-serif;letter-spacing:.04em}
.st.done{background:#d9f5e3;color:#1a1320}
.st.done b::after{content:" ✓"}
.st.on{background:var(--yellow);color:#1a1320;transform:translateY(-2px);box-shadow:2px 3px 0 #1a1320}
#prompt .head{font:1.3rem/1.1 Bangers,Impact,sans-serif;letter-spacing:.04em;margin:.3rem 0 .1rem;color:var(--red)}
.how{margin:.2rem 0 .3rem;padding-left:1.3rem}
.how li{margin:.12rem 0}
.tip{margin-top:.4rem;background:var(--paper2);color:#1a1320;border:2px dashed #1a1320;border-radius:9px;padding:.3rem .55rem;font-size:.9rem}
.preview{margin-top:.6rem;font-size:.9rem;background:#fffdf5;color:#1a1320;border:2.5px solid #1a1320;border-radius:9px;padding:.3rem .55rem}
.preview:empty{display:none}
.btn.primary:not([disabled]){animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:3px 3px 0 var(--shadow)}50%{box-shadow:3px 3px 0 var(--shadow),0 0 0 4px rgba(255,210,63,.55)}}
@media (prefers-reduced-motion:reduce){.btn.primary{animation:none!important}.die.spin{animation:none!important}}
.btn.cons{background:#e8f4ff;color:#1a1320}
.btn.evo{background:#e9ffe0;color:#1a1320}
.btn.cons small,.btn.evo small{font-size:.74rem}
.die{background:linear-gradient(160deg,#ffffff 0%,#fff6dc 70%,#f1e2b8 100%)}
.die.kept{background:linear-gradient(160deg,#fff4a8 0%,#ffd23f 70%,#f0b700 100%)}
.die.sm{width:40px;height:40px;border-width:2.5px;box-shadow:2px 2px 0 var(--shadow)}
.die.sm svg{width:28px;height:28px}
.mdice{display:flex;flex-wrap:wrap;gap:.35rem;margin:.2rem 0 .5rem}
.pc.C .hd{background:var(--blue)}
.pc .hd .cicon{margin-left:auto;flex:none}
.cicon{width:26px;height:26px;display:block;background:#fffdf5;border:2px solid #1a1320;border-radius:7px}
.pc.sugg{outline:4px solid var(--yellow);outline-offset:2px;position:relative}
.pc.sugg::before{content:"SUGGESTED";position:absolute;top:-11px;right:8px;background:#1a1320;color:var(--yellow);font:11px/1 Bangers,Impact,sans-serif;letter-spacing:.08em;padding:3px 6px;border-radius:5px;z-index:1}
.pc{overflow:visible}
.mc.C b{color:var(--blue)} .mc.E b{color:#23874f} .mc.M{background:#ffe3f2} .mc.M b{color:#b0306f}
.mc.hand{border-style:dashed}
.mc i{font-size:.75rem;color:#7b6c80}
.pass{background:var(--yellow);color:#1a1320;border:2.5px solid #1a1320;border-radius:9px;padding:.3rem .6rem;font-weight:900}
.monpick{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.pc .hd{border-radius:9px 9px 0 0}

</style>
</head>
<body>
<header>
  <h1>Crown City Smash</h1>
  <span class="sub">Roll, smash and stomp your way to 20 stars</span>
  <span class="spacer"></span>
  <button class="btn" data-a="speed" id="speedbtn">Speed: normal</button>
  <button class="btn" data-a="tour">Tour</button>
  <button class="btn" data-a="rules">Rules</button>
  <button class="btn" data-a="new">New game</button>
</header>
<div class="wrap">
  <div class="board">
    <svg id="map" viewBox="0 0 1000 640" role="img" aria-label="The city arena and the monsters"></svg>
    <div id="banner"></div>
    <div id="score" class="score"></div>
  </div>
  <div class="side">
    <div id="coach" class="box hidden"></div>
    <div id="prompt" class="box"></div>
    <div id="dicewrap" class="box"><h3>Dice</h3><div id="dice" class="dicebox"></div><div id="rolls" class="rolls"></div><div id="preview" class="preview"></div></div>
    <div id="marketwrap" class="box"><h3>Power cards for sale</h3><div id="market" class="market"></div></div>
    <div id="minewrap" class="box"><h3 id="minettl">Your cards</h3><div id="mine" class="mine"></div></div>
    <div id="legendwrap" class="box"><h3>Dice faces</h3><div id="legend" class="legend"></div></div>
    <div id="logwrap" class="box"><h3>City chronicle</h3><ol id="log"></ol></div>
  </div>
</div>
<div id="modal" class="hidden"></div>
<script>
var ANIM=1, AIDELAY=650, DEFN=4, DEFX='trial', DEFEVO=true, YA=3, YB=0, MBT=8;
const SAVE='ccs_save2', TOUR='ccs_tour2';
const FACES=['1','2','3','E','C','H'];
const MONS=[
 {n:'Voltusk',c:'#ffd23f',d:'Thunder-tusked boar of the power grid'},
 {n:'Squidrik',c:'#b57bff',d:'One-eyed terror of the storm drains'},
 {n:'Magmaw',c:'#ff6b4a',d:'Lava crab with molten pincers'},
 {n:'Shroomhulk',c:'#6ad16a',d:'Spore brute from the sewer farms'},
 {n:'Boltbox',c:'#4fa3ff',d:'Runaway demolition robot'},
 {n:'Glacyx',c:'#8fe9f2',d:'Walking glacier with a cold heart'},
 {n:'Cortexa',c:'#ff8fc7',d:'Brain-bug mastermind from beyond the portal',x:1},
 {n:'Clampede',c:'#3cc9b0',d:'Clam-headed centipede that crawled out of a portal',x:1},
 {n:'Bramblebat',c:'#9ad35a',d:'Thorny bat-bush hybrid with a taste for neon',x:1}];
// Power cards. t: K keep, D use now, C consumable (keep it, discard it later to use). v = computer's value of a keep card.
const CARDS={
 acid:{n:'Corrosive Drool',c:6,t:'K',v:6,x:'Your smash deals +1 damage every turn, even when you roll no claws.'},
 cosmic:{n:'Cosmic Gut',c:3,t:'K',v:4,x:'Power cards cost you 1 energy less.'},
 alpha:{n:'Top Predator',c:5,t:'K',v:5,x:'Gain 1 star whenever you smash with claws.'},
 plated:{n:'Plated Hide',c:4,t:'K',v:4,x:'Ignore any hit that would cost you exactly 1 heart.'},
 lurker:{n:'Alley Lurker',c:4,t:'K',v:2,x:'You may reroll your 3s even after your last roll.'},
 tunnel:{n:'Tunneler',c:5,t:'K',v:4,x:'+1 smash damage while you are in the city. When you yield, the monster taking your place loses 1 heart.'},
 chameleon:{n:'Chameleon Skin',c:3,t:'K',v:4,x:'When you take damage, roll a die for each point. Every heart rolled cancels 1 damage.'},
 spree:{n:'Wrecking Spree',c:3,t:'K',v:1.5,x:'If your final dice show 1, 2, 3, energy, claw and heart, gain 9 stars.'},
 news:{n:'News Chopper',c:3,t:'K',v:3,x:'Gain 1 star whenever you buy a power card.'},
 carrion:{n:'Carrion Feast',c:4,t:'K',v:3,x:'Gain 3 stars whenever a monster is knocked out.'},
 battery:{n:'Battery Belly',c:3,t:'K',v:3,x:'At the end of your turn, gain 1 star for every 6 energy you hold.'},
 growth:{n:'Growth Spurt',c:4,t:'K',v:5,x:'Your maximum hearts go up by 2. Heal 2 when you buy this.'},
 skull:{n:'Second Skull',c:7,t:'K',v:9,x:'You roll one extra die.'},
 scorch:{n:'Scorch Breath',c:4,t:'K',v:3,x:'When you smash with claws, the monsters seated next to you lose 1 extra heart.'},
 hiccup:{n:'Time Hiccup',c:5,t:'K',v:2,x:'On a turn you score three 1s, take another turn with one die fewer.'},
 kidfan:{n:'Kid Fan Club',c:3,t:'K',v:4,x:'Whenever you gain energy, gain 1 more.'},
 brain:{n:'Mega Brain',c:5,t:'K',v:6,x:'You get one extra reroll each turn.'},
 gourmand:{n:'Gourmand',c:4,t:'K',v:2,x:'When you score 1s, gain 2 extra stars.'},
 grazer:{n:'Grazer',c:5,t:'K',v:3,x:'Gain 1 star at the end of any turn in which you damaged nobody.'},
 pack:{n:'Pack Hunter',c:3,t:'K',v:3,x:'Once per turn, turn one of your dice into a 1.'},
 egg:{n:'Egg Clutch',c:7,t:'K',v:5,x:'If you are knocked out, discard all your cards and stars, and hatch again with 10 hearts.'},
 vjets:{n:'Vapor Jets',c:5,t:'K',v:4,x:'When you yield the city, you take none of the smash damage.'},
 nova:{n:'Nova Roar',c:7,t:'K',v:6,x:'Your smash hits every other monster, wherever they are.'},
 omni:{n:'Omni-Muncher',c:4,t:'K',v:4,x:'Once per turn, a 1-2-3 scores 2 stars. Those dice still count for other sets.'},
 twist:{n:'Twist Ending',c:3,t:'K',v:2,x:'Turn one die to any face, then discard this card.'},
 quills:{n:'Venom Quills',c:3,t:'K',v:2,x:'When you score 2s and smash with claws, deal 2 extra damage.'},
 mend:{n:'Quick Mend',c:3,t:'K',v:4,x:'At any time, pay 2 energy to heal 1 heart.'},
 regrow:{n:'Regrowth',c:4,t:'K',v:3,x:'When your heart dice heal you, heal 1 extra.'},
 underdog:{n:'Underdog Spirit',c:3,t:'K',v:3,x:'At the end of your turn, if you have the fewest stars, gain 1 star.'},
 smoke:{n:'Smoke Screen',c:4,t:'K',v:4,x:'Comes with 3 puffs. Spend a puff for an extra reroll. Discard when empty.'},
 sun:{n:'Sunsoaker',c:2,t:'K',v:2,x:'At the end of your turn, if you have no energy, gain 1.'},
 barbed:{n:'Barbed Tail',c:5,t:'K',v:6,x:'When you smash with claws, deal 1 extra damage.'},
 rubber:{n:'Rubber Limbs',c:3,t:'K',v:3,x:'Before resolving, pay 2 energy to turn one die to any face.'},
 mind:{n:'Mind Link',c:4,t:'K',v:3,x:'Pay 1 energy for an extra reroll.'},
 street:{n:'Street Eater',c:4,t:'K',v:5,x:'Gain 1 extra star when you start your turn in the city. +1 smash damage from the city.'},
 thick:{n:'Thick Skin',c:3,t:'K',v:3,x:'Whenever you lose 2 or more hearts at once, gain 1 energy.'},
 wings:{n:'Membrane Wings',c:6,t:'K',v:5,x:'At the start of another monster’s turn, you may pay 2 energy to take no damage from it that turn.'},
 kiosk:{n:'Corner Kiosk',c:3,t:'D',x:'Gain 1 star.'},
 train:{n:'Rush-Hour Train',c:4,t:'D',x:'Gain 2 stars.'},
 tower:{n:'Tower Block',c:5,t:'D',x:'Gain 3 stars.'},
 needle:{n:'Sky Needle',c:6,t:'D',x:'Gain 4 stars.'},
 sirens:{n:'Panic Sirens',c:7,t:'D',x:'Every other monster loses 5 stars.'},
 surge:{n:'Power Surge',c:8,t:'D',x:'Gain 9 energy.'},
 flame:{n:'Flame Wave',c:3,t:'D',x:'Every other monster loses 2 hearts.'},
 refinery:{n:'Refinery Blast',c:6,t:'D',x:'Gain 2 stars. Every other monster loses 3 hearts.'},
 patch:{n:'Patch Up',c:3,t:'D',x:'Heal 2 hearts.'},
 carpet:{n:'Carpet Strike',c:4,t:'D',x:'Every monster, you included, loses 3 hearts.'},
 jetsq:{n:'Jet Squadron',c:5,t:'D',x:'Gain 5 stars and lose 4 hearts.'},
 militia:{n:'Militia Drill',c:3,t:'D',x:'Gain 2 stars and lose 2 hearts.'},
 reactor:{n:'Reactor Snack',c:6,t:'D',x:'Gain 2 stars and heal 3 hearts.'},
 tanks:{n:'Tank Column',c:4,t:'D',x:'Gain 4 stars and lose 3 hearts.'},
 cyclone:{n:'Cyclone',c:6,t:'D',x:'Gain 2 stars. Every other monster loses 1 energy for every 2 it holds.'},
 rush:{n:'Rampage Rush',c:7,t:'D',x:'Take another turn right away (skip your end-of-turn effects).'},
 skydive:{n:'Skydive Stomp',c:5,t:'D',x:'Gain 2 stars and take over the city if you are not already there.'},
 // ---- Mindbug expansion cards (24, original text) ----
 m_hunt:{n:'Stalker’s Mark',c:4,t:'C',kw:'Hunter',when:'roll',x:'Use before resolving: this turn your smash hits every other monster.'},
 m_sneak:{n:'Shadow Pounce',c:3,t:'C',kw:'Sneaky',when:'roll',x:'Use before resolving: this turn your smash ignores all defences (hides, wings, Tough).'},

const base=id=>id.split('#')[0];

// ---------- helpers ----------
const rnd=n=>Math.floor(Math.random()*n);

function gainE(p,n){if(n<=0)return;n+=has(p,'kidfan');p.en+=n;fx(p.i,'+'+n+'⚡','energy')}
function heal(p,n){const d=Math.max(0,Math.min(n,maxhp(p)-p.hp));p.hp+=d;if(d)fx(p.i,'+'+d+'♥','heal');return d}
function gainMB(p,n){p.mb+=n;fx(p.i,'+'+n+' mindbug','star')}
function neighbours(i){const n=G.pl.length;let l=null,r=null;
  for(let k=1;k<n;k++){const j=(i+k)%n;if(G.pl[j].alive){r=j;break}}for(let k=1;k<n;k++){const j=(i-k+n)%n;if(G.pl[j].alive){l=j;break}}return [...new Set([l,r].filter(x=>x!==null&&x!==i))]}
function countsOf(dice){const c={'1':0,'2':0,'3':0,E:0,C:0,H:0};dice.forEach(d=>c[d.f]++);return c}
const counts=()=>countsOf(G.dice);
function draw(){if(!G.deck.length){G.deck=shuffle(G.disc);G.disc=[]}return G.deck.pop()||null}

const mbOn=()=>G.xp!=='base';

// ---------- setup ----------
function newGame(mode,n,mon){
  n=n||UI.n||DEFN;mon=(mon===undefined?UI.mon:mon);const xp=UI.xp||DEFX,evoOn=UI.evo;
  const pool=[0,1,2,3,4,5,6,7,8].filter(m=>xp!=='base'||m<6);
  const others=shuffle(pool.filter(m=>m!==mon));
  const mons=mode==='solo'?[mon,...others]:shuffle(pool.slice());
  const pl=[];for(let i=0;i<n;i++)pl.push({i,m:mons[i],hp:10,vp:0,en:0,mb:xp==='base'?0:1,cards:[],evo:[],hand:[],edeck:[],alive:true,human:mode==='hot',tok:{}});
  if(mode==='solo'){const seat=rnd(n);const hm=pl[0].m;pl[0].m=pl[seat].m;pl[seat].m=hm;pl[seat].human=true}
  pl.forEach(p=>p.edeck=shuffle([0,1,2,3,4,5]));
  const deck=xp==='exp'?MBDECK.slice():xp==='trial'?[...BASEDECK,...MBDECK]:BASEDECK.slice();
  G={mode,n,xp,evoOn,pl,city:-1,bay:-1,bayOn:n>=5,deck:shuffle(deck),disc:[],market:[],dice:[],rolls:0,phase:'start',active:0,turn:1,tid:0,log:[],winner:null,winText:'',tf:{},less:0,rollId:0,step:1};
  refill();UI.choice=null;UI.roll=null;UI.pick=null;UI.busy=false;UI.info=false;UI.fx={};UI.banner='';
  lg(-1,`A new rampage begins with ${n} monsters: ${pl.map(mname).join(', ')}.`);
  if(xp!=='base')lg(-1,`Mindbug ${xp==='exp'?'Experience (only the new cards)':'Trial (new cards mixed in)'}: every monster starts with 1 Mindbug token.`);
  if(evoOn)lg(-1,'Evolutions are on: resolve three hearts to draw an evolution card.');
  if(G.bayOn)lg(-1,'With 5 or more monsters, the Harbor is open as a second city space.');
  startTurn();
}

// ---------- asking (humans get a modal, computers answer at once) ----------
function ask(i,title,text,options,aiPick,cb,extra){
  if(isHuman(i)&&!G.winner){UI.choice=Object.assign({title,text,options,cb,who:i},extra||{});render();return}
  cb(aiPick())}
function seq(list,fn,done){let k=0;const next=()=>{if(k>=list.length){done();return}fn(list[k++],next)};next()}

// ---------- turn flow ----------
function startTurn(){
  if(G.winner)return;
  const p=cur();G.phase='start';G.tid++;G.tf={dealt:0,culler:false,ones:false};G.bugBy=-1;G.step=1;UI.banner='';
  alive().forEach(q=>{if(q.i!==p.i)q.tok.shield=false});
  const flyers=alive().filter(q=>q.i!==p.i&&has(q,'wings')&&q.en>=2);
  seq(flyers,(q,next)=>ask(q.i,'Membrane Wings',`${mname(p)} is about to take a turn. Pay 2 energy to take no damage from it this turn?`,
      [{k:'y',l:'Spread wings (pay 2 ⚡)',d:`You have ${q.en} energy.`},{k:'n',l:'Save the energy'}],
      ()=>aiWings(q,p)?'y':'n',k=>{if(k==='y'){q.en-=2;q.tok.shield=true;lg(q.i,`${mname(q)} spreads its wings against ${mname(p)}.`)}next()}),
    ()=>{
      if(inTokyo(p.i)){const b=2+has(p,'street');gainVP(p,b);lg(p.i,`${mname(p)} starts in ${where(p.i)} and gains ${b} stars.`)}
      if(has(p,'pen'))gainE(p,has(p,'pen'));
      if(checkWin(false)){refresh();return}
      const nd=Math.max(1,6+has(p,'skull')-G.less);G.less=0;
      G.dice=[];for(let k=0;k<nd;k++)G.dice.push({f:FACES[rnd(6)],k:false,x:k>=6});
      G.rolls=2+has(p,'brain');G.rollId++;G.phase='roll';G.aiMarked=false;
      lg(p.i,`${mname(p)} rolls ${nd} dice.`);refresh()});
}
function reroll(){G.dice.forEach(d=>{if(!d.k)d.f=FACES[rnd(6)]});G.rollId++;UI.banner=''}
function doReroll(kind){const p=cur();
  if(kind==='mind'){p.en-=1}else if(kind==='smoke'){p.tok.smoke--;if(p.tok.smoke<=0){discardCard(p,'smoke');lg(p.i,`${mname(p)} uses its last puff of smoke.`)}}
  else if(kind==='lurker'){G.dice.forEach(d=>{d.k=d.f!=='3'});reroll();G.dice.forEach(d=>d.k=false);lg(p.i,`${mname(p)} lurks and rerolls its 3s.`);refresh();return}
  else if(kind==='free'){}
  else G.rolls--;
  reroll();refresh()}
function discardCard(p,id){const k=p.cards.findIndex(c=>base(c)===id);if(k>=0)G.disc.push(p.cards.splice(k,1)[0])}

// ---------- Mindbug + resolving ----------
function resolve(){
  const roller=cur();G.phase='resolve';UI.busy=true;G.step=2;G.bugBy=-1;
  let cands=[];
  if(mbOn()&&!immune(roller)){const n=G.pl.length;for(let k=1;k<n;k++){const q=G.pl[(roller.i+k)%n];if(q.alive&&q.mb>0)cands.push(q)}}
  seq(cands,(q,next)=>{if(G.bugBy>=0){next();return}
    const mine=scoreDice(q,G.dice),theirs=scoreDice(roller,G.dice);
    const rec=aiMindbug(q,roller);
    ask(q.i,'Mindbug?',`${mname(roller)} finished rolling. You have ${q.mb} Mindbug token${q.mb===1?'':'s'}. Spend one to resolve these dice as if they were yours? ${mname(roller)} then gets nothing from them.`,
      [{k:'y',l:'MINDBUG! Take these dice',d:`You would get: ${mine.text}.${rec?' Recommended.':''}`},{k:'n',l:'Let it go',d:`${mname(roller)} gets: ${theirs.text}.${rec?'':' Recommended: save your token.'}`}],
      ()=>rec?'y':'n',k=>{if(k==='y'){G.bugBy=q.i;q.mb--;
        lg(q.i,`${mname(q)} MINDBUGS ${mname(roller)} and resolves its dice!`);fx(q.i,'MINDBUG!','star');fx(roller.i,'bugged!','hurt');
        if(has(q,'m_hive'))gainVP(q,has(q,'m_hive'));
        if(has(q,'m_leech')){const t=Math.min(2*has(q,'m_leech'),roller.en);roller.en-=t;q.en+=t;if(t)lg(q.i,`${mname(q)}'s Brain Leech drains ${t} energy.`)}}
        next()},{dice:true})},
    ()=>doResolve(G.bugBy>=0?P(G.bugBy):roller))}
// what a set of dice would give monster p (for previews and computer decisions)
function scoreDice(p,dice){const c=countsOf(dice);let vp=0,en=0,hl=0,dmg=0,kill=false,targets=[];const inT=inTokyo(p.i);
  for(const f of ['1','2','3'])if(c[f]>=3){vp+=(+f)+(c[f]-3);if(f==='1'&&has(p,'gourmand'))vp+=2}
  if(has(p,'omni')&&c['1']&&c['2']&&c['3'])vp+=2;
  if(c.E)en=c.E+has(p,'kidfan');
  if(c.H&&!inT)hl=Math.min(c.H+has(p,'regrow')+has(p,'pheal'),maxhp(p)-p.hp);
  let amt=c.C;if(amt>0){amt+=has(p,'barbed');if(inT)amt+=has(p,'street')+has(p,'tunnel')+has(p,'pclaw')}amt+=has(p,'acid');
  if(amt>0){targets=has(p,'nova')?alive().filter(q=>q.i!==p.i):inT?alive().filter(q=>!inTokyo(q.i)&&q.i!==p.i):alive().filter(q=>inTokyo(q.i)&&q.i!==p.i);
    dmg=amt;kill=targets.some(q=>q.hp<=amt)}
  const empty=G.city===-1&&!inT;
  const parts=[];if(vp)parts.push(`${vp} star${vp===1?'':'s'}`);if(en)parts.push(`${en} energy`);if(hl)parts.push(`heal ${hl}`);
  if(c.H&&inT)parts.push('hearts wasted (in city)');
  if(dmg&&targets.length)parts.push(`smash ${targets.map(mname).join(', ')} for ${dmg}${kill?' (a knockout!)':''}`);else if(c.C)parts.push('claws hit nobody');
  if(c.H>=3&&G.evoOn)parts.push('an evolution card');
  const val=vp*1.6+en*0.6+hl*(p.hp<=5?1:0.5)+dmg*targets.length*0.7+(kill?5:0)+(c.H>=3&&G.evoOn?2:0);
  return {vp,en,hl,dmg,kill,targets,val,text:parts.length?parts.join(', '):'nothing useful'}}
function doResolve(p){
  const roller=cur();const bug=p.i!==roller.i;const c=counts();const out=[];const inT=inTokyo(p.i);
  let q2=false;const echo=bug?0:(G.tf.echo?2:0);
  for(const f of ['1','2','3']){const n=c[f];if(n>=3){let v=(+f)+(n-3)+echo;if(f==='1'&&has(p,'gourmand'))v+=2*has(p,'gourmand');gainVP(p,v);out.push(`${v}★ from ${n}×${f}`);if(f==='2')q2=true;if(f==='1'&&!bug)G.tf.ones=true}}
  if(has(p,'omni')&&c['1']&&c['2']&&c['3']){gainVP(p,2);out.push('2★ munching 1-2-3')}
  if(has(p,'spree')&&FACES.every(f=>c[f])){gainVP(p,9);out.push('9★ wrecking spree')}
  if(c.E){gainE(p,c.E);out.push(`${c.E+has(p,'kidfan')}⚡`)}
  if(c.H){if(inT)out.push('hearts wasted in the city');else{const d=heal(p,c.H+has(p,'regrow')+has(p,'pheal'));if(d)out.push(`healed ${d}♥`)}}
  if(c.H>=3&&G.evoOn&&drawEvo(p))out.push('draws an evolution');
  // smash
  const tf=bug?{}:G.tf;
  let amt=c.C*(tf.frenzy?2:1);const claws=c.C>0;
  if(claws){amt+=has(p,'barbed');if(inT)amt+=has(p,'street')+has(p,'tunnel')+has(p,'pclaw');if(q2&&has(p,'quills'))amt+=2}
  amt+=has(p,'acid');
  const hitList=[];G.sneak=!!tf.sneak;
  if(amt>0){
    let tg=has(p,'nova')||tf.hunt?alive().filter(q=>q.i!==p.i):inT?alive().filter(q=>!inTokyo(q.i)&&q.i!==p.i):alive().filter(q=>inTokyo(q.i)&&q.i!==p.i);
    const extra={};if(claws&&has(p,'scorch')){for(const j of neighbours(p.i))extra[j]=(extra[j]||0)+has(p,'scorch')}
    if(claws&&has(p,'m_ambush')&&!inT){const o=alive().filter(q=>q.i!==p.i&&!inTokyo(q.i)&&!tg.includes(q)).sort((a,b)=>b.vp-a.vp)[0];if(o)extra[o.i]=(extra[o.i]||0)+1}
    const all=new Set([...tg.map(q=>q.i),...Object.keys(extra).map(Number)]);
    const venom=claws&&(tf.venom?2:(has(p,'m_stinger')||has(p,'pvenom'))?1:0);
    for(const j of all){const q=P(j);const a=(tg.includes(q)?amt:0)+(extra[j]||0);const lost=damage(q,a,p);
      if(venom&&lost>0&&q.hp>0&&q.hp<=venom&&!(tf.venom?false:q.hp!==1)){q.hp=0;fx(q.i,'VENOM!','hurt');lg(p.i,`${mname(p)}'s venom finishes off ${mname(q)}!`)}
      if(tg.includes(q)&&inTokyo(j))hitList.push({j,lost})}
    if(all.size){out.push(`smashes ${[...all].map(j=>mname(P(j))).join(', ')} for ${amt}`);lg(p.i,`${mname(p)} smashes ${[...all].map(j=>mname(P(j))+' (−'+(tg.map(q=>q.i).includes(j)?amt:0)+(extra[j]?'+'+extra[j]:'')+')').join(', ')}.`);if(claws&&has(p,'alpha'))gainVP(p,has(p,'alpha'))}
    else if(claws)out.push('claws hit nobody');
  }
  G.sneak=false;
  if(!bug&&G.tf.ones&&has(p,'hiccup'))G.tf.hiccup=true;
  UI.banner=`${bug?'🧠 ':''}<b>${esc(mname(p))}</b>${bug?' (Mindbug)':''}: ${out.length?esc(out.join(' · ')):'nothing useful'}`;
  if(out.length)lg(p.i,`${mname(p)} resolves${bug?' the stolen dice':''}: ${out.join(', ')}.`);
  const yielders=[];
  const canAsk=hitList.filter(h=>h.lost>0&&!inT&&(P(h.j).hp>0||has(P(h.j),'vjets')));
  seq(canAsk,(h,next)=>{const q=P(h.j);const rec=aiYield(q,h.lost);
      ask(q.i,'Stay or yield?',`${mname(p)} smashed you for ${h.lost}. You have ${Math.max(0,q.hp)} hearts left. If you yield, you leave ${where(q.i)} and ${mname(p)} moves in.${has(q,'vjets')?' Your Vapor Jets cancel the damage if you yield.':''}`,
        [{k:'stay',l:`Stay in ${where(q.i)}`,d:`You keep scoring 2 stars at the start of your turn, but everyone keeps hitting you.${rec?'':' Recommended.'}`},{k:'yield',l:'Yield and run!',d:`Leave the city so you can heal with hearts again.${rec?' Recommended: you are getting low.':''}`}],
        ()=>rec?'yield':'stay',k=>{if(k==='yield')yielders.push(h);next()})},
    ()=>{
      for(const h of yielders){const q=P(h.j);if(G.city===q.i)G.city=-1;if(G.bay===q.i)G.bay=-1;
        if(has(q,'vjets')){q.hp+=h.lost;fx(q.i,'jets!','heal')}
        lg(q.i,`${mname(q)} yields and flees the city.`);fx(q.i,'YIELD','star')}
      deaths();
      G.step=3;
      if(!G.winner&&bug&&p.alive&&yielders.length&&!inTokyo(p.i))takeSpot(p,yielders);
      if(!G.winner&&roller.alive)enterStep(roller,bug?[]:yielders);
      deaths();
      UI.busy=false;
      if(G.winner){refresh();return}
      if(!roller.alive){endTurn();return}
      G.phase='buy';G.step=4;G.aiSwept=false;refresh()})
}
function takeSpot(p,yielders){let spot=null;if(G.city===-1)spot='city';else if(G.bayOn&&G.bay===-1)spot='bay';if(!spot)return;
  if(spot==='city')G.city=p.i;else G.bay=p.i;gainVP(p,1+has(p,'penter'));lg(p.i,`${mname(p)} storms into ${where(p.i)} (+${1+has(p,'penter')} star).`);

function drawEvo(p){if(!p.edeck.length)return false;const j=p.edeck.pop();p.hand.push([p.m,j]);lg(p.i,`${mname(p)} evolves: it draws an evolution card${p.human||G.mode==='ai'?` (${evoName([p.m,j])})`:''}.`);fx(p.i,'EVOLVE!','heal');return true}
// apply damage; returns hearts actually lost
function damage(q,a,src,card){
  if(a<=0||!q.alive)return 0;
  const sneak=G.sneak&&src;
  if(!sneak&&q.tok.shield&&src&&src.i===G.active&&q.i!==src.i){fx(q.i,'wings!','heal');return 0}
  if(!sneak&&q.tok.tough){q.tok.tough=false;fx(q.i,'TOUGH!','heal');lg(q.i,`${mname(q)} shrugs off the hit (Tough).`);return 0}
  if(!sneak&&(has(q,'m_chitin')||has(q,'ptough'))&&q.tok.tt!==G.tid){q.tok.tt=G.tid;a-=1;if(a<=0){fx(q.i,'tough','heal');return 0}}
  if(!sneak&&a===1&&has(q,'plated')){fx(q.i,'blocked','heal');return 0}
  if(!sneak&&has(q,'chameleon')){let saved=0;for(let k=0;k<a;k++)if(rnd(6)===5)saved++;if(saved){a-=saved;fx(q.i,'dodged '+saved,'heal')}if(a<=0)return 0}

function checkWin(final){

function canBuy(p,k){const id=G.market[k];return id&&p.en>=costOf(p,id)}

  if(C.t==='K'||C.t==='C'){p.cards.push(id);if(b==='growth')heal(p,2);if(b==='smoke')p.tok.smoke=3;if(b==='m_hive')gainMB(p,1)}
  else{G.disc.push(id);playDiscard(p,b,()=>{deaths();after()});return}

function sweep(){const p=cur();if(p.en<2||!G.market.length)return;p.en-=2;G.disc.push(...G.market);G.market=[];refill();lg(p.i,`${mname(p)} pays 2 energy to sweep the market.`);refresh()}

// consumables
function consUsable(p,k){const id=p.cards[k];if(!id)return false;const C=CARDS[base(id)];if(C.t!=='C')return false;if(p!==cur()||G.winner)return false;

function evoUsable(p,k){const e=p.hand[k];if(!e||p!==cur()||G.winner)return false;const f=EVOFX[evoKey(e)];if(f.t==='roll')return G.phase==='roll';

function endTurn(){
  const p=cur();UI.pick=null;G.step=5;

    const eh=has(p,'battery');if(eh&&p.en>=6){const v=Math.floor(p.en/6)*eh;gainVP(p,v);lg(p.i,`${mname(p)}'s Battery Belly hums (+${v} stars).`)}

const fname=f=>({'1':'1','2':'2','3':'3',E:'energy',C:'claw',H:'heart'}[f]);

// ---------- computer players ----------
function tokyoThreat(p){return alive().filter(q=>q.i!==p.i&&!inTokyo(q.i)).length}
function aiWings(q,act){if(q.en<2)return false;const hitsMe=has(act,'nova')||(inTokyo(q.i)!==inTokyo(act.i));return hitsMe&&q.hp<=4}
function aiYield(q,lost){
  if(q.hp<=0)return true;
  const threat=tokyoThreat(q);
  if(q.vp>=18&&q.hp>Math.min(4,threat+1))return false;
  if(has(q,'vjets')&&q.hp<=7)return true;
  return q.hp<=Math.max(YA,threat+YB)}
function aiMindbug(q,roller){if(q.mb<=0)return false;
  const mine=scoreDice(q,G.dice),theirs=scoreDice(roller,G.dice);
  if(q.vp+mine.vp>=20)return true;
  if(roller.vp+theirs.vp>=20&&theirs.vp>0)return true;
  if(theirs.kill&&theirs.targets.includes(q))return true;
  const thr=MBT-(q.mb>1?2:0)-(G.turn>=6?1.5:0);
  return mine.val+theirs.val*0.8>=thr}
function aiWantsClaws(p){
  if(has(p,'nova'))return true;
  if(inTokyo(p.i))return true;
  const occ=[G.city,G.bay].filter(i=>i>=0).map(P);
  if(!occ.length)return false;
  const c=counts().C;
  if(occ.some(o=>o.hp<=c+2))return true;
  return p.hp>=5}
function aiMark(p){
  const c=counts();const inT=inTokyo(p.i);const miss=maxhp(p)-p.hp;
  let hw=inT?0:(p.hp<=5?miss:p.hp<=7?Math.min(miss,3):Math.min(miss,1));
  if(G.evoOn&&p.edeck.length&&c.H>=2&&(inT||hw<3))hw=Math.max(hw,3);
  const claws=aiWantsClaws(p);
  const keepNum={};for(const f of ['1','2','3'])if(c[f]>=3)keepNum[f]=true;
  const pairs=['3','2','1'].filter(f=>c[f]===2&&!keepNum[f]);
  if(pairs.length&&!(pairs[0]==='1'&&!has(p,'gourmand')&&c.C+c.E>=3))keepNum[pairs[0]]=true;
  if(has(p,'omni')&&c['1']&&c['2']&&c['3']){keepNum['1']=keepNum['2']=keepNum['3']=true}
  const needVP=20-p.vp;let hk=0;
  G.dice.forEach(d=>{let k=false;
    if(d.f in keepNum)k=true;
    else if(d.f==='E')k=!(hw>=3&&!inT);
    else if(d.f==='C')k=claws&&needVP>3||inT;
    else if(d.f==='H'){k=hk<hw;if(k)hk++}
    d.k=k})}
function aiRollStep(p){
  if(!G.aiMarked){aiMark(p);G.aiMarked=true;refresh();return}
  G.aiMarked=false;
  const unkept=G.dice.some(d=>!d.k);
  if(unkept&&G.rolls>0){doReroll('roll');return}
  const ev=p.hand.findIndex(e=>evoKey(e)==='reroll');if(unkept&&ev>=0&&G.dice.filter(d=>!d.k).length>=2){playEvo(p,ev);return}
  const ld=p.cards.findIndex(c=>base(c)==='m_loaded');if(unkept&&ld>=0&&G.dice.filter(d=>!d.k).length>=3){useCons(p,ld);return}
  if(unkept&&has(p,'smoke')&&p.tok.smoke>0&&G.dice.filter(d=>!d.k).length>=2){doReroll('smoke');return}
  if(unkept&&has(p,'mind')&&p.en>=4&&G.dice.filter(d=>!d.k).length>=2){doReroll('mind');return}
  if(has(p,'lurker')){const c=counts();if(c['3']>0&&c['3']<3&&G.tf.lurk!==true){G.tf.lurk=true;doReroll('lurker');return}}
  const rw=p.cards.findIndex(c=>base(c)==='m_rewind');if(rw>=0&&!G.tf.rw&&scoreDice(p,G.dice).val<2.5){G.tf.rw=true;useCons(p,rw);return}
  if(aiBuffs(p))return;
  aiTweak(p);resolve()}
function aiBuffs(p){const s=scoreDice(p,G.dice);const c=counts();const find=b=>p.cards.findIndex(x=>base(x)===b);
  const others=alive().filter(q=>q.i!==p.i).length;
  const pick=(b,cond)=>{const k=find(b);if(k>=0&&!G.tf[b.slice(2)]&&cond){useCons(p,k);return true}return false};
  return pick('m_frenzy',c.C>=2&&s.targets.length>0)||pick('m_hunt',c.C>=2&&s.targets.length<others)||
    pick('m_venom',c.C>=1&&s.targets.some(q=>q.hp<=s.dmg+2))||pick('m_sneak',c.C>=2&&s.targets.some(q=>has(q,'plated')||has(q,'chameleon')||q.tok.tough||q.tok.shield||has(q,'m_chitin')||has(q,'ptough')))||
    pick('m_echo',['1','2','3'].some(f=>c[f]>=3))}
function aiTweak(p){const c=counts();
  const junk=()=>{let k=G.dice.findIndex(d=>['1','2','3'].includes(d.f)&&c[d.f]===1);if(k<0&&inTokyo(p.i))k=G.dice.findIndex(d=>d.f==='H');return k};
  if(has(p,'pack')&&!G.tf.culler&&c['1']===2){const k=junk();if(k>=0&&G.dice[k].f!=='1'){G.dice[k].f='1';G.tf.culler=true;lg(p.i,`${mname(p)} turns a die into a 1 (Pack Hunter).`);return}}
  for(const f of ['3','2']){if(c[f]===2){const k=junk();if(k<0||G.dice[k].f===f)continue;
    if(has(p,'rubber')&&p.en>=4){G.dice[k].f=f;p.en-=2;lg(p.i,`${mname(p)} bends a die into a ${f} (Rubber Limbs).`);return}
    if(has(p,'twist')&&f==='3'){G.dice[k].f=f;discardCard(p,'twist');lg(p.i,`${mname(p)} twists a die into a 3 (Twist Ending).`);return}}}}
function cardValue(p,id){const b=base(id),C=CARDS[b],others=alive().filter(q=>q.i!==p.i);
  const lead=Math.max(0,...others.map(q=>q.vp));const late=p.vp>=12||lead>=14;const vpv=late?2.2:1.5;
  const hpv=h=>p.hp-h<=0?-99:(p.hp-h<=3?-2.5*h:-0.7*h);
  const cost=costOf(p,id);
  if(C.t==='D'){
    const vp={kiosk:1,train:2,tower:3,needle:4,refinery:2,reactor:2,jetsq:5,militia:2,tanks:4,cyclone:2,skydive:2,m_swarm:1,m_storm:2,m_beacon:2,m_blast:3}[b]||0;
    if(vp&&p.vp+vp>=20&&!({jetsq:4,militia:2,tanks:3}[b]>=p.hp))return 99;
    let v=vp*vpv;
    if(b==='jetsq')v+=hpv(4);if(b==='militia')v+=hpv(2);if(b==='tanks')v+=hpv(3);if(b==='carpet')v=others.filter(q=>q.hp<=3).length*6+others.length*1.5+hpv(3);
    if(b==='flame')v=others.length*1.3+others.filter(q=>q.hp<=2).length*6;if(b==='refinery')v+=others.length*1.8+others.filter(q=>q.hp<=3).length*6;

    if(b==='m_tough'&&inTokyo(p.i)&&!p.tok.tough&&consUsable(p,k)){useCons(p,k);return}

   heart:`<path d="M0 14 C-16 2 -18 -6 -12 -11 C-6 -16 -1 -12 0 -7 C1 -12 6 -16 12 -11 C18 -6 16 2 0 14 Z" fill="#e63946" ${S}/>`,
   bolt:`<path d="M4 -16 L-10 2 H0 L-4 16 L10 -2 H0 Z" fill="#2ec27e" ${S}/>`,
   claw:`<g fill="none" ${S} stroke-width="4"><path d="M-9 -12 C-4 -4 -4 6 -10 14"/><path d="M0 -14 C5 -4 5 6 0 16"/><path d="M9 -12 C14 -4 14 6 8 14"/></g>`,
   dice:`<rect x="-13" y="-13" width="26" height="26" rx="5" fill="#fff" ${S}/><circle cx="-5" cy="-5" r="2.5" fill="${INK}"/><circle cx="5" cy="5" r="2.5" fill="${INK}"/><circle cx="0" cy="0" r="2.5" fill="${INK}"/>`,
   Hunter:`<circle r="13" fill="#fff" ${S}/><circle r="6" fill="none" ${S}/><path d="M0 -18 V-8 M0 8 V18 M-18 0 H-8 M8 0 H18" ${S}/>`,
   Sneaky:`<path d="M-15 0 C-8 -10 8 -10 15 0 C8 10 -8 10 -15 0 Z" fill="#fff" ${S}/><circle r="4.5" fill="${INK}"/><path d="M-14 12 L14 -12" ${S}/>`,
   Venomous:`<path d="M0 -15 C8 -4 12 2 12 7 C12 14 6 17 0 17 C-6 17 -12 14 -12 7 C-12 2 -8 -4 0 -15 Z" fill="#7ee04c" ${S}/>`,
   Frenzy:`<path d="M-14 8 L-6 -14 L0 2 L6 -14 L14 8" fill="none" ${S} stroke-width="4"/><path d="M-10 14 H10" ${S}/>`,
   Tough:`<path d="M0 -16 L14 -10 V2 C14 10 6 15 0 17 C-6 15 -14 10 -14 2 V-10 Z" fill="#8ecae6" ${S}/>`}[k]||'';
  return `<svg viewBox="-20 -20 40 40" class="cicon" aria-hidden="true">${g}</svg>`}

function renderMap(){const svg=document.getElementById('map');if(!G){svg.innerHTML='';return}
  let s=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6f61"/><stop offset=".6" stop-color="#ffb347"/><stop offset="1" stop-color="#ffd98a"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7c2"/><stop offset="1" stop-color="#ffd23f"/></radialGradient>
  <pattern id="ht" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.8" fill="#1a1320" opacity=".12"/></pattern>
  <pattern id="waves" width="40" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 Q10 0 20 8 T40 8" fill="none" stroke="#fff" stroke-width="2.5" opacity=".55"/></pattern></defs>
  <rect width="1000" height="640" fill="url(#sky)"/>`;
  for(let k=0;k<16;k++){const a=k*Math.PI/8;s+=`<path d="M465 230 L${465+Math.cos(a)*900} ${230+Math.sin(a)*900} L${465+Math.cos(a+.12)*900} ${230+Math.sin(a+.12)*900} Z" fill="#fff" opacity=".13"/>`}
  s+=`<rect width="1000" height="640" fill="url(#ht)"/>${clouds()}${skyline()}<rect x="0" y="380" width="1000" height="260" fill="#3b2447"/><rect x="0" y="380" width="1000" height="260" fill="url(#ht)"/><path d="M0 384 H1000" stroke="#ffd23f" stroke-width="3" stroke-dasharray="18 14" opacity=".6"/>`;
  const act=cur();
  s+=`<g><rect x="306" y="102" width="330" height="270" rx="16" fill="${INK}"/><rect x="300" y="96" width="330" height="270" rx="16" fill="#fff3cf" stroke="${INK}" stroke-width="5"/><rect x="300" y="96" width="330" height="270" rx="16" fill="url(#ht)"/>
   <path d="M318 350 L318 318 L612 318 L612 350" fill="none" stroke="${INK}" stroke-width="3" stroke-dasharray="8 6"/>
   <g transform="translate(465,96) rotate(-2)"><rect x="-96" y="-22" width="192" height="40" rx="8" fill="#e63946" stroke="${INK}" stroke-width="4"/><text x="0" y="10" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="30" fill="#ffd23f" stroke="${INK}" stroke-width="3" paint-order="stroke" letter-spacing="2">DOWNTOWN</text></g>`;
  if(G.city>=0){const o=P(G.city);s+=`${burst(465,240,96,'url(#glow)')}<g transform="translate(465,240) scale(1.25)">${monArt(o.m)}</g>
     <path d="M438 170 L446 150 L456 162 L465 144 L474 162 L484 150 L492 170 Z" fill="#f4a300" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><circle cx="465" cy="160" r="3.5" fill="#e63946" stroke="${INK}" stroke-width="2"/>
     <text x="465" y="352" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="26" fill="${INK}">${esc(mname(o))} rules the city</text>`}
  else s+=`<text x="465" y="225" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="34" fill="${INK}" opacity=".55">EMPTY!</text><text x="465" y="258" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="16" fill="${INK}" opacity=".6">The next monster to finish rolling must move in</text>`;
  s+=`<text x="465" y="134" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="12.5" fill="${INK}" opacity=".7">+1★ on entering · +2★ each turn start · no healing</text></g>`;
  s+=`<g><rect x="666" y="156" width="310" height="216" rx="16" fill="${INK}"/><rect x="660" y="150" width="310" height="216" rx="16" fill="${G.bayOn?'#3aa6d9':'#8aa6b5'}" stroke="${INK}" stroke-width="5"/><rect x="660" y="150" width="310" height="216" rx="16" fill="url(#waves)"/>
   <g transform="translate(815,150) rotate(2)"><rect x="-70" y="-20" width="140" height="36" rx="8" fill="#3a86ff" stroke="${INK}" stroke-width="4"/><text x="0" y="9" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="26" fill="#fff" stroke="${INK}" stroke-width="3" paint-order="stroke" letter-spacing="2">HARBOR</text></g>`;
  if(G.bayOn&&G.bay>=0){const o=P(G.bay);s+=`<g transform="translate(815,258)">${monArt(o.m)}</g><text x="815" y="354" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="22" fill="#fff" stroke="${INK}" stroke-width="3" paint-order="stroke">${esc(mname(o))} holds the harbor</text>`}
  else s+=`<text x="815" y="258" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="24" fill="#fff" stroke="${INK}" stroke-width="3" paint-order="stroke">${G.bayOn?'EMPTY':'CLOSED'}</text><text x="815" y="284" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="14" fill="#fff">${G.bayOn?'Counts as the city too':'Opens with 5–6 monsters'}</text>`;
  s+=`</g>`;
  // round + dice panel
  s+=`<g><rect x="36" y="102" width="245" height="270" rx="16" fill="${INK}"/><rect x="30" y="96" width="245" height="270" rx="16" fill="#fff3cf" stroke="${INK}" stroke-width="5"/>
   <text x="152" y="132" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="28" fill="#e63946" stroke="${INK}" stroke-width="1.2" letter-spacing="1">ROUND ${G.turn}</text>
   <g transform="translate(78,190) scale(.62)">${monArt(act.m)}</g>
   <text x="118" y="176" font-family="Bangers,Impact,sans-serif" font-size="22" fill="${INK}">${esc(mname(act))}</text>
   <text x="118" y="198" font-family="Nunito,sans-serif" font-weight="800" font-size="14" fill="${INK}">${G.winner?'Game over':['','is rolling…','is resolving…','is resolving…','is shopping…','ends its turn'][G.step]||'…'}</text>
   <text x="118" y="218" font-family="Nunito,sans-serif" font-weight="800" font-size="13" fill="${INK}" opacity=".7">${G.phase==='roll'?G.rolls+' reroll'+(G.rolls===1?'':'s')+' left':''}</text>`;
  const nd=G.dice.length,cols=nd>6?4:3,sz=nd>6?46:54;
  G.dice.forEach((d,k)=>{const x=48+(k%cols)*(sz+(nd>6?8:18)),y=236+Math.floor(k/cols)*(sz+6);s+=`<g transform="translate(${x},${y})"><rect x="3" y="3" width="${sz}" height="${sz}" rx="9" fill="${INK}"/><rect width="${sz}" height="${sz}" rx="9" fill="${d.k?'#ffd23f':'#fff'}" stroke="${d.x?'#2ec27e':INK}" stroke-width="3.5"/><g transform="translate(4,4) scale(${(sz-8)/60})">${faceSVG(d.f).replace('<svg viewBox="0 0 60 60">','').replace('</svg>','')}</g></g>`});
  s+=`</g>`;
  // seats
  const n=G.pl.length,gap=12,w=Math.min(150,(940-(n-1)*gap)/n),x0=500-(n*w+(n-1)*gap)/2;
  G.pl.forEach((p,k)=>{const x=x0+k*(w+gap),y=400,h=226,cx=x+w/2,A=k===G.active&&!G.winner,T=inTokyo(p.i);
    s+=`<g class="seat" data-seat="${k}">`;
    if(A)s+=`<rect x="${x-6}" y="${y-6}" width="${w+12}" height="${h+12}" rx="18" fill="#ffd23f" stroke="${INK}" stroke-width="3"/>`;
    s+=`<rect x="${x+4}" y="${y+4}" width="${w}" height="${h}" rx="14" fill="${INK}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${p.alive?'#fffaf0':'#9c93a3'}" stroke="${INK}" stroke-width="4"/>
      <rect x="${x}" y="${y}" width="${w}" height="96" rx="14" fill="${p.alive?MONS[p.m].c:'#b9b0bd'}" stroke="${INK}" stroke-width="4"/><rect x="${x}" y="${y}" width="${w}" height="96" rx="14" fill="url(#ht)"/>
      <g transform="translate(${cx},${y+48}) scale(.64)" opacity="${T?.35:1}">${monArt(p.m,!p.alive)}</g>`;
    if(T)s+=`<g transform="translate(${cx},${y+50}) rotate(-8)"><rect x="-58" y="-13" width="116" height="26" rx="6" fill="#e63946" stroke="${INK}" stroke-width="3"/><text x="0" y="6" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="15" fill="#fff" letter-spacing="1" textLength="100" lengthAdjust="spacingAndGlyphs">${G.city===p.i?'IN DOWNTOWN':'IN HARBOR'}</text></g>`;
    if(p.human&&G.mode==='solo')s+=`<g transform="translate(${x+8},${y+8}) rotate(-8)"><rect width="44" height="22" rx="6" fill="#1a1320"/><text x="22" y="16" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="15" fill="#ffd23f" letter-spacing="1">YOU</text></g>`;
    if(p.alive&&mbOn()&&p.mb>0)s+=`<g transform="translate(${x+w-20},${y+18})">${brainIcon(0,0,.9)}<text x="0" y="5" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="13" fill="${INK}">${p.mb}</text></g>`;
    s+=`<text x="${cx}" y="${y+120}" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="${w<120?18:22}" fill="${INK}" letter-spacing="1">${esc(mname(p))}</text>`;
    if(p.alive){const bw=w/3.1;s+=statBadge(cx-bw,y+146,'hp',p.hp)+statBadge(cx,y+146,'vp',p.vp)+statBadge(cx+bw,y+146,'en',p.en);
      const pw=w-20;s+=`<rect x="${x+10}" y="${y+168}" width="${pw}" height="10" rx="5" fill="#fff" stroke="${INK}" stroke-width="2.5"/><rect x="${x+10}" y="${y+168}" width="${pw*Math.min(1,p.vp/20)}" height="10" rx="5" fill="#f4a300" stroke="${INK}" stroke-width="2.5"/>`;
      const extra=[p.cards.length+' card'+(p.cards.length===1?'':'s')];if(G.evoOn)extra.push(p.hand.length+p.evo.length+' evo');if(p.tok.shield)extra.push('wings');if(p.tok.tough)extra.push('tough');
      s+=`<text x="${cx}" y="${y+198}" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="13" fill="${INK}">${extra.join(' · ')}</text>`;
      s+=`<text x="${cx}" y="${y+216}" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="700" font-size="11.5" fill="${INK}" opacity=".7">${[...p.cards.map(c=>CARDS[base(c)].n),...p.evo.map(evoName)].slice(0,2).map(esc).join(', ')}${p.cards.length+p.evo.length>2?'…':''}</text>`}
    else s+=`<text x="${cx}" y="${y+170}" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="34" fill="#e63946" stroke="${INK}" stroke-width="2" letter-spacing="2">K.O.</text>`;
    const f=UI.fx[k]||[];f.slice(-3).forEach((e,j)=>{const col={hurt:'#e63946',heal:'#2ec27e',star:'#f4a300',energy:'#2ec27e'}[e.c]||'#fff';
      s+=`<g transform="translate(${x+w-8},${y+40+j*26}) rotate(${j%2?6:-6})"><text text-anchor="end" font-family="Bangers,Impact,sans-serif" font-size="22" fill="${col}" stroke="${INK}" stroke-width="4" paint-order="stroke">${esc(e.t)}</text></g>`});
    s+=`</g>`});
  if(G.winner){const w=G.winner==='draw'?null:P(+G.winner.slice(1)-1);s+=`<g>${burst(500,230,190,'url(#glow)')}${w?`<g transform="translate(500,215) scale(1.5)">${monArt(w.m)}</g>`:''}<text x="500" y="345" text-anchor="middle" font-family="Bangers,Impact,sans-serif" font-size="46" fill="#e63946" stroke="${INK}" stroke-width="3" paint-order="stroke" letter-spacing="2">${w?esc(mname(w).toUpperCase())+' WINS!':'NOBODY WINS'}</text></g>`}
  svg.innerHTML=s}

</script>
<script>
// ---------- panel ----------
function humanTurn(){return G&&!G.winner&&isHuman(G.active)}
const STEPS=['Roll','Resolve','City','Buy','End'];
function stepBar(){const s=G.step||1;return `<div class="steps">${STEPS.map((t,k)=>`<span class="st ${k+1<s?'done':''} ${k+1===s?'on':''}"><b>${k+1}</b>${t}</span>`).join('')}</div>`}
function suggestCard(p){let best=-1,bv=-0.5;G.market.forEach((id,k)=>{if(!canBuy(p,k))return;const v=cardValue(p,id);if(v>bv){bv=v;best=k}});return best}
function renderPanel(){
  const pr=document.getElementById('prompt');const di=document.getElementById('dice'),ro=document.getElementById('rolls'),pv=document.getElementById('preview');
  document.getElementById('banner').innerHTML=G?UI.banner:'';
  if(!G){pr.innerHTML='';di.innerHTML='';ro.innerHTML='';pv.innerHTML='';return}
  const p=cur();let who=esc(mname(p)),head='',msg='',acts='';
  const btn=(a,l,dis,sm,cls)=>`<button class="btn ${cls||''}" data-act="${a}" ${dis?'disabled':''}>${l}${sm?`<small>${sm}</small>`:''}</button>`;
  const me=G.mode==='solo'?G.pl.find(q=>q.human):null;
  if(G.winner){who='Game over';msg=esc(G.winText);acts=btn('again','Play again','','','primary')}
  else if(!humanTurn()){
    head=G.step===1?`Step 1 · ${esc(mname(p))} is rolling`:G.step<=3?`Step 2 · ${esc(mname(p))} resolves its dice`:`Step 4 · ${esc(mname(p))} is shopping`;
    msg=G.step===1?'Watch which dice it keeps (they turn yellow).':G.step===4?'It may buy power cards or play evolutions.':'';
    if(me){msg+=`<div class="tip">You are <b>${esc(mname(me))}</b>. Nothing to do right now: you will get a pop-up if you can ${mbOn()&&me.mb?'use your <b>Mindbug</b> or ':''}yield the city.</div>`}}
  else if(G.phase==='roll'){const nk=G.dice.filter(d=>!d.k).length;
    head='Step 1 · Roll the dice';
    msg=`<ol class="how"><li>Tap the dice you want to <b>keep</b>. They turn yellow.</li><li>Press <b>Reroll</b> to throw the others again (${G.rolls} left).</li><li>Happy with the result? Press <b>Resolve</b>.</li></ol>`;
    msg+=`<div class="tip">You are in <b>${where(p.i)}</b>. ${inTokyo(p.i)?'Your claws hit everyone outside. Hearts do nothing here.':G.city===-1?'Downtown is empty, so you will move in after resolving.':'Your claws hit whoever is in the city.'}</div>`;
    acts=btn('reroll',`Reroll ${nk} ${nk===1?'die':'dice'}`,G.rolls<=0||!nk,G.rolls<=0?'no rerolls left':`${G.rolls} left`,G.rolls>0&&nk?'primary':'')+btn('resolve','Resolve dice','','go to step 2',G.rolls<=0||!nk?'primary':'')+btn('hint','💡 Suggest dice','','marks good dice for you');
    if(has(p,'mind'))acts+=btn('mind','Mind Link reroll',p.en<1||!nk,'pay 1 ⚡');
    if(has(p,'smoke')&&p.tok.smoke>0)acts+=btn('smoke','Smoke reroll',!nk,`${p.tok.smoke} puffs left`);
    if(has(p,'lurker'))acts+=btn('lurker','Reroll my 3s',!G.dice.some(d=>d.f==='3'),'Alley Lurker');
    if(has(p,'pack'))acts+=btn('pack','Make a die a 1',G.tf.culler,'Pack Hunter, once a turn');
    if(has(p,'rubber'))acts+=btn('rubber','Bend a die',p.en<2,'Rubber Limbs, 2 ⚡');
    if(has(p,'twist'))acts+=btn('twist','Twist a die','','then discard');
  }else if(G.phase==='buy'){const sg=suggestCard(p);
    head='Step 4 · Buy power cards (optional)';
    msg=`You have <b>${p.en} energy ⚡</b>. Cards you can afford have a yellow <b>Buy</b> button.${sg>=0?`<div class="tip">💡 Suggestion: <b>${esc(CARDS[base(G.market[sg])].n)}</b>.</div>`:'<div class="tip">Nothing great to buy? Save your energy and press <b>End turn</b>.</div>'}`;
    acts=btn('end','End turn','','next monster goes','primary')+btn('sweep','Sweep cards',p.en<2,'pay 2 ⚡ for 3 new')}
  if(humanTurn()){
    if(has(p,'mend'))acts+=btn('mend','Quick Mend',p.en<2||p.hp>=maxhp(p),'2 ⚡ → heal 1');
    p.cards.forEach((id,k)=>{const C=CARDS[base(id)];if(C.t==='C')acts+=btn('use:'+k,`Use ${esc(C.n)}`,!consUsable(p,k),C.kw?C.kw+' · consumable':'consumable','cons')});
    p.hand.forEach((e,k)=>acts+=btn('evo:'+k,`🧬 ${esc(evoName(e))}`,!evoUsable(p,k),EVOFX[evoKey(e)].x,'evo'))}
  pr.innerHTML=`${G.winner?'':stepBar()}<div class="who" style="color:${MONS[p.m].c};-webkit-text-stroke:1.2px #1a1320">${who}${humanTurn()?' · your turn':''}</div>${head?`<div class="head">${head}</div>`:''}<div class="msg">${msg}</div><div class="acts">${acts}</div>`;
  const canClick=humanTurn()&&G.phase==='roll';
  const spin=UI.rollAnim!==G.rollId&&ANIM;UI.rollAnim=G.rollId;
  di.innerHTML=G.dice.map((d,k)=>`<button class="die ${d.k?'kept':''} ${d.x?'extra':''} ${spin&&!d.k?'spin':''}" data-die="${k}" ${canClick?'':'disabled'} aria-label="${fname(d.f)}${d.k?' (kept)':''}">${faceSVG(d.f)}</button>`).join('')||'<span class="muted small">No dice rolled yet.</span>';
  ro.innerHTML=G.phase==='roll'?`Rerolls left: ${Array.from({length:Math.max(G.rolls,2+has(p,'brain'))},(_,k)=>`<span class="pip ${k<G.rolls?'':'used'}"></span>`).join('')}`:'<span class="muted small">Dice resolved.</span>';
  pv.innerHTML=G.phase==='roll'&&G.dice.length?`<b>${humanTurn()?'If you resolve now':'These dice give'}:</b> ${esc(scoreDice(p,G.dice).text)}.`:'';
  const buyOK=humanTurn()&&G.phase==='buy';const sg=buyOK?suggestCard(p):-1;
  document.getElementById('market').innerHTML=G.market.map((id,k)=>{const C=CARDS[base(id)];const c=costOf(p,id);return `<div class="pc ${C.t} ${k===sg?'sugg':''}"><div class="hd"><span class="cost">${c}</span><span class="nm">${esc(C.n)}</span>${cardIcon(id)}</div><span class="ty">${C.t==='K'?'KEEP':C.t==='C'?'CONSUMABLE':'USE NOW'}${C.kw?' · '+C.kw.toUpperCase():''}</span><p>${esc(C.x)}</p>${buyOK?`<button class="btn buy ${canBuy(p,k)?'primary':''}" data-card="${k}" ${canBuy(p,k)?'':'disabled'}>${canBuy(p,k)?'Buy':'Need '+c+' ⚡'}</button>`:''}</div>`}).join('')+`<p class="small muted" style="grid-column:1/-1;margin:.2rem 0 0">${G.deck.length} cards in the deck. <b>Keep</b> cards stay with you. <b>Use now</b> cards happen at once. <b>Consumables</b> wait until you use them.</p>`;
  const who2=me||p;
  document.getElementById('minettl').textContent=me?`Your cards (${mname(me)})`:`${mname(who2)}'s cards`;
  const list=[...who2.cards.map(id=>{const C=CARDS[base(id)];return `<div class="mc ${C.t}"><b>${esc(C.n)}</b>${C.t==='C'?' <i>consumable</i>':''}${base(id)==='smoke'?` (${who2.tok.smoke} puffs)`:''}<br>${esc(C.x)}</div>`}),
    ...who2.evo.map(e=>`<div class="mc E"><b>🧬 ${esc(evoName(e))}</b> <i>evolution</i><br>${esc(EVOFX[evoKey(e)].x)}</div>`),
    ...who2.hand.map(e=>`<div class="mc E hand"><b>🧬 ${esc(evoName(e))}</b> <i>in hand, play on your turn</i><br>${esc(EVOFX[evoKey(e)].x)}</div>`)];
  if(mbOn())list.unshift(`<div class="mc M"><b>🧠 Mindbug tokens: ${who2.mb}</b><br>When another monster finishes rolling, you may spend one to resolve its dice as yours.</div>`);
  document.getElementById('mine').innerHTML=list.length?list.join(''):'<span class="muted small">No cards yet. Buy them with energy after rolling.</span>';
  const L=document.getElementById('log');L.innerHTML=G.log.slice(0,80).map(l=>`<li class="${l.s>=0&&G.pl[l.s]&&G.pl[l.s].human&&G.mode==='solo'?'me':''}">${esc(l.t)}</li>`).join('');
}
function renderScore(){const el=document.getElementById('score');if(!G){el.innerHTML='';return}
  el.innerHTML=G.pl.map(p=>`<div class="sc ${p.i===G.active&&!G.winner?'on':''} ${p.alive?'':'ko'}"><b style="background:${MONS[p.m].c}">${esc(mname(p))}${p.human&&G.mode==='solo'?' (you)':''}</b><span>♥${p.hp} ★${p.vp} ⚡${p.en}${mbOn()?' 🧠'+p.mb:''}${inTokyo(p.i)?' · city':''}${p.alive?'':' · KO'}</span></div>`).join('')}
function renderLegend(){document.getElementById('legend').innerHTML=[
  ['1','Three 1s score 1 star; each extra 1 adds 1 more.'],['2','Three 2s score 2 stars, +1 per extra.'],['3','Three 3s score 3 stars, +1 per extra.'],
  ['E','Energy: 1 each. Spend it on power cards.'],['C','Claw: 1 damage each. From the city you hit everyone outside; from outside you hit the city.'],['H','Heart: heal 1 each (not while in the city). Three hearts also draw an evolution when evolutions are on.']]
  .map(([f,t])=>faceSVG(f)+`<span>${t}</span>`).join('')}

// ---------- modal ----------
function renderModal(){const m=document.getElementById('modal');
  if(UI.info){m.classList.remove('hidden');m.innerHTML=startScreen();return}
  if(UI.rules){m.classList.remove('hidden');m.innerHTML=rulesHTML();return}
  if(UI.choice){const c=UI.choice;m.classList.remove('hidden');
    const dice=c.dice&&G?`<div class="mdice">${G.dice.map(d=>`<span class="die sm">${faceSVG(d.f)}</span>`).join('')}</div>`:'';
    m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h2>${esc(c.title)}</h2>${G&&c.who!==undefined&&G.mode==='hot'?`<p class="pass">📱 Pass the device to <b>${esc(mname(P(c.who)))}</b>: this one is for you.</p>`:''}<p>${esc(c.text)}</p>${dice}<div class="acts">${c.options.map(o=>`<button class="btn ${/Recommended\./.test(o.d||'')?'primary':''}" data-opt="${esc(o.k)}">${esc(o.l)}${o.d?`<small>${esc(o.d)}</small>`:''}</button>`).join('')}${c.cancel?'<button class="btn" data-opt="x">Close</button>':''}</div></div>`;return}
  m.classList.add('hidden');m.innerHTML=''}
function startScreen(){const saved=load();const xp=UI.xp;
  const pool=MONS.map((M,k)=>k).filter(k=>xp!=='base'||k<6);if(!pool.includes(UI.mon))UI.mon=0;
  return `<div class="dlg start" role="dialog" aria-modal="true"><h2>Crown City Smash</h2>
   <p>Giant monsters brawl for the city. On your turn: <b>1</b> roll the dice, <b>2</b> resolve them, <b>3</b> enter the city if it's empty, <b>4</b> buy power cards, <b>5</b> end your turn. First to <b>20 stars</b>, or the <b>last monster standing</b>, wins.</p>
   <div class="row"><b>Game:</b>${[['base','Base game'],['trial','Mindbug Trial'],['exp','Mindbug Experience']].map(([k,l])=>`<button class="btn ${xp===k?'on':''}" data-xp="${k}">${l}</button>`).join('')}</div>
   <p class="small muted" style="margin:.1rem 0 .3rem">${xp==='base'?'The classic game.':xp==='trial'?'Adds Mindbug tokens, 3 new monsters and 24 new cards shuffled into the classic deck. Recommended.':'Mindbug tokens and 3 new monsters, playing with only the 24 new cards.'}</p>
   <div class="row"><b>Evolutions:</b><button class="btn ${UI.evo?'on':''}" data-evo="1">On</button><button class="btn ${UI.evo?'':'on'}" data-evo="0">Off</button><span class="small muted">Resolve three hearts to draw an evolution card for your monster.</span></div>
   <div class="row"><b>Monsters:</b>${[2,3,4,5,6].map(k=>`<button class="btn ${UI.n===k?'on':''}" data-n="${k}">${k}</button>`).join('')}<span class="small muted">The Harbor opens with 5–6.</span></div>
   <p style="margin:.4rem 0 .2rem"><b>Your monster</b> (for the game against the computer):</p>
   <div class="monpick">${pool.map(k=>`<button class="${UI.mon===k?'on':''}" data-mon="${k}" title="${esc(MONS[k].d)}"><svg viewBox="-66 -70 132 136">${monArt(k)}</svg><span>${esc(MONS[k].n)}${MONS[k].x?' 🧠':''}</span></button>`).join('')}</div>
   <div class="acts" style="margin-top:.8rem">
    <button class="btn primary" data-start="solo">Play against the computer<small>You and ${UI.n-1} computer monster${UI.n>2?'s':''}. Your seat in turn order is random. A tour runs on your first game.</small></button>
    <button class="btn" data-start="hot">Everyone on one screen<small>${UI.n} players take turns on this device.</small></button>
    <button class="btn" data-start="ai">Watch the computer play<small>A quick way to see the rules in action.</small></button>
    ${saved&&!saved.winner&&saved.pl?`<button class="btn" data-start="load">Continue saved game<small>Round ${saved.turn}, ${saved.pl.length} monsters</small></button>`:''}
   </div><p class="small muted">The names, card text and art are original, for copyright reasons. The rules follow the published rulebook.</p></div>`}
function rulesHTML(){return `<div class="dlg rules" role="dialog" aria-modal="true"><h2>How to play</h2>
  <h3>Your turn in 5 steps</h3><ol><li><b>Roll</b> all dice. Keep any dice you like and reroll the rest, up to twice. You can reroll dice you kept earlier.</li>
  <li><b>Resolve</b>: three of a kind of 1, 2 or 3 scores that many stars, and each extra matching die adds 1. Energy gives 1 each. Hearts heal 1 each, but only outside the city (max 10). Claws smash.</li>
  <li><b>City</b>: from the city (Downtown or the Harbor) your claws hit every monster outside. From outside, they hit every monster in the city. When smashed by dice, a city monster may <b>yield</b>. It still takes the damage, and the smasher moves in. If Downtown is empty, you must move in (+1 star). With 5–6 monsters, if Downtown is taken and the Harbor is empty, you move into the Harbor.</li>
  <li><b>Buy</b> power cards with energy. Pay 2 energy to sweep the three cards and deal three new ones.</li>
  <li><b>End of turn</b> effects happen, then the next monster goes.</li></ol>
  <h3>The city</h3><p>Starting your turn in the city scores 2 stars. You cannot heal with hearts there, and everyone outside is hitting you. When only four monsters remain, the Harbor closes.</p>
  <h3>Mindbug expansion</h3><ul><li><b>Mindbug tokens</b>: every monster starts with 1. When another monster finishes rolling, you may spend one to resolve its dice as if they were yours. It gets nothing from them, then carries on with its turn (entering the city and buying).</li>
  <li><b>Consumable</b> cards: buy them now, keep them, and use them later on your turn. They are discarded when used.</li>
  <li><b>Keywords</b>: <b>Hunter</b> hits more monsters, <b>Sneaky</b> ignores defences, <b>Venomous</b> finishes off badly hurt monsters, <b>Frenzy</b> doubles claw damage, and <b>Tough</b> blocks a hit.</li>
  <li><b>Evolutions</b> (optional): when you resolve three or more hearts, draw an evolution card for your monster. Play it on your turn. Some are permanent.</li>
  <li><b>Trial</b> mixes the 24 new cards into the classic deck. <b>Experience</b> uses only the new cards.</li></ul>
  <h3>Winning</h3><p>Reach <b>20 stars</b> and survive your turn, or be the last monster standing. If everyone falls at once, nobody wins.</p>
  <h3>Left out of this version</h3><p class="small">Ten advanced classic cards that need tokens or peeking at the deck, and the Wickedness tiles, which need a separate expansion.</p>
  <div class="acts"><button class="btn primary" data-a="closerules">Got it</button></div></div>`}

// ---------- tour ----------
const TOURSTEPS=[
 {el:'#prompt',t:'Start here',b:'This box always tells you what to do next. The 1–5 bar at the top shows where you are in your turn: Roll, Resolve, City, Buy, End.'},
 {el:'#dicewrap',t:'The dice',b:'Tap dice to keep them (they turn yellow), then press Reroll. The line under the dice shows what you would get if you resolved now. Stuck? Press “Suggest dice”.'},
 {el:'#map',t:'The city',b:'Monsters fight over Downtown (and the Harbor with 5–6 players). Being there scores stars every turn, but everyone else hits you and you cannot heal.'},
 {el:'#map',t:'The monsters',b:'Each plate shows hearts (red), stars (gold, first to 20 wins) and energy (green). The pink brain is your Mindbug tokens. The glowing plate is whoever is taking a turn.'},
 {el:'#marketwrap',t:'Power cards',b:'After resolving, spend energy on cards. A suggested card gets a ribbon. Consumables wait in your hand until you press “Use”.'},
 {el:'#minewrap',t:'Your cards and tokens',b:'Your cards, evolutions and Mindbug tokens are listed here. When a monster finishes rolling a great set of dice, you will be asked if you want to Mindbug it.'},
 {el:'#logwrap',t:'Chronicle',b:'Everything that happened, newest first. Good luck, monster!'}];
function startTour(){UI.coach=0;renderTour()}
function renderTour(){document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));const el=document.getElementById('coach');
  if(UI.coach<0){el.classList.add('hidden');return}const st=TOURSTEPS[UI.coach];el.classList.remove('hidden');
  el.innerHTML=`<h3>Tour ${UI.coach+1} of ${TOURSTEPS.length}: ${esc(st.t)}</h3><p class="small">${esc(st.b)}</p><div class="acts"><button class="btn" data-tour="prev" ${UI.coach===0?'disabled':''}>Back</button><button class="btn primary" data-tour="next">${UI.coach===TOURSTEPS.length-1?'Start playing':'Next'}</button><button class="btn" data-tour="skip">Skip tour</button></div>`;
  const tg=document.querySelector(st.el);if(tg)tg.classList.add('hl')}

function render(){renderMap();renderScore();renderPanel();renderModal()}
const SPEEDS=[['slow',1300],['normal',650],['fast',260]];
function setSpeed(k){UI.speed=k;AIDELAY=SPEEDS[k][1];const b=document.getElementById('speedbtn');if(b)b.textContent='Speed: '+SPEEDS[k][0];try{localStorage.setItem('ccs_speed',k)}catch(e){}}

// ---------- events ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a],[data-act],[data-die],[data-card],[data-opt],[data-start],[data-tour],[data-n],[data-mon],[data-xp],[data-evo],g.seat');if(!t)return;
  const ds=t.dataset;
  if(ds.n){UI.n=+ds.n;render();return}
  if(ds.mon!==undefined){UI.mon=+ds.mon;render();return}
  if(ds.xp){UI.xp=ds.xp;render();return}
  if(ds.evo!==undefined){UI.evo=ds.evo==='1';render();return}
  if(ds.start){const k=ds.start;UI.info=false;
    if(k==='load'){G=load();UI.choice=null;UI.busy=false;UI.fx={};if(G.phase==='resolve'||G.phase==='start'){G.phase='roll';G.step=1}refresh()}
    else{newGame(k);let toured=false;try{toured=!!localStorage.getItem(TOUR);localStorage.setItem(TOUR,'1')}catch(x){}if(k==='solo'&&!toured)startTour()}return}
  if(ds.tour){if(ds.tour==='next')UI.coach=UI.coach>=TOURSTEPS.length-1?-1:UI.coach+1;else if(ds.tour==='prev')UI.coach=Math.max(0,UI.coach-1);else UI.coach=-1;renderTour();return}
  if(ds.a){if(ds.a==='new'){UI.info=true;UI.choice=null;render()}else if(ds.a==='rules'){UI.rules=true;render()}else if(ds.a==='closerules'){UI.rules=false;render();schedule()}else if(ds.a==='tour')startTour();else if(ds.a==='speed')setSpeed((UI.speed+1)%3);return}
  if(ds.opt!==undefined){const c=UI.choice;if(!c)return;UI.choice=null;if(ds.opt==='x'){refresh();return}c.cb(ds.opt);if(!UI.choice)refresh();return}
  if(t.classList.contains('seat')&&G){if(UI.choice||UI.info)return;const p=P(+ds.seat);const hidden=G.mode==='solo'&&!p.human;
    UI.choice={title:mname(p),text:`${MONS[p.m].d}. ${p.alive?`${p.hp}/${maxhp(p)} hearts, ${p.vp} stars, ${p.en} energy${mbOn()?`, ${p.mb} Mindbug token${p.mb===1?'':'s'}`:''}, in ${where(p.i)}.`:'Knocked out.'} Cards: ${p.cards.length?p.cards.map(c=>CARDS[base(c)].n+' ('+CARDS[base(c)].x+')').join(' · '):'none'}.${p.evo.length?' Evolutions: '+p.evo.map(e=>evoName(e)+' ('+EVOFX[evoKey(e)].x+')').join(' · ')+'.':''}${p.hand.length?` ${p.hand.length} evolution card${p.hand.length===1?'':'s'} in hand${hidden?' (hidden)':': '+p.hand.map(evoName).join(', ')}.`:''}`,options:[],cancel:true};render();return}
  if(!G||G.winner&&ds.act!=='again')return;
  if(ds.act==='again'){UI.info=true;render();return}
  if(!humanTurn()||UI.choice||UI.busy)return;
  if(ds.die!==undefined&&G.phase==='roll'){const d=G.dice[+ds.die];d.k=!d.k;render();return}
  const p=cur();
  if(ds.card!==undefined&&G.phase==='buy'){buy(+ds.card);return}
  const act=ds.act||'';
  if(act.startsWith('use:')){const k=+act.slice(4);if(consUsable(p,k))useCons(p,k);return}
  if(act.startsWith('evo:')){const k=+act.slice(4);if(evoUsable(p,k))playEvo(p,k);return}
  switch(act){
    case 'reroll':if(G.rolls>0)doReroll('roll');break;
    case 'resolve':if(G.phase==='roll')resolve();break;
    case 'hint':aiMark(p);UI.banner='💡 Suggested dice are marked in yellow. Reroll the rest, or change anything you like.';render();break;
    case 'mind':if(p.en>=1)doReroll('mind');break;
    case 'smoke':doReroll('smoke');break;
    case 'lurker':doReroll('lurker');break;
    case 'pack':case 'rubber':case 'twist':changeDie(act);break;
    case 'sweep':sweep();break;
    case 'mend':mend();break;
    case 'end':if(G.phase==='buy')endTurn();break;
  }});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.rules){UI.rules=false;render()}});
try{const sp=localStorage.getItem('ccs_speed');if(sp!==null)setSpeed(+sp)}catch(e){}
renderLegend();render();

</script>
</body>
</html>
