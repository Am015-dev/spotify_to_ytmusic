<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Short Fuse cards</title>
<style>
:root{--bg:#171a3a;--card:#232855;--fg:#fff3dc;--mut:#b7bbe0;--acc:#ffc928;--line:#3a4180}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:22px 0 8px;color:var(--acc)}h2 small{color:var(--mut);font-weight:400}p{color:var(--mut);margin:0 0 12px}
input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin:0 0 6px;position:sticky;top:6px;z-index:2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.c[hidden]{display:none}
.c img,.ph{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;background:var(--bg)}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3rem;color:var(--acc);background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 10px,var(--card) 10px,var(--card) 20px)}.ph small{font-size:.7rem;color:var(--mut)}
figcaption{padding:8px 10px 10px;display:grid;gap:3px;font-size:.82rem}figcaption b{font-size:.95rem}figcaption em{font-style:normal;color:var(--acc);font-weight:700}
figcaption span{color:var(--mut)}
a{color:var(--acc)}
</style></head><body>

<h2>Equipment cards <small>12</small></h2><div class="grid"><figure class="c" data-s="unequal tag unlocks at two 1s · any time clip the one &quot;not equal&quot; tag between two neighbouring wires on your own stand that hold different values. one of them may already be cut. two reds, or two yellows, count as the same value, so they never take this tag. equipment cards"><img src="cards/eq1.webp" alt="Unequal Tag" loading="lazy" width="224" height="224"><figcaption><b>Unequal Tag</b><em>unlocks at two 1s · any time</em><span>Clip the one &quot;not equal&quot; tag between two neighbouring wires on your own stand that hold different values. One of them may already be cut. Two reds, or two yellows, count as the same value, so they never take this tag.</span></figcaption></figure><figure class="c" data-s="handsets unlocks at two 2s · any time trade one uncut wire with a crewmate, face down both ways. each of you slots the new wire into sorted order; a two-stand player puts it on the stand the outgoing wire left. any colour may be traded. everyone sees which slots changed. a token in front of a traded wire goes with it. nobody may ask for a value. equipment cards"><img src="cards/eq2.webp" alt="Handsets" loading="lazy" width="224" height="224"><figcaption><b>Handsets</b><em>unlocks at two 2s · any time</em><span>Trade one uncut wire with a crewmate, face down both ways. Each of you slots the new wire into sorted order; a two-stand player puts it on the stand the outgoing wire left. Any colour may be traded. Everyone sees which slots changed. A token in front of a traded wire goes with it. Nobody may ask for a value.</span></figcaption></figure><figure class="c" data-s="triple probe unlocks at two 3s · your turn with your dual cut, name a number and point at three wires on one crewmate stand. it works if any of them matches; they cut one match without saying how many matched. if none match, the fuse burns one step and they tag one of the three with its true value. equipment cards"><img src="cards/eq3.webp" alt="Triple Probe" loading="lazy" width="224" height="224"><figcaption><b>Triple Probe</b><em>unlocks at two 3s · your turn</em><span>With your dual cut, name a number and point at three wires on one crewmate stand. It works if any of them matches; they cut one match without saying how many matched. If none match, the fuse burns one step and they tag one of the three with its true value.</span></figcaption></figure><figure class="c" data-s="sticky note unlocks at two 4s · any time put an info token showing the true value in front of one of your own blue wires. equipment cards"><img src="cards/eq4.webp" alt="Sticky Note" loading="lazy" width="224" height="224"><figcaption><b>Sticky Note</b><em>unlocks at two 4s · any time</em><span>Put an info token showing the true value in front of one of your own blue wires.</span></figcaption></figure><figure class="c" data-s="full scan unlocks at two 5s · your turn with your dual cut, name a number and point at a crewmate's whole stand. it works if any wire there matches; they cut one match without saying how many. if none match, the fuse burns one step and they tag a wire of their choice. equipment cards"><img src="cards/eq5.webp" alt="Full Scan" loading="lazy" width="224" height="224"><figcaption><b>Full Scan</b><em>unlocks at two 5s · your turn</em><span>With your dual cut, name a number and point at a crewmate's whole stand. It works if any wire there matches; they cut one match without saying how many. If none match, the fuse burns one step and they tag a wire of their choice.</span></figcaption></figure><figure class="c" data-s="rewind unlocks at two 6s · any time turn the fuse back one step. equipment cards"><img src="cards/eq6.webp" alt="Rewind" loading="lazy" width="224" height="224"><figcaption><b>Rewind</b><em>unlocks at two 6s · any time</em><span>Turn the fuse back one step.</span></figcaption></figure><figure class="c" data-s="recharge unlocks at two 7s · any time wake up one or two crew members whose personal tool is spent; each can use it once more this job. equipment cards"><img src="cards/eq7.webp" alt="Recharge" loading="lazy" width="224" height="224"><figcaption><b>Recharge</b><em>unlocks at two 7s · any time</em><span>Wake up one or two crew members whose personal tool is spent; each can use it once more this job.</span></figcaption></figure><figure class="c" data-s="sweep unlocks at two 8s · any time call a number. every crew member, you included, says yes if they have at least one uncut blue wire of it; two-stand players answer for each stand. nobody says how many or where. red and yellow never count. equipment cards"><img src="cards/eq8.webp" alt="Sweep" loading="lazy" width="224" height="224"><figcaption><b>Sweep</b><em>unlocks at two 8s · any time</em><span>Call a number. Every crew member, you included, says yes if they have at least one uncut blue wire of it; two-stand players answer for each stand. Nobody says how many or where. Red and yellow never count.</span></figcaption></figure><figure class="c" data-s="damper unlocks at two 9s · start of your turn use before your action. if your dual cut this turn misses, the fuse does not burn, and if you pointed at a red nothing goes off. a wrong non-red wire still gets its token; a red one gets none. equipment cards"><img src="cards/eq9.webp" alt="Damper" loading="lazy" width="224" height="224"><figcaption><b>Damper</b><em>unlocks at two 9s · start of your turn</em><span>Use before your action. If your dual cut this turn misses, the fuse does not burn, and if you pointed at a red nothing goes off. A wrong non-red wire still gets its token; a red one gets none.</span></figcaption></figure><figure class="c" data-s="two-value probe unlocks at two 10s · your turn with your dual cut, name two values (yellow allowed) for one wire. you must hold both. if the wire is either one, it works and you cut your matching wire, so the crew also learns you hold the other value. can be combined with the twin, triple or full-scan probe. equipment cards"><img src="cards/eq10.webp" alt="Two-Value Probe" loading="lazy" width="224" height="224"><figcaption><b>Two-Value Probe</b><em>unlocks at two 10s · your turn</em><span>With your dual cut, name two values (yellow allowed) for one wire. You must hold both. If the wire is either one, it works and you cut your matching wire, so the crew also learns you hold the other value. Can be combined with the twin, triple or full-scan probe.</span></figcaption></figure><figure class="c" data-s="coffee break unlocks at two 11s · your turn skip your action and pick, without discussion, who goes next; play carries on clockwise from them. equipment cards"><img src="cards/eq11.webp" alt="Coffee Break" loading="lazy" width="224" height="224"><figcaption><b>Coffee Break</b><em>unlocks at two 11s · your turn</em><span>Skip your action and pick, without discussion, who goes next; play carries on clockwise from them.</span></figcaption></figure><figure class="c" data-s="equal tag unlocks at two 12s · any time clip the one &quot;equal&quot; tag between two neighbouring wires on your own stand that share a value. one may already be cut. any two reds, or any two yellows, count as equal. equipment cards"><img src="cards/eq12.webp" alt="Equal Tag" loading="lazy" width="224" height="224"><figcaption><b>Equal Tag</b><em>unlocks at two 12s · any time</em><span>Clip the one &quot;equal&quot; tag between two neighbouring wires on your own stand that share a value. One may already be cut. Any two reds, or any two yellows, count as equal.</span></figcaption></figure></div><h2>Yellow-wire card <small>1</small></h2><div class="grid"><figure class="c" data-s="hidden compartment unlocks at two yellows · instant the moment it unlocks, draw two more equipment cards into this job. they may unlock at once if their values are already cut. yellow-wire card"><img src="cards/eqY.webp" alt="Hidden Compartment" loading="lazy" width="224" height="224"><figcaption><b>Hidden Compartment</b><em>unlocks at two yellows · instant</em><span>The moment it unlocks, draw two more equipment cards into this job. They may unlock at once if their values are already cut.</span></figcaption></figure></div><h2>Four-of-a-kind cards <small>5</small></h2><div class="grid"><figure class="c" data-s="lone tag unlocks at four 2s · any time put a x1 token in front of one of your blue wires, cut or not: that value appears only once on that stand, counting cut wires. four-of-a-kind cards"><img src="cards/eq22.webp" alt="Lone Tag" loading="lazy" width="224" height="224"><figcaption><b>Lone Tag</b><em>unlocks at four 2s · any time</em><span>Put a x1 token in front of one of your blue wires, cut or not: that value appears only once on that stand, counting cut wires.</span></figcaption></figure><figure class="c" data-s="supply drop unlocks at four 3s · instant the moment it unlocks, every used equipment card turns face up and works once more. four-of-a-kind cards"><img src="cards/eq33.webp" alt="Supply Drop" loading="lazy" width="224" height="224"><figcaption><b>Supply Drop</b><em>unlocks at four 3s · instant</em><span>The moment it unlocks, every used equipment card turns face up and works once more.</span></figcaption></figure><figure class="c" data-s="express pass unlocks at four 9s · your turn solo-cut two identical wires from your hand even if more of that value are still uncut elsewhere. four-of-a-kind cards"><img src="cards/eq99.webp" alt="Express Pass" loading="lazy" width="224" height="224"><figcaption><b>Express Pass</b><em>unlocks at four 9s · your turn</em><span>Solo-cut two identical wires from your hand even if more of that value are still uncut elsewhere.</span></figcaption></figure><figure class="c" data-s="vaporiser unlocks at four 10s · instant the moment it unlocks, draw a random info token from the supply: everyone cuts every uncut wire of that number they hold. four-of-a-kind cards"><img src="cards/eq1010.webp" alt="Vaporiser" loading="lazy" width="224" height="224"><figcaption><b>Vaporiser</b><em>unlocks at four 10s · instant</em><span>The moment it unlocks, draw a random info token from the supply: everyone cuts every uncut wire of that number they hold.</span></figcaption></figure><figure class="c" data-s="hook line unlocks at four 11s · any time point at a crewmate's uncut wire and pull it, unseen, into your own hand in sorted order (a two-stand player picks the stand). everyone sees where it came from and went. four-of-a-kind cards"><img src="cards/eq1111.webp" alt="Hook Line" loading="lazy" width="224" height="224"><figcaption><b>Hook Line</b><em>unlocks at four 11s · any time</em><span>Point at a crewmate's uncut wire and pull it, unseen, into your own hand in sorted order (a two-stand player picks the stand). Everyone sees where it came from and went.</span></figcaption></figure></div><h2>Crew <small>9</small></h2><div class="grid"><figure class="c" data-s="foreman brix foreman · tool: twin probe runs the job: goes first and settles setup choices. crew"><img src="cards/ch_captain.webp" alt="Foreman Brix" loading="lazy" width="224" height="224"><figcaption><b>Foreman Brix</b><em>foreman · tool: Twin Probe</em><span>Runs the job: goes first and settles setup choices.</span></figcaption></figure><figure class="c" data-s="wren tool: twin probe rigger with steady hands. crew"><img src="cards/ch_base1.webp" alt="Wren" loading="lazy" width="224" height="224"><figcaption><b>Wren</b><em>tool: Twin Probe</em><span>Rigger with steady hands.</span></figcaption></figure><figure class="c" data-s="pike tool: twin probe wrecking-ball operator. crew"><img src="cards/ch_base2.webp" alt="Pike" loading="lazy" width="224" height="224"><figcaption><b>Pike</b><em>tool: Twin Probe</em><span>Wrecking-ball operator.</span></figcaption></figure><figure class="c" data-s="moss tool: twin probe tunnel and trench specialist. crew"><img src="cards/ch_base3.webp" alt="Moss" loading="lazy" width="224" height="224"><figcaption><b>Moss</b><em>tool: Twin Probe</em><span>Tunnel and trench specialist.</span></figcaption></figure><figure class="c" data-s="tally tool: twin probe keeps the count on every charge. crew"><img src="cards/ch_base4.webp" alt="Tally" loading="lazy" width="224" height="224"><figcaption><b>Tally</b><em>tool: Twin Probe</em><span>Keeps the count on every charge.</span></figcaption></figure><figure class="c" data-s="echo from job 31 · tool: pocket sweep carries a pocket sweep unit. crew"><img src="cards/ch_new1.webp" alt="Echo" loading="lazy" width="224" height="224"><figcaption><b>Echo</b><em>from job 31 · tool: Pocket Sweep</em><span>Carries a pocket sweep unit.</span></figcaption></figure><figure class="c" data-s="relay from job 31 · tool: pocket handsets never without a pair of handsets. crew"><img src="cards/ch_new2.webp" alt="Relay" loading="lazy" width="224" height="224"><figcaption><b>Relay</b><em>from job 31 · tool: Pocket Handsets</em><span>Never without a pair of handsets.</span></figcaption></figure><figure class="c" data-s="trident from job 31 · tool: pocket triple probe prefers three prongs to two. crew"><img src="cards/ch_new3.webp" alt="Trident" loading="lazy" width="224" height="224"><figcaption><b>Trident</b><em>from job 31 · tool: Pocket Triple Probe</em><span>Prefers three prongs to two.</span></figcaption></figure><figure class="c" data-s="prism from job 31 · tool: pocket two-value probe reads two values at once. crew"><img src="cards/ch_new4.webp" alt="Prism" loading="lazy" width="224" height="224"><figcaption><b>Prism</b><em>from job 31 · tool: Pocket Two-Value Probe</em><span>Reads two values at once.</span></figcaption></figure></div><h2>Personal tools <small>5</small></h2><div class="grid"><figure class="c" data-s="twin probe your turn with your dual cut, name a number (never yellow) and point at two wires on one crewmate stand. it works if either matches; if both do they quietly pick one. if neither matches the fuse burns one step and they tag one of the two. if exactly one is red nothing goes off and the tag goes on the other; if both are red, boom. personal tools"><img src="cards/dd.webp" alt="Twin Probe" loading="lazy" width="224" height="224"><figcaption><b>Twin Probe</b><em>your turn</em><span>With your dual cut, name a number (never yellow) and point at two wires on one crewmate stand. It works if either matches; if both do they quietly pick one. If neither matches the fuse burns one step and they tag one of the two. If exactly one is red nothing goes off and the tag goes on the other; if both are red, boom.</span></figcaption></figure><figure class="c" data-s="pocket sweep any time your own copy of the sweep card. personal tools"><img src="cards/sweep.webp" alt="Pocket Sweep" loading="lazy" width="224" height="224"><figcaption><b>Pocket Sweep</b><em>any time</em><span>Your own copy of the Sweep card.</span></figcaption></figure><figure class="c" data-s="pocket handsets any time your own copy of the handsets card. personal tools"><img src="cards/handsets.webp" alt="Pocket Handsets" loading="lazy" width="224" height="224"><figcaption><b>Pocket Handsets</b><em>any time</em><span>Your own copy of the Handsets card.</span></figcaption></figure><figure class="c" data-s="pocket triple probe your turn your own copy of the triple probe card. personal tools"><img src="cards/pt3.webp" alt="Pocket Triple Probe" loading="lazy" width="224" height="224"><figcaption><b>Pocket Triple Probe</b><em>your turn</em><span>Your own copy of the Triple Probe card.</span></figcaption></figure><figure class="c" data-s="pocket two-value probe your turn your own copy of the two-value probe card. personal tools"><img src="cards/pt10.webp" alt="Pocket Two-Value Probe" loading="lazy" width="224" height="224"><figcaption><b>Pocket Two-Value Probe</b><em>your turn</em><span>Your own copy of the Two-Value Probe card.</span></figcaption></figure></div>
