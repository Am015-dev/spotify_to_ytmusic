<title>Hollowbough</title>
<style>
/* ===== Board-first shell (shared by every game on the shelf) =====
   The page never scrolls. The board fills what the bar and the dock leave; the dock is in flow (never over the board);
   everything else opens in a closable popup (drawer). Games theme it with the --gx-* variables. */
:root{--gx-bar-h:48px;--gx-dock-w:clamp(300px,30vw,420px);--gx-bg:#10151c;--gx-bar:#0b1016;--gx-panel:#f4ecd8;--gx-ink:#231a10;--gx-line:rgba(0,0,0,.25);--gx-accent:#e0a948;--gx-shadow:0 20px 60px rgba(0,0,0,.5);--gx-radius:14px}
html.gx,html.gx body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
.gx-app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--gx-bg)}
.gx-bar{min-height:var(--gx-bar-h);display:flex;align-items:center;gap:6px;padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px));overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;z-index:6}
.gx-bar::-webkit-scrollbar{display:none}
.gx-bar .gx-sp{flex:1 0 8px}
.gx-main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--gx-dock-w);position:relative}
.gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr) 0}
.gx-board{position:relative;min-width:0;min-height:0;overflow:hidden}
.gx-dock{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.gx-dock-head{display:flex;align-items:center;gap:6px;padding:6px 8px 4px;flex:0 0 auto}
.gx-dock-head .gx-dt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-dock-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gx-app.gx-dock-min .gx-dock{visibility:hidden}

.gx-ibtn{appearance:none;border:1px solid var(--gx-line);background:rgba(255,255,255,.08);color:inherit;border-radius:10px;min-width:40px;min-height:40px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;justify-content:center;cursor:pointer;font:inherit;white-space:nowrap}
.gx-ibtn:focus-visible,.gx-drawer button:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
.gx-ibtn .gx-n{font-size:.72rem;opacity:.8}
.gx-ibtn.gx-reopen{position:absolute;right:10px;top:10px;z-index:5;display:none}
.gx-app.gx-dock-min .gx-ibtn.gx-reopen{display:inline-flex}
/* popups */
.gx-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.gx-scrim.on{opacity:1;pointer-events:auto}
.gx-drawer{position:fixed;z-index:41;top:calc(var(--gx-bar-h) + 8px + env(safe-area-inset-top,0px));right:8px;bottom:8px;width:min(520px,calc(100vw - 16px));display:flex;flex-direction:column;background:var(--gx-panel);color:var(--gx-ink);border-radius:var(--gx-radius);box-shadow:var(--gx-shadow);transform:translateX(calc(100% + 16px));transition:transform .22s ease;visibility:hidden}
.gx-drawer.on{transform:none;visibility:visible}
.gx-drawer.wide{width:min(980px,calc(100vw - 16px))}
.gx-drawer-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--gx-line);flex:0 0 auto}
.gx-drawer-head h2{margin:0;font-size:1.15rem;flex:1;min-width:0}
.gx-x{appearance:none;border:0;background:transparent;font-size:1.6rem;line-height:1;cursor:pointer;color:inherit;min-width:40px;min-height:40px;border-radius:10px}
.gx-drawer-body{flex:1;min-height:0;overflow:auto;padding:10px 12px 16px;overscroll-behavior:contain}
/* narrow screens: the dock becomes a sheet under the board (still in flow), the drawers slide up from the bottom */
@media (max-width:999px){
  .gx-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr)}
  .gx-dock{max-height:var(--gx-sheet-h,46dvh);border-radius:var(--gx-radius) var(--gx-radius) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-app.gx-sheet-full .gx-dock{max-height:78dvh}
  .gx-app.gx-dock-min .gx-dock{visibility:visible;max-height:none}
  .gx-app.gx-dock-min .gx-dock-body{display:none}
  .gx-reopen{display:none!important}
  .gx-grab{display:block;width:44px;height:5px;border-radius:3px;background:currentColor;opacity:.35;margin:0 auto}
  .gx-drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88dvh;height:88dvh;border-radius:var(--gx-radius) var(--gx-radius) 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-drawer.wide{width:auto}
  .gx-hide-narrow{display:none!important}
}
@media (min-width:1000px){.gx-grab{display:none}}
@media (prefers-reduced-motion:reduce){.gx-drawer,.gx-scrim{transition:none}}

/* ===== GX kit styles (load after shell.css). Themed by the shell's --gx-* variables. ===== */
:root{--gx-text:1;--gx-anim:1;--gx-chip:rgba(0,0,0,.07);--gx-chip-on:var(--gx-accent)}
/* text size: games opt in by using these classes, the kit's own panels always follow it */
.gx-drawer-body,.gx-dock-body,.gx-recap,.gx-tx{font-size:calc(1em * var(--gx-text,1))}
/* settings */
.gx-set-nav{position:sticky;top:-10px;z-index:2;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0;margin:-10px 0 4px;background:var(--gx-panel)}
.gx-set-nav::-webkit-scrollbar{display:none}
.gx-sec{padding:4px 0 12px;border-bottom:1px solid var(--gx-line);scroll-margin-top:56px}
.gx-sec:last-child{border-bottom:0}
.gx-sec h3{margin:8px 0 6px;font-size:1.02em;letter-spacing:.02em}
.gx-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 0}
.gx-row-l{flex:1 1 9em;min-width:0;font-weight:600}
.gx-row-l small{display:block;font-weight:400;opacity:.75;font-size:max(13px,.82em)}
.gx-row-k{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gx-seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.gx-sb,.gx-tg,.gx-chip{appearance:none;font:inherit;color:inherit;min-height:44px;min-width:44px;padding:4px 12px;border-radius:10px;border:1px solid var(--gx-line);background:var(--gx-chip);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;white-space:nowrap}
.gx-sb[aria-pressed=true],.gx-tg[aria-checked=true],.gx-chip[aria-pressed=true]{background:var(--gx-chip-on);border-color:transparent;color:#1d140b;font-weight:700}
.gx-sb:disabled{opacity:.4;cursor:default}
.gx-tg{min-width:64px}
.gx-chip{min-height:36px;padding:2px 11px;border-radius:99px;font-size:max(13px,.88em)}
.gx-sb:focus-visible,.gx-tg:focus-visible,.gx-chip:focus-visible,.gx-ref-it:focus-visible,.gx-ref-q:focus-visible,.gx-recap button:focus-visible,.gx-sl input:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
.gx-sl{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.gx-sl input{width:min(190px,44vw);accent-color:var(--gx-accent);height:28px}
.gx-sl output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.gx-links{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.gx-small{font-size:max(13px,.85em);opacity:.8;margin:6px 0}
.gx-about-n{font-weight:700;margin:4px 0}
/* reference */
.gx-ref-top{position:sticky;top:-10px;z-index:2;background:var(--gx-panel);margin:-10px -12px 6px;padding:10px 12px 6px;border-bottom:1px solid var(--gx-line)}
.gx-ref.big .gx-ref-top{display:none}
.gx-ref-q{width:100%;box-sizing:border-box;min-height:44px;font:inherit;padding:6px 12px;border-radius:10px;border:1px solid var(--gx-line);background:rgba(255,255,255,.6);color:inherit}
.gx-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0 0}
.gx-chips::-webkit-scrollbar{display:none}
.gx-chips>*{flex:none}
.gx-ref-list[hidden],.gx-ref-big[hidden]{display:none}
.gx-ref-n{font-size:max(13px,.82em);opacity:.75;padding-top:4px}
.gx-ref-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:8px}
.gx-ref-it{appearance:none;font:inherit;color:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:12px;border:1px solid var(--gx-line);background:rgba(255,255,255,.35);cursor:pointer;min-height:64px}
.gx-ref-it:hover{background:rgba(255,255,255,.55)}
.gx-ref-pic{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:52px}
.gx-ref-pic>img,.gx-ref-pic>svg{max-width:100%;height:auto;display:block}
.gx-ref-pic.big{width:min(240px,62vw);margin:4px auto 8px;display:flex}
.gx-ref-tx{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.gx-ref-tx b{font-size:1em}
.gx-ref-c{font-size:max(13px,.8em);font-weight:700;padding:0 6px;border-radius:99px;background:var(--gx-chip)}
.gx-ref-m{font-size:max(13px,.8em);opacity:.75;flex-basis:100%}
.gx-ref-d{font-size:max(13px,.86em);flex-basis:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gx-ref-big h3{margin:4px 0 2px;text-align:center;font-size:1.25em}
.gx-ref-big .gx-ref-m{text-align:center}
.gx-ref-full{font-size:1.02em;line-height:1.5;max-width:40em;margin:10px auto}
.gx-ref-x{max-width:40em;margin:8px auto;font-size:max(13px,.9em)}
.gx-ref-big .gx-chips{justify-content:center;flex-wrap:wrap}
.gx-tag{font-size:max(13px,.8em);padding:2px 9px;border-radius:99px;background:var(--gx-chip)}
.gx-ref-bh{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-10px;background:var(--gx-panel);padding:6px 0;z-index:2}
.gx-ref-nav{display:inline-flex;align-items:center;gap:6px}
.gx-ref-big:focus{outline:none}
/* recap strip */
.gx-recap{box-sizing:border-box;min-width:0;max-width:calc(100% - 16px);align-self:stretch;margin:6px 8px;border-radius:12px;background:rgba(0,0,0,.07);border:1px solid var(--gx-line)}
.gx-recap[hidden]{display:none}
.gx-recap-top{display:flex;align-items:stretch}
.gx-recap-h{appearance:none;flex:1;min-width:0;display:flex;align-items:center;gap:8px;font:inherit;color:inherit;background:transparent;border:0;padding:6px 10px;min-height:44px;text-align:left;cursor:pointer}
.gx-recap-h b{white-space:nowrap;font-size:max(13px,.86em)}
.gx-recap-n{font-size:max(13px,.75em);font-weight:700;min-width:1.6em;text-align:center;border-radius:99px;padding:1px 6px;background:var(--gx-accent);color:#1d140b}
.gx-recap-1{flex:1;min-width:0;font-size:max(13px,.84em);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-recap-x{appearance:none;border:0;background:transparent;color:inherit;font-size:1.4em;min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}
.gx-recap-l{margin:0;padding:0 12px 8px 30px;font-size:max(13px,.86em);max-height:9.5em;overflow:auto;line-height:1.4}
/* update notice */
.gx-update{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;appearance:none;font:inherit;font-weight:700;padding:10px 18px;min-height:48px;border-radius:99px;border:0;background:var(--gx-accent);color:#1d140b;box-shadow:var(--gx-shadow);cursor:pointer;max-width:calc(100vw - 24px)}
/* left-handed: the dock and the drawers swap sides on wide screens; games can flip their own button rows with html.lefty */
@media (min-width:1000px){
  html.lefty .gx-main{grid-template-columns:var(--gx-dock-w) minmax(0,1fr)}
  html.lefty .gx-app.gx-dock-min .gx-main{grid-template-columns:0 minmax(0,1fr)}
  html.lefty .gx-dock{grid-column:1;grid-row:1}
  html.lefty .gx-board{grid-column:2;grid-row:1}
  html.lefty .gx-drawer{right:auto;left:8px;transform:translateX(calc(-100% - 16px))}
  html.lefty .gx-drawer.on{transform:none}
  html.lefty .gx-ibtn.gx-reopen{right:auto;left:10px}
}
/* reduce motion / animations off */
html.gx-reduce *,html.gx-reduce *::before,html.gx-reduce *::after,html.gx-noanim *,html.gx-noanim *::before,html.gx-noanim *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
/* colour-blind symbols: games add <i class="gx-cbm">▲</i> next to colour-coded pieces; shown only with html.cb */
.gx-cbm{display:none;font-style:normal}
html.cb .gx-cbm{display:inline}

/* ===== GX campaign styles: chapter map, story scenes, boss card, result. Theme with the --gxc-* variables. ===== */
:root{--gxc-bg:#1b1410;--gxc-paper:#efe0bd;--gxc-paper2:#e2cc9b;--gxc-ink:#2a1d10;--gxc-dim:rgba(42,29,16,.68);--gxc-line:rgba(60,38,14,.28);
  --gxc-go:#c9662a;--gxc-go-ink:#fff8ec;--gxc-gold:#f2b93b;--gxc-a1:#4f8a4b;--gxc-a2:#c07a2c;--gxc-a3:#8e3b46;--gxc-road:#b98a52;--gxc-radius:16px;
  --gxc-font:inherit;--gxc-head:inherit}
.gxc{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:var(--gxc-ink);font-family:var(--gxc-font);
  background:radial-gradient(120% 70% at 50% 0%,#3a2a1c 0%,var(--gxc-bg) 70%);overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.gxc[hidden]{display:none}
.gxc *{box-sizing:border-box}
.gxc button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gxc button:focus-visible{outline:3px solid var(--gxc-gold);outline-offset:2px}
.gxc-screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;width:100%;max-width:560px;margin:0 auto}
.gxc-map-on .gxc-screen{justify-content:flex-start;padding:0;max-width:640px}
.gxc-dim{color:var(--gxc-dim)}
.gxc-small{font-size:13px;margin:6px 0 0;text-align:center}
.gxc-row{display:flex;gap:8px;justify-content:center;margin-top:14px;width:100%}
.gxc-row.wrap{flex-wrap:wrap}
.gxc-btn{min-height:46px;min-width:88px;padding:8px 18px;border-radius:12px;border:2px solid var(--gxc-line);background:rgba(255,255,255,.35);color:var(--gxc-ink);font-weight:700;letter-spacing:.01em}
.gxc-btn.go{background:linear-gradient(#dc7a3a,var(--gxc-go));border-color:#8f4317;color:var(--gxc-go-ink);box-shadow:0 3px 0 #7a3712,0 6px 14px rgba(0,0,0,.25);flex:1 1 auto;max-width:220px}
.gxc-btn.go:active{transform:translateY(2px);box-shadow:0 1px 0 #7a3712}
.gxc-btn.soft{background:#f7e7b8;border-color:#c9a14a}
.gxc-btn.ghost{background:rgba(255,255,255,.22)}
.gxc-ib{min-height:44px;min-width:44px;padding:4px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fbefd6;font-weight:600;white-space:nowrap}
.gxc-tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:rgba(60,38,14,.12);margin-right:6px;font-weight:700}
/* portraits: image or emoji badge in a painted ring */
.gxc-pt{--gxc-pt:64px;--gxc-ptc:#6b4a2b;width:var(--gxc-pt);height:var(--gxc-pt);flex:0 0 var(--gxc-pt);border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 55%),var(--gxc-ptc);border:3px solid #f6e6c2;box-shadow:0 0 0 2px rgba(60,38,14,.5),0 6px 16px rgba(0,0,0,.3)}
.gxc-pt img{width:100%;height:100%;object-fit:cover;display:block}
.gxc-pt-e{font-size:calc(var(--gxc-pt) * .52);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
/* ---- map ---- */
.gxc-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;flex:0 0 auto;color:#fbefd6}
.gxc-htitle{flex:1 1 auto;min-width:0;text-align:center;font-family:var(--gxc-head);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.gxc-score{color:var(--gxc-gold)}
.gxc-map{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  border-radius:var(--gxc-radius) var(--gxc-radius) 0 0;
  background:
    radial-gradient(60% 40% at 20% 15%,rgba(110,150,80,.28),transparent 70%),
    radial-gradient(50% 35% at 85% 55%,rgba(200,140,60,.22),transparent 70%),
    radial-gradient(70% 40% at 30% 92%,rgba(150,60,70,.22),transparent 70%),
    repeating-radial-gradient(circle at 70% 30%,rgba(120,80,30,.035) 0 2px,transparent 2px 9px),
    linear-gradient(#f1e3c2,var(--gxc-paper2));box-shadow:inset 0 0 40px rgba(90,55,20,.45)}
.gxc-path{position:relative;width:100%;margin:0 auto;max-width:560px}
.gxc-road{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:visible}
.gxc-road path{fill:none;stroke-linecap:round}
.gxc-road-edge{stroke:rgba(90,58,24,.45);stroke-width:26px}
.gxc-road-fill{stroke:var(--gxc-road);stroke-width:20px}
.gxc-road-dash{stroke:#f6e6c2;stroke-width:3px;stroke-dasharray:2 10;opacity:.85}
.gxc-act{position:absolute;left:12px;right:12px;height:38px;margin-top:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(60,38,14,.82) 15%,rgba(60,38,14,.82) 85%,transparent);color:#fbefd6;z-index:2;text-align:center;line-height:1.1}
.gxc-act b{font-size:14px;letter-spacing:.04em}
.gxc-act small{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 18px}
.gxc-node{position:absolute;transform:translateX(-50%);width:64px;height:64px;padding:0;border:0;background:none;z-index:3;display:flex;flex-direction:column;align-items:center}
.gxc-disc{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff8ec;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 55%),var(--gxc-a1);border:3px solid #f6e6c2;box-shadow:0 0 0 2px rgba(60,38,14,.55),0 5px 10px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.gxc-node.a2 .gxc-disc{background-color:var(--gxc-a2);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 55%)}
.gxc-node.a3 .gxc-disc{background-color:var(--gxc-a3);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 55%)}
.gxc-node.boss .gxc-disc{width:62px;height:62px;margin-top:-3px;border-color:var(--gxc-gold);box-shadow:0 0 0 2px #6b3c10,0 0 0 6px rgba(242,185,59,.35),0 6px 12px rgba(0,0,0,.35)}
.gxc-node.boss .gxc-disc .gxc-pt{border:0;box-shadow:none;background:transparent}
.gxc-node.boss .gxc-disc::after{content:'♛';position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:17px;color:var(--gxc-gold);text-shadow:0 1px 2px #000}
.gxc-node.locked .gxc-disc{filter:grayscale(.85) brightness(.85);opacity:.75}
.gxc-lock{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:16px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.gxc-node.won .gxc-disc{border-color:var(--gxc-gold)}
.gxc-node.next .gxc-disc{animation:gxc-pulse 1.6s ease-in-out infinite}
@keyframes gxc-pulse{0%,100%{box-shadow:0 0 0 2px rgba(60,38,14,.55),0 0 0 0 rgba(242,185,59,.7)}50%{box-shadow:0 0 0 2px rgba(60,38,14,.55),0 0 0 10px rgba(242,185,59,0)}}
.gxc-node .gxc-stars{position:absolute;top:50px;left:50%;transform:translateX(-50%);gap:0;padding:0 4px;border-radius:99px;background:rgba(60,38,14,.75)}
.gxc-node .gxc-st{font-size:12px}
.gxc-lab{position:absolute;left:66px;top:14px;width:max-content;max-width:min(150px,38vw);text-align:left;font-size:13.5px;font-weight:700;line-height:1.15;color:var(--gxc-ink);
  background:rgba(246,230,194,.88);padding:3px 8px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.gxc-node.lab-l .gxc-lab{left:auto;right:66px;text-align:right}
.gxc-node.locked .gxc-lab{opacity:.65}
.gxc-stars{display:inline-flex;gap:2px;justify-content:center}
.gxc-st{font-style:normal;color:rgba(255,255,255,.35);font-size:16px;line-height:1}
.gxc-st.on{color:var(--gxc-gold);text-shadow:0 0 6px rgba(242,185,59,.6)}
.gxc-st.cap{opacity:.3}
.gxc-stars.big .gxc-st{font-size:44px;color:rgba(60,38,14,.2)}
.gxc-stars.big .gxc-st.on{color:var(--gxc-gold);text-shadow:0 2px 0 #9c6a12,0 0 14px rgba(242,185,59,.7);animation:gxc-pop .4s cubic-bezier(.3,1.6,.5,1) both}
.gxc-stars.big .gxc-st.on:nth-child(2){animation-delay:.25s}.gxc-stars.big .gxc-st.on:nth-child(3){animation-delay:.5s}
@keyframes gxc-pop{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
/* sheets and toasts sit over the map */
.gxc-sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88%;overflow-y:auto;z-index:5;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#f6e9cb,var(--gxc-paper));border-radius:var(--gxc-radius) var(--gxc-radius) 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:gxc-up .22s ease-out}
@keyframes gxc-up{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.gxc-sheet h3{margin:0 0 4px;font-family:var(--gxc-head);font-size:21px;line-height:1.15}
.gxc-sh-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.gxc-sh-t{min-width:0}.gxc-sh-t small{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gxc-dim);font-weight:700}
.gxc-goal,.gxc-twist{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:12px;margin:6px 0;text-align:left;width:100%;font-size:15px;line-height:1.3}
.gxc-goal{background:rgba(79,138,75,.16);border:1px solid rgba(79,138,75,.45)}
.gxc-twist{background:rgba(142,59,70,.12);border:1px solid rgba(142,59,70,.5)}
.gxc-goal b,.gxc-twist b{font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.gxc-twist b{color:var(--gxc-a3)}
.gxc-twist.big{font-size:16px;border-width:2px}
.gxc-slist{list-style:none;margin:8px 0 0;padding:0;width:100%;text-align:left;font-size:14.5px}
.gxc-slist li{display:flex;gap:8px;align-items:center;padding:4px 0}
.gxc-slist i{font-style:normal;font-size:18px;color:rgba(60,38,14,.25)}
.gxc-slist li.on i{color:var(--gxc-gold);text-shadow:0 1px 0 #9c6a12}
.gxc-rw{list-style:none;padding:0;margin:8px 0}.gxc-rw li{padding:6px 0;border-bottom:1px solid var(--gxc-line)}
.gxc-toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:rgba(30,20,10,.92);color:#fbefd6;padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
/* ---- story scene ---- */
.gxc-scene,.gxc-boss,.gxc-res{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px;border-radius:var(--gxc-radius);
  background:linear-gradient(#f6e9cb,var(--gxc-paper));box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 30px rgba(140,95,40,.25);max-height:100%;overflow-y:auto}
.gxc-sc-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gxc-dim);font-weight:700;margin-bottom:12px}
.gxc-sc-who{margin-bottom:8px}
.gxc-sc-name{font-family:var(--gxc-head);font-weight:800;font-size:18px;min-height:1.2em}
.gxc-sc-text{font-size:18px;line-height:1.4;margin:10px 0 12px;min-height:3.2em;max-width:30em;cursor:pointer}
.gxc-sc-text.in{animation:gxc-in .3s ease-out}
@keyframes gxc-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gxc-dots{display:flex;gap:6px}.gxc-dots i{width:8px;height:8px;border-radius:50%;background:rgba(60,38,14,.2)}.gxc-dots i.was{background:rgba(60,38,14,.45)}.gxc-dots i.on{background:var(--gxc-go)}
/* ---- boss card ---- */
.gxc-boss-on{background:radial-gradient(100% 60% at 50% 30%,#5a2230 0%,#1a0d10 75%)}
.gxc-boss-on.a1{background:radial-gradient(100% 60% at 50% 30%,#2d5a2c 0%,#0f1a0e 75%)}
.gxc-boss-on.a2{background:radial-gradient(100% 60% at 50% 30%,#6a4318 0%,#1a120a 75%)}
.gxc-boss{border:3px solid var(--gxc-gold);position:relative;padding-top:14px}
.gxc-boss-tag{margin-bottom:10px;background:linear-gradient(#f6c552,#c98d17);color:#3a2205;font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;padding:5px 18px;border-radius:99px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.gxc-boss .gxc-pt{border-color:var(--gxc-gold)}
.gxc-boss h2{margin:12px 0 2px;font-family:var(--gxc-head);font-size:26px;line-height:1.1}
.gxc-boss-pers{margin:4px 0 8px;font-style:italic;font-size:16px;color:var(--gxc-dim)}
/* ---- result ---- */
.gxc-res-on.won{background:radial-gradient(100% 60% at 50% 25%,#6b5320 0%,var(--gxc-bg) 75%)}
.gxc-res-k{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gxc-dim);font-weight:700}
.gxc-res h2{margin:4px 0 6px;font-family:var(--gxc-head);font-size:28px}
.gxc-quote{display:flex;gap:10px;align-items:center;text-align:left;width:100%;margin:12px 0 4px;padding:10px;border-radius:12px;background:rgba(60,38,14,.08)}
.gxc-quote b{font-size:13px}.gxc-quote p{margin:2px 0 0;font-style:italic;font-size:15px;line-height:1.3}
.gxc-unl{width:100%;margin-top:10px;text-align:left;padding:10px 12px;border-radius:12px;border:2px dashed #c9a14a;background:rgba(242,185,59,.14)}
.gxc-unl>b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.gxc-unl-i{padding:3px 0;font-size:15px}
/* short phones (375x553): tighter scene, smaller portraits */
@media (max-height:600px){
  .gxc-screen{padding:8px 12px}
  .gxc-scene,.gxc-boss,.gxc-res{padding:14px 12px}
  .gxc-sc-who .gxc-pt{--gxc-pt:84px!important}
  .gxc-boss .gxc-pt{--gxc-pt:104px!important}
  .gxc-boss{padding-top:10px}.gxc-boss-tag{margin-bottom:6px}.gxc-boss h2{font-size:22px;margin-top:8px}
  .gxc-sc-text{font-size:16.5px;margin:6px 0 8px}
  .gxc-stars.big .gxc-st{font-size:36px}
  .gxc-res h2{font-size:23px}
}
html.gx-reduce .gxc *,html.gx-noanim .gxc *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.gxc *{animation:none!important}}

:root{--ink:#3b2f2a;--paper:#f6ecd6;--paper2:#ecdcba;--wood:#a67c52;--wood2:#7c5636;--leaf:#5f8f4a;--gold:#e3b02e;--red:#b04a38;--gx-bg:#2c3b27;--gx-bar:#22301f;--gx-panel:#f6ecd6;--gx-ink:#3b2f2a;--gx-accent:#e3b02e;--gx-dock-w:clamp(330px,31vw,430px);--gx-bar-h:48px;

#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.fxp{position:absolute;left:0;top:0;display:flex;align-items:center;gap:2px;pointer-events:none;will-change:transform,opacity;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}

.fxfly{position:absolute;left:0;top:0;pointer-events:none;z-index:31;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));will-change:transform}
.fxseason{position:absolute;left:50%;top:42%;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;color:#fff8e6;font-size:30px;font-weight:800;text-shadow:0 2px 6px #2a1f19,0 0 3px #2a1f19;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#finger{position:absolute;width:40px;height:48px;z-index:42;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));opacity:0}
#finger[hidden]{display:none}
#finger svg{width:100%;height:100%}
#finger.go{animation:ftap 1.5s ease-in-out infinite}

@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes bmp{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.shk{animation:shk .4s}
.bmp{animation:bmp .5s}

.vb{position:absolute;top:-5px;right:-5px;z-index:3}

.pacts2{display:flex;gap:6px}.pacts2 .btn{flex:1}

#pc .ph-body,.gx-drawer-body .rules,#logbody,#rivalbody{zoom:var(--gx-text,1)}

<script>
// ===== Board-first shell: dock toggle, sheet sizing, closable popups (drawers) =====
const GX={key:'gx',open:null,
  init(o){this.key=o&&o.key||'gx';document.documentElement.classList.add('gx');const app=document.querySelector('.gx-app');this.app=app;
    let min=false;try{min=localStorage.getItem(this.key+'_dockmin')==='1'}catch(e){}if(min)app.classList.add('gx-dock-min');
    if(!document.querySelector('.gx-scrim')){const s=document.createElement('div');s.className='gx-scrim';s.addEventListener('click',()=>this.close());document.body.appendChild(s);this.scrim=s}
    document.addEventListener('click',e=>{const t=e.target.closest('[data-gx]');if(!t)return;const a=t.dataset.gx;
      if(a==='dock')this.toggleDock();else if(a==='sheet')this.cycleSheet();else if(a==='close')this.close();else this.toggle(a)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&this.open){this.close();e.stopImmediatePropagation()}},true);
    // resize hook for boards
    const b=document.querySelector('.gx-board');if(b&&window.ResizeObserver)new ResizeObserver(()=>{for(const f of this._rs)try{f(b.clientWidth,b.clientHeight)}catch(e){}}).observe(b)},
  // a drawer is modal: the page behind it is inert and hidden from assistive tech, so nothing under the sheet is a live tap target
  bg(on){const a=this.app;if(!a)return;if(on){a.setAttribute('aria-hidden','true');a.inert=true}else{a.removeAttribute('aria-hidden');a.inert=false}},
  _rs:[],onResize(f){this._rs.push(f)},
  boardSize(){const b=document.querySelector('.gx-board');return b?{w:b.clientWidth,h:b.clientHeight}:{w:innerWidth,h:innerHeight}},
  toggleDock(force){const min=force!=null?!force:!this.app.classList.contains('gx-dock-min');this.app.classList.toggle('gx-dock-min',min);this.app.classList.remove('gx-sheet-full');try{localStorage.setItem(this.key+'_dockmin',min?'1':'0')}catch(e){}},
  // phone sheet: min -> normal -> full -> min
  cycleSheet(){const a=this.app;if(a.classList.contains('gx-dock-min')){this.toggleDock(true)}else if(!a.classList.contains('gx-sheet-full'))a.classList.add('gx-sheet-full');else{a.classList.remove('gx-sheet-full');this.toggleDock(false)}},
  showDock(){if(this.app&&this.app.classList.contains('gx-dock-min'))this.toggleDock(true)},
  toggle(id){if(this.open===id)this.close();else this.show(id)},
  show(id){const d=document.getElementById(id);if(!d)return;if(this.open&&this.open!==id){const o=document.getElementById(this.open);if(o)o.classList.remove('on')}
    this.open=id;d.classList.add('on');this.scrim&&this.scrim.classList.add('on');this.bg(true);this._back=document.activeElement;
    for(const b of document.querySelectorAll('[data-gx="'+id+'"]'))b.setAttribute('aria-expanded','true');
    const f=d.querySelector('.gx-x');if(f)f.focus({preventScroll:true});if(this.onShow)this.onShow(id)},
  close(){if(!this.open)return;const id=this.open;const d=document.getElementById(this.open);if(d)d.classList.remove('on');for(const b of document.querySelectorAll('[data-gx="'+this.open+'"]'))b.setAttribute('aria-expanded','false');this.open=null;this.bg(false);this.scrim&&this.scrim.classList.remove('on');if(this._back&&this._back.focus)this._back.focus({preventScroll:true});if(this.onClose)this.onClose(id)},
  // build a drawer shell around a body element: <div class=gx-drawer id><head><h2>title</h2><button.gx-x></head><body/></div>
  drawer(id,title,bodyEl,wide){let d=document.getElementById(id);if(!d){d=document.createElement('section');d.id=id;d.className='gx-drawer'+(wide?' wide':'');d.setAttribute('role','dialog');d.setAttribute('aria-label',title);
      d.innerHTML=`<div class="gx-drawer-head"><h2></h2><button class="gx-x" data-gx="close" aria-label="Close">×</button></div><div class="gx-drawer-body"></div>`;document.body.appendChild(d)}
    d.querySelector('h2').textContent=title;if(bodyEl){const b=d.querySelector('.gx-drawer-body');if(bodyEl.parentNode!==b){b.innerHTML='';b.appendChild(bodyEl)}}return d}};

<script>
// ===== GX kit: opt-in shared parts for every game on the shelf (load AFTER shell.js) =====
// Adds to the existing GX object without changing any of its existing calls:
//   GX.pref / GX.setPref / GX.onPref / GX.applyPrefs     shared settings stored once as `gns-prefs`
//   GX.settings(opts)                                     the Menu drawer with the same sections in every game
//   GX.reference(sections, opts) / GX.refOpen(id)         component reference drawer (search, chips, big view)
//   GX.undo                                               snapshot / restore of the JSON game state
//   GX.recap                                              "Since your last turn" strip for the dock
//   GX.buzz / GX.animMs / GX.aiDelay / GX.reduced / GX.mark   small helpers
//   GX.offline(opts)                                      service worker + "a new version is ready" notice
// and a global GNS for local results, statistics and achievements (shared with the shelf home page).
// Everything is wrapped in try/catch: a missing localStorage, navigator.vibrate or service worker never throws.
(function (root, shellGX) {
  'use strict';
  // shell.js declares `const GX` (a global lexical binding, not window.GX): extend that same object, and expose it as window.GX too
  var GX = root.GX = shellGX || root.GX || {};
  var doc = root.document;
  var LS = {
    get: function (k) { try { return root.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { root.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    json: function (k, d) { try { var v = JSON.parse(root.localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
    put: function (k, v) { try { root.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  GX._ls = LS;
  function el(tag, cls, txt) { var e = doc.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function btn(cls, txt, on) { var b = el('button', cls, txt); b.type = 'button'; if (on) b.addEventListener('click', on); return b; }
  var qs = function () { try { return root.location ? root.location.search : ''; } catch (e) { return ''; } };
  GX.dev = /[?&]dev=1\b/.test(qs());
  // hooks run just before a drawer opens (the game's own GX.onShow keeps working untouched)
  var bsh = [];
  GX.beforeShow = function (f) {
    if (!GX._kitShow && typeof GX.show === 'function') { var base = GX.show; GX._kitShow = true; GX.show = function (id) { for (var i = 0; i < bsh.length; i++) { try { bsh[i](id); } catch (e) { } } return base.apply(this, arguments); }; }
    bsh.push(f); return f;
  };

  // ------------------------------------------------------------------ shared settings

<script>
// ---------- PerfHUD: one speed tool for every game on the shelf ----------
// 1. an optional overlay (FPS, frame time avg/p95, level, draws/triangles, heap, dpr, render size): menu "Show speed", ?fps=1 or F9
// 2. "Test speed": 2 s per graphics level with a slow camera orbit, then a result card with Apply and Copy report
// 3. the standard auto step-down: p95 > 50 ms for 3 s steps down a level, then the pixel ratio (floor 0.6);
//    10 s with p95 work < 14 ms steps back up, at most once a minute; a level picked by hand is never changed
// 4. the idle-frame saver: nothing animating and no input for 1.5 s -> PerfHUD.raf() runs at 10 fps (or only on demand)
// Plain script, no modules. Safe in jsdom and without WebGL or requestAnimationFrame: nothing runs and the overlay never shows.
(function(root){
  'use strict';
  const HAS_DOM=typeof window!=='undefined'&&typeof document!=='undefined';
  const UA=(typeof navigator!=='undefined'&&navigator.userAgent)||'';
  const JSDOM=/jsdom/i.test(UA);
  const now=()=>(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  const RAF=HAS_DOM&&!JSDOM&&typeof window.requestAnimationFrame==='function'?window.requestAnimationFrame.bind(window):null;
  const LIVE=!!RAF;
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const NAMES={high:'High',medium:'Medium',med:'Medium',low:'Low'};
  const WIN=2000;                         // stats window (ms)
  const RULE={down:50,downFor:3000,up:14,upFor:10000,upEvery:60000,grace:2000,prStep:.8,prFloor:.6,idleAfter:1500};

  // registered game hooks
  const H={game:'',renderer:null,levels:['high','medium','low'],setLevel:null,getLevel:null,orbit:null,isAuto:null,isAnimating:null,
    onPixelRatio:null,beforeTest:null,anchor:null,corner:'bl',idleMode:'throttle',idleFps:10,autoTop:null,names:null};
  let registered=false;
  // measurement
  let S=[],lastT=0,workAcc=0,workSeen=0,drawn=0,loopOn=false,lastEval=0,lastHud=0;
  // controller
  const C={slowSince:0,fastSince:0,lastUp:-1e9,grace:0,prCap:null,log:[]};
  // idle saver
  let idleOn=false,lastInput=now(),lastIdleDraw=0,pollT=0;const pending=new Set();
  // test
  let testing=false,testT0=0,testLen=0,collect=null;
  // ui
  let hudOn=false,hud=null,card=null,pill=null;

  // ---------- stats ----------
  function pct(a,p){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);return b[Math.min(b.length-1,Math.floor(p*(b.length-1)+.5))]}
  function stats(list){const L=list||S;const n=L.length;if(!n)return {n:0,fps:0,avg:0,p95:0,work:0,refresh:16.7};
    const dts=L.map(s=>s.dt),span=Math.max(1,L[n-1].t-L[0].t+L[0].dt);const ws=L.filter(s=>s.w>=0).map(s=>s.w);
    return {n,fps:n*1000/span,avg:dts.reduce((a,b)=>a+b,0)/n,p95:pct(dts,.95),work:ws.length?pct(ws,.95):-1,refresh:Math.max(4,pct(dts,.1))}}
  function levelName(l){return (H.names&&H.names[l])||NAMES[l]||String(l)}
  function curLevel(){try{return H.getLevel?H.getLevel():null}catch(e){return null}}
  function auto(){try{return H.isAuto?!!H.isAuto():true}catch(e){return false}}
  function animating(){try{return H.isAnimating?!!H.isAnimating():true}catch(e){return true}}
  function pr(){try{return H.renderer?H.renderer.getPixelRatio():(HAS_DOM?window.devicePixelRatio||1:1)}catch(e){return 1}}

  // ---------- the measuring loop: one rAF callback per display frame while the game is awake ----------
  function startLoop(){if(!LIVE||loopOn)return;loopOn=true;lastT=0;RAF(tick)}
  function tick(t){
    if(idleOn&&!testing&&!hudOn){loopOn=false;lastT=0;return}
    RAF(tick);
    if(typeof document!=='undefined'&&document.hidden){lastT=0;S=[];return}
    if(lastT&&!idleOn){const dt=t-lastT;const w=workSeen?workAcc:-1;S.push({t,dt,w});if(collect)collect.push({t,dt,w})}
    lastT=t;workAcc=0;workSeen=0;
    while(S.length&&t-S[0].t>WIN)S.shift();
    if(testing&&H.orbit){try{H.orbit(Math.min(1,(now()-testT0)/testLen))}catch(e){}}
    if(t-lastEval>250){lastEval=t;control(t)}
    if(hudOn&&t-lastHud>500){lastHud=t;drawHud()}
    if(!testing&&!idleOn&&H.isAnimating&&now()-lastInput>RULE.idleAfter&&!animating())idle(true);
  }

  // ---------- auto step-down / step-up ----------
  function note(s){C.log.push(Math.round(now())+' '+s);if(C.log.length>20)C.log.shift()}
  function hitch(ms){C.grace=now()+(ms==null?RULE.grace:ms);C.slowSince=C.fastSince=0;S=[]}
  function applyPR(){if(!H.renderer)return;try{const base=H.basePR?H.basePR():pr();const v=C.prCap==null?base:Math.min(base,C.prCap);
      if(H.onPixelRatio)H.onPixelRatio(v);else H.renderer.setPixelRatio(v)}catch(e){}}
  function control(t){
    const T=now();
    if(!H.setLevel||!H.getLevel){return}
    if(!auto()){if(C.prCap!=null){C.prCap=null;applyPR()}C.slowSince=C.fastSince=0;return}
    if(testing||idleOn||T<C.grace||(typeof document!=='undefined'&&document.hidden)){C.slowSince=C.fastSince=0;return}
    const st=stats();if(st.n<4&&!(st.n>=1&&st.avg>RULE.down*4))return; // very slow frames (>200 ms, e.g. 3 s in SwiftShader) leave fewer than 4 in the 2 s window: they still count as slow
    if(st.p95>RULE.down){C.fastSince=0;if(!C.slowSince)C.slowSince=T;else if(T-C.slowSince>=RULE.downFor)stepDown(st);return}
    C.slowSince=0;
    // "under 14 ms": the game's own work per frame when it reports it (PerfHUD.raf), and every display frame on time
    // (a 60 Hz display never shows intervals under 16.7 ms, so without work numbers "every frame on time" stands in for it)
    const onTime=st.p95<=Math.max(RULE.up,st.refresh*1.3+1);const fast=onTime&&(st.work>=0?st.work<RULE.up:true);
    if(fast){if(!C.fastSince)C.fastSince=T;else if(T-C.fastSince>=RULE.upFor&&T-C.lastUp>=RULE.upEvery)stepUp(st)}else C.fastSince=0}
  function stepDown(st){const L=H.levels,i=L.indexOf(curLevel());C.slowSince=0;
    if(i>=0&&i<L.length-1){note('down '+L[i]+'->'+L[i+1]+' p95 '+st.p95.toFixed(0));set(L[i+1],'auto');hitch();return}
    if(!H.renderer)return;const cur=C.prCap==null?pr():C.prCap;if(cur<=RULE.prFloor+1e-3)return;
    C.prCap=Math.max(RULE.prFloor,Math.round(cur*RULE.prStep*100)/100);note('pixel ratio '+C.prCap);applyPR();hitch()}
  function stepUp(st){const L=H.levels,i=L.indexOf(curLevel());C.fastSince=0;const T=now();
    if(C.prCap!=null){const base=H.basePR?H.basePR():C.prCap/RULE.prStep;const v=Math.round(C.prCap/RULE.prStep*100)/100;C.prCap=v>=base-1e-3?null:v;note('pixel ratio up '+(C.prCap||'full'));applyPR();C.lastUp=T;hitch();return}
    const top=H.autoTop!=null?Math.max(0,L.indexOf(typeof H.autoTop==='function'?H.autoTop():H.autoTop)):0;
    if(i>top){note('up '+L[i]+'->'+L[i-1]+' work '+st.work.toFixed(1));set(L[i-1],'auto');C.lastUp=T;hitch()}}
  function set(l,why){try{H.setLevel(l,why)}catch(e){}}
  // the resolution cap the controller wants; games pass their own pixel ratio through this in their resize code
  function pixelRatio(want){return C.prCap==null?want:Math.min(want,C.prCap)}

  // ---------- idle-frame saver ----------
  function raf(fn){if(!RAF)return 0;
    const run=ts=>{const t0=now();if(idleOn)lastIdleDraw=t0;try{fn(ts)}finally{workAcc+=now()-t0;workSeen++;drawn++}};
    if(idleOn&&!testing){if(H.idleMode==='demand'){pending.add({fn:run,to:0});return -1}
      const e={fn:run,to:0};e.to=setTimeout(()=>{pending.delete(e);RAF(run)},Math.max(0,lastIdleDraw+1000/H.idleFps-now()));pending.add(e);return -1}
    return RAF(run)}
  function idle(on){on=!!on&&LIVE;if(on===idleOn)return;idleOn=on;
    if(on){note('idle');if(!pollT)pollT=setInterval(()=>{if(testing||animating())idle(false)},250);if(hudOn)drawHud()}
    else{if(pollT){clearInterval(pollT);pollT=0}for(const e of pending){clearTimeout(e.to);RAF(e.fn)}pending.clear();lastT=0;hitch(400);startLoop()}}
  function wake(){lastInput=now();if(idleOn)idle(false)}

  // ---------- overlay ----------
  const CSS='#perfhud{position:fixed;z-index:2147483000;pointer-events:none;left:8px;top:8px;margin:0;padding:4px 7px;border-radius:7px;background:rgba(8,12,16,.62);color:#dff3e4;'+
    'font:600 11px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;opacity:.72;contain:content;text-shadow:0 1px 0 #000;user-select:none}'+
    '#perfhud b{color:#fff}#perfhud .w{color:#ffcf6e}#perfhud .bad{color:#ff8f7e}'+
    '.phud-card{position:fixed;z-index:2147483001;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box;padding:14px 16px;border-radius:12px;'+
    'background:#12181e;color:#e9eef2;border:1px solid #3a4652;box-shadow:0 12px 40px rgba(0,0,0,.55);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}'+
    '.phud-card h3{margin:0 0 8px;font-size:16px}.phud-card table{width:100%;border-collapse:collapse;margin:4px 0 10px;font-variant-numeric:tabular-nums}'+
    '.phud-card td,.phud-card th{padding:3px 4px;text-align:right;border-bottom:1px solid #26303a}.phud-card td:first-child,.phud-card th:first-child{text-align:left}'+
    '.phud-card tr.phud-rec td{color:#9ff0b0;font-weight:700}.phud-card .phud-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}'+

<script>
// ---------- NetRoom: free peer-to-peer game rooms (WebRTC through Trystero, MIT) ----------
// Players find each other through public Nostr relays; after that the moves go browser to browser.
// The room object has the same shape as the claude.ai "room" capability, so a game's net code runs on either:
//   lobby.join(name) -> room {presence(o), on(type,fn), emit(type,data), onPeers(fn), onConnection(fn), leave()}
//   messages: {peer, data, isMe:false, by}   peers: {peer, isMe, sameTab, kind:'viewer', presence, by, guest:false}
// Tests can point it at a local relay with window.NETROOM_RELAYS=['ws://127.0.0.1:17700'].
const NetRoom=(()=>{
  const APP='game-night-shelf-v1';
  const rand=n=>{const a='abcdefghijkmnpqrstuvwxyz23456789',u=new Uint8Array(n);crypto.getRandomValues(u);return [...u].map(x=>a[x%a.length]).join('')};
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  let myUid=null;
  function uid(){if(myUid)return myUid;myUid=store.get('gns-uid');if(!myUid){myUid='p'+rand(15);store.set('gns-uid',myUid)}return myUid}
  function name(){return (store.get('gns-name')||'').slice(0,24)}
  function setName(n){n=String(n||'').replace(/[<>&"]/g,'').trim().slice(0,24);store.set('gns-name',n);return n}
  function available(){return typeof Trystero!=='undefined'&&typeof RTCPeerConnection!=='undefined'&&!!(window.crypto&&crypto.subtle)}
  // invite codes: 5 letters/digits without look-alikes
  function newCode(){return rand(5)}
  function cleanCode(c){return String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10)}
  // one room per page: joining again (a retry, or another code) first closes the old room, so the host
  // can't stay connected to an abandoned copy while the game listens on the new one
  let active=null;
  function lobby(game){return {join:async roomName=>{if(active){const old=active;active=null;try{await old.leave()}catch(e){}await new Promise(r=>setTimeout(r,250))}
    const r=makeRoom(game,String(roomName));active=r;return r}}}
  function makeRoom(game,roomName){
    const cfg={appId:APP,password:game+'/'+roomName,relayConfig:{redundancy:6,warnOnRelayFailure:false}};
    if(window.NETROOM_RELAYS)cfg.relayConfig.urls=window.NETROOM_RELAYS;
    if(window.NETROOM_ICE)cfg.rtcConfig={iceServers:window.NETROOM_ICE};
    if(window.NETROOM_TURN)cfg.turnConfig=window.NETROOM_TURN;
    const tr=Trystero.joinRoom(cfg,game+'/'+roomName);
    const me=Trystero.selfId,by=uid();
    let pres={name:name()},left=false;
    const remote=new Map(),handlers={},peerFns=[],connFns=[];
    const gA=tr.makeAction('g'),pA=tr.makeAction('p');
    const entry=(p,v)=>({peer:p,isMe:false,sameTab:false,kind:'viewer',presence:v.presence,by:v.by,guest:false});
    const list=()=>[{peer:me,isMe:true,sameTab:true,kind:'viewer',presence:pres,by,guest:false},...[...remote].map(([p,v])=>entry(p,v))];
    const fire=(joined,gone)=>{const ch={peers:list(),joined,left:gone};peerFns.forEach(f=>{try{f(ch)}catch(e){console.error(e)}})};
    const sendPres=target=>{try{pA.send({pr:pres,by},target?{target}:undefined)}catch(e){}};
    const gone=new Set();
    tr.onPeerJoin=p=>{if(left)return;gone.delete(p);sendPres(p)};
    tr.onPeerLeave=p=>{if(left)return;gone.add(p);const v=remote.get(p);if(!v)return;remote.delete(p);fire([],[entry(p,v)])};
    pA.onMessage=(d,info)=>{const p=info&&info.peerId;if(left||!p||gone.has(p)||!d||typeof d!=='object')return;
      const pr=d.pr&&typeof d.pr==='object'&&!Array.isArray(d.pr)?Object.assign({},d.pr):{};if('name' in pr)pr.name=String(pr.name||'').replace(/[<>&"]/g,'').slice(0,24);
      const v={presence:pr,by:typeof d.by==='string'?d.by.slice(0,40):null};
      const old=remote.get(p);remote.set(p,v);if(!old){sendPres(p);fire([entry(p,v)],[]);return}

      if(JSON.stringify(old)!==JSON.stringify(v))fire([],[])};
    gA.onMessage=(d,info)=>{const p=info&&info.peerId;if(left||!p||!d||typeof d.t!=='string')return;
      // a message can arrive just before that peer's presence does
      const v=remote.get(p)||{presence:{},by:null};(handlers[d.t]||[]).forEach(f=>{try{f({peer:p,data:d.d,isMe:false,by:v.by})}catch(e){console.error(e)}})};
    setTimeout(()=>connFns.forEach(f=>f(true)),0);
    const hb=setInterval(()=>{if(!left)sendPres()},5000);
    // closing the tab tells the others at once, instead of after WebRTC's ~10 s timeout
    const bye=()=>{if(left)return;left=true;clearInterval(hb);try{tr.leave()}catch(e){}};window.addEventListener('pagehide',bye);
    return {
      self:me,
      presence(o){pres=Object.assign({},pres,o||{});sendPres();fire([],[]);return Promise.resolve()},
      on(t,f){(handlers[t]=handlers[t]||[]).push(f)},
      emit(t,d){if(left)return Promise.resolve();try{return Promise.resolve(gA.send({t,d})).then(()=>{},()=>{})}catch(e){return Promise.resolve()}},
      sendTo(peer,t,d){if(left)return Promise.resolve();try{return Promise.resolve(gA.send({t,d},{target:peer})).then(()=>{},()=>{})}catch(e){return Promise.resolve()}},
      onPeers(f){peerFns.push(f);setTimeout(()=>f({peers:list(),joined:[],left:[]}),0)},
      onConnection(f){connFns.push(f)},
      peerCount(){return remote.size},
      leave(){window.removeEventListener('pagehide',bye);left=true;clearInterval(hb);try{return Promise.resolve(tr.leave())}catch(e){return Promise.resolve()}}};
  }
  // an invite link opens the game with the code filled in: …/game/#join-abcde
  function linkCode(){const m=/^#join-([a-z0-9]{3,10})$/i.exec(location.hash||'');return m?m[1].toLowerCase():''}
  function inviteLink(code){return location.href.split('#')[0]+'#join-'+code}
  return {available,lobby,uid,name,setName,newCode,cleanCode,linkCode,inviteLink};
})();

</script>

    sc.forEach((s, i) => { if (best < 0) { best = i; return; } const b = sc[best]; if (s.total > b.total || (s.total === b.total && (s.evCount > b.evCount || (s.evCount === b.evCount && s.left > b.left)))) best = i; });
    over.winner = best;
    over.tie = sc.some((s, i) => i !== best && s.total === sc[best].total && s.evCount === sc[best].evCount && s.left === sc[best].left);
  }
  G.over = over; G.phase = 'over'; G.q = null; G.ag = [];
  lg('The game is over.');
}

<h3>How a turn goes</h3><p>On your turn do exactly <b>one</b> of these:</p><ul><li><b>Place a worker</b> on an open place and use it at once.</li><li><b>Play a card</b> from your hand or from the meadow by paying its price.</li><li><b>Prepare for the next season</b> (only when all your workers are out).</li></ul><p>When you cannot or do not want to do anything useful, <b>Pass</b>. You take no more turns, but your city still scores.</p>
<h3>Places for workers</h3><ul><li><b>Brown places</b> give resources, cards or a point token. Some are shared, others take one worker only.</li><li><b>Forest places</b> (green) are special and take one worker (two players can share in a four-player game).</li><li><b>The Barter Burrow</b> turns spare cards into resources: 1 resource for every 2 cards you discard.</li><li><b>The Long Road</b> opens in Autumn. Discard cards equal to the spot (5, 4, 3 or 2); the worker stays and scores that many points.</li><li><b>Destinations</b> are red cards in your city. A worker on one uses its power. A few are Open, so rivals may visit them too (the owner gets a point token).</li><li><b>Events</b> are claimed with a worker when your city meets their requirement. Each can be claimed only once.</li></ul>
<h3>Playing cards</h3><p>Pay the price in resources: twigs, resin, pebbles and berries. You can play from the eight-card meadow as well as from your hand. Your hand holds 8 cards at most. A <b>unique</b> card can be in your city once; a common card as often as you like.</p><p><b>Playing free:</b> each critter is paired with one building. If you own that building and it has no token, you can play the critter free and put a token on the building. Each building can do this once, ever.</p><p>Some cards (Lantern Rest, Pulley Lift, Thornhold Cells, Gavel Marten, Hostler Hedgehog) change the price. They are offered as extra buttons when you play a card.</p>
<h3>Card colours</h3><ul><li><b>Tan, Traveler:</b> acts once when played.</li><li><b>Green, Production:</b> acts when played and again every Spring and Autumn.</li><li><b>Red, Destination:</b> a place for your workers.</li><li><b>Blue, Governance:</b> a lasting bonus or discount.</li><li><b>Purple, Prosperity:</b> extra points at the end.</li></ul>
<h3>Seasons</h3><p>Everyone starts in Winter with 2 workers. Preparing for <b>Spring</b> gives +1 worker and runs your production. <b>Summer</b> gives +1 worker and lets you take 2 meadow cards. <b>Autumn</b> gives +2 workers and runs production again. Every player moves through the seasons at their own pace.</p>
<h3>Scoring</h3><p>Printed points on your cards, point tokens you hold, purple card bonuses, events and Long Road workers. Ties go to the player with more events, then more leftover resources.</p>
<h3>Solo play</h3><p>You play against Old Grimbeard. He takes places and cards by dice and a fixed routine. You win if you end with strictly more points than he does. Choose Grumpy, Gruff or Ghastly for the difficulty.</p>
<h3>Tips</h3><ul><li>Build production early; it pays every Spring and Autumn.</li><li>Keep cards in hand cheap to play. Watch the meadow too.</li><li>Press Hint any time to see a good move and the reason for it.</li></ul>`;
