<title>Rampart &amp; Vine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* ===== Rampart & Vine: late-afternoon Provence. The valley is the screen; the drawn tile sits at the bottom. ===== */
:root{color-scheme:light;--paper:#f6ead2;--paper2:#ead7b2;--ink:#2d2016;--terra:#b5532f;--gold:#e0a83a;--mut:#7a6048;--sc:.4;
  --ff-h:'Marcellus SC',Georgia,serif;--ff:'Alegreya Sans','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#b7a36e;color:var(--ink);font-family:var(--ff);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.ic{display:inline-flex;width:1.25em;height:1.25em;vertical-align:-.25em}.ic svg{width:100%;height:100%}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* ---- top strip: scores, tiles left, menu ---- */
#top{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:calc(5px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 5px calc(8px + env(safe-area-inset-left));background:linear-gradient(#6b4429,#4f311e);border-bottom:3px solid var(--gold);color:#fbecd2;min-height:46px}
#seats{display:flex;gap:6px;flex:1 1 auto;min-width:0;overflow:hidden}
.seat{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 5px;border-radius:999px;background:rgba(255,230,190,.12);border:2px solid transparent;min-width:0;white-space:nowrap;transition:background .2s,border-color .2s}
.seat.cur{background:rgba(255,230,190,.26);border-color:var(--c)}
.seat .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid #fff8e8;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.seat b{font-family:var(--ff);font-weight:800;font-size:1.2rem;line-height:1;min-width:1.4ch;text-align:right;display:inline-block}
.seat .nm{font-size:.78rem;opacity:.85;max-width:7ch;overflow:hidden;text-overflow:ellipsis}
.seat .fl{display:inline-flex;align-items:center;gap:1px;font-size:.8rem;opacity:.9}
.seat .fl .ic{width:1.05em;height:1.05em}
.seat.bump b{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.5);color:#ffd99a}}
#left{flex:0 0 auto;font-size:.9rem;display:flex;align-items:center;gap:3px;opacity:.95}
#menubtn,#bulbbtn{flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,220,160,.35);background:rgba(255,230,190,.1);color:#fbecd2;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}
/* ---- board ---- */
#main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#board{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 40%,#c9b682,#a8935c 80%)}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.tl{position:absolute;width:100px;height:100px;box-shadow:inset 0 0 0 calc(.7px/var(--sc)) rgba(70,45,20,.5);background:#a9b86a}
.tl svg{display:block;width:100px;height:100px}
.tl.drop{animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-34px) scale(1.35);opacity:0;filter:drop-shadow(0 18px 14px rgba(0,0,0,.4))}to{transform:none;opacity:1}}
.tl.last::after{content:'';position:absolute;inset:0;border:calc(3px/var(--sc)) solid var(--pc,#ffd24a);pointer-events:none}
.tl.lit::before{content:'';position:absolute;inset:0;z-index:2;background:rgba(255,226,120,.45);box-shadow:inset 0 0 0 calc(3px/var(--sc)) #ffd24a;animation:lit 1.5s ease-out forwards;pointer-events:none}
@keyframes lit{0%,60%{opacity:1}100%{opacity:0}}
.glow{position:absolute;width:100px;height:100px;border:0;background:none;padding:0;cursor:pointer;-webkit-appearance:none}
.glow svg{display:block;width:100px;height:100px;opacity:.5}
.glow::after{content:'';position:absolute;inset:calc(2px/var(--sc));border:calc(3px/var(--sc)) solid #ffd24a;border-radius:calc(5px/var(--sc));box-shadow:0 0 calc(10px/var(--sc)) #ffd24a;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.glow.hintspot::after{border-color:#fff;box-shadow:0 0 calc(14px/var(--sc)) #ffd24a,0 0 0 calc(3px/var(--sc)) #e0a83a}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ov>*{position:absolute;left:0;top:0;will-change:transform}
.mp{width:var(--ms,24px);height:var(--ms,24px);color:var(--c);filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 1.5px 1px rgba(0,0,0,.55));transition:opacity .45s;animation:mpin .35s ease-out}
@keyframes mpin{from{scale:1.8;opacity:0}}
.mp .ic{width:100%;height:100%}.mp.gone{opacity:0}
.fglow{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:3px solid #ffd24a;background:rgba(255,248,224,.82);color:var(--c);padding:7px;box-shadow:0 0 14px #ffd24a;animation:pulse 1.2s ease-in-out infinite}
.fglow.hintspot{border-color:#fff;box-shadow:0 0 16px #ffd24a,0 0 0 3px #e0a83a}
.fglow .ic{width:100%;height:100%;display:block}
.pop{font:800 1.45rem var(--ff-h);color:var(--c);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 7px #fff,0 1px 2px rgba(0,0,0,.4);white-space:nowrap;transition:transform .85s cubic-bezier(.5,0,.8,.4),opacity .85s;pointer-events:none}
#ghost{width:44px;height:44px;margin:0;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));animation:tapg 1.3s ease-in-out infinite;z-index:5}
@keyframes tapg{0%,100%{translate:6px 14px;scale:1}45%{translate:-6px 2px;scale:1.1}60%{translate:-6px 2px;scale:.9}}
#status{position:absolute;left:50%;top:7px;transform:translateX(-50%);max-width:calc(100% - 20px);padding:5px 14px;border-radius:999px;background:rgba(45,32,22,.84);color:#ffeccb;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:4}
#status.mine{background:#b5532f;color:#fff8ec;box-shadow:0 0 0 2px #ffd99a}
/* ---- the hand: the drawn tile, big, at the bottom (right edge in landscape) ---- */
#hand{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 12px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(#f6ead2,#ead7b2);border-top:3px solid var(--gold);min-height:96px}
#htile{position:relative;flex:0 0 auto;width:92px;height:92px;padding:0;border:3px solid var(--c,#8a5a33);border-radius:10px;background:#a9b86a;overflow:hidden;box-shadow:0 4px 10px rgba(60,35,10,.4)}
#htile .spin{width:100%;height:100%;transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
#htile.nospin .spin{transition:none}
#htile svg{display:block;width:100%;height:100%}
#htile.mine{animation:hpulse 1.6s ease-in-out infinite}
@keyframes hpulse{50%{box-shadow:0 4px 10px rgba(60,35,10,.4),0 0 0 5px rgba(224,168,58,.7)}}
#htile .rot{position:absolute;right:3px;bottom:3px;width:26px;height:26px;border-radius:50%;background:rgba(45,32,22,.8);color:#ffeccb;display:grid;place-items:center;font-size:17px;line-height:1}
#htile:disabled{opacity:.9;cursor:default}
#hskip{border:0;border-radius:999px;background:var(--terra);color:#fff8ec;font:700 1.15rem var(--ff);padding:13px 30px;box-shadow:0 3px 8px rgba(60,35,10,.35)}
#hskip.hintspot{box-shadow:0 0 0 4px #ffd24a,0 3px 8px rgba(60,35,10,.35)}
#hinfo{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--mut);font-weight:700;align-items:flex-start}
#hinfo .big{font:1.5rem var(--ff-h);color:var(--terra);line-height:1}
@media (max-height:620px) and (orientation:portrait){#htile{width:76px;height:76px}#hand{min-height:80px;padding-top:6px;padding-bottom:calc(7px + env(safe-area-inset-bottom))}}
@media (orientation:landscape) and (max-height:560px){
  #main{flex-direction:row}#hand{flex-direction:column;width:112px;min-height:0;padding:8px 8px;border-top:0;border-left:3px solid var(--gold);background:linear-gradient(90deg,#f6ead2,#ead7b2)}
  #htile{width:78px;height:78px}#hskip{padding:11px 18px}#top{min-height:42px}.seat b{font-size:1.1rem}}
/* ---- popups: menu, rules, start, result ---- */
.scrim{position:fixed;inset:0;background:rgba(30,18,8,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--paper);border:3px solid var(--gold);border-radius:18px;padding:16px 18px;max-width:380px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;text-align:center}
.card h1,.card h2{font-family:var(--ff-h);color:var(--terra);margin:0;letter-spacing:.02em}
.card h1{font-size:2rem}.card h2{font-size:1.5rem}
.card p{margin:0;line-height:1.35}
.btn{border:0;border-radius:14px;background:var(--terra);color:#fff8ec;font:700 1.15rem var(--ff);padding:14px 18px;box-shadow:0 3px 0 #7d3418}
.btn.alt{background:#fff8e8;color:var(--ink);border:2px solid var(--gold);box-shadow:none}
.btn.big{font-size:1.4rem;padding:18px}
.opts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.opt{border:2px solid var(--gold);background:#fff8e8;border-radius:999px;padding:6px 13px;font-weight:700;font-size:.95rem}
.opt[aria-pressed=true]{background:var(--gold);color:#3a2610}
.menu{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(52px + env(safe-area-inset-top));z-index:31;background:var(--paper);border:3px solid var(--gold);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:6px;display:flex;flex-direction:column;min-width:210px}
.menu button{border:0;background:none;text-align:left;padding:11px 12px;font-weight:700;font-size:1rem;border-radius:9px}
.menu button:active{background:var(--paper2)}
.menu{max-height:calc(100dvh - 60px);overflow:auto}
.menu .gxh-set{padding:4px 8px;margin:2px 0;font-weight:700;font-size:1rem}
.drawer ul{margin:0;padding-left:20px;text-align:left;line-height:1.4}
.drawer li{margin:5px 0}
.rescore{display:flex;gap:14px;justify-content:center;font:800 1.9rem var(--ff)}
.rescore span{display:flex;align-items:center;gap:6px}
.rescore i{width:20px;height:20px;border-radius:50%;background:var(--c);display:inline-block;border:2px solid #fff8e8}
.sub{color:var(--mut);font-size:.95rem}
.gxt-menu{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}.gxt-menu span{font:600 .8rem var(--ff);opacity:.85}.btn.gxt-menu.big{padding:14px 18px}.menu .gxt-menu{align-items:flex-start}
/* gx-help.css: coach bubbles, the lightbulb, the ghost finger and the rules cards (see gx-help.js and GX-KIT.md section 9).
   Everything the kit draws carries data-help. Override the look with the --gxh-* variables on :root. */
:root{--gxh-bg:#f3e6bf;--gxh-ink:#231a10;--gxh-accent:#c99a35;--gxh-glow:#ffe08a;--gxh-btn:#7a1f31;--gxh-btn-ink:#fff6dc;--gxh-z:80;--gxh-font:inherit}
.gxh-bub{position:fixed;left:0;top:0;z-index:var(--gxh-z);box-sizing:border-box;width:max-content;max-width:min(292px,calc(100vw - 16px));padding:8px 10px 8px 10px;border-radius:12px;background:var(--gxh-bg);color:var(--gxh-ink);border:2px solid var(--gxh-accent);box-shadow:0 8px 22px rgba(0,0,0,.55);font:600 14px/1.28 var(--gxh-font);text-align:left;visibility:hidden;animation:gxh-in .18s ease-out both}
.gxh-bub.on{visibility:visible}
.gxh-bub *{box-sizing:border-box}
.gxh-bub .gxh-tt{font-weight:800;font-size:14.5px;margin:0 0 2px}
.gxh-bub .gxh-tx{font-weight:600;font-size:13.5px}
.gxh-bub .gxh-bd{display:flex;gap:8px;align-items:flex-start}
.gxh-bub .gxh-sp{flex:0 0 36px;width:36px;height:36px}
.gxh-bub .gxh-sp svg{width:100%;height:100%}
.gxh-bub .gxh-row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;clear:both}
.gxh-bub .gxh-ok,.gxh-bub .gxh-link{font:800 13px/1 var(--gxh-font);min-height:32px;padding:0 12px;border-radius:16px;border:0;cursor:pointer}
.gxh-bub .gxh-ok{background:var(--gxh-btn);color:var(--gxh-btn-ink);margin-left:auto}
.gxh-bub .gxh-link{background:transparent;color:var(--gxh-btn);text-decoration:underline;padding:0;min-height:32px;display:inline-flex;align-items:center}
.gxh-arr{position:absolute;width:12px;height:12px;background:var(--gxh-bg);border:2px solid var(--gxh-accent);transform:rotate(45deg)}
.gxh-a-top .gxh-arr{top:-8px;border-right:0;border-bottom:0}
.gxh-a-bottom .gxh-arr{bottom:-8px;border-left:0;border-top:0}
.gxh-a-left .gxh-arr{left:-8px;border-top:0;border-right:0}
.gxh-a-right .gxh-arr{right:-8px;border-bottom:0;border-left:0}
.gxh-ring{position:fixed;left:0;top:0;z-index:calc(var(--gxh-z) - 1);pointer-events:none;border-radius:14px;border:3px solid var(--gxh-glow);box-shadow:0 0 0 3px rgba(255,224,138,.35),0 0 18px 4px var(--gxh-glow);animation:gxh-pulse 1.1s ease-in-out infinite}
.gxh-ring.round{border-radius:50%}
.gxh-ring.soft{border-width:2px;box-shadow:0 0 12px 2px var(--gxh-glow);opacity:.9}
.gxh-ring.from{border-style:dashed;animation:none;box-shadow:0 0 10px 1px var(--gxh-glow)}
.gxh-finger{position:fixed;left:0;top:0;z-index:calc(var(--gxh-z) + 1);pointer-events:none;width:0;height:0}
.gxh-finger i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.18) 66%,rgba(255,255,255,0) 74%);box-shadow:0 0 12px rgba(255,255,255,.6)}
.gxh-finger b{position:absolute;left:-3px;top:2px;width:10px;height:26px;border-radius:5px;background:#fff;opacity:.9;transform:rotate(-24deg);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gxh-bulb{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.gxh-bulb svg{width:24px;height:24px;display:block;fill:#ffd95a;stroke:#6b4a00;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,217,90,.7))}
.gxh-bulb.gxh-float{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:calc(var(--gxh-z) - 2);width:44px;height:44px;border-radius:50%;border:2px solid var(--gxh-accent);background:#2a1820}
.gxh-bulb.lit svg{filter:drop-shadow(0 0 8px #ffd95a)}
.gxh-rules{position:fixed;inset:0;z-index:calc(var(--gxh-z) + 10);display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(5,3,6,.72);overscroll-behavior:contain;touch-action:pan-y}
.gxh-rules .gxh-card{position:relative;box-sizing:border-box;width:min(360px,100%);max-height:calc(100% - 8px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px 14px 12px;border-radius:16px;background:var(--gxh-bg);color:var(--gxh-ink);border:3px solid var(--gxh-accent);box-shadow:0 18px 50px rgba(0,0,0,.7);font:600 15px/1.3 var(--gxh-font)}
.gxh-rules .gxh-x{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.08);color:var(--gxh-ink);font:700 22px/1 var(--gxh-font);cursor:pointer}
.gxh-rules .gxh-pic{display:flex;align-items:center;justify-content:center;min-height:120px;max-height:34dvh;padding:6px 0;background:rgba(0,0,0,.06);border-radius:12px;margin-top:22px}
.gxh-rules .gxh-pic svg{max-width:100%;max-height:30dvh;height:auto}
.gxh-rules .gxh-rt{font-weight:800;font-size:19px;line-height:1.15;padding-right:30px}
.gxh-rules .gxh-rx{font-weight:600;font-size:16px}
.gxh-rules .gxh-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.gxh-rules .gxh-nav button{min-height:44px;min-width:76px;padding:0 14px;border-radius:22px;border:2px solid var(--gxh-btn);background:transparent;color:var(--gxh-btn);font:800 15px/1 var(--gxh-font);cursor:pointer}
.gxh-rules .gxh-nav button.gxh-next{background:var(--gxh-btn);color:var(--gxh-btn-ink)}
.gxh-rules .gxh-nav button[disabled]{opacity:.3}
.gxh-rules .gxh-dots{display:flex;gap:6px}
.gxh-rules .gxh-dots i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.25)}
.gxh-rules .gxh-dots i.on{background:var(--gxh-btn)}
.gxh-pics{display:flex;align-items:flex-end;justify-content:center;gap:8px;flex-wrap:nowrap}
.gxh-pics figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.gxh-pics svg{width:64px;height:64px}
.gxh-pics figcaption{font:800 12px/1.1 var(--gxh-font);text-align:center;max-width:76px}
.gxh-pics .gxh-ar{font:800 24px/1 var(--gxh-font);align-self:center;color:var(--gxh-btn)}
.gxh-set{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0}
.gxh-set>span{flex:1 0 90px;font-weight:700}
.gxh-set button{min-height:38px;padding:0 12px;border-radius:19px;border:2px solid var(--gxh-accent);background:transparent;color:inherit;font:700 14px/1 var(--gxh-font);cursor:pointer}
.gxh-set button[aria-pressed=true]{background:var(--gxh-accent);color:#1b1208}
@keyframes gxh-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes gxh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.75}}
@media (prefers-reduced-motion:reduce){.gxh-bub,.gxh-ring{animation:none}}
@media (max-height:600px){.gxh-rules .gxh-pic{min-height:84px;margin-top:20px}.gxh-pics svg{width:50px;height:50px}.gxh-rules .gxh-card{gap:6px;padding:10px 12px}}
/* short phones (375x553 and landscape): a compact bubble, title and button on one line, no picture */
@media (max-height:620px){.gxh-bub{max-width:min(350px,calc(100vw - 12px));padding:6px 9px}.gxh-bub .gxh-sp{display:none}.gxh-bub .gxh-tt{padding-right:84px;min-height:24px;line-height:24px;margin:0}.gxh-bub .gxh-tx{font-size:13px;line-height:1.25}
.gxh-bub .gxh-row2{position:absolute;right:6px;top:4px;margin:0}.gxh-bub .gxh-ok{min-height:28px;padding:0 12px}.gxh-bub .gxh-bd>div{min-width:0}
.gxh-bub.gxh-bulbb .gxh-row2{position:static;margin-top:2px}}
/* gx-tutor.css: the staged tutorial (spotlight, bubble, progress dots, end card). Bubble styles come from gx-help.css (.gxh-bub); see GX-KIT.md section 10.
   Everything the kit draws carries data-help. Override with --gxt-* (and the --gxh-* variables of the help kit). */
:root{--gxt-z:90;--gxt-dim:rgba(8,4,10,.62)}
.gxt-cell{position:fixed;z-index:var(--gxt-z);background:var(--gxt-dim);touch-action:none;-webkit-tap-highlight-color:transparent;cursor:default}
.gxt-cell.gxt-clear{background:transparent}
.gxt-ring{position:fixed;left:0;top:0;z-index:calc(var(--gxt-z) + 1);pointer-events:none;border-radius:14px;border:3px solid var(--gxh-glow,#ffe08a);box-shadow:0 0 0 3px rgba(255,224,138,.35),0 0 18px 4px var(--gxh-glow,#ffe08a);animation:gxt-pulse 1.1s ease-in-out infinite}
.gxt-ring.soft{border-width:2px;box-shadow:0 0 12px 2px var(--gxh-glow,#ffe08a);opacity:.9;animation:none}

.gxc-pt{--gxc-pt:64px;--gxc-ptc:#6b4a2b;width:var(--gxc-pt);height:var(--gxc-pt);flex:0 0 var(--gxc-pt);border-radius:50%;overflow:hidden;display:grid;place-items:center;

  // ------------------------------------------------------------------ play a chapter
  GXC.play = function (id, opt) {

  // ------------------------------------------------------------------ stars and game over

<script>
// ---------- PerfHUD: one speed tool for every game on the shelf ----------
// 1. an optional overlay (FPS, frame time avg/p95, level, draws/triangles, heap, dpr, render size): menu "Show speed", ?fps=1 or F9
// 2. "Test speed": 2 s per graphics level with a slow camera orbit, then a result card with Apply and Copy report
// 3. the standard auto step-down: p95 > 50 ms for 3 s steps down a level, then the pixel ratio (floor 0.6);
//    10 s with p95 work < 14 ms steps back up, at most once a minute; a level picked by hand is never changed
// 4. the idle-frame saver: nothing animating and no input for 1.5 s -> PerfHUD.raf() runs at 10 fps (or only on demand)
// Plain script, no modules. Safe in jsdom and without WebGL or requestAnimationFrame: nothing runs and the overlay never shows.
(function(root){
  'use strict';
  const HAS_DOM=typeof window!=='undefined'&&typeof document!=='undefined';
  const UA=(typeof navigator!=='undefined'&&navigator.userAgent)||'';

  const RAF=HAS_DOM&&!JSDOM&&typeof window.requestAnimationFrame==='function'?window.requestAnimationFrame.bind(window):null;
  const LIVE=!!RAF;
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const NAMES={high:'High',medium:'Medium',med:'Medium',low:'Low'};
  const WIN=2000;                         // stats window (ms)
  const RULE={down:50,downFor:3000,up:14,upFor:10000,upEvery:60000,grace:2000,prStep:.8,prFloor:.6,idleAfter:1500};

  // registered game hooks
  const H={game:'',renderer:null,levels:['high','medium','low'],setLevel:null,getLevel:null,orbit:null,isAuto:null,isAnimating:null,
    onPixelRatio:null,beforeTest:null,anchor:null,corner:'bl',idleMode:'throttle',idleFps:10,autoTop:null,names:null};
  let registered=false;
  // measurement
  let S=[],lastT=0,workAcc=0,workSeen=0,drawn=0,loopOn=false,lastEval=0,lastHud=0;
  // controller
  const C={slowSince:0,fastSince:0,lastUp:-1e9,grace:0,prCap:null,log:[]};
  // idle saver
  let idleOn=false,lastInput=now(),lastIdleDraw=0,pollT=0;const pending=new Set();
  // test
  let testing=false,testT0=0,testLen=0,collect=null;
  // ui
  let hudOn=false,hud=null,card=null,pill=null;

  // ---------- stats ----------
  function pct(a,p){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);return b[Math.min(b.length-1,Math.floor(p*(b.length-1)+.5))]}
  function stats(list){const L=list||S;const n=L.length;if(!n)return {n:0,fps:0,avg:0,p95:0,work:0,refresh:16.7};
    const dts=L.map(s=>s.dt),span=Math.max(1,L[n-1].t-L[0].t+L[0].dt);const ws=L.filter(s=>s.w>=0).map(s=>s.w);
    return {n,fps:n*1000/span,avg:dts.reduce((a,b)=>a+b,0)/n,p95:pct(dts,.95),work:ws.length?pct(ws,.95):-1,refresh:Math.max(4,pct(dts,.1))}}
  function levelName(l){return (H.names&&H.names[l])||NAMES[l]||String(l)}
  function curLevel(){try{return H.getLevel?H.getLevel():null}catch(e){return null}}
  function auto(){try{return H.isAuto?!!H.isAuto():true}catch(e){return false}}
  function animating(){try{return H.isAnimating?!!H.isAnimating():true}catch(e){return true}}
  function pr(){try{return H.renderer?H.renderer.getPixelRatio():(HAS_DOM?window.devicePixelRatio||1:1)}catch(e){return 1}}

  // ---------- the measuring loop: one rAF callback per display frame while the game is awake ----------
  function startLoop(){if(!LIVE||loopOn)return;loopOn=true;lastT=0;RAF(tick)}
  function tick(t){
    if(idleOn&&!testing&&!hudOn){loopOn=false;lastT=0;return}
    RAF(tick);
    if(typeof document!=='undefined'&&document.hidden){lastT=0;S=[];return}
    if(lastT&&!idleOn){const dt=t-lastT;const w=workSeen?workAcc:-1;S.push({t,dt,w});if(collect)collect.push({t,dt,w})}
    lastT=t;workAcc=0;workSeen=0;
    while(S.length&&t-S[0].t>WIN)S.shift();
    if(testing&&H.orbit){try{H.orbit(Math.min(1,(now()-testT0)/testLen))}catch(e){}}
    if(t-lastEval>250){lastEval=t;control(t)}
    if(hudOn&&t-lastHud>500){lastHud=t;drawHud()}

  }

  // ---------- auto step-down / step-up ----------
  function note(s){C.log.push(Math.round(now())+' '+s);if(C.log.length>20)C.log.shift()}

  function applyPR(){if(!H.renderer)return;try{const base=H.basePR?H.basePR():pr();const v=C.prCap==null?base:Math.min(base,C.prCap);
      if(H.onPixelRatio)H.onPixelRatio(v);else H.renderer.setPixelRatio(v)}catch(e){}}
  function control(t){
    const T=now();
    if(!H.setLevel||!H.getLevel){return}
    if(!auto()){if(C.prCap!=null){C.prCap=null;applyPR()}C.slowSince=C.fastSince=0;return}
    if(testing||idleOn||T<C.grace||(typeof document!=='undefined'&&document.hidden)){C.slowSince=C.fastSince=0;return}
    const st=stats();if(st.n<4&&!(st.n>=1&&st.avg>RULE.down*4))return; // very slow frames (>200 ms, e.g. 3 s in SwiftShader) leave fewer than 4 in the 2 s window: they still count as slow
    if(st.p95>RULE.down){C.fastSince=0;if(!C.slowSince)C.slowSince=T;else if(T-C.slowSince>=RULE.downFor)stepDown(st);return}
    C.slowSince=0;

    // (a 60 Hz display never shows intervals under 16.7 ms, so without work numbers "every frame on time" stands in for it)
    const onTime=st.p95<=Math.max(RULE.up,st.refresh*1.3+1);const fast=onTime&&(st.work>=0?st.work<RULE.up:true);
    if(fast){if(!C.fastSince)C.fastSince=T;else if(T-C.fastSince>=RULE.upFor&&T-C.lastUp>=RULE.upEvery)stepUp(st)}else C.fastSince=0}
  function stepDown(st){const L=H.levels,i=L.indexOf(curLevel());C.slowSince=0;
    if(i>=0&&i<L.length-1){note('down '+L[i]+'->'+L[i+1]+' p95 '+st.p95.toFixed(0));set(L[i+1],'auto');hitch();return}
    if(!H.renderer)return;const cur=C.prCap==null?pr():C.prCap;if(cur<=RULE.prFloor+1e-3)return;
    C.prCap=Math.max(RULE.prFloor,Math.round(cur*RULE.prStep*100)/100);note('pixel ratio '+C.prCap);applyPR();hitch()}
  function stepUp(st){const L=H.levels,i=L.indexOf(curLevel());C.fastSince=0;const T=now();
    if(C.prCap!=null){const base=H.basePR?H.basePR():C.prCap/RULE.prStep;const v=Math.round(C.prCap/RULE.prStep*100)/100;C.prCap=v>=base-1e-3?null:v;note('pixel ratio up '+(C.prCap||'full'));applyPR();C.lastUp=T;hitch();return}
    const top=H.autoTop!=null?Math.max(0,L.indexOf(typeof H.autoTop==='function'?H.autoTop():H.autoTop)):0;
    if(i>top){note('up '+L[i]+'->'+L[i-1]+' work '+st.work.toFixed(1));set(L[i-1],'auto');C.lastUp=T;hitch()}}
  function set(l,why){try{H.setLevel(l,why)}catch(e){}}
  // the resolution cap the controller wants; games pass their own pixel ratio through this in their resize code
  function pixelRatio(want){return C.prCap==null?want:Math.min(want,C.prCap)}

  // ---------- idle-frame saver ----------
  function raf(fn){if(!RAF)return 0;
    const run=ts=>{const t0=now();if(idleOn)lastIdleDraw=t0;try{fn(ts)}finally{workAcc+=now()-t0;workSeen++;drawn++}};
    if(idleOn&&!testing){if(H.idleMode==='demand'){pending.add({fn:run,to:0});return -1}
      const e={fn:run,to:0};e.to=setTimeout(()=>{pending.delete(e);RAF(run)},Math.max(0,lastIdleDraw+1000/H.idleFps-now()));pending.add(e);return -1}
    return RAF(run)}
  function idle(on){on=!!on&&LIVE;if(on===idleOn)return;idleOn=on;
    if(on){note('idle');if(!pollT)pollT=setInterval(()=>{if(testing||animating())idle(false)},250);if(hudOn)drawHud()}
    else{if(pollT){clearInterval(pollT);pollT=0}for(const e of pending){clearTimeout(e.to);RAF(e.fn)}pending.clear();lastT=0;hitch(400);startLoop()}}
  function wake(){lastInput=now();if(idleOn)idle(false)}

  // ---------- overlay ----------
  const CSS='#perfhud{position:fixed;z-index:2147483000;pointer-events:none;left:8px;top:8px;margin:0;padding:4px 7px;border-radius:7px;background:rgba(8,12,16,.62);color:#dff3e4;'+
    'font:600 11px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;opacity:.72;contain:content;text-shadow:0 1px 0 #000;user-select:none}'+
    '#perfhud b{color:#fff}#perfhud .w{color:#ffcf6e}#perfhud .bad{color:#ff8f7e}'+
    '.phud-card{position:fixed;z-index:2147483001;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box;padding:14px 16px;border-radius:12px;'+
    'background:#12181e;color:#e9eef2;border:1px solid #3a4652;box-shadow:0 12px 40px rgba(0,0,0,.55);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}'+
    '.phud-card h3{margin:0 0 8px;font-size:16px}.phud-card table{width:100%;border-collapse:collapse;margin:4px 0 10px;font-variant-numeric:tabular-nums}'+
    '.phud-card td,.phud-card th{padding:3px 4px;text-align:right;border-bottom:1px solid #26303a}.phud-card td:first-child,.phud-card th:first-child{text-align:left}'+
    '.phud-card tr.phud-rec td{color:#9ff0b0;font-weight:700}.phud-card .phud-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}'+
    '.phud-card button{font:inherit;min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid #4a5866;background:#223040;color:#fff;cursor:pointer}.phud-card button.phud-pri{background:#2f7a4a;border-color:#3c9a5e}'+
    '.phud-card textarea{width:100%;box-sizing:border-box;height:90px;margin-top:8px;font:11px/1.3 ui-monospace,monospace;background:#0b1015;color:#cfe;border:1px solid #334}.phud-card small{color:#9aa8b4}'+
    '.phud-pill{position:fixed;z-index:2147483001;left:50%;top:12px;transform:translateX(-50%);pointer-events:none;padding:6px 12px;border-radius:999px;background:rgba(8,12,16,.8);color:#fff;font:600 13px/1.2 system-ui,sans-serif}';
  function css(){if(!HAS_DOM||document.getElementById('perfhud-css'))return;const s=document.createElement('style');s.id='perfhud-css';s.textContent=CSS;(document.head||document.documentElement).appendChild(s)}
  function anchorRect(){let el=H.anchor;try{if(typeof el==='function')el=el();if(typeof el==='string')el=document.querySelector(el)}catch(e){el=null}

const FIGN={f:'follower',big:'champion',bld:'mason',pig:'hog'};
const ROLE={C:'follower',R:'follower',M:'follower',F:'farmer'};
const FEAT={C:'town',R:'road',M:'priory',F:'field'};
const SETN={base:'Base game',river:'The Riverlands',ic:'Taverns & Basilicas',tb:'Merchants & Masons'};
const GOODS=['wine','grain','cloth'];
// ---------- setup ----------
function newGame(o){o=o||{};const seed=DEFSEED!=null?DEFSEED:Math.floor(Math.random()*2**31);const ex=Object.assign({river:false,ic:false,tb:false},o.ex||{});
  let np=o.np||(o.seats?o.seats.length:2);if(np>5&&!ex.ic)np=5;
  G={v:1,rng:seed,seed,np,ex,turn:0,pl:[],log:[],logN:0,over:null,winner:null,winText:'',tiles:{},order:[],frontier:{},sk:[],sl:[],par:[],fd:{},figs:[],
    stack:[],rstack:[],lake:null,disc:[],rv:null,cur:null,step:null,total:0,halfway:false,stats:{placed:0,discards:0,bonus:0,scored:{}},story:[]};
  for(let i=0;i<np;i++){const seat=o.seats?o.seats[i]:(o.mode==='hot'||(o.mode!=='ai'&&i===0))?'human':'ai';
    G.pl.push({i,nm:(o.names&&o.names[i])||PNAMES[i],human:seat==='human',lv:(o.lv&&o.lv[i])||'normal',score:0,
      sup:{f:7,big:ex.ic?1:0,bld:ex.tb?1:0,pig:ex.tb?1:0},goods:{wine:0,grain:0,cloth:0},sc:{road:0,town:0,priory:0,field:0,goods:0},end:{road:0,town:0,priory:0,field:0,goods:0}})}
  G.figTotal=G.pl.map(p=>Object.assign({},p.sup));
  const main=[];let start=-1,spring=-1,lake=-1;const river=[];
  TT.forEach((d,t)=>{if(d.set==='base'||(d.set==='ic'&&ex.ic)||(d.set==='tb'&&ex.tb)){for(let c=0;c<d.c;c++){if(d.start&&!ex.river&&start<0){start=t;continue}main.push(t)}}
    if(d.set==='river'&&ex.river){if(d.spring)spring=t;else if(d.lake)lake=t;else for(let c=0;c<d.c;c++)river.push(t)}});
  G.stack=shuffle(main);G.total=main.length+(ex.river?river.length+2:1);
  if(o.stack){G.stack=o.stack.slice();G.total=o.stack.length+1}   // the staged tutorial: a fixed tile order
  if(ex.river){G.rstack=shuffle(river);G.lake=lake;place(spring,0,0,0);G.rv={x:0,y:0,d:1,lt:0};lg('The river rises at its spring. River tiles come first; each must carry the river on, and it may not turn the same way twice in a row.','big')}
  else place(start,0,0,0);
  G.cur={p:G.np-1};lg(`A new valley waits for ${np} settlers${exList()}.`,'big');nextPlayer(true);if(typeof refresh==='function')refresh()}
function exList(){const l=Object.keys(G.ex).filter(k=>G.ex[k]).map(k=>SETN[k]);return l.length?' with '+l.join(', '):''}
// ---------- union-find over segments ----------
function find(a){let r=a;while(G.par[r]!==r)r=G.par[r];while(G.par[a]!==r){const n=G.par[a];G.par[a]=r;a=n}return r}
function segWorld(t,r,i){const s=TSEG[t][i];return s.e?s.e.map(e=>(e+r)%4):null}
function initFd(t,r,i,x,y){const s=TSEG[t][i],k=key(x,y);
  if(s.ty==='C'){const g={wine:0,grain:0,cloth:0};if(s.g)g[s.g]++;return {ty:'C',tiles:[k],oe:segWorld(t,r,i).map(e=>k+','+e),pen:s.p,gd:g,cat:s.cat,done:0}}
  if(s.ty==='R')return {ty:'R',tiles:[k],oe:segWorld(t,r,i).map(e=>k+','+e),inn:s.inn,done:0};
  if(s.ty==='F')return {ty:'F',tiles:[k],ct:[]};
  return {ty:'M',x,y,done:0}}
function merge(a,b){const ra=find(a),rb=find(b);if(ra===rb)return ra;const A=G.fd[ra],B=G.fd[rb];
  for(const k of B.tiles)if(!A.tiles.includes(k))A.tiles.push(k);
  if(A.ty==='C'){A.oe=A.oe.concat(B.oe);A.pen+=B.pen;for(const g of GOODS)A.gd[g]+=B.gd[g];A.cat=A.cat||B.cat}
  else if(A.ty==='R'){A.oe=A.oe.concat(B.oe);A.inn=A.inn||B.inn}
  else if(A.ty==='F')A.ct=A.ct.concat(B.ct);
  delete G.fd[rb];G.par[rb]=ra;return ra}
function place(t,r,x,y){const k=key(x,y),s0=G.sk.length;G.tiles[k]={t,r,s0,n:G.order.length};G.order.push(k);delete G.frontier[k];
  TSEG[t].forEach((s,i)=>{G.sk.push(k);G.sl.push(i);G.par.push(s0+i);G.fd[s0+i]=initFd(t,r,i,x,y)});
  TSEG[t].forEach((s,i)=>{if(s.ty==='F')for(const c of s.ac)G.fd[s0+i].ct.push(s0+c)});
  for(let s=0;s<4;s++){const nk=key(x+DX[s],y+DY[s]),N=G.tiles[nk];if(!N){if(!G.frontier[nk])G.frontier[nk]=1;continue}
    const ty=edgeT(t,r,s);
    if(ty==='C'||ty==='R'){const a=s0+SIDESEG[t][(s-r+4)%4],b=N.s0+SIDESEG[N.t][(OPP(s)-N.r+4)%4];const root=merge(a,b);const e1=k+','+s,e2=nk+','+OPP(s);G.fd[root].oe=G.fd[root].oe.filter(e=>e!==e1&&e!==e2)}
    for(const [hh,nh] of [[2*s,2*OPP(s)+1],[2*s+1,2*OPP(s)]]){const a=HALFSEG[t][(hh-2*r+8)%8],b=HALFSEG[N.t][(nh-2*N.r+8)%8];if(a>=0&&b>=0)merge(s0+a,N.s0+b)}}
  G.stats.placed++}
// ---------- placement rules ----------
function canPlace(t,r,x,y){const k=key(x,y);if(G.tiles[k])return false;let nb=0;
  for(let s=0;s<4;s++){const N=G.tiles[key(x+DX[s],y+DY[s])];if(!N)continue;nb++;if(edgeT(t,r,s)!==edgeT(N.t,N.r,OPP(s)))return false}
  if(!nb)return false;
  if(isRiver(t)){const rv=G.rv;if(!rv)return false;if(x!==rv.x+DX[rv.d]||y!==rv.y+DY[rv.d])return false;const ws=TT[t].V[0].map(e=>(e+r)%4);if(!ws.includes(OPP(rv.d)))return false;
    if(ws.length===2){const nd=ws.find(e=>e!==OPP(rv.d));const turn=(nd-rv.d+4)%4;if(turn===2)return false;const lt=turn===1?1:turn===3?-1:0;if(lt&&lt===rv.lt)return false}}
  return true}
function riverTurn(t,r){const rv=G.rv;const ws=TT[t].V[0].map(e=>(e+r)%4);if(ws.length<2)return {nd:null,lt:0};const nd=ws.find(e=>e!==OPP(rv.d));const turn=(nd-rv.d+4)%4;return {nd,lt:turn===1?1:turn===3?-1:0}}
function legalPlacements(t){const o=[];const sym=symRots(t);for(const k in G.frontier){const [x,y]=unkey(k);for(const r of sym)if(canPlace(t,r,x,y))o.push({x,y,r})}return o}
// rotations that give a different tile (a straight road looks the same turned twice); all four for river tiles (the U-turn rule cares)
const SYMR=TT.map((d,t)=>{const seen=new Set(),o=[];for(let r=0;r<4;r++){const sig=JSON.stringify(TSEG[t].map(s=>s.e?s.e.map(e=>(e+r)%4).sort():s.h?s.h.map(h=>(h+2*r)%8).sort():'M'))+JSON.stringify([0,1,2,3].map(s=>edgeT(t,r,s)));if(d.V.length||!seen.has(sig)){seen.add(sig);o.push(r)}}return o});
function symRots(t){return SYMR[t]}
// ---------- turns ----------
function drawNext(){if(G.rstack.length)return G.rstack.shift();if(G.lake!=null){const t=G.lake;G.lake=null;return t}if(G.stack.length)return G.stack.shift();return null}
function tilesLeft(){return G.stack.length+G.rstack.length+(G.lake!=null?1:0)}
function nextPlayer(first){const p=first?0:(G.cur.p+1)%G.np;startTurn(p,false)}
function startTurn(p,bonus){if(G.over)return;let t;
  while(true){t=drawNext();if(t==null){finish();return}
    if(legalPlacements(t).length)break;
    if(isRiver(t)&&G.rstack.length&&G.rstack.some(x=>x!==t)){G.rstack.push(t);lg(`The river tile “${TT[t].n}” fits nowhere yet; it goes back under the river pile.`);continue}
    G.disc.push(t);G.stats.discards++;lg(`No legal place for “${TT[t].n}”: it is set aside and a new tile is drawn.`,'bad');fx('discard')}
  G.turn++;G.cur={p,t,bonus:!!bonus,k:null,bonusEarned:false,figPlaced:null,scored:[]};G.step='place';
  if(!G.halfway&&tilesLeft()<=Math.floor(G.total/2)){G.halfway=true;storyBeat('half')}
  lg(`— ${P(p).nm}${bonus?' (mason’s extra turn)':''} draws “${TT[t].n}” —`,'turn');fx('turn',p)}
function doPlace(m){const c=G.cur,p=P(c.p),t=c.t;const wasRv=isRiver(t)&&G.rv?riverTurn(t,m.r):null;
  place(t,m.r,m.x,m.y);c.k=key(m.x,m.y);G.step='fig';
  if(wasRv){if(TT[t].V[0].length===1)G.rv=null;else G.rv={x:m.x,y:m.y,d:wasRv.nd,lt:wasRv.lt||G.rv.lt}}
  if(TT[t].lake){lg('The river reaches its pond. Now the ordinary tiles begin.','big')}
  lg(`${p.nm} places “${TT[t].n}”.`);fx('place',c.k);
  // mason: does this tile extend the road/town that holds my mason?
  if(G.ex.tb&&!c.bonus){const b=G.figs.find(f=>f.p===c.p&&f.k==='bld');if(b){const T=G.tiles[c.k];const br=find(b.s);if(TSEG[t].some((s,i)=>(s.ty==='C'||s.ty==='R')&&find(T.s0+i)===br)){c.bonusEarned=true;lg(`🔨 ${p.nm}’s mason works on: an extra turn after this one.`,'good')}}}
  if(!figMoves(c.p).some(x=>x.act==='fig')){finishTurn()}}
function figMoves(pi){const c=G.cur,p=P(pi),T=G.tiles[c.k],o=[{act:'skip'}];if(!T)return o;
  TSEG[T.t].forEach((s,i)=>{const root=find(T.s0+i),fs=figsIn(root);
    if(!fs.length){if(p.sup.f>0)o.push({act:'fig',k:'f',l:i});if(p.sup.big>0)o.push({act:'fig',k:'big',l:i})}
    const mine=fs.some(f=>f.p===pi&&(f.k==='f'||f.k==='big'));
    if(mine&&(s.ty==='C'||s.ty==='R')&&p.sup.bld>0)o.push({act:'fig',k:'bld',l:i});
    if(mine&&s.ty==='F'&&p.sup.pig>0)o.push({act:'fig',k:'pig',l:i})});
  return o}
function figsIn(root){return G.figs.filter(f=>find(f.s)===root)}
function doFig(m){const c=G.cur,p=P(c.p),T=G.tiles[c.k];const s=TSEG[T.t][m.l];p.sup[m.k]--;G.figs.push({p:c.p,k:m.k,s:T.s0+m.l});c.figPlaced={k:m.k,l:m.l};
  lg(`${p.nm} sets a ${m.k==='f'?ROLE[s.ty]:FIGN[m.k]+(m.k==='big'?' ('+ROLE[s.ty]+')':'')} on the ${FEAT[s.ty]}.`);fx('fig',c.k);finishTurn()}
function finishTurn(){const c=G.cur;scoreAfter();G.step=null;
  if(c.bonusEarned&&tilesLeft()>0){G.stats.bonus++;startTurn(c.p,true);return}
  nextPlayer(false)}
// ---------- scoring ----------
function nbrCount(x,y){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(G.tiles[key(x+dx,y+dy)])n++;return n}
function strength(fs){const s={};for(const f of fs){const v=f.k==='f'?1:f.k==='big'?2:0;if(v)s[f.p]=(s[f.p]||0)+v}return s}
function majority(fs){const s=strength(fs);const top=Math.max(0,...Object.values(s));return top>0?Object.keys(s).filter(k=>s[k]===top).map(Number):[]}
function featPoints(F,complete){if(F.ty==='C'){const n=F.tiles.length;if(complete)return F.cat?3*(n+F.pen):2*(n+F.pen);return F.cat?0:n+F.pen}
  if(F.ty==='R'){const n=F.tiles.length;if(complete)return F.inn?2*n:n;return F.inn?0:n}
  if(F.ty==='M')return complete?9:nbrCount(F.x,F.y);return 0}
function scoreAfter(){const c=G.cur,T=G.tiles[c.k];const [x,y]=unkey(c.k);const roots=new Set();
  TSEG[T.t].forEach((s,i)=>{if(s.ty==='C'||s.ty==='R')roots.add(find(T.s0+i))});
  for(const r of roots){const F=G.fd[r];if(!F.done&&F.oe.length===0)complete(r)}
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const N=G.tiles[key(x+dx,y+dy)];if(!N||!TT[N.t].mon)continue;const mi=TSEG[N.t].findIndex(s=>s.ty==='M');const r=find(N.s0+mi);if(!G.fd[r].done&&nbrCount(x+dx,y+dy)===9)complete(r)}}
function complete(r){const F=G.fd[r];F.done=1;const fs=figsIn(r),win=majority(fs),pts=featPoints(F,true);const c=G.cur;
  const cat=F.ty==='C'?'town':F.ty==='R'?'road':'priory';G.stats.scored[cat+(F.cat?'+basilica':F.inn?'+tavern':'')]=(G.stats.scored[cat+(F.cat?'+basilica':F.inn?'+tavern':'')]||0)+1;
  const what=F.ty==='C'?`town of ${F.tiles.length} tile${F.tiles.length>1?'s':''}${F.pen?` and ${F.pen} banner${F.pen>1?'s':''}`:''}${F.cat?' with a basilica':''}`:F.ty==='R'?`road of ${F.tiles.length} tile${F.tiles.length>1?'s':''}${F.inn?' with a tavern':''}`:'priory';
  for(const w of win){P(w).score+=pts;P(w).sc[cat==='priory'?'priory':cat]+=pts}
  if(win.length){lg(`✔ The ${what} is finished: ${win.map(w=>P(w).nm).join(' and ')} score${win.length>1?'':'s'} ${pts}.`,'good');fx('score',{r,pts,win,by:c.p,fs:fs.map(f=>[f.p,f.k])})}
  else if(F.ty!=='M')lg(`The ${what} is finished, but nobody stands in it.`);
  if(F.ty==='C'&&win.length&&pts>=16)storyBeat('bigtown',{win,pts});
  // merchants: whoever closes a town takes its goods
  if(F.ty==='C'&&G.ex.tb){const got=GOODS.filter(g=>F.gd[g]);if(got.length){const p=P(c.p);for(const g of GOODS)p.goods[g]+=F.gd[g];lg(`🧺 ${p.nm} closed it and takes ${got.map(g=>F.gd[g]+' '+g).join(', ')}.`,'good');fx('goods',c.p)}}
  // everyone standing in it goes home (masons too)
  for(const f of fs){P(f.p).sup[f.k]++;G.figs.splice(G.figs.indexOf(f),1)}
  if(fs.length)fx('home',r);c.scored.push({r,pts,win,ty:F.ty})}
function storyBeat(kind,d){let t='';
  if(kind==='half')t='Half the tiles are down. Smoke rises from new hearths, and the valley is starting to look like a country.';
  if(kind==='bigtown')t=`The walls of the great town close: ${d.win.map(w=>P(w).nm).join(' and ')}’s followers claim ${d.pts} points.`;
  G.story.push({t,n:G.turn});lg('📜 '+t,'story');fx('story',t)}
// ---------- final scoring ----------
function fieldCities(F){const s=new Set();for(const c of F.ct){const r=find(c);if(G.fd[r].done)s.add(r)}return s}
function finalScores(){// returns {per player breakdown} without changing G
  const add={};for(const p of G.pl)add[p.i]={road:0,town:0,priory:0,field:0,goods:0};const det=[];
  for(const r in G.fd){const F=G.fd[r];const root=+r;if(F.done)continue;const fs=figsIn(root);if(!fs.length)continue;const win=majority(fs);if(!win.length)continue;
    if(F.ty==='F'){const n=fieldCities(F).size;if(!n)continue;for(const w of win){const pig=fs.some(f=>f.p===w&&f.k==='pig');add[w].field+=n*(pig?4:3)}det.push({ty:'F',r:root,n,win});continue}
    const pts=featPoints(F,false);const cat=F.ty==='C'?'town':F.ty==='R'?'road':'priory';for(const w of win)add[w][cat]+=pts;det.push({ty:F.ty,r:root,pts,win})}
  if(G.ex.tb)for(const g of GOODS){const top=Math.max(...G.pl.map(p=>p.goods[g]));if(top>0)for(const p of G.pl)if(p.goods[g]===top)add[p.i].goods+=10}
  return {add,det}}
function finish(){if(G.over)return;G.step=null;const {add,det}=finalScores();
  for(const d of det){if(d.ty==='F'){if(!d.n)continue;G.stats.scored['field']=(G.stats.scored['field']||0)+1;if(G.figs.some(f=>f.k==='pig'&&find(f.s)===d.r&&d.win.includes(f.p)))G.stats.scored['field+hog']=(G.stats.scored['field+hog']||0)+1}
    else{const F=G.fd[d.r];const k='end-'+(d.ty==='C'?'town':d.ty==='R'?'road':'priory');G.stats.scored[k]=(G.stats.scored[k]||0)+1;if(F.cat||F.inn)G.stats.scored[k+'-zero']=(G.stats.scored[k+'-zero']||0)+1}}
  if(G.ex.tb&&G.pl.some(p=>GOODS.some(g=>p.goods[g])))G.stats.scored['goods-majority']=1;
  for(const p of G.pl){const a=add[p.i];p.end=a;for(const k in a)p.score+=a[k]}
  lg('The last tile is down. Unfinished roads, towns and priories score, then the farmers are counted.','big');
  for(const p of G.pl){const a=p.end;const bits=Object.entries(a).filter(([k,v])=>v).map(([k,v])=>`${k} ${v}`);lg(`${p.nm}: ${bits.length?bits.join(', '):'nothing more'} → ${p.score}.`)}

  G.over={win:w.map(p=>p.i),scores:G.pl.map(p=>p.score)};G.winner=w.map(p=>p.nm).join(' & ');G.winText=`${G.winner} ${w.length>1?'share the valley':'wins'} with ${top} points.`;lg('🏆 '+G.winText,'big');fx('win')}
// ---------- probe: what a placement would do, without changing anything (for the computer, previews and tests) ----------
function probe(t,r,x,y){const k=key(x,y),segs=TSEG[t],n=segs.length;const par=[];const node={};let nn=n;for(let i=0;i<n;i++)par.push(i);
  const nodeOf=root=>{if(node[root]==null){node[root]=nn++;par.push(node[root])}return node[root]};
  const f=a=>{while(par[a]!==a)a=par[a]=par[par[a]];return a};const link=(a,b)=>{a=f(a);b=f(b);if(a!==b)par[b]=a};const cut=new Set();
  for(let s=0;s<4;s++){const nk=key(x+DX[s],y+DY[s]),N=G.tiles[nk];if(!N)continue;const ty=edgeT(t,r,s);
    if(ty==='C'||ty==='R'){const a=SIDESEG[t][(s-r+4)%4],b=find(N.s0+SIDESEG[N.t][(OPP(s)-N.r+4)%4]);link(a,nodeOf(b));cut.add(k+','+s);cut.add(nk+','+OPP(s))}
    for(const [hh,nh] of [[2*s,2*OPP(s)+1],[2*s+1,2*OPP(s)]]){const a=HALFSEG[t][(hh-2*r+8)%8],b=HALFSEG[N.t][(nh-2*N.r+8)%8];if(a>=0&&b>=0)link(a,nodeOf(find(N.s0+b)))}}
  const roots=Object.keys(node).map(Number);const grp={};
  const gOf=i=>{const g=f(i);if(!grp[g])grp[g]={id:g,segs:[],roots:[],ty:null};return grp[g]};
  for(let i=0;i<n;i++){const g=gOf(i);g.segs.push(i);g.ty=segs[i].ty}
  for(const rt of roots){const g=gOf(node[rt]);g.roots.push(rt)}
  const nb=nbrCount(x,y)+1;const out=[];
  for(const id in grp){const g=grp[id];if(!g.segs.length)continue;const ty=g.ty;
    if(ty==='C'||ty==='R'){const tiles=new Set([k]);let oe=[],pen=0,inn=0,cat=0;const gd={wine:0,grain:0,cloth:0};
      for(const rt of g.roots){const F=G.fd[rt];for(const q of F.tiles)tiles.add(q);oe=oe.concat(F.oe);if(ty==='C'){pen+=F.pen;cat=cat||F.cat;for(const q of GOODS)gd[q]+=F.gd[q]}else inn=inn||F.inn}
      for(const i of g.segs){const s=segs[i];for(const e of s.e)oe.push(k+','+((e+r)%4));if(ty==='C'){pen+=s.p;cat=cat||s.cat;if(s.g)gd[s.g]++}else inn=inn||s.inn}
      oe=oe.filter(e=>!cut.has(e));g.tiles=tiles.size;g.oe=oe;g.pen=pen;g.cat=cat;g.inn=inn;g.gd=gd;g.done=oe.length===0}
    else if(ty==='F'){const cs=new Set();for(const rt of g.roots)for(const c of G.fd[rt].ct)cs.add(find(c));g.cityRoots=[...cs];g.localCities=[];for(const i of g.segs)for(const c of segs[i].ac)g.localCities.push(c)}
    else{g.nb=nb;g.done=nb===9}
    g.figs=[];for(const rt of g.roots)for(const q of figsIn(rt))g.figs.push(q);out.push(g)}
  const segGroup=[];for(let i=0;i<n;i++){const g=f(i);segGroup[i]=out.findIndex(q=>q.id===g)}
  // neighbouring priories this tile would complete
  const mons=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const N=G.tiles[key(x+dx,y+dy)];if(!N||!TT[N.t].mon)continue;const mi=TSEG[N.t].findIndex(s=>s.ty==='M');const rt=find(N.s0+mi);if(!G.fd[rt].done&&nbrCount(x+dx,y+dy)===8)mons.push(rt)}
  return {groups:out,segGroup,mons}}
// ---------- the move list ----------
function sideToAct(){if(!G||G.over||!G.cur)return -1;return G.cur.p}
function validMoves(s){if(!G||G.over)return[];if(s===undefined)s=sideToAct();if(s!==sideToAct()||s<0)return[];
  if(G.step==='place')return legalPlacements(G.cur.t).map(q=>({act:'place',x:q.x,y:q.y,r:q.r}));
  if(G.step==='fig')return figMoves(s);return[]}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function isLegal(m,s){if(m.act==='place')return G.step==='place'&&TT[G.cur.t]&&symRots(G.cur.t).includes(m.r)&&canPlace(G.cur.t,m.r,m.x,m.y);return validMoves(s).some(x=>same(x,m))}
function performMove(m,s){if(s===undefined)s=sideToAct();if(!G||G.over||s!==sideToAct()||!m||!isLegal(m,s))return {success:false,error:'illegal move '+JSON.stringify(m)};
  const before=G.cur;
  switch(m.act){case 'place':doPlace(m);break;case 'fig':doFig(m);break;case 'skip':finishTurn();break}
  if(typeof onMoveDone==='function')onMoveDone(m,s,before);
  if(typeof refresh==='function'&&!UI.sim)refresh();return {success:true}}
// ---------- invariants and test hooks ----------
function checkInvariants(){const v=[];if(!G)return v;
  // every tile counted exactly once
  const inHand=G.cur&&G.step==='place'?1:0;const n=G.stack.length+G.rstack.length+(G.lake!=null?1:0)+G.order.length+G.disc.length+inHand;if(n!==G.total)v.push(`tiles ${n} != ${G.total}`);
  // every figure counted exactly once
  for(const p of G.pl)for(const k in G.figTotal[p.i]){const on=G.figs.filter(f=>f.p===p.i&&f.k===k).length;if(p.sup[k]+on!==G.figTotal[p.i][k])v.push(`${p.nm} ${k}: ${p.sup[k]}+${on}`);if(p.sup[k]<0)v.push('negative supply')}
  for(const f of G.figs){const r=find(f.s),F=G.fd[r];if(!F)v.push('figure on a dead root');else{if(F.done)v.push(`figure left in a finished ${F.ty}`);
    if(f.k==='bld'&&!figsIn(r).some(q=>q.p===f.p&&(q.k==='f'||q.k==='big')))v.push('mason without its owner');if(f.k==='pig'&&!figsIn(r).some(q=>q.p===f.p&&(q.k==='f'||q.k==='big')))v.push('hog without its farmer');
    if((f.k==='bld'&&F.ty!=='C'&&F.ty!=='R')||(f.k==='pig'&&F.ty!=='F'))v.push('special figure on the wrong feature')}}
  for(const k of G.order){const T=G.tiles[k],[x,y]=unkey(k);for(let s=0;s<4;s++){const N=G.tiles[key(x+DX[s],y+DY[s])];if(N&&edgeT(T.t,T.r,s)!==edgeT(N.t,N.r,OPP(s)))v.push('edge mismatch at '+k)}}
  for(const r in G.fd){const F=G.fd[r];if(G.par[r]!=+r)v.push('fd on non-root');if(F.oe)for(const e of F.oe){const [x,y,s]=e.split(',').map(Number);if(G.tiles[key(x+DX[s],y+DY[s])])v.push('open edge faces a tile '+e)}if((F.ty==='C'||F.ty==='R')&&!F.oe.length&&!F.done&&!(G.step==='fig'&&F.tiles.includes(G.cur.k)))v.push('closed but unscored '+F.ty)}
  for(const p of G.pl){const s=Object.values(p.sc).reduce((a,b)=>a+b,0)+Object.values(p.end).reduce((a,b)=>a+b,0);if(s!==p.score)v.push(`${p.nm} score ${p.score} != parts ${s}`)}
  if(G.ex.tb){const held=G.pl.reduce((a,p)=>a+GOODS.reduce((b,g)=>b+p.goods[g],0),0);let inDone=0;for(const r in G.fd){const F=G.fd[r];if(F.ty==='C'&&F.done)inDone+=GOODS.reduce((b,g)=>b+F.gd[g],0)}if(held!==inDone)v.push(`goods ${held} != ${inDone} in closed towns`)}
  if(!G.over&&sideToAct()<0)v.push('stuck');if(!G.over&&!validMoves().length)v.push('no legal move in '+G.step);return v}
// rebuild the whole feature graph from the placed tiles and compare (slow; used by the tests)
function rebuildCheck(){const save=G;const v=[];const H=JSON.parse(JSON.stringify(G));G=Object.assign({},H,{tiles:{},order:[],frontier:{},sk:[],sl:[],par:[],fd:{},stats:{placed:0,scored:{}}});
  for(const k of save.order){const T=save.tiles[k];const [x,y]=unkey(k);place(T.t,T.r,x,y)}
  const sig=g=>{const o=[];for(const r in g.fd){const F=g.fd[r];if(F.ty==='M')continue;const members=[];for(let i=0;i<g.par.length;i++){let a=i;while(g.par[a]!==a)a=g.par[a];if(a===+r)members.push(i)}o.push(F.ty+':'+members.sort((a,b)=>a-b).join('.')+':'+(F.tiles||[]).length+':'+(F.oe?F.oe.slice().sort().join('|'):'')+':'+(F.pen||0)+':'+(F.ct?[...new Set(F.ct)].length:0))}return o.sort().join('\n')};
  const a=sig(G),b=sig(save);G=save;if(a!==b)v.push('rebuilt graph differs');return v}
function render_game_to_text(){if(!G)return '{}';return JSON.stringify({turn:G.turn,step:G.step,cur:G.cur&&{p:G.cur.p,tile:TT[G.cur.t]&&TT[G.cur.t].n,bonus:G.cur.bonus},tilesLeft:tilesLeft(),placed:G.order.length,
  pl:G.pl.map(p=>({nm:p.nm,score:p.score,sup:p.sup,goods:p.goods})),figs:G.figs.map(f=>({p:f.p,k:f.k,on:FEAT[G.fd[find(f.s)].ty]})),log:G.log.slice(0,5).map(l=>l.t),over:G.over&&G.winText})}

<script>
// ---------- computer players ----------
// easy: random legal placement with a bias toward points; normal: greedy value of placement + follower incl. completion odds;
// hard: adds field/majority weighting and a one-ply look at the tiles still in the bag (can each open side still be filled?).
let AIPLAN=null;var HARDK={a:2,b:4,f:0,top:3,types:6,w:.6,cap:36};
const LVL={easy:{opp:.3,slots:false},normal:{opp:.8,slots:false},hard:{opp:.9,slots:true}};
function lvOf(s){return LVL[P(s).lv]?P(s).lv:'normal'}
// ---- what is still in the bag (public: anyone can count the tiles) ----
let FITC={key:'',m:{}};
function poolCounts(){const c={};for(const t of G.stack)c[t]=(c[t]||0)+1;for(const t of G.rstack)c[t]=(c[t]||0)+1;if(G.lake!=null)c[G.lake]=(c[G.lake]||0)+1;return c}
function fitCount(cx,cy,virt){const ck=G.turn+':'+tilesLeft();if(FITC.key!==ck){FITC={key:ck,m:{},pool:poolCounts()}}
  const need=[];for(let s=0;s<4;s++){const nx=cx+DX[s],ny=cy+DY[s];if(virt&&virt.x===nx&&virt.y===ny)need.push(edgeT(virt.t,virt.r,OPP(s)));else{const N=G.tiles[key(nx,ny)];need.push(N?edgeT(N.t,N.r,OPP(s)):'-')}}
  const sig=need.join('');if(FITC.m[sig]!=null)return FITC.m[sig];let n=0;
  for(const t in FITC.pool){const tt=+t;if(isRiver(tt))continue;for(let r=0;r<4;r++){let ok=true;for(let s=0;s<4;s++)if(need[s]!=='-'&&edgeT(tt,r,s)!==need[s]){ok=false;break}if(ok){n+=FITC.pool[t];break}}}
  return FITC.m[sig]=n}
// chance that a road/town with these open edges gets finished
function pDone(oe,lv,virt){if(!oe.length)return 1;const left=tilesLeft();if(left<=0)return 0;const cells=[...new Set(oe.map(e=>{const [x,y,s]=e.split(',').map(Number);return key(x+DX[s],y+DY[s])}))];
  const m=cells.length;const base=Math.max(.03,Math.pow(.78,m)*Math.min(1,left/(4*m+2)));
  if(LVL[lv].slots){// one-ply look at the bag: can each open side still be filled by some tile that is left?
    let q=1;for(const c of cells){const [x,y]=unkey(c);const f=fitCount(x,y,virt);if(!f)return 0.02;q*=Math.min(1,.55+f/left*3)}return base*q}
  return base}
// summary of a feature for valuing: from a board root or a probe group
function descRoot(r,lv){const F=G.fd[r];if(F.ty==='C'||F.ty==='R')return {ty:F.ty,tiles:F.tiles.length,oe:F.oe,pen:F.pen||0,cat:F.cat,inn:F.inn,done:F.done,p:F.done?1:pDone(F.oe,lv)};
  if(F.ty==='M'){const nb=nbrCount(F.x,F.y);return {ty:'M',nb,done:F.done}}
  const cs=[];const seen=new Set();for(const c of F.ct){const q=find(c);if(seen.has(q))continue;seen.add(q);const C=G.fd[q];cs.push(C.done?1:pDone(C.oe,lv))}return {ty:'F',cities:cs}}
function descGroup(g,pr,lv,virt){if(g.ty==='C'||g.ty==='R')return {ty:g.ty,tiles:g.tiles,oe:g.oe,pen:g.pen||0,cat:g.cat,inn:g.inn,done:g.done,p:g.done?1:pDone(g.oe,lv,virt)};
  if(g.ty==='M')return {ty:'M',nb:g.nb,done:g.done};
  // field: its towns after this placement (a town joined by this tile is looked up in its new group)
  const rootToG={};pr.groups.forEach((q,j)=>{if(q.ty==='C')for(const r of q.roots)rootToG[r]=j});const seen=new Set();const cs=[];
  const addG=j=>{if(seen.has('g'+j))return;seen.add('g'+j);const q=pr.groups[j];cs.push(q.done?1:pDone(q.oe,lv,virt))};
  for(const r of g.cityRoots){if(rootToG[r]!=null)addG(rootToG[r]);else if(!seen.has(r)){seen.add(r);const C=G.fd[r];cs.push(C.done?1:pDone(C.oe,lv))}}
  for(const c of g.localCities)addG(pr.segGroup[c]);return {ty:'F',cities:cs}}
// expected final points of a feature for whoever holds the majority there
function worth(d,lv){const left=tilesLeft(),prog=1-left/Math.max(1,G.total);
  if(d.ty==='C'){const n=d.tiles,pen=d.pen,m=d.oe.length;if(d.done)return (d.cat?3:2)*(n+pen);return d.p*((d.cat?3:2)*(n+pen+m*.6))+(1-d.p)*(d.cat?0:n+pen)}
  if(d.ty==='R'){const n=d.tiles;if(d.done)return d.inn?2*n:n;return d.p*(d.inn?2:1)*(n+.8)+(1-d.p)*(d.inn?0:n)}
  if(d.ty==='M'){if(d.done)return 9;return d.nb+(9-d.nb)*Math.min(.9,left/(G.np*6))}
  let v=0;for(const p of d.cities)v+=p>=1?3:(lv==='hard'?3*p:1.2)*(lv==='hard'?1:.8+prog*.4);return v}
function shares(figs,extra){const s=strength(figs);if(extra){for(const k in extra)s[k]=(s[k]||0)+extra[k]}const top=Math.max(0,...Object.values(s));const o={};if(top>0)for(const k in s)if(s[k]===top)o[k]=1;return o}
function valueMap(d,figs,lv,extra){const sh=shares(figs,extra);const w=worth(d,lv);const o={};for(const k in sh)o[k]=w;return o}
// value of one candidate placement for seat s (without the follower)
function placeValue(pr,s,lv,virt){const dl={};for(const p of G.pl)dl[p.i]=0;const why=[];
  pr.groups.forEach(g=>{if(g.ty==='F'&&lv==='easy')return;const after=valueMap(descGroup(g,pr,lv,virt),g.figs,lv);let before={};
    for(const r of g.roots){const b=valueMap(descRoot(r,lv),figsIn(r),lv);for(const k in b)before[k]=(before[k]||0)+b[k]}
    for(const p of G.pl){const d=(after[p.i]||0)-(before[p.i]||0);dl[p.i]+=d}
    if(g.done&&g.figs.length){const mine=g.figs.filter(f=>f.p===s).length;dl[s]+=mine*1.2;const win=Object.keys(shares(g.figs));why.push({k:'close',ty:g.ty,pts:worth(descGroup(g,pr,lv,virt),lv),win:win.map(Number),mine})}
    else if(!g.done&&g.roots.length&&(after[s]||0)-(before[s]||0)>.4)why.push({k:'grow',ty:g.ty,g});
    else if(g.roots.length&&G.pl.some(p=>p.i!==s&&(after[p.i]||0)-(before[p.i]||0)<-.8))why.push({k:'hurt',ty:g.ty,who:G.pl.filter(p=>p.i!==s&&(after[p.i]||0)-(before[p.i]||0)<-.8).map(p=>p.i)})});
  for(const r of pr.mons){const F=G.fd[r];const fs=figsIn(r);const sh=shares(fs);for(const k in sh)dl[k]+=9-nbrCount(F.x,F.y)-0;if(sh[s])why.push({k:'priory'})}
  const o=LVL[lv].opp;let worst=0;for(const p of G.pl)if(p.i!==s){const lead=p.score>=Math.max(...G.pl.map(q=>q.score))&&lv==='hard'?1.2:1;worst=Math.max(worst,dl[p.i]*lead)}
  return {v:dl[s]-o*worst,why,dl}}
// value of putting a figure on group/root desc d (already holding figs)
function figValue(k,d,figs,s,lv){const p=P(s),left=tilesLeft(),prog=1-left/Math.max(1,G.total);
  if(k==='f'||k==='big'){const w=k==='big'?2:1;const mine=valueMap(d,figs,lv,{[s]:w})[s]||0;if(d.done)return mine+.5;
    let cost=.9+(p.sup.f<=1?3:p.sup.f<=3?1.2:0);
    if(lv==='hard'&&d.ty!=='F'){const fv=(HARDK.a+HARDK.b*(1-prog))*(p.sup.f<=2?1.6:1);const pc=d.ty==='M'?Math.min(.9,left/(G.np*6)):d.p;cost=.3+(1-pc)*fv}
    if(d.ty==='F')cost=2+7*(1-prog)+(lv==='hard'?HARDK.f:0);if(k==='big')cost+=1.5+(1-prog)*2;
    if(d.ty==='R'&&d.oe&&d.oe.length&&d.p<.2)cost+=2;return mine-cost}
  if(k==='bld'){if(d.done||left<G.np*2)return -1;return (d.p<.05?.5:3.2)*Math.min(1,left/20)+.3}
  if(k==='pig'){const sh=shares(figs);if(!sh[s])return -1;return d.cities.reduce((a,q)=>a+(q>=1?1:q*.6),0)-.3}
  return 0}
function figOptionsFromProbe(pr,s){const p=P(s),o=[];pr.groups.forEach(g=>{const i=g.segs[0];
    if(!g.figs.length){if(p.sup.f>0)o.push({k:'f',l:i,g});if(p.sup.big>0)o.push({k:'big',l:i,g})}
    const mine=g.figs.some(f=>f.p===s&&(f.k==='f'||f.k==='big'));if(mine&&(g.ty==='C'||g.ty==='R')&&p.sup.bld>0)o.push({k:'bld',l:i,g});if(mine&&g.ty==='F'&&p.sup.pig>0)o.push({k:'pig',l:i,g})});return o}
// the full plan: best placement + follower
function aiPlan(s,lvIn){const lv=lvIn||lvOf(s),t=G.cur.t,places=legalPlacements(t);let best=null;const all=[];
  for(const q of places){const virt={x:q.x,y:q.y,t,r:q.r};const pr=probe(t,q.r,q.x,q.y);const pv=placeValue(pr,s,lv,virt);
    let bonus=0;if(G.ex.tb&&!G.cur.bonus){const b=G.figs.find(f=>f.p===s&&f.k==='bld');if(b){const br=find(b.s);if(pr.groups.some(g=>(g.ty==='C'||g.ty==='R')&&g.roots.includes(br)))bonus=G.stack.length>1?4:0}}
    let bf=null,bfv=0;for(const op of figOptionsFromProbe(pr,s)){const d=descGroup(op.g,pr,lv,virt);const v=figValue(op.k,d,op.g.figs,s,lv);if(v>bfv){bfv=v;bf=op}}
    const tot=pv.v+bonus+bfv;const c={q,v:tot,pv,bf,bfv,bonus,pr};all.push(c);if(!best||tot>best.v)best=c}
  if(lv==='hard'&&all.length>1&&tilesLeft()>1)best=lookAhead(s,all)||best;
  if(lv==='easy'&&all.length){// mostly random, nudged toward points
    const r=rnd(100);if(r<45){all.sort((a,b)=>b.pv.dl[s]-a.pv.dl[s]);best=all[rnd(Math.min(3,all.length))]}else best=all[rnd(all.length)];
    if(best.bf&&rnd(100)<40)best.bf=null;if(!best.bf&&rnd(100)<35){const ops=figOptionsFromProbe(best.pr,s).filter(o=>o.k==='f');if(ops.length)best.bf=ops[rnd(ops.length)]}}
  const place={act:'place',x:best.q.x,y:best.q.y,r:best.q.r};const fig=best.bf?{act:'fig',k:best.bf.k,l:best.bf.l}:{act:'skip'};
  return {place,fig,why:best.pv.why,bonus:best.bonus,figOpt:best.bf,v:best.v,pr:best.pr}}
// hard: one ply ahead. For the best few plans, play them on a copy of the state and ask what the next rival could
// gain with any tile still in the bag (weighted by how many are left; the hidden order of the bag is never used).
function lookAhead(s,all){all.sort((a,b)=>b.v-a.v);const top=all.slice(0,HARDK.top);const pool=poolCounts();
  const types=Object.keys(pool).map(Number).filter(t=>!isRiver(t)).sort((a,b)=>pool[b]-pool[a]).slice(0,HARDK.types);if(!types.length)return null;
  const snap=JSON.stringify(G),sim=UI.sim;UI.sim=1;let best=null;
  try{for(const c of top){G=JSON.parse(snap);FITC.key='';const m=c.q;doPlace({act:'place',x:m.x,y:m.y,r:m.r});
      if(G.step==='fig'&&G.cur.p===s){if(c.bf)doFig({act:'fig',k:c.bf.k,l:c.bf.l});else finishTurn()}
      c.threat=0;if(!G.over&&G.cur.p!==s){const o=G.cur.p;let E=0,W=0;for(const t of types){const L=legalPlacements(t);let bv=0;const step=Math.max(1,Math.floor(L.length/HARDK.cap));
          for(let i=0;i<L.length;i+=step){const q=L[i];const pv=placeValue(probe(t,q.r,q.x,q.y),o,'normal',{x:q.x,y:q.y,t,r:q.r});const v=pv.dl[o]-pv.dl[s];if(v>bv)bv=v}E+=pool[t]*bv;W+=pool[t]}c.threat=W?E/W:0}
      c.v2=c.v-HARDK.w*c.threat;if(!best||c.v2>best.v2)best=c}}
  finally{G=JSON.parse(snap);UI.sim=sim;FITC.key=''}
  return best}
function aiMove(s){if(s==null)s=sideToAct();if(s<0)return null;
  if(G.step==='place'){const plan=aiPlan(s);AIPLAN={turn:G.turn,p:s,bonus:G.cur.bonus,plan};return plan.place}
  if(G.step==='fig'){if(AIPLAN&&AIPLAN.turn===G.turn&&AIPLAN.p===s&&isLegal(AIPLAN.plan.fig,s))return AIPLAN.plan.fig;return bestFigNow(s)}
  return null}
// follower choice on an already placed tile (used when no plan exists, e.g. a human asks the advisor after placing)
function bestFigNow(s,lvIn){const lv=lvIn||lvOf(s);const T=G.tiles[G.cur.k];let best={act:'skip'},bv=0;
  for(const m of figMoves(s)){if(m.act!=='fig')continue;const r=find(T.s0+m.l);const v=figValue(m.k,descRoot(r,lv),figsIn(r),s,lv);if(v>bv){bv=v;best=m}}return best}
// ---------- the advisor: the normal computer's choice, in plain words ----------
function adviceText(plan,s){const bits=[];const nm=i=>P(i).nm;
  for(const w of plan.why){if(w.k==='close'){const others=w.win.filter(i=>i!==s);bits.push(`closes the ${FEAT[w.ty]} for ${Math.round(w.pts)} points${w.win.includes(s)?'':' (for '+others.map(nm).join(' & ')+')'}${w.mine?` and frees your follower${w.mine>1?'s':''}`:''}`)}
    else if(w.k==='grow'){const g=w.g;bits.push(`grows the ${FEAT[w.ty]} you already hold${g.tiles?` to ${g.tiles} tiles`:''}${g.oe&&g.oe.length?` (${g.oe.length} open side${g.oe.length>1?'s':''} left)`:''}`)}
    else if(w.k==='hurt')bits.push(`makes ${w.who.map(nm).join(' & ')}’s ${FEAT[w.ty]} harder to finish`);
    else if(w.k==='priory')bits.push('surrounds your priory for 9 points')}
  if(plan.bonus)bits.push('your mason earns an extra turn');
  const f=plan.figOpt;if(f){const g=f.g;const role=f.k==='f'?ROLE[g.ty]:FIGN[f.k];
    if(f.k==='bld')bits.push(`puts your mason on the ${FEAT[g.ty]}: each later tile that extends it gives you an extra turn`);
    else if(f.k==='pig')bits.push('puts your hog with your farmer: +1 per finished town at the end');
    else{const d=descGroup(g,plan.pr,'normal');const w=Math.round(worth(d,'normal'));
      bits.push(g.done?`scores at once with a ${role} (${w} points) and gets it back`:g.ty==='F'?`sends a farmer into the field (it pays 3 per finished town beside it at the end)`:`sets a ${role} on the ${FEAT[g.ty]} (about ${w} points once it is finished)`)}}
  if(!bits.length)bits.push('a quiet spot that gives nothing away');const t=bits.join('; ');return t.charAt(0).toUpperCase()+t.slice(1)+'.'}

 {phase:'place',title:'Match the edges',text:'Lay the tile so touching edges match: road to road, town to town, field to field.',pic:()=>hpics([['road','Road'],['road','Road'],'>',['town','Town'],['townT','Town']])},

];
// ---------------------------------------------------------------- the advice: the normal computer's own pick
const HLPS={key:'',plan:null};
function hlpPlan(){if(!G||G.over||!G.cur||UI.sim||!myTurn())return null;const s=G.cur.p;
  if(G.step==='place'){const k=G.turn+':'+G.order.length+':'+G.cur.t;if(HLPS.key!==k){HLPS.key=k;HLPS.plan=null;try{HLPS.plan=aiPlan(s,'normal')}catch(e){}}
    const pl=HLPS.plan;if(!pl||!isLegal(pl.place,s))return null;return {kind:'place',move:pl.place,why:hlpWhyPlace(pl,s)}}
  if(G.step==='fig'){let m=null;try{m=bestFigNow(s,'normal')}catch(e){}if(!m||!isLegal(m,s))return null;return {kind:'fig',move:m,why:hlpWhyFig(m,s)}}
  return null}
function hlpWhyPlace(pl,s){for(const w of pl.why||[]){
    if(w.k==='close'&&w.win.includes(s))return `Finishes your ${FEAT[w.ty]}: +${Math.round(w.pts)} points.`;
    if(w.k==='grow')return `Grows the ${FEAT[w.ty]} you already hold.`;
    if(w.k==='hurt')return `Makes a rival’s ${FEAT[w.ty]} harder to finish.`;
    if(w.k==='priory')return 'Surrounds your priory: +9 points.'}
  if(pl.bonus)return 'Your mason earns an extra turn here.';

  return 'The safest spot: it keeps your options open.'}

  if(m.k==='big')return `Your champion counts as two on this ${FEAT[ty]}.`;
  return ty==='F'?'Send a farmer into this field. It pays at the end.':ty==='M'?'Put a follower on this priory.':`Claim this ${FEAT[ty]} with a follower.`}

function hlpTurnTo(r){UI.deg+=((r-UI.rot+4)%4||4)*90;UI.rot=r;renderGlows();updateGhost();placeOverlay();const b=$('#htile');if(b)b.querySelector('.spin').style.transform=`rotate(${UI.deg}deg)`}

<script>
// ---------- sound: recorded samples (gameaudio.js + audio-data.js, see ../ASSETS.md) with the synthesized Web Audio sounds below as the fallback ----------
// One line per event: s = sample name in GA_DATA (null = use the synth), vol = sample gain (1 = as normalised; 1.4 is about +3 dB).
// To swap or mute one sound later, change only its line here.
const SND_MAP={
  click:{s:'click',vol:.5},  place:{s:'place',vol:1.4}, fig:{s:'fig',vol:1.4},   home:{s:'home',vol:1.3},
  score:{s:'score',vol:.7},  goods:{s:'goods',vol:.9},  turn:{s:'turn',vol:.35}, story:{s:'story',vol:.7},
  win:{s:'win',vol:.9},      bad:{s:'bad',vol:.6},  myturn:{s:'turn',vol:1}  // myturn: online only, when a decision becomes yours
};
const MUSIC_MAP={main:'main-a'};           // null = the synthesized ambience
const SND={ctx:null,on:true,music:true,pitch:1,vol:.7,last:{},nb:null,beat:0,mTimer:null};
try{SND.on=localStorage.getItem('rv_snd')!=='0';SND.music=localStorage.getItem('rv_mus')!=='0'}catch(e){}
// GA decodes the samples on the first user gesture; until then (or with no Web Audio, as in jsdom) GA.has() is false and the synth plays
const GAOK=typeof GA!=='undefined'&&typeof GA_DATA!=='undefined';
if(GAOK){GA.init({sfx:GA_DATA.sfx,music:GA_DATA.music,key:'rv',musVol:.45});GA.setSfx(SND.on);GA.setMusic(SND.music)}
function gaMusic(){return GAOK&&MUSIC_MAP.main&&GA.names().indexOf(MUSIC_MAP.main)>=0&&(GA.state().failed||[]).indexOf(typeof MUS!=='undefined'&&MUS.want||MUSIC_MAP.main)<0}
function audioInit(){if(SND.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{const c=SND.ctx=new AC();const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(c.destination);
    SND.master=c.createGain();SND.master.gain.value=SND.on?SND.vol:0;SND.master.connect(comp);
    SND.fxBus=c.createGain();SND.fxBus.connect(SND.master);SND.musBus=c.createGain();SND.musBus.gain.value=.3;SND.musBus.connect(SND.master);
    const len=c.sampleRate*1.5,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;SND.nb=b;
    if(SND.music)musicStart();return true}catch(e){SND.ctx=null;return false}}
document.addEventListener('pointerdown',()=>{if(audioInit()&&SND.ctx.state==='suspended')SND.ctx.resume()},{capture:true});
document.addEventListener('keydown',()=>{if(audioInit()&&SND.ctx.state==='suspended')SND.ctx.resume()},{capture:true});
function env(g,t,a,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
function tone(f,dur,o){o=o||{};const c=SND.ctx,t=c.currentTime+(o.at||0);const osc=c.createOscillator(),g=c.createGain();osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);if(o.det)osc.detune.value=o.det;
  let last=osc;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;last.connect(fl);last=fl}
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.vibAmt||f*.06;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+.05)}
  last.connect(g);g.connect(o.bus||SND.fxBus);env(g,t,o.a||.008,o.v||.3,dur);osc.start(t);osc.stop(t+dur+.05)}
function noise(dur,o){o=o||{};const c=SND.ctx,t=c.currentTime+(o.at||0);const s=c.createBufferSource();s.buffer=SND.nb;s.playbackRate.value=o.rate||1;
  const fl=c.createBiquadFilter();fl.type=o.ft||'bandpass';fl.frequency.setValueAtTime(o.f||2000,t);if(o.fto)fl.frequency.exponentialRampToValueAtTime(o.fto,t+dur);fl.Q.value=o.q||1;
  const g=c.createGain();s.connect(fl);fl.connect(g);g.connect(o.bus||SND.fxBus);env(g,t,o.a||.004,o.v||.3,dur);s.start(t,Math.random());s.stop(t+dur+.05)}

<script>
