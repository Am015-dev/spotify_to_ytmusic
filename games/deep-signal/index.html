<title>Deep Signal</title>
<meta name="description" content="A co-operative trick-taking dive: win the right cards for the right crew mate, mission by mission.">
<style>
/* ===== Board-first shell (shared by every game on the shelf) =====
   The page never scrolls. The board fills what the bar and the dock leave; the dock is in flow (never over the board);
   everything else opens in a closable popup (drawer). Games theme it with the --gx-* variables. */
:root{--gx-bar-h:52px;--gx-dock-w:clamp(300px,30vw,420px);--gx-bg:#10151c;--gx-bar:#0b1016;--gx-panel:#f4ecd8;--gx-ink:#231a10;--gx-line:rgba(0,0,0,.25);--gx-accent:#e0a948;--gx-shadow:0 20px 60px rgba(0,0,0,.5);--gx-radius:14px}
html.gx,html.gx body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
.gx-app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--gx-bg)}
.gx-bar{min-height:var(--gx-bar-h);display:flex;align-items:center;gap:6px;padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px));overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;z-index:6}
.gx-bar::-webkit-scrollbar{display:none}
.gx-bar .gx-sp{flex:1 0 8px}
.gx-main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--gx-dock-w);position:relative}
.gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr) 0}
.gx-board{position:relative;min-width:0;min-height:0;overflow:hidden}
.gx-dock{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.gx-dock-head{display:flex;align-items:center;gap:6px;padding:6px 8px 4px;flex:0 0 auto}
.gx-dock-head .gx-dt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-dock-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gx-app.gx-dock-min .gx-dock{visibility:hidden}

.gx-ibtn{appearance:none;border:1px solid var(--gx-line);background:rgba(255,255,255,.08);color:inherit;border-radius:10px;min-width:44px;min-height:44px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;justify-content:center;cursor:pointer;font:inherit;white-space:nowrap}
.gx-ibtn:focus-visible,.gx-drawer button:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
.gx-ibtn .gx-n{font-size:.72rem;opacity:.8}
.gx-ibtn.gx-reopen{position:absolute;right:10px;top:10px;z-index:5;display:none}
.gx-app.gx-dock-min .gx-ibtn.gx-reopen{display:inline-flex}
/* popups */
.gx-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.gx-scrim.on{opacity:1;pointer-events:auto}
.gx-drawer{position:fixed;z-index:41;top:calc(var(--gx-bar-h) + 8px + env(safe-area-inset-top,0px));right:8px;bottom:8px;width:min(520px,calc(100vw - 16px));display:flex;flex-direction:column;background:var(--gx-panel);color:var(--gx-ink);border-radius:var(--gx-radius);box-shadow:var(--gx-shadow);padding:31px;transform:translateX(calc(100% + 16px));transition:transform .22s ease;visibility:hidden}
.gx-drawer.on{transform:none;visibility:visible}
.gx-drawer.wide{width:min(980px,calc(100vw - 16px))}
.gx-drawer-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--gx-line);flex:0 0 auto}
.gx-drawer-head h2{margin:0;font-size:1.15rem;flex:1;min-width:0}
.gx-x{appearance:none;border:0;background:transparent;font-size:1.6rem;line-height:1;cursor:pointer;color:inherit;min-width:40px;min-height:40px;border-radius:10px}
.gx-drawer-body{flex:1;min-height:0;overflow:auto;padding:10px 12px 16px;overscroll-behavior:contain}
/* narrow screens: the dock becomes a sheet under the board (still in flow), the drawers slide up from the bottom */
@media (max-width:999px){
  .gx-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .gx-app.gx-dock-min .gx-main{grid-template-columns:minmax(0,1fr)}
  .gx-dock{max-height:var(--gx-sheet-h,46dvh);border-radius:var(--gx-radius) var(--gx-radius) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .gx-app.gx-sheet-full .gx-dock{max-height:78dvh}
  .gx-app.gx-dock-min .gx-dock{visibility:visible;max-height:none}
  .gx-app.gx-dock-min .gx-dock-body{display:none}
  .gx-reopen{display:none!important}
  .gx-grab{display:block;width:44px;height:5px;border-radius:3px;background:currentColor;opacity:.35;margin:0 auto}
  .gx-drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88dvh;height:88dvh;border-radius:var(--gx-radius) var(--gx-radius) 0 0;transform:translateY(100%);padding-bottom:calc(31px + env(safe-area-inset-bottom,0px))}
  .gx-drawer.wide{width:auto}
  .gx-hide-narrow{display:none!important}
}
@media (min-width:1000px){.gx-grab{display:none}}
@media (prefers-reduced-motion:reduce){.gx-drawer,.gx-scrim{transition:none}}

/* ===== GX kit styles (load after shell.css). Themed by the shell's --gx-* variables. ===== */
:root{--gx-text:1;--gx-anim:1;--gx-chip:rgba(0,0,0,.07);--gx-chip-on:var(--gx-accent)}
/* text size: games opt in by using these classes, the kit's own panels always follow it */
.gx-drawer-body,.gx-dock-body,.gx-recap,.gx-tx{font-size:calc(1em * var(--gx-text,1))}
/* settings */
.gx-set-nav{position:sticky;top:-10px;z-index:2;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0;margin:-10px 0 4px;background:var(--gx-panel)}
.gx-set-nav::-webkit-scrollbar{display:none}
.gx-sec{padding:4px 0 12px;border-bottom:1px solid var(--gx-line);scroll-margin-top:56px}
.gx-sec:last-child{border-bottom:0}
.gx-sec h3{margin:8px 0 6px;font-size:1.02em;letter-spacing:.02em}
.gx-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 0}
.gx-row-l{flex:1 1 9em;min-width:0;font-weight:600}
.gx-row-l small{display:block;font-weight:400;opacity:.75;font-size:max(13px,.82em)}
.gx-row-k{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gx-seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.gx-sb,.gx-tg,.gx-chip{appearance:none;font:inherit;color:inherit;min-height:44px;min-width:44px;padding:4px 12px;border-radius:10px;border:1px solid var(--gx-line);background:var(--gx-chip);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;white-space:nowrap}
.gx-sb[aria-pressed=true],.gx-tg[aria-checked=true],.gx-chip[aria-pressed=true]{background:var(--gx-chip-on);border-color:transparent;color:#1d140b;font-weight:700}
.gx-sb:disabled{opacity:.4;cursor:default}
.gx-tg{min-width:64px}
.gx-chip{min-height:36px;padding:2px 11px;border-radius:99px;font-size:max(13px,.88em)}
.gx-sb:focus-visible,.gx-tg:focus-visible,.gx-chip:focus-visible,.gx-ref-it:focus-visible,.gx-ref-q:focus-visible,.gx-recap button:focus-visible,.gx-sl input:focus-visible{outline:3px solid var(--gx-accent);outline-offset:2px}
.gx-sl{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.gx-sl input{width:min(190px,44vw);accent-color:var(--gx-accent);height:28px}
.gx-sl output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.gx-links{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.gx-small{font-size:max(13px,.85em);opacity:.8;margin:6px 0}
.gx-about-n{font-weight:700;margin:4px 0}
/* reference */
.gx-ref-top{position:sticky;top:-10px;z-index:2;background:var(--gx-panel);margin:-10px -12px 6px;padding:10px 12px 6px;border-bottom:1px solid var(--gx-line)}
.gx-ref.big .gx-ref-top{display:none}
.gx-ref-q{width:100%;box-sizing:border-box;min-height:44px;font:inherit;padding:6px 12px;border-radius:10px;border:1px solid var(--gx-line);background:rgba(255,255,255,.6);color:inherit}
.gx-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0 0}
.gx-chips::-webkit-scrollbar{display:none}
.gx-chips>*{flex:none}
.gx-ref-list[hidden],.gx-ref-big[hidden]{display:none}
.gx-ref-n{font-size:max(13px,.82em);opacity:.75;padding-top:4px}
.gx-ref-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:8px}
.gx-ref-it{appearance:none;font:inherit;color:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:12px;border:1px solid var(--gx-line);background:rgba(255,255,255,.35);cursor:pointer;min-height:64px}
.gx-ref-it:hover{background:rgba(255,255,255,.55)}
.gx-ref-pic{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:52px}
.gx-ref-pic>img,.gx-ref-pic>svg{max-width:100%;height:auto;display:block}
.gx-ref-pic.big{width:min(240px,62vw);margin:4px auto 8px;display:flex}
.gx-ref-tx{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.gx-ref-tx b{font-size:1em}
.gx-ref-c{font-size:max(13px,.8em);font-weight:700;padding:0 6px;border-radius:99px;background:var(--gx-chip)}
.gx-ref-m{font-size:max(13px,.8em);opacity:.75;flex-basis:100%}
.gx-ref-d{font-size:max(13px,.86em);flex-basis:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gx-ref-big h3{margin:4px 0 2px;text-align:center;font-size:1.25em}
.gx-ref-big .gx-ref-m{text-align:center}
.gx-ref-full{font-size:1.02em;line-height:1.5;max-width:40em;margin:10px auto}
.gx-ref-x{max-width:40em;margin:8px auto;font-size:max(13px,.9em)}
.gx-ref-big .gx-chips{justify-content:center;flex-wrap:wrap}
.gx-tag{font-size:max(13px,.8em);padding:2px 9px;border-radius:99px;background:var(--gx-chip)}
.gx-ref-bh{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-10px;background:var(--gx-panel);padding:6px 0;z-index:2}
.gx-ref-nav{display:inline-flex;align-items:center;gap:6px}
.gx-ref-big:focus{outline:none}
/* recap strip */
.gx-recap{box-sizing:border-box;min-width:0;max-width:calc(100% - 16px);align-self:stretch;margin:6px 8px;border-radius:12px;background:rgba(0,0,0,.07);border:1px solid var(--gx-line)}
.gx-recap[hidden]{display:none}
.gx-recap-top{display:flex;align-items:stretch}
.gx-recap-h{appearance:none;flex:1;min-width:0;display:flex;align-items:center;gap:8px;font:inherit;color:inherit;background:transparent;border:0;padding:6px 10px;min-height:44px;text-align:left;cursor:pointer}
.gx-recap-h b{white-space:nowrap;font-size:max(13px,.86em)}
.gx-recap-n{font-size:max(13px,.75em);font-weight:700;min-width:1.6em;text-align:center;border-radius:99px;padding:1px 6px;background:var(--gx-accent);color:#1d140b}
.gx-recap-1{flex:1;min-width:0;font-size:max(13px,.84em);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-recap-x{appearance:none;border:0;background:transparent;color:inherit;font-size:1.4em;min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}
.gx-recap-l{margin:0;padding:0 12px 8px 30px;font-size:max(13px,.86em);max-height:9.5em;overflow:auto;line-height:1.4}
/* update notice */
.gx-update{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;appearance:none;font:inherit;font-weight:700;padding:10px 18px;min-height:48px;border-radius:99px;border:0;background:var(--gx-accent);color:#1d140b;box-shadow:var(--gx-shadow);cursor:pointer;max-width:calc(100vw - 24px)}
/* left-handed: the dock and the drawers swap sides on wide screens; games can flip their own button rows with html.lefty */
@media (min-width:1000px){
  html.lefty .gx-main{grid-template-columns:var(--gx-dock-w) minmax(0,1fr)}
  html.lefty .gx-app.gx-dock-min .gx-main{grid-template-columns:0 minmax(0,1fr)}
  html.lefty .gx-dock{grid-column:1;grid-row:1}
  html.lefty .gx-board{grid-column:2;grid-row:1}
  html.lefty .gx-drawer{right:auto;left:8px;transform:translateX(calc(-100% - 16px))}
  html.lefty .gx-drawer.on{transform:none}
  html.lefty .gx-ibtn.gx-reopen{right:auto;left:10px}
}
/* reduce motion / animations off */
html.gx-reduce *,html.gx-reduce *::before,html.gx-reduce *::after,html.gx-noanim *,html.gx-noanim *::before,html.gx-noanim *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
/* colour-blind symbols: games add <i class="gx-cbm">▲</i> next to colour-coded pieces; shown only with html.cb */
.gx-cbm{display:none;font-style:normal}
html.cb .gx-cbm{display:inline}

/* gx-help.css: coach bubbles, the lightbulb, the ghost finger and the rules cards (see gx-help.js and GX-KIT.md section 9).
   Everything the kit draws carries data-help. Override the look with the --gxh-* variables on :root. */
:root{--gxh-bg:#f3e6bf;--gxh-ink:#231a10;--gxh-accent:#c99a35;--gxh-glow:#ffe08a;--gxh-btn:#7a1f31;--gxh-btn-ink:#fff6dc;--gxh-z:80;--gxh-font:inherit}
.gxh-bub{position:fixed;left:0;top:0;z-index:var(--gxh-z);box-sizing:border-box;width:max-content;max-width:min(292px,calc(100vw - 16px));padding:8px 10px 8px 10px;border-radius:12px;background:var(--gxh-bg);color:var(--gxh-ink);border:2px solid var(--gxh-accent);box-shadow:0 8px 22px rgba(0,0,0,.55);font:600 14px/1.28 var(--gxh-font);text-align:left;visibility:hidden;animation:gxh-in .18s ease-out both}
.gxh-bub.on{visibility:visible}
.gxh-bub *{box-sizing:border-box}
.gxh-bub .gxh-tt{font-weight:800;font-size:14.5px;margin:0 0 2px}
.gxh-bub .gxh-tx{font-weight:600;font-size:13.5px}
.gxh-bub .gxh-bd{display:flex;gap:8px;align-items:flex-start}
.gxh-bub .gxh-sp{flex:0 0 36px;width:36px;height:36px}
.gxh-bub .gxh-sp svg{width:100%;height:100%}
.gxh-bub .gxh-row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;clear:both}
.gxh-bub .gxh-ok,.gxh-bub .gxh-link{font:800 13px/1 var(--gxh-font);min-height:32px;padding:0 12px;border-radius:16px;border:0;cursor:pointer}
.gxh-bub .gxh-ok{background:var(--gxh-btn);color:var(--gxh-btn-ink);margin-left:auto}
/* 44 px tap box, same 32 px look: the extra 6 px is a transparent border pulled back with negative margin */
.gxh-bub .gxh-ok{box-sizing:border-box;min-height:44px;border:6px solid transparent;background-clip:padding-box;margin-top:-6px;margin-bottom:-6px;margin-right:-6px}
.gxh-bub .gxh-link{background:transparent;color:var(--gxh-btn);text-decoration:underline;padding:0;min-height:32px;display:inline-flex;align-items:center}
.gxh-arr{position:absolute;width:12px;height:12px;background:var(--gxh-bg);border:2px solid var(--gxh-accent);transform:rotate(45deg)}
.gxh-a-top .gxh-arr{top:-8px;border-right:0;border-bottom:0}
.gxh-a-bottom .gxh-arr{bottom:-8px;border-left:0;border-top:0}
.gxh-a-left .gxh-arr{left:-8px;border-top:0;border-right:0}
.gxh-a-right .gxh-arr{right:-8px;border-bottom:0;border-left:0}
.gxh-ring{position:fixed;left:0;top:0;z-index:calc(var(--gxh-z) - 1);pointer-events:none;border-radius:14px;border:3px solid var(--gxh-glow);box-shadow:0 0 0 3px rgba(255,224,138,.35),0 0 18px 4px var(--gxh-glow);animation:gxh-pulse 1.1s ease-in-out infinite}
.gxh-ring.round{border-radius:50%}
.gxh-ring.soft{border-width:2px;box-shadow:0 0 12px 2px var(--gxh-glow);opacity:.9}
.gxh-ring.from{border-style:dashed;animation:none;box-shadow:0 0 10px 1px var(--gxh-glow)}
.gxh-finger{position:fixed;left:0;top:0;z-index:calc(var(--gxh-z) + 1);pointer-events:none;width:0;height:0}
.gxh-finger i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.18) 66%,rgba(255,255,255,0) 74%);box-shadow:0 0 12px rgba(255,255,255,.6)}
.gxh-finger b{position:absolute;left:-3px;top:2px;width:10px;height:26px;border-radius:5px;background:#fff;opacity:.9;transform:rotate(-24deg);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gxh-bulb{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.gxh-bulb svg{width:24px;height:24px;display:block;fill:#ffd95a;stroke:#6b4a00;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,217,90,.7))}
.gxh-bulb.gxh-float{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:calc(var(--gxh-z) - 2);width:44px;height:44px;border-radius:50%;border:2px solid var(--gxh-accent);background:#2a1820}
.gxh-bulb.lit svg{filter:drop-shadow(0 0 8px #ffd95a)}
.gxh-rules{position:fixed;inset:0;z-index:calc(var(--gxh-z) + 10);display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(5,3,6,.72);overscroll-behavior:contain;touch-action:pan-y}
.gxh-rules .gxh-card{position:relative;box-sizing:border-box;width:min(360px,100%);max-height:calc(100% - 8px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px 14px 12px;border-radius:16px;background:var(--gxh-bg);color:var(--gxh-ink);border:3px solid var(--gxh-accent);box-shadow:0 18px 50px rgba(0,0,0,.7);font:600 15px/1.3 var(--gxh-font)}
.gxh-rules .gxh-x{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.08);color:var(--gxh-ink);font:700 22px/1 var(--gxh-font);cursor:pointer}
.gxh-rules .gxh-pic{display:flex;align-items:center;justify-content:center;min-height:120px;max-height:34dvh;padding:6px 0;background:rgba(0,0,0,.06);border-radius:12px;margin-top:22px}
.gxh-rules .gxh-pic svg{max-width:100%;max-height:30dvh;height:auto}
.gxh-rules .gxh-rt{font-weight:800;font-size:19px;line-height:1.15;padding-right:30px}
.gxh-rules .gxh-rx{font-weight:600;font-size:16px}
.gxh-rules .gxh-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.gxh-rules .gxh-nav button{min-height:44px;min-width:76px;padding:0 14px;border-radius:22px;border:2px solid var(--gxh-btn);background:transparent;color:var(--gxh-btn);font:800 15px/1 var(--gxh-font);cursor:pointer}
.gxh-rules .gxh-nav button.gxh-next{background:var(--gxh-btn);color:var(--gxh-btn-ink)}
.gxh-rules .gxh-nav button[disabled]{opacity:.3}
.gxh-rules .gxh-dots{display:flex;gap:6px}
.gxh-rules .gxh-dots i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.25)}
.gxh-rules .gxh-dots i.on{background:var(--gxh-btn)}
.gxh-pics{display:flex;align-items:flex-end;justify-content:center;gap:8px;flex-wrap:nowrap}
.gxh-pics figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.gxh-pics svg{width:64px;height:64px}
.gxh-pics figcaption{font:800 12px/1.1 var(--gxh-font);text-align:center;max-width:76px}

/* gx-tutor.css: the staged tutorial (spotlight, bubble, progress dots, end card). Bubble styles come from gx-help.css (.gxh-bub); see GX-KIT.md section 10.
   Everything the kit draws carries data-help. Override with --gxt-* (and the --gxh-* variables of the help kit). */
:root{--gxt-z:90;--gxt-dim:rgba(8,4,10,.62)}
.gxt-cell{position:fixed;z-index:var(--gxt-z);background:var(--gxt-dim);touch-action:none;-webkit-tap-highlight-color:transparent;cursor:default}
.gxt-cell.gxt-clear{background:transparent}
.gxt-ring{position:fixed;left:0;top:0;z-index:calc(var(--gxt-z) + 1);pointer-events:none;border-radius:14px;border:3px solid var(--gxh-glow,#ffe08a);box-shadow:0 0 0 3px rgba(255,224,138,.35),0 0 18px 4px var(--gxh-glow,#ffe08a);animation:gxt-pulse 1.1s ease-in-out infinite}
.gxt-ring.soft{border-width:2px;box-shadow:0 0 12px 2px var(--gxh-glow,#ffe08a);opacity:.9;animation:none}
.gxt-fin{position:fixed;left:0;top:0;z-index:calc(var(--gxt-z) + 3);pointer-events:none;width:0;height:0}
.gxt-fin i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.18) 66%,rgba(255,255,255,0) 74%);box-shadow:0 0 12px rgba(255,255,255,.6)}
.gxt-fin b{position:absolute;left:-3px;top:2px;width:10px;height:26px;border-radius:5px;background:#fff;opacity:.9;transform:rotate(-24deg);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gxh-bub.gxt-bub{z-index:calc(var(--gxt-z) + 4);animation:gxh-in .18s ease-out both}
.gxt-bub.gxt-shake{animation:gxt-shake .38s ease-in-out both}
.gxt-bub.gxt-nobtn .gxh-tt{padding-right:0}
.gxt-top{position:fixed;left:0;right:0;top:0;z-index:calc(var(--gxt-z) + 5);height:34px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 10px;background:#160b11;color:#f3e6bf;font:700 12px/1 var(--gxh-font,inherit);border-bottom:1px solid rgba(201,154,53,.5)}
.gxt-prog{display:flex;align-items:center;gap:8px;min-width:0}
.gxt-dots{display:flex;gap:3px;align-items:center;flex-wrap:nowrap}
.gxt-dots i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(243,230,191,.28);flex:0 0 auto}
.gxt-dots i.done{background:#c99a35}
.gxt-dots i.on{background:#ffe08a;box-shadow:0 0 6px #ffe08a;transform:scale(1.35)}
.gxt-n{opacity:.85;white-space:nowrap}
.gxt-skip{flex:0 0 auto;min-height:28px;padding:0 10px;border-radius:14px;border:1px solid rgba(243,230,191,.5);background:transparent;color:#f3e6bf;font:700 12px/1 var(--gxh-font,inherit);cursor:pointer}
.gxt-pill{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:calc(var(--gxt-z) + 5);padding:6px 14px;border-radius:16px;background:rgba(22,11,17,.9);color:#f3e6bf;border:1px solid rgba(201,154,53,.6);font:700 13px/1.2 var(--gxh-font,inherit);pointer-events:none;white-space:nowrap}
.gxt-end{position:fixed;inset:0;z-index:calc(var(--gxt-z) + 10);display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(5,3,6,.7);box-sizing:border-box}
.gxt-endc{box-sizing:border-box;width:min(340px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;padding:18px 16px 16px;border-radius:18px;background:var(--gxh-bg,#f3e6bf);color:var(--gxh-ink,#231a10);border:3px solid var(--gxh-accent,#c99a35);box-shadow:0 18px 50px rgba(0,0,0,.7);font:600 15px/1.3 var(--gxh-font,inherit)}
.gxt-ek{align-self:center;width:46px;height:46px;border-radius:50%;background:var(--gxh-btn,#7a1f31);color:var(--gxh-btn-ink,#fff6dc);font:800 28px/46px var(--gxh-font,inherit)}
.gxt-et{font-weight:800;font-size:22px;line-height:1.15}
.gxt-ex{font-weight:600;font-size:15px}
.gxt-eb{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.gxt-b{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--gxh-btn,#7a1f31);background:transparent;color:var(--gxh-btn,#7a1f31);font:800 16px/1 var(--gxh-font,inherit);cursor:pointer}
.gxt-b.pri{background:var(--gxh-btn,#7a1f31);color:var(--gxh-btn-ink,#fff6dc)}
@keyframes gxt-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.025);opacity:.75}}
@keyframes gxt-shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.gxt-ring,.gxt-bub.gxt-shake{animation:none}}
@media (max-height:620px){.gxt-endc{gap:6px;padding:12px 14px}.gxt-ek{display:none}.gxt-et{font-size:19px}.gxt-b{min-height:44px}.gxt-top{height:30px}}

/* ===== GX campaign styles: chapter map, story scenes, boss card, result. Theme with the --gxc-* variables. ===== */
:root{--gxc-bg:#1b1410;--gxc-paper:#efe0bd;--gxc-paper2:#e2cc9b;--gxc-ink:#2a1d10;--gxc-dim:rgba(42,29,16,.68);--gxc-line:rgba(60,38,14,.28);
  --gxc-go:#c9662a;--gxc-go-ink:#fff8ec;--gxc-gold:#f2b93b;--gxc-a1:#4f8a4b;--gxc-a2:#c07a2c;--gxc-a3:#8e3b46;--gxc-road:#b98a52;--gxc-radius:16px;
  --gxc-font:inherit;--gxc-head:inherit}
.gxc{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:var(--gxc-ink);font-family:var(--gxc-font);
  background:radial-gradient(120% 70% at 50% 0%,#3a2a1c 0%,var(--gxc-bg) 70%);overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.gxc[hidden]{display:none}
.gxc *{box-sizing:border-box}
.gxc button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gxc button:focus-visible{outline:3px solid var(--gxc-gold);outline-offset:2px}
.gxc-screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;width:100%;max-width:560px;margin:0 auto}
.gxc-map-on .gxc-screen{justify-content:flex-start;padding:0;max-width:640px}
.gxc-dim{color:var(--gxc-dim)}
.gxc-small{font-size:13px;margin:6px 0 0;text-align:center}
.gxc-row{display:flex;gap:8px;justify-content:center;margin-top:14px;width:100%}
.gxc-row.wrap{flex-wrap:wrap}
.gxc-btn{min-height:46px;min-width:88px;padding:8px 21px;border-radius:12px;border:2px solid var(--gxc-line);background:rgba(255,255,255,.35);color:var(--gxc-ink);font-weight:700;letter-spacing:.01em}
.gxc-btn.go{background:linear-gradient(#dc7a3a,var(--gxc-go));border-color:#8f4317;color:var(--gxc-go-ink);box-shadow:0 3px 0 #7a3712,0 6px 14px rgba(0,0,0,.25);flex:1 1 auto;max-width:220px}
.gxc-btn.go:active{transform:translateY(2px);box-shadow:0 1px 0 #7a3712}
.gxc-btn.soft{background:#f7e7b8;border-color:#c9a14a}
.gxc-btn.ghost{background:rgba(255,255,255,.22)}
.gxc-ib{min-height:44px;min-width:44px;padding:4px 21px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fbefd6;font-weight:600;white-space:nowrap;flex:0 0 auto}
.gxc-tag{display:inline-block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:rgba(60,38,14,.12);margin-right:6px;font-weight:700}
/* portraits: image or emoji badge in a painted ring */
.gxc-pt{--gxc-pt:64px;--gxc-ptc:#6b4a2b;width:var(--gxc-pt);height:var(--gxc-pt);flex:0 0 var(--gxc-pt);border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 55%),var(--gxc-ptc);border:3px solid #f6e6c2;box-shadow:0 0 0 2px rgba(60,38,14,.5),0 6px 16px rgba(0,0,0,.3)}
.gxc-pt img{width:100%;height:100%;object-fit:cover;display:block}
.gxc-pt-e{font-size:calc(var(--gxc-pt) * .52);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
/* ---- map ---- */
.gxc-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;flex:0 0 auto;color:#fbefd6}
.gxc-htitle{flex:1 1 auto;line-height:1.2;min-width:0;text-align:center;font-family:var(--gxc-head);font-size:19px;white-space:normal;overflow-wrap:anywhere;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.gxc-score{color:var(--gxc-gold)}
.gxc-map{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  border-radius:var(--gxc-radius) var(--gxc-radius) 0 0;
  background:
    radial-gradient(60% 40% at 20% 15%,rgba(110,150,80,.28),transparent 70%),
    radial-gradient(50% 35% at 85% 55%,rgba(200,140,60,.22),transparent 70%),
    radial-gradient(70% 40% at 30% 92%,rgba(150,60,70,.22),transparent 70%),
    repeating-radial-gradient(circle at 70% 30%,rgba(120,80,30,.035) 0 2px,transparent 2px 9px),
    linear-gradient(#f1e3c2,var(--gxc-paper2));box-shadow:inset 0 0 40px rgba(90,55,20,.45)}
.gxc-path{position:relative;width:100%;margin:0 auto;max-width:560px}
.gxc-road{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:visible}
.gxc-road path{fill:none;stroke-linecap:round}
.gxc-road-edge{stroke:rgba(90,58,24,.45);stroke-width:26px}
.gxc-road-fill{stroke:var(--gxc-road);stroke-width:20px}
.gxc-road-dash{stroke:#f6e6c2;stroke-width:3px;stroke-dasharray:2 10;opacity:.85}
.gxc-act{position:absolute;left:12px;right:12px;height:38px;margin-top:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(60,38,14,.82) 15%,rgba(60,38,14,.82) 85%,transparent);color:#fbefd6;z-index:2;text-align:center;line-height:1.1}
.gxc-act b{font-size:14px;letter-spacing:.04em}
.gxc-act small{font-size:13px;line-height:1.25;opacity:.85;white-space:normal;max-width:100%;padding:0 18px}
.gxc-node{position:absolute;transform:translateX(-50%);width:64px;height:64px;padding:0;border:0;background:none;z-index:3;display:flex;flex-direction:column;align-items:center}
.gxc-disc{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff8ec;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 55%),var(--gxc-a1);border:3px solid #f6e6c2;box-shadow:0 0 0 2px rgba(60,38,14,.55),0 5px 10px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.gxc-node.a2 .gxc-disc{background-color:var(--gxc-a2);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 55%)}
.gxc-node.a3 .gxc-disc{background-color:var(--gxc-a3);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 55%)}
.gxc-node.boss .gxc-disc{width:62px;height:62px;margin-top:-3px;border-color:var(--gxc-gold);box-shadow:0 0 0 2px #6b3c10,0 0 0 6px rgba(242,185,59,.35),0 6px 12px rgba(0,0,0,.35)}
.gxc-node.boss .gxc-disc .gxc-pt{border:0;box-shadow:none;background:transparent}
.gxc-node.boss .gxc-disc::after{content:'♛';position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:17px;color:var(--gxc-gold);text-shadow:0 1px 2px #000}
.gxc-node.locked .gxc-disc{filter:grayscale(.85) brightness(.85);opacity:.75}
.gxc-lock{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:16px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.gxc-node.won .gxc-disc{border-color:var(--gxc-gold)}
.gxc-node.next .gxc-disc{animation:gxc-pulse 1.6s ease-in-out infinite}
@keyframes gxc-pulse{0%,100%{box-shadow:0 0 0 2px rgba(60,38,14,.55),0 0 0 0 rgba(242,185,59,.7)}50%{box-shadow:0 0 0 2px rgba(60,38,14,.55),0 0 0 10px rgba(242,185,59,0)}}
.gxc-node .gxc-stars{position:absolute;top:50px;left:50%;transform:translateX(-50%);gap:0;padding:0 4px;border-radius:99px;background:rgba(60,38,14,.75)}
.gxc-node .gxc-st{font-size:13px}
.gxc-lab{position:absolute;left:66px;top:14px;width:max-content;max-width:min(150px,38vw);text-align:left;font-size:13.5px;font-weight:700;line-height:1.15;color:var(--gxc-ink);
  background:rgba(246,230,194,.88);padding:3px 8px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.gxc-node.lab-l .gxc-lab{left:auto;right:66px;text-align:right}
.gxc-node.locked .gxc-lab{opacity:.65}
.gxc-stars{display:inline-flex;gap:2px;justify-content:center}
.gxc-st{font-style:normal;color:rgba(255,255,255,.35);font-size:16px;line-height:1}
.gxc-st.on{color:var(--gxc-gold);text-shadow:0 0 6px rgba(242,185,59,.6)}
.gxc-st.cap{opacity:.3}
.gxc-stars.big .gxc-st{font-size:44px;color:rgba(60,38,14,.2)}
.gxc-stars.big .gxc-st.on{color:var(--gxc-gold);text-shadow:0 2px 0 #9c6a12,0 0 14px rgba(242,185,59,.7);animation:gxc-pop .4s cubic-bezier(.3,1.6,.5,1) both}
.gxc-stars.big .gxc-st.on:nth-child(2){animation-delay:.25s}.gxc-stars.big .gxc-st.on:nth-child(3){animation-delay:.5s}
@keyframes gxc-pop{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
/* sheets and toasts sit over the map */
.gxc-sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88%;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;z-index:5;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#f6e9cb,var(--gxc-paper));border-radius:var(--gxc-radius) var(--gxc-radius) 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:gxc-up .22s ease-out}
@keyframes gxc-up{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.gxc-sheet h3{margin:0 0 4px;font-family:var(--gxc-head);font-size:21px;line-height:1.15}
.gxc-sh-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.gxc-sh-t{min-width:0}.gxc-sh-t small{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--gxc-dim);font-weight:700}
.gxc-goal,.gxc-twist{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:12px;margin:6px 0;text-align:left;width:100%;font-size:15px;line-height:1.3}
.gxc-goal{background:rgba(79,138,75,.16);border:1px solid rgba(79,138,75,.45)}
.gxc-twist{background:rgba(142,59,70,.12);border:1px solid rgba(142,59,70,.5)}
.gxc-goal b,.gxc-twist b{font-size:13px;text-transform:uppercase;letter-spacing:.07em}
.gxc-twist b{color:var(--gxc-a3)}
.gxc-twist.big{font-size:16px;border-width:2px}
.gxc-slist{list-style:none;margin:8px 0 0;padding:0;width:100%;text-align:left;font-size:14.5px}
.gxc-slist li{display:flex;gap:8px;align-items:center;padding:4px 0}
.gxc-slist i{font-style:normal;font-size:18px;color:rgba(60,38,14,.25)}
.gxc-slist li.on i{color:var(--gxc-gold);text-shadow:0 1px 0 #9c6a12}
.gxc-rw{list-style:none;padding:0;margin:8px 0}.gxc-rw li{padding:6px 0;border-bottom:1px solid var(--gxc-line)}
.gxc-toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:rgba(30,20,10,.92);color:#fbefd6;padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
/* ---- story scene ---- */
.gxc-scene,.gxc-boss,.gxc-res{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px;border-radius:var(--gxc-radius);
  background:linear-gradient(#f6e9cb,var(--gxc-paper));box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 30px rgba(140,95,40,.25);max-height:100%;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;max-width:100%}

.gxc-sc-text.in{animation:gxc-in .3s ease-out}
@keyframes gxc-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gxc-dots{display:flex;gap:6px}.gxc-dots i{width:8px;height:8px;border-radius:50%;background:rgba(60,38,14,.2)}.gxc-dots i.was{background:rgba(60,38,14,.45)}.gxc-dots i.on{background:var(--gxc-go)}
/* ---- boss card ---- */

/* Shared menu look for every game (injected last by build-all.py, with the self-hosted faces from shell/fonts).
   One title face (Cinzel), one body face (Alegreya Sans), text >= 13 px, text never absolutely positioned on top of other text. */
:root{--gx-title:"Cinzel",Georgia,serif;--gx-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html body,html body *{font-family:var(--gx-body)!important}
html body :is(h1,h2,h3,h4,.gx-title,.title,.logo,.ttl,.gxc-htitle,.gxc-htitle *,.gxc-title,.gxt-et){font-family:var(--gx-title)!important;font-weight:700;letter-spacing:.02em}
/* menu text floor: the small print under a button and labels never go under 13 px */
html body :is(.gxt-menu span,.gxt-menu small,.menu .btn small,.modal .btn small,.modal p,.modal li,.modal label){font-size:max(13px,1em)}
html body :is(small,.small,.muted,.lbl,.box,.gx-ibtn span,.gx-set small){font-size:max(13px,.9em)}

.seat.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}
.mini.popin{animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{0%{transform:scale(.2)}100%{transform:scale(1)}}
.rpic{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px}
.rpic .mini{width:40px;height:56px;font-size:1.2rem}
.rpic .lab{font:800 1rem/1.2 system-ui,sans-serif;color:#0b2233;max-width:90px;text-align:center}
.rpic .tag{display:inline-block;padding:2px 8px;border-radius:12px;background:#06182a;color:#3fd0c9;font:800 1rem/1.3 system-ui,sans-serif}
.rstars{font-size:2.2rem;letter-spacing:6px;color:var(--warm);text-shadow:0 0 12px rgba(240,180,41,.6);margin:6px 0}
.rstars i{font-style:normal;opacity:.25}
.rreplay{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0}
.rreplay .rt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rreplay figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.87rem}
.rreplay figure.bad .mini{box-shadow:0 0 0 3px #ff6b6b}
.rreplay figure.win .mini{box-shadow:0 0 0 3px var(--warm)}
#title #tutSlot .btn{font-size:16px;width:min(274px,36vw);box-sizing:border-box}
#board.land .seat{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:nowrap;white-space:nowrap;top:4px;padding:3px 6px}
#board.land .seat .tk,#board.land .seat .sgrow{margin-top:0}
#board.land .seat .sgrow{display:inline-flex;flex-wrap:nowrap;padding:1px 4px}#board.land .seat .nm{overflow:visible;flex:none}#board.land .seat .st{flex:none}
#board.land .seat .mini{width:24px;height:34px;font-size:.87rem}
#board.land .seat .mini .tok{top:-7px;right:-8px;min-width:18px;height:18px}
#board.land #drone{padding:2px 6px 4px}#board.land #drone .dl{display:inline;margin-right:8px}#board.land #drone .drow{display:inline-flex}
#board.land #drone .stk{min-height:38px;min-width:34px}#board.land #drone .mini{width:26px;height:36px}#board.land #drone .stk.deep::before,#board.land #drone .stk.empty::after{width:26px;height:36px}
#nameRow{flex-wrap:wrap;gap:6px}.nmin{width:7.5em;font:600 16px system-ui,sans-serif;padding:8px 8px;border-radius:9px;border:1px solid var(--line);background:#06182a;color:#eaf4f7;min-height:44px;box-sizing:border-box}
.ds-why{margin:4px 0 2px;font-weight:700;color:#8a2b1a;text-align:center;font-size:16px}

<body>
<div class="gx-app" id="app">
  <div id="topbar">
    <div id="mchip"><b id="mname">Deep Signal</b><span id="mtrick"></span></div>
    <button class="gx-ibtn gxh-bulb ib" id="bulbbtn" data-help type="button" aria-label="Hint"></button>
    <button class="ib txt" id="helpB" type="button" aria-label="Rules">?</button>
    <button class="ib" data-gx="setd" id="menuB" type="button" aria-label="Menu">☰</button>
  </div>
  <div class="gx-board" id="board" data-art="bg-table">
    <div id="seats"></div>
    <div id="drone"></div>
    <div id="pool"></div>
    <div id="trick"></div>
    <div id="askp"></div>
    <div id="stamp"></div>
  </div>
  <div id="dock">
    <div id="msg" aria-live="polite"></div>
    <div id="mine"><div id="mytasks"></div><button class="btn" id="sigB" type="button"><span class="bi" data-art="icon-signal">📡</span> Signal</button><button class="btn" id="flareB" type="button"><span class="bi" data-art="icon-flare">🔥</span> Flare</button></div>
    <div id="hand"></div>
  </div>
</div>
<div class="scr on" id="title" data-art="bg-title">
  <div class="sonar-ring" data-art="logo-emblem"></div>
  <h1 class="logo">DEEP SIGNAL</h1>
  <p class="tag">A crew of divers, one deck of cards. Win the right cards for the right crew mate, dive after dive.</p>
  <button class="btn pri big" id="storyB" type="button">Story: the Logbook</button>
  <div class="trow"><span id="tutSlot"></span><button class="btn" id="quickB" type="button">Quick game</button><button class="btn" id="howB" type="button">How to play</button><button class="btn" data-gx="setd" type="button" id="tMenuB">Settings</button></div>
</div>
<div class="scr" id="setup">
  <h2 style="margin:0">Quick game</h2>
  <div class="setrow"><label>Crew</label><div class="seg" id="segP"></div></div>
  <div class="setrow"><label>At this device</label><div class="seg" id="segH"></div></div>
  <div class="setrow"><label>Crew skill</label><div class="seg" id="segL"></div></div>
  <div class="setrow"><label>Mission</label><button class="ib" id="mMinus" type="button" aria-label="Previous mission">−</button><b id="mNum" style="font-size:1.3rem;min-width:3ch">1</b><button class="ib" id="mPlus" type="button" aria-label="Next mission">+</button></div>

  <div class="lb" id="logbook"></div>
  <button class="btn pri big" id="startB" type="button">Start dive</button>
  <button class="btn" id="setBack" type="button">Back</button>
</div>

<div id="zoom"><div class="zc"><div class="big" id="zbig"></div><p id="ztxt"></p><div class="row" id="zrow"></div></div></div>
<div class="scr" id="res" data-art="result-complete"><h2 id="resH"></h2><p id="resP"></p><div id="resX"></div><div class="row" id="resRow" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div></div>
<script>
/* GX scenarios: "spawn the requirement only". Open any game with  ?scn=<id>  and it skips menus / tutorial offers, seeds the RNG,
   builds the exact engine state of ONE scenario directly (no playing through), shows a tiny "Test: <name>" tag and exposes
   window.GXSCN = {id, name, ask, ready, checks}. `ask` is the one line the owner should try ("Tap SMASH over Downtown");
   `checks` are the machine asserts the runner (scripts/scn-run.js + scenarios.spec.js) runs at 390x763, 375x553 and 1366x768.
   ?scn=list  ->  window.GXSLIST = [{id, name, ask, sizes}]  (no setup, used by the runner and the shelf).

   A game registers its scenarios in ONE small file (scn.js) inlined right after this one and BEFORE the game scripts:
     GXS.add({
       id: 'dk-help-label',                         // unique, kebab-case, prefix = game
       name: 'Tutorial: Help button',               // shown in the "Test:" tag
       ask: 'Is the Help button label readable?',   // ONE line for the owner (8 words or fewer is best)
       ls: { dkd_offer: '1' },                      // optional: localStorage seeded for this scenario (a private in-memory store: the player's saves are never touched)
       seed: 7,                                     // optional RNG seed (default: hash of id)
       sizes: 'all' | 'phone' | 'pc',               // optional, default all
       when: () => window.G && window.UI,           // optional: wait until the game has booted (default: page loaded + 300 ms)
       setup() { ...build the state directly... },  // may return a promise
       checks: [ ... ]                              // see below
     });
   Checks (plain data + small functions; they run IN the page):
     {kind:'visible', sel:'.fbtns .helpb', name:'Help button'}     exists, shown, inside the viewport, not covered by another element

  /* ---- pinned ✔ Test checklist (this game's What's new items, shared with the shelf) ---- */
  function card() {
    var p = el.card; if (!p) { p = el.card = mk('div', 'gxlab-card', 'gxl-panel'); p.setAttribute('role', 'region'); p.setAttribute('aria-label', 'Test checklist'); p.hidden = true; document.body.appendChild(p);

    var bd = p.querySelector('.gxl-body'), st = bd ? bd.scrollTop : 0; p.innerHTML = h + '</div>'; p.querySelector('.gxl-body').scrollTop = st;
