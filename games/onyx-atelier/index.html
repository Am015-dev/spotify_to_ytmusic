:root{--lac:#0b0a0c;--lac2:#141216;--lac3:#1d1a1f;--gold:#d8b45a;--gold2:#f1d68c;--gold3:#8f7231;--ink:#f3ead6;--mute:#bfb294;
--w:#e3ecf5;--u:#2f63d6;--g:#17a468;--r:#d4243f;--k:#3a3a44;--p:#efe2d6;--o:#e0b13e;
--deco:'Limelight',Georgia,serif;--body:'Josefin Sans',system-ui,sans-serif;--cell:52px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--lac);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
::selection{background:var(--gold);color:var(--lac)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
svg{display:block}
/* black lacquer with a faint gold deco lattice */
body{background-color:var(--lac);background-image:
 linear-gradient(135deg,rgba(216,180,90,.05) 25%,transparent 25%),linear-gradient(225deg,rgba(216,180,90,.05) 25%,transparent 25%),
 linear-gradient(45deg,rgba(216,180,90,.05) 25%,transparent 25%),linear-gradient(315deg,rgba(216,180,90,.05) 25%,transparent 25%);
 background-size:28px 28px;background-position:14px 0,14px 0,0 0,0 0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
/* top bar: menu, the one status line, hint, rules */
#bar{flex:0 0 44px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--gold3)}
.ib{flex:0 0 44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--gold)}
.ib svg{width:22px;height:22px}
.ib[aria-pressed="true"]{background:rgba(216,180,90,.18)}
#status{flex:1 1 auto;min-width:0;text-align:center;font-size:15px;font-weight:700;letter-spacing:.02em;line-height:1.15;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#status.rv{font-size:13px}
#status.rv{color:#f0a6b0}
/* player strips */
.ps{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;padding:3px 2px;position:relative;border-radius:10px;transition:background .3s}
.ps.turn{background:linear-gradient(180deg,rgba(216,180,90,.13),rgba(216,180,90,.03))}
.ps .top{display:flex;align-items:center;gap:5px;min-height:24px;font-size:13px;flex-wrap:nowrap;overflow:hidden}
.ps .nm{font-family:var(--deco);font-size:15px;color:var(--gold2);letter-spacing:.04em}
.ps.turn .nm::after{content:"";display:inline-block;width:7px;height:7px;margin-left:5px;border-radius:50%;background:var(--gold2);vertical-align:middle;box-shadow:0 0 6px var(--gold)}
.race{display:flex;gap:5px;align-items:center;flex:1 1 auto;min-width:0;flex-wrap:nowrap}
.race b{font-size:15px;color:var(--ink)}.race span{display:inline-flex;align-items:center;gap:2px;white-space:nowrap;color:var(--mute);font-size:12px}
.race svg{width:15px;height:15px}
.favs{display:flex;gap:2px;align-items:center}
.favb{border:0;background:none;padding:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.favb svg{width:24px;height:24px}.favb{position:relative;flex:0 0 auto}.favb .fx{position:absolute;right:-2px;bottom:-2px;font-size:11px;background:var(--gold2);color:#1a1408;border-radius:7px;min-width:14px;line-height:14px;text-align:center}
.race span{flex:0 0 auto}.resb{flex:0 0 auto}

 repeating-linear-gradient(0deg,transparent 0 calc(var(--cell) - 1px),rgba(216,180,90,.22) calc(var(--cell) - 1px) var(--cell)),

 background:radial-gradient(120% 90% at 50% 0%,#24202a,#0c0b0e 70%);box-shadow:inset 0 0 0 2px #0c0b0e,inset 0 0 0 3px rgba(216,180,90,.55),0 2px 5px rgba(0,0,0,.6);text-align:left;transition:transform .2s cubic-bezier(.2,.8,.3,1.2),box-shadow .2s}

<div id="app">
  <header id="bar">

    <button class="ib" id="rulesbtn" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .8-1 1.5v.6M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </header>
  <section id="rival" class="ps" aria-label="Rival"></section>
  <section id="pyr" aria-label="Jewels for sale"></section>

  <section id="me" class="ps" aria-label="You"></section>
</div>
<div id="title"></div><div id="toast" aria-hidden="true"></div>
<script>
/* GX scenarios: "spawn the requirement only". Open any game with  ?scn=<id>  and it skips menus / tutorial offers, seeds the RNG,
   builds the exact engine state of ONE scenario directly (no playing through), shows a tiny "Test: <name>" tag and exposes
   window.GXSCN = {id, name, ask, ready, checks}. `ask` is the one line the owner should try ("Tap SMASH over Downtown");
   `checks` are the machine asserts the runner (scripts/scn-run.js + scenarios.spec.js) runs at 390x763, 375x553 and 1366x768.
   ?scn=list  ->  window.GXSLIST = [{id, name, ask, sizes}]  (no setup, used by the runner and the shelf).

   A game registers its scenarios in ONE small file (scn.js) inlined right after this one and BEFORE the game scripts:
     GXS.add({
       id: 'dk-help-label',                         // unique, kebab-case, prefix = game
       name: 'Tutorial: Help button',               // shown in the "Test:" tag
       ask: 'Is the Help button label readable?',   // ONE line for the owner (8 words or fewer is best)
       ls: { dkd_offer: '1' },                      // optional: localStorage seeded for this scenario (a private in-memory store: the player's saves are never touched)
       seed: 7,                                     // optional RNG seed (default: hash of id)
       sizes: 'all' | 'phone' | 'pc',               // optional, default all
       when: () => window.G && window.UI,           // optional: wait until the game has booted (default: page loaded + 300 ms)
       setup() { ...build the state directly... },  // may return a promise
       checks: [ ... ]                              // see below
     });
   Checks (plain data + small functions; they run IN the page):
     {kind:'visible', sel:'.fbtns .helpb', name:'Help button'}     exists, shown, inside the viewport, not covered by another element
     {kind:'text', sel:'.fbtns .helpb', re:/help/i, name:'label'}   visible text matches re, font >= 12 px, not clipped, not transparent
     {kind:'eq', name:'YOU total', a:() => dom number, b:() => engine number}   on-screen number equals the engine's
     {kind:'tap', sel:'.fbtns .smash', name:'SMASH', state:() => any, expect:(before, after) => true|false|'why'}
                                                                  the runner touch-taps the element; the engine state must then change as expected
     {kind:'hold', sel:'#pshop .obc', ms:700, name:'hold a card', state:..., expect:...}   like tap, but the runner presses and holds ms (touch: CDP touchStart..touchEnd; pc: mouse hover); state is read WHILE held
     {kind:'fn', name:'sound played', fn:() => true|false|'why'}   anything else
     {kind:'play', name:'buy a card', snap:() => engine numbers, steps:[{sel:'.card', until:() => done, max:3}, ...], idle:() => settled, verify:(before, after) => true|'why'}
                                                                  a BEHAVIOUR check: the runner taps each step with REAL touches (nothing is forced), waits (<= 8 s) until idle() is
                                                                  true, then verify(before, after) asserts the OUTCOME in the engine. step = {sel: css|() => Element, ready?: () => bool,
                                                                  skip?: () => bool, until?: () => bool (tap again, up to max times, until true), after?: ms}
   A scenario may add  mut:[{name:'cost +1', js:'canBuy = ...'}]  (JS run in the page after setup that breaks the feature on purpose: scripts/scenario-mutate.js
   runs every scenario with it and the scenario MUST then fail, or the scenario does not count) and  fp:() => engine fingerprint  (glow-response check).
   Invariants added to EVERY scenario (no per-game code): no console/page error, no failed same-origin request, no text under 11 px / clipped / overlapping,
   no covered button, no horizontal scroll, every element marked  data-engine="G.pl.0.en"  shows the engine value, every glowing legal target
   (GXS.glowSel, default .bf-tgt,.glow,[data-legal]) responds to a real tap.
   Universal asserts the runner adds to every scenario: no page error, no horizontal scroll, the Test tag shows, the board/game fills the screen. */
(function () {
  var q = new URLSearchParams(location.search), id = q.get('scn');
  var S = window.GXS = { defs: [], on: !!id, id: id };
  try { S.realLS = window.localStorage; } catch (e) { }   // the player's real storage (a scenario swaps window.localStorage for a private one): the LAB (gx-lab.js) keeps its results here
  S.add = function (d) { S.defs.push(d); };
  S.known = [];   // known findings a game lists on purpose: {re: /message/, why: 'owner-listed in HANDOFF.md'}; they are not hidden, scenario-test prints how many were skipped
  S.glowSel = '.bf-tgt,.glow,[data-legal]';
  /* group of a scenario for the LAB menu: d.group, else guessed from id / name (Board, Cards, Story, Bosses, UI) */
  S.group = function (d) { if (d.group) return d.group; var t = (d.id + ' ' + d.name).toLowerCase();
    return /boss/.test(t) ? 'Bosses' : /story|chapter|campaign|scene|cutscene/.test(t) ? 'Story' : /zoom|card|hand|market|deck|piece|token/.test(t) ? 'Cards' : /board|start|map|table|tile|grid|island|city|dungeon/.test(t) ? 'Board' : 'UI'; };
  S.pub = function (d) { return { id: d.id, name: d.name, ask: d.ask || '', sizes: d.sizes || 'all', group: S.group(d), mut: (d.mut || []).length }; };
  if (!id) return;   // normal play: the module is inert (one small object)

  /* ---- seeded RNG (mulberry32) ---- */
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function seedRng(n) { var a = n >>> 0; Math.random = function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  S.seed = function (n) { seedRng(n); };
  seedRng(hash(id));   // until the scenario's own seed is known, the run is already deterministic

  /* ---- private storage: a scenario never reads or writes the player's saves ---- */
  var mem = {}, store = { getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; }, setItem: function (k, v) { mem[k] = String(v); }, removeItem: function (k) { delete mem[k]; }, clear: function () { mem = {}; }, key: function (i) { return Object.keys(mem)[i] || null; } };
  Object.defineProperty(store, 'length', { get: function () { return Object.keys(mem).length; } });
  try { Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { return store; } }); } catch (e) { }
  S.store = store;
  /* registration happens before the game scripts run, so the scenario's storage + seed are in place for the game's own boot */

    { say: 'Tap a gold coin. Gold keeps a jewel.', noFav: true, gold: true, allow: function (m) { return m.t === 'reserve'; } },
    { say: 'A Favour scroll takes any one gem. Tap yours.', at: '#me .favb', cells: null, allow: function (m) { return m.t === 'fav'; } },
    { say: 'Now take gems or buy. Your move!', cells: null, allow: function () { return true; } },
    { say: 'Win: 20 points, 10 crowns, or 10 in one colour.', info: 'Got it' },
    { say: 'Crowns win patrons. Stuck? The bulb shows a good move.', info: 'Play on' }
  ];
  function coach(text, btn) {
    var c = $('#coach'); if (!c) { c = document.createElement('div'); c.id = 'coach'; document.body.appendChild(c); }
    var r = $('#rival').getBoundingClientRect(); c.style.top = Math.max(46, r.top) + 'px';
    c.innerHTML = '<span class="t">' + text + '</span>' + (btn ? '<button class="btn" data-next>' + btn + '</button>' : '') + '<button class="btn" data-skip>Skip</button>';
    c.querySelector('[data-skip]').onclick = end;
    var n = c.querySelector('[data-next]'); if (n) n.onclick = function () { go(step + 1); };
  }
  function finger(sel) {
    var f = $('.finger'); if (f) f.remove(); if (!sel) return;
    var e = $(sel); if (!e) return; var r = e.getBoundingClientRect();
    f = document.createElement('div'); f.className = 'finger'; f.style.left = (r.left + r.width / 2 - 17) + 'px'; f.style.top = (r.top + r.height / 2 - 17) + 'px'; document.body.appendChild(f);
  }
  function go(i) {
    step = i; var s = STEPS[i]; if (!s) return end();
    T.cells = s.cells || null; T.card = s.card; T.noFav = !!s.noFav; T.allowStep = s.allow; fingerFor = s.at || null;
    if (s.gold) { T.cells = []; U.G.board.forEach(function (t, k) { if (t === 'o') T.cells.push(k); }); fingerFor = '.cell[data-cell="' + T.cells[0] + '"]'; }
    coach(s.say, s.info);
    UI.render();
  }
  function end() {
    var c = $('#coach'); if (c) c.remove(); finger(null); U.tut = null; UI.LS('oa_seen', '1'); UI.render();
    if (U.G && U.G.turn === 1 && !U.G.over) UI.aiTurn();
  }
  function start() {
    T = { allow: function (m) { if (/^(wild|tok|steal|royal|disc)$/.test(m.t)) return true; var ok = !T.allowStep || T.allowStep(m); if (ok && /^(take|buy|reserve)$/.test(m.t)) T.lastOk = step; return ok; },
      onMove: function (m, ev) {
        if (ev && ev.p === 1) return;   // the rival's moves never advance the lesson
        var s = STEPS[step]; if (!s || s.info) return;
        if (m.t === 'fav' && step === 4) { go(5); return; }
        if (T.lastOk === step && /^(take|buy|reserve)$/.test(m.t)) { T.lastOk = -1; T.waitRival = step + 1; }
      },
      onRender: function () {
        if (T.waitRival !== undefined && U.G.turn === 0 && !U.busy && !U.G.pend) { var n = T.waitRival; T.waitRival = undefined; go(n); return; }
        if (U.G.turn === 0 && !U.busy) finger(U.mode === 'res' && step === 3 ? '.card.glow' : U.sel.length === 3 && step === 0 ? '#takebtn' : document.querySelector('#sheet [data-buy]:not([disabled])') ? '#sheet [data-buy]' : fingerFor);
        else finger(null);
        var co = $('#coach'); if (co) co.style.visibility = (U.G.turn === 1 || U.busy) && !STEPS[step].info ? 'hidden' : 'visible';
        var c = $('#coach .t');
        if (c && step === 3 && U.mode === 'res') c.textContent = 'Now tap any jewel to keep it.';
        if (c && step === 0 && U.sel.length === 3) c.textContent = 'Tap Take.';
      } };
    UI.newGame('easy', 1, 0); U.tut = T; U.G = setup(); U.sel = []; U.mode = null;
    var t0 = document.getElementById('toast'); if (t0) t0.classList.remove('on');
    go(0);
    // the Buy button sits in a sheet: point at it when it opens
    document.addEventListener('click', function () { if (U.tut) setTimeout(function () { if (U.tut) U.tut.onRender(); }, 60); });
  }
  return { start: start, setup: setup, steps: STEPS };
})();

</script>
